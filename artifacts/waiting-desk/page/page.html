<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Waiting Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a queue rail beside one question in focus (Mac); on a phone the rail folds into a chip strip above the focus card. One send bar is pinned to the bottom. */
:root{
  --ground:#E8ECF2; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#121A2B; --ink-2:#4B5670; --rule:#D3DAE5;
  --accent:#2C47D4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FD;
  --block:#B92F27; --block-soft:#FBE6E3; --soon:#8F5500; --soon-soft:#FCEFD8; --later:#5E6883; --later-soft:#E9ECF2;
  --done:#17714A; --done-soft:#DDF2E7; --shadow:0 1px 2px rgba(18,26,43,.06),0 6px 24px rgba(18,26,43,.07);
  --repo:#C2410C;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1220; --surface:#151C2D; --surface-2:#1B2337; --ink:#E9EDF5; --ink-2:#A1ABC2; --rule:#2B3550;
  --accent:#8197FF; --accent-ink:#0D1220; --accent-soft:#222B55;
  --block:#FF8A7E; --block-soft:#3A1D22; --soon:#F3B55C; --soon-soft:#352915; --later:#A1ABC2; --later-soft:#222A3E;
  --done:#58CF94; --done-soft:#14301F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0D1220; --surface:#151C2D; --surface-2:#1B2337; --ink:#E9EDF5; --ink-2:#A1ABC2; --rule:#2B3550;
  --accent:#8197FF; --accent-ink:#0D1220; --accent-soft:#222B55;
  --block:#FF8A7E; --block-soft:#3A1D22; --soon:#F3B55C; --soon-soft:#352915; --later:#A1ABC2; --later-soft:#222A3E;
  --done:#58CF94; --done-soft:#14301F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.82em;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:14px 12px;border-bottom:1px solid var(--rule)}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.repo{display:flex;align-items:center;gap:10px;min-width:0}
.repo-mark{width:30px;height:30px;border-radius:8px;background:var(--repo);display:grid;place-items:center;color:#fff;font:700 15px/1 var(--f-display);flex:none}
.repo-name{font:700 1.15rem/1.1 var(--f-display);letter-spacing:-.01em}
.repo-sub{font-size:.8rem;color:var(--ink-2)}
.tally{margin-left:auto;display:flex;align-items:center;gap:12px}
.meter{width:120px;height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--done);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tally-text{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.tally-text b{color:var(--ink)}
.tabs{display:flex;gap:4px;margin-top:12px}
.tabs a{white-space:nowrap;font-size:.85rem;padding:6px 12px;border-radius:99px;color:var(--ink-2);text-decoration:none;font-weight:500}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sample{font-size:.75rem;color:var(--ink-2);margin-left:auto;align-self:center}
@media (max-width:560px){.sample{display:none}.top{padding-block:10px 8px}.tabs{margin-top:8px}.repo-sub{display:none}}

/* Layout */
.desk{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
@media (max-width:820px){.desk{grid-template-columns:minmax(0,1fr);gap:14px}}

/* Rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);display:flex;flex-direction:column;gap:18px}
.group h3{margin:0 0 6px;font:500 .72rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:6px}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ri{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 10px;border:1px solid transparent;border-radius:var(--r-sm);background:none;text-align:left;cursor:pointer;font-size:.9rem;line-height:1.3;transition:background .15s,border-color .15s}
.ri:hover{background:var(--surface-2)}
.ri[aria-current="true"]{background:var(--surface);border-color:var(--rule);box-shadow:var(--shadow)}
.ri .glyph{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:6px}
.ri .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ri .st{flex:none;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px}
.st.ready{background:var(--accent-soft);color:var(--accent)}
.st.sent{background:var(--done-soft);color:var(--done)}
.g-block .glyph{background:var(--block-soft);color:var(--block)}
.g-soon .glyph{background:var(--soon-soft);color:var(--soon)}
.g-later .glyph{background:var(--later-soft);color:var(--later)}
.g-sent .glyph{background:var(--done-soft);color:var(--done)}
.g-sent .ri .t{color:var(--ink-2)}
.shackle{transition:transform .45s cubic-bezier(.3,1.6,.5,1);transform-origin:16px 9px}
.unlocked .shackle{transform:translateY(-3px) rotate(28deg)}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:var(--done-soft)}100%{background:transparent}}
.others{border-top:1px solid var(--rule);padding-top:12px;font-size:.82rem;color:var(--ink-2)}
.others ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.others li{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--rule)}
.others i{width:8px;height:8px;border-radius:2px;display:inline-block}
@media (max-width:820px){
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
  .group{display:contents}.group h3{display:none}
  .group ul{flex-direction:row;gap:8px}
  .ri{width:auto;min-width:0;max-width:220px;background:var(--surface);border-color:var(--rule);white-space:nowrap}
  .ri .t{display:block;white-space:nowrap}
  .others{display:none}
}

/* Focus card */
.item{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:18px;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.85rem;color:var(--ink-2)}
.urg{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px 4px 8px;border-radius:99px}
.urg-block{background:var(--block-soft);color:var(--block)}
.urg-soon{background:var(--soon-soft);color:var(--soon)}
.urg-later{background:var(--later-soft);color:var(--later)}
.q{margin:0;font:700 clamp(1.45rem,2.6vw,1.95rem)/1.18 var(--f-display);letter-spacing:-.015em;text-wrap:balance;max-width:34ch}
.holding{margin:0;display:flex;gap:10px;align-items:flex-start;font-size:.95rem;padding:10px 14px;border-radius:var(--r-sm);background:var(--block-soft);color:var(--ink)}
.holding b{color:var(--block)}
.ctx{margin:0;max-width:65ch;color:var(--ink)}
details.more summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:.92rem;min-height:32px;display:inline-flex;align-items:center}
details.more p{margin:6px 0 0;max-width:65ch;color:var(--ink-2);font-size:.95rem}

.opts{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.opts legend{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;padding:0}
.opt{position:relative;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--surface);transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.opt label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:14px 16px 10px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px;border-radius:var(--r)}
.key{grid-row:span 3;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--rule);display:grid;place-items:center;font:500 .85rem/1 var(--f-mono);color:var(--ink-2);background:var(--surface-2);transition:all .15s}
.opt.chosen .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-weight:700;font-size:1.02rem;line-height:1.3}
.pick{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:99px;border:1.5px dashed var(--accent);color:var(--accent)}
.gl{display:grid;grid-template-columns:20px minmax(0,1fr);font-size:.93rem;line-height:1.4;color:var(--ink)}
.gl .s{font:700 1rem/1.35 var(--f-mono)}
.gl.gain .s{color:var(--done)}.gl.lose .s{color:var(--block)}
.why{grid-column:2;font-size:.88rem;color:var(--accent);margin-top:2px}
.how-btn{margin:0 16px 10px 60px;background:none;border:0;padding:4px 0;color:var(--ink-2);font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}
.how-btn svg{transition:transform .2s}
.how-btn[aria-expanded="true"] svg{transform:rotate(90deg)}
.how{margin:0 16px 14px 60px;font-size:.92rem;color:var(--ink-2);max-width:62ch}

.alt{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:500;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn kbd{font:500 .72rem/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2)}
.own textarea{width:100%;min-height:96px;border-radius:var(--r-sm);border:1.5px solid var(--rule);background:var(--surface-2);padding:12px 14px;font-size:1rem;resize:vertical}
.own textarea:focus{border-color:var(--accent);outline:none}
.own label{display:block;font-size:.85rem;font-weight:700;margin-bottom:6px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:16px}
.answer-line{font-size:.92rem;color:var(--ink-2);min-height:1.4em}
.answer-line b{color:var(--ink)}
.sent-banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r-sm);background:var(--done-soft);color:var(--done);font-weight:700;font-size:.95rem}
.keys{font-size:.78rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.keys kbd{font:500 .72rem/1 var(--f-mono);padding:2px 5px;border-radius:4px;border:1px solid var(--rule);background:var(--surface)}
@media (hover:none){.keys,.btn kbd{display:none}}
.empty{padding:48px 24px;text-align:center}
.empty h2{font:700 1.6rem/1.2 var(--f-display);margin:12px 0 6px}
.empty p{color:var(--ink-2);margin:0}

/* Send bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule)}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar-text{flex:1;min-width:0;font-size:.9rem;color:var(--ink-2)}
.bar-text b{color:var(--ink)}
.bar-text small{display:block;font-size:.78rem}
.send{min-height:52px;padding:0 24px;font-size:1rem;position:relative;overflow:hidden}
.send:disabled{opacity:.45;cursor:not-allowed;filter:none}
.send.sending::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--accent-ink);animation:fill .7s ease-in forwards}
@keyframes fill{from{width:0}to{width:100%}}

/* Receipt */
.receipt{position:fixed;z-index:9;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;
  width:min(460px,calc(100% - 32px));background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.22);padding:20px;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .25s}
.receipt.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.rc-head{display:flex;gap:14px;align-items:center}
.tick{width:44px;height:44px;flex:none;border-radius:50%;background:var(--done-soft);display:grid;place-items:center}
.tick path{stroke:var(--done);stroke-dasharray:30;stroke-dashoffset:30}
.receipt.show .tick path{animation:draw .5s .25s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rc-title{font:700 1.15rem/1.2 var(--f-display)}
.rc-sub{font-size:.85rem;color:var(--ink-2)}
.rc-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.rc-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:.88rem}
.rc-list .who{min-width:0}
.rc-list .who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-list .who span{color:var(--ink-2)}
.dstate{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;background:var(--later-soft);color:var(--later);transition:background .3s,color .3s}
.dstate.read{background:var(--accent-soft);color:var(--accent)}
.dstate.moving{background:var(--done-soft);color:var(--done)}
.rc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.rc-foot .btn{min-height:40px}

/* Notes view */
.notes{max-width:880px;margin:24px auto 0;display:flex;flex-direction:column;gap:22px}
.notes h2{font:700 1.7rem/1.15 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.notes h3{font:700 1.15rem/1.2 var(--f-display);margin:0 0 6px}
.notes p,.notes li{max-width:68ch}
.notes p{margin:0}
.notes section{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(18px,3vw,28px)}
.notes ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--rule)}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
td.gold{background:color-mix(in srgb,var(--soon-soft) 60%,transparent)}
th.gold{color:var(--soon)}
.v{font-weight:700;white-space:nowrap}.v.y{color:var(--done)}.v.p{color:var(--soon)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

<header class="top">
 <div class="wrap">
  <div class="top-row">
   <div class="repo">
    <div class="repo-mark" id="repoMark" aria-hidden="true">B</div>
    <div><div class="repo-name" id="repoName">banchi</div><div class="repo-sub">Questions your sessions are waiting on</div></div>
   </div>
   <div class="tally" aria-live="polite">
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <div class="tally-text" id="tally"></div>
   </div>
  </div>
  <nav class="tabs" aria-label="Views">
   <a href="#desk" id="tabDesk">Questions</a>
   <a href="#notes" id="tabNotes">Design notes</a>
   <span class="sample">Sample items for the mockup</span>
  </nav>
 </div>
</header>

<main class="wrap">
 <div class="desk" id="deskView">
  <aside class="rail" id="rail" aria-label="Question queue"></aside>
  <div id="pane" style="min-width:0"></div>
 </div>
 <div class="notes" id="notesView" hidden></div>
</main>

<div class="bar" id="bar">
 <div class="bar-in">
  <div class="bar-text" id="barText"></div>
  <button class="btn primary send" id="send" type="button">Send answers</button>
 </div>
</div>

<div class="receipt" id="receipt" role="status" aria-live="polite"></div>

<script>
const $=id=>document.getElementById(id);
const rail=$('rail'),pane=$('pane'),meter=$('meter'),tally=$('tally'),barText=$('barText'),send=$('send'),receipt=$('receipt'),bar=$('bar'),deskView=$('deskView'),notesView=$('notesView'),tabDesk=$('tabDesk'),tabNotes=$('tabNotes');
const ICON={
 lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
 clock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 dot:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>',
 check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 chev:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
 spark:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>'
};
const URG={block:{label:'Blocks work',cls:'urg-block',g:'g-block',icon:'lock'},soon:{label:'Soon',cls:'urg-soon',g:'g-soon',icon:'clock'},later:{label:'Whenever',cls:'urg-later',g:'g-later',icon:'dot'}};

// Sample items. minsAgo is turned into a CDT clock time from the viewer's real now.
const ITEMS=[
 {id:'backup',urg:'block',from:'Nightly backup lane',minsAgo:134,short:'Back up sold-card photos?',
  q:'Should the nightly backup keep photos of cards that already sold?',

const REPOS=[{n:'banchi',c:'#C2410C'},{n:'q_max',c:'#0F766E'},{n:'home-app',c:'#4338CA'},{n:'mailaudit',c:'#7C5A2E'},{n:'joyous',c:'#BE185D'},{n:'degen',c:'#15803D'}];
const OTHERS=[['q_max',2],['home-app',4],['joyous',1]];

const STORE='waiting-desk-mock-v1';
let S={answers:{},sent:{},cur:null,open:{}};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&s.answers)S={...S,...s,open:{}}}catch(e){}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify({answers:S.answers,sent:S.sent,cur:S.cur}))}catch(e){}};

const NOW=Date.now();
const fmtClock=d=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZoneName:'short'}).format(d).replace(/^(\d\d:\d\d)\s?/,'$1 ');
const fmtDay=d=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric'}).format(d);
function waited(m){if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return h+' h '+(m%60)+' min';const d=Math.floor(h/24);return d+(d===1?' day':' days')}
function since(m){const d=new Date(NOW-m*60000);const same=fmtDay(d)===fmtDay(new Date(NOW));return (same?'':fmtDay(d)+', ')+fmtClock(d)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=id=>ITEMS.find(i=>i.id===id);
const order=['block','soon','later'];
const queue=()=>ITEMS.filter(i=>!S.sent[i.id]).sort((a,b)=>order.indexOf(a.urg)-order.indexOf(b.urg)||b.minsAgo-a.minsAgo);
const isReady=id=>{const a=S.answers[id];return a&&(a.t==='opt'||a.t==='none'||(a.t==='own'&&a.text.trim()))};
function answerText(it){const a=S.answers[it.id];if(!a)return '';if(a.t==='opt')return it.opts[a.i].l;if(a.t==='none')return 'None of these'+(a.text&&a.text.trim()?': '+a.text.trim():'');return a.text.trim()}

function renderRail(){
 const q=queue();let h='';
 for(const u of order){const list=q.filter(i=>i.urg===u);if(!list.length)continue;
  h+=`<div class="group ${URG[u].g}"><h3>${URG[u].label} <span>${list.length}</span></h3><ul>`+list.map(i=>`<li><button class="ri" data-go="${i.id}" ${S.cur===i.id?'aria-current="true"':''}><span class="glyph">${ICON[URG[u].icon]}</span><span class="t">${esc(i.short)}</span>${isReady(i.id)?'<span class="st ready">Ready</span>':''}</button></li>`).join('')+`</ul></div>`}
 const sent=ITEMS.filter(i=>S.sent[i.id]);
 if(sent.length)h+=`<div class="group g-sent"><h3>Sent <span>${sent.length}</span></h3><ul>`+sent.map(i=>`<li><button class="ri" data-go="${i.id}" ${S.cur===i.id?'aria-current="true"':''}><span class="glyph">${ICON.check}</span><span class="t">${esc(i.short)}</span></button></li>`).join('')+`</ul></div>`;
 h+=`<div class="others">Other repos waiting on you<ul>${OTHERS.map(([n,c])=>{const r=REPOS.find(x=>x.n===n);return `<li><i style="background:${r.c}"></i>${n} <b>${c}</b></li>`}).join('')}</ul></div>`;
 rail.innerHTML=h;
}

function renderFocus(){
 const it=byId(S.cur);
 if(!it){pane.innerHTML=`<div class="item empty">${ICON.check.replace('width="16" height="16"','width="40" height="40"')}<h2>Nothing is waiting on you</h2><p>Every session in banchi has its answer. New questions show up here.</p></div>`;return}
 const u=URG[it.urg],a=S.answers[it.id],sent=S.sent[it.id];
 const opts=it.opts.map((o,i)=>{const chosen=a&&a.t==='opt'&&a.i===i;const open=S.open[it.id+'-'+i];return `
  <div class="opt ${chosen?'chosen':''}">
   <input type="radio" name="o-${it.id}" id="o-${it.id}-${i}" value="${i}" ${chosen?'checked':''} ${sent?'disabled':''}>
   <label for="o-${it.id}-${i}">
    <span class="key">${'ABCD'[i]}</span>
    <span class="opt-head">${esc(o.l)}${i===it.pick?`<span class="pick">${ICON.spark} Claude\u2019s pick</span>`:''}</span>
    <span class="gl gain"><span class="s" aria-label="You gain">+</span><span>${esc(o.g)}</span></span>
    <span class="gl lose"><span class="s" aria-label="You lose">\u2212</span><span>${esc(o.x)}</span></span>
    ${i===it.pick?`<span class="why">Why: ${esc(it.why)}</span>`:''}
   </label>
   <button class="how-btn" type="button" data-how="${i}" aria-expanded="${!!open}" aria-controls="how-${it.id}-${i}">${ICON.chev} How it works</button>
   <p class="how" id="how-${it.id}-${i}" ${open?'':'hidden'}>${esc(o.how)}</p>
  </div>`}).join('');
 const q=queue(),idx=q.findIndex(i=>i.id===it.id),next=q.slice(idx+1).find(i=>!isReady(i.id))||q.find(i=>!isReady(i.id)&&i.id!==it.id);
 pane.innerHTML=`
 <article class="item" aria-labelledby="q-${it.id}">
  <div class="meta"><span class="urg ${u.cls}">${ICON[u.icon]} ${u.label}</span><span>From <b>${esc(it.from)}</b></span><span class="mono">Waiting ${waited(it.minsAgo)}, since ${since(it.minsAgo)}</span></div>
  <h2 class="q" id="q-${it.id}">${esc(it.q)}</h2>
  ${it.holding&&!sent?`<p class="holding">${ICON.lock}<span><b>On hold.</b> ${esc(it.holding)}</span></p>`:''}
  ${sent?`<div class="sent-banner">${ICON.check} Sent at ${sent.at}. ${esc(it.from)} has your answer.</div>`:''}
  <p class="ctx">${esc(it.ctx)}</p>
  ${it.more?`<details class="more"><summary>More context</summary><p>${esc(it.more)}</p></details>`:''}
  <fieldset class="opts"><legend>Options</legend>${opts}</fieldset>
  ${sent?'':`<div class="alt">
   <button class="btn" type="button" data-act="pick"><span>Go with Claude\u2019s pick</span><kbd>P</kbd></button>
   <button class="btn" type="button" data-act="own" aria-pressed="${a&&a.t==='own'}">Write my own<kbd>W</kbd></button>
   <button class="btn" type="button" data-act="none" aria-pressed="${a&&a.t==='none'}">None of these<kbd>N</kbd></button>
   ${a?'<button class="btn ghost" type="button" data-act="clear">Clear answer</button>':''}
  </div>
  ${a&&(a.t==='own'||a.t==='none')?`<div class="own"><label for="txt-${it.id}">${a.t==='own'?'Your answer':'What would work instead? (optional)'}</label><textarea id="txt-${it.id}" placeholder="${a.t==='own'?'Say it the way you would in chat.':'Leave blank to just send \u201cnone of these\u201d.'}">${esc(a.text||'')}</textarea></div>`:''}`}
  <div class="foot">
   <div class="answer-line" id="aline">${a?`Your answer: <b>${esc(answerText(it)||'(empty)')}</b>`:'No answer yet.'}</div>
   ${next?`<button class="btn ${isReady(it.id)?'primary':''}" type="button" data-go="${next.id}">Next question ${ICON.chev}</button>`:''}
  </div>
  <div class="keys"><span><kbd>A</kbd>\u2013<kbd>${'ABCD'[it.opts.length-1]}</kbd> choose</span><span><kbd>J</kbd> <kbd>K</kbd> next and previous</span><span><kbd>\u2318</kbd><kbd>\u21b5</kbd> send</span></div>
 </article>`;
}

function renderBar(){
 const q=queue(),ready=q.filter(i=>isReady(i.id)),blockingLeft=q.filter(i=>i.urg==='block'&&!isReady(i.id)).length;
 const total=ITEMS.length,done=Object.keys(S.sent).length;
 meter.style.width=((done+ready.length*.5)/total*100)+'%';
 tally.innerHTML=`<b>${q.length}</b> waiting${blockingLeft?`, <b style="color:var(--block)">${blockingLeft}</b> blocking`:''}`;
 barText.innerHTML=ready.length?`<b>${ready.length} ready to send.</b> ${q.length-ready.length} still open.<small>Drafts are kept on this device until you send.</small>`:(q.length?`Pick an answer to get started. <small>${blockingLeft?`${blockingLeft} ${blockingLeft===1?'question blocks':'questions block'} work right now.`:'Nothing left is blocking work.'}</small>`:`<b>All caught up.</b>`);
 send.disabled=!ready.length;send.textContent=ready.length?`Send ${ready.length} ${ready.length===1?'answer':'answers'}`:'Send answers';
}
function render(){renderRail();renderFocus();renderBar();save()}

function setAnswer(id,a){if(S.sent[id])return;if(a)S.answers[id]=a;else delete S.answers[id];render()}
function go(id){S.cur=id;render();if(matchMedia('(max-width:820px)').matches){pane.scrollIntoView({block:'start',behavior:'smooth'});const b=rail.querySelector('[aria-current="true"]');b&&b.scrollIntoView({inline:'center',block:'nearest'})}}

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const h=e.target.closest('[data-how]');if(h){const k=S.cur+'-'+h.dataset.how;S.open[k]=!S.open[k];renderFocus();return}
 const b=e.target.closest('[data-act]');if(!b)return;const it=byId(S.cur),a=S.answers[it.id];
 const act=b.dataset.act;
 if(act==='pick')setAnswer(it.id,{t:'opt',i:it.pick});
 if(act==='own')setAnswer(it.id,a&&a.t==='own'?null:{t:'own',text:''}),setTimeout(()=>{const t=document.getElementById('txt-'+it.id);t&&t.focus()});
 if(act==='none')setAnswer(it.id,a&&a.t==='none'?null:{t:'none',text:''});
 if(act==='clear')setAnswer(it.id,null);
});
document.addEventListener('change',e=>{if(e.target.matches('.opt input'))setAnswer(S.cur,{t:'opt',i:+e.target.value})});
document.addEventListener('input',e=>{if(e.target.matches('.own textarea')){S.answers[S.cur].text=e.target.value;renderRail();renderBar();save();
 const it=byId(S.cur);document.getElementById('aline').innerHTML=`Your answer: <b>${esc(answerText(it)||'(empty)')}</b>`}});
document.addEventListener('keydown',e=>{
 if(location.hash==='#notes')return;
 if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){if(!send.disabled)doSend();e.preventDefault();return}
 if(e.target.matches('textarea,input[type=text]'))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
 const it=byId(S.cur);if(!it)return;const k=e.key.toLowerCase();const q=queue();const i=q.findIndex(x=>x.id===it.id);
 if('abcd'.includes(k)&&k.length===1&&'abcd'.indexOf(k)<it.opts.length)setAnswer(it.id,{t:'opt',i:'abcd'.indexOf(k)});
 else if(k==='p')setAnswer(it.id,{t:'opt',i:it.pick});
 else if(k==='w'){e.preventDefault();pane.querySelector('[data-act="own"]')?.click()}
 else if(k==='n')pane.querySelector('[data-act="none"]')?.click();
 else if(k==='j'&&q[i+1])go(q[i+1].id);
 else if(k==='k'&&i>0)go(q[i-1].id);
});

let undoTimer,undoTick,lastBatch=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function doSend(){
 const ready=queue().filter(i=>isReady(i.id));if(!ready.length)return;
 send.classList.add('sending');send.textContent='Sending\u2026';
 // Unlock the blocking rows in the rail, one after another.
 ready.forEach((it,n)=>{const row=rail.querySelector(`[data-go="${it.id}"]`);if(!row)return;setTimeout(()=>{row.classList.add('unlocked','flash')},reduce?0:n*140)});
 setTimeout(()=>{
  const at=fmtClock(new Date());lastBatch=ready.map(i=>i.id);
  ready.forEach(i=>S.sent[i.id]={at,text:answerText(i)});
  const nextUp=queue()[0];if(nextUp&&lastBatch.includes(S.cur))S.cur=nextUp.id;
  send.classList.remove('sending');render();showReceipt(ready,at);
 },reduce?50:Math.max(700,ready.length*140+300));
}
function showReceipt(items,at){
 const unblocked=items.filter(i=>i.urg==='block').length;
 receipt.innerHTML=`<div class="rc-head"><div class="tick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <div><div class="rc-title">${items.length} ${items.length===1?'answer':'answers'} sent</div><div class="rc-sub">At ${at}.${unblocked?` ${unblocked} blocked ${unblocked===1?'lane':'lanes'} can move again.`:''}</div></div></div>
  <ul class="rc-list">${items.map(i=>`<li><span class="who"><b>${esc(i.from)}</b><span>${esc(answerText(i))}</span></span><span class="dstate" data-ds="${i.id}">Sent</span></li>`).join('')}</ul>
  <div class="rc-foot"><button class="btn" type="button" id="undo">Undo <span class="mono" id="undoN">10</span></button><button class="btn ghost" type="button" id="rcClose">Done</button></div>`;
 requestAnimationFrame(()=>receipt.classList.add('show'));
 // Mock of the session's side: each lane reads the answer, then starts work.
 items.forEach((it,n)=>{
  setTimeout(()=>{const d=receipt.querySelector(`[data-ds="${it.id}"]`);if(d){d.textContent='Read by the session';d.className='dstate read'}},1400+n*500);
  setTimeout(()=>{const d=receipt.querySelector(`[data-ds="${it.id}"]`);if(d){d.textContent=it.urg==='block'?'Unblocked, working':'Noted';d.className='dstate moving'}},2900+n*600);
 });
 let left=10;clearInterval(undoTick);undoTick=setInterval(()=>{left--;const u=document.getElementById('undoN');if(u)u.textContent=left;if(left<=0){clearInterval(undoTick);const b=document.getElementById('undo');b&&b.remove()}},1000);
 document.getElementById('undo').onclick=()=>{lastBatch.forEach(id=>delete S.sent[id]);S.cur=lastBatch[0];closeReceipt();render()};
 document.getElementById('rcClose').onclick=closeReceipt;
 clearTimeout(undoTimer);undoTimer=setTimeout(closeReceipt,14000);
}
function closeReceipt(){receipt.classList.remove('show');clearInterval(undoTick);clearTimeout(undoTimer)}
send.addEventListener('click',doSend);

function route(){const n=location.hash==='#notes';deskView.hidden=n;notesView.hidden=!n;bar.hidden=n;
 tabDesk.setAttribute('aria-current',n?'false':'page');tabNotes.setAttribute('aria-current',n?'page':'false');if(n)window.scrollTo(0,0)}
addEventListener('hashchange',route);

notesView.innerHTML=`
<section><h2>The design, in five positions</h2>
<ul>
 <li><b>One question in focus, the queue beside it.</b> On the Mac the queue is a rail on the left. On the phone the same queue folds into a strip of chips above the question. You always see how much is left, but you only read one thing at a time.</li>
 <li><b>Blocking work comes first, then the longest wait.</b> A blocking question carries a lock and a red \u201cOn hold\u201d line that says what is stuck. Urgency is shown by shape and words as well as colour.</li>
 <li><b>Gain and lose are always visible; \u201chow it works\u201d opens on a tap.</b> The trade is what you decide on, so it never hides. Mechanics are one tap away.</li>
 <li><b>Claude\u2019s pick is marked, never pre-selected.</b> A dashed badge and a one-line \u201cwhy\u201d sit on the pick, and \u201cGo with Claude\u2019s pick\u201d is one tap. Nothing is chosen for you, so a send is always your choice.</li>
 <li><b>Sending gets a reaction in two beats.</b> First, the page: the locks open one by one, and a receipt slides up with a drawn tick and a 10-second Undo. Second, the sessions: each row on the receipt moves from Sent to Read by the session to Unblocked, working. The second beat is mocked here; it needs each session to report that it picked the answer up.</li>
</ul></section>
<section><h3>Repo colours: one mark, nothing else</h3>
<p>Every repo page has the same layout, neutrals, type and status colours. A repo brings exactly one thing: its colour on the square mark in the header and on its dot in \u201cOther repos waiting on you\u201d. Red always means blocking and blue always means your selection, on every page, so your eyes learn the page once. If banchi\u2019s orange or joyous\u2019s pink leaked into buttons, the same colour would mean \u201cthis repo\u201d on one page and \u201curgent\u201d on another. That is the confusion an ADHD reader can least afford.</p></section>
<section><h3>Type and legibility</h3>
<p>Body text is Atkinson Hyperlegible Next, made by the Braille Institute so that letters like I, l and 1 never look alike. Questions use Bricolage Grotesque, a compact display face, so a question reads in one glance. Times and keys use IBM Plex Mono. Body text is 17px on every screen, lines stop at about 65 characters, and every tap target is at least 44px tall. All times show in CDT, from the viewer\u2019s own clock.</p></section>
<section><h3>How it compares</h3>
<div class="tbl"><table>
<thead><tr><th>Aspect</th><th>This mockup</th><th class="gold">Gold standard</th><th>Meets it?</th></tr></thead>
<tbody>
<tr><td>Order</td><td>Blocking first, then longest wait</td><td class="gold">Triage inboxes such as Linear\u2019s: priority, then age</td><td class="v y">Yes</td></tr>
<tr><td>Focus</td><td>One question on screen, queue visible beside it</td><td class="gold">Superhuman\u2019s one-at-a-time triage with a visible count</td><td class="v y">Yes</td></tr>
<tr><td>Detail</td><td>Gain and lose shown; mechanics on a tap</td><td class="gold">Progressive disclosure: show what the choice turns on, hide the rest (Nielsen Norman Group)</td><td class="v y">Yes</td></tr>
<tr><td>Claude\u2019s pick</td><td>Marked with a reason, one tap, not pre-selected</td><td class="gold">A recommended default that the person still confirms (default-effect research)</td><td class="v y">Yes</td></tr>
<tr><td>Reaction on send</td><td>Unlock animation, receipt, Undo; per-session read state</td><td class="gold">Delivery states as in messaging apps (sent, read, acted on) plus Gmail-style undo send</td><td class="v p">Partly: read state is mocked</td></tr>
<tr><td>Drafts</td><td>Kept on this device until sent</td><td class="gold">Autosave that follows you across devices</td><td class="v p">Partly: one device only</td></tr>
<tr><td>Tap targets</td><td>44px or more</td><td class="gold">Apple HIG 44pt; WCAG 2.2 target size 2.5.5 (44px)</td><td class="v y">Yes</td></tr>
<tr><td>Contrast</td><td>Tokens chosen for 4.5:1 body text in both themes</td><td class="gold">WCAG 2.2 AA, 1.4.3 (4.5:1)</td><td class="v p">Unmeasured: not run through a checker</td></tr>
<tr><td>Keyboard</td><td>A\u2013D, P, W, N, J and K, \u2318\u21b5 to send</td><td class="gold">Gmail and Superhuman single-key triage</td><td class="v y">Yes, on the Mac</td></tr>
<tr><td>Repo identity</td><td>One colour mark per repo; system colours shared</td><td class="gold">One design system with a brand accent only on identity (GitHub org avatars, Linear team colours)</td><td class="v y">Yes</td></tr>
<tr><td>Motion</td><td>Two short moments, off under reduced motion</td><td class="gold">Motion only where it confirms an action; honours prefers-reduced-motion</td><td class="v y">Yes</td></tr>
</tbody></table></div></section>
<section><h3>What this mockup does not do</h3>
<ul><li>It sends nothing. The answers stay on this device, and the \u201cread by the session\u201d states are timed fakes.</li>
