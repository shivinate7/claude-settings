<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Waiting Page Final</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@700;800&family=Newsreader:opsz,wght@6..72,600&family=IBM+Plex+Sans:wght@600&display=swap">
<style>
/* Layout: one stable list, sorted by what waiting costs. A coloured repo header and a tinted ground carry
   the repo; a slim index rail sits beside the list on wide screens. Nothing moves when you answer. */
:root {
  /* Fixed neutrals and state colours: the same on every repo. */
  --surface: #ffffff; --ink: #161b22; --muted: #565f6b; --faint: #7d8691; --line: #d9dee5; --chip: #eef1f4;
  --holds: var(--r-holds-l, #b3261e); --on-holds: var(--r-on-holds-l, #ffffff); --holds-soft: #fbe7e4; --due: var(--r-due-l, #8a5300); --due-soft: #fbefd9; --calm: #56606e; --calm-soft: #e9ecf1;
  --good: var(--r-good-l, #1d7445); --good-soft: #e0f2e7; --gold-soft: #fbf3d6; --gold-ink: #6b5000;
  /* Repo tokens: set from one brand colour by the script, each checked for contrast. */
  --ground: var(--r-ground-l, #f3f4f6); --hdr: var(--r-hdr-l, #4b5a6b); --on-hdr: var(--r-on-hdr-l, #ffffff);
  --acc: var(--r-ink-l, #4b5a6b); --on-acc: #ffffff; --acc-soft: var(--r-soft-l, #eceff3);
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --wm: system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface: #191e26; --ink: #e8ecf1; --muted: #a3adba; --faint: #747f8c; --line: #2c3440; --chip: #222a35;
  --holds: var(--r-holds-d, #ff8b7f); --on-holds: var(--r-on-holds-d, #11151b); --holds-soft: #3a1a1a; --due: var(--r-due-d, #f2b55c); --due-soft: #35270f; --calm: #a3adba; --calm-soft: #232b36;
  --good: var(--r-good-d, #6fcf98); --good-soft: #15301f; --gold-soft: #2f2a14; --gold-ink: #ecd37a;
  --ground: var(--r-ground-d, #11151b); --hdr: var(--r-hdr-d, #2b3440); --on-hdr: var(--r-on-hdr-d, #ffffff);
  --acc: var(--r-ink-d, #9fb0c2); --on-acc: #11151b; --acc-soft: var(--r-soft-d, #222a35); color-scheme: dark } }
:root[data-theme="dark"] {
  --surface: #191e26; --ink: #e8ecf1; --muted: #a3adba; --faint: #747f8c; --line: #2c3440; --chip: #222a35;
  --holds: var(--r-holds-d, #ff8b7f); --on-holds: var(--r-on-holds-d, #11151b); --holds-soft: #3a1a1a; --due: var(--r-due-d, #f2b55c); --due-soft: #35270f; --calm: #a3adba; --calm-soft: #232b36;
  --good: var(--r-good-d, #6fcf98); --good-soft: #15301f; --gold-soft: #2f2a14; --gold-ink: #ecd37a;
  --ground: var(--r-ground-d, #11151b); --hdr: var(--r-hdr-d, #2b3440); --on-hdr: var(--r-on-hdr-d, #ffffff);
  --acc: var(--r-ink-d, #9fb0c2); --on-acc: #11151b; --acc-soft: var(--r-soft-d, #222a35); color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--hdr); }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--acc); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.in { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Mockup strip */
.strip { background: var(--surface); border-bottom: 1px solid var(--line); font-size: 14px; }
.strip .in { padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.strip .lab { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rchip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13.5px; }
.rchip i { width: 11px; height: 11px; border-radius: 3px; background: var(--sw); }
.rchip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; min-height: 34px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.strip .sp { flex: 1; }

/* Repo header: the repo's own colour, at full strength, in one band. */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 7; background: var(--hdr); color: var(--on-hdr); box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 12%, transparent); }
.hdr .in { padding-block: 6px; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.mark { flex: none; width: 28px; height: 28px; border-radius: 7px; background: var(--on-hdr); color: var(--hdr); display: grid; place-items: center; font: 800 15px/1 var(--wm); }
.who { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.who .repo { font: var(--wmw, 700) 18px/1.2 var(--wm); letter-spacing: var(--wmls, -0.01em); white-space: nowrap; }
.who .sub { font-size: 13.5px; opacity: .88; white-space: nowrap; }
/* Counts sit flat on the bar, divided by thin rules; only the glyph keeps a small light tile so the state colour reads on any repo colour. */
.tiers { display: flex; align-items: center; margin-left: auto; }
.tier-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; color: var(--on-hdr); text-decoration: none; font-size: 14px; border-left: 1px solid color-mix(in srgb, var(--on-hdr) 30%, transparent); }
.tier-chip:first-child { border-left: 0; }
.tier-chip:hover .nm { text-decoration: underline; }
.gt { flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: var(--surface); }
.gt .g.holds { width: 9px; height: 9px; }
.gt .g.due { border-left-width: 5px; border-right-width: 5px; border-bottom-width: 9px; }
.gt .g.calm { width: 9px; height: 9px; box-sizing: border-box; }
.tier-chip b { font-variant-numeric: tabular-nums; }
.tier-chip.zero { opacity: .6; }
.prog { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; border-left: 1px solid color-mix(in srgb, var(--on-hdr) 30%, transparent); }
.prog .track { width: 64px; height: 4px; border-radius: 99px; background: color-mix(in srgb, var(--on-hdr) 26%, transparent); overflow: hidden; }
.prog .fill { height: 100%; width: 0; background: var(--on-hdr); border-radius: 99px; }
@media (prefers-reduced-motion: no-preference) { .prog .fill { transition: width .4s ease; } }
@media (max-width: 760px) {
  .who .sub, .prog .track, .tier-chip .nm { display: none; }
  .tier-chip { padding: 0 8px; }
}
@media (max-width: 420px) { .prog { display: none; } }
.checked { font: 13px var(--mono); color: var(--faint); margin: 0; }

/* Shape glyphs: tier is shown by shape and word, never by colour alone. */
.g { display: inline-block; flex: none; width: 12px; height: 12px; }
.g.holds { background: var(--holds); border-radius: 2px; }
.g.due { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid var(--due); }
.g.calm { border: 2px solid var(--calm); border-radius: 50%; }
.g.done { background: var(--good); border-radius: 50%; position: relative; }
.g.done::after { content: ""; position: absolute; left: 4px; top: 1.5px; width: 3px; height: 6px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* Main grid: an index rail on wide screens, the list beside it. */
.main { padding-block: 18px 40px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; }

/* The rail is the overview: progress, then one row per tier with a numbered chip per item.
   An empty chip is open, a filled chip is ready to send, a green chip is sent. */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); display: grid; gap: 16px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.ov-prog { display: grid; gap: 8px; }
.ov-prog .big { font: 700 15px/1.3 var(--body); }
.ov-prog .sub { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--muted); }
.ov-prog .sw { width: 10px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--acc) 55%, transparent); }
.ov-head .ct { margin-left: auto; padding-left: 8px; color: var(--muted); font-weight: 600; }
.ov-prog .big b { font: 700 26px/1 var(--body); font-variant-numeric: tabular-nums; color: var(--acc); margin-right: 4px; }
.ov-prog .track { height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; display: flex; }
.ov-prog .track i { display: block; height: 100%; }
.ov-prog .track .s { background: var(--good); }
.ov-prog .track .r { background: color-mix(in srgb, var(--acc) 55%, transparent); }
.ov-tier { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-items: start; padding-top: 12px; border-top: 1px solid var(--line); }
.ov-head { display: flex; align-items: center; gap: 7px; min-height: 32px; color: var(--ink); text-decoration: none; font: 700 16px var(--body); font-variant-numeric: tabular-nums; }
.chips-n { display: flex; flex-wrap: wrap; gap: 6px; }
.nchip { min-width: 40px; height: 32px; padding: 0 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 13.5px var(--mono); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.nchip:hover { border-color: var(--acc); }
.nchip.ready { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.nchip.sent { background: var(--good-soft); border-color: transparent; color: var(--good); }
.nchip.sent::before { content: "\2713"; }
.pairchips { display: inline-flex; gap: 3px; padding: 2px; border: 1.5px dashed color-mix(in srgb, var(--acc) 60%, var(--line)); border-radius: 10px; }
.pairchips .nchip { height: 28px; min-width: 36px; }
.ov-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }
.ov-key span { display: inline-flex; align-items: center; gap: 5px; }
.ov-key i { display: inline-block; width: 14px; height: 11px; border-radius: 3px; border: 1.5px solid var(--line); }
.ov-key i.r { background: var(--acc); border-color: var(--acc); }
.ov-key i.s { background: var(--good-soft); border-color: var(--good); }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } .main > .rail { position: static; padding: 12px; gap: 10px; } .ov-tier { padding-top: 8px; } }

.list { display: grid; gap: 30px; min-width: 0; }
.tier { display: grid; gap: 12px; scroll-margin-top: 64px; }
.tier > header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.tier > header h2 { font: 700 19px/1.25 var(--body); display: flex; align-items: center; gap: 10px; }
.tier > header .ct { font: 600 13px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.tier > header p { margin: 0; color: var(--muted); font-size: 14.5px; flex-basis: 100%; }

/* Item card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 14px; scroll-margin-top: 64px; min-width: 0; }
.card.holds { border-left: 6px solid var(--holds); }
.card.due { border-left: 6px solid var(--due); }
.g.stands { border-radius: 50%; background: var(--gold-ink); }
.card.answered { background: color-mix(in srgb, var(--good-soft) 45%, var(--surface)); }
.top { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 14px; color: var(--muted); }
.top .num { font: 600 15px var(--mono); color: var(--acc); }
.mono { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 5px; border-radius: 6px; border: 1px solid var(--line); font: 700 11px/1 var(--mono); letter-spacing: .04em; color: var(--ink); background: var(--soft, transparent); }
.ov-who { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.ov-who .star { min-width: 26px; text-align: center; color: var(--gold-ink); }
.ov-who span { display: flex; align-items: center; gap: 8px; }
.title { font: 700 clamp(19px, 2vw, 22px)/1.3 var(--body); max-width: 40ch; }
.stake { margin: 0; display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 8px; font-size: 15px; }
/* The Blocking line is a solid fill, so it reads at full strength next to any repo colour. */
.stake.holds { background: var(--holds); color: var(--on-holds); font-weight: 600; }
.stake.holds .g.holds { background: var(--on-holds); }
.stake.due { background: var(--due-soft); box-shadow: inset 0 0 0 1.5px var(--due); }
.stake.due b { color: var(--due); }
.ctx { margin: 0; max-width: 70ch; white-space: pre-line; }
.ctx.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.morebtn { justify-self: start; background: none; border: 0; padding: 0; min-height: 32px; color: var(--acc); font-weight: 600; cursor: pointer; font-size: 14.5px; }
.about { margin: 0; font-size: 14px; color: var(--muted); }
.about b { color: var(--ink); font-weight: 600; }
/* Related items sit together in one frame, with one sentence on how they connect. */
.bundle { display: grid; gap: 10px; padding: 12px; border: 1.5px solid color-mix(in srgb, var(--acc) 55%, var(--line)); border-radius: 16px; background: var(--acc-soft); scroll-margin-top: 64px; }
.bundle > header { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 4px 6px 2px; align-items: start; }
.bundle > header svg { grid-row: span 2; margin-top: 2px; color: var(--acc); }
.bundle > header b { font-size: 16px; }
.bundle > header p { margin: 0; font-size: 15px; color: var(--ink); max-width: 72ch; }
.bundle .card { border-top-color: color-mix(in srgb, var(--acc) 25%, var(--line)); border-right-color: color-mix(in srgb, var(--acc) 25%, var(--line)); border-bottom-color: color-mix(in srgb, var(--acc) 25%, var(--line)); }
.inbundle { font-weight: 600; color: var(--acc); }


/* Options side by side; each card's rows line up so lose sits beside lose. */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.opt { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; }
@supports (grid-template-rows: subgrid) { .opts { grid-auto-rows: auto; } .opt { grid-row: span 4; grid-template-rows: subgrid; } }
.opt:hover { border-color: var(--faint); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:has(input:focus-visible) { outline: 2px solid var(--acc); outline-offset: 2px; }
.opt.sel { border-color: var(--acc); background: var(--acc-soft); box-shadow: inset 0 0 0 1px var(--acc); }
.opt .head { display: flex; gap: 10px; align-items: flex-start; }
.key { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 13px var(--mono); color: var(--muted); }
.opt.sel .key { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.opt .lab { font-weight: 700; line-height: 1.3; padding-top: 2px; }
.opt .how { margin: 0; font-size: 14.5px; color: var(--muted); }
.opt .tr { margin: 0; display: grid; gap: 4px; font-size: 14.5px; align-content: start; }
.opt .tr div { display: grid; grid-template-columns: 18px minmax(0, 1fr); }
.opt .tr .s { font: 600 15px/1.4 var(--mono); }
.opt .tr .gain .s { color: var(--good); }
.opt .tr .lose .s { color: var(--holds); }
.opt .pick { align-self: end; display: grid; grid-template-columns: auto 1fr; align-items: start; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--gold-soft); color: var(--ink); font-size: 14px; }
.opt .pick b { font: 700 15px/1.25 var(--body); color: var(--gold-ink); }
.opt .nopick { align-self: end; }
.alts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: var(--r); border: 1.5px solid var(--acc); background: var(--acc); color: var(--on-acc); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.alt { background: transparent; color: var(--acc); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; padding-inline: 10px; }
.btn.dash { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); font-weight: 500; }
.btn.dash[aria-pressed="true"] { border-style: solid; border-color: var(--ink); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn kbd { font: 500 11.5px var(--mono); opacity: .75; }
@media (hover: none) { .btn kbd, .keys { display: none; } }
.alts .sp { flex: 1; }
.note { display: grid; gap: 6px; }
.note label { font-size: 14px; color: var(--muted); }
.note.need label { color: var(--due); font-weight: 600; }
.note textarea { width: 100%; min-height: 60px; resize: vertical; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--ground); }
.note.need textarea { border-color: var(--due); }
ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 15px; }
.dest { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.dest b { color: var(--ink); font-weight: 600; }

/* Receipt: the card stays where it was, and shows what happened to the answer. */
.receipt { display: grid; gap: 10px; }
.receipt .line { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 15.5px; }
.receipt .line b { color: var(--good); }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.trail li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--chip); color: var(--faint); }
.trail li.on { background: var(--good-soft); color: var(--good); font-weight: 600; }
.trail li .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.receipt .sim { font: 12px var(--mono); color: var(--faint); }

.parked { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 18px; font-size: 15px; color: var(--muted); }
.parked ul { margin: 6px 0 0; padding-left: 20px; }
.keys { font-size: 13px; color: var(--faint); }
.keys kbd { font: 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); color: var(--muted); }

/* Answer bar: counts, take every pick, save every pick. */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar .in { padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.bar .st { flex: 1 1 200px; font-size: 14.5px; color: var(--muted); min-width: 0; }
.bar .st b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ready { font-size: 14.5px; color: var(--muted); }
.ready.on { color: var(--good); font-weight: 600; }
.ready.on::before { content: "\2713  "; }
.btn.send { min-height: 48px; padding-inline: 22px; }
.sent { background: var(--surface); border-top: 1px solid var(--line); }
.sent .in { padding-block: 14px; display: grid; gap: 10px; font-size: 15px; }
.sent-head { display: flex; gap: 14px; align-items: center; }

border-radius: var(--r); border: 1.5px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }\n.btn.alt { background: transparent; color: var(--accent); }\n.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; padding-inline: 10px; }\n.btn:disabled { opacity: .45; cursor: default; }\n.spacer { flex: 1; }\n.dest { font-size: 14px; color: var(--muted); margin: 0; border-top: 1px solid var(--line); padding-top: 14px; }\n.dest b { color: var(--ink); font-weight: 600; }\n.saved { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 16px; border-radius: var(--r); background: var(--good-soft); color: var(--ink); font-size: 15px; }\n.saved b { color: var(--good); }\n.hint { font-size: 13px; color: var(--faint); margin: 12px 4px 0; }\n.hint kbd { font: 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--surface); }\n@media (hover: none) { .hint { display: none; } }\n.clear { text-align: center; padding: 56px 20px; display: grid; gap: 8px; justify-items: center; }\n.clear h1 { font-size: 24px; margin: 0; }\n.clear p { margin: 0; color: var(--muted); max-width: 44ch; }\n\n/* List view */\n.list { display: grid; gap: 10px; }\n.lrow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 12px; }\n.lrow .n { font: 500 14px var(--mono); color: var(--muted); padding-top: 2px; }\n.lrow .t { font-weight: 600; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); }\n.lrow .t:hover { text-decoration: underline; }\n.lrow .sub { grid-column: 2; font-size: 14px; color: var(--muted); }\n.lrow .chips { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }\n.chip { min-height: 40px; padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; text-align: left; }\n.chip.pick { border-color: var(--accent); color: var(--accent); font-weight: 600; }\n.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }\n.lrow.done { opacity: .6; }\n.lhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 4px; }\n.lhead h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }\n\n.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-size: 15px; display: flex; gap: 14px; align-items: center; z-index: 20; max-width: calc(100% - 32px); }\n.toast button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 600; min-height: 32px; }\n\n/* Notes view */\n.notes { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; display: grid; gap: 28px; }\n.notes h1 { font-size: 30px; line-height: 1.2; margin: 0; text-wrap: balance; }\n.notes h2 { font-size: 21px; margin: 0 0 8px; text-wrap: balance; }\n.notes p, .notes li { max-width: 68ch; }\n.notes section { display: grid; gap: 8px; }\n.notes ul, .notes ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }\n.verdict { background: var(--good-soft); border-radius: var(--r); padding: 16px 20px; }\n.verdict p { margin: 0; }\n.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }\ntable { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14.5px; line-height: 1.45; }\nth, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }\nthead th { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--bg); }\ntbody th { font-weight: 600; width: 15%; }\ntd.gold { background: var(--good-soft); }\nthead th.gold { color: var(--good); }\ntr:last-child th, tr:last-child td { border-bottom: 0; }\n.src { font-size: 14px; color: var(--muted); }\n<\/style>\n\n<div class=\"strip\"><div class=\"in\">\n  <span><b>Mockup<\/b> with sample items from Oct 26. Nothing you press here is saved.<\/span>\n  <label>Preview as repo <select id=\"repoPick\"><option>claude-settings<\/option><option>home-app<\/option><option>banchi<\/option><option>q_max<\/option><option>mailaudit<\/option><option>joyous<\/option><\/select><\/label>\n  <a href=\"#notes\" id=\"notesLink\">Design notes and comparison<\/a>\n<\/div><\/div>\n\n<div id=\"appView\">\n  <header class=\"top\"><div class=\"in\">\n    <div class=\"who\"><span class=\"eyebrow\">Waiting on you in<\/span><span class=\"repo\" id=\"repoName\">claude-settings<\/span><\/div>\n    <div class=\"progress\"><span class=\"txt\" id=\"progTxt\"><\/span><div class=\"track\"><div class=\"fill\" id=\"progFill\"><\/div><\/div><\/div>\n    <div class=\"seg\" role=\"group\" aria-label=\"View\">\n      <button type=\"button\" id=\"vFocus\" aria-pressed=\"true\">One at a time<\/button>\n      <button type=\"button\" id=\"vList\" aria-pressed=\"false\">All<\/button>\n    <\/div>\n  <\/div><\/header>\n\n  <div class=\"main\" id=\"focusView\">\n    <aside class=\"queue\"><details id=\"qd\" open><summary><span id=\"qsum\">All items<\/span><span aria-hidden=\"true\">\u25be<\/span><\/summary><div class=\"qbody\" id=\"qbody\"><\/div><\/details><\/aside>\n    <section class=\"focus\" aria-live=\"polite\"><div id=\"focusCard\"><\/div>\n      <p class=\"hint\"><kbd>A<\/kbd> <kbd>B<\/kbd> <kbd>C<\/kbd> choose \u00b7 <kbd>R<\/kbd> take my recommendation \u00b7 <kbd>Enter<\/kbd> save \u00b7 <kbd>J<\/kbd> <kbd>K<\/kbd> next and previous<\/p>\n    <\/section>\n  <\/div>\n  <div class=\"main\" id=\"listView\" hidden style=\"grid-template-columns:minmax(0,1fr);max-width:860px\"><\/div>\n<\/div>\n\n<article class=\"notes\" id=\"notesView\" hidden>\n  <p><a href=\"#\">\u2190 Back to the mockup<\/a><\/p>\n  <h1>Calm and uniform: one look in every repo<\/h1>\n  <div class=\"verdict\"><p><b>You are not cooked.<\/b> Every repo's page is the same file published from one template, and all its questions and answers live in the page's own store, not in the page. So a new look ships by changing <code>page.html<\/code> once in claude-settings and republishing it to each repo's existing link. The link stays the same, and the open items and saved answers should stay with it, since the store belongs to the artifact and not to one version of the page. Prove that with one republish of the home app's page before the others. Today only the home app has a copy, so the fix costs one republish.<\/p><\/div>\n\n  <section>\n    <h2>The direction<\/h2>\n    <p>One quiet look everywhere, with one question in front of you at a time. The repo shows only as its name, at the top and in the browser tab. Everything else, from colours to type to where the buttons sit, is the same in every repo, so the habit you build answering home-app questions works on banchi the next night.<\/p>\n  <\/section>\n\n  <section>\n    <h2>The choices, and why<\/h2>\n    <ul>\n      <li><b>One question at a time by default, with \"All\" one tap away.<\/b> A long scroll of 22 cards asks you to hold the whole pile in your head. A single question with a quiet queue beside it shows how much is left without making you read it. \"All\" stays for the nights you want to sweep through fast.<\/li>\n      <li><b>Save moves you to the next open item, with Undo.<\/b> No hunting for where you were. Undo shows at the bottom of the screen for five seconds, and Clear stays on the saved item.<\/li>\n      <li><b>\"Take my recommendation\" on each item, not one button for the whole page.<\/b> One press per item keeps each save your word for that item only, which is how the skill already reads an answer. The page-wide \"accept every pick\" moves to the All view, where you can see what it covers.<\/li>\n      <li><b>The question leads, the reference follows.<\/b> The current card opens with a number and a line of ids. Here the title is the largest text, then the context, then a muted \"About\" line that names the ids with their plain names.<\/li>\n      <li><b>Gain and lose sit side by side.<\/b> You compare options by their trade, so the trade gets two short columns. \"How it works\" is one muted line above.<\/li>\n      <li><b>One typeface: Atkinson Hyperlegible.<\/b> The Braille Institute drew it so similar letters (I, l, 1; O, 0) never blur. It has a matching mono for ids and numbers. One family is calmer than the current serif, sans and mono mix.<\/li>\n      <li><b>One accent, used only for \"you can press this\" and \"this is my pick\".<\/b> Green means saved. Amber appears only when the page needs something from you, such as a note for \"None of these\". Nothing else carries colour.<\/li>\n      <li><b>Every item says where the answer goes, how long it has waited and, for a task, how long it takes.<\/b> The data already holds <code>home<\/code>, <code>added<\/code> and <code>minutes<\/code>; the current page never shows them. Times are in CDT with the zone named.<\/li>\n      <li><b>Keys for the desk, 44-pixel targets for the phone.<\/b> A, B, C choose; R takes the recommendation; Enter saves; J and K move. On a phone the queue folds into one \"8 left\" row above the question.<\/li>\n    <\/ul>\n  <\/section>\n\n  <section>\n    <h2>Should repo colours bleed in? No.<\/h2>\n    <ul>\n      <li><b>Colour already has a job here.<\/b> It says \"my pick\", \"saved\" and \"needs your note\". A repo's brand colour would compete with those three meanings, and on a page you skim at midnight that costs you mistakes.<\/li>\n      <li><b>The habit is the product.<\/b> You answer the same kind of question in nine repos. A page that looks the same everywhere lets your hands learn it once. A themed page feels like a new tool each time.<\/li>\n      <li><b>Nine palettes in two themes means 18 contrast checks<\/b>, and a repo with no palette (home, the ops records) needs one invented for it. Uniform means one check.<\/li>\n      <li><b>The name does the identifying.<\/b> Each repo has its own link, its own browser-tab title (\"Waiting: home-app\") and its name as the largest word in the header. Try the repo picker in the strip at the top: only the name changes, and it is enough.<\/li>\n      <li><b>If you ever want a cue anyway<\/b>, a small coloured mark beside the name is the most I would allow, never in buttons or states. I would not build it until you find yourself on the wrong page.<\/li>\n    <\/ul>\n  <\/section>\n\n  <section>\n    <h2>Side by side<\/h2>\n    <div class=\"tablewrap\"><table>\n      <thead><tr><th>Aspect<\/th><th>Current template<\/th><th>This mockup<\/th><th class=\"gold\">Gold standard<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><th>Unit of attention<\/th><td>Every card on one long scroll<\/td><td>One question, queue beside it; \"All\" for a sweep<\/td><td class=\"gold\">One thing per page (GOV.UK question pages); keyboard triage one item at a time (Superhuman, Linear inbox)<\/td><\/tr>\n        <tr><th>What leads a card<\/th><td>Number, then title, then a line of ids<\/td><td>The question, then context, then a muted \"About\" line<\/td><td class=\"gold\">The question is the heading; supporting detail follows it (GOV.UK)<\/td><\/tr>\n        <tr><th>Typeface<\/th><td>Newsreader serif, Plex Sans, Plex Mono<\/td><td>Atkinson Hyperlegible Next and its Mono<\/td><td class=\"gold\">A face drawn for legibility, one family, body at 16px or more<\/td><\/tr>\n        <tr><th>Colour<\/th><td>Amber accent for links, buttons, numbers and picks<\/td><td>Blue only for pressable and \"my pick\"; green saved; amber needs you<\/td><td class=\"gold\">Accent separate from state colours; colour never the only cue (WCAG 1.4.1)<\/td><\/tr>\n        <tr><th>Repo identity<\/th><td>None: every page is titled \"Waiting on Shiv\"<\/td><td>Repo name in the header and tab; no repo colour<\/td><td class=\"gold\">Same tool everywhere; context shown by name (Slack, Linear workspaces)<\/td><\/tr>\n        <tr><th>Taking the pick<\/th><td>One page-wide \"accept every pick\", armed twice<\/td><td>\"Take my recommendation\" on each item; page-wide action only in All<\/td><td class=\"gold\">A one-key default per item, with bulk acts shown before they apply<\/td><\/tr>\n        <tr><th>After saving<\/th><td>Card stays; you scroll on<\/td><td>Next open item comes up; Undo for five seconds<\/td><td class=\"gold\">Auto-advance with undo (Gmail, Superhuman)<\/td><\/tr>\n        <tr><th>Where it goes, age, effort<\/th><td>Shows the owner only; <code>home<\/code>, <code>added<\/code>, <code>minutes<\/code> unshown<\/td><td>Shows destination, \"waiting 1 day\" and \"about 3 min\"<\/td><td class=\"gold\">Every task shows its cost before you start it<\/td><\/tr>\n        <tr><th>Times<\/th><td>Browser's local format, no zone named<\/td><td>24-hour CDT, zone named<\/td><td class=\"gold\">Your ruling, Oct 27: 24-hour US Central, zone named<\/td><\/tr>\n        <tr><th>Keyboard<\/th><td>Tab only<\/td><td>A\u2013C, R, Enter, J, K, with a hint line on desktop<\/td><td class=\"gold\">Every frequent act has one key (Superhuman, Linear)<\/td><\/tr>\n        <tr><th>Phone<\/th><td>Fixed bottom bar takes about a sixth of the screen<\/td><td>No fixed bar; queue folds to one row; 44px targets<\/td><td class=\"gold\">Targets 44pt (Apple HIG); at least 24px (WCAG 2.5.8)<\/td><\/tr>\n        <tr><th>\"None of these\"<\/th><td>Same weight as real options<\/td><td>Dashed and muted; the note box asks for words in amber<\/td><td class=\"gold\">The escape hatch is present but quieter than the choices<\/td><\/tr>\n      <\/tbody>\n    <\/table><\/div>\n    <p class=\"src\">Sources, from published guidance: GOV.UK Design System, \"Question pages\" pattern; WCAG 2.2 success criteria 1.4.1 (use of colour) and 2.5.8 (target size, minimum); Apple Human Interface Guidelines, 44 by 44 point hit targets; Braille Institute, Atkinson Hyperlegible. The product comparisons describe how those apps work and are not measured here.<\/p>\n  <\/section>\n\n  <section>\n    <h2>What I would change in the template<\/h2>\n    <p>All of these are in <code>skills/waiting-page/page.html<\/code>. Only the first touches the data contract in <code>SKILL.md<\/code>.<\/p>\n    <ol>\n      <li>Add a <code>repo<\/code> field to <code>meta/page<\/code>. The page puts it in the header and the tab title. Without it the page cannot name its repo, because the skill says to publish the page unchanged.<\/li>\n      <li>Make \"one at a time\" the default view, with the queue, and keep a list view for sweeps.<\/li>\n      <li>Move to the next open item after a save, with a five-second Undo that does the same as Clear.<\/li>\n      <li>Add \"Take my recommendation\" to each decision. Move \"accept every pick\" into the list view and show the items it covers before it saves.<\/li>\n      <li>Show <code>home<\/code>, the age from <code>added<\/code>, and a task's <code>minutes<\/code>.<\/li>\n      <li>Format every time in America/Chicago, 24-hour, with CDT or CST.<\/li>\n      <li>Swap the three fonts for Atkinson Hyperlegible Next and Mono, at 16px body.<\/li>\n      <li>Split the accent from state: one blue for action and pick, green for saved, amber for \"needs you\".<\/li>\n      <li>Put gain and lose side by side, make \"None of these\" visibly quieter, and open the note box only on demand.<\/li>\n      <li>Add the keys, and drop the fixed bottom bar.<\/li>\n      <li>Keep \"Copy answers as one message\" in the list view. It is the recovery path when the store cannot be reached, so it must not depend on the store.<\/li>\n    <\/ol>\n    <p>The page tests in <code>skills/waiting-page/tests/<\/code> would need new cases for the auto-advance, per-item accept and CDT time format. Port to other repos: yes, by republishing to each repo's existing link, because every repo uses the same template.<\/p>\n  <\/section>\n<\/article>\n\n<div class=\"toast\" id=\"toast\" hidden><\/div>\n\n<script>\nconst ITEMS = [{\"id\": \"c60-stall-watch\", \"n\": 4, \"kind\": \"decision\", \"ref\": \"c60 (the stall watch does not cry wolf), PR #598\", \"title\": \"Stop the stall watch's false alarm on a command that writes to its own log\", \"owner\": \"Build advisor\", \"home\": \"PR #598 (draft, head 481eda6); decision stall-watch\", \"context\": \"The stall watch flagged merge.py as stuck on Oct 26 while it was working. Its output went to a log file, so the screen stayed quiet past 300 seconds. The recorded decision says the watcher never changes; quiet tools print a line every 120 seconds instead. PR #598 is built, red-first, reviewed and green.\", \"options\": [{\"key\": \"a\", \"label\": \"Merge #598 and rewrite the decision\", \"how\": \"The watcher also checks whether a log file the command names is growing (one file check a second).\", \"gain\": \"Every command that logs to a file stops raising false alarms, with no change to each tool.\", \"lose\": \"A file that something else writes could hide a real stall. Claude is unlikely to cause that by mistake.\"}, {\"key\": \"b\", \"label\": \"Keep the decision and close #598\", \"how\": \"merge.py already prints 'merge: waiting on ...'; the Mac merge hand now runs it without the redirect.\", \"gain\": \"The watcher stays simple.\", \"lose\": \"Each tool that logs to a file needs its own fix; until then it cries wolf.\"}], \"pick\": \"a\", \"why\": \"Sending output to a log is a normal way to run a long job; fixing one tool at a time leaves the alarm crying wolf elsewhere.\", \"status\": \"open\", \"added\": \"2026-10-26T09:12:00-05:00\", \"short\": \"Stall watch false alarm\", \"addedAt\": \"2026-10-26T09:12:00-05:00\"}, {\"id\": \"c53-cloud-merge\", \"n\": 5, \"kind\": \"decision\", \"ref\": \"c53 (the merge tool works from a cloud session)\", \"title\": \"Let a cloud session run merge.py for a batch\", \"owner\": \"Build advisor\", \"home\": \"roadmap step c53\", \"context\": \"merge.py now uses REST calls that work through the cloud proxy (landed in batch #603). It has never run live from the cloud. Your instructions say the Mac merge hand merges until c53 works, and the build advisor reads that as not yet granted. Until you answer, every batch waits for the Mac.\", \"options\": [{\"key\": \"a\", \"label\": \"Yes: the next batch merges from the cloud, the Mac stays as fallback\", \"how\": \"The build advisor runs merge.py from a cloud thread for the next green batch; if it fails, the Mac merge hand merges it.\", \"gain\": \"Merges stop depending on your Mac being awake.\", \"lose\": \"The first live run might stop partway; merge.py refuses a moved head, so the risk is a retry, not a bad merge.\"}, {\"key\": \"b\", \"label\": \"Not yet: one dry run first\", \"how\": \"A cloud session runs merge.py's preview (no --confirm) on a batch and reports.\", \"gain\": \"Proof before a real merge.\", \"lose\": \"One more batch waits on the Mac.\"}], \"pick\": \"a\", \"why\": \"merge.py's own checks (green CI, unmoved head) already guard the merge, and the Mac stays as fallback.\", \"status\": \"open\", \"added\": \"2026-10-25T22:40:00-05:00\", \"short\": \"Merge batches from the cloud\", \"addedAt\": \"2026-10-25T22:40:00-05:00\"}, {\"id\": \"c44-sweep-locks\", \"n\": 6, \"kind\": \"decision\", \"ref\": \"c44 (merged work leaves no worktrees behind), PR #590\", \"title\": \"Let a mid-session cleanup sweep free its own session's locks\", \"owner\": \"Build advisor\", \"home\": \"PR #590 body, 'Parked for the owner'\", \"context\": \"The cleanup sweep can now free the calling session's own agent lock on a work tree that is clean, merged into main and quiet for 30 minutes. It ships this way (merged in batch #586). The reviewer worried that a mid-session sweep could free a still-running agent's tree under those conditions.\", \"options\": [{\"key\": \"a\", \"label\": \"Yes, keep it as built\", \"how\": \"Any sweep, mid-session or at session end, may free its own session's lock under the clean, merged, idle-30-minutes test.\", \"gain\": \"The offered fast cleanup after a merge actually cleans.\", \"lose\": \"A quiet agent's tree can go; it is clean and merged, so no work is lost.\"}, {\"key\": \"b\", \"label\": \"Only the session-end sweep\", \"how\": \"A follow-up lane limits the own-lock rule to the sweep that runs at session end.\", \"gain\": \"No tree goes while its session runs.\", \"lose\": \"Trees stay until the session ends, which is the leftover-tree problem c44 set out to fix.\"}], \"pick\": \"a\", \"why\": \"The tree must be clean and merged, so nothing can be lost; the cost is at most a rebuild of a work tree.\", \"status\": \"open\", \"added\": \"2026-10-25T16:05:00-05:00\", \"short\": \"Sweep frees its own locks\", \"addedAt\": \"2026-10-25T16:05:00-05:00\"}, {\"id\": \"c45-reply-judge\", \"n\": 7, \"kind\": \"decision\", \"ref\": \"c45 (a step handed to you says what check showed the session can't do it)\", \"title\": \"Keep the reply judge on every reply that asks you for input\", \"owner\": \"Build advisor\", \"home\": \"roadmap step c45 (closed); your Oct 13 ruling\", \"context\": \"On Oct 13 you ruled that the reply judge checks 1 turn end in 5, for cost and speed. c45 widened it: it now also checks every reply with an Input Needed item. No word of yours on that change is recorded.\", \"options\": [{\"key\": \"a\", \"label\": \"Keep the widening\", \"how\": \"Every reply that asks you something is judged, plus the 1-in-5 sample.\", \"gain\": \"The replies that cost your attention n\", \"added\": \"2026-10-26T13:48:00-05:00\", \"short\": \"Next try for phone profiling\", \"addedAt\": \"2026-10-26T13:48:00-05:00\"}, {\"id\": \"o2-cite-guard\", \"n\": 11, \"kind\": \"decision\", \"ref\": \"o2 (one layout for every repo), PR #607\", \"title\": \"Have the guard also refuse docs/decisions/... cites\", \"owner\": \"Build advisor\", \"home\": \"PR #607 body, 'Questions parked for the owner', item 1\", \"context\": \"o2 moves records under docs/. The guard refuses a cite by path to a root decisions/ or debts/ folder. After the move, a path cite into docs/decisions/ would pass unless the guard learns the new folder. This would also add a refusal in banchi and q_max, which already use docs/decisions/.\", \"options\": [{\"key\": \"a\", \"label\": \"Yes, in o2's folder-move lane\", \"how\": \"The guard refuses a path cite to docs/decisions/ too, as it does today for decisions/.\", \"gain\": \"The cite-by-id rule keeps its hold after the move.\", \"lose\": \"banchi and q_max sessions get a new refusal where they cite by path.\"}, {\"key\": \"b\", \"label\": \"No\", \"how\": \"The guard stays on root folders only.\", \"gain\": \"No new refusals.\", \"lose\": \"The rule silently stops working in claude-settings after the move.\"}], \"pick\": \"a\", \"why\": \"Without it, the move quietly switches off an existing rule.\", \"status\": \"open\", \"added\": \"2026-10-26T15:20:00-05:00\", \"short\": \"Guard refuses docs/decisions cites\", \"addedAt\": \"2026-10-26T15:20:00-05:00\"}, {\"id\": \"pr551-stale\", \"n\": 17, \"kind\": \"decision\", \"ref\": \"PR #551 (settings: if filters so idle hooks start no shell), step c19\", \"title\": \"Close the stale draft PR #551\", \"owner\": \"Build advisor\", \"home\": \"PR #551\", \"context\": \"#551 holds tests for hook filters on ste_gate and prose_judge. Step c19 is done, and your Oct 21 ruling filtered config_watch only and parked the other filters. The draft has sat open since.\", \"options\": [{\"key\": \"a\", \"la
