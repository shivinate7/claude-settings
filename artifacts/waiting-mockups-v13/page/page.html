transform: uppercase; color: var(--soon); background: var(--soon-soft); padding: 4px 6px; border-radius: 4px; }\n\n/* Top bar: repo identity, what is left, the bulk action. */\n.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }\n.top::before { content: \"\"; display: block; height: 4px; background: var(--repo); }\n.top .in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }\n.repo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }\n.repo i { width: 12px; height: 12px; border-radius: 3px; background: var(--repo); display: inline-block; }\n.left { display: flex; align-items: baseline; gap: 8px; }\n.left b { font: 800 22px/1 var(--ui); font-variant-numeric: tabular-nums; }\n.left span { color: var(--muted); font-size: 14px; }\n.prog { flex: 1 1 120px; min-width: 100px; height: 6px; background: var(--calm-soft); border-radius: 99px; overflow: hidden; }\n.prog i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }\n.tabs { display: flex; gap: 4px; }\n.tabs a { text-decoration: none; color: var(--muted); font-size: 14px; padding: 6px 10px; border-radius: 6px; }\n.tabs a[aria-current=\"page\"] { color: var(--ink); background: var(--calm-soft); font-weight: 700; }\n.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; min-height: 40px; }\n.btn:hover { border-color: var(--muted); }\n.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }\n.btn.primary:hover { filter: brightness(1.08); }\n.btn.armed { background: var(--soon-soft); border-color: var(--soon); color: var(--soon); }\n.btn:disabled { opacity: .45; cursor: default; }\nkbd { font: 600 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--sunk); color: var(--muted); }\n.btn.primary kbd { background: transparent; border-color: color-mix(in srgb, var(--accent-ink) 40%, transparent); color: var(--accent-ink); }\n.preview { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }\n.preview select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }\n\n/* The two panes. */\n.app { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height: calc(100vh - 70px); }\n.queue { border-right: 1px solid var(--line); background: var(--sunk); padding-block: 12px 120px; min-width: 0; }\n.detail { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 140px; }\n.detail > .in { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }\n\n/* Queue rows. Urgency is a shape and a word as well as a colour. */\n.group { padding: 10px 16px 4px; font: 700 12px/1.2 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }\n.row { display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; padding: 10px 16px; margin: 0 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; text-align: left; width: calc(100% - 16px); background: none; }\n.row:hover { background: var(--surface); }\n.row[aria-current=\"true\"] { background: var(--surface); border-color: var(--accent); }\n.row .n { font: 600 14px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 2; padding-top: 1px; }\n.row .t { font-weight: 700; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\n.row .m { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }\n.row.done .t { color: var(--muted); font-weight: 500; }\n.row.done .n { color: var(--good); }\n.row.arrive { animation: arrive .45s cubic-bezier(.2,.8,.2,1); }\n@keyframes arrive { from { transform: translateX(-12px); opacity: 0; } }\n.urg { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; }\n.urg::before { content: \"\"; width: 9px; height: 9px; display: inline-block; }\n.urg.blocking { color: var(--block); } .urg.blocking::before { background: var(--block); }\n.urg.soon { color: var(--soon); } .urg.soon::before { background: linear-gradient(90deg, var(--soon) 50%, transparent 50%); border: 1.5px solid var(--soon); }\n.urg.whenever { color: var(--calm); } .urg.whenever::before { border: 1.5px solid var(--calm); border-radius: 50%; }\n.kind { font: 600 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }\n\n/* The item. */\n.blocks { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); font-size: 15px; }\n.blocks.blocking { background: var(--block-soft); color: var(--ink); }\n.blocks.soon { background: var(--soon-soft); }\n.blocks.whenever { background: var(--calm-soft); }\n.blocks .urg { flex: none; padding-top: 2px; }\n.head { display: grid; gap: 6px; }\n.head .k { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; color: var(--muted); font-size: 14px; }\n.head .k .num { font: 600 15px var(--mono); color: var(--ink); }\nh1 { font: 800 clamp(24px, 3vw, 32px)/1.15 var(--ui); margin: 0; text-wrap: balance; letter-spacing: -.01em; }\n.ref { font-size: 14px; color: var(--muted); }\n.ctx { margin: 0; max-width: 72ch; white-space: pre-line; color: var(--ink); }\n.ctx.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }\n.more { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 14px; font-weight: 700; justify-self: start; }\n\n/* Options side by side. Subgrid keeps How, Gain and Lose on one line across every card. */\n.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }\n.opt { position: relative; display: grid; grid-template-rows: subgrid; grid-row: span 5; gap: 8px; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s, background-color .15s, opacity .3s, transform .15s; }\n.opt:hover { border-color: var(--muted); }\n.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }\n.opt .oh { display: flex; gap: 10px; align-items: flex-start; }\n.opt .key { flex: none; font: 600 13px/1 var(--mono); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--sunk); }\n.opt.sel .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }\n.opt .lab { font-weight: 700; font-size: 16px; line-height: 1.3; }\n.opt .rec { font: 700 11px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }\n.opt .f { font-size: 14px; line-height: 1.45; color: var(--muted); }\n.opt .f b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-bottom: 1px; }\n.opt .f.gain b { color: var(--good); } .opt .f.lose b { color: var(--block); }\n.opt .why { font-size: 14px; color: var(--ink); border-top: 1px dashed var(--line); padding-top: 8px; }\n.opt .why:empty { display: none; }\n.opts.locked .opt:not(.sel) { opacity: .4; }\n.opts.locked .opt.sel { border-color: var(--good); background: var(--good-soft); box-shadow: 0 0 0 1px var(--good); }\n.opts.locked .opt.sel .key { background: var(--good); border-color: var(--good); }\n.stamp { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; }\n.stamp circle { fill: var(--good); }\n.stamp path { fill: none; stroke: var(--surface); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .35s .12s ease-out forwards; }\n.stamp { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }\n@keyframes draw { to { stroke-dashoffset: 0; } }\n@keyframes pop { from { transform: scale(.4); opacity: 0; } }\n\n.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; max-width: 72ch; }\n.steps li::marker { font-family: var(--mono); color: var(--muted); }\n.links { display: flex; gap: 14px; flex-wrap: wrap; font-weight: 700; }\n.mins { font-size: 14px; color: var(--muted); }\n\n/* Answer bar under the options. */\n.answer { display: grid; gap: 10px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }\n.answer .r1 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }\n.answer input[type=text] { flex: 1 1 260px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); font-size: 15px; min-height: 42px; }\n.answer input.need { border-color: var(--block); }\n.answer .r2 { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }\n.none { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; }\n.none[aria-pressed=\"true\"] { color: var(--block); font-weight: 700; }\n.goes { margin-left: auto; }\n\n/* The receipt: what happened to a saved answer, step by step. */\n.receipt { display: grid; gap: 10px; padding: 14px 16px; border-radius: var(--r); background: var(--good-soft); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); }\n.receipt .rt { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; list-style: none; margin: 0; padding: 0; }\n.track li { font-size: 13px; color: var(--muted); padding-top: 10px; border-top: 3px solid var(--line); }\n.track li b { display: block; color: var(--ink); font-size: 14px; }\n.track li.on { border-top-color: var(--good); }\n.track li.on b::before { content: \"\u2713 \"; color: var(--good); }\n.sim { font-size: 12px; color: var(--faint); }\n\n/* Toast. */\n.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; width: min(560px, calc(100% - 32px)); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 12px 14px 0; display: grid; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }\n.toast .tr { display: flex; gap: 12px; align-items: center; }\n.toast .tr p { margin: 0; flex: 1; font-size: 14px; min-width: 0; }\n.toast .tr p b { font-weight: 700; }\n.toast button { background: none; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; }\n.toast .bar { height: 3px; background: color-mix(in srgb, var(--bg) 20%, transparent); margin: 0 -14px; border-radius: 0 0 10px 10px; overflow: hidden; }\n.toast .bar i { display: block; height: 100%; background: var(--good); width: 100%; }\n.toast.in { animation: up .3s cubic-bezier(.2,.8,.2,1); }\n@keyframes up { from { transform: translate(-50%, 20px); opacity: 0; } }\n\n/* Finished state. */\n.clear { display: grid; gap: 14px; justify-items: start; padding: 28px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }\n.clear h1 { font-size: 28px; }\n.clear ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }\n\n/* Shortcut sheet. */\n.keys { position: fixed; inset: 0; z-index: 50; background: rgba(10,14,22,.45); display: grid; place-items: center; padding: 16px; }\n.keys .card { background: var(--surface); border-radius: 12px; padding: 20px; width: min(440px, 100%); display: grid; gap: 10px; }\n.keys dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }\n.keys dt { display: flex; gap: 4px; }\n.keys dd { margin: 0; color: var(--muted); }\n\n/* Notes view. */\n.notes { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }\n.notes .in { max-width: 860px; margin: 0 auto; display: grid; gap: 18px; }\n.notes h1 { font-size: 30px; }\n.notes h2 { font: 800 20px/1.25 var(--ui); margin: 14px 0 0; }\n.notes p, .notes li { max-width: 70ch; }\n.notes ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }\n.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }\ntable { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }\nth, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }\nth { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }\ntd:first-child { font-weight: 700; }\ntd.gold, th.gold { background: var(--good-soft); }\ntr:last-child td { border-bottom: 0; }\n.callout { padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); }\n.callout p { margin: 0; }\n\n.back { display: none; }\n@media (max-width: 860px) {\n  .app { grid-template-columns: 1fr; }\n  .queue { border-right: 0; padding-bottom: 40px; }\n  .app[data-pane=\"detail\"] .queue, .app[data-pane=\"queue\"] .detail { display: none; }\n  .back { display: inline-flex; justify-self: start; }\n  .preview { display: none; }\n  .track { grid-template-columns: 1fr; }\n}\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }\n}\n<\/style>\n\n<header class=\"top\"><div class=\"in\">\n  <span class=\"repo\"><i><\/i><span id=\"repoName\">claude-settings<\/span><\/span>\n  <span class=\"left\"><b id=\"leftN\">7<\/b><span id=\"leftT\">waiting on you<\/span><\/span>\n  <span class=\"prog\" title=\"Answered this visit\"><i id=\"progBar\"><\/i><\/span>\n  <nav class=\"tabs\"><a href=\"#\" id=\"tabPage\">Page<\/a><a href=\"#notes\" id=\"tabNotes\">Design notes<\/a><\/nav>\n  <label class=\"preview\" for=\"repoPick\">Preview as\n    <select id=\"repoPick\">\n      <option value=\"claude-settings|#2443b8|#8ea4ff\">claude-settings<\/option>\n      <option value=\"home-app|#0e7c66|#4fd1b0\">home-app<\/option>\n      <option value=\"banchi|#b4235a|#ff86b0\">banchi<\/option>\n      <option value=\"joyous|#b06a00|#ffbf5c\">joyous<\/option>\n    <\/select>\n  <\/label>\n  <button class=\"btn\" id=\"acceptAll\" type=\"button\">Accept every pick <kbd>\u21e7P<\/kbd><\/button>\n  <button class=\"btn\" id=\"keysBtn\" type=\"button\" aria-label=\"Keyboard shortcuts\"><kbd>?<\/kbd><\/button>\n<\/div><\/header>\n\n<main class=\"app\" id=\"app\" data-pane=\"detail\">\n  <aside class=\"queue\" id=\"queue\" aria-label=\"Waiting items\"><\/aside>\n  <section class=\"detail\" id=\"detail\" aria-live=\"polite\"><div class=\"in\" id=\"detailIn\"><\/div><\/section>\n<\/main>\n\n<section class=\"notes\" id=\"notes\" hidden><div class=\"in\">\n  <span class=\"sample\" style=\"justify-self:start\">Mockup 1 of 3: decision-first<\/span>\n  <h1>Why the page looks like a triage inbox<\/h1>\n  <p>You open this page after an overnight run with a pile of items. The job is to clear the pile fast, starting with whatever is holding work up, and to know each answer landed. Every choice below serves that job. The sample items are the pilot's real items from Oct 26, with urgency and \"what it blocks\" added by hand to show the new fields.<\/p>\n\n  <h2>The choices<\/h2>\n  <ul>\n    <li><b>Sorted by what it blocks, not by number.<\/b> Each item says what is stuck until you answer (\"every batch waits for the Mac\"). Items that hold up work sit at the top. The number stays, so \"5 a\" in the thread still works.<\/li>\n    <li><b>One item at a time, with the queue beside it.<\/b> The queue gives you the whole pile at a glance. The right pane gives one question your full attention. Long context folds to three lines, so the options are on screen without scrolling.<\/li>\n    <li><b>Options side by side.<\/b> Each option is a card with the same rows: how it works, what you gain, what you lose. The rows line up across cards, so you compare \"lose\" against \"lose\" by moving your eyes sideways. The pick is marked on its card, with the reason inside it.<\/li>\n    <li><b>Keyboard first, thumb friendly.<\/b> <kbd>1<\/kbd> to <kbd>4<\/kbd> picks an option, <kbd>\u23ce<\/kbd> saves and moves to the next item, <kbd>J<\/kbd>/<kbd>K<\/kbd> moves, <kbd>Z<\/kbd> undoes. On a phone every control is 40px or more, and the queue and the item are two screens.<\/li>\n    <li><b>A visible reaction when you save.<\/b> The chosen card turns green with a stamped check, the others fade, a toast names your answer and who gets it with a six-second Undo, the item slides into \"Answered\", the counter and bar move, and the page goes to the next item. When the pile is empty you get a summary of where each answer went.<\/li>\n    <li><b>A receipt, not a promise.<\/b> Saving wakes no session today. So each answered item shows three steps: Saved, Picked up (the session read it), Filed (it reached its home and the item closed). On this mockup the last two steps are simulated with a timer.<\/li>\n    <li><b>Legibility.<\/b> Atkinson Hyperlegible, a face built to keep look-alike letters apart. Body text at 16px, lines under 72 characters, urgency shown by shape and word as well as colour, both themes tuned separately.<\/li>\n  <\/ul>\n\n  <h2>Uniform, with one repo mark<\/h2>\n  <p>Every repo gets the same page: same layout, same colours for state, same keys. Only one thing changes per repo: a 4px band and a small square in the repo's own colour, beside the repo's name. Try \"Preview as\" in the top bar to see it.<\/p>\n  <ul>\n    <li><b>Why uniform:<\/b> you move between nine pages. Red must mean \"blocks work\" and green must mean \"saved\" on all of them, or you stop trusting colour. Muscle memory for keys and button places only builds if they never move. One palette is checked for contrast once, in both themes.<\/li>\n    <li><b>Why still one mark:<\/b> with two tabs open, you need to know at a glance which repo you are answering for. A band does that without touching anything you act on.<\/li>\n    <li><b>What a repo colour may never do:<\/b> colour a button, an option, a state or text. Those stay on the shared palette.<\/li>\n  <\/ul>\n\n  <h2>Against the current template and the target<\/h2>\n  <div class=\"tw\"><table>\n    <thead><tr><th>Aspect<\/th><th>Current template<\/th><th>This mockup<\/th><th class=\"gold\">Gold standard (target)<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>Order<\/td><td>By number, decisions then tasks<\/td><td>By what it blocks, then age<\/td><td class=\"gold\">Most costly wait first, and the reason it is first is shown<\/td><\/tr>\n      <tr><td>Overview<\/td><td>Three counts, then a long scroll<\/td><td>Queue pane with every title and its urgency<\/td><td class=\"gold\">Whole pile visible in one screen, no scroll<\/td><\/tr>\n      <tr><td>Comparing options<\/td><td>Stacked rows; you read down and remember<\/td><td>Cards side by side; How, Gain, Lose rows line up<\/td><td class=\"gold\">Each trade compared without reading back<\/td><\/tr>\n      <tr><td>The pick<\/td><td>A tag on the option, the reason below all options<\/td><td>Marked on its card, the reason inside the card<\/td><td class=\"gold\">Pick and reason seen together, in one look<\/td><\/tr>\n      <tr><td>Answer speed<\/td><td>Mouse: radio, then Save, then scroll<\/td><td>Two keys per item: a number, then Enter<\/td><td class=\"gold\">One or two keystrokes per item, as in a mail triage tool<\/td><\/tr>\n      <tr><td>Reaction on save<\/td><td>Grey text: \"Saved 19:46. Goes to: \u2026\"<\/td><td>Stamp, toast with Undo, row moves, counter moves, next item opens<\/td><td class=\"gold\">You feel the save and can take it back for a few seconds<\/td><\/tr>\n      <tr><td>After save<\/td><td>Nothing until the item disappears<\/td><td>Receipt: Saved, Picked up, Filed<\/td><td class=\"gold\">You see when your answer reached its home<\/td><\/tr>\n      <tr><td>Context length<\/td><td>Full text, always open<\/td><td>Three lines, \"More\" opens the rest<\/td><td class=\"gold\">Question and options in the first screen<\/td><\/tr>\n      <tr><td>Phone<\/td><td>One column, sticky bar takes space<\/td><td>Queue and item as two screens, 40px targets<\/td><td class=\"gold\">One-thumb answers, nothing hidden behind a bar<\/td><\/tr>\n      <tr><td>Repo look<\/td><td>Same everywhere, no repo mark<\/td><td>Same everywhere, one repo band<\/td><td class=\"gold\">Shared meaning, repo still known at a glance<\/td><\/tr>\n      <tr><td>Legibility<\/td><td>15px, serif headings, mono refs<\/td><td>16px Atkinson Hyperlegible, shape plus colour<\/td><td class=\"gold\">Readable tired, at night, on a phone<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n\n  <h2>What I would change in the template<\/h2>\n  <ul>\n    <li><b>Two new optional item fields:<\/b> <span class=\"mono\">urgency<\/span> (<span class=\"mono\">blocking<\/span>, <span class=\"mono\">soon<\/span> or <span class=\"mono\">whenever<\/span>) and <span class=\"mono\">blocks<\/span> (one sentence: what waits on the answer). Old items without them sort as \"whenever\", so no page breaks.<\/li>\n    <li><b>One field a session writes on the item:<\/b> <span class=\"mono\">seen<\/span> (time the session read the answer). The page shows it as \"Picked up\". \"Filed\" is the existing close. Sessions still never write <span class=\"mono\">answers/<\/span>.<\/li>\n    <li><b>The skill:<\/b> \"Add an item\" asks for urgency and blocks. \"Read the answers\" adds one write of <span class=\"mono\">seen<\/span>.<\/li>\n    <li><b>The page:<\/b> the layout above, the keys, the save reaction with Undo (Undo is the existing Clear), and the repo band read from <span class=\"mono\">meta/page<\/span> (<span class=\"mono\">repo<\/span>, <span class=\"mono\">hue<\/span>).<\/li>\n    <li><b>Kept as is:<\/b> the item numbers, \"None of these\" with a required note, the two-press \"Accept every pick\", the copy-as-one-message fallback when the store is unreachable.<\/li>\n  <\/ul>\n\n  <h2>Is it too late?<\/h2>\n  <div class=\"callout\"><p>No. Every repo's page is the same fixed file, and all the content lives in the page's store. A new template can be republished to each existing link, so the links and the saved items stay. The data change above only adds fields, so older items still show. One check is still owed: that a republish to the same link keeps the store. I expect it does, but I have not measured it.<\/p><\/div>\n<\/div><\/section>\n\n<div id=\"toastHost\"><\/div>\n<div class=\"keys\" id=\"keys\" hidden><div class=\"card\" role=\"dialog\" aria-labelledby=\"keysT\">\n  <strong id=\"keysT\">Keyboard<\/strong>\n  <dl>\n    <dt><kbd>1<\/kbd>\u2013<kbd>4<\/kbd><\/dt><dd>Choose an option (or A to D)<\/dd>\n    <dt><kbd>P<\/kbd><\/dt><dd>Choose the recommended option<\/dd>\n    <dt><kbd>\u23ce<\/kbd><\/dt><dd>Save and go to the next item<\/dd>\n    <dt><kbd>X<\/kbd><\/dt><dd>None of these (then write what you want)<\/dd>\n    <dt><kbd>N<\/kbd><\/dt><dd>Write a note<\/dd>\n    <dt><kbd>J<\/kbd> <kbd>K<\/kbd><\/dt><dd>Next and previous item<\/dd>\n    <dt><kbd>Z<\/kbd><\/dt><dd>Undo the last save<\/dd>\n    <dt><kbd>\u21e7P<\/kbd><\/dt><dd>Accept every pick (press twice)<\/dd>\n    <dt><kbd>Esc<\/kbd><\/dt><dd>Leave a text field, close this sheet<\/dd>\n  <\/dl>\n  <button class=\"btn\" type=\"button\" id=\"keysClose\">Close<\/button>\n<\/div><\/div>\n\n<script>\n// Sample items: the pilot's real items from Oct 26, with urgency and blocks added by hand (new fields).\nconst ITEMS = [\n { id:\"c53-cloud-merge\", n:5, kind:\"decision\", urgency:\"blocking\", blocks:\"Every batch waits for your Mac to be awake to merge.\", added:\"2026-10-26T14:05:00Z\",\n   ref:\"c53, the merge tool works from a cloud session\", title:\"Let a cloud session run merge.py for a batch\", owner:\"Build advisor\", home:\"roadmap step c53\",\n   context:\"merge.py now uses REST calls that work through the cloud proxy (landed in batch #603, the October 26 batch). It has never run live from the cloud. Your instructions say the Mac merge hand merges until c53 works, and the build advisor reads that as not yet granted.\",\n   options:[\n    {key:\"a\", label:\"Yes: the next batch merges from the cloud\", how:\"The build advisor runs merge.py from a cloud thread for the next green batch. If it fails, the Mac merges it.\", gain:\"Merges stop depending on your Mac being awake.\", lose:\"The first live run might stop partway. merge.py refuses a moved head, so the risk is a retry, not a bad merge.\"},\n    {key:\"b\", label:\"Not yet: one dry run first\", how:\"A cloud session runs merge.py's preview (no --confirm) on a batch and reports.\", gain:\"Proof before a real merge.\", lose:\"One more batch waits on the Mac.\"}],\n   pick:\"a\", why:\"merge.py's own checks (green CI, unmoved head) already guard the merge, and the Mac stays as fallback.\" },\n { id:\"other-repo-rollout\", n:16, kind:\"decision\", urgency:\"blocking\", blocks:\"home-app merges are stuck until c42 lands; nine roll-out steps wait behind this.\", added:\"2026-10-26T16:20:00Z\",\n   ref:\"o13, d6, o3, r1 to r4, c33 and c42: roll-outs to your other repos\", title:\"Choose how claude-settings work rolls out to your other repos\", owner:\"Triage the roadmap\", home:\"roadmap steps o13, d6, o3, r1 to r4, c33, c42\",\n   context:\"Several ready steps change other repos: each repo's own glossary (o13), the screenshot command's config per repo (d6), shrinking long CLAUDE.md files (o3), compliance checks and token clean-ups in q_max and home-app (r1 to r4), a small CI for home (c33), and a two-line fix so home-app's merge tool finds its checks (c42).\\nThis project may not push to those repos, so local sessions do the work from briefs.\",\n   options:[\n    {key:\"a\", label:\"One visit per repo, after the layout move, c42 first\", how:\"The liaison writes one brief per repo that bundles its items. c42 goes now because it blocks home-app merges.\", gain:\"Each repo is touched once, on the new layout.\", lose:\"Most roll-outs wait for o2, the shared layout move.\"},\n    {key:\"b\", label:\"Each step as it comes\", how:\"Briefs go out step by step.\", gain:\"Earlier progress on some items.\", lose:\"Many visits per repo, and work on the old layout that o2 then moves.\"},\n    {key:\"c\", label:\"Keep all parked\", how:\"Nothing goes out.\", gain:\"No change in other repos.\", lose:\"The gaps stay, and home-app merges stay stuck.\"}],\n   pick:\"a\", why:\"o2 moves folders in every repo anyway, so bundling saves repeat visits. c42 is tiny and unblocks merges now.\" },\n { id:\"c59-idle-sessions\", n:13, kind:\"decision\", urgency:\"soon\", blocks:\"Overnight runs stop early until this lands.\", added:\"2026-10-26T15:40:00Z\",\n   ref:\"c59, no session sits idle while ready work waits\", title:\"Make sessions start the next ready item instead of waiting\", owner:\"Triage the roadmap\", home:\"roadmap step c59\",\n   context:\"Idle time is only reported after a merge. Nothing makes an orchestrator start the next ready item when a lane ends, so the queue waits for you.\\nProposed fix in three parts: (1) a global 'keep going' rule, as home-app has; (2) the final report lists ready items left unstarted, with a reason each; (3) later, only after a repeat, a check that refuses a turn end while ready work waits.\",\n   options:[\n    {key:\"a\", label:\"Parts 1 and 2 now, part 3 after a repeat\", how:\"One rule line and one report line. No new guard.\", gain:\"Work keeps moving overnight.\", lose:\"Sessions may run more lanes at once. The load brake still caps them.\"},\n    {key:\"b\", label:\"All three now\", how:\"Also add the turn-end check.\", gain:\"Hardest to slip.\", lose:\"A new guard with no incident yet, against your guard rules.\"},\n    {key:\"c\", label:\"Leave as is\", how:\"Nothing changes.\", gain:\"No change.\", lose:\"Overnight runs keep stopping early.\"}],\n   pick:\"a\", why:\"It fixes the cause with rules alone, and your guard rule asks for an incident before a new check.\" },\n { id:\"c65-gates-shoot\", n:18, kind:\"task\", urgency:\"soon\", blocks:\"GitHub does not yet enforce the new screenshot check on main.\", added:\"2026-10-26T18:10:00Z\",\n   ref:\"c65, main's branch protection requires gates-shoot\", title:\"Add gates-shoot to main's required checks in GitHub\", owner:\"Triage the roadmap\", home:\"roadmap step c65\",\n   context:\"merge.py already blocks on the new gates-shoot job. GitHub's own branch protection does not list it yet. Branch protection needs your login.\",\n   steps:[\"Open the branch settings for claude-settings.\",\"Edit the rule for main.\",\"Under required status checks, add gates-shoot. Save.\"],\n   links:[{label:\"Branch settings\", url:\"https://github.com/shivinate7/claude-settings/settings/branches\"}], minutes:\"1 min\" },\n { id:\"process-one-page\", n:1, kind:\"decision\", urgency:\"soon\", blocks:\"The waiting-page rule for every repo is drafted but not filed.\", added:\"2026-10-26T12:30:00Z\",\n   ref:\"c71, one page for everything waiting on you\", title:\"Make this page the standing place for everything waiting on you\", owner:\"Coordinator\", home:\"roadmap step c71\",\n   context:\"You asked for one place to answer what piles up after overnight runs, in all your sessions. This page reads its items from its own small store, so the link never changes. Any session that can reach claude.ai's artifact tools can add an item or read your answer.\",\n   options:[\n    {key:\"a\", label:\"One shared page per repo (this one)\", how:\"Sessions add items to this page's store. You answer here. The owning session files the answer and closes the item.\", gain:\"One link per repo, forever. Answered items drop off.\", lose:\"A save wakes no session; it is read at the session's next turn.\"},\n    {key:\"b\", label:\"A page per session, with an index\", how:\"Each session publishes its own page. This page only links them.\", gain:\"Each session owns its page.\", lose:\"Many links, and you still open each one to answer.\"},\n    {key:\"c\", label:\"A file on the roadmap branch\", how:\"Sessions commit items to a JSON file. A build step republishes the page.\", gain:\"Git history of every item.\", lose:\"Only this project can push there. Local sessions in other repos cannot.\"}],\n   pick:\"a\", why:\"It is the only option that reaches sessions in every repo with one link, and it costs no git pushes.\" },\n { id:\"pr551-stale\", n:17, kind:\"decision\", urgency:\"whenever\", blocks:\"Nothing waits. One stale draft sits in the PR list.\", added:\"2026-10-26T17:00:00Z\",\n   ref:\"PR #551, hook filters so idle hooks start no shell\", title:\"Close the stale draft PR #551\", owner:\"Build advisor\", home:\"PR #551\",\n   context:\"#551 holds tests for hook filters on two hooks. Step c19 is done, and your Oct 21 ruling filtered one hook only and parked the rest. The draft has sat open since.\",\n   options:[\n    {key:\"a\", label:\"Close it, keep the branch\", how:\"The build advisor closes #551 with a note pointing to c19's ruling.\", gain:\"One less stale draft.\", lose:\"Nothing; it can be reopened.\"},\n    {key:\"b\", label:\"Leave it open\", how:\"Nothing changes.\", gain:\"Nothing.\", lose:\"Clutter in the PR list.\"}],\n   pick:\"a\", why:\"Your own ruling parked this work.\" },\n { id:\"c40-idle-desktop\", n:22, kind:\"task\", urgency:\"whenever\", blocks:\"Idle sessions keep about 19 of 24 CPU cores busy.\", added:\"2026-10-26T19:15:00Z\",\n   ref:\"c40, idle desktop sessions each burn a full CPU core\", title:\"Archive the idle desktop sessions that spin a CPU core each\", owner:\"Triage the roadmap\", home:\"roadmap step c40\",\n   context:\"On Oct 23, 17 idle Claude Desktop sessions each used about one full core. You said you handle this one yourself. Transcripts stay when a session is archived.\",\n   steps:[\"In Claude Desktop, archive or stop sessions you are not using (most date from Oct 19 to 22).\",\"Optional: report it to Anthropic with Claude Desktop 3.1623.0.0 and claude-code 2.1.304.\"], links:[], minutes:\"5 min\" }\n];\nconst NOW = new Date(\"2026-10-27T00:45:00Z\"); // fixed so sample ages read the same for everyone\nconst RANK = { blocking: 0, soon: 1, whenever: 2 };\nconst URG_WORD = { blocking: \"Blocks work\", soon: \"Soon\", whenever: \"When you can\" };\nconst GROUPS = [[\"blocking\", \"Holding up work\"], [\"soon\", \"Soon\"], [\"whenever\", \"When you can\"]];\nconst S = { cur: null, draft: {}, answers: {}, receipts: {}, more: {}, order: [], pane: \"detail\", undo: null, armed: false, answeredOrder: [] };\nconst $ = (id) => document.getElementById(id);\nconst el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };\nconst reduce = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\nfunction cdt(d) {\n  const p = new Intl.DateTimeFormat(\"en-US\", { timeZone: \"America/Chicago\", month: \"short\", day: \"numeric\", hour: \"2-digit\", minute: \"2-digit\", hourCycle: \"h23\", timeZoneName: \"short\" }).formatToParts(d);\n  const g = (k) => (p.find((x) => x.type === k) || {}).value;\n  return g(\"month\") + \" \" + g(\"day\") + \", \" + g(\"hour\") + \":\" + g(\"minute\") + \" \" + g(\"timeZoneName\");\n}\nfunction age(iso) { const m = Math.round((NOW - new Date(iso)) / 60000); return m < 60 ? m + \" min\" : Math.round(m / 60) + \" h\"; }\nfunction sorted() { return ITEMS.slice().sort((a, b) => RANK[a.urgency] - RANK[b.urgency] || new Date(a.added) - new Date(b.added)); }\nconst open = () => sorted().filter((i) => !S.answers[i.id]);\nconst byId = (id) => ITEMS.find((i) => i.id === id);\n\nfunction renderQueue() {\n  const q = $(\"queue\"); q.replaceChildren();\n  GROUPS.forEach(([u, name]) => {\n    const items = open().filter((i) => i.urgency === u);\n    if (!items.length) return;\n    const h = el(\"div\", \"group\"); h.append(el(\"span\", null, name), el(\"span\", \"mono\", String(items.length))); q.append(h);\n    items.forEach((i) => q.append(row(i)));\n  });\n  const done = S.answeredOrder.map(byId);\n  if (done.length) {\n    const h = el(\"div\", \"group\"); h.append(el(\"span\", null, \"Answered this visit\"), el(\"span\", \"mono\", String(done.length))); q.append(h);\n    done.forEach((i, k) => q.append(row(i, k === 0 && S.justAnswered === i.id)));\n  }\n  if (!open().length && !done.length) q.append(el(\"p\", \"group\", \"Nothing here.\"));\n}\nfunction row(i, arrive) {\n  const done = !!S.answers[i.id];\n  const b = el(\"button\", \"row\" + (done ? \" done\" : \"\") + (arrive && !reduce ? \" arrive\" : \"\")); b.type = \"button\";\n  b.setAttribute(\"aria-current\", S.cur === i.id ? \"true\" : \"false\");\n  b.append(el(\"span\", \"n\", done ? \"\u2713\" : String(i.n)), el(\"span\", \"t\", i.title));\n  const m = el(\"span\", \"m\");\n  if (done) { const a = S.answers[i.id]; m.append(el(\"span\", null, (i.kind === \"task\" ? \"Done\" : \"Answer \" + (a.choice === \"none\" ? \"none of these\" : a.choice)) + \", to \" + i.owner)); }\n  else { m.append(el(\"span\", \"urg \" + i.urgency, URG_WORD[i.urgency]), el(\"span\", \"kind\", i.kind === \"task\" ? \"Tas const hx = (h) => { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
const toHex = (c) => "#" + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");

function towards(c, target, bg, min) { let x = c, i = 0; while (ratio(x, bg) < min && i < 40) { x = mix(x, target, 0.06); i++; } return x; }

/* ---------- Designs: each mockup is stored whole in this page and shown in a sandboxed frame ---------- */
const DESIGN_HTML = JSON.parse(document.getElementById("designData").textContent);
const allDesigns = () => ITEMS.filter((it) => it.designs && !S.saved[it.id]).flatMap((it) => it.designs.map((d) => ({ ...d, it })));
function frame(slug, title) {
  const f = h("iframe", { class: "dframe", title, sandbox: "allow-scripts", loading: "lazy" });
  f.srcdoc = DESIGN_HTML[slug] || "<p style='font:15px system-ui;padding:20px'>This design is missing from the page.</p>";
  return f;
}
function designPreview(it) {
  const box = h("div", { class: "dprev" }); let i = 0;
  const draw = () => {
    const d = it.designs[i];
    const bar = h("div", { class: "dbar" }, h("span", {}, d.label));
    if (it.designs.length > 1) {
      const prev = h("button", { class: "btn quiet", type: "button", "aria-label": "Previous design" }, "Prev");
      const next = h("button", { class: "btn quiet", type: "button", "aria-label": "Next design" }, "Next");
      prev.onclick = () => { i = (i + it.designs.length - 1) % it.designs.length; draw(); };
      next.onclick = () => { i = (i + 1) % it.designs.length; draw(); };
      bar.append(h("span", {}, (i + 1) + " of " + it.designs.length), prev, next);
    }
    bar.append(h("span", { class: "sp" }), h("button", { class: "btn quiet", type: "button", onclick: () => openDesign(d.slug) }, "Open full size"));
    box.replaceChildren(bar, frame(d.slug, d.label));
  };
  draw(); return box;
}
/* The full-size view is a sheet over the list. Its frames are built once and only shown or hidden, so paging never reloads a mockup and closing leaves the list where it was. */
let dList = [], dAt = 0, dFrom = null, dY = 0;
const STAGE = {};
function stageFrame(d) { if (!STAGE[d.slug]) { STAGE[d.slug] = frame(d.slug, d.label); STAGE[d.slug].removeAttribute("loading"); $("dStage").append(STAGE[d.slug]); } return STAGE[d.slug]; }
function showDesign(i) {
  dAt = (i + dList.length) % dList.length; const d = dList[dAt];
  Object.values(STAGE).forEach((f) => f.classList.add("off")); stageFrame(d).classList.remove("off");
  $("dTitle").textContent = d.label; $("dPos").textContent = (dAt + 1) + " of " + dList.length;
  $("dPrev").hidden = $("dNext").hidden = dList.length < 2;
  $("dBack").textContent = "Answer No. " + d.it.n;
}
function openDesign(slug) {
  dList = allDesigns(); if (!dList.length) return;
  dFrom = document.activeElement; dY = scrollY; document.body.classList.add("sheet-open"); $("dsheet").hidden = false;
  showDesign(Math.max(0, dList.findIndex((d) => d.slug === slug))); $("dClose").focus();
}
function closeDesign(toItem) {
  $("dsheet").hidden = true; document.body.classList.remove("sheet-open");
  if (toItem) { const c = $("item-" + toItem.id); if (c) { c.scrollIntoView({ block: "start" }); const f = c.querySelector(".opt input, button"); if (f) f.focus({ preventScroll: true }); return; } }
  window.scrollTo(0, dY);
  if (dFrom && dFrom.focus) dFrom.focus({ preventScroll: true });
}
$("dPrev").onclick = () => showDesign(dAt - 1); $("dNext").onclick = () => showDesign(dAt + 1);
$("dClose").onclick = () => closeDesign(); $("dBack").onclick = () => closeDesign(dList[dAt].it);
$("tabD").onclick = (e) => { e.preventDefault(); openDesign(""); };
$("tabQ").onclick = (e) => { e.preventDefault(); };
addEventListener("keydown", (e) => { if ($("dsheet").hidden) return; if (e.key === "Escape") closeDesign(); else if (e.key === "ArrowLeft") showDesign(dAt - 1); else if (e.key === "ArrowRight") showDesign(dAt + 1); });

function route() {
  const n = location.hash === "#notes";
  $("notesView").hidden = !n; $("pageView").hidden = n;
  $("tabQ").setAttribute("aria-current", "page");
  if (n) window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

applyRepo(); renderAll(); renderNotes(); route();
// Two sample answers, so the bar shows its working state on first load. Nothing is preselected.
S.draft["c53-cloud-merge"] = { choice: "a", auto: true }; S.draft["c48-phone-profile"] = { choice: "b", auto: false };
renderAll();
