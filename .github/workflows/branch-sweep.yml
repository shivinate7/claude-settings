name: branch-sweep

# Deletes each remote branch whose last commit is on main or on an archive/* branch, the set the owner's
# Oct 30 grant allows (actions/branch-sweep/sweep.py holds the rule). It runs with GitHub's own token, so no
# personal token exists. Lint: lint/check_branch_sweep_workflow.py. Cost: one run per push to main, no timer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two runs would delete the same branches twice and fail on the second.
concurrency:
  group: branch-sweep
  cancel-in-progress: false

jobs:
  sweep:
    # A manual run from another branch would sweep with that branch's copy of sweep.py.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The token has no pull-requests scope, so this read relies on the repo being public. A failed read stops
      # the job before any delete: a sweep that cannot see open pull requests could close one. It keeps each
      # base too: deleting the base of a stacked pull request closes that pull request.
      - name: Read the heads and bases of open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | .head.ref, .base.ref' > "$RUNNER_TEMP/open-heads.txt"

      - name: Delete the branches the Oct 30 grant allows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          # The delete step spends 2 requests a branch (tip read, DELETE) from the repo's shared hourly pool. One read
          # of the pool now, then a local count goes down; it is not a fresh read per delete. Below the reserve the
          # step stops green; the next run finishes the rest after the hourly reset, on a later push or a dispatch.
          # A budget that cannot be read stops the same way: the sweep cannot tell what is left. done counts a
          # branch only when its DELETE succeeded or its ref was already gone; a kept branch counts as left.
          reserve=$(python3 actions/branch-sweep/sweep.py --budget-reserve)
          remaining=$(gh api rate_limit --jq .resources.core.remaining 2> "$RUNNER_TEMP/budget-err.txt" < /dev/null || true)
          args=()
          while IFS= read -r head; do
            if [ -n "$head" ]; then
              args+=(--open-head="$head")
            fi
          done < "$RUNNER_TEMP/open-heads.txt"
          python3 actions/branch-sweep/sweep.py --repo . --default "$DEFAULT_BRANCH" "${args[@]}" > "$RUNNER_TEMP/verdicts.txt"
          cat "$RUNNER_TEMP/verdicts.txt"
          total=$(grep -c '^delete ' "$RUNNER_TEMP/verdicts.txt" || true)
          if ! [[ "$remaining" =~ ^[0-9]+$ ]]; then
            cat "$RUNNER_TEMP/budget-err.txt" >&2
            echo "::warning::request budget unknown; 0 deletes done, $total left. The next run deletes the rest."
            exit 0
          fi
          failed=0
          done_n=0
          while read -r verb name reason; do
            if [ "$verb" = delete ]; then
              if [ "$remaining" -lt "$reserve" ]; then
                echo "::warning::request budget $remaining is below the reserve $reserve; $done_n deletes done, $((total - done_n)) left. The next run deletes the rest."
                break
              fi
              # Spent before the tip read, so every path out of this branch has paid for both requests.
              remaining=$((remaining - 2))
              # About 60 lanes push in parallel, so a branch can gain a commit after the checkout. The verdict
              # holds for the checkout's tip, so a branch whose tip moved is kept. The read narrows the race to one
              # API call; the delete has no sha condition, so a push in that gap still loses.
              if ! want=$(git rev-parse --verify --quiet "refs/remotes/origin/$name"); then
                echo "::warning::could not read the checkout tip of $name; not deleted"
                failed=1
                continue
              fi
              if ! tip=$(gh api "repos/$REPO/git/ref/heads/$name" --jq .object.sha 2> "$RUNNER_TEMP/tip-err.txt" < /dev/null); then
                err=$(cat "$RUNNER_TEMP/tip-err.txt")
                case "$err" in
                  # The ref is already gone, so there is nothing to delete.
                  *"HTTP 404"* | *"HTTP 422"*)
                    echo "already gone: $name"
                    done_n=$((done_n + 1))
                    continue
                    ;;
                  # A refusal for rate or scope repeats on every later call, so stop. A red run on main trips
                  # the red-main brake, so this one stays green; the next run deletes the rest.
                  *"HTTP 403"* | *"HTTP 429"*)
                    echo "$err" >&2
                    echo "::warning::GitHub refused a tip read (HTTP 403 or 429); stopped at $name. The next run deletes the rest."
                    break
                    ;;
                esac
                # An unreadable tip is no proof the branch is unchanged, so it is never deleted.
                echo "$err" >&2
                echo "::warning::could not read the tip of $name; not deleted"
                failed=1
                continue
              fi
              # A tip that is not a full lowercase sha (empty, null) is a failed read, not a moved tip.
              if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::warning::the tip read of $name returned no sha; not deleted"
                failed=1
                continue
              fi
              if [ "$tip" != "$want" ]; then
                echo "tip moved since the checkout: $name (checkout $want, now $tip); kept. The next run decides again."
                continue
              fi
              if ! err=$(gh api -X DELETE "repos/$REPO/git/refs/heads/$name" 2>&1 < /dev/null); then
                case "$err" in
                  # The ref is already gone, so the delete is done.
                  *"HTTP 404"* | *"HTTP 422"*)
                    echo "already gone: $name"
                    done_n=$((done_n + 1))
                    continue
                    ;;
                  # A refusal for rate or scope repeats on every later delete, so stop. A red run on main trips
                  # the red-main brake, so this one stays green; the next run deletes the rest.
                  *"HTTP 403"* | *"HTTP 429"*)
                    echo "$err" >&2
                    echo "::warning::GitHub refused a delete (HTTP 403 or 429); stopped at $name. The next run deletes the rest."
                    break
                    ;;
                esac
                echo "$err" >&2
                echo "::warning::could not delete $name"
                failed=1
              else
                done_n=$((done_n + 1))
              fi
            fi
          done < "$RUNNER_TEMP/verdicts.txt"
          exit "$failed"
