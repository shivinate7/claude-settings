name: checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full_ste_audit:
        description: Run the STE linter over every file, report only, never fail the build.
        type: boolean
        default: false

permissions:
  contents: read

# A PR shares one group per ref, so a new push cancels the old run. Every other run gets its own
# group: GitHub keeps one pending run per group and replaces it, even without cancel-in-progress,
# so a shared group on main can leave a merged commit with no verdict. The draft state is in the
# group: `gh pr create --draft` then `gh pr ready` fires two runs, and the draft run (skips every
# job) must not cancel the ready run (decision draft-until-reviewed).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Git's auto gc runs detached and writes into a test repo's .git/objects while the test deletes it.
env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: gc.auto
  GIT_CONFIG_VALUE_0: "0"
  GIT_CONFIG_KEY_1: maintenance.auto
  GIT_CONFIG_VALUE_1: "false"

jobs:
  # Decides which jobs and suites a run needs (.github/scripts/ci-scope.sh). Every other job
  # needs it. An error in the script turns every flag on, never off. A skipped job reads as passing.
  # A draft PR skips this job, so every job that needs it skips too (decision draft-until-reviewed).
  scope:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_windows: ${{ steps.scope.outputs.checks_windows }}
      checks_windows_merge: ${{ steps.scope.outputs.checks_windows_merge }}
      checks_windows_rest: ${{ steps.scope.outputs.checks_windows_rest }}
      checks_windows_sweep: ${{ steps.scope.outputs.checks_windows_sweep }}
      checks_macos: ${{ steps.scope.outputs.checks_macos }}
      shell_macos: ${{ steps.scope.outputs.shell_macos }}
      pointer_windows: ${{ steps.scope.outputs.pointer_windows }}
      code: ${{ steps.scope.outputs.code }}
      mods: ${{ steps.scope.outputs.mods }}
      guard: ${{ steps.scope.outputs.guard }}
      checks_guard: ${{ steps.scope.outputs.checks_guard }}
      sweep: ${{ steps.scope.outputs.sweep }}
      shoot: ${{ steps.scope.outputs.shoot }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect which jobs and suites this change needs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/ci-scope.sh

  checks:
    runs-on: ubuntu-latest
    needs: scope
    # Cap 36 min. Slowest of 30 runs: 30.4 min with the guard suite, about 19.8 min without it, which moved to
    # checks-guard (decision ci-job-caps). Not lowered: 2x of 19.8 is above 36.
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Workflow supply-chain audit (zizmor)
        run: pipx run zizmor==1.30.1 .github/ actions/

      # Ruff, mypy (strict, over the .code-check.json list), ShellCheck, tsc and astro-check, from the table in
      # actions/code-check/standard.json. Fails on a tracked language with no row. No format step.
      - name: Code check
        uses: $/actions/code-check
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Action metadata loads
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 actions/test_action_metadata.py

      - name: Code-check action
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: |
          for spec in $(python3 actions/code-check/code_check.py --pins); do pipx install "$spec"; done
          npm ci --ignore-scripts --prefix actions/code-check/tools
          export PATH="$PWD/actions/code-check/tools/node_modules/.bin:$PATH"
          python3 actions/code-check/test_action.py

      - name: Ruling-kind records-dir input
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 actions/test_ruling_kind_records_dir.py

      - name: Janitor sweep fixture suite
        if: ${{ needs.scope.outputs.code == 'true' && needs.scope.outputs.sweep == 'true' }}
        run: python3 janitor/test_sweep.py

      - name: Janitor sweep mutation test
        if: ${{ needs.scope.outputs.sweep == 'true' }}
        run: python3 janitor/mutate_sweep.py

      - name: Config watch fixture suite
        run: python3 hooks/test_config_watch.py

      - name: Config watch fast-exit suite
        run: python3 hooks/test_config_watch_fast_exit.py

      - name: Shared names suite
        run: python3 hooks/test_shared_names.py

      - name: Precompact handoff fixture suite
        run: python3 hooks/test_precompact_handoff.py

      - name: Handoff wave-2 fixture suite
        run: python3 hooks/test_handoff_wave2.py

      - name: Decision watch fixture suite
        run: python3 hooks/test_decision_watch.py

      - name: Reply judge fixture suite
        run: python3 hooks/test_reply_judge.py

      - name: Prose judge fixture suite
        run: python3 hooks/test_prose_judge.py

      - name: SendMessage state fixture suite
        run: python3 hooks/test_sendmessage_state.py

      - name: Call judge fixture suite
        run: python3 hooks/test_call_judge.py

      - name: Remove-prompt answer fixture suite
        run: python3 hooks/test_rm_prompt_answer.py

      - name: Agent brief fixture suite
        run: python3 hooks/test_agent_brief.py

      - name: Blind brief fixture suite
        run: python3 hooks/test_blind_brief.py

      - name: Local time line fixture suite
        run: python3 hooks/test_local_time.py

      - name: CI wake-up fixture suite
        run: python3 hooks/test_ci_wake.py

      - name: Feedback inbox fixture suite
        run: python3 hooks/test_feedback_inbox.py

      - name: Daily note fixture suite
        run: python3 hooks/test_daily_note.py

      - name: No-window helper fixture suite
        run: python3 hooks/test_nowindow.py

      - name: Auto-mode allow entry suite
        run: python3 hooks/test_auto_mode_allow.py

      # Windows is not covered: the stall watch is posix only (see the stall-watch decision).
      - name: Stall watch fixture suite
        run: python3 hooks/test_stall_watch.py

      - name: Stall watch stop suite
        run: python3 hooks/test_stall_watch_stop.py

      - name: Simulator boot-record fixture suite
        run: python3 hooks/test_sim_boot_record.py

      - name: Guard wrappers fixture suite
        run: python3 hooks/test_wrappers.py

      - name: Session start notice suite
        run: python3 hooks/test_session_start.py

      - name: Stop-hook guard fixture suite
        run: python3 lint/test_report_guard.py

      - name: STE auto-fix fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 lint/test_ste_autofix.py

      - name: Ruling home fixture suite
        run: python3 hooks/test_ruling_home.py

      - name: Ruling census fixture suite
        run: python3 lint/test_ruling_census.py

      - name: Rule audit fixture suite
        run: python3 lint/test_rule_audit.py

      - name: Guard log report fixture suite
        run: python3 lint/test_guard_log_report.py

      - name: Verdict runner fixture suite
        run: python3 lint/test_verdict.py

      - name: Fixture copy helper suite
        run: python3 lint/test_tracked_tree.py

      - name: Debt notes union merge fixture suite
        run: python3 lint/test_notes_union_merge.py

      - name: Job runner fixture suite (bin/ci-job)
        run: python3 lint/test_ci_job.py

      - name: Rule mechanization audit
        run: python3 lint/rule_audit.py

      - name: Windows split guard
        run: python3 lint/test_windows_split.py

      - name: Scope detector fixture suite
        run: python3 lint/test_ci_scope.py

      - name: rm shim fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 lint/test_rm_shim.py

      - name: Mutation verdict fixture suite
        run: python3 hooks/test_mutate_shared.py

      - name: Mutation report-mode fixture suite
        run: python3 hooks/test_mutate_report.py

      - name: Landed-directory check fixture suite
        run: python3 lint/test_check_landed_dirs.py

      - name: Settings matcher fixture suite
        run: python3 lint/test_settings_matcher.py

      - name: Hook platform exit fixture suite
        run: python3 lint/test_hook_platform_exit.py

      - name: Hook stub fixture suite
        run: python3 lint/test_check_hook_stubs.py

      - name: Record slug fixture suite
        run: python3 lint/test_check_record_slugs.py

      - name: Copy finder fixture suite
        run: python3 lint/test_find_copies.py

      - name: Mod version fixture suite
        run: python3 lint/test_check_mod_versions.py

      - name: Hook catalog fixture suite
        run: python3 lint/test_hook_catalog.py

      - name: Hook catalog check
        run: python3 lint/hook_catalog.py --check

      - name: Hook stub check
        run: python3 lint/check_hook_stubs.py

      - name: Record slug length
        run: python3 lint/check_record_slugs.py

      # No `if:`: ci-scope.sh turns no flag on for a docs/map/*.md path, and a map page changed alone must still be read.
      # The script says why it needs no `npm ci`.
      - name: Map check
        run: bash .github/scripts/map-check.sh

      - name: Layout fixture suite
        run: python3 lint/test_layout.py

      - name: Label once fixture suite
        run: python3 lint/test_label_once.py

      - name: Repo colour fixture suite
        run: python3 lint/test_repo_colour.py

      - name: Retired repo fixture suite
        run: python3 lint/test_retired_repos.py

      - name: Waiting page staleness fixture suite
        run: python3 skills/waiting-page/test_stale_pages.py

      - name: Waiting page splice fixture suite
        run: python3 skills/waiting-page/test_splice.py

      - name: Roadmap builder fixture suite
        run: python3 skills/roadmap/test_build.py

      - name: Layout readers hold no record path
        run: python3 lint/check_layout.py

      - name: Shared resource declaration fixture suite
        run: python3 lint/test_check_shared_resources.py

      - name: Shared resource declaration check
        run: python3 lint/check_shared_resources.py

      - name: iPhone mockup check fixture suite
        run: python3 lint/test_check_ios_mockup.py

      - name: Compliance probes fixture suite
        run: python3 lint/test_compliance_probes.py

      - name: CLAUDE.md size fixture suite
        run: python3 lint/test_check_claude_md_size.py

      - name: CLAUDE.md size (warns, never fails)
        run: python3 lint/check_claude_md_size.py

      - name: Glossary fixture suite
        run: python3 lint/test_check_glossary.py

      - name: Glossary homes and avoided names
        run: python3 lint/check_glossary.py

      - name: Retired names, one word per meaning
        run: python3 lint/test_retired_names.py
      # No scope condition: the suite reads the skill's .md templates, and a .md-only change must run it too.
      - name: project-ops skill scaffold suite
        run: python3 skills/project-ops/tests/test_scaffold.py

      - name: ios-apps skill starter suite
        run: python3 skills/ios-apps/tests/test_new_app.py

      - name: Mod version bump
        run: python3 lint/check_mod_versions.py

      - name: Ruling kind fixture suite
        run: python3 lint/test_check_ruling_kind.py

      - name: Ruling kind check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 lint/check_ruling_kind.py --base "origin/$BASE_REF"

      - name: Silent undo fixture suite
        run: python3 lint/test_check_silent_undo.py

      - name: Silent undo check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 lint/check_silent_undo.py --upstream "origin/$BASE_REF" --head "$HEAD_SHA" --strict

      - name: Comment narration fixture suite
        run: python3 lint/test_check_comment_narration.py

      - name: Comment narration check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 lint/check_comment_narration.py --base "origin/$BASE_REF"

      - name: Unknown-read contract fixture suite
        run: python3 lint/test_check_unknown_reads_contract.py

      - name: Unknown-read contract (guard + session_start)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 lint/check_unknown_reads_contract.py

      - name: Landed-directory manifest agreement
        run: python3 lint/check_landed_dirs.py

      - name: Agent and skill model floor
        run: python3 lint/check_agent_models.py

      - name: Agent and skill model floor fixture suite
        run: python3 lint/test_check_agent_models.py

      - name: Skill model rows check
        run: python3 lint/check_skill_model_rows.py

      - name: Skill model rows fixture suite
        run: python3 lint/test_check_skill_model_rows.py

      - name: No-window spawn check
        run: python3 lint/test_no_window_spawn.py

      - name: PowerShell syntax check, install.ps1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }

      - name: Pointer encoding test, install.test.ps1
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: pwsh -NoProfile -File install.test.ps1

      - name: STE lint
        uses: $/actions/ste-lint
        with:
          scope: ${{ inputs.full_ste_audit && 'all' || 'changed' }}
          fail: ${{ !inputs.full_ste_audit }}

      - name: Janitor triggers fixture suite (SessionEnd hook + launchd installer)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: |
          python3 janitor/test_session_end_sweep.py
          python3 janitor/test_install_launchd.py

      - name: Janitor triggers fixture suite (schtasks installer)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_install_schtasks.py

      - name: STE lint action fixture suite
        run: python3 actions/ste-lint/test_action.py

      - name: Playwright setup action suite
        run: python3 actions/playwright-setup/test_action.py

      # Its own 4 min watchdog reads a hang red, names the hung test and prints the process tree.
      - name: Record stamp engine fixture suite
        run: node actions/stamp/test_stamp.mjs

      - name: Scanner trap lint
        run: node lint/test_scanner_traps.mjs

      - name: Record stamp action fixture suite
        shell: bash
        run: bash actions/stamp/test_action.sh

      - name: Opt-in CI template fixture suites
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: bash
        run: |
          bash actions/all-jobs-passed/test_action.sh
          bash actions/ci-alarm/test_action.sh
          python3 actions/ci-done-comment/test_comment.py
          bash actions/ruling-kind/test_action.sh
          python3 actions/readme-links/test_readme_links.py
          bash githooks/main-ref/test_hook.sh
          node --test testing/skip-locally-fail-in-ci.test.mjs

      - name: Merge launcher fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_launch.py

      - name: Merge tool git-half fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_merge.py

      - name: Merge launcher fixture suite (bin/merge)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_cmd.py

      - name: Repaired-merge counter fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_repaired_merges.py

      - name: install_from_main suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh merge/test_install_from_main.sh

      - name: install.sh checkout-detection suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh hooks/test_install_src.sh

      # Last step, so a red test here skips none of the steps above, and a red step above does not hide
      # a mod test (!cancelled() runs it anyway). The script is the one home of the mod tests and the
      # plain-english-map skill tests. The same step ends checks-windows and checks-macos. The `mods` flag
      # comes from ci-scope.sh.
      - name: Mod and map-skill tests
        if: ${{ !cancelled() && needs.scope.outputs.mods == 'true' }}
        shell: bash
        run: bash .github/scripts/mod-tests.sh

  # The guard fixture suite alone: 10.6 min slowest of 30 runs (9.8 median), so the checks job stayed under 80% of its cap
  # (decision ci-job-caps). Cap 22 min = 2x the slowest, plus setup.
  checks-guard:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Guard fixture suite
        run: python3 hooks/test_guard.py

  # The bin/shoot suite, in its own job so that a slow browser install never uses up the cap of the
  # `checks` lint job. bin/shoot needs Playwright and Chromium, and this runner has neither. The job
  # installs the copy that .github/shoot/package-lock.json pins, through actions/playwright-setup.
  # bin/shoot itself never installs either.
  checks-shoot:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
    # Cap 10 min. A green run took 18 s to 44 s over 4 runs (debt measured-time-table). The browser
    # install is the only network step, and it no longer waits on apt.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install the pinned Playwright and Chromium, no apt step
        uses: $/actions/playwright-setup
        with:
          package-dir: .github/shoot

      - name: shoot fixture suite
        shell: bash
        run: NODE_PATH="$PWD/.github/shoot/node_modules" node --test lint/test_shoot.mjs

      # The waiting page template (skill waiting-page) in the same browser. Its paths fall to the
      # all-on arm of ci-scope.sh, so a change there runs this job. A red shoot suite above
      # skips this step; it runs again once that suite is green. The merged-page cases run the
      # roadmap build and the splice (tests/merged_page.py), so the runner needs python3 and git.
      # ubuntu-latest has both; the first line fails the step at once if one goes missing.
      - name: waiting page suite
        shell: bash
        run: |
          python3 --version && git --version
          NODE_PATH="$PWD/.github/shoot/node_modules" node --test skills/waiting-page/tests/page.test.mjs

  # Windows PowerShell 5.1 is the only shell where Set-Content -Encoding UTF8 writes a BOM.
  # On pwsh 7 the pointer test cannot go red on that defect, so it also runs here.
  pointer-windows:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.pointer_windows == 'true' || github.event_name != 'pull_request' }}
    # Cap 10 min leaves room for install-set.test.ps1 on a slow runner (figures: debt measured-time-table).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pointer encoding test, Windows PowerShell 5.1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -File install.test.ps1

      - name: Install no-gap test, Windows PowerShell 5.1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-no-gap.test.ps1

      - name: Install set test, Windows PowerShell 5.1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-set.test.ps1

      - name: Memory monitor test, Windows PowerShell 5.1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/mem-monitor.test.ps1

      - name: Install bin eol test, Windows PowerShell 5.1
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        shell: powershell
        timeout-minutes: 3
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-bin-eol.test.ps1

  # /bin/bash on macOS is 3.2.57 (2007) and /var is a symlink to /private/var. The
  # checkout-detection suite, the ios-ship suite and the sim-test suite (bash 3.2 scripts for macOS) are the only checks
  # whose result depends on either. checks-macos below covers the rest of the suite, so this job stays narrow, on purpose.
  shell-macos:
    runs-on: macos-latest
    needs: scope
    if: ${{ needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request' }}
    # Cap 18 min = 2x the slowest of 30 runs (9.1 min; median 7.2), which passed 80% of the old 10 min cap
    # (decision ci-job-caps).
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report the shell this job actually runs
        run: |
          /bin/bash --version | head -n1
          command -v bash
          bash --version | head -n1
      - name: Shell syntax check, install.sh
        run: bash -n install.sh
      - name: install.sh checkout-detection suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh hooks/test_install_src.sh
      - name: install_from_main suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh merge/test_install_from_main.sh
      - name: ios-ship fixture suite (/bin/bash 3.2)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: /bin/bash lint/test_ios_ship.sh
      - name: ios-ship fixture suite (bash on PATH)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: bash lint/test_ios_ship.sh
      - name: sim-test fixture suite (/bin/bash 3.2)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: /bin/bash lint/test_sim_test.sh
      - name: sim-test fixture suite (bash on PATH)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: bash lint/test_sim_test.sh

  # The owner runs this repo on macOS. Before this job, every Python suite in the checks
  # and checks-windows jobs above proved itself only on Linux and Windows, never on a real
  # Mac, so janitor/install_launchd.py -- the one installer built for the Mac -- had no
  # macOS signal at all. This job mirrors checks-windows: same OS-touching suites, same order, and the
  # same `if: ${{ !cancelled() }}` on every step, for the reason checks-windows documents
  # above -- a job that stops at its first red step proves nothing about the suites
  # behind it.
  checks-macos:
    runs-on: macos-latest
    needs: scope
    if: ${{ needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request' }}
    # Cap 50 min = about 2x the slowest green run (figures: debt measured-time-table).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Guard fixture suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 hooks/test_guard.py

      - name: Load reader against the OS tools
