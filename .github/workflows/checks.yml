        run: bash actions/stamp/test_action.sh

  # Wakes a session that waits on this PR (decision ci-wait-reads-run-status, "The cloud wake").
  # A run with a red job sends no "all checks done" wake, so this job comments once when the run
  # ends red. It needs every other job (actions/ci-done-comment/test_comment.py checks the list).
  # !cancelled() runs it after a failed job and skips it on a superseded run. A draft runs no CI.
  ci-done:
    runs-on: ubuntu-latest
    needs:
      - scope
      - checks
      - checks-guard
      - checks-shoot
      - pointer-windows
      - shell-macos
      - checks-macos
      - checks-windows
      - checks-mutate-guard
      - checks-windows-guard
      - checks-windows-guard-2
      - checks-windows-merge
      - checks-windows-merge-2
      - checks-windows-merge-3
      - checks-windows-merge-4
      - checks-windows-merge-5
      - checks-windows-rest
      - checks-windows-sweep
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Comment when a job ended red
        uses: $/actions/ci-done-comment
        with:
          needs: ${{ toJSON(needs) }}
