        run: python3 lint/check_skill_model_rows.py

      - name: Skill model rows fixture suite
        run: python3 lint/test_check_skill_model_rows.py

      - name: Python 3.9 floor check
        run: python3 lint/check_python_floor.py

      - name: Python 3.9 floor fixture suite
        run: python3 lint/test_check_python_floor.py

      - name: No-window spawn check
        run: python3 lint/test_no_window_spawn.py

      - name: PowerShell syntax check, install.ps1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }

      - name: Pointer encoding test, install.test.ps1
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: pwsh -NoProfile -File install.test.ps1

      - name: STE lint
        uses: $/actions/ste-lint
        with:
          scope: ${{ inputs.full_ste_audit && 'all' || 'changed' }}
          fail: ${{ !inputs.full_ste_audit }}

      - name: STE lint action fixture suite
        run: python3 actions/ste-lint/test_action.py

      - name: Playwright setup action suite
        run: python3 actions/playwright-setup/test_action.py

      # The suite's own watchdog (actions/stamp/suite_watchdog.mjs) ends it at 180 s. A hang reads red,
      # with the hung test named and its process tree killed. A process the suite started and left
      # running reads red too, killed and named; so does a sweep that could not read.
      - name: Record stamp engine fixture suite
        run: node actions/stamp/test_stamp.mjs

      - name: Scanner trap lint
        run: node lint/test_scanner_traps.mjs

      - name: Record stamp action fixture suite
        shell: bash
        run: bash actions/stamp/test_action.sh

      - name: Stable workflow move job suite
        run: python3 lint/test_stable_workflow.py

      - name: Opt-in CI template fixture suites
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: bash
        run: |
          bash actions/all-jobs-passed/test_action.sh
          bash actions/ci-alarm/test_action.sh
          python3 actions/ci-alarm/test_clear_rule.py
          python3 actions/ci-done-comment/test_comment.py
          bash actions/ruling-kind/test_action.sh
          bash actions/zizmor/test_action.sh
          bash actions/silent-undo/test_action.sh
          bash actions/stable-mover/test_action.sh
          python3 actions/readme-links/test_readme_links.py
          bash githooks/main-ref/test_hook.sh
          bash githooks/test_pre_commit.sh
          node --test testing/skip-locally-fail-in-ci.test.mjs
          bash actions/push-skip/test_action.sh

      # Last step, so a red test here skips none of the steps above, and a red step above does not hide
      # a mod test (!cancelled() runs it anyway). The script is the one home of the mod tests and the
      # plain-english-map skill tests. The same step ends checks-windows and checks-macos. The `mods` flag
      # comes from ci-scope.sh.
      - name: Mod and map-skill tests
        if: ${{ !cancelled() && needs.scope.outputs.mods == 'true' }}
        shell: bash
        run: bash .github/scripts/mod-tests.sh

  # The merge tool and install suites, split off `checks` for wall time: `checks` took 33.4 min in run 41730427997 and
  # these CI steps took about 16 of them. Each keeps its own `if:`, its shell and its cap. This job has no scope condition of
  # its own, like `checks`: its suites carry the `code` flag.
  checks-merge-install:
    runs-on: ubuntu-latest
    needs: scope
    # 75 (interim, stopgap, owner 12:11 CST Nov 10; decision ci-job-caps). Newest 30 push runs on main (to run 43164094808):
    # 29 green, slowest green 26.7 min (run 43148329817); run 43164094808 attempt 1 ended at the old cap, 30.2 min, cancelled (attempt 2 was green, 25.1 min).
    # Slow steps: the install.sh checkout-detection suite (own cap below) and the Merge tool git-half fixture suite, 689 s (run 43164094808). The stopgap ends with roadmap step time-pinned-tests-go.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Janitor triggers fixture suite (SessionEnd hook + launchd installer)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: |
          python3 janitor/test_session_end_sweep.py
          python3 janitor/test_install_launchd.py

      - name: Janitor triggers fixture suite (schtasks installer)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_install_schtasks.py

      - name: Merge launcher fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_launch.py

      - name: Merge tool git-half fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_merge.py

      - name: Merge tool grant review-record fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_merge_grant.py

      - name: Merge launcher fixture suite (bin/merge)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_cmd.py

      - name: Repaired-merge counter fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_repaired_merges.py

      - name: Lane lint fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_lane_lint.py

      - name: Idle-lanes reader fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_idle_lanes.py

      - name: install_from_main suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh merge/test_install_from_main.sh

      - name: install.sh checkout-detection suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        # Own cap, 30 (interim, stopgap, owner 12:11 CST Nov 10; decision ci-job-caps). Green max 12.6 min (754 s, run 43164094808 attempt 2). Run 43164094808 attempt 1 ran this step 888 s (14.8 min) and the old job cap cut it there, so 14.8 is a floor. 30 min is about twice that floor.
        timeout-minutes: 30
        run: sh hooks/test_install_src.sh

      - name: cloud-setup.sh suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh hooks/test_cloud_setup.sh

  # The guard fixture suite, shard 1 of 2. checks-guard-2 runs shard 2; hooks/test_guard.py holds the shard switch.
  checks-guard:
    runs-on: ubuntu-latest
    needs: scope
    # provisional 60 (decision ci-job-caps, rule 6) until 5 green shard runs, then re-cap from the measured slowest shard / 0.7.
    # Both shards share one cap. The unsplit suite measured median 21.1, slowest 27.2 min (run 42682869856, attempt 1 ended at the
    # old 27 min cap; its re-run took 27.0). Per-shard time projected at about half, unmeasured.
    timeout-minutes: 60 # provisional
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      # The deny cases of rule page-item-design render a page through hooks/guard.py's checker, which needs
      # Playwright and Chromium. The same pinned copy checks-shoot installs; NODE_PATH below lets the guard's node find it.
      - name: Install the pinned Playwright and Chromium, no apt step
        if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
        uses: $/actions/playwright-setup
        with:
          package-dir: .github/shoot

      - name: Guard fixture suite (shard 1 of 2)
        if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
        env:
          NODE_PATH: ${{ github.workspace }}/.github/shoot/node_modules
          GUARD_CHROMIUM: "1"
          GUARD_SHARD: 1/2
        run: python3 hooks/test_guard.py

  # The guard fixture suite, shard 2 of 2, a copy of checks-guard (same steps, same scope flag).
  checks-guard-2:
    runs-on: ubuntu-latest
    needs: scope
    # provisional 60 (decision ci-job-caps, rule 6) until 5 green shard runs, then re-cap from the measured slowest shard / 0.7.
    # Both shards share one cap. The unsplit suite measured median 21.1, slowest 27.2 min (run 42682869856, attempt 1 ended at the
    # old 27 min cap; its re-run took 27.0). Per-shard time projected at about half, unmeasured.
    timeout-minutes: 60 # provisional
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      # The deny cases of rule page-item-design render a page through hooks/guard.py's checker, which needs
      # Playwright and Chromium. The same pinned copy checks-shoot installs; NODE_PATH below lets the guard's node find it.
      - name: Install the pinned Playwright and Chromium, no apt step
        if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
        uses: $/actions/playwright-setup
        with:
          package-dir: .github/shoot

      - name: Guard fixture suite (shard 2 of 2)
        if: ${{ needs.scope.outputs.checks_guard == 'true' || github.event_name != 'pull_request' }}
        env:
          NODE_PATH: ${{ github.workspace }}/.github/shoot/node_modules
          GUARD_CHROMIUM: "1"
          GUARD_SHARD: 2/2
        run: python3 hooks/test_guard.py

  # The bin/shoot suite, in its own job so that a slow browser install never uses up the cap of the
  # `checks` lint job. bin/shoot needs Playwright and Chromium, and this runner has neither. The job
  # installs the copy that .github/shoot/package-lock.json pins, through actions/playwright-setup.
  # bin/shoot itself never installs either.
  checks-shoot:
    runs-on: ubuntu-latest
    needs: scope
    # 30 (interim, stopgap, owner 12:11 CST Nov 10; decision ci-job-caps). The newest 29 completed push runs on main, latest attempt of each (run 42522167511 to run 43206612905):
    # 29 green, slowest 7.9 min (run 42700538152, before the waiting page suite moved out); 3.1 min or less since run 42826151332.
    # The browser install is the only network step. The stopgap ends with roadmap step time-pinned-tests-go.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      - name: Install the pinned Playwright and Chromium, no apt step
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        uses: $/actions/playwright-setup
        with:
          package-dir: .github/shoot

      - name: shoot fixture suite
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        shell: bash
        run: NODE_PATH="$PWD/.github/shoot/node_modules" node --test lint/test_shoot.mjs

      # The export suite's picture cases run check_designs.mjs in Playwright. A case that cannot run fails, so
      # this suite cannot sit in `checks`, which installs no browser. loadPlaywright reads NODE_PATH.
      - name: Waiting page export fixture suite
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        shell: bash
        run: NODE_PATH="$PWD/.github/shoot/node_modules" python3 skills/waiting-page/test_export_page.py

      - name: roadmap page suite
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        shell: bash
        run: |
          NODE_PATH="$PWD/.github/shoot/node_modules" node --test skills/roadmap/tests/page.test.mjs

  # The waiting page suite, split from checks-shoot after it ran 9.5 min there and the job hit its
  # 10 min cap (decision ci-job-caps). Same install and same scope conditions as checks-shoot.
  checks-waiting-page:
    runs-on: ubuntu-latest
    needs: scope
    # The suite split off checks-shoot. Provisional cap 60: one run so far, 12.7 min and red (run
    # 42733987294, n=1; an earlier run cut the suite inside checks-shoot at 9.5 min, runs 42708195330
    # and 42717988296). Re-measure on a green run and at 5 green runs, then set cap = slowest / 0.7,
    # rounded up (decision ci-job-caps).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        with:
          persist-credentials: false

      - name: Install the pinned Playwright and Chromium, no apt step
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        uses: $/actions/playwright-setup
        with:
          package-dir: .github/shoot

      # The waiting page template (skill waiting-page) in the same browser, in its own job. Its paths fall to the
      # all-on arm of ci-scope.sh, so a change there runs this job. The merged-page cases run the
      # roadmap build and the splice (tests/merged_page.py), so the runner needs python3 and git.
      # ubuntu-latest has both; the first line fails the step at once if one goes missing.
      - name: waiting page suite
        if: ${{ needs.scope.outputs.shoot == 'true' || github.event_name != 'pull_request' }}
        shell: bash
        run: |
          python3 --version && git --version
          NODE_PATH="$PWD/.github/shoot/node_modules" node --test skills/waiting-page/tests/page.test.mjs skills/waiting-page/tests/test_check_designs.mjs

  # Windows PowerShell 5.1 is the only shell where Set-Content -Encoding UTF8 writes a BOM.
  # On pwsh 7 the pointer test cannot go red on that defect, so it also runs here.
  pointer-windows:
    runs-on: windows-latest
    needs: scope
    # Cap 10 min, about 2.4x the slowest of 30 runs, 4.2 min, for install-set.test.ps1 on a slow runner
    # (decision ci-job-caps).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.pointer_windows == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pointer encoding test, Windows PowerShell 5.1
        if: ${{ (needs.scope.outputs.pointer_windows == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -File install.test.ps1

      - name: Install no-gap test, Windows PowerShell 5.1
        if: ${{ (needs.scope.outputs.pointer_windows == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-no-gap.test.ps1

      - name: Install set test, Windows PowerShell 5.1
        if: ${{ (needs.scope.outputs.pointer_windows == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-set.test.ps1

      - name: Memory monitor test, Windows PowerShell 5.1
        if: ${{ (needs.scope.outputs.pointer_windows == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/mem-monitor.test.ps1

      - name: Install bin eol test, Windows PowerShell 5.1
        if: ${{ (needs.scope.outputs.pointer_windows == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        shell: powershell
        timeout-minutes: 3
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-bin-eol.test.ps1

  # /bin/bash on macOS is 3.2.57 (2007) and /var is a symlink to /private/var. The
  # checkout-detection suite, the ios-ship suite, the sim-test suite and the duo-fold suite (bash 3.2 scripts for macOS) are the only checks
  # whose result depends on either. checks-macos below covers the rest of the suite, so this job stays narrow, on purpose.
  shell-macos:
    runs-on: macos-latest
    needs: scope
    if: ${{ github.event_name != 'push' }}
    # No macOS runner starts on a push to main: a step-level skip still starts it (R61). A pull_request, a schedule and a dispatch run it.
    # 75 (interim, stopgap, owner 12:11 CST Nov 10; decision ci-job-caps). Newest 29 completed push runs on main, latest attempt of each (run 42445434802 to run 43184587111):
    # 29 green, median 23.0, slowest 31.3 min (run 43184587111). The stopgap ends with roadmap step time-pinned-tests-go.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report the shell this job actually runs
        if: ${{ needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request' }}
        run: |
          /bin/bash --version | head -n1
          command -v bash
          bash --version | head -n1
      - name: Shell syntax check, install.sh
        if: ${{ needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request' }}
        run: bash -n install.sh
      - name: install.sh checkout-detection suite
        if: ${{ (needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        # Own cap, 45 (interim, stopgap, owner 12:11 CST Nov 10; decision ci-job-caps). The step ran 1293 s (21.6 min) in run 43184587111 and 1221 s in run 43164094808.
        timeout-minutes: 45
        run: sh hooks/test_install_src.sh
      - name: install_from_main suite
        if: ${{ (needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        run: sh merge/test_install_from_main.sh
      - name: ios-ship fixture suite (/bin/bash 3.2)
        if: ${{ (needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        run: /bin/bash lint/test_ios_ship.sh
      - name: ios-ship fixture suite (bash on PATH)
        if: ${{ (needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        run: bash lint/test_ios_ship.sh
      - name: sim-test fixture suite (/bin/bash 3.2)
        if: ${{ (needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        run: /bin/bash lint/test_sim_test.sh
      - name: sim-test fixture suite (bash on PATH)
        if: ${{ (needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        run: bash lint/test_sim_test.sh
      - name: duo-fold fixture suite (/bin/bash 3.2)
        if: ${{ (needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        run: /bin/bash lint/test_duo_fold.sh
      - name: duo-fold fixture suite (bash on PATH)
        if: ${{ (needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request') && needs.scope.outputs.code == 'true' }}
        run: bash lint/test_duo_fold.sh

  # The owner runs this repo on macOS. Before this job, every Python suite in the checks
  # and checks-windows jobs above proved itself only on Linux and Windows, never on a real
  # Mac, so janitor/install_launchd.py -- the one installer built for the Mac -- had no
  # macOS signal at all. This job mirrors checks-windows: same OS-touching suites, same order, and the
  # `!cancelled()` in the `if` of every step, for the reason checks-windows documents
  # above -- a job that stops at its first red step proves nothing about the suites
  # behind it.
  checks-macos:
    runs-on: macos-latest
    needs: scope
    if: ${{ github.event_name != 'push' }}
    # No macOS runner starts on a push to main: a step-level skip still starts it (R61). A pull_request, a schedule and a dispatch run it.
    # Cap 75 min, a stopgap under the owner's 2026-11-01 18:44 CST ruling in decision ci-job-caps: slowest 30.5 min
    # is 41% of it (range 14.3-30.5, median 19.4, n 30 green runs, same window as `checks`), after the split into
    # checks-macos and checks-macos-b. A push runs the janitor sweep mutation test and a pull request does not:
    # push median 20.5 min, pull request median 18.7 (n 13 each).
    # Now 75, above the 3600 s suite cap that the janitor sweep mutation test runs under (interim, owner 12:11 CST Nov 10; stopgap per decision ci-job-caps; ends with step time-pinned-tests-go).
    # Unmeasured since R61: the guard shard became the macOS slice, so the figures above describe the old shape.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.checks_macos == 'true' || needs.scope.outputs.sweep == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.checks_macos == 'true' || needs.scope.outputs.sweep == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      # The mac-tagged slice of the guard suite, on every event that runs macOS (R61, owner pick b, Nov 12): the full guard suite
      # runs on Linux and Windows, and on macOS only this slice. Cap 45 stays; the slice runs far shorter than the shard
      # it replaces (1106 s), unmeasured. hooks/test_guard.py holds the slice switch.
      - name: Guard fixture suite (macOS slice)
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        timeout-minutes: 45
        env:
          GUARD_TESTS: macos-slice
        run: python3 hooks/test_guard.py

      - name: Load reader against the OS tools
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 hooks/test_guard_load_os.py

      - name: rm shim fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 lint/test_rm_shim.py

      - name: Hook platform exit fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 lint/test_hook_platform_exit.py

      # No Guard mutation test here: it runs on the checks job (Linux) only. Accepted risk: a
      # macOS-only mutation regression is not caught. No mutant is marked macOS-only.

      - name: Janitor sweep fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_sweep.py

      - name: Janitor sweep mutation test
        if: ${{ !cancelled() && needs.scope.outputs.sweep == 'true' }}
        run: python3 janitor/mutate_sweep.py

      - name: Config watch fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() }}
