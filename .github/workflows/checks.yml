name: checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full_ste_audit:
        description: Run the STE linter over every file, report only, never fail the build.
        type: boolean
        default: false

permissions:
  contents: read

# A PR shares one group per ref, so a new push cancels the old run. Every other run gets its own
# group: GitHub keeps one pending run per group and replaces it, even without cancel-in-progress,
# so a shared group on main can leave a merged commit with no verdict. The draft state is in the
# group: `gh pr create --draft` then `gh pr ready` fires two runs, and the draft run (skips every
# job) must not cancel the ready run (decision draft-until-reviewed).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Git's auto gc runs detached and writes into a test repo's .git/objects while the test deletes it.
env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: gc.auto
  GIT_CONFIG_VALUE_0: "0"
  GIT_CONFIG_KEY_1: maintenance.auto
  GIT_CONFIG_VALUE_1: "false"

jobs:
  # The 03:17 nightly's skip job (R61, owner pick b, Nov 12; decision test-strategy-reset). It says skip when main's head already has a
  # green push run of checks.yml and the newest completed schedule run is green (.github/scripts/nightly-skip.py). Scope waits on it,
  # so a skip reaches every job through needs and the run is a visible success: nothing is cancelled, since a cancelled run reads
  # UNKNOWN and blocks merges. A failed read says skip=false: unknown runs everything. The job itself starts on every event and
  # its steps run on a schedule only: a job-level `if` would leave it skipped, and a skipped ancestor skips every job behind scope.
  nightly-skip:
    runs-on: ubuntu-latest
    # Cap 5 min, unmeasured: the job makes one runs read.
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ github.event_name == 'schedule' }}
        with:
          persist-credentials: false

      - name: Decide whether the nightly can skip
        id: decide
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/nightly-skip.py

  # The push skip job (decision push-skip-on-proven-tree; R62, step ci-linux-windows-once). It says skip when the push commit's tree
  # equals the head tree of a PR the commit belongs to (a batch-* PR, or a merged lone-lane PR) whose run passed: all-jobs-passed and
  # every suite job succeeded; a step scope skipped is no gap (the shared action actions/push-skip, ruling own-769-a-narrowed-pr-push).
  # Scope waits on it, so a skip reaches every job through needs and the run is a completed success: nothing is cancelled, since a
  # cancelled run reads UNKNOWN and blocks merges. A failed read says skip=false: unknown runs everything. A suite a narrowed PR run
  # left out is not run on main until a later change touches it. The job starts on every event and its steps run on a push only, so it stays on all-jobs-passed's needs like nightly-skip. Reads per push: the PR list, per head its commit, and per matching head its runs (unmeasured).
  push-skip:
    runs-on: ubuntu-latest
    # Cap 5 min, unmeasured: the job makes a handful of reads.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ github.event_name == 'push' }}
        with:
          persist-credentials: false

      - name: Decide whether the push can skip
        id: decide
        if: ${{ github.event_name == 'push' }}
        uses: $/actions/push-skip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_TREE: ${{ github.event.head_commit.tree_id }}
          EVENT: ${{ github.event_name }}

  # Decides which jobs and suites a run needs (.github/scripts/ci-scope.sh). Every other job
  # needs it. An error in the script turns every flag on, never off. A job behind a scope flag always runs; its steps skip when the flag is off.
  # A draft PR skips this job, so every job that needs it skips too (decision draft-until-reviewed).
  # It also skips on a scheduled run whose skip job said skip. The skip job runs on every event, and its steps run on a schedule only, so
  # off a schedule its skip output is empty. A failed skip job also has no skip output, which reads as not-skip, and !cancelled() keeps scope running.
  scope:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.nightly-skip.outputs.skip != 'true' && needs.push-skip.outputs.skip != 'true' }}
    needs:
      - nightly-skip
      - push-skip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_windows: ${{ steps.scope.outputs.checks_windows }}
      checks_windows_merge: ${{ steps.scope.outputs.checks_windows_merge }}
      checks_windows_rest: ${{ steps.scope.outputs.checks_windows_rest }}
      checks_windows_rest_2: ${{ steps.scope.outputs.checks_windows_rest_2 }}
      checks_windows_sweep: ${{ steps.scope.outputs.checks_windows_sweep }}
      checks_macos: ${{ steps.scope.outputs.checks_macos }}
      shell_macos: ${{ steps.scope.outputs.shell_macos }}
      pointer_windows: ${{ steps.scope.outputs.pointer_windows }}
      code: ${{ steps.scope.outputs.code }}
      mods: ${{ steps.scope.outputs.mods }}
      guard: ${{ steps.scope.outputs.guard }}
      checks_guard: ${{ steps.scope.outputs.checks_guard }}
      sweep: ${{ steps.scope.outputs.sweep }}
      shoot: ${{ steps.scope.outputs.shoot }}
      mutation_report: ${{ steps.scope.outputs.mutation_report }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect which jobs and suites this change needs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/ci-scope.sh

  checks:
    runs-on: ubuntu-latest
    needs: scope
    # Cap 75 min, a stopgap under the owner's 2026-11-01 18:44 CST ruling in decision ci-job-caps: slowest 22.8 min
    # is 30% of it (range 15.5-22.8, median 19.8, n 27 green runs, runs 42074654512 to 42263498384,
    # 2026-11-05 17:26 to 2026-11-06 17:38 UTC), after the merge and install suites moved to checks-merge-install.
    # Now 75, above the 3600 s suite cap that the janitor sweep mutation test runs under (interim, owner 12:11 CST Nov 10; stopgap per decision ci-job-caps; ends with step time-pinned-tests-go).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Workflow supply-chain audit (zizmor)
        uses: $/actions/zizmor
        with:
          paths: .github/ actions/

      # The pinned tsc and astro-check on PATH for the fixture suites below that run them (code-check, comment scan).
      - name: Code-check tools
        timeout-minutes: 5
        run: |
          npm ci --ignore-scripts --prefix actions/code-check/tools
          echo "$PWD/actions/code-check/tools/node_modules/.bin" >> "$GITHUB_PATH"

      # Ruff, mypy (strict, over the .code-check.json list), ShellCheck, tsc and astro-check, from the table in
      # lint/code_check_standard.json. Fails on a tracked language with no row. No format step.
      - name: Code check
        uses: $/actions/code-check
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Action metadata loads
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 actions/test_action_metadata.py

      - name: Code-check action
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: |
          for spec in $(python3 actions/code-check/code_check.py --pins); do pipx install "$spec"; done
          python3 actions/code-check/test_action.py

      - name: Ruling-kind records-dir input
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 actions/test_ruling_kind_records_dir.py

      - name: Janitor sweep fixture suite
        if: ${{ needs.scope.outputs.code == 'true' && needs.scope.outputs.sweep == 'true' }}
        run: python3 janitor/test_sweep.py

      - name: Janitor sweep mutation test
        if: ${{ needs.scope.outputs.sweep == 'true' }}
        run: python3 janitor/mutate_sweep.py

      - name: Reap proof Git Bash one-home suite
        if: ${{ needs.scope.outputs.code == 'true' }}
