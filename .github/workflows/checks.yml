  # The second half of checks-macos, split off for wall time: that job took 40.6 min in run 41730427997. The guard slice (R61)
  # runs in checks-macos alone, so this job has no guard step, and the slow CI steps are shared out between the jobs. Same scope flag, same `if:`
  # on every CI step as checks-macos. Both jobs start on every pull request (`needs: scope` only); the scope flag gates
  # their steps, not the jobs. Cost: a pull request with no macOS-scoped change, such as a docs-only one, starts a
  # second, idle macOS runner that it did not start before. That cost is unmeasured: the window below had no such run.
  checks-macos-b:
    runs-on: macos-latest
    needs: scope
    if: ${{ github.event_name != 'push' }}
    # No macOS runner starts on a push to main: a step-level skip still starts it (R61). A pull_request, a schedule and a dispatch run it.
    # 75 (interim, stopgap, owner 12:11 CST Nov 10; decision ci-job-caps). The newest 29 completed push runs on main, latest attempt of each (run 42522167511 to run 43206612905):
    # 29 green, median 25.5, slowest 30.7 min (run 43197518392). The stopgap ends with roadmap step time-pinned-tests-go.
    # Unmeasured since R61: the guard shard left this job, so those 29 push runs no longer describe it.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      - name: CI wake-up fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        run: python3 hooks/test_ci_wake.py

      - name: Feedback inbox fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        run: python3 hooks/test_feedback_inbox.py

      - name: Waiting export check suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        run: python3 hooks/test_waiting_export.py

      - name: Daily note fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        run: python3 hooks/test_daily_note.py

      # Windows is not covered: the stall watch is posix only (see the stall-watch decision).
      - name: Stall watch fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        run: python3 hooks/test_stall_watch.py

      - name: Proc env read suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        run: python3 hooks/test_proc_env.py

      - name: Janitor triggers fixture suite (SessionEnd hook)
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_session_end_sweep.py

      - name: Janitor triggers fixture suite (launchd installer)
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_install_launchd.py

      - name: Janitor triggers fixture suite (schtasks installer)
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_install_schtasks.py

  # The Windows suites run in four jobs (checks-windows, checks-windows-guard, checks-windows-merge, checks-windows-rest), and the guard and merge jobs add shard jobs. Six python suites in the checks job need a real Windows box to prove: no other
  # job in this workflow can show whether they pass there. This job runs those
  # suites on Windows and reports the environment first. It is blocking: run
  # 35766479009 went green here for the first time, on its own merit, not through
  # continue-on-error.
  # Every step in all three jobs carries `!cancelled()` in its `if`. Without it, GitHub Actions
  # skips every step after the first failure, even inside a job marked
  # continue-on-error. This job stayed advisory-red at its first failing step for a
  # while, and that hid eleven suites behind it that never ran on Windows at all. A
  # job that stops at its first red step proves nothing about the suites behind it.
  checks-windows:
    runs-on: windows-latest
    needs: scope
    # Cut F moved the guard suite out. Run time since the install.sh leg left is unmeasured; 10 min leaves room.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.checks_windows == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.checks_windows == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      - name: Report the Windows environment
        if: ${{ (needs.scope.outputs.checks_windows == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        shell: bash
        run: |
          echo "== python --version =="
          python --version

          echo "== ps on PATH, and ps -o lstart= -p <pid> =="
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import tempfile

          ps_path = shutil.which("ps")
          print("shutil.which('ps'):", ps_path)

          pid = os.getpid()
          try:
              result = subprocess.run(
                  ["ps", "-o", "lstart=", "-p", str(pid)],
                  capture_output=True,
                  text=True,
              )
              print("ps exit code:", result.returncode)
              print("ps stdout:", repr(result.stdout))
              print("ps stderr:", repr(result.stderr))
          except Exception as exc:
              print("ps invocation raised:", repr(exc))

          print("== os.symlink, unprivileged ==")
          tmp_dir = tempfile.gettempdir()
          target = os.path.join(tmp_dir, "checks_windows_symlink_target.txt")
          link = os.path.join(tmp_dir, "checks_windows_symlink_link.txt")
          try:
              with open(target, "w") as handle:
                  handle.write("scratch")
              if os.path.exists(link):
                  os.remove(link)
              os.symlink(target, link)
              print("os.symlink succeeded:", link, "->", target)
          except Exception as exc:
              print("os.symlink failed:", repr(exc))
          finally:
              for path in (link, target):
                  try:
                      os.remove(path)
                  except OSError:
                      pass

          print("== tempfile.gettempdir(), read from Python ==")
          print(tempfile.gettempdir())
          PY

          echo "== \$TMPDIR, read from Git Bash =="
          echo "${TMPDIR:-<unset>}"

          echo "== mktemp -d, read from Git Bash =="
          mktemp -d

      # The guard suite runs in checks-windows-guard. No Guard mutation test on Windows: it took 34.5 min
      # there and hit the 45 min timeout (run 37086259145). It runs in checks-mutate-guard (Linux) only.
      # Accepted risk: a Windows-only mutation regression is not caught. No mutant is marked windows-only.

      - name: Load reader against the OS tools
        if: ${{ (needs.scope.outputs.checks_windows == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python hooks/test_guard_load_os.py

      - name: install.sh stays off Windows suite
        if: ${{ (needs.scope.outputs.checks_windows == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        shell: bash
        run: sh hooks/test_install_windows.sh

      # F1 and G1 run session_start.sh, which runs at each Windows session startup and resume. They run with a 30 s
      # fetch bound (the CLAUDE_SETTINGS_FETCH_TIMEOUT export in hooks/test_install_src.sh). A hang fails this CI step in 3 min,
      # by name, not the job's 10.
      - name: Session start freshness cases (caseF1, caseG1)
        if: ${{ (needs.scope.outputs.checks_windows == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.code == 'true' }}
        shell: bash
        timeout-minutes: 3
        run: sh hooks/test_install_src.sh caseF1 caseG1

      - name: Mod and map-skill tests
        if: ${{ (needs.scope.outputs.checks_windows == 'true' || github.event_name != 'pull_request') && !cancelled() && needs.scope.outputs.mods == 'true' }}
        shell: bash
        run: bash .github/scripts/mod-tests.sh

  # The mutation test for the guard, moved off `checks` by cut F so it runs in parallel, then split into 3 shards that run in
  # parallel too: this job and its -b and -c copies. Each sets MUTATE_SHARD=i/3 on its mutate step, so `run_mutants` runs
  # entries[i-1::3] and each mutant runs in exactly one job (lint/test_windows_split.py, mutate_problems). `main` checks every
  # anchor before it slices. Debt mutate-guard-split.
  checks-mutate-guard:
    runs-on: ubuntu-latest
    needs: scope
    # The step grew from 193 s to 400 s (batch 4), then ran 580 s or more before the 10 min cap cut it (run 41786084869).
    # Faster slow kills cut the local run 710 s to 651 s (4 jobs). Batch 7's lanes add mutants. On main, the coordinator
    # measured lane PR 1163 alone at 946 s locally (+236 s) and lane PR 1157 at 768 s (+58 s). If those add up and the
    # speed-ups carry over, the set nears 945 s locally, about 16 min. A cap-cut step has no upper bound.
    # Batch 68 run 42608474160 was cancelled at the 25 min cap with 616 of 694 mutants killed and none surviving. The cap
    # is a stopgap (ci-job-caps) until the split (debt mutate-guard-split, shards); the next green run gives the figure.
    # One shard holds a third of the list (batch 103's unsplit job ran 35 min). Provisional 60 min cap until 5 green runs (ci-job-caps, How to measure again item 6); each shard's time is unmeasured until the first PR run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      - name: Guard mutation test, shard 1/3
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        env:
          MUTATE_SHARD: 1/3
        run: python3 hooks/mutate_guard.py

      # The progress beat of hooks/test_guard.py (decision stall-watch). Runs in this job, not in the guard suite, which runs in the
      # sibling shards (checks-guard is split in two, decision ci-job-caps); this job is projected at about 16 min, 21% of its 75 min cap, and this step adds 101 s locally (16 tests, about 1.7 min,
      # so about 24%, under the 70% warn line of the merge tool; unmeasured in CI).
      # Same `guard` scope flag as the guard mutation test above. Own 5 min cap (3x the local time), so a hang reads red here.
      - name: Guard progress beat suite
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        timeout-minutes: 5 # provisional: no CI run yet; 101 s measured locally
        run: python3 hooks/test_guard_beat.py

  checks-mutate-guard-b:
    runs-on: ubuntu-latest
    needs: scope
    # Shard 2/3 of the guard mutation test; see checks-mutate-guard. Provisional 60 min cap until 5 green runs (ci-job-caps); unmeasured until the first PR run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      - name: Guard mutation test, shard 2/3
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        env:
          MUTATE_SHARD: 2/3
        run: python3 hooks/mutate_guard.py

  checks-mutate-guard-c:
    runs-on: ubuntu-latest
    needs: scope
    # Shard 3/3 of the guard mutation test; see checks-mutate-guard. Provisional 60 min cap until 5 green runs (ci-job-caps); unmeasured until the first PR run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      - name: Guard mutation test, shard 3/3
        if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
        env:
          MUTATE_SHARD: 3/3
        run: python3 hooks/mutate_guard.py

  # The mutation report of a batch (decision mutation-report-scores-suites, owner item mutation-ci-job, 2026-11-05). It runs on
  # a pull request from a `batch-` branch (the scope flag mutation_report, set from the head ref) and on workflow_dispatch.
  # A pull request from any other branch skips its steps, so the job reads passed. A push or a schedule reaches the action,
  # which skips there itself: the scope rules read a scoped job as running on those events.
  # It reports the catch share of the changed lines and never fails on it. It fails only when a known defect (.github/known-defects.json)
  # is MISS or UNKNOWN, or a base entry is MISSING from the head list or CHANGED on it. Cap (ci-job-caps): the budget is a wall deadline, so the `--changed` step lasts at most the budget (1800 s, raised from 300 s under the interim stopgap of decision ci-job-caps: a change to hooks/guard.py ran 10 of 10 mutants in 978 s with a 1800 s budget, 1 of 10 at 600 s; step mutation-tests-for-cost) plus
  # its setup (installs and control runs, before the deadline's mutants), not the 337 s the old start-only budget took on batch 11
  # (59bff081..0497265b, limit 10, suite timeout 180 s). `--known-defects` took 7 s there, with a checkout and setup around
  # 1 min; that run used a profile with no install. `--known-defects` now runs its own install after the `--changed` step removes
  # its deps: one per lockfile hash, install and link, each up to INSTALL_TIMEOUT (900 s). The 45 min cap covers the measured runs (1800 s budget plus
  # setup and the known-defects step; interim stopgap). A profile with an install adds up to 900 s
  # (INSTALL_TIMEOUT) per lockfile hash to each of the two steps, which can pass it. claude_settings has no install. The first
  # CI run on a batch with an install replaces the 7 min figure.
  mutation-report:
    runs-on: ubuntu-latest
    needs: scope
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.scope.outputs.mutation_report == 'true' || github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ needs.scope.outputs.mutation_report == 'true' || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"

      - name: Mutation report and known defects
        if: ${{ needs.scope.outputs.mutation_report == 'true' || github.event_name != 'pull_request' }}
        uses: $/actions/mutation-report
        with:
          profile: claude_settings

