        run: python lint/test_report_guard_falsifier.py

      - name: Stop-hook hand-off cite suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python lint/test_report_guard_handoff.py

      - name: Clause parser suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python lint/test_clause.py

      - name: Stop-hook cannot-claim suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python lint/test_report_guard_cannot.py

      - name: Stop-hook landing fixture suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python lint/test_report_guard_landing.py

      - name: Stop-hook owner-safe reason suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python lint/test_report_guard_remedy.py

      - name: Ruling home fixture suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python hooks/test_ruling_home.py

      - name: Ruling census fixture suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python lint/test_ruling_census.py

      - name: Verdict runner fixture suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python lint/test_verdict.py

      - name: Hook platform exit fixture suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        run: python lint/test_hook_platform_exit.py

      - name: Unknown-read contract (guard + session_start)
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() && (needs.scope.outputs.code == 'true' || github.event_name == 'pull_request') }}
        run: python lint/check_unknown_reads_contract.py

      - name: Janitor triggers fixture suite (SessionEnd hook)
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() && (needs.scope.outputs.code == 'true' || github.event_name == 'pull_request') }}
        run: python janitor/test_session_end_sweep.py

      - name: Janitor triggers fixture suite (launchd installer)
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() && (needs.scope.outputs.code == 'true' || github.event_name == 'pull_request') }}
        run: python janitor/test_install_launchd.py

      - name: Janitor triggers fixture suite (schtasks installer)
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() && (needs.scope.outputs.code == 'true' || github.event_name == 'pull_request') }}
        run: python janitor/test_install_schtasks.py

      # The suite's own watchdog (actions/stamp/suite_watchdog.mjs) ends it at 180 s; the slowest normal
      # run took 102 s (run 42456407663). A hang reads red there, with the hung test named, and its process
      # tree killed. A process the suite started and left running reads red too, killed and named with its
      # pid and command line, even on a normal finish; so does a sweep that could not read. It runs the
      # tests in a Job Object, and a run that cannot get one fails with "FAIL - no job object". Worst
      # case, with every bounded call counted: 180 s cap + 30 s hard stop + 35 s longest blocking call
      # + 10 s kills + 2 s output drain = 257 s. The CI step's timeout-minutes (300 s) is the backstop.
      - name: Record stamp engine fixture suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        timeout-minutes: 5
        run: node actions/stamp/test_stamp.mjs

      - name: Record stamp action fixture suite
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() }}
        shell: bash
        run: bash actions/stamp/test_action.sh

  # The one check branch protection requires. It fails on a needed job that failed, was cancelled or was
  # skipped, so every needed job runs on a ready PR and puts its scope condition on its steps, never on the job.
  # It runs on a ready pull_request only: on a push or a schedule it would read green over a red shard job it does not need.
  all-jobs-passed:
    runs-on: ubuntu-latest
    needs:
      - nightly-skip
      - push-skip
      - scope
      - checks
      - checks-merge-install
      - checks-guard
      - checks-guard-2
      - checks-shoot
      - checks-waiting-page
      - pointer-windows
      - shell-macos
      - checks-macos
      - checks-macos-b
      - checks-windows
      - checks-mutate-guard
      - checks-mutate-guard-b
      - checks-mutate-guard-c
      - mutation-report
      - checks-windows-guard
      - checks-windows-guard-2
      - checks-windows-guard-3
      - checks-windows-merge
      - checks-windows-merge-2
      - checks-windows-merge-3
      - checks-windows-merge-4
      - checks-windows-merge-5
      - checks-windows-rest
      - checks-windows-rest-2
      - checks-windows-sweep
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: $/actions/all-jobs-passed
        with:
          needs: ${{ toJSON(needs) }}

  # Wakes a session that waits on this PR (decision ci-wait-reads-run-status, "The cloud wake").
  # A run with a red job sends no "all checks done" wake, so this job comments once when the run
  # ends red. It needs every other job (actions/ci-done-comment/test_comment.py checks the list).
  # !cancelled() runs it after a failed job and skips it on a superseded run. A draft runs no CI.
  ci-done:
    runs-on: ubuntu-latest
    needs:
      - nightly-skip
      - scope
      - push-skip
      - checks
      - checks-merge-install
      - checks-guard
      - checks-guard-2
      - checks-shoot
      - checks-waiting-page
      - pointer-windows
      - shell-macos
      - checks-macos
      - checks-macos-b
      - checks-windows
      - checks-mutate-guard
      - checks-mutate-guard-b
      - checks-mutate-guard-c
      - mutation-report
      - checks-windows-guard
      - checks-windows-guard-2
      - checks-windows-guard-3
      - checks-windows-merge
      - checks-windows-merge-2
      - checks-windows-merge-3
      - checks-windows-merge-4
      - checks-windows-merge-5
      - checks-windows-rest
      - checks-windows-rest-2
      - checks-windows-sweep
      - all-jobs-passed
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Comment when a job ended red
        uses: $/actions/ci-done-comment
        with:
          needs: ${{ toJSON(needs) }}
