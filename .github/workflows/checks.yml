        run: python3 lint/check_unknown_reads_contract.py

      # The suite's own watchdog (actions/stamp/suite_watchdog.mjs) ends it at 180 s; the slowest normal
      # run took 102 s (run 42456407663). A hang reads red there, with the hung test named, and its process
      # tree killed. A process the suite started and left running reads red too, killed and named with its
      # pid and command line, even on a normal finish; so does a sweep that could not read. Worst case,
      # with every bounded call counted: 180 s cap + 30 s hard stop + 35 s longest blocking call + 10 s
      # kills + 2 s output drain = 257 s. The CI step's timeout-minutes (300 s) is the backstop.
      - name: Record stamp engine fixture suite
        if: ${{ (needs.scope.outputs.checks_macos == 'true' || github.event_name != 'pull_request') && !cancelled() }}
