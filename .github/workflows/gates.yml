name: gates

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full_ste_audit:
        description: Run the STE linter over every file, report only, never fail the build.
        type: boolean
        default: false

permissions:
  contents: read

# A PR shares one group per ref, so a new push cancels the old run. Every other run gets its own
# group: GitHub keeps one pending run per group and replaces it, even without cancel-in-progress,
# so a shared group on main can leave a merged commit with no verdict. The draft state is in the
# group: `gh pr create --draft` then `gh pr ready` fires two runs, and the draft run (skips every
# job) must not cancel the ready run (decision draft-until-reviewed).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs and suites a run needs (.github/scripts/harness-scope.sh). Every other job
  # needs it. An error in the script turns every flag on, never off. A skipped job reads as passing.
  # A draft PR skips this job, so every job that needs it skips too (decision draft-until-reviewed).
  scope:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gates_windows: ${{ steps.scope.outputs.gates_windows }}
      gates_windows_merge: ${{ steps.scope.outputs.gates_windows_merge }}
      gates_windows_rest: ${{ steps.scope.outputs.gates_windows_rest }}
      gates_macos: ${{ steps.scope.outputs.gates_macos }}
      shell_macos: ${{ steps.scope.outputs.shell_macos }}
      pointer_windows: ${{ steps.scope.outputs.pointer_windows }}
      code: ${{ steps.scope.outputs.code }}
      mods: ${{ steps.scope.outputs.mods }}
      guard: ${{ steps.scope.outputs.guard }}
      sweep: ${{ steps.scope.outputs.sweep }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect which jobs and suites this change needs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/harness-scope.sh

  gates:
    runs-on: ubuntu-latest
    needs: scope
    # Cap 36 min = 2x the slowest green run. A bandaid: suite growth is the cause (debt gates-job-near-timeout).
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Workflow supply-chain audit (zizmor)
        run: pipx run zizmor==1.30.1 .github/ actions/

      - name: Guard fixture suite
        if: ${{ needs.scope.outputs.code == 'true' && needs.scope.outputs.guard == 'true' }}
        run: python3 hooks/test_guard.py

      - name: Action metadata loads
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 actions/test_action_metadata.py

      - name: Ruling-kind records-dir input
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 actions/test_ruling_kind_records_dir.py

      - name: Janitor sweep fixture suite
        if: ${{ needs.scope.outputs.code == 'true' && needs.scope.outputs.sweep == 'true' }}
        run: python3 janitor/test_sweep.py

      - name: Janitor sweep mutation harness
        if: ${{ needs.scope.outputs.sweep == 'true' }}
        run: python3 janitor/mutate_sweep.py

      - name: Config watch fixture suite
        run: python3 hooks/test_config_watch.py

      - name: Config watch fast-exit suite
        run: python3 hooks/test_config_watch_fast_exit.py

      - name: Shared names suite
        run: python3 hooks/test_shared_names.py

      - name: Precompact handoff fixture suite
        run: python3 hooks/test_precompact_handoff.py

      - name: Handoff wave-2 fixture suite
        run: python3 hooks/test_handoff_wave2.py

      - name: Decision watch fixture suite
        run: python3 hooks/test_decision_watch.py

      - name: Reply judge fixture suite
        run: python3 hooks/test_reply_judge.py

      - name: SendMessage state fixture suite
        run: python3 hooks/test_sendmessage_state.py

      - name: Question outcome fixture suite
        run: python3 hooks/test_question_outcome.py

      - name: Remove-prompt answer fixture suite
        run: python3 hooks/test_rm_prompt_answer.py

      - name: Agent brief fixture suite
        run: python3 hooks/test_agent_brief.py

      - name: Local time line fixture suite
        run: python3 hooks/test_local_time.py

      - name: CI wake-up fixture suite
        run: python3 hooks/test_ci_wake.py

      - name: Feedback inbox fixture suite
        run: python3 hooks/test_feedback_inbox.py

      - name: Daily note fixture suite
        run: python3 hooks/test_daily_note.py

      - name: No-window helper fixture suite
        run: python3 hooks/test_nowindow.py

      # Windows is not covered: the stall watch is posix only (see the stall-watch decision).
      - name: Stall watch fixture suite
        run: python3 hooks/test_stall_watch.py

      - name: Stall watch stop suite
        run: python3 hooks/test_stall_watch_stop.py

      - name: Simulator boot-record fixture suite
        run: python3 hooks/test_sim_boot_record.py

      - name: Gate wrappers fixture suite
        run: python3 hooks/test_wrappers.py

      - name: Session start notice suite
        run: python3 hooks/test_session_start.py

      - name: Stop-hook gate fixture suite
        run: python3 lint/test_gates.py

      - name: STE auto-fix fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 lint/test_ste_autofix.py

      - name: Ruling home fixture suite
        run: python3 hooks/test_ruling_home.py

      - name: Ruling census fixture suite
        run: python3 lint/test_ruling_census.py

      - name: Rule audit fixture suite
        run: python3 lint/test_rule_audit.py

      - name: Guard log report fixture suite
        run: python3 lint/test_guard_log_report.py

      - name: Verdict runner fixture suite
        run: python3 lint/test_verdict.py

      - name: Rule mechanization audit
        run: python3 lint/rule_audit.py

      - name: Windows split guard
        run: python3 lint/test_windows_split.py

      - name: Scope detector fixture suite
        run: python3 lint/test_harness_scope.py

      - name: rm shim fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 lint/test_rm_shim.py

      - name: Mutation verdict fixture suite
        run: python3 hooks/test_mutate_shared.py

      - name: Landed-directory check fixture suite
        run: python3 lint/test_check_landed_dirs.py

      - name: Settings matcher fixture suite
        run: python3 lint/test_settings_matcher.py

      - name: Record slug fixture suite
        run: python3 lint/test_check_record_slugs.py

      - name: Mod version fixture suite
        run: python3 lint/test_check_mod_versions.py

      - name: Hook catalog fixture suite
        run: python3 lint/test_hook_catalog.py

      - name: Hook catalog check
        run: python3 lint/hook_catalog.py --check

      - name: Record slug length
        run: python3 lint/check_record_slugs.py

      - name: Mod version bump
        run: python3 lint/check_mod_versions.py

      - name: Ruling kind fixture suite
        run: python3 lint/test_check_ruling_kind.py

      - name: Ruling kind check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 lint/check_ruling_kind.py --base "origin/$BASE_REF"

      - name: Silent undo fixture suite
        run: python3 lint/test_check_silent_undo.py

      - name: Silent undo check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 lint/check_silent_undo.py --upstream "origin/$BASE_REF" --head "$HEAD_SHA" --strict

      - name: Comment narration fixture suite
        run: python3 lint/test_check_comment_narration.py

      - name: Comment narration check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 lint/check_comment_narration.py --base "origin/$BASE_REF"

      - name: Unknown-read contract fixture suite
        run: python3 lint/test_check_unknown_reads_contract.py

      - name: Unknown-read contract (guard + session_start)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 lint/check_unknown_reads_contract.py

      - name: Landed-directory manifest agreement
        run: python3 lint/check_landed_dirs.py

      - name: Agent and skill model floor
        run: python3 lint/check_agent_models.py

      - name: Agent and skill model floor fixture suite
        run: python3 lint/test_check_agent_models.py

      - name: Skill model rows check
        run: python3 lint/check_skill_model_rows.py

      - name: Skill model rows fixture suite
        run: python3 lint/test_check_skill_model_rows.py

      - name: No-window spawn check
        run: python3 lint/test_no_window_spawn.py

      - name: PowerShell syntax check, install.ps1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }

      - name: Pointer encoding test, install.test.ps1
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: pwsh -NoProfile -File install.test.ps1

      - name: STE lint
        uses: $/actions/ste-lint
        with:
          scope: ${{ inputs.full_ste_audit && 'all' || 'changed' }}
          fail: ${{ !inputs.full_ste_audit }}

      - name: Janitor triggers fixture suite (SessionEnd hook + launchd installer)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: |
          python3 janitor/test_session_end_sweep.py
          python3 janitor/test_install_launchd.py

      - name: Janitor triggers fixture suite (schtasks installer)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_install_schtasks.py

      - name: STE lint action fixture suite
        run: python3 actions/ste-lint/test_action.py

      - name: Record stamp engine fixture suite
        run: node actions/stamp/test_stamp.mjs

      - name: Scanner trap lint
        run: node lint/test_scanner_traps.mjs

      - name: Record stamp action fixture suite
        shell: bash
        run: bash actions/stamp/test_action.sh

      - name: Opt-in CI template fixture suites
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: bash
        run: |
          bash actions/all-jobs-passed/test_action.sh
          bash actions/ci-alarm/test_action.sh
          bash actions/ruling-kind/test_action.sh
          python3 actions/readme-links/test_readme_links.py
          bash githooks/main-ref/test_hook.sh
          node --test testing/skip-locally-fail-in-ci.test.mjs

      - name: Merge launcher fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_launch.py

      - name: Merge tool git-half fixture suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_merge.py

      - name: Merge launcher fixture suite (bin/merge)
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: python3 merge/test_cmd.py

      - name: install_from_main suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh merge/test_install_from_main.sh

      # This step and the skill test step below come last, so a red test in them skips none of the steps above, and a red step above does not hide
      # a mod test (!cancelled() runs it anyway). One find reaches every *.test.mjs and *.test.js file under
      # mods/ except node_modules, at any depth. A new mods/<name>/ joins with no edit here. Each file's exit code lands in `fail`, so a failing first or last file
      # fails the step. The find runs first and fails the step if it errors or lists nothing. No pipe.
      - name: Mod tests
        if: ${{ !cancelled() && needs.scope.outputs.mods == 'true' }}
        shell: bash
        run: |
          list=$(find mods -name node_modules -prune -o \( -name '*.test.mjs' -o -name '*.test.js' \) -print) || { echo "find failed"; exit 1; }
          [ -n "$list" ] || { echo "no mod test file found"; exit 1; }
          fail=0
          while IFS= read -r f; do
            node "$f" || fail=1
          done <<< "$list"
          exit "$fail"

      # The plain-english-map skill: its tests load typescript from this checkout's node_modules, as an
      # install does. They run from the skill's own tests/ folder, with no q_max path. Same `mods` flag
      # as the step above. A .md path under skills/plain-english-map/ turns `mods` on through its own
      # arm in harness-scope.sh. Any other path under the skill, or package*.json, turns it on, because
      # harness-scope.sh runs every job for a path it does not name.
      - name: Plain-english-map skill tests
        if: ${{ !cancelled() && needs.scope.outputs.mods == 'true' }}
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd skills/plain-english-map/tests
          node --test

  # Windows PowerShell 5.1 is the only shell where Set-Content -Encoding UTF8 writes a BOM.
  # On pwsh 7 the pointer test cannot go red on that defect, so it also runs here.
  pointer-windows:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.pointer_windows == 'true' || github.event_name != 'pull_request' }}
    # Cap 10 min leaves room for install-set.test.ps1 on a slow runner (figures: debt measured-time-table).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pointer encoding test, Windows PowerShell 5.1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -File install.test.ps1

      - name: Install no-gap test, Windows PowerShell 5.1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-no-gap.test.ps1

      - name: Install set test, Windows PowerShell 5.1
        if: ${{ needs.scope.outputs.code == 'true' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-set.test.ps1

  # /bin/bash on macOS is 3.2.57 (2007) and /var is a symlink to /private/var. The
  # checkout-detection suite is the only gate whose result depends on either. gates-macos
  # below covers the rest of the suite, so this job stays narrow, on purpose.
  shell-macos:
    runs-on: macos-latest
    needs: scope
    if: ${{ needs.scope.outputs.shell_macos == 'true' || github.event_name != 'pull_request' }}
    # Cap 5 min leaves room for a slow runner start (figures: debt measured-time-table).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report the shell this job actually runs
        run: |
          /bin/bash --version | head -n1
          command -v bash
          bash --version | head -n1
      - name: Shell syntax check, install.sh
        run: bash -n install.sh
      - name: install.sh checkout-detection suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh hooks/test_install_src.sh
      - name: install_from_main suite
        if: ${{ needs.scope.outputs.code == 'true' }}
        run: sh merge/test_install_from_main.sh

  # The owner runs this repo on macOS. Before this job, every Python suite in the gates
  # and gates-windows jobs above proved itself only on Linux and Windows, never on a real
  # Mac, so janitor/install_launchd.py -- the one installer built for the Mac -- had no
  # macOS signal at all. This job mirrors gates-windows: same OS-touching suites, same order, and the
  # same `if: ${{ !cancelled() }}` on every step, for the reason gates-windows documents
  # above -- a job that stops at its first red step proves nothing about the suites
  # behind it.
  gates-macos:
    runs-on: macos-latest
    needs: scope
    if: ${{ needs.scope.outputs.gates_macos == 'true' || github.event_name != 'pull_request' }}
    # Cap 25 min = about 2x the slowest green run (figures: debt measured-time-table).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Guard fixture suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 hooks/test_guard.py

      - name: rm shim fixture suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 lint/test_rm_shim.py

      # No Guard mutation harness here: it runs on the gates job (Linux) only. Accepted risk: a
      # macOS-only mutation regression is not caught. No mutant is marked macOS-only.

      - name: Janitor sweep fixture suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_sweep.py

      - name: Janitor sweep mutation harness
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.scope.outputs.sweep == 'true' }}
        run: python3 janitor/mutate_sweep.py

      - name: Config watch fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_config_watch.py

      - name: Config watch fast-exit suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_config_watch_fast_exit.py

      - name: Shared names suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_shared_names.py

      - name: Precompact handoff fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_precompact_handoff.py

      - name: Handoff wave-2 fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_handoff_wave2.py

      - name: Decision watch fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_decision_watch.py

      - name: Reply judge fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_reply_judge.py

      - name: SendMessage state fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_sendmessage_state.py

      - name: Question outcome fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_question_outcome.py

      - name: Remove-prompt answer fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_rm_prompt_answer.py

      - name: Agent brief fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_agent_brief.py

      - name: Local time line fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_local_time.py

      - name: CI wake-up fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_ci_wake.py

      - name: Feedback inbox fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_feedback_inbox.py

      - name: Daily note fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_daily_note.py

      # Windows is not covered: the stall watch is posix only (see the stall-watch decision).
      - name: Stall watch fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_stall_watch.py

      - name: Simulator boot-record fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_sim_boot_record.py

      - name: Gate wrappers fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_wrappers.py

      - name: Session start notice suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_session_start.py

      - name: Stop-hook gate fixture suite
        if: ${{ !cancelled() }}
        run: python3 lint/test_gates.py

      - name: Ruling home fixture suite
        if: ${{ !cancelled() }}
        run: python3 hooks/test_ruling_home.py

      - name: Ruling census fixture suite
        if: ${{ !cancelled() }}
        run: python3 lint/test_ruling_census.py

      - name: Verdict runner fixture suite
        if: ${{ !cancelled() }}
        run: python3 lint/test_verdict.py

      - name: Unknown-read contract (guard + session_start)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 lint/check_unknown_reads_contract.py

      - name: Janitor triggers fixture suite (SessionEnd hook)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_session_end_sweep.py

      - name: Janitor triggers fixture suite (launchd installer)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_install_launchd.py

      - name: Janitor triggers fixture suite (schtasks installer)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python3 janitor/test_install_schtasks.py

      - name: Record stamp engine fixture suite
        if: ${{ !cancelled() }}
        run: node actions/stamp/test_stamp.mjs

      - name: Record stamp action fixture suite
        if: ${{ !cancelled() }}
        run: bash actions/stamp/test_action.sh

  # The Windows suites run in four jobs (gates-windows, gates-windows-guard, gates-windows-merge, gates-windows-rest). Six python suites in the gates job need a real Windows box to prove: no other
  # job in this workflow can show whether they pass there. This job runs those
  # suites on Windows and reports the environment first. It is blocking: run
  # 35766479009 went green here for the first time, on its own merit, not through
  # continue-on-error.
  # Every step in all three jobs carries `if: ${{ !cancelled() }}`. Without it, GitHub Actions
  # skips every step after the first failure, even inside a job marked
  # continue-on-error. This job stayed advisory-red at its first failing step for a
  # while, and that hid eleven suites behind it that never ran on Windows at all. A
  # job that stops at its first red step proves nothing about the suites behind it.
  gates-windows:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.gates_windows == 'true' || github.event_name != 'pull_request' }}
    # Cut F moved the guard suite out. Expected about 190 s (install.sh 180 s, plus setup); 10 min leaves room.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Report the Windows environment
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "== python --version =="
          python --version

          echo "== ps on PATH, and ps -o lstart= -p <pid> =="
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import tempfile

          ps_path = shutil.which("ps")
          print("shutil.which('ps'):", ps_path)

          pid = os.getpid()
          try:
              result = subprocess.run(
                  ["ps", "-o", "lstart=", "-p", str(pid)],
                  capture_output=True,
                  text=True,
              )
              print("ps exit code:", result.returncode)
              print("ps stdout:", repr(result.stdout))
              print("ps stderr:", repr(result.stderr))
          except Exception as exc:
              print("ps invocation raised:", repr(exc))

          print("== os.symlink, unprivileged ==")
          tmp_dir = tempfile.gettempdir()
          target = os.path.join(tmp_dir, "gates_windows_symlink_target.txt")
          link = os.path.join(tmp_dir, "gates_windows_symlink_link.txt")
          try:
              with open(target, "w") as handle:
                  handle.write("scratch")
              if os.path.exists(link):
                  os.remove(link)
              os.symlink(target, link)
              print("os.symlink succeeded:", link, "->", target)
          except Exception as exc:
              print("os.symlink failed:", repr(exc))
          finally:
              for path in (link, target):
                  try:
                      os.remove(path)
                  except OSError:
                      pass

          print("== tempfile.gettempdir(), read from Python ==")
          print(tempfile.gettempdir())
          PY

          echo "== \$TMPDIR, read from Git Bash =="
          echo "${TMPDIR:-<unset>}"

          echo "== mktemp -d, read from Git Bash =="
          mktemp -d

      # The guard suite runs in gates-windows-guard. No Guard mutation harness on Windows: it took 34.5 min
      # there and hit the 45 min timeout (run 37086259145). It runs in gates-mutate-guard (Linux) only.
      # Accepted risk: a Windows-only mutation regression is not caught. No mutant is marked windows-only.

      - name: install.sh checkout-detection suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        shell: bash
        run: sh hooks/test_install_src.sh

  # The mutation harness for the guard, moved off `gates` by cut F so it runs in parallel.
  gates-mutate-guard:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
    # 2x the slowest green step (193 s) is 386 s; 10 min with setup.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Guard mutation harness
        run: python3 hooks/mutate_guard.py

  # The guard fixture suite on Windows, split off gates-windows by cut F. On pull_request it runs only the cases
  # tagged windows (the slice step below); push, schedule and workflow_dispatch run the full suite.
  gates-windows-guard:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
    # 2x the slowest green step (382 s) is 764 s; 15 min with setup.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Guard fixture suite
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.scope.outputs.code == 'true' }}
        run: python hooks/test_guard.py

      - name: Guard fixture suite (Windows slice)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.scope.outputs.code == 'true' }}
        env:
          GUARD_TESTS: windows-slice
        run: python hooks/test_guard.py

  gates-windows-merge:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.gates_windows_merge == 'true' || github.event_name != 'pull_request' }}
    # Expected: PR slice about 60 s; full merge suite on push and nightly about 8 min (464 s, plus launcher 31 s, cmd under 25 s). 2x of the full run is 20 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Merge launcher fixture suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python merge/test_launch.py

      - name: Merge tool git-half fixture suite
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.scope.outputs.code == 'true' }}
        run: python merge/test_merge.py

      - name: Merge tool git-half fixture suite (Windows slice)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.scope.outputs.code == 'true' }}
        env:
          MERGE_TESTS: windows-slice
        run: python merge/test_merge.py

      - name: Merge launcher fixture suite (merge.cmd)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python merge/test_cmd.py

  gates-windows-rest:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.gates_windows_rest == 'true' || github.event_name != 'pull_request' }}
    # About 550 s on push (the sweep mutation harness takes about 150 s: runs 37650386161, 37606531387).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Janitor sweep fixture suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python janitor/test_sweep.py

      - name: Janitor sweep mutation harness
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.scope.outputs.sweep == 'true' }}
        run: python janitor/mutate_sweep.py

      - name: Config watch fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_config_watch.py

      - name: Config watch fast-exit suite
        if: ${{ !cancelled() }}
        run: python hooks/test_config_watch_fast_exit.py

      - name: Shared names suite
        if: ${{ !cancelled() }}
        run: python hooks/test_shared_names.py

      - name: Precompact handoff fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_precompact_handoff.py

      - name: Handoff wave-2 fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_handoff_wave2.py

      - name: Decision watch fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_decision_watch.py

      - name: Reply judge fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_reply_judge.py

      - name: SendMessage state fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_sendmessage_state.py

      - name: Question outcome fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_question_outcome.py

      - name: Remove-prompt answer fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_rm_prompt_answer.py

      - name: Agent brief fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_agent_brief.py

      - name: Local time line fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_local_time.py

      - name: Stall watch stop suite
        if: ${{ !cancelled() }}
        run: python hooks/test_stall_watch_stop.py

      - name: CI wake-up fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_ci_wake.py

      - name: Feedback inbox fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_feedback_inbox.py

      - name: Daily note fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_daily_note.py

      - name: Gate wrappers fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_wrappers.py

      - name: Session start notice suite
        if: ${{ !cancelled() }}
        run: python hooks/test_session_start.py

      - name: Stop-hook gate fixture suite
        if: ${{ !cancelled() }}
        run: python lint/test_gates.py

      - name: Ruling home fixture suite
        if: ${{ !cancelled() }}
        run: python hooks/test_ruling_home.py

      - name: Ruling census fixture suite
        if: ${{ !cancelled() }}
        run: python lint/test_ruling_census.py

      - name: Verdict runner fixture suite
        if: ${{ !cancelled() }}
        run: python lint/test_verdict.py

      - name: Unknown-read contract (guard + session_start)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python lint/check_unknown_reads_contract.py

      - name: Janitor triggers fixture suite (SessionEnd hook)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python janitor/test_session_end_sweep.py

      - name: Janitor triggers fixture suite (launchd installer)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python janitor/test_install_launchd.py

      - name: Janitor triggers fixture suite (schtasks installer)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python janitor/test_install_schtasks.py

      - name: Record stamp engine fixture suite
        if: ${{ !cancelled() }}
        run: node actions/stamp/test_stamp.mjs

      - name: Record stamp action fixture suite
        if: ${{ !cancelled() }}
        shell: bash
        run: bash actions/stamp/test_action.sh
