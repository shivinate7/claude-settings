        run: bash .github/scripts/mod-tests.sh

  # The Windows suites run in four jobs (gates-windows, gates-windows-guard, gates-windows-merge, gates-windows-rest), and the guard and merge jobs add shard jobs off pull_request. Six python suites in the gates job need a real Windows box to prove: no other
  # job in this workflow can show whether they pass there. This job runs those
  # suites on Windows and reports the environment first. It is blocking: run
  # 35766479009 went green here for the first time, on its own merit, not through
  # continue-on-error.
  # Every step in all three jobs carries `if: ${{ !cancelled() }}`. Without it, GitHub Actions
  # skips every step after the first failure, even inside a job marked
  # continue-on-error. This job stayed advisory-red at its first failing step for a
  # while, and that hid eleven suites behind it that never ran on Windows at all. A
  # job that stops at its first red step proves nothing about the suites behind it.
  gates-windows:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.gates_windows == 'true' || github.event_name != 'pull_request' }}
    # Cut F moved the guard suite out. Run time since the install.sh leg left is unmeasured; 10 min leaves room.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Report the Windows environment
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "== python --version =="
          python --version

          echo "== ps on PATH, and ps -o lstart= -p <pid> =="
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import tempfile

          ps_path = shutil.which("ps")
          print("shutil.which('ps'):", ps_path)

          pid = os.getpid()
          try:
              result = subprocess.run(
                  ["ps", "-o", "lstart=", "-p", str(pid)],
                  capture_output=True,
                  text=True,
              )
              print("ps exit code:", result.returncode)
              print("ps stdout:", repr(result.stdout))
              print("ps stderr:", repr(result.stderr))
          except Exception as exc:
              print("ps invocation raised:", repr(exc))

          print("== os.symlink, unprivileged ==")
          tmp_dir = tempfile.gettempdir()
          target = os.path.join(tmp_dir, "gates_windows_symlink_target.txt")
          link = os.path.join(tmp_dir, "gates_windows_symlink_link.txt")
          try:
              with open(target, "w") as handle:
                  handle.write("scratch")
              if os.path.exists(link):
                  os.remove(link)
              os.symlink(target, link)
              print("os.symlink succeeded:", link, "->", target)
          except Exception as exc:
              print("os.symlink failed:", repr(exc))
          finally:
              for path in (link, target):
                  try:
                      os.remove(path)
                  except OSError:
                      pass

          print("== tempfile.gettempdir(), read from Python ==")
          print(tempfile.gettempdir())
          PY

          echo "== \$TMPDIR, read from Git Bash =="
          echo "${TMPDIR:-<unset>}"

          echo "== mktemp -d, read from Git Bash =="
          mktemp -d

      # The guard suite runs in gates-windows-guard. No Guard mutation harness on Windows: it took 34.5 min
      # there and hit the 45 min timeout (run 37086259145). It runs in gates-mutate-guard (Linux) only.
      # Accepted risk: a Windows-only mutation regression is not caught. No mutant is marked windows-only.

      - name: Load reader against the OS tools
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python hooks/test_guard_load_os.py

      - name: install.sh stays off Windows suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        shell: bash
        run: sh hooks/test_install_windows.sh

      # F1 and G1 run session_start.sh, which runs at every Windows session start. Each fetches with the hook's
      # own 2 s bound (hooks/session_start.sh:15), so a slow runner may kill the fetch. A hang fails this step in 3 min,
      # by name, not the job's 10 (debt install-checkout-flake).
      - name: Session start freshness cases (caseF1, caseG1)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        shell: bash
        timeout-minutes: 3
        run: sh hooks/test_install_src.sh caseF1 caseG1

      - name: Mod and map-skill tests
        if: ${{ !cancelled() && needs.scope.outputs.mods == 'true' }}
        shell: bash
        run: bash .github/scripts/mod-tests.sh

  # The mutation harness for the guard, moved off `gates` by cut F so it runs in parallel.
  gates-mutate-guard:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
    # 2x the slowest green step (193 s) is 386 s; 10 min with setup.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Guard mutation harness
        run: python3 hooks/mutate_guard.py

  # The guard fixture suite on Windows, split off gates-windows by cut F. On pull_request it runs only the cases
  # tagged windows (the slice step below), whole, in this job, the required check. Push, schedule and
  # workflow_dispatch run the full suite in shards: shard 1 here, the rest in gates-windows-guard-<i>, which never
  # run on pull_request (the shard switch in hooks/test_guard.py; lint/test_windows_split.py proves each case runs once).
  gates-windows-guard:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.guard == 'true' || github.event_name != 'pull_request' }}
    # Full guard suite off pull_request: 1296 s in one job (run 40293472341). In 2 shards the jobs took 582 s and
    # 679 s (run 40296937814); 20 min is about 1.8x the slower.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Guard fixture suite (shard 1 of 2)
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.scope.outputs.code == 'true' }}
        env:
          GUARD_SHARD: 1/2
        run: python hooks/test_guard.py

      - name: Guard fixture suite (Windows slice)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.scope.outputs.code == 'true' }}
        env:
          GUARD_TESTS: windows-slice
        run: python hooks/test_guard.py

  gates-windows-guard-2:
    runs-on: windows-latest
    needs: scope
    if: ${{ github.event_name != 'pull_request' }}
    # A shard of gates-windows-guard: its figures and cap are there.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Guard fixture suite (shard 2 of 2)
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.scope.outputs.code == 'true' }}
        env:
