        run: python hooks/test_guard.py

  # The merge suites on Windows. The slice runs whole here on pull_request; off pull_request the full git-half
  # suite runs in shards, shard 1 here and the rest in gates-windows-merge-<i> (the shard switch in merge/test_merge.py).
  gates-windows-merge:
    runs-on: windows-latest
    needs: scope
    if: ${{ needs.scope.outputs.gates_windows_merge == 'true' || github.event_name != 'pull_request' }}
    # Full git-half suite off pull_request: about 6.5 s a test on Windows, so about 59 min in one job (run 40293472341).
    # In 5 shards the jobs took 295 s to 520 s (run 40296937814); 15 min is about 1.7x the slowest.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Merge launcher fixture suite
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python merge/test_launch.py

      - name: Merge tool git-half fixture suite (shard 1 of 5)
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.scope.outputs.code == 'true' }}
        env:
          MERGE_SHARD: 1/5
        run: python merge/test_merge.py

      - name: Merge tool git-half fixture suite (Windows slice)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.scope.outputs.code == 'true' }}
        env:
          MERGE_TESTS: windows-slice
        run: python merge/test_merge.py

      - name: Merge launcher fixture suite (merge.cmd)
        if: ${{ !cancelled() && needs.scope.outputs.code == 'true' }}
        run: python merge/test_cmd.py

  gates-windows-merge-2:
    runs-on: windows-latest
    needs: scope
    if: ${{ github.event_name != 'pull_request' }}
    # A shard of gates-windows-merge: its figures and cap are there.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
