name: lane-touched-tests

# A lane PR is a draft, and checks.yml skips every job on a draft (decision draft-until-reviewed), so a test that
# fails on Windows or macOS alone first shows in the batch. This workflow runs only the test files a draft touches,
# on both systems (item 400 a, owner, 2026-11-08 06:08 CST). Every job skips on a ready PR. It is not in checks.yml,
# not in all-jobs-passed and not a required check. The selector is .github/scripts/touched-tests.py: it names each
# touched test it does not run, and exits non-zero on a diff it cannot read.
on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: read

# The draft state is in the group, as in checks.yml: a skipped run on a ready PR must not cancel a draft run.
concurrency:
  group: ${{ github.workflow }}-${{ format('{0}-{1}', github.ref, github.event.pull_request.draft) }}
  cancel-in-progress: true

# Git's auto gc runs detached and writes into a test repo's .git/objects while the test deletes it (same as checks.yml).
env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: gc.auto
  GIT_CONFIG_VALUE_0: "0"
  GIT_CONFIG_KEY_1: maintenance.auto
  GIT_CONFIG_VALUE_1: "false"

jobs:
  touched:
    if: ${{ github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read lets the skip step list the checks runs.
    permissions:
      contents: read
      actions: read
    outputs:
      any: ${{ steps.skip.outputs.any }}
      matrix: ${{ steps.skip.outputs.matrix }}
      commands_windows: ${{ steps.select.outputs.commands_windows }}
      commands_macos: ${{ steps.select.outputs.commands_macos }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 50
          persist-credentials: false

      # touched-tests.py reads one diff, BASE_SHA...HEAD, so the checkout is shallow (R62). The checkout drops its token, so this step
      # passes it for the fetches only, and the step that runs the PR's code gets none. Fetch the base by sha, then deepen until the two
      # commits share a merge base, and only then fetch it all. A fetch that fails fails the step: an unreadable diff is red, never 0.
      - name: Reach the merge base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          # GitHub masks the token, not its base64 form, so mask the form and the header before anything can print them.
          b64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$b64"
          auth="AUTHORIZATION: basic $b64"
          echo "::add-mask::$auth"
          # First argument: the one fetch option. Then the remote and what to fetch.
          fetch() { local opt=$1; shift; git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags "$opt" origin "$@"; }
          head_sha=$(git rev-parse HEAD)
          fetch --depth=50 "$BASE_SHA" || { echo "cannot fetch the base commit $BASE_SHA"; exit 1; }
          tries=0
          until git merge-base "$BASE_SHA" HEAD > /dev/null 2>&1; do
            tries=$((tries + 1))
            if [ "$tries" -gt 20 ]; then
              echo "no merge base within 1000 commits, so fetching the full history"
              fetch --unshallow "$head_sha" "$BASE_SHA" || { echo "cannot fetch the full history"; exit 1; }
              git merge-base "$BASE_SHA" HEAD > /dev/null || { echo "no merge base with the full history"; exit 1; }
              break
            fi
            fetch --deepen=50 "$head_sha" "$BASE_SHA" || { echo "cannot deepen the history"; exit 1; }
          done

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Select the touched tests
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Through env, never in the script text: a branch name is the PR author's text.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # The integration PR is a draft too. Its draft run would run every lane's tests on the batch head, and a red
          # check there would sit on the head the merge tool reads (decision draft-until-reviewed). The lane PRs are
          # the runs that matter; ci-scope.sh's mutation_report skips on the same `batch-` prefix.
          case "${HEAD_REF:-}" in
            batch-*)
              echo "touched-tests: the head branch starts with batch-, so this draft run selects no tests"
              printf '%s\n' 'any=false' 'matrix={"include": []}' 'commands_windows={}' 'commands_macos={}' >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          python .github/scripts/touched-tests.py

      # R58 point 3: the macOS job skips while a batch's checks run is queued or in progress (decision no-merge-during-batch-ci).
      - name: Skip the macOS job while an integration PR run is going
        id: skip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MATRIX: ${{ steps.select.outputs.matrix }}
          ANY: ${{ steps.select.outputs.any }}
        run: python .github/scripts/batch-macos-skip.py

  run:
    name: run (${{ matrix.os }})
    needs: touched
    if: ${{ github.event.pull_request.draft && needs.touched.outputs.any == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # interim stopgap (decision ci-job-caps): both systems ended at the old 10 min cap with no red step (macOS 10.3 min twice, run 43493592401; Windows 10.2 and 10.1 min cap-end jobs, runs 43505306735 and 43510710739); Windows green 7.7 min, macOS green 5.7 min
    # One entry per system that has tests to run: the selector leaves a system out when its list is empty.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.touched.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 50
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      # The map skill's tests load typescript from this checkout's node_modules, as mod-tests.sh does.
      - name: Install the map skill's packages
        if: ${{ contains(matrix.files, 'skills/plain-english-map/') }}
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Every file runs and keeps its exit code, so a red first file hides no other. A file with no runner here is red.
      - name: Run the touched tests
        shell: bash
        env:
          FILES: ${{ matrix.files }}
          # This system's own map of path to interpreter.
          COMMANDS: ${{ matrix.os == 'windows-latest' && needs.touched.outputs.commands_windows || needs.touched.outputs.commands_macos }}
        run: |
          set -u
          # Each line is "path<TAB>cmd", cmd being the interpreter the file's checks.yml run line starts with (this
          # system's selector map). buffer.write keeps the newlines LF on Windows.
          list=$(python -c 'import json, os, sys; c = json.loads(os.environ["COMMANDS"]); sys.stdout.buffer.write(("".join(f + "\t" + c.get(f, "") + "\n" for f in json.loads(os.environ["FILES"]))).encode())') || { echo "cannot read the file list"; exit 1; }
          [ -n "$list" ] || { echo "the file list is empty, but the selector said any=true"; exit 1; }
          # The command is text from a workflow file, so only these fixed forms run, as an array and never through
          # eval. Any other command is printed and the file is red.
          pick_cmd() {
            case "$1" in
              sh|bash|node|python|python3) cmd=("$1") ;;
              "node --test") cmd=(node --test) ;;
              *) echo "no runner for the command '$1'"; return 1 ;;
            esac
          }
          run_one() {
            case "$1" in
              mods/*.test.mjs|mods/*.test.js|mods/*/test_*.mjs|mods/*/check.mjs) pick_cmd "$2" && "${cmd[@]}" "$1" ;;
              skills/plain-english-map/tests/*.test.mjs) pick_cmd "$2" && (cd skills/plain-english-map/tests && "${cmd[@]}" "${1##*/}") ;;
              *.test.mjs|*.test.js|*/test_*.mjs) pick_cmd "$2" && "${cmd[@]}" "$1" ;;
              test_*.mjs) pick_cmd "$2" && "${cmd[@]}" "$1" ;;
              # 77 is a skip: on Windows the PowerShell step below runs it.
              *.test.ps1) if [ "$RUNNER_OS" = Windows ]; then return 77; fi; echo "no PowerShell step on $RUNNER_OS"; return 1 ;;
              *.py) pick_cmd "$2" && "${cmd[@]}" "$1" ;;
              *.sh) pick_cmd "$2" && "${cmd[@]}" "$1" ;;
              *) echo "no runner for $1"; return 1 ;;
            esac
          }
          failed=0
          while IFS=$'\t' read -r f c; do
            echo "::group::$f"
            # No stdin from the loop: a test that reads it would eat the rest of the list.
            if run_one "$f" "$c" < /dev/null; then rc=0; else rc=$?; fi
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then echo "PASS $f"; elif [ "$rc" -eq 77 ] && [ "${f%.test.ps1}" != "$f" ]; then echo "SKIP $f (runs in the PowerShell step)"; else echo "FAIL $f (exit $rc)"; failed=1; fi
          done <<< "$list"
          exit "$failed"

      # The form checks.yml's pointer-windows job uses: shell powershell is Windows PowerShell 5.1. Each test runs in a
      # child powershell and keeps its exit code. The command is text from a workflow file, so only powershell and
      # pwsh run, with fixed arguments.
      - name: Run the touched PowerShell tests
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        env:
          FILES: ${{ matrix.files }}
          COMMANDS: ${{ needs.touched.outputs.commands_windows }}
        run: |
          $commands = $env:COMMANDS | ConvertFrom-Json
          $failed = $false
          # Windows PowerShell 5.1 puts a whole JSON array on the pipeline as one object, so assign it before the loop.
          $files = $env:FILES | ConvertFrom-Json
          foreach ($path in @($files)) {
            if (-not $path.EndsWith('.test.ps1')) { continue }
            $property = $commands.PSObject.Properties[$path]
            $cmd = if ($property) { [string]$property.Value } else { '' }
            if ($cmd -ne 'powershell' -and $cmd -ne 'pwsh') {
              Write-Host "FAIL ${path}: no runner for the command '$cmd'"
              $failed = $true
              continue
            }
            Write-Host "::group::$path"
            # No stdin from the loop: a test that reads it must not eat anything else, as in the bash step.
            $null | & $cmd -NoProfile -ExecutionPolicy Bypass -File $path
            $rc = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($rc -eq 0) { Write-Host "PASS $path" } else { Write-Host "FAIL $path (exit $rc)"; $failed = $true }
          }
          if ($failed) { exit 1 }
