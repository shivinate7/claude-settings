* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body); }
button { font: inherit; color: inherit; }
a { color: var(--acc); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.in { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Repo bar, as on the Cockpit. */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 7; background: var(--hdr); color: var(--on-hdr); }
.hdr .in { padding-block: 6px; min-height: 44px; display: flex; align-items: center; gap: 12px; }
.mark { flex: none; width: 28px; height: 28px; border-radius: 7px; background: var(--on-hdr); color: var(--hdr); display: grid; place-items: center; font: 800 15px/1 var(--wm); }
.who { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.who .repo { margin: 0; font: var(--wmw) 18px/1.2 var(--wm); letter-spacing: var(--wmls); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .copy { flex: none; font-size: 13px; font-weight: 600; padding: 0 8px; border: 1.5px solid currentColor; border-radius: 999px; line-height: 20px; }
.lede { padding-block: 12px 4px; font-size: 14.5px; color: var(--muted); max-width: 70ch; }

/* State shapes: the Cockpit's, plus doing and to-do for roadmap steps. */
.g { display: inline-block; flex: none; width: 12px; height: 12px; }
.g.calm { border: 2px solid var(--calm); border-radius: 50%; }
.g.done { background: var(--good); border-radius: 50%; position: relative; }
.g.done::after { content: ""; position: absolute; left: 4px; top: 1.5px; width: 3px; height: 6px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.g.doing { background: var(--acc); border-radius: 2px; }
.g.todo { border: 2px dashed var(--calm); border-radius: 2px; }

.main3 { padding-block: 12px 40px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "bar detail" "scene detail" "legend detail" "list detail"; align-items: start; }
.bar3 { grid-area: bar; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
#scene { grid-area: scene; }
.legend { grid-area: legend; }
.plain { grid-area: list; }
.detail { grid-area: detail; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 60px); min-width: 0; }
@media (max-width: 960px) {
  .main3 { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "scene" "detail" "legend" "list"; }
  .detail { position: static; }
}

/* View switch. The pressed button shows by a border, so it holds in forced colours. */
.views { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; background: var(--chip); border-radius: 11px; min-width: 0; }
@media (max-width: 400px) { .views button { padding-inline: 8px !important; } }
.views button { min-height: 40px; padding: 4px 12px; font-size: 14.5px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; cursor: pointer; }
.btn:hover { border-color: var(--acc); }
.btn.quiet { border-color: transparent; background: none; color: var(--acc); padding-inline: 4px; }

/* The scene box. Its height fits the visible screen: vh first, svh after it. */
#scene { position: relative; height: 62vh; height: clamp(420px, 62svh, 660px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
@media (max-width: 960px) { #scene { height: 56vh; height: clamp(320px, 56svh, 460px); } }
#scene:focus-visible { outline-offset: -3px; }
#scene canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; user-select: none; cursor: grab; }
#scene canvas.drag { cursor: grabbing; }
#scene canvas.over { cursor: pointer; }
.hint { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 128px); padding: 4px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); pointer-events: none; }
.hint .kb { display: none; }
#scene:focus-visible .hint .kb { display: inline; }
#scene:focus-visible .hint .pt { display: none; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.zoom button { width: 44px; height: 44px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 20px/1 var(--mono); cursor: pointer; }
.zoom button:hover { border-color: var(--acc); }

/* Labels drawn over the canvas. They are for sighted use only; the list below holds the same words. */
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lb { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.lb.pill { font: 600 12px/20px var(--mono); padding: 0 7px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; }
.lb.sel { font: 700 13px/24px var(--body); padding: 0 9px; background: var(--ink); color: var(--surface); border: 1px solid var(--ink); border-radius: 6px; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; }
.lb.lead { width: 1.5px; background: var(--ink); }
.lb.gt { font: 700 12.5px/1.2 var(--body); color: var(--muted); text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface), 0 0 3px var(--surface), 0 0 3px var(--surface); }
.lb.gt .ct { font: 600 12px var(--mono); }

/* Notices over or in place of the scene. */
.notice { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 24px; text-align: center; background: color-mix(in srgb, var(--surface) 72%, transparent); }
.notice b { font-size: 17px; }
.notice p { color: var(--muted); max-width: 42ch; font-size: 15px; }
.notice .btn { justify-self: center; }
#scene.dim canvas { opacity: .35; }
#scene.busy .zoom, #scene.busy .hint, #scene.busy .labels { display: none; }
.bar3 button:disabled { opacity: .5; cursor: default; }
#scene.nogl { height: auto; padding: 18px; display: grid; gap: 8px; border-style: dashed; }
#scene.nogl b { font-size: 17px; }
#scene.nogl p { color: var(--muted); max-width: 60ch; }
.load i { justify-self: center; width: 160px; height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; display: block; position: relative; }
.load i::after { content: ""; position: absolute; inset: 0 60% 0 0; background: var(--acc); border-radius: 99px; }
@media (prefers-reduced-motion: no-preference) { .load i::after { animation: slide 1.2s ease-in-out infinite alternate; } }
@keyframes slide { to { inset: 0 0 0 60%; } }

/* Legend: one row per object type, small isometric pictures that follow the theme. */
.legend { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.legend summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 700; font-size: 15px; }
.legend .lg { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 4px 16px; padding: 4px 14px 14px; }
.legend .lgi { display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 0; }
.legend .lgi svg { flex: none; }
.legend h3 { grid-column: 1 / -1; font: 600 13px var(--body); color: var(--muted); padding-top: 6px; }
.ob polygon, .ob path.f, .ob ellipse { stroke: var(--edge); stroke-width: .75; stroke-linejoin: round; }
.ob.open .t, .ob.doing .t { fill: var(--o-top); } .ob.open .l, .ob.doing .l { fill: var(--o-l); } .ob.open .r, .ob.doing .r { fill: var(--o-r); }
.ob.closed .t { fill: var(--c-top); } .ob.closed .l { fill: var(--c-l); } .ob.closed .r { fill: var(--c-r); }
.ob.done .t { fill: var(--d-top); } .ob.done .l { fill: var(--d-l); } .ob.done .r { fill: var(--d-r); }
.ob.todo .t, .ob.todo .l, .ob.todo .r { fill: var(--surface); }
.ob.todo polygon { stroke: var(--calm); stroke-width: 1.5; stroke-dasharray: 4 3; }
.ob.post .t, .ob.post .l, .ob.post .r { fill: var(--muted); }
.ob .ck { fill: none; stroke: var(--good); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ob.done .ck { stroke: var(--surface); }

/* Plain list: the scene's text equivalent, and the whole page when there is no 3D. */
.plain { display: grid; gap: 18px; min-width: 0; }
.plain > h2 { font: 700 19px/1.25 var(--body); }
.plain h3 { font: 700 16px var(--body); display: flex; align-items: center; gap: 8px; }
.plain h3 .ct, .plain h4 .ct { font: 600 13px var(--mono); color: var(--muted); }
.plain h4 { font: 600 14px var(--body); color: var(--muted); margin: 6px 0 0; display: flex; gap: 8px; }
.grp { display: grid; gap: 6px; min-width: 0; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.rows li + li { border-top: 1px solid var(--line); }
.row { width: 100%; min-height: 44px; display: grid; grid-template-columns: 14px 4.5ch minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 12px; border: 0; background: none; text-align: left; cursor: pointer; font-size: 15px; }
.row.step { grid-template-columns: 14px minmax(0, 1fr); }
.row:hover { background: var(--acc-soft); }
.row[aria-pressed="true"] { background: var(--acc-soft); box-shadow: inset 4px 0 0 var(--acc); }
.row .num { font: 600 14px var(--mono); color: var(--acc); font-variant-numeric: tabular-nums; }
.row .tx { min-width: 0; overflow-wrap: anywhere; }
.row .kd { font-size: 13px; color: var(--muted); }
.row .id { display: block; font: 12.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }

/* The Cockpit's card, read-only. */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 14px; align-content: start; min-width: 0; }
.top { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 14px; color: var(--muted); }
.top .num { font: 600 15px var(--mono); color: var(--acc); }
.top .st { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; }
.title { font: 700 clamp(19px, 2vw, 22px)/1.3 var(--body); max-width: 40ch; overflow-wrap: anywhere; }
.opts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.opt { display: grid; gap: 8px; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); }
.opt .head { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.key { flex: none; min-width: 26px; height: 26px; padding-inline: 6px; border-radius: 7px; border: 1.5px solid var(--line); text-align: center; font: 600 13px/23px var(--mono); color: var(--muted); }
.opt .lab { min-width: 0; overflow-wrap: anywhere; font-weight: 700; line-height: 1.3; padding-top: 2px; }
.opt .pick { display: grid; grid-template-columns: auto 1fr; align-items: start; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--gold-soft); color: var(--ink); font-size: 14px; }
.opt .pick b { display: inline-flex; padding-top: 1px; color: var(--gold-ink); }
.multihint, .about { font-size: 14.5px; color: var(--muted); }
ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.sum { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 15px; }
.sum li { display: flex; align-items: center; gap: 8px; }
.sum b { font-variant-numeric: tabular-nums; }

@media (forced-colors: active) { .row[aria-pressed="true"] { outline: 2px solid CanvasText; outline-offset: -2px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<script type="module">
/* ============================================================
   Data: items in the Cockpit's order (rank first, then newest), steps by phase, then order.
   ============================================================ */
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LETTERS = "abcdefghijklmnopqrstuvwxyz";
const byRank = (a, b) => a.rank - b.rank || b.n - a.n;
const items = D.items.map((it) => ({ ...it, id: "i" + it.n, name: it.short || it.title }));
const openD = items.filter((i) => i.status === "open" && i.kind === "decision").sort(byRank);
const openT = items.filter((i) => i.status === "open" && i.kind === "task").sort(byRank);
const closedD = items.filter((i) => i.status === "closed" && i.kind === "decision").sort(byRank);
const closedT = items.filter((i) => i.status === "closed" && i.kind === "task").sort(byRank);
const firstOrder = {};
D.steps.forEach((s) => { firstOrder[s.phase] = Math.min(firstOrder[s.phase] ?? Infinity, s.order); });
const PHASES = Object.keys(firstOrder).sort((a, b) => firstOrder[a] - firstOrder[b]);
const steps = D.steps.slice().sort((a, b) => PHASES.indexOf(a.phase) - PHASES.indexOf(b.phase) || a.order - b.order).map((s, i) => ({ ...s, key: "s:" + s.id, idx: i, step: true }));
const ORDER = [...openD, ...openT, ...closedD, ...closedT].map((i) => i.id).concat(steps.map((s) => s.key));
const byId = {}; items.forEach((i) => (byId[i.id] = i)); steps.forEach((s) => (byId[s.key] = s));
const STEPWORD = { done: "Done", doing: "Doing", todo: "To do" };
const phone = () => innerWidth <= 960;
let sel = null;
let view = phone() ? "items" : "all";

/* ============================================================
   World: one place for every object. x and y are the floor; z is up. An item's footprint is 1 x 1;
   one slab is one option (decision) or one step (task). Status floors: open items stand on a raised
   floor in front, closed ones on a dashed shelf behind it. Shape gives the kind.
   ============================================================ */
const SLAB = 0.3, GAP = 0.06, PITCH = 1.7;
function stack(it, x, y, shape) {
  const n = Math.max(1, it.options.length || it.steps.length);
  return { id: it.id, x, y, w: 1, d: 1, z0: 0, slabs: n, shape, cls: it.status, lab: String(it.n) };
}
function plat(x0, y0, x1, y1, cls, text, count) {
  return { x: x0, y: y0, w: x1 - x0, d: y1 - y0, z0: cls === "plat" ? -0.14 : -0.04, h: cls === "plat" ? 0.14 : 0.04, cls, tag: text ? { text, count } : null };
}
function road(ox, oy, perRow) {
  const out = [], pts = [];
  let prev = null;
  steps.forEach((s, i) => {
    const row = Math.floor(i / perRow), c = i % perRow, col = row % 2 ? perRow - 1 - c : c;
    const x = ox + col * 1.2, y = oy + row * 1.7;
    const h = s.status === "doing" ? 0.5 : s.status === "done" ? 0.14 : 0.06;
    out.push({ id: s.key, x, y, w: 0.8, d: 0.8, z0: 0, h, cls: s.status, step: true });
    pts.push([x + 0.4, y + 0.4]);
    if (s.phase !== prev) {
      const n = steps.filter((t) => t.phase === s.phase).length;
      out.push({ x: x + (row % 2 ? 0.95 : -0.35), y: y - 0.35, w: 0.16, d: 0.16, z0: 0, h: 1.5, cls: "post", tag: { text: s.phase, count: n, top: true } });
      prev = s.phase;
    }
  });
  return { objs: out, pts };
}
function buildWorld() {
  const objs = [];
  const open = [...openD, ...openT], closed = [...closedD, ...closedT];
  objs.push(plat(-0.6, -0.6, 4 * PITCH + 1.6, 2 * PITCH + 1.6, "plat", "Open", open.length));
  objs.push(plat(-0.6, -6.6, 2 * PITCH + 1.6, -2.7, "shelf", "Closed", closed.length));
  open.forEach((it, i) => objs.push(stack(it, (i % 5) * PITCH, Math.floor(i / 5) * PITCH, it.kind === "task" ? "cyl" : "box")));
  closed.forEach((it, i) => objs.push(stack(it, (i % 3) * PITCH, -6.0 + Math.floor(i / 3) * PITCH, it.kind === "task" ? "cyl" : "box")));
  const r = road(10.4, -5.6, 7); objs.push(...r.objs);
  return { objs, pts: r.pts };
}
const WORLD = buildWorld();
const objH = (o) => (o.h != null ? o.h : o.slabs * (SLAB + GAP) - GAP);

/* ============================================================
   Detail card, read-only, and the plain list. Both work with no WebGL.
   ============================================================ */
const sparkle = '<b aria-label="My pick" title="My pick"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M10 4c.7 4.6 2.9 6.8 7.5 7.5-4.6.7-6.8 2.9-7.5 7.5-.7-4.6-2.9-6.8-7.5-7.5C7.1 10.8 9.3 8.6 10 4z"/><path d="M19 2.5c.3 1.8 1 2.5 2.8 2.8-1.8.3-2.5 1-2.8 2.8-.3-1.8-1-2.5-2.8-2.8 1.8-.3 2.5-1 2.8-2.8z"/></svg></b>';
let nogl = false;
function when(iso) {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZoneName: "short" }).formatToParts(new Date(iso));
  const g = (t) => (p.find((x) => x.type === t) || {}).value;
  return g("month") + " " + g("day") + ", " + g("hour") + ":" + g("minute") + " " + g("timeZoneName");
}
function detailHtml() {
  const acts = (center) => `<div class="acts">${center && !nogl ? '<button class="btn" type="button" data-act="center">Center on it</button>' : ""}<button class="btn quiet" type="button" data-act="clear">Clear</button></div>`;
  if (!sel) {
    const st = (k) => steps.filter((s) => s.status === k).length;
    return `<article class="card" aria-labelledby="dh"><h2 class="title" id="dh">Nothing picked</h2>
      <ul class="sum">
        <li><i class="g calm"></i><span><b>${openD.length + openT.length}</b> open items: ${openD.length} decisions, ${openT.length} tasks</span></li>
        <li><i class="g done"></i><span><b>${closedD.length + closedT.length}</b> closed items</span></li>
        <li><i class="g" aria-hidden="true"></i><span><b>${steps.length}</b> roadmap steps: ${st("done")} done, ${st("doing")} doing, ${st("todo")} to do</span></li>

      <p class="about">${nogl ? "Pick a row in the list to see it here." : "Press a block or a tile, or a row in the list, to see it here."}</p>
      <div class="acts"><button class="btn" type="button" data-act="first">Show the top item</button></div></article>`;
  }
  const it = byId[sel];
  if (it.step) {
    const inPhase = steps.filter((s) => s.phase === it.phase), pos = inPhase.indexOf(it) + 1;
    return `<article class="card" aria-labelledby="dh"><div class="top"><span class="num">${esc(it.id)}</span><span class="st"><i class="g ${it.status}"></i>${STEPWORD[it.status]}</span><span>Roadmap step</span></div>
      <h2 class="title" id="dh">${esc(it.title)}</h2>
      <p class="about">Step ${pos} of ${inPhase.length} in the ${esc(it.phase)} phase, and ${it.idx + 1} of ${steps.length} on the whole path.</p>${acts(true)}</article>`;
  }
  const picks = it.pick == null ? [] : Array.isArray(it.pick) ? it.pick : [it.pick];
  const multi = Array.isArray(it.pick);
  const top = `<div class="top"><span class="num">No. ${it.n}</span><span class="st"><i class="g ${it.status === "open" ? "calm" : "done"}"></i>${it.status === "open" ? "Open" : "Closed"}</span><span>${it.kind === "task" ? "Task" : "Decision"}</span><span>Added ${when(it.added)}</span></div>`;
  let body = "";
  if (it.kind === "decision") {
    const hint = multi ? `<p class="multihint">More than one can be picked. My pick is ${picks.length === it.options.length ? "all " + ["", "one", "two", "three", "four", "five"][picks.length] : picks.map((k) => k.toUpperCase()).join(", ")}.</p>` : !picks.length ? '<p class="multihint">No pick from me on this one.</p>' : "";
    body = hint + `<div class="opts">${it.options.map((o, i) => {
      const k = LETTERS[i], pi = picks.indexOf(k);
      return `<div class="opt"><div class="head"><span class="key">${k.toUpperCase()}</span><span class="lab">${esc(o)}</span></div>${pi >= 0 ? `<div class="pick">${sparkle}<span>${multi && pi > 0 ? "Also my pick." : "My pick."}</span></div>` : ""}</div>`;

function listHtml() {
  const irow = (i) => `<li><button class="row" type="button" data-id="${i.id}" aria-pressed="false"><i class="g ${i.status === "open" ? "calm" : "done"}"></i><span class="num">${i.n}</span><span class="tx">${esc(i.name)}</span><span class="kd">${i.kind === "task" ? "Task" : "Decision"}</span></button></li>`;
  const srow = (s) => `<li><button class="row step" type="button" data-id="${s.key}" aria-pressed="false"><i class="g ${s.status}"></i><span class="tx">${esc(s.title)}<span class="id">${esc(s.id)} · ${STEPWORD[s.status]}</span></span></button></li>`;
  const open = [...openD, ...openT], closed = [...closedD, ...closedT];
  return `<h2 id="listH">Everything in the scene, as a list</h2>
    <div class="grp"><h3>Items <span class="ct">${items.length}</span></h3>

      ${PHASES.map((p) => { const ss = steps.filter((s) => s.phase === p); return `<h4>${esc(p)} <span class="ct">${ss.length}</span></h4><ul class="rows">${ss.map(srow).join("")}</ul>`; }).join("")}</div>`;
}

/* Legend: small isometric pictures drawn as SVG with the scene's own token classes, so they follow the theme with no WebGL. */
function legendHtml() {
  const C30 = Math.cos(Math.PI / 6), S = 13, HC = 26;
  const P = (o, x, y, z) => { const dx = x - (o.x + o.w / 2), dy = y - (o.y + o.d / 2); return [26 + (dx - dy) * C30 * S, HC + ((dx + dy) * 0.5 - z) * S]; };
  const pts = (a) => a.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const box = (o, z0, z1) => {
    const B = [[o.x, o.y], [o.x + o.w, o.y], [o.x + o.w, o.y + o.d], [o.x, o.y + o.d]];
    const f = (i, j, cls) => `<polygon class="${cls}" points="${pts([P(o, B[i][0], B[i][1], z0), P(o, B[j][0], B[j][1], z0), P(o, B[j][0], B[j][1], z1), P(o, B[i][0], B[i][1], z1)])}"/>`;
    return f(1, 2, "r") + f(2, 3, "l") + `<polygon class="t" points="${pts(B.map(([a, b]) => P(o, a, b, z1)))}"/>`;
  };
  const cyl = (o, z0, z1) => {
    const r = o.w / 2, [cx, b] = P(o, o.x + r, o.y + r, z0), t = P(o, o.x + r, o.y + r, z1)[1];
    const rx = Math.SQRT2 * r * C30 * S, ry = Math.SQRT2 * r * 0.5 * S;
    return `<path class="f l" d="M${cx - rx},${t} L${cx - rx},${b} A${rx},${ry} 0 0 0 ${cx},${b + ry} L${cx},${t + ry} Z"/><path class="f r" d="M${cx},${t + ry} L${cx},${b + ry} A${rx},${ry} 0 0 0 ${cx + rx},${b} L${cx + rx},${t} Z"/><ellipse class="t" cx="${cx}" cy="${t}" rx="${rx}" ry="${ry}"/>`;
  };
  const draw = (o) => {
    let s = "", top = o.z0;

  function resize() {
    const r = scene.getBoundingClientRect(); if (!r.width || !r.height) return;
    if (Math.abs(r.width - W) < 1 && Math.abs(r.height - H) < 1 && gl3.ready) return;
    W = r.width; H = r.height;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(W, H, false);
    const asp = W / H; camera.left = -F * asp; camera.right = F * asp; camera.top = F; camera.bottom = -F;
    fit();
  }
  new ResizeObserver(resize).observe(scene);

  /* Pressing: a short press with no drag picks the object under the pointer. A pinch zooms. */
  const ray = new T.Raycaster(), ndc = new T.Vector2();
  function hitAt(e) {
    const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -(((e.clientY - r.top) / r.height) * 2 - 1));
    ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(hits, false)[0]; return h ? h.object.userData.id : null;
  }
  const ptrs = new Map(); let press = null, pinch = 0;
  canvas.addEventListener("pointerdown", (e) => {
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) press = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
    else { press = null; pinch = Math.hypot(...[...ptrs.values()].reduce((a, p) => [a[0] - p[0], a[1] - p[1]], [0, 0])); }
  });
  canvas.addEventListener("pointermove", (e) => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) {
      const [p, q] = [...ptrs.values()], d = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (pinch) { zoomBy(d / pinch); } pinch = d; return;
    }
    if (press && press.id === e.pointerId && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 6) { press.moved = true; canvas.classList.add("drag"); }
    if (e.pointerType === "mouse" && !press) canvas.classList.toggle("over", !!hitAt(e));
  });
  const up = (e) => {
    const hadPress = press && press.id === e.pointerId && !press.moved && e.type === "pointerup";
    if (hadPress) { const id = hitAt(e); if (id) pick(id); }
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0; if (!ptrs.size) press = null; canvas.classList.remove("drag");
  };
  canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("wheel", (e) => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });

  function zoomBy(f) { zoomRel = Math.max(0.5, Math.min(3, zoomRel * f)); setZoom(); request(); }
  function turn(d) { const off = camera.position.clone().sub(controls.target).applyAxisAngle(new T.Vector3(0, 1, 0), d); camera.position.copy(controls.target).add(off); controls.update(); request(); }
  scene.addEventListener("keydown", (e) => {
    if (e.target !== scene) return;
    const i = ORDER.indexOf(sel), go = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (go) { e.preventDefault(); pick(ORDER[(i + go + ORDER.length) % ORDER.length] || ORDER[0]); }
    else if (e.key === "Home") { e.preventDefault(); pick(ORDER[0]); }
    else if (e.key === "End") { e.preventDefault(); pick(ORDER[ORDER.length - 1]); }
    else if (e.key === "Escape") pick(null);
    else if (e.key === "[" || e.key === "]") turn(e.key === "]" ? 0.2 : -0.2);
    else if (e.key === "+" || e.key === "=") zoomBy(1.15);
    else if (e.key === "-") zoomBy(1 / 1.15);
  });

  /* The scene lost: words over the dimmed scene, the list still works, and "Draw it again" restores it. */
  const setBusy = (on) => { scene.classList.toggle("busy", on); scene.classList.toggle("dim", on); document.querySelectorAll(".bar3 button").forEach((b) => (b.disabled = on)); };
  canvas.addEventListener("webglcontextlost", (e) => {
    e.preventDefault(); lost = true; setBusy(true);
    if (!scene.querySelector(".notice")) scene.insertAdjacentHTML("beforeend", `<div class="notice" role="alert"><b>The 3D view stopped</b><p>The graphics card dropped the scene. It comes back on its own when the card does. The list below still works.</p><button class="btn" type="button" data-act="restore">Draw it again</button></div>`);
  });
  function restore() { lost = false; setBusy(false); scene.querySelector(".notice")?.remove(); resize(); draw(); }
  canvas.addEventListener("webglcontextrestored", restore);

  /* A change of theme redraws with the new token colours. */
  const retheme = () => { applyPalette(); syncSelection(); request(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  Object.assign(gl3, {
    sync() { syncSelection(); request(); },
    fit, zoomBy, turn,
    center() {
      const o = objs[sel]; if (!o) return;
      camera.updateMatrixWorld(); place(curAz(), new T.Vector3(o.x + o.w / 2, o._ztop / 2, o.y + o.d / 2));
      shift(0, (PAD.top - PAD.bot) / 2); zoomRel = Math.max(zoomRel, 1.6); setZoom(); request(); scene.scrollIntoView({ block: "nearest" });
    },
    reset() { place(AZ0, controls.target); fit(); },
    restore() {
      /* The extension is read at start, because a lost context hands out none. With no way to ask, the notice stays until the browser restores the context itself. */
      if (!glCtx.isContextLost()) restore(); else if (loseExt) loseExt.restoreContext();
    },
  });

  /* Hooks for the check script (docs/plans/3d-browser-dummy/check.mjs). The page itself does not use them. */
  window.__cockpit3d = {
    renderer, canvas, info: renderer.info, render: draw,
    setView, ids: () => ORDER.slice(),
    screenPos(id) { const o = objs[id]; if (!o) return null; camera.updateMatrixWorld(); const p = toPx(o.x + o.w / 2, o._ztop * 0.6 + o._g.position.y, o.y + o.d / 2), r = canvas.getBoundingClientRect(); return { x: r.left + p[0], y: r.top + p[1] }; },
    loseContext() { loseExt?.loseContext(); },
  };
  resize(); draw();
}
boot3d();
</script>
