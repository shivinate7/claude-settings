name: CI done comment
description: >
  Posts one PR comment when a run ends with a failed or cancelled job. A watched PR wakes its
  session on a new comment, and a run with a red job sends no "all checks done" wake. A green run
  posts nothing. The caller job MUST set `needs: [...]` (every other job) and
  an `if:` of `!cancelled()` on a pull_request event, with
  `permissions: {pull-requests: write}`. A cancelled run is superseded, so it posts nothing.
inputs:
  needs:
    description: "Pass toJSON(needs) from the calling job, written as an expression in its with: block."
    required: true
  strict:
    description: "'true': a failed post fails the step (the caller acts on the post). Default: a failed post only warns."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Comment when a job ended red
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS: ${{ inputs.needs }}
        CI_DONE_STRICT: ${{ inputs.strict == 'true' && '1' || '' }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      run: bash "${{ github.action_path }}/comment.sh"
