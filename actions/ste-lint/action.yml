name: STE lint
description: >
  Run lint/ste_lint.py against changed markdown (scope changed, default) or the whole
  tree (scope all). Scope changed gates on the added or changed lines of the diff only;
  findings on untouched lines of a changed file are reported but never fail the build.
  The caller needs actions/checkout with fetch-depth 0 so the changed-files diff can
  reach the base branch.
inputs:
  scope:
    description: "'changed' (default) diffs against the base branch. 'all' lints every matching file."
    required: false
    default: changed
  fail:
    description: "'true' (default) fails the step at error severity. 'false' never fails, report only."
    required: false
    default: "true"
  paths:
    description: Glob passed to `git ls-files` when scope is 'all'.
    required: false
    default: "**/*.md"
  exclude:
    description: >
      Newline- or comma-separated git pathspecs to leave out of both scopes, added to the
      patterns in the repo's .ste-lint-exclude (one pathspec per line, at the repo root).
    required: false
    default: ""
  changed_paths:
    description: >
      Pathspec passed to `git diff --name-only` when scope is 'changed', selecting which
      changed files count. Same style as 'paths'. The default keeps today's Markdown-only
      behavior for every existing caller.
    required: false
    default: "*.md"
  decisions-dir:
    description: >
      Folder of D-nnn decision records. STE001 then stops counting the words a gloss
      tool inserts after a citation. Empty, the default: the decisions folder that
      lint/layout.json names. The collapse turns on only when the folder exists, so a
      repository with none sees no change. Pass off to turn it off.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Lint markdown
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_NAME: ${{ github.ref_name }}
        SCOPE: ${{ inputs.scope }}
        FAIL: ${{ inputs.fail }}
        PATHS_GLOB: ${{ inputs.paths }}
        EXCLUDE: ${{ inputs.exclude }}
        CHANGED_PATHS_GLOB: ${{ inputs.changed_paths }}
        DECISIONS_DIR: ${{ inputs.decisions-dir }}
      run: |
        bash "${{ github.action_path }}/run.sh"
