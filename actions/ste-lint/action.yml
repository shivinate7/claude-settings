name: STE lint
description: >
  Run lint/ste_lint.py against changed markdown (scope changed, default) or the whole
  tree (scope all). Scope changed gates on the added or changed lines of the diff only;
  findings on untouched lines of a changed file are reported but never fail the build.
  The caller needs actions/checkout with fetch-depth 0 so the changed-files diff can
  reach the base branch.
inputs:
  scope:
    description: "'changed' (default) diffs against the base branch. 'all' lints every matching file."
    required: false
    default: changed
  fail:
    description: "'true' (default) fails the step at error severity. 'false' never fails, report only."
    required: false
    default: "true"
  paths:
    description: Glob passed to `git ls-files` when scope is 'all'.
    required: false
    default: "**/*.md"
  exclude:
    description: >
      Newline- or comma-separated git pathspecs to leave out of both scopes. Use this for
      a generated file the linter should never see.
    required: false
    default: ""
  changed_paths:
    description: >
      Pathspec passed to `git diff --name-only` when scope is 'changed', selecting which
      changed files count. Same style as 'paths'. The default keeps today's Markdown-only
      behavior for every existing caller.
    required: false
    default: "*.md"
  decisions-dir:
    description: >
      Folder of D-nnn decision entries. STE001 then stops counting the words a gloss
      tool inserts after a citation. Optional: the collapse turns on only when the
      folder exists, so a repository with none sees no change. Pass '' to turn it off.
    required: false
    default: "docs/decisions"
runs:
  using: composite
  steps:
    - name: Lint markdown
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_NAME: ${{ github.ref_name }}
        SCOPE: ${{ inputs.scope }}
        FAIL: ${{ inputs.fail }}
        PATHS_GLOB: ${{ inputs.paths }}
        EXCLUDE: ${{ inputs.exclude }}
        CHANGED_PATHS_GLOB: ${{ inputs.changed_paths }}
        DECISIONS_DIR: ${{ inputs.decisions-dir }}
      run: |
        set -euo pipefail
        # Needs actions/checkout with fetch-depth 0: scope 'changed' diffs against the
        # base branch, and a shallow clone would not carry that history.
        LINTER="${{ github.action_path }}/../../lint/ste_lint.py"

        # 'exclude' takes newline- or comma-separated pathspecs. Trim each, skip empty
        # lines, turn each into git's ':(exclude)<pattern>' pathspec magic.
        EXCLUDE_PATTERNS=()
        EXCLUDE_PATHSPECS=()
        while IFS= read -r p; do
          p="$(echo "$p" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          [ -n "$p" ] || continue
          EXCLUDE_PATTERNS+=("$p")
          EXCLUDE_PATHSPECS+=(":(exclude)$p")
        done < <(echo "$EXCLUDE" | tr ',' '\n')

        RAW_FILES=()
        FILES=()
        if [ "$SCOPE" = "all" ]; then
          # ':(glob)' turns on real double-star matching. Without it, git's default
          # pathspec needs a literal '/' for '**/', so a root file such as README.md
          # never matches '**/*.md' (measured).
          while IFS= read -r f; do
            [ -n "$f" ] && RAW_FILES+=("$f")
          done < <(git ls-files -- ":(glob)$PATHS_GLOB")
          while IFS= read -r f; do
            [ -n "$f" ] && FILES+=("$f")
          done < <(git ls-files -- ":(glob)$PATHS_GLOB" "${EXCLUDE_PATHSPECS[@]}")
        else
          if [ -n "$BASE_REF" ]; then
            BASE="$BASE_REF"
          else
            BASE="$DEFAULT_BRANCH"
          fi
          if ! git rev-parse --verify -q "refs/remotes/origin/$BASE" >/dev/null; then
            git fetch origin "$BASE" --depth=1
          fi
          if [ -z "$BASE_REF" ] && [ "$REF_NAME" = "$BASE" ]; then
            # A push to the default branch itself has no other side to diff against.
            RANGE="HEAD~1..HEAD"
          else
            RANGE="origin/$BASE...HEAD"
          fi
          while IFS= read -r f; do
            [ -n "$f" ] && RAW_FILES+=("$f")
          done < <(git diff --name-only --diff-filter=AMR "$RANGE" -- "$CHANGED_PATHS_GLOB")
          while IFS= read -r f; do
            [ -n "$f" ] && FILES+=("$f")
          done < <(git diff --name-only --diff-filter=AMR "$RANGE" -- "$CHANGED_PATHS_GLOB" "${EXCLUDE_PATHSPECS[@]}")
        fi

        # In-script fallback: a caller that passes a plain glob (no ':(exclude)' magic
        # understanding needed) still gets it dropped here.
        if [ ${#EXCLUDE_PATTERNS[@]} -gt 0 ] && [ ${#FILES[@]} -gt 0 ]; then
          KEPT=()
          for f in "${FILES[@]}"; do
            DROP=0
            for pattern in "${EXCLUDE_PATTERNS[@]}"; do
              if [[ "$f" == $pattern ]]; then
                DROP=1
                break
              fi
            done
            [ "$DROP" -eq 0 ] && KEPT+=("$f")
          done
          FILES=("${KEPT[@]}")
        fi

        EXCLUDED_COUNT=$((${#RAW_FILES[@]} - ${#FILES[@]}))

        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

        if [ ${#FILES[@]} -eq 0 ]; then
          echo "ste-lint: no markdown changed"
          {
            echo "### STE lint"
            echo
            echo "No markdown changed."
            if [ "$EXCLUDED_COUNT" -gt 0 ]; then
              echo
              echo "Excluded: $EXCLUDED_COUNT file(s)."
            fi
          } >> "$SUMMARY"
          exit 0
        fi

        echo "ste-lint: ${#FILES[@]} file(s) in scope, $EXCLUDED_COUNT excluded"
        printf '  %s\n' "${FILES[@]}"

        JSON_OUT="$(mktemp)"
        python3 "$LINTER" --no-color --format json --fail-on never \
          --decisions-dir "$DECISIONS_DIR" "${FILES[@]}" > "$JSON_OUT"

        if [ "$SCOPE" = "all" ]; then
          # Report-mode audit: whole-file findings, never fails the build.
          # A single Python statement, semicolon-joined and on one physical line, so the
          # YAML block scalar's own indentation never lands inside the Python source (an
          # indented top-level statement is a Python syntax error).
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); s = d["summary"]; excluded = int(sys.argv[2]); print("### STE lint"); print(); print("Files checked: %d. Excluded: %d. Errors: %d. Warnings: %d." % (d["files"], excluded, s["error"], s["warning"])); print(); print("| File | Line | Rule | Message |"); print("| --- | --- | --- | --- |"); [print("| %s | %d | %s | %s |" % (f["path"], f["line"], f["code"], f["message"].replace("|", "\\|").replace("\n", " "))) for f in d["findings"][:50]]' "$JSON_OUT" "$EXCLUDED_COUNT" >> "$SUMMARY"
          exit 0
        fi

        # Decision 4: changed lines only. Build a map of file -> added line numbers from a
        # zero-context unified diff, "@@ -a,b +c,d @@" giving c..c+d-1 (d defaults to 1, d
        # of 0 means the hunk added no lines). Written to a script file, not a `python3 -c`
        # multi-line string, so the YAML block scalar's own indentation never lands inside
        # the Python source (an indented top-level statement is a Python syntax error).
        HUNK_MAP_PY="$(mktemp)"
        cat > "$HUNK_MAP_PY" <<'PYEOF'
        import re, sys
        cur = None
        out = []
        header = re.compile(r"^\+\+\+ b/(.*)$")
        hunk = re.compile(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@")
        for line in sys.stdin:
            line = line.rstrip("\n")
            m = header.match(line)
            if m:
                cur = m.group(1)
                continue
            m = hunk.match(line)
            if m and cur is not None:
                start = int(m.group(1))
                count = int(m.group(2)) if m.group(2) is not None else 1
                for n in range(start, start + count):
                    out.append("%s\t%d" % (cur, n))
        print("\n".join(out))
        PYEOF

        HUNKS="$(mktemp)"
        git diff -U0 "$RANGE" -- "${FILES[@]}" | python3 "$HUNK_MAP_PY" > "$HUNKS"

        # Split findings into in-hunk (gated) and out-of-hunk (pre-existing, report only).
        # A finding without a line number counts as in-hunk.
        SPLIT_PY="$(mktemp)"
        cat > "$SPLIT_PY" <<'PYEOF'
        import json, sys
        json_path, hunks_path, excluded, fail = sys.argv[1:5]
        d = json.load(open(json_path))
        added = set()
        with open(hunks_path, encoding="utf-8") as f:
            for line in f:
                line = line.rstrip("\n")
                if not line:
                    continue
                path, n = line.rsplit("\t", 1)
                added.add((path, int(n)))
        in_hunk, out_hunk = [], []
        for finding in d["findings"]:
            line = finding.get("line")
            if line is None or (finding["path"], line) in added:
                in_hunk.append(finding)
            else:
                out_hunk.append(finding)

        def sev_count(items, sev):
            return sum(1 for f in items if f["severity"] == sev)

        def table(items):
            print("| File | Line | Rule | Message |")
            print("| --- | --- | --- | --- |")
            for f in items[:50]:
                print("| %s | %s | %s | %s |" % (
                    f["path"], f.get("line", ""), f["code"],
                    f["message"].replace("|", "\\|").replace("\n", " ")))

        print("### STE lint")
        print()
        print("Files checked: %d. Excluded: %d." % (d["files"], int(excluded)))
        print("Gated, changed lines: %d error(s), %d warning(s)."
              % (sev_count(in_hunk, "error"), sev_count(in_hunk, "warning")))
        print("Pre-existing, not gated: %d error(s), %d warning(s)."
              % (sev_count(out_hunk, "error"), sev_count(out_hunk, "warning")))
        print()
        table(in_hunk)
        if out_hunk:
            print()
            print("#### Pre-existing, not gated")
            print()
            table(out_hunk)

        sys.exit(1 if (fail == "true" and sev_count(in_hunk, "error") > 0) else 0)
        PYEOF

        set +e
        python3 "$SPLIT_PY" "$JSON_OUT" "$HUNKS" "$EXCLUDED_COUNT" "$FAIL" >> "$SUMMARY"
        GATE_EXIT=$?
        set -e

        exit "$GATE_EXIT"
