name: Record stamp
description: >
  Check the records (CLAUDE.md rule git-slug-then-claim-number: "Never allocate a numbered
  record on a branch. Write a slug. Claim the number at merge."). Mode "check" runs
  stamp.mjs --check and nothing else, on any branch or pull request, with contents: read. A
  pending record on the default branch fails it. The claim itself runs in merge/merge.py. The
  caller owns the config file (stamp.mjs's schema, see README.md).
inputs:
  mode:
    description: >
      "check" runs stamp.mjs --check against the base branch and writes nothing. It is the only
      mode. Any other value is refused.
    required: false
    default: "check"
  config:
    description: Path to the stamp config file, relative to the repository root.
    required: true
  base:
    description: >
      The ref the branch question reads as the base, passed to stamp.mjs as `--base`, and only
      when it is set. When empty, the engine uses origin/$GITHUB_BASE_REF on a pull request,
      else origin/<defaultBranch>.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check records
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CONFIG: ${{ inputs.config }}
        BASE: ${{ inputs.base }}
        STAMP_JS: ${{ github.action_path }}/stamp.mjs
      run: bash "${{ github.action_path }}/run.sh"
