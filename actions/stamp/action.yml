name: Record stamp
description: >
  Claim the number at merge (CLAUDE.md rule git-slug-then-claim-number: "Never allocate a
  numbered record on a branch. Write a slug. Claim the number at merge."). Mode "stamp"
  numbers every record still pending in this tree, rewrites its cites, runs the caller's own
  generator and gate, and pushes. It refuses to run off the default branch. On a rejected push
  it re-derives from the fresh tree and re-gates, up to 3 times, never a rebase of an
  already-gated commit. Mode "check" runs stamp.mjs --check and nothing else, on any branch or
  pull request, with contents: read. The caller owns the config file (stamp.mjs's schema, see
  README.md) and, for mode "stamp", the concurrency lock. A composite action cannot hold one,
  so the caller's workflow needs `concurrency: {group: <name>, cancel-in-progress: false}` on
  the job that runs this.
inputs:
  mode:
    description: >
      "stamp" (default) numbers, gates, commits and pushes, on the default branch only.
      "check" runs stamp.mjs --check against the base branch and writes nothing. It needs no
      gate-command.
    required: false
    default: "stamp"
  config:
    description: Path to the stamp config file, relative to the repository root.
    required: true
  base:
    description: >
      Mode "check" only. The ref the branch question reads as the base, passed to stamp.mjs as
      `--base`, and only when it is set. When empty, the engine uses origin/$GITHUB_BASE_REF on
      a pull request, else origin/<defaultBranch>.
    required: false
    default: ""
  gate-command:
    description: >
      Mode "stamp" only, and required there. The command that must pass on the stamped tree
      before it is pushed, e.g. "npm test && npm run lint". Run through `bash -c`.
    required: false
    default: ""
  regenerate:
    description: >
      Optional command that runs after --stamp writes the tree and before the gate, in the
      same commit. It is the caller's own generator (a refs/pointer pass, an index table, a
      lookup file). Each repo keeps its own generator; this input only decides when it runs.
      Skipped when nothing was pending, the same as the gate. Run through `bash -c`.
    required: false
    default: ""
  commit-subject:
    description: >
      Template for the commit subject. "{ids}" expands to the space-separated ids this run
      stamped, e.g. "Stamp {ids}" becomes "Stamp D-042 D-043".
    required: false
    default: "Stamp {ids}"
  bot-name:
    required: false
    default: "record-stamp[bot]"
  bot-email:
    required: false
    default: "record-stamp@users.noreply.github.com"
runs:
  using: composite
  steps:
    - name: Stamp, gate, commit and push, or check
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CONFIG: ${{ inputs.config }}
        BASE: ${{ inputs.base }}
        REGENERATE_COMMAND: ${{ inputs.regenerate }}
        GATE_COMMAND: ${{ inputs.gate-command }}
        SUBJECT_TEMPLATE: ${{ inputs.commit-subject }}
        BOT_NAME: ${{ inputs.bot-name }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        STAMP_JS: ${{ github.action_path }}/stamp.mjs
      run: bash "${{ github.action_path }}/run.sh"
