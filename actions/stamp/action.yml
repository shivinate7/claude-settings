name: Record stamp
description: >
  Number every record still pending in this tree (CLAUDE.md rule git-slug-then-claim-number:
  "Never allocate a numbered record on a branch. Write a slug. Claim the number at merge."),
  rewrite its cites, run the caller's own gate, and push. Refuses to run off the default
  branch. On a rejected push it rebases, re-stamps and re-gates, and retries up to 3 times.
  The caller owns the config file (stamp.mjs's schema, see README.md) and the concurrency
  lock — a composite action cannot hold one, so the caller's workflow needs
  `concurrency: {group: <name>, cancel-in-progress: false}` on the job that runs this.
inputs:
  config:
    description: Path to the stamp config file, relative to the repository root.
    required: true
  gate-command:
    description: >
      The command that must pass on the stamped tree before it is pushed, e.g.
      "npm test && npm run lint". Run through `bash -c`, so `&&` and `;` both work.
    required: true
  commit-subject:
    description: >
      Template for the commit subject. "{ids}" expands to the space-separated ids this run
      stamped, e.g. "Stamp {ids}" becomes "Stamp D-042 D-043".
    required: false
    default: "Stamp {ids}"
  bot-name:
    required: false
    default: "record-stamp[bot]"
  bot-email:
    required: false
    default: "record-stamp@users.noreply.github.com"
runs:
  using: composite
  steps:
    - name: Stamp, gate, commit and push
      shell: bash
      env:
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CONFIG: ${{ inputs.config }}
        GATE_COMMAND: ${{ inputs.gate-command }}
        SUBJECT_TEMPLATE: ${{ inputs.commit-subject }}
        BOT_NAME: ${{ inputs.bot-name }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        STAMP_JS: ${{ github.action_path }}/stamp.mjs
      run: bash "${{ github.action_path }}/run.sh"
