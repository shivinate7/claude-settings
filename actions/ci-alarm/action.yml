name: CI alarm
description: >
  Opens (or comments on) one issue when the newest completed run of any workflow on a branch is
  red, judged per workflow and per event group (events.json: push and dispatch together, schedule
  apart). A failed run with a red job is cleared across groups only by a newer green run of the other
  group that is its group's newest and passed every job of the failed run (exact names), so a green nightly that ran
  other jobs never hides a red push. A job the failed run did not fail is left out of that need when its job-level `if:` has a
  top-level `&&` conjunct `github.event_name == 'X'` for another event than the green run's (`all-jobs-passed` and `ci-done` run on
  pull_request only), so a newer green push run clears a red nightly. Cost: per clear candidate one read of the workflow file at the green
  run's head (contents API, once), besides the jobs reads; the step needs python3 and runs `clear_rule.py` from the action path.
  A failed run that no run clears is also lifted by a live revert on the branch (`revert_rule.py`, the one home of the rule, which
  merge.py reads too): a commit reachable from the branch, other than the run's head, with `This reverts commit <head sha>` (40 hex)
  in its message, not net-reverted (a revert of a revert undoes it, so an odd chain lifts). Each failed run needs its own revert. It never
  clears a cancelled run, a re-run in flight or a failed read (unknown). Cost per alarm, API calls: per failed run with no clearing run
  one `search/commits` read and one `compare` read per revert link (a revert chain adds one search and one compare per link); none when
  every run is green. Commit search reads the default branch only, so a `branch` that is not the default finds no revert: it alarms and
  never clears.
  Runs of other events, and of deleted workflows, are not judged. A failed read or write is "unknown", never red. Call it from a scheduled
  workflow with `permissions: {actions: read, contents: read, issues: write}` (contents: the clear reads the workflow file); it needs no checkout. A merge-triggered failure shows on no PR, so main can sit red unnoticed.

  Opt-in `dropped-start: 'true'` also flags an open, ready pull request, updated over 300 s ago, whose head
  commit has no real `all-jobs-passed` run (a dropped `pull_request` event; a skipped run counts as absent).
  It posts one comment per head sha, with the remedy: `gh pr ready N --undo`, then
  `gh pr ready N`; never an empty commit. It needs `issues: write` (comments), `pull-requests: read` and
  `checks: read` besides the above. Cost per call: one pulls read per 100 open PRs; per ready, settled PR one check-runs read;
  per PR with no run, one comments read per 100 comments and at most one comment write. It starts no long-lived
  process and writes no file or timer of its own: it runs inside the caller's existing scheduled workflow.
  The caller's `pull_request` trigger must include the `ready_for_review` type, or the remedy starts no run.
  The caller sets a `concurrency` group, so that two overlapping runs do not both post. Banchi's workflow uses
  `concurrency: {group: dropped-start-alarm, cancel-in-progress: false}`.
inputs:
  branch:
    description: Branch to watch.
    required: false
    default: main
  dropped-start:
    description: "'true' also flags ready pull requests whose all-jobs-passed run never started."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Alarm on a red branch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ inputs.branch }}
        SELF: ${{ github.workflow }}
      run: bash "${{ github.action_path }}/alarm.sh"
    - name: Flag pull requests whose check run never started
      if: inputs.dropped-start == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/dropped.sh"
