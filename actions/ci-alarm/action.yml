name: CI alarm
description: >
  Opens (or comments on) one issue when the newest completed run of any workflow on a branch is
  red, judged per workflow and per event group (events.json: push and dispatch together, schedule
  apart). A red run is cleared across groups only by a newer green run of the other group that is
  its group's newest and passed every job of the red run (exact names), so a green nightly that ran
  other jobs never hides a red push. Runs of other events, and of deleted workflows, are not judged. A failed read or write is "unknown", never red. Call it from a scheduled
  workflow with `permissions: {actions: read, issues: write}`; it needs no checkout. A merge-triggered failure shows on no PR, so main can sit red unnoticed.
inputs:
  branch:
    description: Branch to watch.
    required: false
    default: main
runs:
  using: composite
  steps:
    - name: Alarm on a red branch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ inputs.branch }}
        SELF: ${{ github.workflow }}
      run: bash "${{ github.action_path }}/alarm.sh"
