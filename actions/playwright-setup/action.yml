name: Playwright setup
description: >
  Installs the Playwright that a lockfile pins, and its browsers. By default it runs no apt step. The
  runner image already has Chromium's system libraries, and `--with-deps` once spent more than 11 min
  on a slow apt mirror. WebKit and Firefox lack libraries there, so a caller may opt in with
  `system-deps`. That apt step runs on Linux only, under a 5 min cap.
  A missing library fails the suite when it cannot launch a browser, never skips it.
  The browser download is cached by the pinned Playwright version, the browsers and the OS. On GitHub-hosted
  Linux the key holds the OS release. A self-hosted macOS or Windows runner with no ImageOS keys on the OS
  name only, so a runner upgrade there can still restore stale browsers.
  It needs playwright-core reachable from package-dir, so a pnpm strict layout is not supported.
  Its commands live in install.sh, which this action and bin/ci-job both call. The action runs its `deps` and `browsers`
  phases around the browser cache step. bin/ci-job runs its `local` phase (npm ci and the pin, no browser, no apt).
inputs:
  package-dir:
    description: "The folder whose package.json and package-lock.json pin playwright or @playwright/test."
    required: false
    default: "."
  browsers:
    description: "Space-separated browser names for `playwright install`."
    required: false
    default: "chromium"
  system-deps:
    description: "Opt-in apt. Space-separated browsers whose system libraries to install, on Linux only: webkit, firefox. Chromium or any other name fails the job. Default empty: no apt."
    required: false
    default: ""
  npm-ci:
    description: "Set to false when an earlier step already ran npm ci in package-dir."
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install the pinned Playwright and read its version and the OS id
      id: pin
      shell: bash
      env:
        DIR: ${{ inputs.package-dir }}
        NPM_CI: ${{ inputs.npm-ci }}
      run: bash "${{ github.action_path }}/install.sh" deps

    - name: Cache the browsers
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pin.outputs.os }}-${{ steps.pin.outputs.version }}-${{ inputs.browsers }}

    # No --with-deps, on purpose. On a cache hit this only checks the browsers are there. The opt-in system-deps
    # step is inside install.sh: it runs for WebKit and Firefox only, under a 300 s cap. Composite steps have no timeout-minutes.
    - name: Install the browsers
      shell: bash
      env:
        CLI: ${{ steps.pin.outputs.cli }}
        BROWSERS: ${{ inputs.browsers }}
        DEPS: ${{ inputs.system-deps }}
        CAP: "300"
      run: bash "${{ github.action_path }}/install.sh" browsers
