name: Playwright setup
description: >
  Installs the Playwright that a lockfile pins, and its browsers. By default it runs no apt step. The
  runner image already has Chromium's system libraries, and `--with-deps` once spent more than 11 min
  on a slow apt mirror. WebKit and Firefox lack libraries there, so a caller may opt in with
  `system-deps`. That apt step runs on Linux only, under a 5 min cap.
  A missing library fails the suite when it cannot launch a browser, never skips it.
  The browser download is cached by the pinned Playwright version.
  It needs playwright-core reachable from package-dir, so a pnpm strict layout is not supported.
inputs:
  package-dir:
    description: "The folder whose package.json and package-lock.json pin playwright or @playwright/test."
    required: false
    default: "."
  browsers:
    description: "Space-separated browser names for `playwright install`."
    required: false
    default: "chromium"
  system-deps:
    description: "Opt-in apt. Space-separated browsers whose system libraries to install, on Linux only: webkit, firefox. Chromium or any other name fails the job. Default empty: no apt."
    required: false
    default: ""
  npm-ci:
    description: "Set to false when an earlier step already ran npm ci in package-dir."
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install the pinned Playwright
      if: ${{ inputs.npm-ci == 'true' }}
      shell: bash
      env:
        DIR: ${{ inputs.package-dir }}
      run: npm ci --prefix "$DIR" --ignore-scripts --no-audit --no-fund

    - name: Read the pinned Playwright version
      id: pin
      shell: bash
      env:
        DIR: ${{ inputs.package-dir }}
      run: bash "${{ github.action_path }}/pin.sh"

    - name: Cache the browsers
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pin.outputs.version }}-${{ inputs.browsers }}

    # No --with-deps, on purpose. On a cache hit this only checks the browsers are there.
    - name: Install the browsers
      shell: bash
      env:
        CLI: ${{ steps.pin.outputs.cli }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # shellcheck disable=SC2086  # BROWSERS is a space-separated list, split on purpose
        node "$CLI" install $BROWSERS

    # Opt-in apt for WebKit and Firefox only: ubuntu-latest lacks their libraries (libgtk-4, gstreamer).
    # CAP is 300 s. The slow mirror on 2026-10-26 ran past 11 min, so the cap ends that case in under
    # half the time. The normal apt time is unmeasured. Composite steps have no timeout-minutes.
    - name: Install the system libraries
      if: ${{ inputs.system-deps != '' }}
      shell: bash
      env:
        CLI: ${{ steps.pin.outputs.cli }}
        DEPS: ${{ inputs.system-deps }}
        CAP: "300"
      run: |
        for b in $DEPS; do
          case "$b" in
            webkit|firefox) ;;
            *) echo "::error::system-deps takes webkit or firefox only, not '$b'. Chromium needs no apt."; exit 1 ;;
          esac
        done
        [ "$RUNNER_OS" = Linux ] || exit 0
        # shellcheck disable=SC2086  # DEPS is a space-separated list, split on purpose
        timeout "$CAP" node "$CLI" install-deps $DEPS || {
          rc=$?
          [ "$rc" = 124 ] && echo "::error::system-deps apt step passed its $CAP s cap." >&2
          exit "$rc"
        }
