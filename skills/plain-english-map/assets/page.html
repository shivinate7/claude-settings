<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: a working map. Bar on top; the web on the left; the plain-English reader on the right. Stacks at phone width. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1b2128; --ink2:#4a5560; --mute:#76808a; --line:#dde1e3;
  --accent:#e0701c; --accent-ink:#9c4a0f; --accent-wash:#fcebdc; --edge:#b9c0c6; --focus:#2f5f8f; --ar0:#d1495b; --ar1:#e0701c; --ar2:#b58900; --ar3:#4f9d2f; --ar4:#1f9d8f; --ar5:#2f6fb0; --ar6:#7a4fc0; --ar7:#b0488f; --ar8:#8a5a2b; --ar9:#5b6b7a; --ar10:#6f8f12; --ar11:#1f8fbf; --ar12:#2e3a8c;
  --warn:#a35a00; --warn-wash:#fff3dc;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181c; --panel:#1c2228; --ink:#e7eaec; --ink2:#b4bcc3; --mute:#87919a; --line:#2c343b;
  --accent:#f08a3a; --accent-ink:#f6a866; --accent-wash:#3a2616; --edge:#3e4851; --focus:#7fb0e0; --ar0:#f0707f; --ar1:#f08a3a; --ar2:#d9b030; --ar3:#7cc65a; --ar4:#46c4b5; --ar5:#6aa6e8; --ar6:#a98ae0; --ar7:#de78bd; --ar8:#c49a6c; --ar9:#9fb0c0; --ar10:#b5d334; --ar11:#4fc3f7; --ar12:#7f93f5;
  --warn:#f0b35a; --warn-wash:#3a2c12; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14181c; --panel:#1c2228; --ink:#e7eaec; --ink2:#b4bcc3; --mute:#87919a; --line:#2c343b;
  --accent:#f08a3a; --accent-ink:#f6a866; --accent-wash:#3a2616; --edge:#3e4851; --focus:#7fb0e0; --ar0:#f0707f; --ar1:#f08a3a; --ar2:#d9b030; --ar3:#7cc65a; --ar4:#46c4b5; --ar5:#6aa6e8; --ar6:#a98ae0; --ar7:#de78bd; --ar8:#c49a6c; --ar9:#9fb0c0; --ar10:#b5d334; --ar11:#4fc3f7; --ar12:#7f93f5;
  --warn:#f0b35a; --warn-wash:#3a2c12; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);margin:0}
.wrap{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px;box-sizing:border-box;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
h1{font:600 22px/1.2 var(--cond);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:13px}
.sub code{font:12px var(--mono)}
.badge.m{opacity:.55}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav.tabs button,.chip{font:500 13px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:5px 12px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,li:focus-visible,.filerow:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);gap:12px}
.stage{position:relative;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.crumb{font:600 14px var(--cond);color:var(--ink)}
.crumb button{font:inherit;background:none;border:0;color:var(--focus);cursor:pointer;padding:0}
.stagebar label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-left:auto}
#search{font:13px var(--sans);padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;width:200px}
#cy{flex:1;min-height:360px}
.legend{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--mute);background:var(--panel);padding:2px 6px;border-radius:4px}
aside{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;padding:16px 18px}
aside h2{font:600 18px/1.3 var(--cond);margin:0 0 4px;text-wrap:balance}
aside h3{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 0 6px}
aside p{margin:0 0 8px;max-width:65ch}
aside ul{margin:0;padding-left:18px}
aside li{margin:2px 0}
.path{font:12.5px var(--mono);color:var(--ink2);word-break:break-all}
.kind{display:inline-block;font:500 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-wash);border-radius:4px;padding:1px 6px;margin-left:6px}
.links li{list-style:none;margin-left:-18px}
.links button{font:12.5px var(--mono);background:none;border:0;color:var(--focus);cursor:pointer;padding:1px 0;text-align:left;word-break:break-all}
.mismatch{background:var(--warn-wash);color:var(--warn);padding:8px 10px;border-radius:6px}
.list{overflow:auto;flex:1;padding:8px 12px}
.list ol{padding-left:22px;margin:0 0 18px}
.list li{margin:6px 0}
.list h3{font:600 15px var(--cond);margin:14px 0 6px}
.step-file{font:12px var(--mono);color:var(--focus);background:none;border:0;cursor:pointer;padding:0;text-align:left;overflow-wrap:anywhere}
.filerow{display:grid;grid-template-columns:minmax(0,clamp(260px,22%,560px)) minmax(0,1fr);gap:4px 14px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.filerow:hover{background:var(--bg)}
.filerow .path{font-size:12px}
/* At phone width the page scrolls as one column. Each panel takes its full height. */
@media (max-width:820px){html,body{height:auto}.wrap{height:auto;min-height:100%}.main{grid-template-columns:minmax(0,1fr);grid-template-rows:none}.stage{overflow:visible}#cy{flex:none;height:70vh;min-height:360px}.list{overflow:auto;flex:none;min-height:60vh;max-height:85vh}#tree{max-height:none;overflow:visible}aside{overflow:visible;max-height:none}.filerow{grid-template-columns:1fr}#search{width:140px}.stagebar .tabline{flex-basis:100%;white-space:normal;order:5}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>button.badge,.alike li button.badge{font:500 11px var(--sans);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px;background:none;cursor:pointer;color:var(--focus);word-break:normal}.code{font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 8px;max-width:100%;overflow:auto;white-space:pre;box-sizing:border-box}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.chip[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}.badge{font:500 11px var(--sans);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px;color:var(--ink2)}[hidden]{display:none!important}.row>summary{font:600 15px var(--cond);cursor:pointer;padding:4px 0}.row .sub{margin:0 0 6px}.row h4{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:8px 0 2px}.row ul{list-style:none;margin:0 0 4px 0;padding:0}.row li button{font:12.5px var(--mono);background:none;border:0;color:var(--focus);cursor:pointer;padding:1px 0;text-align:left;word-break:break-all}.alike{list-style:none;margin:0 0 6px;padding:0}.alike li{margin:0 0 4px}.alike li button{font:12.5px var(--mono);background:none;border:0;color:var(--focus);cursor:pointer;padding:1px 0;text-align:left;word-break:break-all}.alike .sub{display:block}.fcols,.mc,.tcols{columns:440px;column-gap:28px}.tcols>.tg{columns:auto;break-inside:avoid}.fcols li,.mc li,.mc .grp,.mc details.fam{break-inside:avoid}.fcols h3,.mc h3,.mc h4,.row>summary,.row .sub{break-after:avoid}.dwrap:not(.tw)>.dia{max-width:1100px;margin-inline:auto}.ftree ul{list-style:none;margin:2px 0 4px 14px;padding:0}.ftree>ul{margin-left:0}.ftree details{margin:2px 0}.ftree summary{cursor:pointer}.ftree button{font:12.5px var(--mono);background:none;border:0;color:var(--focus);cursor:pointer;padding:1px 0;text-align:left;word-break:break-all}.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}.fbar input{font:13px var(--sans);padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 160px}.hit-list li{list-style:none;margin-left:-18px;margin-bottom:8px}.hit-list .sub{display:block;font-size:12.5px}.list h4{font:600 13px var(--sans);color:var(--ink2);margin:10px 0 4px}.tests-line{margin-top:10px}.dwrap{overflow-x:auto;margin:6px 0}.dia{display:block;min-width:620px;width:100%;height:auto}.dia .nd rect{fill:var(--panel);stroke:var(--accent);stroke-width:1.5}.dia .nd.mid rect{fill:var(--accent-wash)}.dia .nd.ac rect{stroke:var(--ac)}.dia .nd{cursor:pointer}.dia .nd:hover rect,.dia .nd:focus-visible rect{stroke:var(--focus);stroke-width:2.5}.dia .nd:focus-visible{outline:none}.dia text{fill:var(--ink);font:11px var(--mono)}.dia text.hd{fill:var(--mute);font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase}.dia .nd.sn rect{stroke-dasharray:3 3}.dia text.mu{fill:var(--mute);font:10px var(--sans)}.dia text.gt{fill:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em}.dia .it{font-style:italic}.dia .mk{fill:var(--accent-ink);font:13px var(--sans)}.dia .hit{fill:transparent;stroke:none!important}.dia .ln{fill:none;stroke:var(--edge);stroke-width:1.3}.dwrap.tw{overflow:hidden;touch-action:none;cursor:grab;border:1px solid var(--line);border-radius:6px;flex:1 0 min(560px,70vh);display:flex}.dwrap.tw>svg{flex:1;height:auto}#tree:not([hidden]){display:flex;flex-direction:column}#tree>:not(.tw){flex:none}.dia.sel .nd:not(.on){opacity:.35}.dia.sel .ln:not(.on){opacity:.25}.dia .nd.on rect{stroke:var(--focus);stroke-width:3}.dia .ln.on{stroke:var(--focus);stroke-width:2.6}.dia marker path{fill:var(--edge)}.ai{border-left:3px solid var(--focus);padding-left:10px;margin:0 0 14px}.ai h3{margin:0 0 6px}.ai ul{list-style:none;margin:0 0 6px;padding:0}.ai li{margin:0 0 6px}.tabline{flex:1 1 320px;min-width:0;font-size:13px;color:var(--ink2)}.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 8px;font-size:12px;color:var(--ink2)}.lgd .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;border:2px solid var(--ac)}.aicard{border-bottom:1px solid var(--line);padding:6px 0}.aicard h4{margin:4px 0}.aicard p{margin:2px 0 4px}.aicard .badge{white-space:nowrap;display:inline-block;word-break:normal;overflow-wrap:normal}
</style>
<div class="wrap">
  <header>
    <h1>{{TITLE}} Code Map</h1>
    <span class="sub">Made from docs/map at commit <code id="commit"></code></span>
    <nav class="tabs" role="tablist">
      <button role="tab" id="t-map" aria-selected="true">Map</button>
      <button role="tab" id="t-tree" aria-selected="false">Tree</button>
      <button role="tab" id="t-focus" aria-selected="false">Focus</button>
      <button role="tab" id="t-layers" aria-selected="false">Layers</button>
      <button role="tab" id="t-alike" aria-selected="false">Look-alikes</button>
      <button role="tab" id="t-rulings" aria-selected="false">Rulings</button>
      <button role="tab" id="t-traces" aria-selected="false">Traces</button>
      <button role="tab" id="t-ai" aria-selected="false">AI calls</button>
      <button role="tab" id="t-files" aria-selected="false">All files</button>
    </nav>
  </header>
  <div class="main">
    <section class="stage" id="stage">
      <div class="stagebar">
        <span class="crumb" id="crumb"></span>
        <span class="tabline" id="tabline"></span>
        <button class="chip" id="alllinks" aria-pressed="false" hidden>All links</button>
        <label><input type="checkbox" id="tests"> Show tests</label>
        <input id="search" type="search" placeholder="Search the map" aria-label="Search the map">
      </div>
      <div id="cy" role="img" aria-label="Code area web"></div>
      <div class="list" id="tree" hidden></div>
      <div class="list" id="focus" hidden></div>
      <div class="list" id="layers" hidden></div>
      <div class="list" id="alike" hidden></div>
      <div class="list" id="rulings" hidden></div>
      <div class="list" id="traces" hidden></div>
      <div class="list" id="ai" hidden></div>
      <div class="list" id="files" hidden></div>
      <div class="legend" id="legend">Bigger circle: more files. Thicker line: more links.</div>
    </section>
    <aside id="reader" aria-live="polite"></aside>
  </div>
</div>
<script type="application/json" id="data">{{DATA}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
const focusTree = {{FOCUS}};
const fold = {{FOLD}};
const treeKids = {{TREEKIDS}};
const branchKeys = {{KEYS}};
const strongLinks = {{STRONG}};
const mostUsed = {{MOSTUSED}};
const rankPrompt = {{RANKPROMPT}};
const parseRank = {{PARSERANK}};
const D = JSON.parse(document.getElementById('data').textContent);
const byPath = new Map(D.nodes.map(n => [n.p, n]));
const areaById = new Map(D.areas.map(a => [a.id, a]));
const out = new Map(), inn = new Map();
for (const { from, to } of D.links) { (out.get(from) || out.set(from, []).get(from)).push(to); (inn.get(to) || inn.set(to, []).get(to)).push(from); }
const tracesOf = new Map();
for (const t of D.traces) for (const a of t.actions) for (const s of a.steps) {
  const list = tracesOf.get(s.p) || tracesOf.set(s.p, []).get(s.p);
  if (!list.some(x => x.t === t.name && x.a === a.name)) list.push({ t: t.name, a: a.name });
}
// The area ring is laid out in a box 420 to 640 px high, in the shape of the stage. fit() then scales that box to the stage, so circles and labels grow with a wide screen.
const DESIGN_H = 640;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// The area colors are the --ar<N> tokens. The palette size is however many tokens the sheet defines, so no count is repeated here.
const AREA_COLORS = (() => { let n = 0; while (css('--ar' + n)) n++; return n || 1; })();
const areaColor = i => `var(--ar${i % AREA_COLORS})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const short = id => id === 'checks-tests' ? 'Checks and tests' : id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ');
const showTests = () => document.getElementById('tests').checked;
const base = p => p.split('/').pop();
const reader = document.getElementById('reader'), crumb = document.getElementById('crumb');
const TAB_LINE = {
  map: 'Each area\'s two strongest links. Bad: one area every other area needs.',
  tree: 'Shows what each file needs, branch by branch. Bad: a very deep branch, or one small file that many areas use.',
  focus: 'Pick one file to see what it uses and what uses it. Bad: a file with many users, so one change breaks much.',
  layers: 'Stacks files in rows, from base to top. Bad: a loop. The text below says what a loop is.',
  alike: 'Lists files that share a name or an ending. Bad: two files that do the same job, so a fix is made twice.',
  rulings: 'Lists each decision and the check that holds it. Bad: a decision no check holds. The AI rank is a judgement, not a fact.',
  traces: 'Follows one user action through the files, one file per step. Bad: a step that nobody can explain.',
  ai: 'Lists each step where the code calls a model, one card per step. Tokens show only when the page is built with a usage file, and money never shows. Bad: a call that nobody can explain.',
  files: 'Lists files with a plain description. Shows the first 400 until you type in the search box. Bad: a file with no clear job.',
};
let cy, view = { level: 'areas' }, allLinks = false;
document.getElementById('commit').textContent = D.commit;

function style() {
  return [
    { selector: 'node', style: { 'background-color': css('--panel'), 'border-width': 2, 'border-color': css('--accent'), label: 'data(label)', color: css('--ink'), 'font-size': 11, 'text-valign': 'bottom', 'text-margin-y': 4, 'text-wrap': 'ellipsis', 'text-max-width': 120, width: 'data(size)', height: 'data(size)' } },
    { selector: 'node.area', style: { 'background-color': css('--accent-wash'), 'font-size': 13, 'font-weight': 600 } },
    { selector: 'node.other', style: { 'border-color': css('--edge'), opacity: 0.55 } },
    { selector: 'node.test', style: { 'border-style': 'dashed', 'border-color': css('--mute') } },
    { selector: 'node.nolabel', style: { label: '' } },
    { selector: 'node.nolabel:selected, node.nolabel.hov', style: { label: 'data(label)' } },
    { selector: 'node:selected', style: { 'border-color': css('--focus'), 'border-width': 4 } },
    { selector: 'node.hit', style: { 'border-color': css('--focus'), 'border-width': 4 } },
    { selector: 'edge', style: { width: 'data(w)', 'line-color': css('--edge'), 'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'target-arrow-color': css('--edge'), opacity: 0.8 } },
    { selector: 'edge.hl', style: { 'line-color': css('--accent'), 'target-arrow-color': css('--accent'), opacity: 1 } },
  ];
}

function areaGraph() {
  const counts = new Map();
  for (const n of D.nodes) counts.set(n.a, (counts.get(n.a) || 0) + 1);
  const max = Math.max(...counts.values());
  const els = D.areas.filter(a => counts.get(a.id)).map(a => ({ data: { id: a.id, label: short(a.id), size: 28 + 52 * Math.sqrt(counts.get(a.id) / max) }, classes: 'area' }));
  for (const l of allLinks ? D.areaLinks : strongLinks(D.areaLinks)) els.push({ data: { id: l.from + '>' + l.to, source: l.from, target: l.to, w: Math.min(1 + Math.log2(l.n), 7), n: l.n } });
  return els;
}

function fileGraph(areaId) {
  const own = D.nodes.filter(n => n.a === areaId && (showTests() || n.k !== 'test'));
  const ids = new Set(own.map(n => n.p));
  const deg = p => (out.get(p) || []).length + (inn.get(p) || []).length;
  const els = own.map(n => ({ data: { id: n.p, label: base(n.p), size: 14 + Math.min(26, deg(n.p) * 1.2) }, classes: n.k === 'test' ? 'test' : '' }));
  const ext = new Set();
  for (const n of own) for (const t of [...(out.get(n.p) || []), ...(inn.get(n.p) || [])]) if (!ids.has(t) && (showTests() || byPath.get(t).k !== 'test')) ext.add(t);
  const extList = [...ext].slice(0, 120);
  for (const p of extList) els.push({ data: { id: p, label: base(p), size: 12 }, classes: 'other' });
  const all = new Set([...ids, ...extList]);
  for (const { from, to } of D.links) if (all.has(from) && all.has(to) && (ids.has(from) || ids.has(to))) els.push({ data: { id: from + '>' + to, source: from, target: to, w: 1 } });
  if (els.length > 60) for (const e of els) if (!e.data.source) e.classes = (e.classes || '') + ' nolabel';
  return els;
}

// The area ring is laid out in a box of design size with the stage's shape. fit() then scales that box up to the stage, so circles and labels grow together.
function designBox() {
  const c = document.getElementById('cy'), w = c.clientWidth || 600, h = c.clientHeight || 600, dh = Math.min(DESIGN_H, Math.max(420, h));
  return { x1: 0, y1: 0, w: dh * w / h, h: dh };
}
// The circle layout keeps the ring round. On a wide stage the ring stretches along x into an ellipse, so the graph uses the width.
function stretchX() {
  const b = designBox(), k = Math.max(1, b.w / b.h), cx = b.w / 2;
  return (n, p) => ({ x: cx + (p.x - cx) * k, y: p.y });
}
function draw(els) {
  if (cy) cy.destroy();
  cy = cytoscape({ container: document.getElementById('cy'), elements: els, style: style(), wheelSensitivity: 0.25, minZoom: 0.15, maxZoom: 3,
    layout: view.level === 'areas' ? { name: 'circle', padding: 40, avoidOverlap: true, spacingFactor: 1.1, boundingBox: designBox(), transform: stretchX() } : { name: 'cose', animate: false, nodeRepulsion: 12000, padding: 30 } });
  cy.on('tap', 'node', e => {
    const id = e.target.id();
    if (view.level === 'areas') return showArea(id);
    showFile(id);
    cy.edges().removeClass('hl'); e.target.connectedEdges().addClass('hl');
  });
  cy.on('mouseover', 'node', e => e.target.addClass('hov'));
  cy.on('mouseout', 'node', e => e.target.removeClass('hov'));
  cy.on('tap', 'edge', e => { if (view.level === 'areas') showAreaLink(e.target.data()); });
  requestAnimationFrame(() => { cy.resize(); cy.fit(undefined, 30); });
}

const fileBtn = p => `<button data-file="${esc(p)}">${esc(p)}</button>`;
const list = arr => arr.length ? `<ul class="links">${arr.map(x => `<li>${fileBtn(x)}</li>`).join('')}</ul>` : '<p class="sub">None.</p>';

// The crumb shows on Map (All areas, or one area with a way back) and on Tree in Area mode (the tree's own area). It is hidden elsewhere.
function paintCrumb() {

  const W = RX + NW + 4;
  const extra = Math.max(0, t.usedBy.length - CAP) + Math.max(0, t.uses.length - CAP);
  const more = extra && !focusMore ? `<p><button class="chip" data-fmore>+${extra} more</button></p>` : '';
  return `<div class="dwrap"><svg class="dia" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc('Files that use ' + focusFile + ', and files it uses')}"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z"/></marker></defs><text class="hd" x="${LX}" y="12">Used by (${t.usedBy.length})</text><text class="hd" x="${RX}" y="12">Uses (${t.uses.length})</text>${g}${node(focusFile, MX, mid, 'mid')}</svg></div>${more}`;
}

function focusNodes(list, level, side) {
  const btn = p => `<button data-ffile="${esc(p)}" title="${esc(p)}">${esc(p)}</button>`;
  return `<ul>${list.map(c => {
    if (c.seen) return `<li>${btn(c.p)}<span class="badge">shown elsewhere</span></li>`;
    if (c.children.length && level < focusDepth) return `<li><details data-k="${side}-${level}-${esc(focusFile)}-${esc(c.p)}"><summary>${btn(c.p)}</summary>${focusNodes(c.children, level + 1, side)}</details></li>`;
    return `<li>${btn(c.p)}</li>`;
  }).join('')}</ul>`;
}
function renderFocus() {

  redraw(document.getElementById('focus'), `<div class="fbar"><input id="fsearch" type="search" placeholder="Pick a file" aria-label="Pick a file" value="${esc(focusQ)}"><span class="sub" title="1 = files that link to it directly. 2 = also the files those link to. 3 = one link further.">Steps out (how many links away):</span>${depth}</div>
    ${picks.length ? `<ul class="hit-list">${picks.map(n => `<li><button data-ffile="${esc(n.p)}">${esc(n.p)}</button>${testTag(n)}<span class="sub">${md(n.j)}</span></li>`).join('')}</ul>` : ''}
    ${focusFile ? `<h3>${esc(focusFile)}</h3>` : '<p class="sub">Pick a file, or open one in the reader first.</p>'}
    ${focusFile && byPath.get(focusFile).k === 'test' ? '<p>Test files have no focus view. The reader lists the files this test uses.</p>' : `${focusDepth === 1 && focusFile ? diagram(t) : `<div class="fcols"><div class="ftree"><h3>Uses</h3><p class="sub">What this file needs.</p>${t.uses.length ? focusNodes(t.uses, 1, 'u') : '<p class="sub">None.</p>'}</div>

function renderLayers() {
  const rows = D.layers.rows, loopOf = new Map();
  for (const g of D.layers.loops) for (const p of g) loopOf.set(p, g);
  const html = rows.map((files, n) => {
    const byArea = new Map();
    for (const p of files) { const a = byPath.get(p).a; (byArea.get(a) || byArea.set(a, []).get(a)).push(p); }
    const note = n === rows.length - 1 ? 'Top: uses the most rows below it' : n === 0 ? 'Base: uses no other code file' : '';
    const body = [...byArea].sort((x, y) => (x[0] < y[0] ? -1 : 1)).map(([a, ps]) => `<h4>${esc(short(a))}</h4><ul>${ps.map(p => {
      const g = loopOf.get(p);

      return `<li><button data-lfile="${esc(p)}" title="${esc(p)}">${esc(p)}</button>${badge}</li>`;
    }).join('')}</ul>`).join('');
    return `<details class="row" data-k="row-${n}"${n === rows.length - 1 || n === 0 ? ' open' : ''}><summary>Row ${n} (${files.length} ${files.length === 1 ? 'file' : 'files'})</summary>${note ? `<p class="sub">${esc(note)}</p>` : ''}${body}</details>`;

function renderAlike() {

let rulingFilter = 'all';

// The AI rank. It is a judgement, so it sits in its own marked block and never mixes with the facts of the list below it.

const rankHide = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

const rankBlock = (head, r) => {
  const groups = ['high', 'medium', 'low'].map(k => ({ k, rows: r.rows.filter(x => x.risk === k) })).filter(g => g.rows.length);
  const body = groups.map(g => `<h4>${g.k[0].toUpperCase() + g.k.slice(1)} risk (${g.rows.length})</h4><ul>${g.rows.map(x => { const e = rulingOf(x.id); return `<li><button class="step-file" data-ruling="${esc(x.id)}">${esc(x.id === 'pending' ? 'Pending' : x.id)}, ${esc(e ? e.title : '')}</button> <span class="badge">${esc(x.risk)}</span> <span class="sub">${esc(x.why)}</span></li>`; }).join('')}</ul>`).join('');
  const cut = r.cut ? '<p class="sub">The reply was cut short, so rows may be missing.</p>' : '';
  const prob = r.problems.length ? `<p class="sub">${r.problems.length} ${r.problems.length === 1 ? 'problem' : 'problems'} in the reply: ${esc(r.problems.slice(0, 5).join(' '))}${r.problems.length > 5 ? ` And ${r.problems.length - 5} more.` : ''}</p>` : '';

};
function showRuling(id) {
  const e = rulingOf(id); if (!e) return;
  const badge = c => D.checks[c] ? `<button class="badge" data-check="${esc(c)}">${esc(c)}</button>` : `<span class="badge">${esc(c)}</span>`;
  reader.innerHTML = `<h2>${esc(e.id === 'pending' ? 'Pending' : e.id)}, ${esc(e.title)}</h2><h3>Held by</h3><p>${e.holds.length ? e.holds.map(badge).join('') : '<span class="sub">no holder</span>'}</p><h3>Other checks it names</h3><p>${e.checks.filter(c => !e.holds.includes(c)).map(badge).join('') || '<span class="sub">none</span>'}</p>`;

async function runRank() {

function renderRulings() {
  const R = D.rulings;
  const shown = R.entries.filter(e => rulingFilter === 'all' || (rulingFilter === 'held') === e.holds.length > 0);
  const chips = [['all', 'All'], ['held', 'Held by a check'], ['none', 'No holder']].map(([k, n]) => `<button class="chip" data-rfilter="${k}" aria-pressed="${k === rulingFilter}">${n}</button>`).join('');
  const badge = (c, m) => D.checks[c] ? `<button class="badge${m}" data-check="${esc(c)}">${esc(c)}</button>` : `<span class="badge${m}">${esc(c)}</span>`;
  const rows = shown.map(e => { const only = e.checks.filter(c => !e.holds.includes(c)); return `<li>${esc(e.id === 'pending' ? 'Pending' : e.id)}, ${esc(e.title)} ${e.holds.length ? e.holds.map(c => badge(c, '')).join('') : '<span class="sub">no holder</span>'}${only.length ? ` <span class="sub">mentioned:</span> ${only.map(c => badge(c, ' m')).join('')}` : ''}</li>`; }).join('');
  const ai = (liveRank ? rankBlock('AI judgement, ranked just now', liveRank) : '') + (D.rank ? rankBlock('AI judgement, as of commit ' + D.rank.commit, D.rank) : '');
  const ask = rankSample ? (rankBusy ? '<button class="chip" data-rank="cancel">Cancel</button>' : '<button class="chip" data-rank="go">Rank by AI</button>') : '';
  const state = rankMsg || rankBusy ? `<span class="sub" id="rankmsg" role="status">${esc(rankMsg)}</span>` : '';
  redraw(document.getElementById('rulings'), `${ai}<div class="chips">${ask}${state}</div><p>${R.held} rulings are held by a check, ${R.none} are not.</p><div class="chips">${chips}</div><ul class="alike mc">${rows}</ul>`);
}

function setTab(t) {
  tab = t;
  const tl = document.getElementById('tabline'); tl.textContent = tl.title = TAB_LINE[t];
  for (const id of ['map', 'tree', 'focus', 'layers', 'alike', 'rulings', 'traces', 'ai', 'files']) document.getElementById('t-' + id).setAttribute('aria-selected', String(id === t));
  document.getElementById('ai').hidden = t !== 'ai';

  document.getElementById('layers').hidden = t !== 'layers';

document.addEventListener('click', e => {
  const rk = e.target.closest('[data-rank]');
  if (rk) return rk.dataset.rank === 'go' ? runRank() : rankCtl && rankCtl.abort();
  const rr = e.target.closest('[data-ruling]');
  if (rr) return showRuling(rr.dataset.ruling);
  const ck = e.target.closest('[data-check]');
  if (ck) return showCheck(ck.dataset.check);
  const rf = e.target.closest('[data-rfilter]');
  if (rf) { rulingFilter = rf.dataset.rfilter; return renderRulings(); }
  if (e.target.closest('[data-fmore]')) { focusMore = true; return renderFocus(); }
  const ff = e.target.closest('[data-ffile]'), fd = e.target.closest('[data-fdepth]'), fo = e.target.closest('[data-focus]');
  if (ff) { focusFile = ff.dataset.ffile; focusQ = ''; focusMore = false; return renderFocus(); }
  if (fd) { focusDepth = +fd.dataset.fdepth; focusMore = false; return renderFocus(); }
  if (fo) { focusFile = fo.dataset.focus; focusQ = ''; focusMore = false; return setTab('focus'); }
  const lf = e.target.closest('[data-lfile]');
  if (lf) return showFile(lf.dataset.lfile);
  const tb = e.target.closest('.tn'), tt = e.target.closest('[data-ttoggle]');
  if (tb) pickBox(tb);
  else if (e.target.closest('.tw')) { if (treeSel) { treeSel = ''; renderTree(); } return; }
  if (tt) return toggleTree(tt.dataset.ttoggle);
  const tf = e.target.closest('[data-tfile]'), ta = e.target.closest('[data-tarea]');
  if (tf) { renderTree(); return showFile(tf.dataset.tfile); }
  const tz = e.target.closest('[data-tzoom]'), tl = e.target.closest('[data-tall]');
  if (tz) { if (tz.dataset.tzoom === 'fit') { setFit(!treeFit); return treeFit && viewTree('fit'); } setFit(false); return viewTree(tz.dataset.tzoom); }
  if (tl) { treeOpen[treeKey] = new Set(tl.dataset.tall === 'open' ? branchKeys(treeRoots, MAXKIDS) : []); renderTree(); return treeFit || viewTree('keep'); }
  const td = e.target.closest('[data-tdir]');
  if (td) { treeDown = td.dataset.tdir === 'down'; renderTree(); return treeFit || viewTree('keep'); }
  const tm = e.target.closest('[data-tmode]');

  if (ta) { treeArea = ta.dataset.tarea; return renderTree(); }

});
// Zoom and move of the tree. The group `vp` holds them, so a redraw sets them again from `tv`. A drag past 4 px is no click.
function setView(s, x, y) { tv.s = s; tv.x = x; tv.y = y; const g = document.querySelector('.tw .vp'); if (g) g.setAttribute('transform', `translate(${x} ${y}) scale(${s})`); }
let drag = null, dragged = false;
function setFit(on) { treeFit = on; const b = document.querySelector('[data-tzoom="fit"]'); if (b) b.setAttribute('aria-pressed', String(on)); }
// A click on a box selects it. A "+N more" box is no selection, so it keeps the old one.
const pickBox = b => { if (!b.classList.contains('fold')) treeSel = treeSel === b.dataset.tkey ? '' : b.dataset.tkey; };
// Fit shows the whole tree, but never below 25%: then it centres the selected box (or the root) at 25%. 100% and "keep" put that box at the left middle, or at the top middle when the tree grows down.
function viewTree(mode) {
  const v = document.querySelector('.tw svg'), g = v && v.querySelector('.vp'); if (!g) return;
  const cw = v.clientWidth, ch = v.clientHeight, bb = g.getBBox(), pad = 8;
  const a = v.querySelector(`[data-tkey="${treeSel}"]`) || v.querySelector('[data-tkey="0"]'), r = a ? a.querySelector('rect').getBBox() : bb;
  const whole = Math.min((cw - 2 * pad) / bb.width, (ch - 2 * pad) / bb.height, 1);
  if (mode === 'fit' && whole >= 0.25) return setView(whole, (cw - bb.width * whole) / 2 - bb.x * whole, (ch - bb.height * whole) / 2 - bb.y * whole);
  const s = mode === 'fit' ? 0.25 : mode === 'keep' ? tv.s : 1;
  if (mode === 'fit') return setView(s, cw / 2 - (r.x + r.width / 2) * s, ch / 2 - (r.y + r.height / 2) * s);
  if (treeDown) return setView(s, cw / 2 - (r.x + r.width / 2) * s, pad - r.y * s);
  setView(s, pad - r.x * s, ch / 2 - (r.y + r.height / 2) * s);
}
document.addEventListener('wheel', e => {
  const v = e.target.closest && e.target.closest('.tw svg'); if (!v) return;
  e.preventDefault(); setFit(false);
  const r = v.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, s = Math.min(4, Math.max(0.1, tv.s * Math.exp(-e.deltaY * 0.0015)));

document.addEventListener('pointerdown', e => { dragged = false; if (e.button === 0 && e.target.closest('.tw')) drag = { x: e.clientX, y: e.clientY, ox: tv.x, oy: tv.y }; });
document.addEventListener('pointermove', e => {

for (const id of ['map', 'tree', 'focus', 'layers', 'alike', 'rulings', 'traces', 'ai', 'files']) document.getElementById('t-' + id).onclick = () => setTab(id);
document.getElementById('alllinks').onclick = () => { allLinks = !allLinks; showAreas(); };
document.getElementById('tests').onchange = () => view.level === 'files' && showArea(view.area);
document.getElementById('search').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  renderFiles(q);
  if (cy) { cy.nodes().removeClass('hit'); if (q) cy.nodes().filter(n => n.id().toLowerCase().includes(q)).addClass('hit'); }
  if (q) showMatches(q); else if (view.level === 'areas') showAreas(); else showArea(view.area);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => cy && cy.style(style()));
new MutationObserver(() => cy && cy.style(style())).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
addEventListener('resize', () => { if (treeFit && tab === 'tree') viewTree('fit'); if (cy) { cy.resize(); cy.fit(undefined, 30); } });
renderTraces(); renderFiles(); setTab('map');
// Ask for the sample capability after the first paint. No `claude` global, or null, leaves the button hidden.
(async () => { try { rankSample = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch { rankSample = null; } if (rankSample && tab === 'rulings') renderRulings(); })();
