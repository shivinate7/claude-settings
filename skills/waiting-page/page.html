<meta charset="utf-8">
<title>Waiting on you</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@700;800&family=Newsreader:opsz,wght@6..72,600&display=swap">
<style>
/* Layout: one stable list in three tiers and a last section for picks that stand. A slim bar in the
   repo's colour and a tinted ground carry the repo. Nothing on the page moves when an answer is picked or sent. */
:root {
  /* Neutrals and state colours. The script replaces the --r-* values when meta/page names a brand. */
  --surface: #ffffff; --ink: #161b22; --muted: #565f6b; --faint: #5b6470; --line: #d9dee5; --chip: #eef1f4;
  --holds: var(--r-holds-l, #b3261e); --on-holds: var(--r-on-holds-l, #ffffff); --due: var(--r-due-l, #8a5300); --due-soft: #fbefd9; --calm: #56606e;
  --good: var(--r-good-l, #1d7445); --good-soft: #e0f2e7; --gold-soft: #fbf3d6; --gold-ink: #6b5000;
  --ground: var(--r-ground-l, #f3f4f6); --hdr: var(--r-hdr-l, #4b5a6b); --on-hdr: var(--r-on-hdr-l, #ffffff);
  --acc: var(--r-ink-l, #4b5a6b); --on-acc: #ffffff; --acc-soft: var(--r-soft-l, #eceff3);
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --wm: system-ui, sans-serif; --wmw: 700; --wmls: -0.01em;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface: #191e26; --ink: #e8ecf1; --muted: #a3adba; --faint: #8b95a2; --line: #2c3440; --chip: #222a35;
  --holds: var(--r-holds-d, #ff8b7f); --on-holds: var(--r-on-holds-d, #11151b); --due: var(--r-due-d, #f2b55c); --due-soft: #35270f; --calm: #a3adba;
  --good: var(--r-good-d, #6fcf98); --good-soft: #15301f; --gold-soft: #2f2a14; --gold-ink: #ecd37a;
  --ground: var(--r-ground-d, #11151b); --hdr: var(--r-hdr-d, #2b3440); --on-hdr: var(--r-on-hdr-d, #ffffff);
  --acc: var(--r-ink-d, #9fb0c2); --on-acc: #11151b; --acc-soft: var(--r-soft-d, #222a35); color-scheme: dark } }
:root[data-theme="dark"] {
  --surface: #191e26; --ink: #e8ecf1; --muted: #a3adba; --faint: #8b95a2; --line: #2c3440; --chip: #222a35;
  --holds: var(--r-holds-d, #ff8b7f); --on-holds: var(--r-on-holds-d, #11151b); --due: var(--r-due-d, #f2b55c); --due-soft: #35270f; --calm: #a3adba;
  --good: var(--r-good-d, #6fcf98); --good-soft: #15301f; --gold-soft: #2f2a14; --gold-ink: #ecd37a;
  --ground: var(--r-ground-d, #11151b); --hdr: var(--r-hdr-d, #2b3440); --on-hdr: var(--r-on-hdr-d, #ffffff);
  --acc: var(--r-ink-d, #9fb0c2); --on-acc: #11151b; --acc-soft: var(--r-soft-d, #222a35); color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--hdr); }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--acc); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.in { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Repo bar: the repo's colour at full strength, one slim sticky band. */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 7; background: var(--hdr); color: var(--on-hdr); box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 12%, transparent); }
.hdr .in { padding-block: 6px; min-height: 44px; display: flex; align-items: center; gap: 12px; }
.mark { flex: none; width: 28px; height: 28px; border-radius: 7px; background: var(--on-hdr); color: var(--hdr); display: grid; place-items: center; font: 800 15px/1 var(--wm); }
.who { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.who .repo { margin: 0; font: var(--wmw) 18px/1.2 var(--wm); letter-spacing: var(--wmls); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .sub { font-size: 13.5px; opacity: .88; white-space: nowrap; }
@media (max-width: 420px) { .who .sub { display: none; } }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding-top: 10px; }
.tabs a { padding: 8px 14px; border-radius: 8px 8px 0 0; color: var(--muted); text-decoration: none; font-weight: 600; border: 1px solid transparent; border-bottom: none; margin-bottom: -1px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); border-color: var(--line); }
.tabs .cnt { font: 600 12px/1 var(--mono); color: var(--muted); }

/* State shapes: a tier shows by shape and word, never by colour alone. */
.g { display: inline-block; flex: none; width: 12px; height: 12px; }
.g.holds { background: var(--holds); border-radius: 2px; }
.g.due { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid var(--due); }
.g.calm { border: 2px solid var(--calm); border-radius: 50%; }
.g.stands { border-radius: 50%; background: var(--gold-ink); }
.g.done { background: var(--good); border-radius: 50%; position: relative; }
.g.done::after { content: ""; position: absolute; left: 4px; top: 1.5px; width: 3px; height: 6px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* Main grid: the overview beside the list on wide screens, above it on a phone. */
.main { padding-block: 18px 40px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); display: grid; gap: 16px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.ov-prog { display: grid; gap: 8px; }
.ov-prog .big { font: 700 15px/1.3 var(--body); }
.ov-prog .big b { font: 700 26px/1 var(--body); font-variant-numeric: tabular-nums; color: var(--acc); margin-right: 4px; }
.ov-prog .sub { min-height: 22px; display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--muted); }
.ov-prog .sub.none { visibility: hidden; }
.ov-prog .sw { width: 10px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--acc) 55%, transparent); }
.ov-prog .track { height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; display: flex; }
.ov-prog .track i { display: block; height: 100%; }
.ov-prog .track .s { background: var(--good); }
.ov-prog .track .r { background: color-mix(in srgb, var(--acc) 55%, transparent); }
.ov-tier { display: grid; gap: 8px; align-items: start; padding-top: 12px; border-top: 1px solid var(--line); }
.ov-head { display: flex; align-items: center; gap: 7px; min-height: 32px; color: var(--ink); text-decoration: none; font: 700 16px var(--body); font-variant-numeric: tabular-nums; }
.ov-head .ct { margin-left: auto; padding-left: 8px; color: var(--muted); font-weight: 600; }
.chips-n { display: flex; flex-wrap: wrap; gap: 6px; }
.nchip { width: 48px; height: 32px; padding: 0; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 13.5px var(--mono); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.nchip:hover { border-color: var(--acc); }
.nchip.ready { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.nchip.sent { background: var(--good-soft); border-color: transparent; color: var(--good); }
.nchip.sent::before { content: "\2713"; margin-right: 3px; }
.pairchips { display: inline-flex; gap: 3px; padding: 2px; border: 1.5px dashed color-mix(in srgb, var(--acc) 60%, var(--line)); border-radius: 10px; }
.pairchips .nchip { height: 28px; width: 44px; }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } .main > .rail { position: static; padding: 12px; gap: 10px; } .ov-tier { padding-top: 8px; } }

.list { display: grid; gap: 30px; min-width: 0; grid-column: 2; }
@media (max-width: 960px) { .list { grid-column: 1; } }
.tier { display: grid; gap: 12px; scroll-margin-top: 64px; }
.tier > header { display: flex; align-items: center; }
.tier > header h2 { font: 700 19px/1.25 var(--body); display: flex; align-items: center; gap: 10px; }
.tier > header .ct { font: 600 13px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.empty { color: var(--muted); padding: 20px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface); }

/* Item card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 14px; align-content: start; scroll-margin-top: 64px; min-width: 0; }
.card.holds { border-left: 6px solid var(--holds); }
.card.due { border-left: 6px solid var(--due); }
.card.answered { background: color-mix(in srgb, var(--good-soft) 45%, var(--surface)); }
.top { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 14px; color: var(--muted); }
.top .num { font: 600 15px var(--mono); color: var(--acc); }
.title { font: 700 clamp(19px, 2vw, 22px)/1.3 var(--body); max-width: 40ch; }
.stake { margin: 0; display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 8px; font-size: 15px; }
/* The Blocking line is a solid fill, so it reads at full strength next to any repo colour. */
.stake.holds { background: var(--holds); color: var(--on-holds); font-weight: 600; }
.stake.holds .g.holds { background: var(--on-holds); }
.stake.due { background: var(--due-soft); box-shadow: inset 0 0 0 1.5px var(--due); }
.stake.due b { color: var(--due); }
.ctx { margin: 0; max-width: 70ch; white-space: pre-line; overflow-wrap: anywhere; }
.ctx.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.morebtn { justify-self: start; background: none; border: 0; padding: 0; min-height: 32px; color: var(--acc); font-weight: 600; cursor: pointer; font-size: 14.5px; }
.about { margin: 0; font-size: 14px; color: var(--muted); }
/* Related items sit together in one frame, with one sentence on how they connect. */
.bundle { display: grid; gap: 10px; padding: 12px; border: 1.5px solid color-mix(in srgb, var(--acc) 55%, var(--line)); border-radius: 16px; background: var(--acc-soft); scroll-margin-top: 64px; }
.bundle > header { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 4px 6px 2px; align-items: start; }
.bundle > header svg { grid-row: span 2; margin-top: 2px; color: var(--acc); }
.bundle > header b { font-size: 16px; }
.bundle > header p { margin: 0; font-size: 15px; max-width: 72ch; }
.inbundle { font-weight: 600; color: var(--acc); }

/* Options side by side; each card's rows line up so lose sits beside lose. */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.opt { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; }
@supports (grid-template-rows: subgrid) { .opts { grid-auto-rows: auto; } .opt { grid-row: span 4; grid-template-rows: subgrid; } }
.opt:hover { border-color: var(--faint); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:has(input:focus-visible) { outline: 2px solid var(--acc); outline-offset: 2px; }
.opt.sel { border-color: var(--acc); background: var(--acc-soft); box-shadow: inset 0 0 0 1px var(--acc); }
.opt .head { display: flex; gap: 10px; align-items: flex-start; }
.key { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 13px var(--mono); color: var(--muted); }
.opt.sel .key { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.opt .lab { font-weight: 700; line-height: 1.3; padding-top: 2px; }
.opt .how { margin: 0; font-size: 14.5px; color: var(--muted); }
.opt .tr { margin: 0; display: grid; gap: 4px; font-size: 14.5px; align-content: start; }
.opt .tr div { display: grid; grid-template-columns: 18px minmax(0, 1fr); }
.opt .tr .s { font: 600 15px/1.4 var(--mono); }
.opt .tr .gain .s { color: var(--good); }
.opt .tr .lose .s { color: var(--holds); }
.opt .pick { align-self: end; display: grid; grid-template-columns: auto 1fr; align-items: start; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--gold-soft); color: var(--ink); font-size: 14px; }
.opt .pick b { font: 700 15px/1.25 var(--body); color: var(--gold-ink); }
.opt .nopick { align-self: end; }

.ready { min-height: 1.55em; margin: 0; font-size: 14.5px; color: var(--muted); }
.ready.on { color: var(--good); font-weight: 600; }
.ready.on::before { content: "\2713  "; }
/* Every control keeps its place whether it applies or not, so a pick never reflows the row. */
.alts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.alts .sp { flex: 1 1 0; }
.alts .gone { visibility: hidden; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: var(--r); border: 1.5px solid var(--acc); background: var(--acc); color: var(--on-acc); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.alt { background: transparent; color: var(--acc); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; padding-inline: 10px; }
.btn.dash { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); font-weight: 500; }
.btn.dash[aria-pressed="true"] { border-style: solid; border-color: var(--ink); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.note { display: grid; gap: 6px; }
.note label { font-size: 14px; color: var(--muted); }
.note.need label { color: var(--due); font-weight: 600; }
.note textarea { width: 100%; min-height: 60px; resize: vertical; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--ground); }
.note.need textarea { border-color: var(--due); }
ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 15px; }
.dest { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.status { font-size: 14px; color: var(--due); font-weight: 600; margin: 0; }

/* Receipt: the card stays where it was and shows what happened to the answer. */
.receipt { display: grid; gap: 10px; }
.receipt .line { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 15.5px; }
.receipt .line b { color: var(--good); }
.receipt .rnote { margin: 0; color: var(--muted); font-size: 14.5px; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.trail li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--chip); color: var(--faint); }
.trail li.on { background: var(--good-soft); color: var(--good); font-weight: 600; }
.trail li .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.checked { font: 13px var(--mono); color: var(--faint); margin: 0; }
.parked { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 18px; font-size: 15px; color: var(--muted); }
.parked ul { margin: 6px 0 0; padding-left: 20px; }

/* Answer bar: what is ready, then one Send. The stamp and Undo sit above it after a Send. */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar .in { padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.bar .st { flex: 1 1 0; font-size: 14.5px; color: var(--muted); min-width: 0; }
.bar .st b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar textarea { flex: 1 1 100%; font: 13px var(--mono); background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.btn.send { min-height: 48px; padding-inline: 18px; white-space: nowrap; }
.sent { background: var(--surface); border-bottom: 1px solid var(--line); }
.sent .in { padding-block: 14px; display: grid; gap: 10px; font-size: 15px; }
.sent-head { display: flex; gap: 14px; align-items: center; }
.stamp { flex: none; transform: rotate(-6deg); border: 3px solid var(--good); color: var(--good); border-radius: 8px; padding: 4px 9px 3px; font: 700 18px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.stamp small { display: block; font: 500 11px/1.3 var(--mono); letter-spacing: 0; text-transform: none; }
@media (prefers-reduced-motion: no-preference) { .sent:not([hidden]) .stamp { animation: stamp .42s cubic-bezier(.3,1.6,.5,1) both; } }
@keyframes stamp { from { transform: rotate(-6deg) scale(2); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
.sent-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; max-height: 22vh; overflow: auto; }
.sent-list li { display: inline-flex; gap: 8px; align-items: center; padding: 4px 6px 4px 10px; border-radius: 999px; background: var(--chip); font-size: 13.5px; }
.sent-list .no { color: var(--acc); font: 600 12px var(--mono); }
.dstate { padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--faint); font-size: 12.5px; }
.dstate.on { background: var(--good-soft); color: var(--good); font-weight: 600; }
.sent .row { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 520px) { .bar .st { flex-basis: 0; font-size: 13.5px; } .btn.send { padding-inline: 12px; } }

/* Designs: a mockup shows in a sandboxed frame on its card, and a sheet pages through all of them. */
.dprev { display: grid; gap: 8px; }
.dprev .dbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dprev .dbar .sp { flex: 1; }
.dframe { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; display: block; }
.card .dframe { height: 340px; }
.dsheet { position: fixed; inset: 0; z-index: 20; background: var(--ground); display: grid; grid-template-rows: auto 1fr; }
.dsh-head { background: var(--hdr); color: var(--on-hdr); padding-top: env(safe-area-inset-top, 0px); }
.dsh-head .in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-block: 8px; }
.dsh-head h2 { font: 700 17px/1.25 var(--body); flex: 1 1 220px; }
.dsh-head .btn { min-height: 40px; }
.dsh-head .btn.quiet { color: var(--on-hdr); border-color: color-mix(in srgb, var(--on-hdr) 40%, transparent); }
.dsh-body { position: relative; min-height: 0; margin: 10px clamp(8px, 2vw, 20px) calc(10px + env(safe-area-inset-bottom, 0px)); }
.dsh-body .dframe { position: absolute; inset: 0; width: 100%; height: 100%; }
.dsh-body .dframe.off { visibility: hidden; }
body.sheet-open { overflow: hidden; }
</style>

<header class="hdr"><div class="in">
  <div class="mark" id="mark" aria-hidden="true"></div>
  <div class="who"><h1 class="repo" id="repoName">Waiting on you</h1><span class="sub" id="repoSub" hidden>waiting on you</span></div>
</div></header>

<nav class="in tabs" id="tabs" aria-label="Page" hidden><a href="#" id="tabQ" aria-current="page">Questions</a><a href="#" id="tabD" role="button">Designs <span class="cnt" id="dCount"></span></a></nav>
<div class="in main" id="qView">
  <nav class="rail" id="rail" aria-label="Overview"></nav>
  <div class="list" id="list"><div class="empty">Loading the items waiting on you…</div></div>
</div>

<div class="bar" id="bar">
  <div class="sent" id="sent" hidden><div class="in" id="sentIn"></div></div>
  <div class="in">
    <span class="st" id="barStatus"></span>
    <button class="btn quiet" type="button" id="copy" hidden>Copy answers</button>
    <button class="btn send" type="button" id="send" disabled>Send answers</button>
    <textarea id="copyBox" rows="2" hidden readonly></textarea>
  </div>
</div>

<div class="dsheet" id="dsheet" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="dsh-head"><div class="in">
    <h2 id="dTitle"></h2><span id="dPos"></span>
    <button class="btn quiet" type="button" id="dPrev">Prev</button><button class="btn quiet" type="button" id="dNext">Next</button>
    <button class="btn quiet" type="button" id="dBack"></button>
    <button class="btn" type="button" id="dClose">Close</button>
  </div></div>
  <div class="dsh-body" id="dStage"></div>
</div>

}
// Clear drops the draft. On a changed answer it also withdraws the saved record, and the draft stays if the store refuses.

/* ---------- Painting: a card is rebuilt only when what it shows changed, and a live design preview is never detached ---------- */
const cards = {}, heights = {};

}
function patch(old, nu) {

  const keep = old.querySelector(":scope > .dprev"), slot = nu.querySelector(":scope > .dprev");
  const wasReceipt = !!old.querySelector(":scope > .receipt"), isReceipt = !!nu.querySelector(":scope > .receipt");

  if (!wasReceipt) heights[old.id] = old.getBoundingClientRect().height;
  const minH = !isReceipt ? "" : wasReceipt ? old.style.minHeight : heights[old.id] ? heights[old.id] + "px" : "";
  [...old.attributes].forEach((a) => old.removeAttribute(a.name)); [...nu.attributes].forEach((a) => old.setAttribute(a.name, a.value));

  if (focusId) { const f = $(focusId); if (f && !f.disabled) f.focus({ preventScroll: true }); }
}
function cardFor(it) {
  const sig = signature(it), rec = cards[it.id];

  patch(rec.el, nu); rec.sig = sig; return rec.el;
}
function repaint() { render(); }
function reconcile(parent, want) {

}
const tierEls = {}, bundleEls = {};
function tierEl(T) {

    tierEls[T.k] = { el: h("section", { class: "tier", id: "tier-" + T.k, "aria-labelledby": "th-" + T.k }), count, head: h("header", {}, h("h2", { id: "th-" + T.k }, glyph(T.k), T.name, count)) };

}
function bundleEl(slug) {

  const g = state.groups[slug] || {}, b = bundleEls[slug];

}
function renderList() {
  const list = $("list"), by = sorted(), want = [];

  }

    const pk = state.meta.parked || [];
    if (pk.length) want.push(h("div", { class: "parked" }, h("b", {}, "Parked by you"), h("ul", {}, pk.map((p) => h("li", {}, p.ref + ": " + p.note)))));

/* ---------- Overview ---------- */
function jump(id) { const el = $(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }

  const rail = $("rail"), by = sorted(), active = document.activeElement, focusId = active && rail.contains(active) ? active.id : "";

  rail.hidden = !total;
  const kids = [h("div", { class: "ov-prog" },
    h("div", { class: "big" }, h("b", {}, String(sent)), "of " + total + " sent"),
    h("div", { class: "sub" + (ready ? "" : " none") }, h("i", { class: "sw" }), ready + " ready to send"),
    h("div", { class: "track", "aria-hidden": "true" }, h("i", { class: "s", style: "width:" + (total ? (sent / total) * 100 : 0) + "%" }), h("i", { class: "r", style: "width:" + (total ? (ready / total) * 100 : 0) + "%" })))];
  const chip = (it) => h("button", { type: "button", id: "c-" + it.id, class: "nchip" + (isSaved(it) ? " sent" : draftReady(it) ? " ready" : ""), "aria-label": "No. " + it.n + ", " + it.title + (isSaved(it) ? ", sent" : draftReady(it) ? ", ready to send" : ", open"), title: it.title, onclick: () => jump("item-" + it.id) }, String(it.n));
  TIERS.forEach((T) => {
    const list = by[T.k]; if (!list.length) return;
    const open = list.filter((i) => !isSaved(i)).length, row = h("div", { class: "chips-n" }), seen = new Set();
    list.forEach((it) => {

    });
    kids.push(h("div", { class: "ov-tier" }, h("a", { class: "ov-head", href: "#tier-" + T.k, "aria-label": open + " open, " + T.name, onclick: (e) => { e.preventDefault(); jump("tier-" + T.k); } }, glyph(T.k), T.name, h("span", { class: "ct" }, String(open))), row));
  });
  rail.replaceChildren(...kids);
  if (focusId && $(focusId)) $(focusId).focus({ preventScroll: true });
}

/* ---------- Bar and Send ---------- */
function renderBar() {
  const st = staged(), open = state.items.filter((i) => !isSaved(i)), sa = $("send");
  const mine = st.filter((i) => (eff(i) || {}).auto && !(eff(i) || {}).stood).length, stood = st.filter((i) => (eff(i) || {}).stood).length, left = open.length - st.length;
  const parts = [];

  else {
    if (st.length) { parts.push(h("b", {}, String(st.length)), " ready"); const why = [mine && mine + " by Take my pick", stood && stood + " where my pick stands"].filter(Boolean); if (why.length) parts.push(" (" + why.join(", ") + ")"); parts.push(". "); }
    if (left) parts.push(h("b", {}, String(left)), " stay open.");
    if (state.items.length && !open.length) parts.push(h("b", {}, "All answered."));
  }
  $("barStatus").replaceChildren(...parts);
  sa.disabled = !state.db || state.sending || !st.length;
  sa.textContent = st.length ? "Send " + st.length + (st.length === 1 ? " answer" : " answers") : "Send answers";
  $("copy").hidden = !(state.db === false || state.copyOffer);
}

const TOLD = "Claude was told.";
const NOT_TOLD = "No session was told; reply in the thread to wake one.";
const MAX_BYTES = 4096, MAX_NOTE = 500, MAX_OWNER = 80, CAN_WAIT_MS = 3000, UNDO_S = 8;
const plain = (t) => String(t || "").replace(/[\u0000-\u0008\u000b-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim();
// Owners come first so a cut at the byte cap never drops them.
function noticeText(entries, head, tail) {
  const owners = [...new Set(entries.map((e) => plain(e.owner).slice(0, MAX_OWNER) || "?"))].join(", ");
  const line = entries.map((e) => { const note = plain(e.note).slice(0, MAX_NOTE); return e.n + (tail ? "" : " " + (e.choice ? choiceText(e.choice) : "done") + (note ? " (" + note + ")" : "")); }).join(", ");
  let text = head + " Owners: " + owners + ". Items: " + line + (tail || ".");
  const enc = new TextEncoder();
  while (enc.encode(text).length > MAX_BYTES) text = text.slice(0, Math.floor(text.length * 0.9)) + "…";
  return text;
}
// Asked before the answer write, so only the write and the send sit between the click and the send.
// The platform wants the send to follow the viewer's own gesture. How long that holds on a slow store is unmeasured.
// A call that never answers must not hold the send, so it gives up after CAN_WAIT_MS.
async function canTell() {
  if (!state.comments) return false;
  try {
    const give = new Promise((r) => setTimeout(() => r(false), CAN_WAIT_MS));
    return await Promise.race([state.comments.canSendToClaude().then((v) => v === "available"), give]);
  } catch (e) { return false; }
}
// One comment per Send or Undo, into the viewer's stored thread.
// Any failure only means "no session was told"; the answers stand and nothing retries.
async function notifyClaude(text, can) {
  try {
    const cm = state.comments;
    if (!cm || !can) return false;
    let id = null;
    try { id = localStorage.getItem("waiting.thread"); } catch (e) {}
    let res = null;
    if (id) {
      try { res = await cm.sendToClaude({ threadId: id, text }); }
      catch (e) { if (!e || e.code !== "not_found") throw e; }
    }
    if (!res) res = await cm.sendToClaude({ anchor: await cm.anchorFor(document.querySelector("h1")), text });
    try { localStorage.setItem("waiting.thread", res.threadId); } catch (e) {}
    return true;
  } catch (e) { return false; }
}

async function sendAll() {
  if (!state.db || state.sending) return;
  const st = staged(); if (!st.length) return;
  state.sending = true; edited(); renderBar();
  const wrote = [], entries = [];
  try {
    const can = await canTell();
    const at = new Date().toISOString();
    for (const it of st) {
      const d = eff(it), prior = state.answers[it.id] || null, body = answerBody(it, d, at);
      try { await state.db.collection("answers").doc(it.id).set(body); }
      catch (e) { state.barNote = "Not saved (" + (e && e.code || "error") + ")" + (wrote.length ? " from No. " + it.n : "") + ". Copy the answers and reply in the thread."; state.copyOffer = true; break; }
      wrote.push({ it, prior, draft: state.draft[it.id] || null, changing: !!state.changing[it.id] });
      state.answers[it.id] = body; delete state.draft[it.id]; delete state.changing[it.id]; delete state.notice[it.id]; delete state.noteOpen[it.id];
      entries.push({ n: it.n, choice: body.choice, note: body.note, owner: it.owner });
    }
    saveDraft();
    if (wrote.length) openSent(wrote, at);
    render();
    if (wrote.length) {
      const told = await notifyClaude(noticeText(entries, "Saved on the waiting page."), can);
      setSentStatus(told ? TOLD : NOT_TOLD);
    }
  } finally { state.sending = false; renderBar(); }
}

/* The panel above the bar: stamp, who was told, and 8 seconds to take it back. */
let undoTimer, closeTimer;
// The window is read from the clock, so a throttled tab cannot stretch it past what a session waits.
const undoLeft = (p) => Math.max(0, Math.ceil((Date.parse(p.at) + UNDO_S * 1000 - Date.now()) / 1000));
function openSent(wrote, at) {
  clearInterval(undoTimer); clearTimeout(closeTimer);
  state.sentPanel = { wrote, at, status: "Telling Claude…" };
  renderSent();
  undoTimer = setInterval(() => { const p = state.sentPanel; if (!p) return clearInterval(undoTimer); if (undoLeft(p) <= 0) clearInterval(undoTimer); renderSent(); }, 1000);
  closeTimer = setTimeout(closeSent, 20000);
}

function closeSent() { clearInterval(undoTimer); clearTimeout(closeTimer); state.sentPanel = null; renderSent(); }

  const p = state.sentPanel, box = $("sent");

  if (!p) { $("sentIn").replaceChildren(); return; }
  const n = p.wrote.length, blk = p.wrote.filter((w) => w.it.holds).length;
  $("sentIn").replaceChildren(
    h("div", { class: "sent-head" }, h("span", { class: "stamp" }, "Sent", h("small", {}, fmt(p.at, false))),
      h("div", {}, h("b", {}, n + (n === 1 ? " answer" : " answers") + " sent. "), h("span", { id: "sentStatus" }, p.status),
        blk ? h("span", {}, " " + blk + " blocking " + (blk === 1 ? "item" : "items") + " can move again once read.") : null)),
    h("ul", { class: "sent-list" }, p.wrote.map((w) => { const rc = state.receipts[w.it.id] || {}; return h("li", { title: "Goes to " + w.it.owner }, h("span", { class: "no" }, "No. " + w.it.n), rc.read || rc.filed ? h("span", { class: "dstate on" }, rc.filed ? "Filed" : "Read") : null); })),
    h("div", { class: "row" }, undoLeft(p) > 0 ? h("button", { class: "btn alt", type: "button", id: "undoBtn", onclick: undoSend }, "Undo send (" + undoLeft(p) + ")") : null, h("button", { class: "btn quiet", type: "button", id: "sentClose", onclick: closeSent }, "Close")));
}
// Undo puts back what each write replaced: the earlier answer, or nothing. The owner's picks come back as drafts.
async function undoSend() {
  const p = state.sentPanel; if (!p || p.busy || undoLeft(p) <= 0) return;

  const todo = p.wrote.slice().reverse();

    const w = todo[i];

    try {
      const ref = state.db.collection("answers").doc(w.it.id);

    if (w.prior) state.answers[w.it.id] = w.prior; else delete state.answers[w.it.id];

  }
  if (late.length) { late.sort((x, y) => x - y); state.barNote = "Too late to undo " + late.map((n) => "No. " + n).join(" and ") + "."; }

}

function answerLine() {
  const parts = [];
  state.items.slice().sort((a, b) => a.n - b.n).forEach((it) => {
    const a = state.answers[it.id], d = eff(it) || {};
    const choice = d.choice || (a && a.choice), note = d.note != null ? d.note : (a && a.note);
    if (it.kind === "decision" && choice) parts.push(it.n + " " + choiceText(choice) + (note ? " (" + note + ")" : ""));
    else if (it.kind === "task" && (d.done || (a && a.done))) parts.push(it.n + " done" + (note ? " (" + note + ")" : ""));

}
$("copy").addEventListener("click", async () => {
  const text = answerLine() || "No answers yet.", box = $("copyBox");
  try { await navigator.clipboard.writeText(text); state.barNote = "Copied. Paste it in the thread."; box.hidden = true; }
  catch (e) { box.hidden = false; box.value = text; box.select(); state.barNote = "Select and copy the text below."; }
  renderBar();
});
$("send").addEventListener("click", sendAll);

/* ---------- Designs: each mockup is stored whole in this page and shown in a sandboxed frame ---------- */
let DESIGN_HTML = {};
try { DESIGN_HTML = JSON.parse($("designData").textContent) || {}; } catch (e) {}
const allDesigns = () => state.items.filter((it) => it.designs && !isSaved(it)).flatMap((it) => it.designs.map((d) => ({ ...d, it })));
function frame(slug, title) {
  const f = h("iframe", { class: "dframe", title, sandbox: "allow-scripts", loading: "lazy" });
  f.srcdoc = DESIGN_HTML[slug] || "<p style='font:15px system-ui;padding:20px'>This design is missing from the page.</p>";
  return f;
}
// The sheet's frames are built once and only shown or hidden, so paging never reloads a mockup and closing leaves the list where it was.
let dList = [], dAt = 0, dFrom = null, dY = 0;
const STAGE = {};
function stageFrame(d) { if (!STAGE[d.slug]) { STAGE[d.slug] = frame(d.slug, d.label); STAGE[d.slug].removeAttribute("loading"); $("dStage").append(STAGE[d.slug]); } return STAGE[d.slug]; }
function showDesign(i) {
  dAt = (i + dList.length) % dList.length; const d = dList[dAt];
  Object.values(STAGE).forEach((f) => f.classList.add("off")); stageFrame(d).classList.remove("off");
  $("dTitle").textContent = d.label; $("dPos").textContent = (dAt + 1) + " of " + dList.length;
  $("dPrev").hidden = $("dNext").hidden = dList.length < 2;
  $("dBack").textContent = "Answer No. " + d.it.n;
}
function openDesign(slug) {
  dList = allDesigns(); if (!dList.length) return;
  dFrom = document.activeElement; dY = scrollY; document.body.classList.add("sheet-open"); $("dsheet").hidden = false;
  showDesign(Math.max(0, dList.findIndex((d) => d.slug === slug))); $("dClose").focus();
}
function closeDesign(toItem) {
  $("dsheet").hidden = true; document.body.classList.remove("sheet-open");
  if (toItem) { const c = $("item-" + toItem.id); if (c) { c.scrollIntoView({ block: "start" }); const f = c.querySelector(".opt input, button"); if (f) f.focus({ preventScroll: true }); return; } }
  window.scrollTo(0, dY);
  if (dFrom && dFrom.focus) dFrom.focus({ preventScroll: true });
}
$("dPrev").onclick = () => showDesign(dAt - 1); $("dNext").onclick = () => showDesign(dAt + 1);
$("dClose").onclick = () => closeDesign(); $("dBack").onclick = () => closeDesign(dList[dAt].it);
$("tabD").onclick = (e) => { e.preventDefault(); openDesign(""); };
$("tabQ").onclick = (e) => e.preventDefault();

/* ---------- Keys: A to C pick on the focused card, Ctrl or Cmd+Enter sends. Nothing on screen teaches them. ---------- */
let hoverItem = null;
document.addEventListener("mouseover", (e) => { const c = e.target.closest && e.target.closest(".card"); if (c) hoverItem = c.id.replace("item-", ""); });
document.addEventListener("keydown", (e) => {
  if (!$("dsheet").hidden) { if (e.key === "Escape") closeDesign(); else if (e.key === "ArrowLeft") showDesign(dAt - 1); else if (e.key === "ArrowRight") showDesign(dAt + 1); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); sendAll(); return; }
  if (e.target.closest && e.target.closest("textarea,input[type=text]")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const fc = document.activeElement && document.activeElement.closest && document.activeElement.closest(".card");
  const it = byId(fc ? fc.id.replace("item-", "") : hoverItem);
  if (!it || isSaved(it) || it.kind !== "decision") return;
  const k = e.key.toLowerCase();
  if ((it.options || []).some((o) => o.key === k)) { e.preventDefault(); choose(it, k); const r = $("o-" + it.id + "-" + k); if (r) r.focus({ preventScroll: true }); }
});

function render() {
  renderList(); renderRail(); renderBar(); renderSent();
  const nd = allDesigns().length;
  $("dCount").textContent = nd || ""; $("tabs").hidden = !state.items.some((i) => i.designs && i.designs.length);
}

render();
(async () => {
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { state.db = false; state.loaded = true; render(); return; }
  state.db = db;
  try { state.comments = (await window.claude?.use?.("comments")) || null; } catch (e) { state.comments = null; }
  const map = (s) => { const m = {}; s.docs.forEach((d) => { m[d.id] = d.data(); }); return m; };
  db.collection("items").onSnapshot((s) => { state.items = s.docs.map((d) => d.data()).filter((i) => i && i.status !== "closed"); state.loaded = true; render(); }, () => {});
  db.collection("answers").onSnapshot((s) => { state.answers = map(s); render(); }, () => {});
  db.collection("groups").onSnapshot((s) => { state.groups = map(s); render(); }, () => {});
  db.collection("receipts").onSnapshot((s) => { state.receipts = map(s); render(); }, () => {});
  db.collection("meta").doc("page").onSnapshot((s) => { state.meta = s.exists ? s.data() : null; applyIdentity(); render(); }, () => {});
})();
