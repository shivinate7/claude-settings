", "phase": "cleanup", "status": "done", "order": 103.38, "why": "A session that stops to ask about the only safe move spends your attention on nothing.", "note": "Done: Gripe, Oct 26 (shiv): sessions stop and ask \"push as an archive, then delete?\" when the branch guard refuses a delete of a branch holding the only copy of its commits. That is always the right move. Built in PR 616: the refusal now hands `git push origin <branch>:refs/heads/archive/<branch>`, then `git branch -D <branch>`, and says it needs no question; new CLAUDE.md rule shared-trees-archive-then-delete pre-approves it. Red then green on the branch-delete cases; a test runs the handed push and proves the delete is then allowed. Sweep: 35 refusals already hand their fix, 13 have no single lossless fix (listed in the PR), 6 are asks. Fallback when the archive name is taken: `archive/<branch>-2`, never force. Merged Oct 26 to main in batch PR 617 (main 7ce2d89). Placed ahead of c69 (triage, Oct 26): it costs your attention every time it fires.", "ask": "# c70: a refusal with one lossless fix hands the session that fix, so it never asks shiv\n\nCloud build thread brief. Build advisor (3), Oct 26, against claude-settings main 54f2dfd.\nBase: main 54f2dfd; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (3)\" republishes the roadmap page.\n\n## Finding (shiv's gripe, Oct 26)\n\nWhen the branch guard refuses a delete because the branch holds the only copy of its commits,\nsessions stop and ask shiv \"push as an archive, then delete?\". That is always the right move.\nhooks/guard_branch_worktree.py BRANCH_DELETE_DENY_REASON ends \"Remedy: push the branch, or merge\nit, before it is deleted\": a choice, no command.\n\n## Task\n\n1. Red first: show the current message leaves the session a choice (quote it in the test).\n2. The branch-delete refusal names the exact next step: push the branch to an archive ref on\n   origin, then delete it locally. Pick one archive ref shape (for example `archive/<branch>`) and\n   say why. The message never names the refused target (rule git-remedy-never-names-target): it\n   uses a placeholder the session fills. A test pins the new message and that the remedy, once\n   run, makes the guard allow the delete.\n3. One CLAUDE.md line, anchored, beside the shared-trees or git rules: an archive push of an\n   unmerged branch, then the local delete, is pre-approved and needs no question, since nothing is\n   lost. Keep it to one sentence.\n4. Sweep every guard refusal (hooks/guard*.py): where one safe, lossless fix exists, the message\n   hands it over as a command shape. List every refusal in the PR body as \"fix handed\" or \"no\n   single lossless fix, why\".\n\n## Fences\n\n- Change messages and the one CLAUDE.md line only. No refusal becomes an allow, and no allow\n  becomes a refusal: verdicts stay exactly as on main (prove it with the guard suite).\n- #615 (o2, one layout for every repo) changes the record-cite part of hooks/guard.py; keep clear\n  of record_folders and record_path_pattern.\n\n## Failure classes and proof\n\n- Run the guard suite and gates-mutate-guard's harness (python3 hooks/mutate_guard.py) through\n  `verdict`. A mutant anchored on a message you change must be re-pointed, not deleted.\n- Touches a rule and the guard's messages: review rounds per roles-review-cap-three, fresh\n  Sonnet reviewer from round 1.\n\n## Report\n\nAdd one line, \"Port to other repos: yes or no, and why\" (shiv's ruling on c52, Oct 26). Cap 20 lines: Done, Deviations, Next, and the refusal sweep count (handed / not). Send the green,\nreviewed head and branch to \"Advise the claude-settings build (3)\". Do not merge, and do not\nrebase onto main. No question for shiv: park any in the PR body.\n", "updatedAt": "2026-10-26T17:15:00Z"}, "c71": {"title": "Everything waiting on you is on one page, with a pick for each, from every session", "phase": "cleanup", "status": "done", "order": 103.39, "why": "Sessions work overnight and park questions; you should answer them all in one sitting, not hunt across threads.", "note": "Done: PR #636 (one waiting page per repo) landed on main 54be9f1 through batch #637 (checked: skills/waiting-page on main, Oct 26). Rulings (shiv, Oct 26, on the page): 1a one shared page per project or repo, for everything waiting on you, from every session. 2a your save on a page only you can write counts as your word. 3a keep the terminal question box, linking the page. Measured Oct 26 (liaison, Mac): a page save wakes no session, so sessions read answers at their own turns; a local Mac session can write the page's database, so claude-settings needs one page; Windows is unmeasured. Pilot: https://claude.ai/artifact/RddcgXbB6SvTrFZHPmsvFx (this account, Oct 28; the old 9PJB page is on the other account) (thread \"Answer all waiting decisions in one place\"). Merged Oct 26 in batch PR #637 (main 54be9f1); lane PR #636 (one waiting page per repo) closed as replaced; reviewed (reviewer sonnet, no blockers): rule questions-go-to-owner extended, skill waiting-page, and lint/layout.py reads the page URL from the extras file's waiting-page key (unknown when missing). Open: no repo has rolled out to the layout, claude-settings included, so every repo reads unknown today; claude-settings' own page key waits on a call (see its PR report). Port: yes, the skill and rule reach every repo through the install; each repo's page is made at its layout roll-out. Merged in o10 (triage, Oct 26). Placed ahead of c69 (triage, Oct 26): it unblocks every deferred step at once. Moved on close (triage, Oct 26): claude-settings' waiting-page key to o2; whether \"Accept every pick\" counts as your word on each item to c74.", "ask": "# c71: one waiting page for every session, the rule and the skill\n\nCloud build thread brief. Build advisor (4), Oct 26, against claude-settings main 7ce2d89 (or\nnewer). Never rebase onto main after review. claude-settings only. Push roadmap edits to the\nbranch only; only Triage the roadmap (3) republishes.\n\n## Inputs\n\n- Design: /mnt/project-files/plans/c71-waiting-page.md (database schema, session protocol, rulings)\n  and the page source c71-waiting-page.html beside it. The pilot page runs by hand from the thread\n  \"Answer all waiting decisions in one place\" (cmsg_01DoF7thf3iq2Srr1UsfXgh2ADTZhQexksM43HTmuCPZMa).\n- Measured: a page save wakes no local session; sessions read answers at their own turns.\n- Measurement in flight, separate (the local liaison): can a local session write to the page's\n  database. It decides one page or two for claude-settings; design so either works.\n\n## Rulings (shiv, Oct 26, saved on the page)\n\n- 1a: one shared page per project or repo, for everything waiting on him, from every session.\n- 2a: a save on a page only shiv can write counts as his word. It needs a rule.\n- 3a: keep the terminal question box, with a link to the page.\n\n## Task\n\n1. Rule: extend questions-go-to-owner (one home; no second rule) so each question also goes on the\n   repo's waiting page, and a save by shiv on that page counts as his word for the item it answers\n   (2a), with the terminal box kept and linking the page (3a). Fewest words.\n2. Skill skills/waiting-page/: the add, read, route and close protocol from the design, the page\n   source as a template, and how a repo makes its page (publish with the db capability).\n3. Page URL per repo: one key in the layout file o2 landed (lint/layout.json or the repo's extras\n   file), read through layout.py. No URL is a stated \"unknown\", never a guess.\n4. Port: the skill reaches every repo from claude-settings; a repo's page is made at its roll-out.\n\n## Failure classes and proof\n\n- Test-author first, red on main: the URL reader returns the key when set and \"unknown\" when\n  missing (false-alarm case: a repo with no page is not an error); rule_audit's pinned counts\n  move only by any new anchor, and say which bucket.\n- Run every gates.yml step locally before sending.\n- A fresh Sonnet reviewer reads the diff (it changes a rule).\n\n## Report\n\nCap 20 lines: Done, Deviations, Next, and \"Port to other repos: yes or no, and why\". Send the green,\nreviewed head and branch to \"Advise the claude-settings build (4)\"\n(cmsg_01DoF7thf3iq2Srr1UsfXgh2EyHwiKacoTT56k4JHuc2RT). Keep the PR a draft.\n", "updatedAt": "2026-10-28T05:10:00Z"}, "c72": {"title": "A roadmap write never lands with git conflict markers in it", "phase": "cleanup", "status": "done", "order": 103.395, "why": "A conflict marker in a step file breaks the build and the page for every thread until someone notices.", "note": "Done: closed by triage, Oct 27 (built, reviewed, on main). Built at e7b31d6 (c72, build.py refuses conflict markers), Oct 26: build.py scans tracked files under roadmap/, briefs/, plans/ and handoffs/ before it builds, prints file:line and exits 1 with no page written; `=======` counts only inside a <<<<<<< / >>>>>>> block, so a Markdown setext heading passes. roadmap.html is left out of the scan, because the build rewrites it. README's write recipe now chains with && and stops on a failed rebase. roadmap/test_build.py: red on the old code, 4 pass after. Fresh Sonnet reviewer: clear, two low findings taken (odd bytes no longer skip a file; recipe says to finish after rebase --continue). Not taken (low): untracked new files are not scanned; a column-0 marker inside a fenced example would false-alarm. Waiting for triage to close. Incident, Oct 26 16:34: roadmap 45891d5 pushed with conflict markers after a `;` chain committed mid-rebase; fixed at 6927b4c. Port: yes, with o16's roadmap package. Placed ahead of c69 (triage, Oct 26): it breaks the record every thread writes to.", "ask": "# c72: a roadmap write never lands with git conflict markers in it\n\nCloud build thread brief. Build advisor (4), Oct 26. Branch: roadmap (direct push, no PR, never\nmerged into main). Pull right before each write. Only Triage the roadmap (3) republishes the page.\n\n## Incident\n\nOct 26 16:34, roadmap 45891d5: steps/o13.json and roadmap.html were pushed with conflict markers.\nThe writer committed mid-rebase after build.py crashed on the bad JSON; the shell chain used `;`,\nso the crash did not stop the commit. Fixed at 6927b4c.\n\n## Task\n\n1. roadmap/build.py: before it builds, scan every tracked text file under roadmap/, briefs/,\n   plans/ and handoffs/ for a line that starts with `<<<<<<< `, `=======` alone, or `>>>>>>> `.\n   On a hit, print each file and line and exit non-zero, and write no page. A `=======` line inside\n   a Markdown file is a setext heading only when the line above has text and no `<<<<<<<` precedes\n   it: flag `=======` only between a `<<<<<<<` and a `>>>>>>>`.\n2. roadmap/README.md: the write recipe chains with `&&` (build, then add, commit, pull --rebase,\n   build again, push), and says to stop on a failed rebase, never commit during one.\n3. A small test file beside build.py: a planted marker in a step file fails; a planted one in a\n   brief fails; a Markdown setext `=======` heading passes (false alarm); the clean tree passes.\n   Show it red before the build.py change.\n\nCost: one read of each file per build, no file written. Port to other repos: yes (triage's call):\no16 packages build.py with the roadmap.\n\n## Report\n\nCap 10 lines: Done, Deviations, Next, Port line. A fresh Sonnet reviewer reads the diff (it adds a\ncheck). Report to \"Advise the claude-settings build (4)\"\n(cmsg_01DoF7thf3iq2Srr1UsfXgh2EyHwiKacoTT56k4JHuc2RT).\n", "updatedAt": "2026-10-27T16:45:00Z"}, "c73": {"title": "The phone profile job names a save timeout instead of telling you to unlock the phone", "phase": "cleanup", "status": "done", "order": 103.41, "why": "A wrong hint sends you to fix the phone when the tool hung.", "note": "Finding, Oct 26 (local liaison, c48 part 2 on the Mac): when xctrace hangs while saving after a full recording (exit 124 at the step timeout, seen once with HomeApp), bin/ios-ship profile reports \"failed twice\" and says the phone may need unlocking, which is wrong there. Fix, one small cloud lane, needs no answer from you: print the unlock hint only when the second failure also shows the boot-wait text; otherwise name the timeout. Built Oct 26 in draft PR #635 (profile names the step timeout): exit 124 names \"step xctrace record\" and its limit; the unlock hint needs a second boot wait. Three cases red on main, green on the head; fresh Sonnet review clear. Merged to main Oct 26 in batch PR #637 (54be9f1); shell-macos green there. Port: yes, ios-ship serves every app repo. Placed after c69 (triage, Oct 26): small, and it misleads only on a rare hang.", "ask": "# c73: the phone profile job names a save timeout, not \"unlock the phone\"\n\nCloud build thread brief. Build advisor (4), Oct 26, against claude-settings main be4b30e. Never\nrebase onto main after review. claude-settings only. Push roadmap edits to the branch only; only\nTriage the roadmap (3) republishes.\n\n## Finding\n\nLiaison, Oct 26, c48 part 2 on the Mac: when xctrace hangs while saving after a full recording\n(exit 124 at the step timeout, seen once with HomeApp), `bin/ios-ship profile` says \"failed twice\"\nand that the phone may need unlocking. That is wrong there.\n\n## Task\n\nIn bin/ios-ship (the retry c48 part 1 added): print the unlock hint only when the second failure\nalso shows the boot-wait text; otherwise name the step timeout (exit 124) and the step that hung.\n\n## Proof\n\n- Red first in lint/test_ios_ship.sh: a stubbed exit-124 run with no boot-wait text names the\n  timeout and no unlock hint; a boot-wait failure twice still gives the unlock hint (false-alarm\n  case). ShellCheck and STE clean. CI's shell-macos job runs it.\n- A fresh Sonnet reviewer reads the diff.\n\n## Report\n\nCap 10 lines: Done, Deviations, Next, \"Port to other repos: yes or no, and why\". Send the green,\nreviewed head to \"Advise the claude-settings build (4)\"\n(cmsg_01DoF7thf3iq2Srr1UsfXgh2EyHwiKacoTT56k4JHuc2RT). Keep the PR a draft.\n", "updatedAt": "2026-10-26T19:55:00Z"}, "c74": {"title": "Decide whether one \"Accept every pick\" press counts as your word on each item", "phase": "cleanup", "status": "done", "order": 109.36, "why": "The waiting page offers one press that accepts every recommended pick; sessions need to know whether that press approves each item, including steps that cannot be undone.", "note": "Merged into c122 (triage, Oct 27): same skill and lane. Ruled Oct 26 (shiv, waiting page, c): keep \"Accept every pick\", and before it saves, the page lists every pick it will save. Build in skills/waiting-page, needs no answer; it rides with c100 (the waiting page's final look). Rule 2a stands: your save on a page only you can write counts as your word on each item it saves.", "updatedAt": "2026-10-27T16:45:00Z"}, "c75": {"title": "A branch delete after its archive push is not re-asked by Claude Code's own auto-mode check", "phase": "cleanup", "status": "done", "order": 103.35, "why": "Your gripe, Oct 26: sessions keep asking \"push as an archive, then delete?\" when that is always the right move. c70 fixed our guard; the platform's check still asks.", "note": "Done Oct 27: PR 641 landed in batch #649 (main 2ad85de6, checked by triage). settings.json autoMode.allow keeps \"$defaults\" and adds an \"Archived Branch Delete\" entry; hooks/test_auto_mode_allow.py tests it; decision archived-branch-delete-allowed records it. Owner approved the settings edit by decision card, Oct 26 20:08 UTC. Port: yes, through the install. Note: the reviewer's optional tightening for merged branches (no commit since the merge) was left out, since the guard already refuses that local delete.", "updatedAt": "2026-10-27T00:22:00Z"}, "c76": {"title": "Child repos' CI runs the same claude-settings tools as local sessions, so a stale pin never costs a lane", "phase": "cleanup", "status": "todo", "order": 103.36, "why": "Your gripe, Oct 26 (\"doesn't this just mean CI is old? why would we conform\"): a degen session spent two CI runs on a sentence that only the old pinned linter refused, nearly dropped the iPhone Duo record lane, then asked you to choose.", "note": "claude-settings part merged Oct 27 (PR 647, \"ste-changed names the CI pin\"; main e305bdbc). Left: the child-repo part below. bin/ste-changed now names the CI ste-lint pin and exits 3 when its lint files differ from the local copy. Rule git-integration-branch-merge: a CI lint red that ste-changed passes, while it blames an old ste-lint pin, is not a strike; the session moves the pin with no question. Decision action-pins-follow-sessions: no bot keeps pins current; Dependabot cannot bump them (read from dependabot-core source f0feb6f: no version tag in claude-settings, so no update; not run live). Old pins measured Oct 26: degen 95ada63, q_max 9d577ab, joyous 873704e (ste-lint); banchi ef49dde and q_max 8abab8d (stamp). Child-repo part (bump each repo's pins) deferred (shiv, Oct 26): you check each repo's plan first; it rides with the roll-out visits (r1). Port: yes, every repo that pins ste-lint gets the check through bin/ste-changed. Deferred (shiv, Oct 27): the child-repo part changes other repos, which needs your plan check. Asked: waiting page item 2 (yes to the one plan, https://claude.ai/artifact/S6Eou4tPnLmypAXzoUdyEA).", "updatedAt": "2026-10-28T05:10:00Z"}, "c77": {"title": "Brakes keep working while a session waits on your answer", "phase": "cleanup", "status": "done", "order": 103.32, "why": "Your gripe, Oct 26: a local UI/UX session waited on your question while its background agents kept working; the Mac ran out of storage and they crashed. Once you answered, the session saw the brake at once.", "note": "Finding, Oct 26 (main 54be9f1): the machine-load brake (c14) read memory and disk only when a lane started, so lanes already running were never braked. Built: PR 642 (brake a running lane at a full machine, draft, head 46a9060). Each background agent's shell command and file write reads the load inside the guard hook that already runs; at full it is refused and told to stop and report. The main session is never braked, so it can free space. Red on main, green on the branch; Sonnet review round 1 clear. Not built: a watcher (the mandate forbids a timer) and a pause-while-a-question-waits rule. Mac proof not needed: background lanes' payloads carry agent_id (measured live Oct 26). Ruling, Oct 27 11:45 CDT (shiv, waiting page item 30): option (a), #648 plus #642 as the backup, with a one-line exception in outcomes-mechanize-rules. #648 is merged. Brief: briefs/c77-running-lane-brake.md (text in Ask), dispatched Oct 27 11:55 CDT from main 43d9af2. Merged: PR #708 (head 5ecdd78, replaces #642; builder sonnet, reviewer sonnet), on main by Oct 27 13:32 CDT (main d3a9de2). Ready for triage to close. The no-hang question idea is c84. Port: no, the guard installs from claude-settings into every repo. Placed ahead of c75 (triage, Oct 26). Merged Oct 27 in batch #711 (main d3a9de2).", "updatedAt": "2026-10-27T18:35:00Z", "ask": "# Brief: c77, brake a running lane at a full machine (finish PR #642)\n\nRepo: shivinate7/claude-settings, from main 43d9af20. One lane: builder (sonnet), then reviewer (sonnet). This changes a guard, so it gets up to three review rounds and, after round 3, the net-value test.\n\n## Ruling\nshiv, waiting page item 30, Oct 27 11:45 CDT, option (a): non-blocking questions (PR #648, merged) plus the per-write disk check (PR #642), refusing only at a full machine (memory over 95%, or disk under the smaller of 5% and 5 GB), with a one-line exception in rule outcomes-mechanize-rules for background agents' own writes.\n\n## Task\n1. Bring PR #642 (branch claude/project-thread-rqwx3m, head 46a9060, 235 commits behind main) onto current main: a new branch from main with its diff re-applied (no force-push of the old branch). Keep its decision text, cases and proof shape; resolve any drift in hooks/guard.py and hooks/test_guard.py.\n2. Add the one-line exception to CLAUDE.md, rule outcomes-mechanize-rules: a background agent's own write may read the machine load once inside the guard hook already running for it. Say its cost (one memory read and one statfs per subagent write, no process, no file, no timer) in decision machine-load-brake, and point both at each other.\n3. PR body cites the ruling with its time.\n\n## Failure classes\n- The orchestrator's own writes braked (it is the session that frees the disk: verification-recovery-not-gated-on-own-state).\n- A refusal at a busy, not full, machine (a guard that cries wolf).\n\n## Check that proves it done\n`GUARD_FAMILY=load-brake` cases: red against main's guard, green on the branch (the one cloud-container probe case red on main too is named, not counted). `python3 bin/ci-job gates --lint --base origin/main` and `bin/ste-changed origin/main` pass.\n\n## Report\nAt most 15 lines: PR (draft), head, red run, green run, each review round's verdict. Close #642 as replaced. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n"}, "c78": {"title": "A CI fix found in one repo reaches the others: one shared browser-test setup", "phase": "cleanup", "status": "todo", "order": 103.37, "why": "Oct 26: degen's PR 263 went red when its browser setup timed out on Ubuntu's slow package mirror, the same cause claude-settings fixed for itself the same day (c64). The fix never reached the child repos.", "note": "claude-settings part merged (PR 644, one shared Playwright setup, landed on main e305bdb, Oct 27): actions/playwright-setup pins Playwright from a lockfile, caches the browsers and runs no apt step; gates-shoot uses it (setup 9 s). compliance_probes.py playwright flags installs that run apt; on Oct 26 it flagged degen (2), banchi (2), q_max (1), joyous (1). Decision one-browser-setup-no-apt; three review notes in docs/debts/notes.md. Fault (Oct 26): degen's own workflow; the claude-settings gap was that a CI fix could not reach other repos. Deferred: the child-repo part waits for your plan check (shiv, Oct 26). Each flagged repo drops its apt step and adopts the action in its own lane; degen also skips web tests on native-only changes. Port: yes, banchi, q_max, degen, joyous. Linked: c76 keeps pins to this action current. Deferred (shiv, Oct 27): the child-repo part changes other repos, which needs your plan check. Asked: waiting page item 2 (yes to the one plan).", "updatedAt": "2026-10-28T05:10:00Z"}, "c79": {"title": "A follow-up with one safe answer starts without asking you", "phase": "cleanup", "status": "done", "order": 109.31, "why": "Oct 26, three times in one day: sessions asked \"push then delete?\" (c70, c75), \"fix the sentence or drop the lane?\" (c76) and \"fix the CI waste in a lane after PR 263 merges?\", each with an obvious yes.", "note": "Done Oct 27, checked by triage on main 2ad85de6: merged on PR 643 (safe follow-ups start without asking), head 84cc5d9: rule parallelism-keep-going (start each answered queued item when a lane ends) amended in place. A follow-up the session found that serves your goal and can be undone starts without asking and is named under Done or Next. Still asks: a step that cannot be undone (a message to a person, spend, a delete with no copy, a deploy or live change, unless a standing grant covers it), a change to your goal, or another repo; other rules' waits, such as a merge, still hold. Two Sonnet review rounds, round 2 CLEAR. A degen session may not run the new rule until its install refreshes. c59's part 3 (a Stop check on idle turn ends) stays parked until an idle-end repeat. Port: yes, the rule is global.", "updatedAt": "2026-10-27T00:22:00Z"}, "c8": {"ask": "Draft the sandbox settings and the test list for the Mac trial.", "note": "Closed by your word, Oct 26 ('c8 close'): decision adoptions-declined-2026-09-28 already declined the sandbox; the guard and deny rules give most of the gain. Reopens only on a guard bypass those miss.", "order": 450, "phase": "later", "status": "done", "title": "Try the sandbox on your Mac", "updatedAt": "2026-10-26T05:05:00Z", "why": "The OS blocks writes outside the repo however a command is spelled. Since Windows stays native (Oct 17), this protects Mac sessions only, and the guard code it would have replaced stays for Windows."}, "c80": {"title": "A refusal that an override would lift offers you the exact line to type", "phase": "cleanup", "status": "done", "order": 103.355, "why": "Your gripe, Oct 26 (rename-lane thread): when a guard refuses or asks and an override would let it through, you have to remember the syntax yourself.", "note": "Done: built with c85 as #679, merged in batch #683 (main b031394f, Oct 27 04:15 CDT). Ruling home: decision owner-override-pass (checked at main 54be9f1): `override` (one act), `override <n>m|h`, `override off`, `opus 2h` / `opus builders 2h`; text from an agent grants nothing and state/ is frozen, so printing the line cannot let a session grant itself a pass. Option (a), needs no answer from you, one cloud lane after #638: refuse() in hooks/guard_core.py appends the line that would lift that refusal (from the pass module, one home for the syntax: hooks/override_pass.py on main, renamed hooks/override.py by #638), and a shiv-stylisms line says an agent offers you that line as a ready answer to accept or copy. Checked: rule git-remedy-never-names-target forbids naming the forbidden target, not the pass, so it holds; refusals that already hand a lossless fix (c70 sweep) keep that fix first, with the override line second. Option (b), an AskUserQuestion answer that grants the pass, deferred (shiv, Oct 26): it changes owner-override-pass and needs your ruling. Port: yes, the guard is global. Placed after c75, ahead of c76 (triage, Oct 26): same family as c75, and it fires on every refusal you could lift. Build with c85 (the pass reaches every gate), same files. Dispatched as one lane (Oct 27), brief briefs/c80-c85-override-everywhere.md.", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# c80 + c85: a refusal offers the override line, and the override reaches every gate\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main b5969a2 or newer\n(o13 lane C renamed the pass: decision owner-override, hooks/override.py, guard_core\nset_override_context and set_override_veto). claude-settings only. Never rebase onto main after\nreview. Send the green, reviewed head to the build advisor; never merge. One lane: same files.\n\n## Goal\n\nWhen an override would lift a refusal, the refusal prints the exact line the owner types. Every\ngate an override should reach does reach it, and a gate that cannot be reached says that no\noverride lifts it. Owner gripes, Oct 26: \"i imagined override just overrides anything anywhere\",\nand the owner has to remember the syntax.\n\n## Inputs\n\n- c80, option (a): `guard_core.refuse()` appends the line that would lift that refusal. Take the\n  syntax from hooks/override.py, its one home. A shiv-stylisms line says an agent offers that\n  line as a ready answer to accept or copy. Text from an agent grants nothing, so printing the line\n  cannot let a session grant itself an override. Rule git-remedy-never-names-target still holds.\n  Where a refusal already gives a lossless fix (the c70 sweep), keep that fix first and put the\n  override line second. Option (b), an AskUserQuestion answer that grants it, is deferred.\n- c85: move each gate an override cannot reach behind refuse(), as #645 did for SendMessage:\n  the Agent prompt judge in settings.json, the AskUserQuestion agent hook, the pkill and killall\n  deny entries, the bin/rm and bin/merge shims, and the missing-module deny in hooks/guard.py.\n  Where that cannot be done (a platform deny list, a shim outside Python), the refusal says that no\n  override lifts it. The owner's own exclusions stay: frozen paths, git env vars, a kill of pid 0,\n  1 or -1, the role and model guards, and worktree-home.\n- Rewrite decision owner-override in place: its \"Outside every override\" list now matches what is\n  built. Keep rule_audit pins true, and say why they move.\n- This changes guards, so the review cap and the net-value test apply (rule roles-review-cap-three).\n\n## Proof\n\nTest-author first. Cases red on main: a refusal that an override lifts prints the override line,\nand one with no override prints the no-override line. Each moved gate is lifted by an override\nand refused without one. Then green. Run mutate_guard on the touched guard modules. Quick checks:\nrule_audit, test_check_glossary, check_mod_versions, hook_catalog --check, check_silent_undo\n--strict, shellcheck on changed *.sh, `bin/ste-changed origin/main`, and the guard suites.\n\n## Report\n\nAt most 25 lines: draft PR, head, red-run proof, verdicts, reviewer rounds and net value (fresh Sonnet reviewer).\nPort: yes, the guard is global.\n"}, "c81": {"title": "The waiting page lets you clear an answer or say \"none of these\"", "phase": "cleanup", "status": "done", "order": 103.357, "why": "Your gripe, Oct 26 (waiting page, item 27): you could not unselect an answer, and none of the three options was right.", "note": "Done Oct 27: PR #646 merged in batch #649 (main 2ad85de6, checked by triage). Every decision has a \"None of these\" option that needs a note saying what you want instead, and every item has a Clear button that removes the draft or the saved answer; the skill reads \"none\" as a request for new options and a cleared answer as no answer; 8 browser tests run in the gates-shoot job. Pilot page fixed Oct 26 (https://claude.ai/artifact/9PJB2skRSMtCC4XHvzbmB8). Port: yes, every repo's page comes from the skill; a page already published keeps its old copy until it is republished.", "updatedAt": "2026-10-27T00:25:00Z"}, "c82": {"title": "An override pass lifts the SendMessage wording judge", "phase": "cleanup", "status": "active", "order": 103.305, "why": "Oct 26: your 10-minute override did nothing; a cross-account ping was blocked three times by a judge that never sees the pass.", "note": "Cause: the SendMessage wording judge was a prompt-type hook in settings.json. A prompt hook sees only the call's JSON, so it cannot read the override pass, and a command hook cannot stop a sibling hook. Ruling, Oct 26 15:28 CDT (shiv, \"Fix the hook\"), recorded in decision owner-override-pass. Fix: the wording judge runs in hooks/sendmessage_state.py with the same prompt and model, and any deny goes through guard_core.refuse(), the one place that reads the pass. Built in PR #645 (red on main's hook, 20 checks; two Sonnet review rounds, clear) and merged in batch #649 (main 2ad85de6). Left: the owner re-runs the live cross-account ping test with the brief in ask (briefs/c82-cross-account-ping-retest.md); the step closes on its verdict. Port: no; these hooks install from claude-settings to every repo already. Placed ahead of c77 (triage, Oct 26). You marked the ping test done, Oct 27 23:48 CDT (waiting page item 5), with no verdict in the note. Waits on: the sending session's guard.log lines (override let the ping through; a bare ping is denied); it closes on them.", "updatedAt": "2026-10-28T04:55:00Z", "ask": "# c82: re-run the cross-account ping test\n\nPaste the block below, whole, into the sending session: the one on the account where your ping was\nblocked. Written by the local liaison, Oct 27, against claude-settings main 2ad85de6 (batch #649,\nwhich carries PR #645).\n\n```\nRe-run the cross-account ping test for c82 (an override pass lifts the SendMessage wording judge). Do nothing else.\n1. Pull claude-settings to 2ad85de6 or later and reinstall. Then confirm ~/.claude/settings.json has no \"Judge this SendMessage\" prompt hook, and that the SendMessage command hook's timeout is 50. If either check fails, stop and report.\n2. Wait for me to type an override (for example \"override 10m\"). Then send the same ping as before to the session on my other account.\n3. Expect it to go through, with a guard.log line \"override parallelism-no-mid-task-talk\".\n4. After the override ends, send one bare chatter ping with no override. Expect a deny, which shows the judge still works.\nReport the guard.log lines and the verdict of each send, not the transcript. Five lines at most.\n```\n"}, "c83": {"title": "Re-ask how lanes and CI split the test runs (c69), with corrected options", "phase": "cleanup", "status": "done", "order": 109.37, "why": "Your answer on the waiting page, Oct 26, to c69's one-CI-job-run-per-lane question: \"none of these\", \"i think u misunderstand the pros and cons tradeoffs i had here\".", "note": "Closed, Oct 27 (triage): merged into c95. Your answer on item 31 (Oct 27 12:07 CDT, pick e with a, c and e) settles how lanes and CI split test runs; c69's lane merged in #637.", "updatedAt": "2026-10-27T18:40:00Z"}, "c84": {"title": "A question waiting on you never stops a session from orchestrating", "phase": "cleanup", "status": "done", "order": 103.33, "why": "Your idea, Oct 26 (waiting page, item 30): \"have questions time out and/or expire so that way they dont hang for a long time ... it realizes owner wont answer atm and it gets back to orchestrating\".", "note": "Done, Oct 27: PR 648 (no question box while work runs) landed in batch PR 652, main e305bdb. Follow-up check: c86. Design (c77 thread and triage, Oct 26): a literal timer breaks rule outcomes-mechanize-rules (no timer, no long-lived process), and a hook cannot cancel a question already on screen. So the shape: while a session has agents or lanes running, it never opens a blocking question box; it puts the question on the waiting page (c71) and in its reply, keeps working on what does not depend on the answer (rule questions-go-to-owner), and reads the answer at its next turn. With nothing running, the box stays, linking the page (ruling 3a, c71). Your idea asks for that narrowing of 3a, so it needs no further answer. Built (PR 648, merged Oct 27): amends questions-go-to-owner, the waiting-page skill and its decision (ruling 3b, narrows 3a). No check: the question hook judges the box alone and cannot see live agents, so a check does not fit it; debt question-box-while-work-runs records the gap. Separate from c77: PR 642 fixes the disk-fill cause by itself. Port: yes, the rule is global. Placed after c77, ahead of c75 (triage, Oct 26): a hanging question stalls every lane behind it.", "updatedAt": "2026-10-27T02:30:00Z"}, "c85": {"title": "The override pass reaches every gate, or the refusal says no override lifts it", "phase": "cleanup", "status": "done", "order": 103.306, "why": "Your gripe, Oct 26: \"i imagined override just overrides anything anywhere\"; the SendMessage judge (c82) was one gate it could not reach, and there are more.", "note": "Done: built with c80 as #679, merged in batch #683 (main b031394f, Oct 27 04:15 CDT). Finding, Oct 26 (c82 thread): the pass is read in one place, guard_core.refuse(). After #645, gates it still cannot reach: the Agent prompt judge in settings.json, the AskUserQuestion agent hook (question reviewer), the pkill/killall entries in the settings.json deny list, the bin/rm and bin/merge shims, and the missing-module deny in hooks/guard.py. Decision owner-override-pass lists them under \"Outside every pass\" as an orchestrator's call, not your word, so your gripe now governs them. Your own exclusions stay: frozen paths, git env vars, kill of pid 0, 1 or -1, the role and model guards, worktree-home. Fix, needs no answer from you: move each unreachable gate behind refuse(), as #645 did for SendMessage; where that cannot be done (a platform deny list, a shim outside Python), the refusal says no override lifts it, so an override never fails silently. Build with c80 (a refusal offers the exact override line), same files. #645 merged in batch #649 (main 2ad85de6, Oct 27), so this is ready. Port: no; it all lives in claude-settings and installs everywhere. Placed ahead of c77, after c82 (triage, Oct 26): the same silent-override failure, at more gates. Dispatched as one lane (Oct 27), brief briefs/c80-c85-override-everywhere.md.", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# c80 + c85: a refusal offers the override line, and the override reaches every gate\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main b5969a2 or newer\n(o13 lane C renamed the pass: decision owner-override, hooks/override.py, guard_core\nset_override_context and set_override_veto). claude-settings only. Never rebase onto main after\nreview. Send the green, reviewed head to the build advisor; never merge. One lane: same files.\n\n## Goal\n\nWhen an override would lift a refusal, the refusal prints the exact line the owner types. Every\ngate an override should reach does reach it, and a gate that cannot be reached says that no\noverride lifts it. Owner gripes, Oct 26: \"i imagined override just overrides anything anywhere\",\nand the owner has to remember the syntax.\n\n## Inputs\n\n- c80, option (a): `guard_core.refuse()` appends the line that would lift that refusal. Take the\n  syntax from hooks/override.py, its one home. A shiv-stylisms line says an agent offers that\n  line as a ready answer to accept or copy. Text from an agent grants nothing, so printing the line\n  cannot let a session grant itself an override. Rule git-remedy-never-names-target still holds.\n  Where a refusal already gives a lossless fix (the c70 sweep), keep that fix first and put the\n  override line second. Option (b), an AskUserQuestion answer that grants it, is deferred.\n- c85: move each gate an override cannot reach behind refuse(), as #645 did for SendMessage:\n  the Agent prompt judge in settings.json, the AskUserQuestion agent hook, the pkill and killall\n  deny entries, the bin/rm and bin/merge shims, and the missing-module deny in hooks/guard.py.\n  Where that cannot be done (a platform deny list, a shim outside Python), the refusal says that no\n  override lifts it. The owner's own exclusions stay: frozen paths, git env vars, a kill of pid 0,\n  1 or -1, the role and model guards, and worktree-home.\n- Rewrite decision owner-override in place: its \"Outside every override\" list now matches what is\n  built. Keep rule_audit pins true, and say why they move.\n- This changes guards, so the review cap and the net-value test apply (rule roles-review-cap-three).\n\n## Proof\n\nTest-author first. Cases red on main: a refusal that an override lifts prints the override line,\nand one with no override prints the no-override line. Each moved gate is lifted by an override\nand refused without one. Then green. Run mutate_guard on the touched guard modules. Quick checks:\nrule_audit, test_check_glossary, check_mod_versions, hook_catalog --check, check_silent_undo\n--strict, shellcheck on changed *.sh, `bin/ste-changed origin/main`, and the guard suites.\n\n## Report\n\nAt most 25 lines: draft PR, head, red-run proof, verdicts, reviewer rounds and net value (fresh Sonnet reviewer).\nPort: yes, the guard is global.\n"}, "c86": {"title": "A check refuses a question box while the session's own agents or commands run", "phase": "cleanup", "status": "done", "order": 103.335, "why": "Your gripe, Oct 26: a UI/UX session's question waited on you while its background agents filled the disk. c84 makes it a rule; this makes a machine hold it.", "note": "Done, Oct 27: PR 665 landed in batch PR 667 (main 835cde5). The session-board mod refuses AskUserQuestion while a live agent, background command or workflow of the session runs. Port: no; the mod installs in every repo's sessions from claude-settings.", "updatedAt": "2026-10-27T04:20:00Z", "ask": "# c86: a check refuses a question box while the session's own work runs\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main e305bdb or newer.\nclaude-settings only. Never rebase onto main after review. Send the green, reviewed head to the\nbuild advisor (\"Advise the claude-settings build\", read the roster in the project instructions);\nnever merge.\n\n## Goal\n\nRule questions-go-to-owner (c84, PR 648, on main) says: while an agent, a lane or a background\ncommand of this session runs, or starts in the same response, never open a question box. Make a\nmachine hold it: refuse AskUserQuestion while this session has a live agent or background command.\n\n## Inputs\n\n- Incident: Oct 26, a UI session waited on a question box while its background agents filled the\n  disk and crashed it. Record it in the guard rule's record (building-guard-needs-incident).\n- Debt question-box-while-work-runs (docs/debts) holds the gap. Close it in the same PR.\n- The only reader of live agents today is the host agent list that the session-board mod reads.\n  Find how it reads that list, and read the same source from a PreToolUse hook on AskUserQuestion.\n  If no source a hook can read exists, stop and report that as a finding with what you measured.\n- Rule outcomes-mechanize-rules: read on demand inside the hook only, no timer, no watcher, no new\n  long-lived process. State the cost in the record, and a test proves it.\n- The refusal text says what to do instead: ask in the reply and on the waiting page, keep working.\n\n## Proof\n\nTest-author writes the new cases first and shows them red on main. Cases: a live agent refuses;\na live background command refuses; none running allows; the source unreadable fails open and says\nunknown. Then build until green. Run `bin/ci-job gates --base origin/main` once in the background\n(90-minute timeout) before you report, and `bin/ste-changed origin/main`.\n\n## Report\n\nAt most 25 lines: PR, head, red-run proof, gates verdict per failing or unknown step, reviewer\nverdict (fresh Sonnet reviewer; the diff changes a guard).\n"}, "c87": {"title": "Local sessions stop failing on the GitHub plugin's empty token", "phase": "cleanup", "status": "todo", "order": 103.91, "why": "A mailaudit session's finding, Oct 26: the GitHub plugin sends 'Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}' with the variable unset, so GitHub's MCP server refuses it on every local session.", "note": "Ruling, Oct 27 12:07 CDT (shiv, waiting page item 35): (b), try a token once on the Mac and see what it adds before choosing. Finding, Oct 27 12:09 CDT (local liaison): the GitHub plugin is not on the Mac at all (plugin list, MCP list and every repo's settings checked), so the empty-token failure is on Windows. Asked: waiting page item 7, (a) test on Windows, (b) install the plugin on the Mac to test, or (c) turn it off on Windows; waiting-page item c87-token-make is withdrawn until then. Waits on: a local session. Checked claude-settings main 54be9f1: its enabledPlugins does not list a GitHub plugin. The fix lands in claude-settings so every machine gets it. Port: no; global settings install everywhere. Placed ahead of c54, after c47 (triage, Oct 26): both are local setup on your machines.", "updatedAt": "2026-10-28T05:10:00Z"}, "c88": {"title": "A session waiting on CI never sleeps through the result", "phase": "cleanup", "status": "done", "order": 103.302, "why": "Your gripe, Oct 26 (\"how come I haven't seen much done in the past hours?\"): nothing moved for about 2.5 hours. Batch #649's gates-macos job went red at 22:05 and green at 22:09; a run with a failed job sends no all-done event, a green job wakes nobody, and the build advisor had set no check-in, so it never woke.", "note": "Done: PR 651 merged Oct 27. gates.yml's last job, ci-done, posts one PR comment when a run ends with a failed or cancelled job (shared action actions/ci-done-comment). Measured on batch 663: the bot comment woke the watching build advisor as issue_comment.created about 2 minutes after the post. A run cancelled by a newer push posts nothing. Fallback rule git-ci-wait-checks-in: a send_later check-in on each CI wait and after each red job. Stall check for standing roles in the project-ops operating model. Platform ask for shiv: plans/c88-platform-ask.md in project files. Port: yes; the rule is global and the comment action is opt-in for each repo.", "updatedAt": "2026-10-27T04:30:00Z"}, "c89": {"title": "One shared simulator tool, beside ios-ship", "phase": "cleanup", "status": "todo", "order": 103.92, "why": "The iOS kit consultation, Oct 27 (your question: should an iOS kit repo hold all this?): the simulator routine lives only in degen, while home-app and mailaudit restate it in prose.", "note": "Report: https://claude.ai/artifact/36CtFQ6CaTszMaxxZvuCXq. Part 1 done: bin/sim-test landed in claude-settings with its 11-case suite, PR #653 (Add bin/sim-test), merged Oct 27. It reuses a booted iPhone, else boots the shared iPhone 18 Pro and shuts down only what it booted. Two review notes kept as is: a TERM to the script's pid alone waits for xcodebuild to end before the shutdown; TERM exits 130. Part 2, Deferred (shiv, Oct 27): degen's copy goes, and home-app's CLAUDE.md and mailaudit's decision one-simulator-per-mac point to the tool; waits on your plan check, like c47 part 2. Asked: waiting page item 2 (yes to the one plan). Port: yes, to the four iOS repos only. Placed ahead of c54, after c87 (triage, Oct 27): same iOS cleanup as c47.", "updatedAt": "2026-10-28T05:10:00Z"}, "c8b": {"ask": "Desktop WSL sessions load plugins now. Is moving Windows to WSL2 worth it, and what could we cut?", "note": "Decided Oct 17: Windows stays native. Desktop app WSL sessions don't load plugins, and losing your mods is a dealbreaker. Revisit only if desktop WSL sessions start loading plugins. Rechecked Oct 20 (code.claude.com/docs/en/desktop-wsl): still not available in WSL sessions: the integrated terminal, connectors and plugins, session forking, the file browser pane and @ file suggestions. No trial lane is needed until that changes.", "order": 85, "phase": "cleanup", "status": "done", "title": "Decide where Windows sessions run: native or WSL2", "updatedAt": "2026-10-20T18:18:00Z", "why": "On WSL2, Windows behaves like the Mac: the same shell, the same sandbox, one set of rules. Much of claude-settings exists to make native Windows behave (3,248 lines of PowerShell and .cmd; 61 of 126 decisions mention Windows, WSL or PowerShell). Moving opens a big cull. The cost: desktop app WSL sessions don't load plugins yet, so you'd run Claude Code from a WSL terminal, and repos move into the Linux filesystem."}, "c9": {"note": "Merged into c23 (triage, Oct 26): a guard rule with no test is a cull candidate.", "order": 460, "phase": "later", "status": "done", "title": "Optional: fail a guard rule with no test", "updatedAt": "2026-10-26T05:30:00Z", "why": "One new rule_audit case keeps future prose deletions honest."}, "c90": {"title": "A shared Swift package for the iOS apps, only if the copies start to hurt", "phase": "later", "status": "todo", "order": 470, "why": "The iOS kit consultation, Oct 27: keychain wrappers (about 80 to 170 lines) sit in home-app, degen and mailaudit; small WebSocket clients in home-app and mailaudit.", "note": "Deferred (triage, Oct 27): not now. The overlap is small, and mailaudit is public, so a private package would break its CI. Its trigger likely comes with your next iOS app (you plan more, Oct 27); the package would then be public, so mailaudit's CI can pull it, and hold small helpers only, never screens or tokens. Revisit when a fourth app needs the keychain wrapper, or a bug fixed in one copy turns up in another. Port: no. Report: https://claude.ai/artifact/36CtFQ6CaTszMaxxZvuCXq. Note, Oct 27 (consultation): lowest iOS versions differ and no repo says why. home-app 18.0 (maybe family phones on older iOS, unverified); ios-adblock 17.2 (likely the 19 MB content-blocker rule cap, per its research notes); degen and mailaudit 26 (defaults you accepted Oct 11). If every phone runs iOS 26, raising both would remove fallback code; that needs you to say which iOS the family phones run. Due after: a fourth app needs the keychain wrapper, or a fix in one copy is missed in another.", "updatedAt": "2026-10-28T05:12:00Z"}, "c91": {"title": "One iOS standard for every iOS repo", "phase": "cleanup", "status": "doing", "order": 103.93, "why": "Your reframe, Oct 27: \"i never intended for the way i use these repos' interaction with ios/phone etc to be different ... i'm assuming there's best practices from each.\"", "note": "Plan (iOS kit consultation, report https://claude.ai/artifact/36CtFQ6CaTszMaxxZvuCXq, gold-standard column): one \"iOS apps\" page in claude-settings sets the standard for every iOS repo: the same make targets (phone, testflight, native-check); logic in an in-repo Swift package; XcodeGen; Swift 6; CI pinned to macos-26 that runs package tests and compiles every app; slow tests once per batch on the Mac through the shared simulator tool (c89); tokens.json generated into Swift; and your Oct 22 ruling \"Mac install first, TestFlight fallback, every app\" (recorded only in mailaudit). compliance-check flags drift. Known drift: home-app CI on macos-latest, ios-adblock in Swift 5.0 mode. Part 1 merged to main Oct 27 (PR #666, batch 667): the ios-apps skill page, the new-app starter, the iOS compliance probe, and decision ios-mac-install-first. No Swift compile proof yet; the first make native-check on the Mac is it. The standard's slow tests on the Mac through bin/sim-test clash with home-app's rule that iPhone tests run in CI only; settle it with you in the home-app visit. Deferred (shiv, Oct 27): (a) the repo visits wait on your plan check; (b) one install rule for all iOS repos, timing per your answer (pick offered: a nightly Mac job about 3 AM CDT installs each app whose main moved; or the merging session installs when on the Mac; or only on request). Asked: waiting page item 6 (install timing); the visits are item 2. Port: yes, every iOS repo, new ones included. Placed ahead of c54, after c47 and c89 (triage, Oct 27).", "updatedAt": "2026-10-28T05:10:00Z", "ask": "# c91 part 1: one iOS standard page and a new-app starter in claude-settings\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main e305bdb or newer.\nclaude-settings only: read other repos for reference, never push to them. Never rebase onto main\nafter review. Send the green, reviewed head to the build advisor; never merge.\n\n## Goal\n\nOne \"iOS apps\" page in claude-settings sets the standard every iOS repo follows, plus a starter\nfor a new app, plus compliance-check rows that flag drift.\n\n## Inputs\n\n- Plan: the iOS kit consultation report, /mnt/project-files/reports/ios-kit-consultation.html.\n  Read its gold-standard column.\n- The standard: the same make targets (phone, testflight, native-check); logic in an in-repo Swift\n  package; XcodeGen; Swift 6; CI pinned to macos-26 that runs package tests and compiles every app;\n  slow tests once per batch on the Mac through bin/sim-test (c89, in batch #663); tokens.json\n  generated into Swift; shiv's ruling Oct 22 \"Mac install first, TestFlight fallback, every app\"\n  (today recorded only in mailaudit; give it a home here as a decision).\n- Reference repos to read: home-app, mailaudit, ios-adblock, degen. Known drift: home-app CI on\n  macos-latest; ios-adblock in Swift 5.0 mode.\n- Starter: sets up project.yml, the make targets, a Kit package, the CI workflow and a bin/ios-ship\n  entry. It must run from a clean folder and its own test proves the generated tree.\n- Deferred, not in this lane: the repo visits and the install-timing rule (both wait on shiv).\n\n## Proof\n\nStarter test red first, then green. compliance-check rows each go red on a fixture with the drift\nthey flag. Run `bin/ci-job gates --base origin/main` once (background, 90-minute timeout) and\n`bin/ste-changed origin/main` before you report.\n\n## Report\n\nAt most 25 lines: PR, head, proofs, gates verdict per failing or unknown step, reviewer verdict.\nPortability call: yes, every iOS repo (already ruled on the step).\n"}, "c93": {"title": "Every comparison table in a report to you has a gold-standard column", "phase": "cleanup", "status": "done", "order": 103.345, "why": "Your gripe, Oct 27 (iOS kit consultation): \"in all these tables include like 'gold standard' so i can get an idea of whats going on as i'm such a noob\".", "note": "Merged: batch PR #663 landed on main as 1733dac (PR #655 closed as replaced). The shiv-stylisms output style says a comparison table in a reply or report to you carries a gold-standard or target column. The reply judge checks it on every reply that holds a table (async Haiku, never blocks); the rule stays unmechanized because only a model can tell a comparison table. Notes: the table finder skips separators with 1 or 2 dashes per cell; every reply with a table costs one Haiku call (frequency unmeasured). Port: yes; the output style installs everywhere.", "updatedAt": "2026-10-27T04:20:00Z"}, "c94": {"title": "Every step deferred on you has a question waiting for you", "phase": "cleanup", "status": "done", "order": 103.34, "why": "Finding, Oct 27 (iOS kit consultation): c47 part 2 needed your plan check, but no thread ever asked you; you asked \"is the plan waiting for me in another session\", and it was not.", "note": "Built (triage, Oct 27): build.py's upkeep line counts open steps deferred on you whose note has neither an \"Asked:\" line (where the question sits) nor a \"Due after:\" line (the work that must land before it can be asked); four tests, red on the old build.py. First run found 9; triage raised c87, d4 and d9 on the waiting page, pointed c77 and c91 at their existing questions, and marked c83, d5, d6 and r6 Due after. Port: no; the roadmap lives in claude-settings.", "updatedAt": "2026-10-27T01:25:00Z"}, "c95": {"title": "CI runs at milestones, not on every merge, and you get options on best practice", "phase": "cleanup", "status": "active", "order": 103.303, "why": "Your gripe, Oct 27 (waiting page, item 27): \"Not only drop the exception, I merge so arbitrarily and can merge so often that frankly I still find the amount of CI used to be preposterous. I think there may be something in this roadmap already of essentially wanting \\\"milestone-style\\\" reviews of CI -- I think my Q_Max repo might have some examples of that where I got so sick of my CI bill that I was like look orchestrator after u see a ton has landed then yes run a check but not every merge. That could be me not doing best practices, and I'm eager to learn, and/but I want some help here\"", "note": "Measured Oct 13-27 (main 2ad85de): about 16,800 runner-minutes a week; the run after each merge to main is 38% of it and ended green 4 of 48 times, mostly cut off at Windows and Chromium time caps. Part 1 doc: https://claude.ai/artifact/XMDQP1nVCuq3u35qvwE8eV. Ruling, Oct 27 12:07 CDT (shiv, item 31): (e), trust first then cut in steps; step 1 (e): the full run stops timing out, a mutation check measures test value, repaired merges are counted; step 2, q_max's shape (quick checks per branch, full suite on main); step 3, (c)'s milestone runs. Each step starts only past its measured bar; a missed bar steps back. The rule lands in the global CLAUDE.md and the gates workflows. Step 1 landed: read race (#707); 1a (#715, the full run stops timing out, repaired merges counted) and 1b (#721, which tests catch a planted bug) merged Oct 28 00:25 CDT in batch #725 (main 0fb91de); stamp.json now requires 13 checks, gates-guard and gates-windows-sweep added. Branch protection, your setting, still requires the old 11 (checked 00:32 CDT, Oct 28); waiting page item 1. 1a's findings: the Windows stamp fixture hang is c158; repaired_merges.py's count is a floor. Next: step 2 (quick checks per branch, full suite on main) starts once step 1's bar is met. Due after: step 1's bar, read from the full runs on main after #725. Port: yes, at each repo's visit. Placed ahead of c82, after c88 (triage, Oct 27): CI spend grows with every merge.", "updatedAt": "2026-10-28T06:15:00Z", "ask": "# Brief: c95 step 1a, the full run stops timing out\n\nRepo: shivinate7/claude-settings, from current main. One lane: builder (sonnet), then reviewer (sonnet). Ruling: shiv, Oct 27 12:07 CDT, waiting page item 31, pick (e) \"trust first, then cut in steps\" (roadmap step c95 holds the reading).\n\n## Task\nStep 1 needs a full run where red means broken, not out of time.\n1. Measure: for each job in .github/workflows/gates.yml, its duration over the last 30 completed runs (GitHub API, actions/runs and their jobs), and how many ended at their timeout with no red test step. Write the table into the decision that owns job caps (find it: the caps step c39 landed one), with a gold-standard column (target: the slowest of 30 runs under 80% of its cap).\n2. Fix each job over that target: split its slowest suite into another job, or raise the cap from the measured numbers (rule: a job that ends at its cap with no red step is re-capped or split). merge.py already prints \"job X: N of M min\" warnings; reuse its numbers, do not add a second reader.\n3. A small script (or a mode of an existing one) that counts merges to main that a later commit had to repair: a revert, or a commit whose message names a fix for a batch. Print the count for the last 14 days. It is read on demand, never on a timer.\n\n## Failure classes\n- A cap raised with no measured reason.\n- A split that drops a suite from every job (a test that no longer runs anywhere).\n\n## Check that proves it done\nThe table, the counts, and a test for the counting script (red on main: no script; green: it counts a planted revert in a fixture repo). `python3 bin/ci-job gates --lint --base origin/main` and `bin/ste-changed origin/main` pass. The branch's own CI run shows no job past 80% of its cap, or the report names the one that is and why.\n\n## Report\nAt most 15 lines: PR (draft), head, the table's worst three jobs before and after, the repaired-merge count, review verdict. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n"}, "c96": {"title": "Main's full CI run ends green, not cancelled", "phase": "cleanup", "status": "done", "order": 103.304, "why": "Finding, Oct 27 (c95 part 1): a milestone CI run is noise while most full runs never finish.", "note": "Done, Oct 27 (build advisor 6): all 85 cancels were job timeouts that c61 fixed; 4 of 6 main runs since are green, 2 later cancels were hangs. Watch: main 2ad85de red once in stall-watch case 23a (a known macOS timing flake); file a step if it repeats. Measured Oct 27 at main 2ad85de (c96 thread), gates.yml push runs on main, Oct 13 to 27: 85 of 134 cancelled. All 85 were job timeouts, none a newer push: main runs have had their own concurrency group with no cancel-in-progress since Oct 10 (adc21ce, each main run gets its own group), and every cancelled job stopped at its cap then (Windows merge 83 at 20 min, Windows guard 38 at 15 min, Windows rest 16, macOS 5, others 5). The fix already landed: c61 (Windows jobs fit their caps, b55643d) split the guard and merge suites into shards. Since its first main run (Oct 26 15:21 UTC), 6 runs: 4 green, 1 red, 1 cancelled. Green maxima now sit well inside every cap (merge shards 10.2 of 15 min, guard shards 13.7 of 20, rest 22.6 of 38, macOS 29.2 of 50). The 2 later cancels were hangs, not slow suites, so a higher cap would not help: d741cd5 guard mutation harness (green max 3.7 min, cap 10), 3b96ce8 gates-shoot Chromium install (green max 0.5, cap 10) and Windows rest janitor triggers suite. No workflow change built. Open: main's latest run (2ad85de) is red on a real failure, the macOS stall watch fixture suite. Recommend closing c96 (triage's call). Placed ahead of c82, after c95 (triage, Oct 27): it blocks c95's pick. Needs no answer from you. Port: no; claude-settings' own workflows.", "updatedAt": "2026-10-27T02:30:00Z"}, "c97": {"title": "A batch merges only after a green run against current main", "phase": "cleanup", "status": "done", "order": 103.3045, "why": "Finding, Oct 27 (c95 part 1): a batch could land untested against a main that moved.", "note": "Merged Oct 27 (PR #659, merge tool refuses a head that lacks main's tip). merge.py refuses before any claim when the PR head does not hold origin/main, and again after the check wait; the refusal says to merge main into the branch. A records-heal merge commit passes. Fresh Sonnet review round 1: clear. Merge suite: 572 tests pass; three new refusal tests were red on the old code. Record merge-needs-current-base. Branch protection unchanged: turning strict on is shiv's decision. Port: no; the merge tool is shared, so repos that use it get the refusal when they install it. Placed ahead of c82, after c96 (triage, Oct 27): every batch merge leans on it.", "updatedAt": "2026-10-27T03:10:07Z"}, "c98": {"title": "Every session sends fewer messages: an outbox, owners read their own answers, the roster is read first", "phase": "cleanup", "status": "done", "order": 103.31, "why": "Your ruling, Oct 26 19:40 CDT (\"Yes agreed\"), on the 60-an-hour message cap: the fewer-messages rules now sit only in this project's instructions.", "note": "Merged to main in batch PR 663 (main 1733dac, Oct 26 22:10 CDT); lane PR 660 closed as replaced. Ready for triage to close. Homes: the questions-go-to-owner rule and its decision entry, and the waiting-page skill, where the owning session reads its own answers at each wake and nobody relays them. The project-ops operating model has a \"Messages between threads\" section: the outbox, reading the roster before sending, no broadcast on a hand-off, and sending at once only when blocked or asked. No skill named orchestrate exists, so project-ops is that home. The scaffold now writes roadmap/outbox/README.md (red test first). Times in US Central stay a project instruction, not a global rule. Builder sonnet, reviewer sonnet. Port: yes; the rules are global. Placed ahead of c53's slot, after c88 and c97 (triage, Oct 27): every thread hits the cap.", "updatedAt": "2026-10-27T04:20:00Z"}, "c99": {"title": "Saving an answer on the waiting page gets a visible reply", "phase": "cleanup", "status": "done", "order": 103.395, "why": "Your gripe, Oct 26 (waiting page): \"would also prefer if there was a way that submitting questions resulted in a reaction\"; today you type \"submitted\" by hand.", "note": "Done, Oct 27: lane PR 662 landed in batch PR 667 (main 835cde5): a save on the waiting page sends a comment to Claude, which wakes each session watching the page. To turn it on, each live waiting page must be republished with the db and comments capabilities; that sits on c100's build lane. Port: yes, through the waiting-page skill.", "updatedAt": "2026-10-27T04:20:00Z"}, "d1": {"ask": "# d1 and d2: a designer agent and a design-reviewer agent, both on Opus\n\nCloud build thread brief. Build advisor (4), Oct 26, against claude-settings main 3b96ce8.\nBase: main 3b96ce8 (or the newest main when you start); never rebase onto main after review.\nclaude-settings only. Push roadmap edits to the branch only; only Triage the roadmap (3) republishes.\n\n## Rulings\n\n- shiv, Oct 26 (page item 15, b): Opus is allowed now for the designer and the design reviewer, a\n  standing exception to roles-sonnet-is-the-ceiling for design and UX agents only. No proof run first.\n- Deferred, not this lane: whether the designer runs Claude Code's /design canvas itself or shiv runs\n  it. Build the HTML-mockup path below; leave a one-line \"Deferred\" note in agents/designer.md.\n\n## Task\n\n1. CLAUDE.md roles-sonnet-is-the-ceiling: add the designer and design reviewer to the Opus list, in\n   the fewest words. Update subagent-model-cap (the model-per-role table) to match. One ruling covers\n   both; record it in its decision home with the date and shiv's word.\n2. agents/designer.md (Opus): for a lane that touches a screen, writes one HTML mockup per screen\n   under the repo's design folder (from layout.json; home-app's docs/design/ is the working pattern:\n   read it, do not copy files). Write scope: the design folder only. Add a write-scope guard only if\n   an existing guard can be extended; one home per capability.\n3. agents/design-reviewer.md (Opus): judges screenshots against the mockup and the repo's design\n   rules, at every size and theme the repo ships (verification-screens-verdict), verdict per screen.\n   skills/design-review names this agent. agents/reviewer.md stays as it is for code review.\n4. agents/builder.md: one clause, the builder builds to the step's mockup when one exists.\n5. Routing: one test, does the lane touch a screen. Put it where the orchestrator picks roles.\n\n## Failure classes and proof\n\n- Test-author first, red on main: the model-cap check (or the guard that asks before an Opus spawn)\n  allows Opus for designer and design-reviewer, still asks for any other agent (false-alarm and hole\n  cases both); a designer write outside the design folder is refused if a guard is built.\n- rule_audit's pinned counts move only by new anchors; say which bucket.\n- Run every gates.yml step locally before sending.\n- A fresh Sonnet reviewer reads the diff (it changes a rule and a guard).\n\n## Report\n\nCap 20 lines: Done, Deviations, Next. Include \"Port to other repos: yes or no, and why\".\nSend the green, reviewed head and branch to \"Advise the claude-settings build (4)\"\n(cmsg_01DoF7thf3iq2Srr1UsfXgh2EyHwiKacoTT56k4JHuc2RT). Keep the PR a draft. Park any question for\nshiv in the PR body.\n", "note": "Ruling, Oct 26 (shiv, page item 15, b): Opus is a standing word for the designer and the design reviewer, an exception to roles-sonnet-is-the-ceiling; no proof run first. Built with d2 in one lane, PR 625 (designer and design reviewer on Opus), merged to main Oct 27: agents/designer.md draws one HTML mockup plus notes per screen in the design folder (layout.json `design`, home-app docs/design/ is the pattern); guard rule designer-scope keeps its writes there; the builder builds to the mockup; routing is one test in roles-one-role-per-worker (does the lane touch a screen). Deferred (needs shiv): does the designer run /design itself, or does shiv run it and hand the canvas over. Until then, HTML mockups only.", "order": 210, "phase": "design", "status": "done", "title": "Add a designer agent", "updatedAt": "2026-10-27T00:20:00Z", "why": "Opus makes a mockup for every screen lane, so Sonnet builds to a picture of the target, and you comment on the exact element."}, "d10": {"title": "A design exploration spreads its mockups across blind, informed and directed lanes", "phase": "design", "status": "done", "order": 215, "why": "Your view, Oct 27: \"a lot of design work sometimes prefers a lane or two of totally blank and a lane that gets to see the old and then some in between with directed prompts ... to get a good mix of control and idea between the mockups.\"", "note": "Merged to main on PR #661 (designer lanes), Oct 27. New skill design-explore: the orchestrator runs two blind lanes, one informed and two directed per explored screen; each mockup is named and labelled by lane kind; the owner culls, and the kept pair becomes <screen>.html for the builder and design reviewer. The mix is a default a brief may change; a small change gets one informed designer. Blindness rests on the brief: nothing blocks a read. The designer's start-up brief line names the lane kinds (test red then green). Two Sonnet review rounds, no blockers left. Port: yes; the agent and skill install everywhere.", "updatedAt": "2026-10-27T03:12:00Z"}, "d2": {"note": "Ruling, Oct 26 (shiv, page item 15, b): Opus for the design reviewer, with d1. Built in d1's lane, PR 625 (designer and design reviewer on Opus), merged to main Oct 27: agents/design-reviewer.md gives a verdict per screen at each size and theme against the mockup and the design rules. It runs at design-review's compare step, after the blind list, so blind reviewers A and B stay agentType reviewer and never see the spec.", "order": 220, "phase": "design", "status": "done", "title": "Add a design-reviewer agent", "updatedAt": "2026-10-27T00:20:00Z", "why": "Opus judges screenshots instead of Haiku. Design-review gates every screen change, solo mode too.", "ask": "Brief sits in d1 (\"d1 and d2: a designer agent and a design-reviewer agent, both on Opus\"), briefs/d1-d2-designer-and-design-reviewer.md."}, "d3": {"note": "Merged into d1 (triage, Oct 26): builder.md already loads frontend-design and the ux files; the one clause left (build to the designer's mockup when one exists) is part of d1.", "order": 230, "phase": "design", "status": "done", "title": "Builders build to the mockup", "updatedAt": "2026-10-26T05:30:00Z", "why": "Load frontend-design for every screen change, and unblock impeccable's polish and layout."}, "d4": {"note": "Ruling, Oct 27 11:45 CDT (shiv, waiting page item d4-first-design-test): the first test of the design flow is a fresh, blind pass at a true phone app for Banchi; /board and a home-app screen are dropped. Nothing is pushed to banchi; building any of it is a later ask. Done Oct 28 (d4 design thread): a blind Opus designer drew 3 directions, D1 Four tabs, D2 Today, D3 Shelf (bold); an Opus design reviewer passed the set in round 3 of 3, each screen at both Duo sizes and themes; all 11 option pictures pass c147. Files: designs/d4-banchi-phone/ on roadmap (51754a6f). Assumed Duo size 360x780 folded, 760x780 unfolded, printed on every mockup. Deferred: shiv picks. Q1 which direction(s): A D1, B D2, C D3. Q2 how the helper finds a card in a box: A count from the front, B count from a named divider, C photos of the two neighbours. Q3 when the seller settles unsure cards: A during the sitting, B after, in a pile, C never. Q4 a helper home of their own: A no, B yes. Designer and reviewer both pick B on every question (Q1 with D3's box drawing for \"I cannot find it\", Q2 with C as fallback). Also: confirm the Duo size, and four small grants (on the page). Asked: waiting page items 13 to 21 (one group, each option with its picture; triage, Oct 28), and the picks page https://claude.ai/artifact/F2pNQsrFg6fDSqFQzKpasU.", "order": 103.3392, "phase": "design", "status": "doing", "title": "First design test: a fresh, blind pass at a true phone app for Banchi", "updatedAt": "2026-10-28T05:05:00Z", "why": "Old premise: /board, a proof of concept from three plain elements; it became the session-board pane (stale Oct 26).", "ask": "# d4: first design test, a blind pass at a true phone app for Banchi\n\nCloud design thread brief. Build advisor (10), Oct 27, against claude-settings main 6a3e842.\nRuling, Oct 27 11:45 CDT (shiv, waiting page item d4-first-design-test): a fresh, random pass at a\ntrue mobile app for Banchi. /board and a home-app screen are dropped.\n\n## Roles\nOne designer agent (Opus, agents/designer.md, the d1 role), then one design reviewer (Opus).\nDesigner and reviewer are separate agents.\n\n## Task\n1. The designer runs skills/design-explore blind, per c109's template: no current screen and no spec\n   beyond the job. The job: \"Bulk-list pre-sorted TCG singles on TCGplayer with zero attention per\n   card, and know where every card physically is\", on a phone. Read nothing in shivinate7/banchi.\n2. Target the iPhone Duo folded first (c113), then unfolded.\n3. Make three to five directions. Each one is a mockup with its named states (empty, loading, a full\n   list, an error), as self-contained HTML plus a PNG per state.\n4. Save them under the roadmap branch, designs/d4-banchi-phone/. Push nothing to banchi.\n5. They reach shiv as pictures inline on the waiting page's Designs tab (d9). d9 lands in the next\n   batch. If it is not on main when the designs are done, report that and stop. The build advisor\n   adds the page item after the merge.\n\n## Done when\nThe design reviewer passes each direction against docs/design. The report lists each direction in\none line, with its file paths. Report cap 15 lines. Port: the flow is global; the mockups are Banchi's.\n"}, "d5": {"note": "Deferred (shiv, Oct 26): each idea needs your case-by-case call. Asked: waiting page item 12.\nYour word, Oct 26: banchi's design work was half done; there is a lot of good in it, but none of it goes in unvetted: an idea enters ux/ only with its own case (the outcome it protects, and a check), not because banchi has it. This narrows your Oct 20 ruling (only ideas move into ux/, never values or screens). Checked Oct 26 at claude-settings 149f4bc and banchi 19abdfb: ux/principles.md holds one banchi-sourced rule already, the icon rule (ux-one-plain-name, citing banchi's UX-118); spacing by relationship and motion roles are not in ux/; ux/tokens.md says motion is per repo. The 4px pick (banchi's floor plus 2, 3 and 6px steps) is withdrawn. Open for you: keep the icon rule on its own merits, or re-argue it. Due after: the Design phase opens.", "order": 250, "phase": "design", "status": "todo", "title": "Decide which design ideas belong in ux/, each on its own case", "updatedAt": "2026-10-28T05:10:00Z", "why": "ux/ holds the design ideas every repo shares. Candidates: spacing by relationship, the four jobs of motion, a named reference screen, and a spacing floor."}, "d6": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (what is left is the roll-out to other repos).\nChecked Oct 26 at 149f4bc: no screenshot script in claude-settings (bin/ has none); home-app has none either (f8a59b2). banchi still has scripts/screenshot.sh with a 1280x900 viewport (19abdfb); q_max has Playwright installed but no screenshot command (b47bd00). Ruling Oct 17: build the shared script here; adding it to each child repo and fixing banchi's 1280 viewport is Roll out. Your ruling Oct 20 (o11): one scripts/shoot in claude-settings, installed like the hooks; each repo keeps only a config (URL, sizes, themes, simulator). The script is the check; a browser is for exploring. Found Oct 26: cloud sessions ship Chromium and Playwright, and the desktop app's browser pane is allowed in settings.json, so the script needs no MCP (d8 folds in here). Commands: topic 'Reusable prompts and snippets'. Placed second in Design (triage, Oct 26): ruled and needs no answer from you. Brief written Oct 26 (build advisor 2): briefs/d6-shoot-cloud.md, bin/shoot in claude-settings only; dispatched to a cloud thread. Built Oct 26: PR 592 (bin/shoot, one shared screenshot command), branch claude/project-thread-kaxi7j, head 0fad9cb. PR 592 landed on main in integration PR #595 (batch-oct26b, 12d9851b), Oct 26. Roll out to each repo and banchi's viewport stay deferred. Due after: o2's layout move; then each repo's plan goes to you (ruling Oct 26).", "order": 262, "phase": "design", "status": "active", "title": "A screenshot command in every repo", "updatedAt": "2026-10-27T01:20:00Z", "why": "scripts/shoot with the Playwright CLI and simctl, so agents can look at what they built. Fix banchi's 1280 viewport.", "ask": "# d6: one screenshot command, shared from claude-settings\n\nCloud build thread brief. Build advisor (2), Oct 26, against claude-settings main bf084df.\nBase branch: next-batch branch named by the build advisor (or main bf084df); never rebase onto main after review.\n\n## Rulings\n\n- Oct 17: build the shared script in claude-settings. Adding it to each child repo, and fixing\n  banchi's 1280x900 viewport, is Roll out (deferred). Do not touch other repos.\n- Oct 20 (o11): one script, installed like the hooks; each repo keeps only a config (URL, sizes,\n  themes, simulator). The script is the check; a browser is for exploring.\n- Oct 26: cloud sessions ship Chromium and Playwright, so the script needs no MCP (d8 folds in).\n\n## Task\n\n1. Add `shoot` to bin/, the home of the installed shared tools (verdict, ios-ship). The ruling's\n   text says scripts/shoot; claude-settings has no scripts/ folder, so bin/ is the same intent.\n   Say this deviation in the PR. Add a .cmd shim only if bin's existing tests require one.\n2. `shoot [--config F]` reads a per-repo config (default `.claude/shoot.json`): base URL, routes,\n   sizes (widths, default 1440 and 820, and 390), themes (light, dark via prefers-color-scheme),\n   optional iOS simulator UDID. It writes one PNG per route x size x theme to a printed folder\n   and prints one verdict line (N shots, M failed). A route that errors or times out is a fail.\n3. Playwright: use the pre-installed package when `require('playwright')` resolves; else exit\n   with one line naming what is missing. Never run `playwright install`.\n4. Simulator: when the config names a UDID, take `xcrun simctl io <UDID> screenshot` only if\n   the device is already booted. Never boot a simulator (repos ration them). Not booted is a\n   skipped row, not a fail.\n5. install.sh and install.ps1 copy it as they copy the other bin tools. README: one line.\n6. Record: a decision slug file for the script's contract (one per question; slug, no number).\n\n## Failure classes and proof\n\n- Test-author first, red on main: a fixture config with a local static page served on a free\n  port; assert PNG count and size, the dark theme differs from light, a 404 route is a fail, a\n  missing Playwright gives the one-line exit, and no simctl boot call appears with a stub xcrun.\n- False green: a blank page still makes a PNG. Assert a page with known content renders\n  non-blank pixels.\n- Cost: no daemon, no watcher; one browser process per run, closed at exit.\n- Program logic: a fresh Sonnet reviewer reads the diff.\n\n## Report\n\nCap 20 lines: Done, Deviations, Next. Send the green, reviewed head and branch to\n\"Advise the claude-settings build (2)\". No question for shiv: park any in the PR body.\n"}, "d7": {"note": "Done Oct 26: merged in batch PR #608 (batch-oct26f, main d741cd5) from lane PR #611 (ux: space with containers, not margins). ux/layout.md holds five rules: gap on the parent, layout primitives (stack, cluster, sidebar, grid, center), container queries for shared components, clamp() tokens, and the Swift equivalents. ux/tokens.md holds the fluid token shape and the --space-N scale. ux/checklist.md has the matching lines, and design-review points to layout.md. One Sonnet review round, clear, with three should-fix items fixed. Open notes, no answer needed: fluid tokens can fall between 4 px steps, so mailaudit keeps fixed tokens; q_max .aq-stack still uses sibling margins and moves only when a lane changes that screen. Your word, Oct 26: banchi's per-file ratchet does not spread.", "order": 201, "phase": "design", "status": "done", "title": "Space with containers, not margins", "updatedAt": "2026-10-26T14:40:00Z", "why": "gap on parents, a few layout primitives, clamp() tokens for fluid spacing, and a per-file ratchet (seen in banchi; weighed on its own case, not copied). This is the direct fix for centering and gap problems.", "ask": "# d7: space with containers, not margins\n\nCloud build thread brief. Build advisor (3), Oct 26, against claude-settings main 853b512.\nBase: main 853b512; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (3)\" republishes the roadmap page.\n\n## Task\n\nLand the spacing rules in `ux/`, the design rules every child repo's screens follow:\n1. Spacing lives on the parent: `gap` on flex and grid containers, never a margin on a child\n   to space it from its siblings.\n2. Page layout uses a few named layout primitives (stack, cluster, sidebar, grid or similar)\n   and screen breakpoints. Name them and give each one CSS example.\n3. A shared component adapts to its box with container queries, not the screen, so one\n   compon
