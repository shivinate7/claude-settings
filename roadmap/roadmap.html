ks/reply_judge.py, the one home, no new hook:\n   - Add to INSTRUCTIONS: each item under Input Needed names its reason and the check that showed the session cannot do it; flag an item that names neither.\n   - Judge every Stop whose reply carries an \"Input Needed\" label, besides the 1-in-5 sample. Detect the label in code (a string match on the label), not by the model. This changes the owner ruling of 2026-10-13 in decision reply-judge-samples-never-blocks; rewrite that entry in place with the new ruling and its cost: one extra model call per report that carries Input Needed, no new file, no new process, no timer.\n   - Still never blocks, still fails open.\n\n3. Each finding the judge passes on also writes one line to guard.log, the existing log (rule id, session, Stop number). No new file. Named reader: the advisor at each cull, who counts flags against owner-confirmed misses and false alarms, to rule whether the judge stays, widens or goes. Today it keeps no record, so its value is unmeasured.\n\nRecord: the incident above is the named incident (building-guard-needs-incident). Update lint/rule_mechanisms.json reason for output-never-hand-off-doable-step to say the judge now also checks reason and check, on every Input Needed report.\n\nProof (test-author first, red on main):\n- A reply with \"Input Needed: delete the two test App IDs on developer.apple.com\" and no reason is judged even when it is not a 1-in-5 Stop (counter test, no model needed: stub invoke_model and assert it was called).\n- A reply with no Input Needed and a non-sample Stop is not judged.\n- The prompt text carries the new clause (string check).\n- A model run on the two sample replies (no reason vs. \"needs your login: no App Store Connect key in env or keychain\") flags the first and passes the second; record the run, it is not a CI test.\n\nReport cap: 15 lines.\n", "note": "Done: PR #582 landed on main in integration PR #586 (batch-oct26, e5525a65), Oct 26. Rule output-never-hand-off-doable-step (do a step yourself before you hand it to me) is amended in place: name the reason and the check, clean up what you made, can't versus shouldn't. The reply judge (hooks/reply_judge.py) now judges every reply with an Input Needed item, besides its one-in-five sample (checked on main e5525a6), and each flag writes a line to guard.log, read at each cull. Ruling, Oct 26 (shiv, page item 7, a): keep judging every Input Needed reply; this replaces the Oct 13 one-in-five ruling for those replies. Closed by triage, Oct 26.", "order": 103.4, "phase": "cleanup", "status": "done", "title": "A step handed to you says what check showed the session can't do it", "updatedAt": "2026-10-26T16:25:00Z", "why": "Your gripe, Oct 25: the ios-adblock session asked you to delete two test App IDs on developer.apple.com when its own App Store Connect key could do it, and then said it needed your login, even though the rules say to check first."}, "c46": {"title": "Lanes start only in the tool's own worktrees, and a dropped lane keeps its branch", "phase": "cleanup", "status": "done", "order": 103.8, "why": "Parallel-work review, Oct 26 (your ask): two owner rulings on parallel lanes are recorded in claude-settings debts but never built, and neither is on the roadmap.", "note": "Both lanes merged, checked at claude-settings main e5525a6. Lane 1 (refuse a hand-made lane worktree): #588, in batch-oct26 (#586), merged Oct 26. Guard rule hand-made-worktree denies a git worktree add outside the repo's .claude/worktrees/; the pointer remedy now names EnterWorktree; decision lanes-start-in-tool-worktrees; debt agents-write-main-clone retired. Oct 19 isolation refusal: the harness, by reading only; its message was never recorded, and the refusal text asks the next session to report it. Named limits: bash -c, --git-dir, variable paths, a hand-typed review checkout is denied. Lane 2 (merge keeps a dropped lane's branch): pilot #577, merged Oct 26 (bf084dfd). Closed by triage, Oct 26.", "ask": "Lane 1 cloud brief, copied from briefs/c46-lane1-cloud.md; send to a cloud build thread.\n\n# c46 lane 1: refuse a hand-made lane worktree\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b. Lane 2 is the\npilot, PR #577; this is lane 1 only. Full step text: briefs/c46-lanes-stay-in-their-trees.md.\n\n## Incident and ruling\n\nOct 20: an orchestrator whose `isolation: 'worktree'` failed made lane trees by hand and spawned\nagents without isolation; two agents wrote into the main clone. Owner ruling, Oct 21 (debt\nagents-write-main-clone): block the workaround fully, and record which layer refused isolation.\n\n## Task\n\n1. Block: hooks/guard.py refuses the workaround, so a writing lane starts only through the tool's\n   own isolation. Find the cheapest reliable predicate (an Agent or Task call with no isolation\n   whose brief names a worktree path outside .claude/worktrees/, or `git worktree add` into a\n   scratchpad from an orchestrator). Read the act, not a guess from location (decision\n   predicate-is-the-act). Add rows to hooks/test_guard.py and mutants to hooks/mutate_guard.py.\n2. Diagnose: when isolation is refused, the guard's existing refusal line names which layer\n   refused (harness or guard) and its message.\n3. Retire the debt per its Retire line.\n\n## Failure classes\n\n- False alarm: a read-only Explore spawn with no isolation, or a brief that only mentions a\n  worktree path, must pass. A guard that cries wolf is spent.\n- Bypass: other spellings of the same act (relative paths, Windows paths, PowerShell). Only forms\n  Claude could write by mistake count (guard-guards-mistakes-only).\n- Cloud note: claude-settings hooks are not installed here, so prove it with the guard's own test\n  suite and mutation harness, not a live hook.\n\n## Roles\n\nOrchestrate: test-author, builder, fresh reviewer (it changes a guard). Base: main. PR stops at green.\n\n## Report (25 lines max)\n\nDone, Deviations, Input Needed, Next. The predicate chosen, red then green rows, mutants killed.\n\n\n---\nEarlier brief kept for reference:\n\n# Pilot: the merge tool keeps a dropped lane's branch (c46, lane 2)\n\nFor a build thread in the Claude Settings Audit project (cloud). Written by the advisor thread,\nOct 26, against claude-settings main 149f4bc5. This is the pilot for c52 (this project builds\nthe portable claude-settings backlog as PRs). Owner rulings, Oct 26: this project may push\nclaude-settings branches and open PRs; it holds the standing merge grant\n(decision standing-merge-grant); the advisor thread answers your questions.\n\n## The defect\n\nDebt merge-deletes-dropped-lane. After a batch merges, merge/merge.py (cut_lanes, line ~1023;\nlane_tips, line ~1009) deletes the remote branch of every lane merged into the batch, including\na lane the batch later reverted. Batch #564 lost five such branches on Oct 23; they were restored\nby hand. A dropped lane needs its branch to rejoin.\n\n## The work\n\n1. Test first: in merge/test_merge.py, a fixture batch with one lane merged and then reverted on\n   the batch. After the merge, that lane's branch still exists. Show it red on main.\n2. Build: cut_lanes keeps a lane whose merge into the batch was reverted on the batch. Green.\n   The four other merge-tool lane debts (ff-first-lane-not-a-tip, squash-lane-branch-kept,\n   lane-cycle-delete-order, long-lived-head-lost-in-batch) stay as they are unless the same edit\n   fixes one for free; say which.\n3. Retire the debt per its Retire line. Do not edit docs/records.md (records-index-at-merge).\n4. A fresh reviewer subagent that never saw the build reads the diff (it changes program logic).\n   Up to three rounds (roles-review-cap-three).\n5. Open the PR, ready, and watch CI (Linux, Mac, Windows) to green.\n\n## Cloud notes\n\n- claude-settings hooks are not installed here, so no guard runs. Follow the CLAUDE.md rules by\n  hand. `verdict` may be missing: run the test file directly and give the verdict only.\n- The merge is part of the pilot. Check first whether `gh` is logged in here (`gh auth status`).\n  In the advisor thread's container it is not. If `gh` works, merge with\n  `python merge/merge.py <PR>`. If it does not, do NOT merge with the GitHub button: a button\n  merge skips the records page rebuild, the record-number claim and the branch cleanup, and the\n  records page on main would go stale. Stop at a green PR and report what blocked the merge.\n\n## Report\n\nDone, Deviations, Input Needed, Next, plus the four pace numbers. Also list each claude-settings\nrule that did not fit a cloud thread, and why; each becomes a note on c52.\n\n\n---\n\nLane 1 (refuse a hand-made lane worktree) and the original two-lane brief: briefs/c46-lanes-stay-in-their-trees.md.", "updatedAt": "2026-10-26T08:10:00Z"}, "c47": {"ask": "# c47. One account file for iOS shipping, and no wrapper scripts in the app repos\n\nWritten by the advisor, Oct 26. Owner agreed Oct 26. Checked against claude-settings 149f4bc, home-app 0a3419b,\nios-adblock b3d5eb6, degen e2635ca. Two parts, in this order: part 1 in claude-settings, then\npart 2 in each app repo after part 1 merges and the Mac has reinstalled.\nPart 1 can run in a cloud build thread: its tests stub xcodebuild, and the shell-macos CI job is the\nmacOS proof. Part 2 needs the Mac: it writes ~/.config/ios-ship/account.json and runs real builds in\nhome-app, ios-adblock and degen.\n\n## Why\n\n`bin/ios-ship` (one shared tool that ships iOS apps) landed Oct 25 (decision\nios-ship-is-one-shared-tool). The build and upload logic now has one home. Two copies remain in\neach of the three app repos (home-app, ios-adblock, degen):\n\n1. The account block. `team_id`, `asc_key_id`, `asc_issuer_id`, `asc_key_path` and\n   `device_udid` are the same in all three `tools/ios-ship.json` files. A new phone or a key\n   rotation means three edits. They cannot move into claude-settings: it is public.\n2. The wrappers `tools/testflight` (home-app: `testflight.sh`) and `tools/reinstall-phone-apps`.\n   They only find the config and call ios-ship, and they have already drifted: home-app reads\n   `APPS=` and `DRY=`; ios-adblock refuses the old `PHONE_APPS_JSON` and has its own test;\n   degen passes arguments only. File names differ too.\n\nRule: one home, then variants (owner, Oct 20): a shared script lives in claude-settings; a repo\nkeeps only what differs.\n\n## Part 1, claude-settings: ios-ship reads one account file and finds the repo's config\n\n1. Account file. ios-ship reads account values from `~/.config/ios-ship/account.json` (keys as\n   today: `team_id`, `device_udid`, `asc_key_path`, `asc_key_id`, `asc_issuer_id`). Order: env,\n   then the repo config, then the account file. A repo config may still set a key, as a variant.\n   A key unset in all three refuses and names both files and the env var. The file lives only on\n   the Mac. No ID goes in this repo: fake IDs in tests only.\n2. Default config. `CONFIG` becomes optional. With none given, ios-ship uses\n   `<git toplevel of the current folder>/tools/ios-ship.json`. Outside a git repo, or with no such\n   file: exit 2 with one line. The usage line and header comment change to match.\n3. Old variable. `install` refuses when `PHONE_APPS_JSON` is set (exit 2; message names `--app`\n   and `tools/ios-ship.json`), so the ios-adblock wrapper's refusal can go.\n4. Rewrite decision ios-ship-is-one-shared-tool in place and README \"Shipping iOS apps\": where the\n   account file lives, what a repo config holds (apps, `repo_url`, overrides), how to call it\n   (`ios-ship testflight` from inside the repo).\n\nProof, test-author first, red on main, in lint/test_ios_ship.sh (the `shell-macos` job):\n- account file only: values resolve; repo config key wins over the account file; env wins over both.\n- key unset everywhere: refusal names both files.\n- no CONFIG inside a repo with tools/ios-ship.json: same calls as passing it; outside a repo: exit 2.\n- `PHONE_APPS_JSON` set on install: exit 2, xcodebuild stub never called.\n\nProgram logic: a fresh reviewer reads the diff (roles-solo-reviews-logic-diffs-only).\n\n## Part 2, each app repo (home-app, ios-adblock, degen), after part 1 is live on the Mac\n\n1. Once, on the Mac: write `~/.config/ios-ship/account.json` from the values in any one repo\n   config (they match). Do not print them.\n2. Remove the five account keys from `tools/ios-ship.json`. Keep `apps` and `repo_url`.\n3. Delete both wrappers. Point every caller at `ios-ship testflight` / `ios-ship install`:\n   degen `Makefile` target `testflight`; home-app `SPEC.md` how-to and its `make testflight`;\n   ios-adblock installer docs. ios-adblock: delete tests/test_reinstall_wrapper.sh (it tests the\n   wrapper; part 1 moves its case into ios-ship's suite).\n4. Proof: `ios-ship install --no-install` from the repo root builds each app (no phone needed),\n   and `ios-ship testflight --export-only` archives. Record both verdicts. home-app: its merge grant\n   covers this PR; the others need the owner's word to merge.\n\nNot in scope: the vendored design skills (filed under o11, one home for each shared thing).\n\nReport cap: 15 lines per part.\n", "note": "The logic has one home, bin/ios-ship (decision ios-ship-is-one-shared-tool). Your word, Oct 26: one account file, ~/.config/ios-ship/account.json, under env and repo overrides; ios-ship finds the repo's config itself; wrappers deleted. Brief: briefs/c47-ios-ship-one-account-no-wrappers.md (text in Ask). Part 1 done Oct 26: PR #587 merged (main e5525a65); ios-ship reads env, then the repo's tools/ios-ship.json, then the account file, and refuses PHONE_APPS_JSON. It does not check that a repo is private. Checked Oct 26 (coordinator): no account file exists yet. home-app (home merged in), degen and ios-adblock each carry the same account IDs inline in tools/ios-ship.json. mailaudit (public) is broken today: make phone calls ios-adblock's wrapper with PHONE_APPS_JSON, refused with exit 2; its testflight target is a third copy of the ship logic; decision native-ships-via-testflight names that wrapper; native/project.yml carries DEVELOPMENT_TEAM inline, which your plan check settles. It needs the split: IDs off-repo, app list in the repo. q_max, joyous and banchi have no ios-ship config. Part 2, each app repo: needs the Mac, a reinstall of claude-settings, and your plan check before IDs move out of the child repos. claude-settings side, no answer needed: the refusal of an old-format file names the exact migration (the c80 pattern), and compliance-check flags a missing or old-format config and leftover make phone wrappers. Consultation, Oct 27: no new iOS kit repo. Placed ahead of c54 and c48 (triage, Oct 26). Waits on: the Mac and your plan check (part 2). Asked: waiting page item 2 (yes to the one plan, https://claude.ai/artifact/S6Eou4tPnLmypAXzoUdyEA).", "order": 103.9, "phase": "cleanup", "status": "active", "title": "iOS shipping keeps one account file, and app repos keep only their app list", "updatedAt": "2026-10-28T05:10:00Z", "why": "Your question, Oct 26: why do testflight and reinstall-phone-apps sit in three repos (home-app, ios-adblock, degen) instead of claude-settings?"}, "c48": {"title": "Phone profiling waits until the phone is free", "phase": "cleanup", "status": "done", "order": 109.45, "why": "Your question, Oct 26: where should the Oct 25 lesson live (xctrace record on Shivinate XIII timed out 'waiting for device to boot' until devicectl ddiServices ran)? claude-settings, ios-ship, or the Degen repo only?", "note": "Done: part 1 (#621) landed in batch #629 (main be4b30e); part 2, the live check on the Mac, passed and the retry got past the boot wait (liaison, Oct 26). The wrong-hint finding moved to c73. Ruling, Oct 26 (shiv, page item 8, b): retry once after a wait on the known failure; no cable test. Cause, live test Oct 26 (Xcode 27.1, iOS 27.1, network transport): recording 2, 17 s after recording 1, failed 'Timed out waiting for device to boot' with the DDI mounted, while devicectl showed 'connected'; 5 min later recording 3 passed. The DDI is not the cause. Known intermittent xctrace failure since Xcode 13 (developer.apple.com/forums/thread/694698). Part 0, Oct 26 02:50 CDT (Mac, phone unlocked): the first recording failed while devicectl showed 'available (paired)'; the device state is no ready signal. Ruling, Oct 26 16:03-16:15 UTC (owner, option b on the waiting page): no state wait and no cable test; the profile job retries once after a fixed wait (60 s default, --retry-wait) on 'Waiting for device to boot'. Part 1 merged in batch #629 (main be4b30ec). Part 2, live check Oct 26 13:23-13:27 CDT (HomeApp on Shivinate XIII, from the home clone): run 1 hit the boot wait, waited 60 s, and the retry reached the phone and recorded 20 s; xctrace then hung while saving (after 'map range past end of file' on HomeApp's Metadata.appintents) and hit the 140 s step timeout (exit 124). Run 2 passed on the first try. The retry works for the boot wait. Finding: a save hang after a full recording reports 'failed twice' and the hint 'the phone may need unlocking', which is wrong there; cause (App Intents metadata or xctrace) unchecked. Brief: briefs/c48-ios-ship-profile-job.md.", "ask": "# c48. ios-ship gets a profile job that waits until the phone is free\n\nWritten by the advisor, Oct 26. Owner agreed Oct 26 (\"maybe at that time it needs more testing\").\nRewritten Oct 26 against claude-settings main 3b96ce82 (c47 part 1, the account file, has landed). Owner's\nword, Oct 26 (option b): no state wait; retry once after a fixed wait. Two parts: build (cloud), live check (Mac).\n\n## Why\n\n`xcrun xctrace record --device <UDID>` fails with \"Waiting for device to boot\" and then\n\"Timed out waiting for device to boot\" (exit 13) on a network-paired iPhone. Live test, Oct 26\n22:30-22:38 CDT (Xcode 27.1 27A9275, macOS 27.0, iOS 27.1, network transport):\n- The developer disk image (DDI) was mounted and usable the whole time. It is not the cause, so\n  `devicectl device info ddiServices` is not the fix.\n- Recording 1 passed. Recording 2, about 17 s after recording 1 ended, failed. devicectl then\n  showed the phone as `connected`, not `available (paired)`.\n- 5 min later the phone was `available (paired)` again, and recording 3 passed.\nKnown elsewhere: developer.apple.com/forums/thread/694698 (since Xcode 13);\ngithub.com/seedds/nxnative/issues/142 (iOS 27). The failure comes before the app launches, so it\nholds for every app, not one repo.\n\n## What part 0 found (Oct 26, Mac, phone unlocked)\n\nThe first recording failed \"Timed out waiting for device to boot\" (exit 13) while devicectl showed\n`available (paired)` before and after, with no recording in the 35 min before. So the device state is\nnot a ready signal, and the cause is not only \"busy after a recording\". The wait-for-available design is\nwithdrawn.\n\n## Part 1, claude-settings: `ios-ship profile`\n\n1. New job: `ios-ship profile [CONFIG] --app NAME [--template T] [--time-limit S] [--output P]\n   [--retry-wait S]`. Defaults: `Time Profiler`, 20 s, a printed path under `$TMPDIR`, retry wait\n   60 s. Bundle id and UDID come from the config and account file as for `install`. One app per run.\n2. Record by UDID, never by name: `xctrace record --template T --device <UDID> --time-limit S\n   --output P --launch -- <bundle id>`, through the existing `step` timeout. No devicectl state poll.\n3. If the output holds \"Waiting for device to boot\": print one line naming the wait, sleep the retry\n   wait, and retry once. A second failure exits with xctrace's code, the log path, and one line saying\n   the phone may need unlocking or a cable.\n4. Header comment, usage line, README \"Shipping iOS apps\" and decision ios-ship-is-one-shared-tool:\n   rewrite in place to name the third job and why it retries.\n\nProof, test-author first, red on main, in lint/test_ios_ship.sh (the `shell-macos` job), with\nstubbed `xcrun` and a stubbed sleep:\n- first xctrace passes: one call, exit 0, no sleep.\n- first prints \"Waiting for device to boot\", second passes: two calls, one sleep of the retry wait, exit 0.\n- both fail: two calls, xctrace's exit code.\n- a failure without that text: one call, no retry, xctrace's code.\n- the xctrace call carries the UDID, never a device name; `--retry-wait 5` changes the sleep.\n\nProgram logic: a fresh reviewer reads the diff (roles-solo-reviews-logic-diffs-only).\n\n## Part 2, live check (on the Mac, phone unlocked)\n\n`ios-ship profile --app <one app>` twice in a row. Record per run: passed first try, passed on retry,\nor failed twice. If both runs fail twice, report it: the retry does not help, and the owner decides\nwhether to park c48.\n\nNot in scope: a hook on `xctrace`, a CLAUDE.md line, ddiServices, a cable requirement.\n\nReport cap: 15 lines per part.\n", "updatedAt": "2026-10-26T18:35:00Z"}, "c49": {"title": "A ruling on a behaviour covers every test that expects the old one", "phase": "cleanup", "status": "done", "order": 104.2, "why": "Your gripe, Oct 26: a session asked you again whether it may change an older test that expects a behaviour you ruled out at 21:27 (a rule save clears the partly-sent mark). It said your word covered one test, and a failing test only changes on your word.", "note": "Built Oct 26 on batch-oct26: draft PR #589 (a ruling covers its stale tests), head 3d648b0, two Sonnet review rounds, all findings fixed, local lints green. CLAUDE.md: outcomes-tests-are-claims sends a stale test to the owner only when no ruling covers it; outcomes-word-covers-named-act adds that the owner's ruling covers each test and path expecting exactly what it ruled out, cited with its time. Builder and reviewer gain class (d): an owner ruling in the brief or records; a neighbouring test stays class (c). Deviation: CLAUDE.md word count 2898 to 2909, since each added clause closes a hole review found. PR #589 landed on main in integration PR #586 (batch-oct26, e5525a65), Oct 26. Closed by triage, Oct 26.", "ask": "# c49: a ruling on a behaviour covers every test that expects the old behaviour\n\nRepo: claude-settings. Mode: solo (three prose files and one record). Checked at 149f4bc.\n\n## Why\n\nOwner gripe, 2026-10-26. A session on another repo asked the owner a second time whether it may change\nan old test. The owner had already ruled the old behaviour out at 21:27 (a rule save must not clear the\npartly-sent mark). The session wrote: \"Your word covered one test. A failing test only changes on your\nword.\" A second test, and maybe three more, expected the same ruled-out behaviour.\n\nCause, two rules read together:\n- outcomes-tests-are-claims (a failing test is a claim, not law) and its 3-class sort in agents/builder.md\n  and agents/reviewer.md have no class for \"the owner already ruled this behaviour out\". The session put\n  the test in class (c), \"the rule may be stale\", which says STOP and wait for the owner's word.\n- outcomes-word-covers-named-act (my word covers the act it names, never a variant) was read as \"the word\n  named one test\", so each further test looked like a variant.\n\nThe rules are right about acts (a merge, a delete, a push). They are wrong about rulings: a ruling names a\nbehaviour, and a test that expects the old behaviour is only one route to it.\n\n## Change\n\n1. CLAUDE.md, rule outcomes-tests-are-claims: add one sentence. A test that expects a behaviour the owner\n   already ruled out is re-pointed, not asked about: cite the ruling and its time, show it red on the old\n   behaviour and green on the new.\n2. CLAUDE.md, rule outcomes-word-covers-named-act: add one sentence. A ruling on a behaviour covers every\n   test and code path that expects the old behaviour.\n3. agents/builder.md and agents/reviewer.md, the 3-class sort: add class (d), \"the owner already ruled\n   this behaviour out\". The builder reports the test change it needs (builders do not edit tests; a\n   test-author does), and cites the ruling. When one test of a ruled behaviour fails, find every test that\n   expects the same behaviour in one pass (search, then run them), and re-point them all in the same lane.\n   Report the list. The reviewer checks that each re-pointed test expects exactly the ruled-out behaviour,\n   and flags any that pins something next to it; that one goes back to class (c).\n4. Class (c) stays for a test whose behaviour has no ruling. It still goes to the owner.\n5. docs/records.md and lint/rule_mechanisms.json: keep their lines for the two rules true.\n\nKeep the CLAUDE.md word count flat or lower: rewrite in place, cut words elsewhere in the same two rules if\nneeded. Report the count before and after.\n\n## Done when\n\n- The rule audit and STE lints pass (`verdict` on the lint suite the repo's CI runs for CLAUDE.md and\n  agents/).\n- A reader can answer \"may I re-point the second test?\" from the text alone: yes, cite the 21:27 ruling.\n\nReport cap: 15 lines.\n", "updatedAt": "2026-10-26T08:10:00Z"}, "c5": {"note": "Done. #384 closed unmerged Oct 19; #455 and #456 merged Oct 20 (their content landed through #525, the map skill move); #457 closed unmerged Oct 20. Branch claude-p-fetch-key is kept, as you approved.", "order": 50, "phase": "cleanup", "status": "done", "title": "Close PRs #455 and #456, decide #384", "updatedAt": "2026-10-21T17:30:00Z", "why": "#457 replaces the two drafts. #384 has sat as a draft since Oct 13."}, "c50": {"title": "Deleting a hook script never breaks a session that is still running", "phase": "cleanup", "status": "done", "order": 103.6, "why": "Goal-3 session report, Oct 25: deleting the two STE stub scripts (#575) broke Edit and Write in the goal session itself and in every agent it started, because that session began before #566 and still called ste_gate.py on every edit. The goal had to move to a fresh session mid-batch.", "note": "Done: PR #584 (keep hook scripts that a recent settings.json called) landed on main in integration PR #595 (batch-oct26b, 12d9851b), Oct 26. Cause: the Oct 25 delete of the STE write-gate stub hit a session started before Oct 23 that still held the fail-closed Edit/Write entry; the question-reviewer delete (Oct 22, no stub) was the same break. Fix: CI check lint/check_hook_stubs.py fails when a script any main settings.json called in the last 14 days is gone; rule recorded in decision gate-hooks-fail-closed. The 14-day window is unmeasured (the incident session lived about 2.6 days); an incident reopens it (build advisor ruling, Oct 26). Open note: hook-stubs-one-path-form. Follow-up: c63 deletes the three restored stubs after Nov 6. Closed by triage, Oct 26.", "ask": "Brief, copied from briefs/c50-deleted-hook-keeps-sessions-working.md and kept in step with it. Send to a cloud build thread.\n\n# c50: deleting a hook script never breaks a session that is still running\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b.\n\n## Incident\n\nA session deleted a hook script after checking installs on both machines, but not sessions still\nrunning. A live session keeps the hook list it read at start. It kept calling the deleted script,\nand Edit and Write failed for that session and every agent it started, until it restarted.\n\n## Facts at 3f71d6b\n\n- Most settings.json hook commands already fail open on a missing script (`[ -f \"$g\" ] || exit 0`).\n- hooks/guard.py and hooks/rm_prompt_answer.py fail closed on a missing script by design: they\n  print \"claude-settings gate not runnable (script missing)\". Safety guards stay fail-closed\n  (decision on fail-closed guards; c15 note).\n- Precedent: lint/ste_gate.py and lint/md_sweep.py were kept as exit-0 stubs for old installs\n  after their hooks left settings.json (debt ste-stubs-delete).\n\n## Task\n\n1. Find the cause. Use git log on hooks/, lint/ and janitor/ to list hook scripts deleted in the\n   last 30 days, and the settings.json command form that called each at the time. Name which\n   form broke: an old entry with no missing-script check, a fail-closed entry, or something else.\n2. Fix it in one home. Pick the cheapest one that covers the cause:\n   (a) a CI check (in lint/, run by gates.yml) that fails when a script referenced by settings.json\n   at the previous release tag or at main~N is deleted with no stub left in its place; the stub\n   is an exit-0 file with its delete date, removed one release later; or\n   (b) every non-guard entry fails open, and the guard entries keep failing closed but are never\n   deleted without a stub.\n   Recommended: (a), since it follows the ste_gate precedent and keeps the guard fail-closed.\n   Record the rule in place in the decision that owns hook wiring (find it with git grep).\n\n## Failure classes\n\n- A check that passes when the script is missing but the old settings still call it. Red case\n  first: a fixture where settings at the base commit call a script the head deletes with no stub.\n- A false alarm on a script that no settings version ever called. Green control.\n- Any change that turns a fail-closed guard into fail-open. Out of scope; the reviewer checks it.\n\n## Roles\n\nOrchestrate: test-author, builder, fresh reviewer (it changes a check's verdict). Base: main.\nPR stops at green; merge waits for c53 (merge.py from the cloud) or shiv's merge.py run.\n\n## Report (25 lines max)\n\nDone, Deviations, Input Needed, Next. Name the cause found, the PR, the red then green tests.\n", "updatedAt": "2026-10-26T09:50:00Z"}, "c51": {"title": "Retire the terminal advisor; one meaning for 'the advisor'", "phase": "cleanup", "status": "done", "order": 103.5, "why": "Your worry, Oct 26: the advisor setup is delicate, and your Mac sessions seem to report an advisor review that may not exist.", "note": "Done: PR #578 (questions go to the owner) landed on main in integration PR #586 (batch-oct26, e5525a65), Oct 26: rule questions-ask-advisor-first became questions-go-to-owner, the report label 'Decided by the advisor' is gone and refused by the report gate, and the advisor- name pass is removed. 'The advisor' now means only Claude Code's built-in advisor (advisorModel) or this cloud project. start-advisor.ps1 removed (advisor repo 945b6ce); the record lives on the claude-settings roadmap branch (no deletion, no force push); old artifact pages and frozen project-file copies deleted. Left, yours, on Windows when you like (no answer needed): delete the Start Advisor shortcut and %USERPROFILE%\\.claude-advisor (text in Ask). The advisor repo stays until you say. Closed by triage, Oct 26.\nRulings:\n- Oct 26: retire the terminal advisor; the record moves to a roadmap branch of claude-settings with full history.", "ask": "No brief: built in this project (thread 'Retire the terminal advisor setup'). Local cleanup on Windows, when you like: delete the Start Advisor shortcut, C:\\advisor\\start-advisor.ps1 (gone from the repo after a pull) and the folder %USERPROFILE%\\.claude-advisor.", "updatedAt": "2026-10-26T08:10:00Z"}, "c52": {"title": "This project builds the portable claude-settings backlog as PRs", "phase": "cleanup", "status": "active", "order": 103.1, "why": "Your idea, Oct 26: the goal of the advisor setup was something that answers your questions and pushes the backlog along; this cloud project can edit code.", "note": "State, Oct 26, main 54f2dfd. Cloud threads build claude-settings; CI proves each PR on ubuntu, macos and windows; main's push run is fully green (run 40348551113). No hooks run in the cloud, so a reviewer and CI gate each logic diff. Reviewed green lanes join one integration branch with plain git; seven batches merged today (#586 to #614), each by the Mac merge hand with merge.py; lane PRs close as replaced. Placed ahead of all build steps (triage, Oct 26): the frame batches run in.\nFinding, Oct 26 (coordinator): the first Mac merge of #586 failed because a push landed on the batch branch during merge.py's CI wait. Fix in effect: each merge go says 'frozen at <sha>', and nobody pushes to that branch until the result is back.\nRulings:\n- Oct 26: this project holds the standing merge grant; merge only on green, through merge.py.\n- Oct 26: act only on claude-settings; check in before any step for another repo.\n- Oct 26: only the triage thread writes new steps, merges, order and closes (c55).\n- Oct 26: green PRs go into one integration branch now, not a pile waiting on c53.\n- Oct 26 (shiv): portability is a judgment call that is always considered: every process built here gets an explicit \"port to other repos? yes or no, and why\" call, never silence (o16). A batch never commits docs/records.md (records-page guard); the merge tool rebuilds it, and hook_catalog --check reads it as stale until then.", "ask": "Pilot brief: briefs/c46-pilot-merge-keeps-dropped-lane.md (full text on c46). Plan: https://claude.ai/artifact/U4jM83VeaTVmePCDig78fD.", "updatedAt": "2026-10-27T06:05:00Z"}, "c53": {"title": "The merge tool works from a cloud session (REST calls, no GraphQL)", "phase": "cleanup", "status": "done", "order": 103.3, "why": "Cloud build threads hold your standing merge grant, which says merge only through merge/merge.py. merge.py cannot run in a cloud session today.", "note": "Done Oct 27: batch #649 merged from the cloud with merge/merge.py at 00:18 UTC (main 2ad85de6), the first live cloud merge. The lock was taken and released, the checks read, the PUT merge ran, and the after-merge install ran (build advisor). Gap: the cloud cannot delete lane branches (\"no head on origin sits at this tip\" for all seven lanes); that cleanup rides on c44. How it works: PR #631 (main 54be9f1): the lock ref is refs/heads/merge-lock/<base> for Mac and cloud; the whole cloud flow runs in one merge.py call. The cloud proxy refuses REST writes under git/, pushes outside refs/heads and ref deletes; it allows leased pushes to refs/heads/*, reads, and PUT pulls/N/merge (measured Oct 26 on PRs #624, #626). Ruling, Oct 26 (shiv, page item 5, a): batches merge from the cloud; the Mac merge hand stays as fallback.", "ask": "# c53 part 2: a merge path the cloud proxy allows\n\nCloud build thread brief. Build advisor (4), Oct 26, against claude-settings main 3b96ce8 (or the\nnewest main). Never rebase onto main after review. claude-settings only. Push roadmap edits to\nthe branch only; only Triage the roadmap (3) republishes.\n\n## Finding\n\nOct 26, #617: from a full clone, `python3 merge/merge.py 617` previewed clean; `--confirm` stopped\nat \"cannot make the lock commit\": gh got HTTP 403 \"Write access to this GitHub API path is not\npermitted through this proxy\". Nothing was written. The Mac merge hand merges every batch until\nthis lands. shiv's ruling (c53, a): the next batch merges from the cloud, the Mac as fallback.\n\n## Task\n\n1. Measure first, on throwaway branches only (never main, never a real batch): which merge.py\n   writes the cloud proxy allows. Try each write merge.py makes (lock commit, records commit push,\n   PUT pulls/N/merge, branch deletes) against a throwaway base branch and a throwaway PR into it.\n   Also try `git push` of a lock ref and the GitHub MCP merge tool (mcp__github__merge_pull_request)\n   with the head sha guard. Record each as allowed or refused, with the exact error.\n2. If a full path exists: give merge.py a cloud mode that uses only allowed writes (for example a\n   lock ref by git push with lease; the merge by the MCP tool, which a Python script cannot call, so\n   the script stops at \"ready to merge <sha>\" and the session calls the tool, then reruns merge.py\n   to finish the after-merge steps). Keep one tool: extend merge.py, never a second script. The Mac\n   path stays as it is.\n3. If no full path exists: say so with the table; c53 stays Mac-only. Build nothing.\n4. Delete every throwaway branch and close every throwaway PR you made.\n\n## Failure classes and proof\n\n- Test-author first, red on main: cloud mode never calls a refused API path (a mock refuses it);\n  the lock is held while a second run waits; a moved head stops the merge; the after-merge rerun\n  is a no-op when main already has the merge.\n- merge/test_merge.py and every gates.yml step locally before sending.\n- A fresh Sonnet reviewer reads the diff (it changes the merge gate).\n\n## Report\n\nCap 20 lines: the allowed/refused table, Done, Deviations, Next, and \"Port to other repos: yes or\nno, and why\". Send the green, reviewed head and branch to \"Advise the claude-settings build (4)\"\n(cmsg_01DoF7thf3iq2Srr1UsfXgh2EyHwiKacoTT56k4JHuc2RT). Keep the PR a draft.\n", "updatedAt": "2026-10-27T00:32:00Z"}, "c54": {"title": "Cloud threads follow the same model rules as local sessions", "phase": "cleanup", "status": "active", "order": 104.0, "why": "Your question, Oct 26: cloud threads run Opus, but you can't see or limit which models their subagents get, unlike the lockdown claude-settings gives your local sessions.", "note": "Local sessions cap subagents at Sonnet through settings.json env (CLAUDE_CODE_SUBAGENT_MODEL and CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL), the guard's subagent-model-cap ask, and agents/ model pins; cloud threads had none. Done: part 1, Oct 26 (you), a cloud environment sets both env vars to sonnet; part 2, PR #600 (Done items name subagent models); pin order (#714, in #723), on main, checked e0f9e2d Oct 28: an agents/*.md pin beats the env var both ways. Measured order in a cloud thread: a spawn's model field, then a definition's pin, then the env var; built-in Explore and Plan inherit the parent's model. A running cloud thread does not load ~/.claude/agents files written mid-session. Reviewer-model gap: c142. Remains: part 3, install claude-settings into cloud containers (setup script or a repo SessionStart hook), which also closes 'hooks are not installed in cloud sessions' (c52) and UTC times in cloud threads. Deferred (shiv, Oct 26): part 3 is held by your ruling. c154 landed Oct 28. Asked: waiting page item 31. Port: no. Placed after c47 (triage, Oct 26).", "ask": "# c54 next part: does an agents/*.md model pin beat the env var in a cloud thread?\n\nCloud build thread brief. Build advisor (10), Oct 27, against claude-settings main 6a3e842.\nMeasurement lane. It lands a decision record by PR; send the head to the build advisor.\n\n## Why\nKnown (measured Oct 26, cloud): a spawn's own `model` field wins, then a built-in definition's\nmodel, then CLAUDE_CODE_SUBAGENT_MODEL. Unknown: where a pin in claude-settings'\n`agents/*.md` frontmatter sits in that order. Local sessions rely on those pins for the\nmodel-per-role table.\n\n## Task\n1. Copy claude-settings `agents/*.md` into `~/.claude/agents/` in this container.\n2. Set CLAUDE_CODE_SUBAGENT_MODEL to a model different from one pin (for example a pin of\n   opus, env sonnet), and the reverse. Spawn each agent type with no `model` field and record\n   the model it ran (from the agent's own report of its model id or the session API).\n3. Also record whether a cloud thread loads `~/.claude/agents` written mid-session, or only at start.\n4. Write the order into the decision record that holds the model-per-role table\n   (find it with `grep -rl agent-model-cap docs/decisions`), rewritten in place.\n\n## Done when\nThe record states the full order with \"measured Oct 27, cloud\" and each case's observed model.\nAny case you cannot measure is written as unknown. Review: one fresh Sonnet reviewer.\nReport cap 15 lines. Port: no; the order is a Claude Code fact, recorded once here.\n\n\n(Part 2 brief, done: briefs/c54-part2-done-names-models.md.)", "updatedAt": "2026-10-28T06:45:00Z"}, "c55": {"title": "The roadmap gets re-weighed as a whole, and notes stay short", "phase": "cleanup", "status": "active", "order": 103.2, "why": "Your question, Oct 26: are we rewriting notes instead of appending, and re-weighing the order instead of putting each new item at the front? Audit, Oct 26 at roadmap 9517045: mostly not.", "note": "Audit, Oct 26 (roadmap 9517045, reports/roadmap-upkeep-audit.md): most note edits were appends, no step was ever re-ordered, and the whole review never ran. Ruling, Oct 26 (shiv, 'agreed, let's implement this'): the triage thread is the gatekeeper. Only it creates, merges, orders and closes steps; other threads send it each item with your message attached and still rewrite notes on their own steps. The rule is in the project instructions. Built: build.py prints an upkeep list on each build; a growing list is a slip. Triage re-reads the branch before each placement and hands off at 40 messages, 25 placements, a phase change or a slip (handoffs/triage-<date>.md). The backlog cleanup ran in its own thread; triage re-weighs the order when such work reports done. Placed ahead of c53 (triage, Oct 26): it governs how every later step is filed.\n- Ruling, Oct 26 (shiv): any step that needs your answer is deferred; work that needs none runs first, and the build advisor dispatches no deferred step.\n- Ruling, Oct 26 (shiv): the local liaison is exempt from the 40-message and 8-brief limits while it holds a Remote Control session on the Mac; the slip trigger still applies.\n- Oct 26: threads share a cap of 60 sends an hour (topic t16, how to use this project); standing threads batch routine notes and retry a refused send. Page moved Oct 28 (triage 9): the old page sat in shiv's other account; the roadmap page is now https://claude.ai/artifact/JGqfvgXBuLqWUm1CX6Bv5h.", "updatedAt": "2026-10-28T05:40:00Z"}, "c56": {"title": "One thread publishes the roadmap page", "phase": "cleanup", "status": "done", "order": 103.25, "why": "Build advisor, Oct 26: every thread republishes the roadmap page, so publishes collide and each takes about three tries.", "note": "Measured by triage, Oct 26 (this thread's own publishes): of 5 publishes, 3 were refused before going through. Two causes. (1) A real race: another thread published a newer build in between (seen twice). (2) A handshake cost, not a race: the first publish to a page this session has not viewed is refused, and the same content sent again is refused until the saved copy is read; so even a clean publish takes up to three calls. Options: (a) one publisher, the triage thread: other threads push to the branch and do not publish; triage publishes at the branch head on each wake. Gain: no races. Loss: a note-only push by another thread shows on the page only at triage's next wake. (b) Every thread publishes, but only after pulling, building at the head, and checking that the live page equals an earlier commit's build. Gain: the page stays fresh. Loss: races stay and need retries. Ruled Oct 26 (coordinator, in the project instructions): (a). The triage thread is the only publisher, from the branch head; other threads push only. Handshake noted in roadmap/README.md. Placed after c55 (triage, Oct 26): same upkeep family, and it costs every thread calls today.", "updatedAt": "2026-10-26T05:15:00Z"}, "c57": {"title": "Mods run their tests on all three systems in CI", "phase": "cleanup", "status": "done", "order": 103.95, "why": "Finding from the thread fixing the decision watch on the Mac, Oct 26: CI runs mod tests on Linux only, so a Mac-only bug in decision-watch went uncaught, and the watch has never judged a Mac turn (c29).", "note": "Done: PR #585 (run the mod and map-skill tests on Linux, Windows and macOS) landed on main in integration PR #586 (e5525a65), Oct 26. One script, .github/scripts/mod-tests.sh, ends the gates, gates-windows and gates-macos jobs on the `mods` flag; harness-scope.sh starts the Windows and macOS jobs on a mod-only PR. Each system ran 6 mod test files and 41 map-skill tests. Red proof: a throwaway mod test went red in gates-macos only (/var is a symlink there). Job times before and after: Linux 25.5 then 21.3 min, Windows 0.5 then 1.2 min, macOS 21.5 then 20.4 min. Left as notes in debts/notes.md: skill-fallback-unpinned, inline-copy-names-skill-path. Closed by triage, Oct 26.", "updatedAt": "2026-10-26T08:00:00Z", "ask": "Brief, copied from briefs/c57-mod-tests-on-three-systems.md and kept in step with it. Send to a cloud build thread.\n\n# c57: mods run their tests on all three systems in CI\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b.\n\n## Why\n\nIn .github/workflows/gates.yml the \"Mod tests\" step and the plain-english-map skill tests run only\nin the ubuntu-latest job. The windows-latest and shell-macos jobs skip them. Incident: decision-watch\ncalled `which -a python3 python`, which exits non-zero on a Mac with no `python`; Linux CI was\ngreen. Fix PR #580 (decision-watch finds python one name at a time).\n\n## Task\n\nRun the same mod-test step (and the skill tests beside it) in the Windows and macOS jobs, under the\nsame `mods` scope flag the ubuntu job uses. One step definition, no copied block: use a composite\naction, a shared script, or a matrix, whichever fits gates.yml's current shape. Keep the jobs'\ncaps; if a job's cap is too short, raise that cap and say by how much.\n\n## Failure classes\n\n- The step runs but finds no tests on one OS (path or glob differs). Proof: the job log on each OS\n  names the same test count.\n- The scope flag skips the step on Windows or macOS when a mod changes. Proof: a PR touching a mod\n  file runs the step on all three.\n- Red proof: show one mod test that fails only on macOS (for example, revert #580's fix on a\n  scratch branch, or a fixture that needs `python` on PATH), red in the macOS job, then green.\n\n## Roles\n\nOrchestrate: builder and fresh reviewer (it changes what a gate checks). Base: main. Note #580 is\nopen; if your red proof uses its fix, rebase on main after #580 merges. PR stops at green.\n\n## Report (25 lines max)\n\nDone, Deviations, Input Needed, Next. Per OS: the test count and the job's wall time before and after.\n"}, "c58": {"title": "claude-settings mods update themselves after the first install", "phase": "cleanup", "status": "active", "order": 109.16, "why": "Your question, Oct 26: why did your claude-settings install never pick up the token-weather 500k fix? Mods were fetched once, on Oct 13, and never refreshed.", "note": "Mac live check passed Oct 27 11:35 CDT (local liaison). Ruling, Oct 26 (shiv, \"agreeed\"): mods stay current by marketplace auto-update alone, with no installer step. Cause, checked at main 3f71d6b: the claude-settings marketplace entry in settings.json had no \"autoUpdate\": true, and Claude Code leaves third-party marketplaces un-refreshed by default; install.sh and install.ps1 never touch plugins, by design (decision mods-install-via-marketplace). So each mod stayed at its first-install version (desktop-statusline 0.1.3 on the Mac against main's 0.1.5). Fix: PR #581 (mods auto-update from the claude-settings marketplace) merged Oct 26 in #586 (main e5525a6). Left: the Mac check below. One-off catch-up given to shiv: `claude plugin marketplace update claude-settings`, then `claude plugin update <mod>@claude-settings` per mod. Proof after merge, on the Mac: after the first session, `claude plugin list` shows each claude-settings mod at main's version. Placed beside c29 (triage, Oct 26): only the Mac check is left, and it carries c29's fix to the Mac. Oct 26 (page item 20): the Mac was already current; Windows is updating. Mac check passed Oct 27 11:35 CDT (local liaison, main 2ca89254): `claude plugin list` shows all five mods at main's versions (decision-watch 0.0.11, desktop-statusline 0.1.5, plain-diff 0.1.7, session-board 0.1.7, token-weather 0.1.2); the claude-settings marketplace has autoUpdate true, refreshed 09:43 CDT today. Done on the Mac. Closes once Windows is confirmed to update too (its note says it was updating Oct 26). Waits on: a Windows check (waiting page item 10).", "updatedAt": "2026-10-28T05:10:00Z"}, "c59": {"title": "No session sits idle while ready work waits", "phase": "cleanup", "status": "done", "order": 109.3, "why": "Your gripe, Oct 26: the project went idle with plenty of ready work; you expected many lanes in parallel, and asked whether a standing thread must keep coal going into the engine.", "note": "Done: parts 1 and 2 (#622) landed in batch PR #629 (main be4b30e), Oct 26. Ruling, Oct 26 (shiv, page item 13, a): parts 1 and 2 now, part 3 only after a repeat. Parts 1 and 2 merged Oct 26 (PR 622, keep-going rule and Unstarted report line; reviewed clear in 2 Sonnet rounds). Rule parallelism-keep-going (start each queued item with every question answered when a lane ends; stop only where a rule waits for shiv's word, an owner-only test, or the load brake) is unmechanized. Rule reports-name-unstarted-items (orchestrator's report holds an 'Unstarted:' line under Next) is held by the report gate on turns that spawned a builder; it checks the line exists, not that it is true. Part 3, a Stop check that refuses an idle turn end, is filed as a new step only after a repeat. home-app's keep-going line can later point at the global rule (other-repo change, needs shiv's word).", "updatedAt": "2026-10-26T18:25:00Z", "ask": "# c59: no session sits idle while ready work waits (parts 1 and 2)\n\nCloud build thread brief. Build advisor (3), Oct 26, against claude-settings main 3b96ce8.\nBase: main 3b96ce8; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (3)\" republishes the roadmap page.\n\n## Ruling\n\nshiv, Oct 26 (waiting page item 13, option a): parts 1 and 2 now. Part 3, a Stop check that\nrefuses a turn end, is built only after a repeat: do not build it.\n\n## Task\n\n1. Part 1, a global rule in CLAUDE.md (one anchored sentence or two, beside the roles or\n   parallelism rules): when a lane ends and a queued item has every question answered, start it\n   in the same turn. Stop only for an owner decision, a test only the owner can run, or the load\n   brake. home-app's \"Keep going\" rule is the source (read /home/user/home-app/CLAUDE.md, never\n   push there); say in the PR whether home-app's line can later point at the global rule.\n2. Part 2, a report rule: an orchestrator's final report names the queue's ready items it left\n   unstarted, with a reason per item, or \"none\". Put it with the reports rules\n   (reports-order-of-labels family) and the shiv-stylisms output style only if that is the home\n   for report shape; one home, never two.\n3. Mechanize what can be checked cheaply (rule outcomes-mechanize-rules): if a lint already reads\n   report shape, extend it to require the \"unstarted ready items\" line; if none exists, mark the\n   rule NOT MECHANIZED with what a machine would need to see. Do not build a new hook.\n4. Update GLOSSARY.md only if you add a term.\n\n## Fences\n\n- No Stop check, watcher or timer.\n- Rule text in fewest words; no paragraph (rule speak-never-explain-in-paragraph).\n\n## Failure classes and proof\n\n- lint/rule_audit.py and the anchor checks must pass with the new anchors.\n- Changes rules every session follows: a fresh Sonnet reviewer reads the diff (hunt for a\n  wording that makes a session start work the owner did not approve, or that conflicts with\n  questions-go-to-owner).\n- ste-changed through `verdict`.\n\n## Report\n\nAdd one line, \"Port to other repos: yes or no, and why\" (shiv's ruling on c52, Oct 26). Cap 15\nlines: Done, Deviations, Next. Send the green, reviewed head and branch to \"Advise the\nclaude-settings build (3)\". Do not merge, and do not rebase onto main. No question for shiv:\npark any in the PR body.\n"}, "c6": {"note": "Done by the cull, measured Oct 19 at #513: lint/rule_mechanisms.json (99 rows) names a test for all six rules the cull ruling listed (the five above plus git-cite-by-id), each in hooks/test_guard.py. Their CLAUDE.md prose is cut to a short reminder plus a one-line reason (10-23 words each; roles-third-try-steps-up still 32). Not checked: whether a mutant targets each named case.", "order": 60, "phase": "cleanup", "status": "done", "title": "Write proving tests for five guard rules", "updatedAt": "2026-10-19T15:25:00Z", "why": "Their rows name no test, so their prose can't be deleted safely yet. Start with shared-trees-no-destructive-git."}, "c60": {"title": "The stall watch does not cry wolf on a command that writes to its own log", "phase": "cleanup", "status": "done", "order": 109.32, "why": "A guard that goes red when nothing is wrong is spent, because the reader learns to scroll past it (rule verification-cry-wolf-guard-is-spent).", "note": "Finding, Oct 26 (build advisor, merging #586 on the Mac): the stall watch (hooks/stall_watch.py) flagged merge.py as stalled; its output went to a log file, so stdout stayed quiet while it worked. Ruling Oct 26 (shiv, option a): the watcher also reads a log the command names; decisions/stall-watch.md rewritten to match. Merged Oct 26 in batch #637 (main 54be9f1); lane PR #598 (stall watch reads the logs a command names), head 86a0214, closed as replaced. Red-first, review round 1 CLEAR, every stall-watch suite green on Linux, Mac and Windows. Port to other repos: no (global hook). Remaining false alarms, noted in the PR: a relative log after a cd, --log-file, -o, sudo tee, PowerShell Tee-Object.", "ask": "# c60: the stall watch does not cry wolf on a command that writes to its own log\n\nCloud build thread brief. Build advisor (2), Oct 26, against claude-settings main e5525a6.\nBase: main e5525a6; never rebase onto main after review.\n\n## Incident\n\nOct 26, merging #586 on the Mac: hooks/stall_watch.py (its --hook wrapper and --watch-pid watcher)\nreported merge.py as stalled. merge.py sent its output to a log file, so the watched stdout stayed\nquiet past 300 s while the job worked. A guard that cries wolf is spent\n(verification-cry-wolf-guard-is-spent).\n\n## Task\n\n1. Before the watcher reports a stall, it also checks whether the job is still writing elsewhere.\n   Pick the cheapest reliable signal and say why in the PR: growth of a log file the command\n   names by redirection (`> F`, `>> F`, `2>&1 | tee F`, `--log F`), or a declared log\n   (an env or description note). Read the act, not a guess (decision predicate-is-the-act).\n2. A real stall (no byte on stdout and no growth of any named log for the quiet time) still\n   reports exactly as today. Same for the --stop mode: an open job whose named log still grows\n   is not listed.\n3. Cost: no new process, timer or file; the watcher already polls. State the cost in the\n   record (outcomes-mechanize-rules).\n\n## Failure classes and proof\n\n- Test-author first, red on main, in hooks/test_stall_watch.py (and _stop.py if --stop changes):\n  a merge.py-like job (quiet stdout, a named log that grows) is not a stall; the same job whose\n  log stops growing is a stall; a quiet job with no named log is a stall (bypass check).\n- False alarm and bypass both count: a log path in a quoted string or comment is not a\n  redirection (building-scanner-respects-strings; use shlex or the guard's own tokenizer).\n- It changes a check: a fresh Sonnet reviewer reads the diff; net-value test only after round 3.\n\n## Report\n\nCap 20 lines: Done, Deviations, Next. Send the green, reviewed head and branch to\n\"Advise the claude-settings build (2)\". No question for shiv: park any in the PR body.\n", "updatedAt": "2026-10-26T19:58:00Z"}, "c61": {"title": "Main's push run goes fully green: the Windows guard and merge jobs fit their caps", "phase": "cleanup", "status": "done", "order": 103.35, "why": "A main that is never fully green hides the day it really breaks.", "note": "Done: main's push run 40348551113 on 54f2dfd (Oct 26) is fully green, no job failed or cancelled. Merged to main b1e5a6d in batch PR #605, Oct 26 (lane PR #599). Fix: shard the Windows guard (2) and merge (5) jobs off pull_request; PR runs and required checks unchanged; 20 min per shard (the cap conflict with c62 settled at the join). Proof: dispatch run 40300467544 green, guard shards 680/694 s, merge shards 337-516 s. Cause: full Windows guard 1212-1296 s and merge git-half 2485 s in one job, so every full run (push, schedule, dispatch) was cancelled at the caps, e.g. push runs 40273599923, 40288721519, 40301449260; a raised cap alone would hide suite growth (debt gates-job-near-timeout). Now: main's push run 40325058256 on b1e5a6d is red but nothing was cancelled, so the split works; all 5 merge shards failed on a path-format defect those tests never reached before, which is c66. Main's push run 40341240918 on d741cd5 (after c66): every Windows job passed; only gates-mutate-guard was cancelled at its cap (10 min) in the guard mutation harness, the same cap pattern on a Linux job. One incident, a note not a debt: if mutate-guard is cancelled at its cap again, file a step. Placed ahead of c66 and c44 (triage, Oct 26): it makes main's push run green.", "ask": "# c61: main's push run goes fully green; the Windows guard and merge jobs fit their caps\n\nCloud build thread brief. Build advisor (2), Oct 26, against claude-settings main e5525a6.\nBase: main e5525a6; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (2)\" republishes the roadmap page.\n\n## Finding\n\nOn push, schedule and dispatch runs, harness-scope.sh turns every suite on. There\ngates-windows-guard (timeout-minutes 15) and gates-windows-merge (20) end \"cancelled\" at their\ncaps: main e5525a6's push run, and dispatch runs on the d6 and c47 lanes. On PR runs, scoped to\nthe diff, both pass. So main is never fully green, and a red job at its cap reads as noise.\nBatch rule: a job that ends at its cap is re-capped or split, never a reason to drop a lane.\n\n## Task\n\n1. Measure first, no code change: from the GitHub Actions API, read each step's duration for both\n   jobs on the last 5 push or dispatch runs that ran the full suite, and on 5 green PR runs.\n   Name the step that eats the time. Report the numbers in the PR body.\n2. Then pick the cheaper fix and say why: raise the cap to about 1.5x the measured full-suite\n   time, or split the long suite into a second job (matrix or shard) so each fits. A split keeps\n   every case running; never drop, skip or narrow a case to fit.\n3. If a suite is slow from a defect (a sleep, a retry loop, a hung child), fix that cause instead\n   and name it.\n\n## Failure classes and proof\n\n- Proof: a dispatch run of gates.yml on the branch where both jobs end green with full scope.\n- False green: the job must still run the same case count as before; print and compare it.\n- A gate's verdict may change: a fresh Sonnet reviewer reads the diff.\n\n## Report\n\nCap 15 lines: Done, Deviations, Next. Send the green, reviewed head and branch to\n\"Advise the claude-settings build (2)\". No question for shiv: park any in the PR body.\n", "updatedAt": "2026-10-26T15:55:00Z"}, "c62": {"title": "A one-act override pass lifts exactly one act on Windows too", "phase": "cleanup", "status": "done", "order": 103.34, "why": "Your typed pass for one act must never lift a second act.", "note": "Done: Merged to main in batch PR #605 (batch-oct26d, main b1e5a6d) with c61, Oct 26; the gates-windows-guard cap conflict kept c61's 20 min per shard. Cause, measured (Oct 26): a Windows rename acts on an open handle, so two racers that both opened the pass both renamed it and both won (probe run 40296652083: 2 of 40 rounds; Linux 0 of 40). Not a fail-open crash. Fix: the claim is an O_EXCL marker named by the pass's bytes; each grant writes an id; the spent file stays until a grant replaces it. Green on Windows 0 of 40 and 0 of 200. Built: PR #601 (draft), head 3048b56, reviewed clear in two Sonnet rounds, full CI green but gates-windows-merge, which hits its 20 min cap as on main. The lane also re-caps gates-windows-guard to 30 min (the full suite ran 20.5 min). Sent to the build advisor for the batch (Oct 26). Placed ahead of c61 (triage, Oct 26): it may be a real guard hole, and it keeps main's push run red even after c61 lands; needs no answer from you.", "ask": "# c62: a one-act override pass lifts exactly one act on Windows too\n\nCloud build thread brief. Build advisor (2), Oct 26, against claude-settings main e5525a6.\nBase: main e5525a6; never rebase onto main after review. Push roadmap edits to the branch only;\nonly the triage thread republishes the roadmap page.\n\n## Incident\n\nMain's push run 40273599923 (bf084df), gates-windows-guard: the case \"override: two calls racing\nfor one one-act pass, exactly one gets it\" went red. Six calls raced and two got allow. So a typed\none-act pass can lift a second act on Windows when tool calls run in parallel. A likely risk in\nnormal work (parallel calls in one turn). hooks/override_pass.py `take` spends a one-act pass by\n`os.rename` to a unique name; on Windows a rename can succeed for two racers, or the read happens\nbefore the claim. Unchecked: the exact cause. Find it, do not guess it.\n\n## Task\n\n1. Red first: repeat that case (and a six-racer variant) many times on windows-latest by a\n   dispatch run of the branch, until it shows the double allow. Record the run id and the count.\n   If it never goes red in a bounded number of tries, say so and still fix the read-then-claim\n   order you can prove from the code.\n2. Fix: make the claim atomic on every OS, with one primitive in override_pass.py: claim first,\n   then read the claimed copy (for example `os.open(..., O_CREAT|O_EXCL)` on a claim marker, or\n   rename into a per-racer name followed by a check that the source is gone). The loser denies.\n   Keep the guard's fail-closed behaviour when the pass file cannot be read.\n3. The same fix holds on Linux and macOS; their suites must stay green.\n\n## Failure classes and proof\n\n- Red then green on windows-latest, same repeat count, with the run ids in the PR body.\n- Bypass: a pass must never lift two acts; a false alarm: a single caller must still get allow.\n- It changes a guard: hooks/mutate_guard.py gets a mutant that drops the claim, and it must die.\n- A fresh Sonnet reviewer reads the diff; net-value test only after round 3.\n\n## Report\n\nCap 20 lines: Done, Deviations, Next. Send the green, reviewed head and branch to\n\"Advise the claude-settings build (2)\". No question for shiv: park any in the PR body.\n", "updatedAt": "2026-10-26T12:50:00Z"}, "c63": {"title": "Delete the three restored hook stubs after Nov 6", "phase": "cleanup", "status": "todo", "order": 109.2, "why": "A stub is kept only as long as a running session might still call it.", "note": "From c50, Oct 26: lint/ste_gate.py, lint/md_sweep.py and hooks/question_outcome.py came back as exit-0 stubs so that old sessions do not break. lint/check_hook_stubs.py names Nov 6 and goes green for their removal once that date passes. One small cloud lane on or after Nov 6; needs no answer from you. Placed after the Mac checks c29 and c58 (triage, Oct 26): it waits for its date. Due after: Nov 6.", "ask": "", "updatedAt": "2026-10-27T16:45:00Z"}, "c64": {"title": "A slow browser install never cancels the gates job", "phase": "cleanup", "status": "done", "order": 103.36, "why": "A slow download mirror must not turn a good batch red.", "note": "Done: lane PR #604 landed on main 0b39053 by batch PR #603, Oct 26. gates-shoot is now its own required job (cap 10 min), with no --with-deps: install 8 s vs 20-31 s with apt (dispatch run 40310568830); suite 9/9. It is in stamp.json requiredChecks, so merge.py requires it. Cause: the shoot suite's playwright install --with-deps took over 11 min on slow apt mirrors inside the gates job's 36-minute cap, and cancelled batch #603's run twice (700 s, 750 s). The branch-protection part moved to c65. Brief: briefs/c64-shoot-install-own-cap.md.", "ask": "# c64: a slow browser install never cancels the gates job\n\nCloud build thread brief. Build advisor (2), Oct 26, against claude-settings main 12d9851.\nBase: main 12d9851; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (3)\" (cmsg_01DoF7thf3iq2Srr1UsfXgh254YqfUUZHeznzPGp4b6a8B) republishes the\nroadmap page and takes new steps. Send heads to \"Advise the claude-settings build (2)\".\n\n## Incident\n\nBatch PR #603, run 40302813024: the `gates` job (timeout-minutes 36) was cancelled inside the\n\"shoot fixture suite\" step. `playwright install --with-deps chromium` spent over 11 min on slow\nazure apt mirrors (single packages 1 to 5 min); on #595's run the step took 27 s. No test failed.\nThe lint job, which always runs, lost its whole verdict to one install.\n\n## Task\n\n1. Move the shoot suite out of the `gates` job into its own job, gated by the same `shoot` scope\n   flag, with its own timeout-minutes sized from measured runs. Add it to whatever aggregates the\n   required checks, if anything does, so a red shoot suite still blocks.\n2. Cut the install time where cheap: install only the browser (no `--with-deps`) if the runner\n   image already has the libraries, or cache the Playwright browser by its lockfile hash. Measure\n   both on a dispatch run and pick by the numbers; say which in the PR.\n3. The `gates` job's cap stays as it is; it should no longer hold the browser install.\n\n## Failure classes and proof\n\n- Proof: a dispatch run where the shoot job runs its full suite green and the gates job no longer\n  contains the step. The test count of lint/test_shoot.mjs is the same as before.\n- False green: a skipped shoot job must not read as passing when the scope flag is on.\n- lint/test_harness_scope.py and lint/test_gates.py stay green; extend them if they pin job names.\n- A fresh Sonnet reviewer reads the diff.\n\n## Report\n\nCap 15 lines: Done, Deviations, Next. No question for shiv: park any in the PR body.\n", "updatedAt": "2026-10-26T12:20:00Z"}, "c65": {"title": "Main's branch protection requires gates-shoot", "phase": "cleanup", "status": "done", "order": 109.33, "why": "A check that only the merge tool requires can be skipped by any other merge path.", "note": "Done Oct 26 (shiv): gates-shoot added to main's branch protection; checked by API Oct 27, it is in the required checks. From c64 (#604): gates-shoot is also in stamp.json requiredChecks, so merge.py blocks on it.", "ask": "", "updatedAt": "2026-10-27T01:08:00Z"}, "c66": {"title": "Windows merge tests read git's forward-slash paths", "phase": "cleanup", "status": "done", "order": 103.37, "why": "Main's push run stays red until the Windows merge tests compare paths the way git prints them.", "note": "Done: lane PR #609 landed on main d741cd5 in batch PR #608, Oct 26. Result: test-only fix. A tree_listed helper in merge/test_merge.py compares realpath plus normcase on both sides; merge.py's remove_held_tree already compared realpath on both sides, so no product defect. Proof: red on main run 40325058256 (5 Windows merge shards), green on gates dispatch 40332792660 (all jobs). Placed ahead of c44 (triage, Oct 26): last thing between main and a green push run, c61's goal.", "ask": "", "updatedAt": "2026-10-26T14:40:00Z"}, "c67": {"title": "The roadmap-refresh routine updates the phase numbers it reads", "phase": "cleanup", "status": "done", "order": 109.34, "why": "A routine that stops the same way every run does no work and hides that it is broken.", "note": "Done: the routine pushed a71514c (Oct 27 09:07 CDT), half an hour after its 08:36 slot; triage's 08:58 check came before it. It flagged three out-of-date tile rules; triage fixed them in phases.json. Ruling, Oct 26 (shiv, page item 12, a): the routine edits roadmap/data/meta/phases.json, runs build.py and pushes, with a push grant on the roadmap branch for that; triage still republishes the page. Done Oct 26 17:12 UTC (triage): the old scheduled task could not be edited in place, so it was recreated with the new prompt and the same schedule (daily 08:36 Central), and the old one deleted. Closes when its first run (Oct 27) pushes to the roadmap branch. Finding, Oct 26 (coordinator): the scheduled roadmap-refresh routine (thread \"roadmap refresh\", cmsg_01DoF7thf3iq2Srr1UsfXgh2B4z7bjZH8zcikw5sHVdSp6) stopped with no change: it still reads and writes phase numbers in the page's built-in database, which is off now. Until the rewrite, every run stops the same way. Port: no, the roadmap branch is claude-settings' own (o16 carries the pattern).", "ask": "", "updatedAt": "2026-10-27T14:30:00Z"}, "c68": {"title": "The blind design reviewer stays blind to the repo's design spec", "phase": "cleanup", "status": "done", "order": 104.5, "why": "A second reviewer that has read the spec only repeats the first; its value is fresh eyes.", "note": "Status, Oct 26: PR #612 merged to main (Reviewer B brief skips impeccable Setup and fallback; red 4/4 refusals and 2/4 spec reads, green 0/4 and 0/4). Open note: a \"Design Context\" section in a repo CLAUDE.md still auto-loads into Reviewer B. Finding, Oct 26 (o12 lane, PR #610 body, \"Parked for the owner\"): impeccable's SKILL.md Setup step 1 runs `impeccable context`; guard rule impeccable-review-only refuses it; impeccable's fallback then reads the repo's PRODUCT.md and DESIGN.md directly. design-review step 2 says Reviewer B never sees the design spec, so in any repo with a DESIGN.md Reviewer B likely reads it, and every run hits one guard refusal. Unmeasured: no review was watched. Fix, one cloud lane: first run one design review in a fixture repo with a DESIGN.md and record what Reviewer B reads (red); then (a) Reviewer B's brief skips impeccable's Setup and fallback and judges only the screenshots, the lane's pick, or (b) Reviewer B runs in a scratch folder holding only the screenshots. Triage pick: (a), smaller and it keeps the guard's refusal from firing. Needs no answer from you: it makes design-review do what its own step 2 already says. Placed after c54 (triage, Oct 26): a real but unmeasured defect, below the CI and merge-path fixes.", "ask": "# c68: the blind design reviewer stays blind to the repo's design spec\n\nCloud build thread brief. Build advisor (3), Oct 26, against claude-settings main 853b512.\nBase: main 853b512; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (3)\" republishes the roadmap page.\n\n## Finding (unmeasured)\n\n`skills/design-review` step 2 says Reviewer B never sees the design spec. But Reviewer B runs\nimpeccable, whose SKILL.md Setup step 1 runs `impeccable context`. The guard rule\nimpeccable-review-only refuses that, and impeccable's fallback then reads the repo's\nPRODUCT.md and DESIGN.md directly. So in a repo with a DESIGN.md, Reviewer B likely reads the\nspec, and every run hits one guard refusal.\n\n## Task\n\n1. Red first: in a scratch fixture repo with a DESIGN.md and one screenshot, run the design\n   review as written and record what Reviewer B reads (file reads, the guard refusal). If it\n   does not read the spec, stop and report: the finding is false.\n2. Fix (a), triage's pick: Reviewer B's brief in design-review skips impeccable's Setup and\n   fallback and judges only the screenshots. Fix (b), a scratch folder holding only the\n   screenshots, only if (a) cannot hold.\n3. Green: the same run reads no spec file and draws no guard refusal.\n\n## Fences\n\n- In scope: skills/design-review and its tests. Do not edit vendored skills/impeccable; the\n  fix lives in the brief design-review gives Reviewer B.\n- Do not change guard rule impeccable-review-only.\n- d7 (#611) adds one pointer line to skills/design-review/SKILL.md; keep clear of it.\n\n## Failure classes and proof\n\n- This changes a review's behaviour: a fresh Sonnet reviewer reads the diff.\n- Report the red and green runs in the PR body; run checks through `verdict`.\n\n## Report\n\nCap 15 lines: Done, Deviations, Next. Send the green, reviewed head and branch to\n\"Advise the claude-settings build (3)\". Do not merge, and do not rebase onto main. No\nquestion for shiv: park any in the PR body.\n", "updatedAt": "2026-10-26T14:40:00Z"}, "c69": {"title": "A new shared lint module never breaks test fixtures, and a lane can run a whole gates job before sending", "phase": "cleanup", "status": "done", "order": 103.4, "why": "Each red batch run costs a CI cycle and holds every lane in the batch.", "note": "Landed, Oct 26: batch #637 (merged as 54be9f1) carried lane PR #633. Fixtures copy what git lists (testing/tracked_tree.py, .sh, TrackedTree.ps1), and bin/ci-job runs a whole gates.yml job, one verdict per step. Ruling, Oct 27 (shiv, waiting page item 27, option a): a lane never runs a full CI job; the batch run is the only full run, and bin/ci-job stays as an on-demand tool. Follow-up PR #654 (drop the builder's ci-job exception, record lanes-run-no-full-ci-job): merged Oct 27.", "ask": "# c69: a new shared lint module never breaks test fixtures; a lane can run a whole gates job\n\nCloud build thread brief. Build advisor (3), Oct 26. Base: main after #615 (o2, one layout for\nevery repo) merges; the dispatcher names the commit. Never rebase onto main after review. Push\nroadmap edits to the branch only; only \"Triage the roadmap (3)\" republishes the roadmap page.\n\n## Finding\n\no2 lost three CI cycles to test fixtures that copy a hand-picked list of lint/ files into a temp\ntree (lint/test_check_silent_undo.py, actions/ruling-kind/test_action.sh, and others). Each new\nshared module breaks every such fixture, and the gates job finds them one per run. The lane's\nlocal check list also skipped multi-line `run:` steps in .github/workflows/gates.yml.\n\n## Task, two parts in order\n\n(a) The cause. Find every test that builds a temp tree from a list of repo files (grep for\ncopies of lint/, hooks/, actions/ into temp dirs, in Python, shell and PowerShell). Give them one\nhelper per language that copies what git tracks under the named folders (git ls-files), so no\nfixture lists files. Red first: add a dummy shared module that an existing lint file imports, show\nthe old fixtures fail, then green with the helper. Remove the dummy before you send.\n\n(b) A `bin/` command that runs every step of a named job in gates.yml locally, each through\n`verdict`, multi-line `run:` steps included, and prints one verdict per step. A step whose tool\nis missing reads \"unknown (tool missing)\", never pass. Name it in agents/builder.md as the check a\nlane runs before it sends a head that touches lint/, hooks/ or actions/.\n\n## Fences\n\n- Never weaken, skip or narrow a test. A fixture keeps every case it has.\n- A step that uses `uses:` (an action) is listed as \"not run locally\", with the reason.\n- Windows suites (PowerShell) get the same helper if they copy file lists; prove them through a\n  gates.yml dispatch run on the branch.\n\n## Failure classes and proof\n\n- The dummy-module red run is the red proof; keep its output in the report as a verdict line.\n- Changes test harness behaviour and the builder agent: a fresh Sonnet reviewer reads the diff.\n- Run the new bin/ command on the gates job itself as the green proof.\n\n## Report\n\nAdd one line, \"Port to other repos: yes or no, and why\" (shiv's ruling on c52, Oct 26). Cap 20 lines: Done, Deviations, Next. Send the green, reviewed head and branch to\n\"Advise the claude-settings build (3)\". Do not merge, and do not rebase onto main. No question for\nshiv: park any in the PR body.\n", "updatedAt": "2026-10-27T03:12:00Z"}, "c7": {"ask": "Brief, copied from briefs/c7-c24-c25-premises-batch.md and kept in step with it. Paste all of it to a claude-settings session. Covers c7, c24 and c25. Also attach plans/premise-handoffs-plan.md (project files).\n\nPremises batch, claude-settings. Roadmap: c7 (fix the reply-style conflict: one question reviewer), c24 (planners check their brief's premises), c25 (handoffs list premises with sources, evidence lives in its record). Attach plans/premise-handoffs-plan.md with this brief; it is the design, with file and line references checked at 73ed71a7. Re-check each reference against current main before editing, since other batches have merged since.\n\nOrder: after the guard-rule batch (c10, let the guard grow then cull what never fired; l1, rules that never fired show up) lands. Fixes and tests only; no measuring step.\n\nOwner's rulings, Oct 21 (all four open questions in the plan, answered A):\n1. Premises show inside the question box: one to three short \"Based on:\" lines in plain words, each with its source kind.\n2. Drop the code check for the Goal and Problem lines; the question reviewer judges form too.\n3. The question reviewer runs on Opus by a standing class-level word, recorded in decision subagent-model-cap (like the audit Explore word of 2026-10-21).\n4. Raw evidence lives inside the decision or debt that uses it, in an Evidence section of about 10 lines, deleted with that record. Add that one clause to decision cull-rules in place.\n\nLanes, as in the plan's section 5:\n1. Probe agent hooks first, alone. Report which of the plan's checks hold. If agent hooks do not work, stop and report before any other lane; the fallback (the session spawns the reviewer itself) costs about five processes per question on Windows and needs the owner's word.\n2 and 3. The premise section in the handoff and the premise format's one home (same files: one builder, or 3 after 2).\n4. The question reviewer: agents/question-reviewer.md with model opus pinned, one agent hook on AskUserQuestion.\n5. Delete the old judges (the AskUserQuestion prompt hook and hooks/question_outcome.py, with their tests, decisions and references). Needs 4 merged.\n6. The planner duty in agents/plan.md: premises first, checked against decisions/ and recent rulings. Can run beside 2 to 4.\n7. The evidence clause in cull-rules (wording only).\n8. Handoff cadence (owner's ruling, Oct 21). (a) The Stop nudges to rewrite the handoff move from fixed token counts (200k, 350k, 450k, precompact_handoff.py) to fractions of autoCompactWindow, about 40, 70 and 90 percent, so they still fire if the window is lowered. Test: with the window set to 250k, all three nudges fire; red on main. (b) hooks/precompact_handoff_prompt.md gains a rule: also update the handoff with a small edit when something happens (an owner ruling, a finished step, a test result that changes what fails); the token nudges stay as the backstop. Shares files with lane 2: same builder, or after it. (c) The PreCompact digest (precompact_handoff.py, state/handoff/<sid>.digest.md) keeps every owner message word for word, not only the last 60,000 characters, with long pastes cut to their first lines and marked as cut. Digest file only; nothing new loads into context. Test: an owner message from early in a long transcript is in the digest verbatim, and a long paste is cut; red on main.\n\nEach lane: a test red on main and green on the fix, as the plan lists. Record each ruling in place under decisions/.\n\nReport: per lane, what changed and the test that proves it; lane 1's findings in full; the net hook processes per question on Windows, before and after, counted from settings.json; and the four size numbers on main.", "note": "Done. Landed in #566 (Oct 23, checked at f463787): one Opus question judge on AskUserQuestion replaces both old judges, and each question lists its premises with sources. The checks that need the chat (goal match, already-settled questions) went to the outside advisor (c32), since retired (c51).", "order": 110, "phase": "cleanup", "status": "done", "title": "Fix the reply-style conflict", "updatedAt": "2026-10-26T05:30:00Z", "why": "Plain beats short when they clash; each option says how it works; options that can't be told apart mean fewer options or a decision made for you."}, "c70": {"title": "A refusal with one lossless fix hands the session that fix, so it never asks you
