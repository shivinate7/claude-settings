<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
(() => {
  const DATA = {"steps": {"c1": {"note": "Sent. Stop rule chosen: debts + decisions.", "order": 10, "phase": "cleanup", "status": "done", "title": "Send the cull rulings to the running session", "updatedAt": "2026-10-17T17:20:00Z", "why": "Fast path for deletions, notes tier for unlikely gaps, no history in the tree, prose leaves only with a proving test, a time box, and size numbers each batch."}, "c10": {"ask": "Brief, copied from briefs/c10-c23-guard-grows-then-proves.md and kept in step with it. Paste all of it to a claude-settings session. Covers c10 (lane 1) and l1 (lane 2); prepares c23.\n\nGuard rule amendment and fire counts, claude-settings. Roadmap: c10 (the guard rule, amended) and l1 (track guard refusals per session). This prepares c23 (cull the guard itself), which is not part of this brief. Make it its own small batch after the one running now (the hook import, process-start and Windows lanes), because it touches CLAUDE.md and lint/, and those lanes are already editing files near them. No measuring step; prove each change with a test.\n\nOwner's ruling, Oct 21: let the guard grow while things change, then cull what never proved itself. No freeze was ever in force. The current rule stays and gets wider.\n\nLane 1, amend building-guard-needs-incident in place. CLAUDE.md, around line 82: \"Build a new guard or gate rule only against a named incident or a measured risk. Cite it in the rule's record.\" Rewrite it in place, as one rule with no new section, to say:\n- A new guard or gate rule may land for a named incident, a measured risk, or a likely risk (likely to hit in normal work, the same bar debts use).\n- Its record says which of the three it is, and the date the rule landed.\n- At each cull, a guard rule that never fired in guard.log since it landed, and whose record names no incident, is deleted with its code and tests.\nUpdate the rule's row in docs/records.md (line 77) and in lint/rule_mechanisms.json, whose reason text names only \"a named incident or measured risk\". Record the ruling in place under decisions/ if a decision holds this rule; otherwise in the rule's record. One-line reason: \"grow while things change, then cull what never fired (owner, Oct 21)\". Report the rule text before and after, and the word change.\n\nLane 2, rules that never fired show up. lint/guard_log_report.py already prints deny, ask and noted counts per rule from guard.log, and guard.log is never pruned. The gap: a rule that never fired has no line, so it never appears, and those are exactly the rules a cull is looking for. Add a flag (for example --all-rules) that lists every rule id the guard and the gates can emit, each with its counts, including 0, plus the date of the rule's first guard.log line (or \"never\"). Take the rule ids from their one home in the code, not a copied list (rule building-allow-list-is-the-constant). Let --days take \"all\" for the whole log. Tests: a rule with no lines shows 0 and \"never\"; a rule with lines shows its counts and first date; the list matches the constant, red on main and green on the fix.\n\nDo not delete any guard rule in this batch. That is c23, the guard cull, after this lands.\n\nReport: per lane, what changed and the test that proves it; the rule text before and after; and one run of the new report on this machine with --all-rules --days all, pasted in full, so the cull can start from it.", "note": "Done: landed in #560 (rule text batch), merged Oct 22. No freeze was ever in force; this step was only a plan until Oct 21. Your ruling, Oct 21: amend building-guard-needs-incident (CLAUDE.md line 82 at 5584d1b) in place. A new guard or gate rule may land for a named incident, a measured risk or a likely risk; its record says which and the date it landed; at each cull, a rule that never fired in guard.log and names no incident is deleted with its code and tests (c23, the guard cull). Last measured Oct 20 at 84d4076: decisions 100, debt files 47, hook lines 49,261, CLAUDE.md 2,399 words.", "order": 106, "phase": "cleanup", "status": "done", "title": "Let the guard grow, then cull what never fired", "updatedAt": "2026-10-23T03:10:00Z", "why": "Your ruling, Oct 21: no freeze. A guard may grow while things change; the cull removes what never proved itself."}, "c11": {"note": "Done Oct 19: the sentence 'A check that enforces a rule in this file needs no other incident.' is gone from CLAUDE.md on main (checked at 960cc63, after #515 and #516). Decided 10:42 am, option A. Measured basis: of 99 rule rows, 6 are guard rows hanging off CLAUDE.md rules, none citing an incident; guard code names at least 37 rules. The bigger lever stays reviewer variant hunting.", "order": 96, "phase": "cleanup", "status": "done", "title": "Close the no-incident exception in building-guard-needs-incident", "updatedAt": "2026-10-19T18:55:00Z", "why": "The rule says a new guard needs a named incident or a measured risk, then adds: 'A check that enforces a rule in this file needs no other incident.' So any CLAUDE.md rule can get a guard with no incident, and the freeze (c10) has a hole."}, "c12": {"note": "Done, checked Oct 20 at 84d4076. agents/builder.md: 'Never run the full suites locally. When your lane changes a file a mutation harness targets, run that harness once through verdict before pushing.' CLAUDE.md: 'CI is the merge gate for the full suites and the mutation harnesses.' Unknown: the wall time of one harness run (the brief asked the lane to record it; no record found in the repo). If runs prove slow, option B (anchor-only flag) is the fallback.", "order": 97, "phase": "cleanup", "status": "done", "title": "Builders run the mutation harness once before pushing a guard change", "updatedAt": "2026-10-20T16:55:00Z", "why": "A guard edit that moves a mutation's anchor text is caught only in CI today, which costs a red batch: drop the lane, re-run, open a fix lane. Five anchor re-point commits Oct 15-19 (40f4f251, f5e9ce3f, b700ade4, a3f56cb4, 3e23abf7). How many turned a batch red is unknown."}, "c13": {"note": "Done Oct 21. Landed in PRs #541 and #542 (the hook load batch): config_watch hashes first and exits before loading the guard; local_time no longer pulls in the guard family (new shared_names module); stall_watch exits at once on Windows; ci_wake got a pre-filter; the SessionEnd fetch runs at most once per 10 minutes per repo; verdict logs older than 7 days are pruned. The lane report was lost, so it closed on repo evidence. What was left moved: the Stop dispatcher and cached git reads to c19 (start fewer processes per tool call), the double question judge to c7 (fix the reply-style conflict).", "order": 99, "phase": "cleanup", "status": "done", "title": "Cut the load hooks add to every tool call", "updatedAt": "2026-10-21T17:30:00Z", "why": "A q_max session's report (Oct 20) found a model call on every Edit and Write, two judges on each question, about 6 hook launches per Bash call, 9 Stop hooks per turn, and the guard family (14 modules, 9,926 lines) loaded on every prompt. This is the first concrete plan for hook code, the one number the cull never moved."}, "c14": {"ask": "Build the machine-load brake as a standing part of claude-settings, on every device that installs it (Windows and Mac, no admin): at the moment a lane is about to start, the guard reads the machine's load once and sets how many lanes may run.", "note": "Rulings, Oct 21: every device that installs claude-settings, storage as well as CPU and memory; accurate; cheaper than the problem (no watcher, no timer, no per-tool-call reading, no log of its own). Oct 22: no lane count and no claude process count. Landed in #562 (main 1842e56): memory and disk as shares, CPU from a 200 ms sample, busy refuses background spawns and Workflows. Session question 3, Oct 22: it refused every lane (CPU 87-94%, 35 claude processes). Correction, Oct 22: the advisor's reason 'this app has no background setting, so left out means foreground' was a guess and false; the session read claude.exe 2.1.308.0, and every Agent lane in this app runs in the background. Advice taken: keep the behaviour, fix the reason. In #564 (CI running Oct 23): a left-out or false run_in_background passes busy; CPU counts only with memory over 75%; so in this app busy slows only Workflows and explicit background calls, and full (memory over 95% or little disk) stops every lane. Mac findings, Oct 22, checked at 1842e56: disk is read as a percent, so on the 926 GB disk busy fires under about 139 GB free (it held lanes at 119 GB); Mac CPU uses the load average, which read 100% busy during Spotlight indexing while top showed about half idle. Ruling, Oct 23: disk busy under the smaller of 10% of the disk and 15 GB free, full under the smaller of 5% and 5 GB. Ruling, Oct 23 (replaced Oct 25): 2-second CPU sample on every platform, after a Mac lane read 100% busy against top's 24% idle. Finding, Oct 23 02:30 (advisor measured): 17 idle Claude Desktop CLI processes each burn about one core (CPU 93%, memory 72%); the brake reads that right, the load is real (c40). The live brake (at 1842e56) refuses even run_in_background false, likely because this app's Agent tool has no such field and the call arrives without it (cause unknown, not checked); #564 lets a left-out field pass and counts CPU only with memory over 75%, so once installed, Agent lanes pass at today's load and only Workflows wait. Landed, checked at claude-settings f463787 (main, Oct 25): #565 (brake reads the machine) put disk in GB against the smaller of a share and a cap, and CPU from ticks; #569 waited for a tick change before giving up a CPU read. Your ruling, Oct 25: CPU dropped (a short sample is noise; memory and disk are what stall a machine). #572 (brake drops the CPU reading) built it: the brake now reads memory and disk only; the decision machine-load-brake is rewritten to match. The Oct 23 two-second-sample ruling is replaced by this one.", "order": 107, "phase": "cleanup", "status": "done", "title": "Machine-load brake: every session paces its lanes to the device's real load", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your idea, Oct 20, widened Oct 21: when the machine is loaded, sessions slow down; when it has room, more lanes can run. Incidents: the 15 spinning claude.exe workers of Oct 19, the q_max load report, and the Windows RAM climb to about 98% of Oct 21. Your caution, Oct 21: measuring and logging have cost more than the problem before."}, "c15": {"ask": "Draft the move from hard STE rules to outcomes: for each of the five blocking codes, what outcome it was for, whether a CI check, a judge or nothing should carry it, and what ste_gate becomes. Include the word and line change.", "note": "Five STE codes still block edits: STE001 (sentence over 30 words), STE011 (bloat), STE013 (double negative), STE020 (button or label over 4 words) and STE021 (UI escape comment). Checked at 11f5e4f: settings.json runs ste_gate before every Markdown or UI write and blocks every such write if the script is missing; md_sweep runs at each turn end; CI's STE lint step already fails a PR on changed lines. Direction you agreed Oct 20: stop blocking at edit time; keep the cheap checks in CI on changed files only; drop STE020 for the icon and label rule (topic 'Spacing, motion and icons') and design review; the reply-style judges (c7) carry the outcome. Same principle as c21: checks run in CI or at commit, never per edit. Draft (batch 9), Oct 22: the gate and md_sweep turn every refusal into a note and still run per edit; STE001, STE011, STE013 and STE020 move to CI; STE021 optional; 719 STE001 refusals in 15 sessions from Oct 13 to 22, no incident named for any code. Advice sent Oct 22, not yet confirmed by you: approve with three changes. (1) Take both hooks out of settings.json instead of making them note-only, since a note that changes nothing is noise and the per-edit cost stays. This also settles the fail-closed question. If a hook stays, it fails open: it is a style check, not a safety guard, and a missing script must not block every Markdown write in every repo (advice Oct 22; safety guards like guard.py stay fail-closed). (2) Drop STE020 as agreed Oct 20, not move it to CI. (3) Fold STE021 away (0 fires). CI carries STE001, STE011 and STE013. Goal session report, Oct 22: STE hook removal built and reviewed, waiting for the next batch (batch 9). The ste-ci-carries lane is empty (its rule-list row moved with the removal). Open: CI's plain-English check reads Markdown only, so UI files lose the long-sentence, bloat and double-negative checks; the session took that as the default and asks whether UI files should be checked too. After it merges, rerun the installer (two stub scripts keep writes working until then). Landed, checked at claude-settings f463787 (main, Oct 25): the STE hooks left settings.json in #566 (batch-oct23a, Oct 23), after #564 dropped and the goal-2 session re-applied the lane. Left over: two exit-0 stubs, lint/ste_gate.py and lint/md_sweep.py, kept for old installs (debt ste-stubs-delete). Deleting them was a goal-2 lane; not done (unknown whether the session parked it on the install-log check).", "order": 111, "phase": "cleanup", "status": "done", "title": "Swap the hard STE rules for the outcomes they were meant to get", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your direction, Oct 20: STE went in as hard rules, but what you want is the outcome: plain replies you can follow, clear UI copy, short docs. The rules block edits, slow every edit, and fight plain-beats-short (c7)."}, "c16": {"ask": "Janitor sweep speed lane: time a q_max preview split by check, then batch the git calls (one for-each-ref and one merged list for all branches; cherry only for what the batch cannot prove), drop the guard import, and add a fast worktree-only mode that reaps only branches already in main. A worktree it cannot prove safe is kept. Report before and after times.", "note": "Checked in the repo at 84d4076: janitor/sweep.py (3,189 lines) and session_end_sweep.py both import the whole guard family at start. Each worktree is proven safe by up to three checks in turn (ancestor, cherry-empty, remote-contains), each a separate git call, and a git call on Windows costs a process start. The remote-head check is already one batched rev-list --stdin call. Plan: 1. Time a q_max preview first, split by check. 2. Batch: one for-each-ref and one merged-into-main list for all branches, instead of calls per worktree; run cherry only for branches the batch could not prove. 3. Skip the guard import (move the few helpers it needs into a small module, same fix as c13 lanes 3 and 6). 4. A fast mode that only reaps worktrees whose branch is already in main, and leaves the rest for a full run. Less checking must still fail toward keeping a worktree, never toward deleting work. Stopgap given Oct 20: close sessions, then run git worktree remove without --force on each worktree; git refuses dirty or locked ones, and commits stay on their branches. Not measured yet: the sweep time itself. Landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25). Sweep time after the change: not measured.", "order": 121, "phase": "cleanup", "status": "done", "title": "Make the janitor sweep fast on big repos", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your ask, Oct 20: the sweep is very slow on Windows. q_max has about 178 registered worktrees and about 1,000 remote heads. You want it faster, by batching checks or checking less."}, "c17": {"ask": "Brief, copied from briefs/c17-agent-judge-opus.md and kept in step with it. Paste all of it to a claude-settings session.\n\nOpus on your word, claude-settings. Goal: when the owner wants Opus for a spawn, it runs, with no magic words; Claude never picks Opus on its own; no new model calls.\n\nToday: the type: prompt PreToolUse judge on Agent refuses an audit Explore spawn unless model is sonnet, so it refuses Opus too, against decision subagent-model-cap (\"any other spawn runs Opus only when the owner names it\"). It sees only the tool call, so the owner's word and the override pass can never reach it.\n\nLane 1, the ceiling moves to the guard. guard.py already runs on Agent and Task calls. When a spawn sets model opus and no standing word covers it (Plan; builder try 3; reviewer round 3 is not standing), the guard answers \"ask\" under rule subagent-model-cap, the same way it already asks on a settings write. The owner approves or declines in the prompt. An override pass lifts it like any other ask. Test: a spawn with model opus gets an ask; Plan with opus and a spawn with sonnet or haiku pass; red on main, green on the fix.\n\nLane 2, the judge keeps only the floor. DONE Oct 21 in PR #544 (the Agent judge accepts Opus); do not redo it, check lanes 1 and 3 against main first. In the Agent prompt judge, the Explore clause blocks only an audit or judging brief that sets model haiku or no model. Opus and Sonnet pass the judge; the guard owns the ceiling.\n\nLane 3, override takes words. In hooks/override_pass.py, a prompt that starts with the word override grants the pass, and the rest of the prompt is the reason, written to guard.log. So \"override: use opus for that one review agent\" grants a once pass. \"override 15m\", \"override 2h\" and \"override off\" keep their meaning when they are the whole prompt. A prompt that only mentions override later in a sentence grants nothing. Update the decision owner-override-pass in place.\n\nFirst check: does a hook \"ask\" show a prompt to the owner in bypass mode? The guard already relies on it for settings writes, so confirm with that existing case. Report the before and after judge text and the tests.", "note": "Done: landed in #562 (Opus ask and override words), merged Oct 22. Landed Oct 21 in #544 (the Agent judge accepts Opus): lane 2 is done; an audit Explore now passes on sonnet or opus, haiku or unset still blocks, pinned by tests with mutants, and a 2026-10-21 class-level Opus word is recorded. Lanes 1 (Opus ceiling in guard.py) and 3 (override takes words) are unknown; check before the next batch. Routing principle, advisor Oct 21: same agent plus a model override when the job is identical and only the depth changes, occasionally, per call; a dedicated agent with its model pinned (like Plan) when the job differs or the model is always the same for that job. By that test 'Explore audit' would be its own agent. Checked at ab592de. Cause: the Agent judge is a prompt hook that sees only the tool call, so your word and the override pass never reach it, and its Explore clause refuses anything but Sonnet. Override counts only when the whole prompt is override, override 15m, override 2h or override off. Plan in the ask: the Opus ceiling moves into guard.py as a yes or no prompt to you; the judge keeps only the floor (no Haiku audits); override accepts words after it. Unknown: whether a hook ask prompts you in bypass mode; lane 0 checks it with the existing settings-write case. Next batch, after the running one, since both edit guard.py and settings.json. Goal session report, Oct 22: in batch #562 (CI running), lanes opus-ask-guard and override-takes-words.", "order": 104, "phase": "cleanup", "status": "done", "title": "Opus runs on your word, and override understands plain words", "updatedAt": "2026-10-23T03:10:00Z", "why": "Oct 20, q_max: the Agent judge refused an Opus audit twice, even after you typed an override. The outcome you want: you say Opus, it runs; Claude never picks Opus on its own; no extra model calls."}, "c18": {"ask": "Brief, copied from briefs/c18-c19-hook-imports-and-spawns.md and kept in step with it. Paste all of it to a claude-settings session. Covers c18 and c19 lanes 1 to 3. Running now; lane 4 was narrowed Oct 21 to config_watch only, so tell the running session if it has not picked that up.\n\nHook import trim and fewer process starts, claude-settings. Roadmap steps: c18 (hooks stop loading code they never use) and c19 lanes 1 to 3 (start fewer processes per tool call). Fixes to existing hooks and mods, not new guard rules. No dispatcher, and no change to how hooks are launched (no exec form, no per-machine settings): those come later. Do not run timing or process-count measurements: the owner has enough numbers. Build the fixes and prove them with tests.\n\nGoal: a hook that has nothing to do for a path or input never loads the guard family, and Claude Code starts fewer bash.exe and python.exe processes per tool call. Every gate keeps exactly its current fail-open or fail-closed behaviour.\n\nLane 1, prose_judge loads nothing until it has work. In hooks/prose_judge.py, the import `from decision_watch import invoke_model` sits at the top of the file (line 21), so a .ts edit loads the guard family (about 105 modules) before main() checks the path. Move the import into main(), after the is_prose check. Keep the test seam, so a test can still replace invoke_model.\n\nLane 2, ste_gate loads nothing until it has work. lint/ste_gate.py imports ste_lint (2,290 lines) at the top (lines 53 to 54), only to read UI_SUFFIXES, then checks the suffix in main(). Import ste_lint only after the suffix check. Read UI_SUFFIXES from a small constant that imports nothing, with one home for that list.\n\nLane 3, the same fix on the other hooks. Check lint/report_gate.py, lint/md_sweep.py, hooks/reply_judge.py, hooks/feedback_gate.py and hooks/ruling_home.py. Any that import guard, decision_watch or ste_lint before they know they have work get the same fix: import after the cheap check.\n\nLane 4, `if` filters in settings.json, so Claude Code skips the hook without starting a shell. The `if` field takes one permission rule per handler and is checked only on tool events. Docs: https://code.claude.com/docs/en/hooks (Common fields).\n- config_watch only: on Write, Edit, MultiEdit and NotebookEdit, run only for the exact file names shared_names lists as watched files.\n- Owner's ruling, Oct 21: no filters on ste_gate or prose_judge. A Windows probe showed path patterns with a slash never match (paths arrive with backslashes) and suffix patterns are case-sensitive, so a miss would silently skip the gate. Leave its Bash, PowerShell and Stop runs as they are, since any shell command can write the cap.\nKeep each script's own path check as the second layer. Check that a filtered fail-closed handler still blocks when its script is missing.\n\nLane 5, the decision-watch mod finds Python once. mods/decision-watch/hooks/register.mjs calls pickPython (where.exe, or which) on every Stop. Look Python up once per session and reuse the result. Look again only if the cached path fails to start.\n\nLane 6, idle polling. Today, each session runs these even when nothing is happening:\n- session-board: a git read every 30 s while idle (HEARTBEAT_MS).\n- desktop-statusline: 2 git calls every 60 s (REFRESH_MS).\nRead git at turn end and on focus or attach. While idle, back off to about 5 minutes. If both mods need the same reading, share one.\n\nTests, per lane, red on main and green on the fix:\n- Lanes 1 to 3: run the hook on an input it ignores (a .ts path for lanes 1 and 2) and assert that no guard-family or ste_lint module is in sys.modules.\n- Lane 4: a settings test that an Edit of a watched file matches config_watch and an Edit of any other file does not.\n- Lane 5: two Stops in one session start the finder once.\n- Lane 6: an idle session runs no git read within the back-off window.\n\nReport:\n- Per lane: what changed and the test that proves it.\n- The four size numbers on main: decision files, debt files without README and notes.md, hooks/*.py lines (code and tests separately), CLAUDE.md words.", "note": "Checked at 5553dc6, Linux timings (9 runs each, median): guard 98 to 105 ms, ste_gate 98, prose_judge 100, config_watch 46, local_time 55, Stop hooks 30 to 120, bare python 17. Cause: prose_judge imports decision_watch (the guard family) and ste_gate imports ste_lint at the top, before checking the path. Skipping those imports saves about 75 ms each; merging processes saves about 17 ms each. Python processes per event: Edit or Write 4; Bash 2 on Windows (3 with 'ready') and 5 to 6 on Mac; Stop 9; prompt 1. Your ruling Oct 21: no measuring step, fixes proven by tests. A Stop-only dispatcher stays a later option in c19; the guard keeps its own process because it fails closed. Running now, in one batch with c19 lanes 1 to 3 and c22's Windows lanes.", "order": 101, "phase": "cleanup", "status": "done", "title": "Hooks stop loading code they never use", "updatedAt": "2026-10-21T20:15:00Z", "why": "The feedback from the c13 session said the next saving is one dispatcher per event. Measured Oct 21 (Linux, so a floor): an interpreter start is about 17 to 22 ms, but prose_judge and ste_gate take about 100 ms each on a .ts edit, because they import decision_watch (the guard family, 105 modules) and ste_lint before they check the path. A dispatcher saves about 17 ms per merged process here; skipping those imports saves about 75 ms each."}, "c19": {"ask": "Lanes 1 to 3 (if filter on config_watch, decision-watch finds Python once, idle polling) are in the combined brief, full text in the Ask of c18 (hooks stop loading code they never use). No measuring step (your ruling, Oct 21). Lane 4 (Mac-only hooks registered only on Mac; hooks started without a shell, with absolute paths and onFailure: block, so install renders settings.json per machine) waits for a design proposal after that batch lands. Later, after o2 and only if still needed: a Stop-only dispatcher and cached git reads (from the old hook load step).", "note": "Counted at 5553dc6, not timed on Windows. On Windows every command hook starts bash.exe (through Git Bash) and then python.exe. A sample turn (1 prompt, 5 Bash, 5 Edits, 5 Reads, 1 Stop) starts about 65 bash.exe and 46 python.exe per session: a Bash call 6 and 2, an Edit 4 and 4 (a .md edit adds ste_lint), a Stop 9 and 9. The decision-watch mod adds where.exe plus 1 or 2 python per Stop. Idle sessions poll git: session-board every 30 s, desktop-statusline 2 calls every 60 s. 'if' filter probe on Windows, Oct 21: path patterns with a slash never match (paths arrive with backslashes); bare suffix patterns match, but per tool and case-sensitively, and a miss silently skips the gate. Your ruling, Oct 21: filter config_watch only, on exact file names; the ste_gate and prose_judge filters are parked. Reopen them only if Edit and Write shell starts still matter once c22's fixes land and the memory monitor re-runs. Order: lanes 1 to 3 in the running batch; lane 4 design next; a Stop dispatcher after o2 only if still needed; an http hook server last, since one down server fails every gate.", "order": 102, "phase": "cleanup", "status": "done", "title": "Start fewer processes per tool call", "updatedAt": "2026-10-21T20:15:00Z", "why": "Your report, Oct 21: too many Python and bash spawns, worst with several Claude Code desktop sessions at once. Hooks run once per session, so the count multiplies with every open session."}, "c2": {"note": "Cull closed Oct 19 on its time box (your ruling). Final at cull batch 6 (#508, the last cull batch): decisions 90 (down 33% from 134), debt files 16 (down 96% from 364, swept into debts/notes.md), hook lines 47,461 (up 0.6%), CLAUDE.md 2,329 words (up 1.7%). The stop rule was never met; its named work was done in c6 (proving tests for five guard rules). decisions/cull-rules.md stays for the child-repo culls in Roll out. Regrowth is watched on the Clean up numbers.", "order": 20, "phase": "cleanup", "status": "done", "title": "Read each batch's size report", "updatedAt": "2026-10-21T17:30:00Z", "why": "The four numbers show whether the cull is shrinking the system or growing it."}, "c20": {"ask": "Widen the gloss rule, claude-settings. In CLAUDE.md, rule speak-cite-id-plus-gloss (line 89) covers only records. Rewrite it in place so it covers or any Claude Code hook. Report the files changed and the four size numbers.", "note": "Done: landed in #561 (ruff and ShellCheck in CI), merged Oct 22. Checked at 5553dc6: no Ruff, Black, ShellCheck or pre-commit config; 124 Python files outside the vendored impeccable skill, 18 shell scripts, 45 custom checks in lint/. Ruff's bug rules (F) find 12 issues: 11 unused imports and 1 f-string, so the code is already clean of real bugs. Advisor pick: checks run in CI or at commit, never on every edit (the same principle as c15). So ruff check (F and E9) and ShellCheck go in gates.yml; no format-on-edit hook; a repo-wide ruff format waits until after o2, which moves files anyway. Not checked: the chat's ShellCheck findings (7 quoted ~ paths, 2 unguarded cd). Next batch.", "order": 105, "phase": "cleanup", "status": "done", "title": "Standard code lint in CI only, never on each edit", "updatedAt": "2026-10-23T03:10:00Z", "why": "Oct 21: a claude.ai chat audited claude-settings and suggested Ruff (Python lint and format) in CI, ShellCheck, and a hook that formats each edited .py file. You asked for a take, framed as processing improvements."}, "c22": {"ask": "Brief, copied from briefs/c22-windows-installer-and-rm-shim.md and kept in step with it. Paste all of it to a claude-settings session. Sent Oct 21 as lanes W1 to W3 of the running batch.\n\nAdded work for your current batch: Windows process churn. Roadmap step c22 (stop the Mac/Linux installer and rm shim running on Windows). Finish or park the lane you are in first; do not restart lanes already done. These lanes are small and urgent, so land them as soon as your current lane allows, in this same batch. If they cannot share a batch, open them as their own small batch that merges first. They fix existing code on a platform it was never meant for. No measuring; prove each fix with a test.\n\nWhy: on the owner's Windows machine (Git Bash, no admin), RAM climbs to about 98% over a day and only a reboot clears it. Kernel memory grows with every process start. The worst offender caught was the rm shim: 4 processes (sh, a forked sh, the WindowsApps python3 alias, the real python) on every rm -rf.\n\nChecked at 5584d1b:\n- The settings.json SessionStart hook (startup|resume) runs `bash \"$d/install.sh\"` whenever bash exists, so the Mac/Linux installer runs on Windows at every session start.\n- landed-dirs.txt includes bin, so it lands bin/rm, whose header says \"Posix only; install.ps1 does not land this file.\"\n- install.sh (near line 600) adds ~/.claude/bin to PATH in ~/.bashrc, putting the shim first in Claude Code's shells. install.sh has no Windows check.\n- bin/rm calls bare python3 (the WindowsApps alias on Windows, which starts a second python) and builds its Python with $(cat <<'PYEOF'), one more fork.\n\nLane W1, the installer stays off Windows. The SessionStart hook skips install.sh when uname -s is MINGW*, MSYS* or CYGWIN*, and install.sh exits 0 at its top on those, naming install.ps1 as the Windows installer. Test both. Record the ruling in place under decisions/ (one ruling, a one-line reason).\n\nLane W2, the rm shim. On MINGW, MSYS or CYGWIN, exec the real rm at once, before any python. Elsewhere, find Python the way the hooks do (python3 then python, skip WindowsApps), and pass the Python on stdin with a here-doc instead of $(cat). Mac and Linux protection stays exactly as it is. Test the Windows exec path, the WindowsApps skip, and the existing refusal cases.\n\nLane W3, ci_wake's pre-filter. Tighten the PostToolUse shell pre-filter from any \"ready\" to the phrase gh pr ready, so other commands start no python. The watch itself, its deadline and asyncRewake stay.\n\nOverlap with your current lanes: W1 and W3 edit settings.json, which your 'if' filter lane also edits. Do them in one pass on settings.json, or rebase whichever lands second; keep both sets of changes.\n\nIn your report, add:\n- Per W lane: what changed and the test that proves it.\n- A checklist the owner runs on the Windows machine after this merges and is pulled, no admin needed and nothing scripted: delete ~/.claude/bin/rm; remove the \"# claude-settings: ~/.claude/bin on PATH\" block from ~/.bashrc; check ~/.claude/claude-settings-install.log for install.sh runs; and check whether install.sh replaced ~/.claude/settings.json or a landed folder with something install.ps1 would not have made, and how to put it back.", "note": "Merged Oct 21, 17:22 CDT, in #552 (main 6c187c78) with c18 and c19: W1 #558, W2 #554, the parent-delete guard rule #557 and the hook lanes. Still open as drafts at 01:15 CDT Oct 22: #556 (manual memory monitor; your re-run after this batch needs it merged or run from its branch), #551 (settings if filters; looks superseded by your config_watch-only ruling, unchecked) and #549 (carried by #559). A follow-up lane, stale-postmerge-hook (install.ps1 removes its own post-merge hook when symlinks work, decision post-merge-hook-is-a-fallback), was built 00:34 to 00:58 and has no PR yet. Earlier state, 19:25 Oct 21: main is at 73ed71a; 13 draft PRs are open (W1 #558, W2 #554, the parent-delete guard rule #557, the memory monitor #556, and the c18/c19 batch #552 with its parts #546 to #553, #555); none is ready, and CI skips every job on a draft (decision draft-until-reviewed), so none has a CI verdict yet. Main still runs install.sh at every Windows session start (settings.json line 160). Verified at 5584d1b. The SessionStart hook runs install.sh whenever bash exists, so the Mac/Linux installer runs on Windows at every session start and resume. It lands bin/ (the rm shim included, though its header says Posix only) and puts ~/.claude/bin first on PATH through ~/.bashrc. The shim calls bare python3, which on Windows is the WindowsApps alias (2 pythons), plus an extra fork for $(cat). ci_wake starts python for any command containing 'ready', though only gh pr ready starts a watch. Seen on your machine Oct 21: install.sh ran three times back to back from 11:51, each 80 to 90 s, against the hook's 20 s timeout, so each run is orphaned and every session start launches another. Running now: lanes W1 to W3, added to the hook import and process-start batch (c18, c19). After it merges: your cleanup checklist from the brief, then re-run the memory monitor. ci_wake, checked at 5584d1b: a real watch keeps one python alive up to 55 min (deadline 3300 s) and starts gh every 30 s, about 110 gh starts per watch. Your pick, Oct 21 (sent as a follow-up to the running session): keep the narrowed trigger and the deadline, back the status reads off from 30 s to about 120 s (roughly 4x fewer gh starts, up to 2 min later wake). The follow-up also asks the session to run the cleanup itself after W1 and W2 are pulled, and to record the if-filter probe in the hook-if-filters decision. W2 question, Oct 21: the shim refuses rm -rf of home, a parent folder and '.', and guard.py lacks '.', '..' and parent-of-cwd. Advice sent: W2 as briefed, and move those refusals into guard.py's existing recursive-delete rule (Bash and PowerShell, with tests); not a new rule, and no freeze is in force. Refined answer sent: tests cover spelling variants (./, -r -f, -fr, --recursive, quoted, absolute cwd in /c/ and C:\\ forms, PowerShell Remove-Item -Recurse and its aliases), cd .. && rm -rf . is refused, and rm -rf ./build and a sibling folder stay allowed. Accepted risk, Windows only: a delete inside a script, a runtime variable or a symlink to a parent is not caught (the shim still catches those on Mac and Linux), recorded in the W1 decision record. W1 CI, Oct 21: two Windows tests faked a Linux uname to keep passing (the gates-windows install.sh suite, which timed out on #544's run, and the install.sh leg of install-set.test.ps1). Your answer: drop both and close debt install-checkout-flake; one fast Windows test under the real Git Bash uname proves install.sh exits 0, writes nothing to ~/.claude and prints one skip line; check every Windows caller first. Checked at 5584d1b: merge/install_from_main.sh already runs install.ps1 on Windows, the Windows post-merge hook (written by install.ps1) runs install.ps1, and only the SessionStart hook ran install.sh. After W1, Windows refreshes on pull and merge, not at session start. Correction, Oct 21: the dropped install-suite step also ran caseF1 and caseG1, which test session_start.sh (real Windows code); your answer: keep them on Windows in their own short-timeout CI step and reopen debt install-checkout-flake, retired only by fixing the race; the debt records which side the race is on, and if it is in session_start.sh itself it is a live Windows bug at session start and gets raised. Advisor pick, Oct 21: start no new batch until this one lands; land it first. Found Oct 21 by the running session: ~/.claude/bin/rm has CRLF on your machine, so its line-2 marker check misses, it execs itself in a loop, and every rm in a Claude Bash shell hangs. install.sh copies it from the checkout at each session start, so a plain delete does not stick. Advice sent: a stopgap that survives session starts, with no push: bin/* text eol=lf in the checkout's .git/info/attributes, rewrite bin/rm through /usr/bin/rm and git checkout, fix the ~/.claude copy, stop only its own loops, and report core.autocrlf and git ls-files --eol for other CRLF files. Then keep the plan: the tracked eol=lf rule in the fix PR (bin/* and any other CRLF file found), and delete the shim and its PATH line after W1 and W2 merge. Pin line endings, Oct 21: main's .gitattributes has no bin/* eol=lf rule (only *.cmd crlf and one run.sh line); W2 (#554) carries it. Under autocrlf=true, four bin files in the current pin are CRLF (merge, verdict, ste-changed, claude-janitor), The session measured that verdict and merge run fine with CRLF, since Python and Node ignore a CR (the advisor's guess that they were broken was wrong). Of 108 tracked #! files, 105 are Python or Node; 3 are shell scripts, where a CR does break the run: githooks/main-ref/reference-transaction, skills/impeccable/scripts/impeccable and bin/claude-janitor. Advice sent: scope the rule and test to shell scripts only, so 100+ .py files don't churn in every Windows checkout. The rule is bin/* githooks/* *.sh text eol=lf, plus the impeccable script by path. W1's CI test checks each landed ~/.claude/bin entry links to or is byte-equal to the pin. It also fails on a CR in *.sh or in any #! file whose interpreter is sh, bash or zsh (directly or through env), red on main and green on the batch. No new install code. Home for the rule, advice sent Oct 21: a new decision, shell-scripts-check-out-lf, not rm-path-wrapper (the shim's record), since the rule covers every shell script; rm-path-wrapper points to it. Checked at 73ed71a: no decision covered line endings. #552's second run, Oct 21: red on the Ruling kind check (shell-scripts-check-out-lf had Kind: build but no Plan: line); fixed in lane #554 under your new in-lane fix ruling (c30), not dropped. Next, Oct 21: one goal file, briefs/cleanup-goal-oct21.md, runs every remaining cleanup step in order after this batch (about 20 hours, one claude-settings session). Open, for IT: why processes under Claude start with about 2,000 handles against about 180 by hand. Goal session report, Oct 22: needs you: delete ~/.claude/bin/rm with the PowerShell line from earlier.", "order": 100, "phase": "cleanup", "status": "done", "title": "Stop the Mac/Linux installer and rm shim running on Windows", "updatedAt": "2026-10-22T18:15:00Z", "why": "Your Windows audit, Oct 21: RAM climbs to about 98% over a day and only a reboot clears it, with kernel pool growing about 0.8 GB an hour while tool calls run. The longest-lived processes were the rm shim's 4-process chain. Process churn is the lever on our side; the rest (why each MSYS2 process starts with about 2,000 handles) goes to IT's security agents."}, "c23": {"ask": "# Batch 4: cull the guard, part 2 (c23). Run on the Mac.\n\nPaste this whole file into one fresh claude-settings session on the Mac.\nWritten by the advisor, Oct 25, against claude-settings main f463787 (#572).\n\n## Goal\n\nDecide two guard rules that never fired on Windows: keep or delete each, on both machines' counts.\n- `gh-api-method`: refuses `gh api` with a write method (the API route to merges and settings changes).\n- `ln-over-directory`: refuses `ln -s` over an existing folder. It can do real harm only on Mac.\n\nGoverning records: debt guard-cull-held-two (the two rules held for the Mac count), decision\ncull-rules (how a cull runs), rule building-guard-needs-incident (delete a guard rule that never\nfired since it landed and whose record names no incident).\n\n## Steps\n\n1. Confirm you stand in the Mac clone on an up-to-date main: `git fetch origin main` and\n   `git -C <pin> rev-parse HEAD` against `git rev-parse origin/main`. If the pin is behind, the\n   session-start auto-pull (#568) failed: say so in the report, then reinstall with\n   `bash merge/install_from_main.sh` from the clone.\n2. Count: `verdict python3 lint/guard_log_report.py --all-rules --days all`. From its output, give\n   for each of the two rules: deny, ask and noted counts, and the first-line date or \"never\". Also\n   give the log's line count and its first date, so the count's reach is known.\n3. Windows count, Oct 22 (from the debt): zero lines for both, in 20,685 lines since 2026-09-16.\n   If the owner gives a fresher Windows count, use it.\n4. Stop point. Bring the owner one question with options and a pick, per rule:\n   - Count zero on both machines: delete (pick), or keep with the reason.\n   - Count above zero on the Mac: keep (pick). Quote each fired line's date and command shape, so\n     the owner sees whether it caught a real mistake.\n   Ask the owner directly. This is a deletion of a guard, so it is the owner's call, not the\n   advisor's. Do not delete anything before the owner names the rules.\n5. Build what the owner names, in one lane: delete each named rule from `hooks/guard.py` (its code,\n   its reason constant, its line in the rule list near line 63), its rows in `hooks/test_guard.py`,\n   and its mutants in `hooks/mutate_guard.py`. Rewrite or delete debt guard-cull-held-two: delete it\n   when both rules are decided. Update every other reader that the rule ids appear in\n   (`git grep -n '<rule id>'`).\n6. Proof: the guard suite and the mutation harness pass with the rules gone; `guard_log_report.py\n   --all-rules` no longer lists a deleted id. A reviewer reads the diff (it changes a guard).\n   Merge under the usual rules (git-integration-branch-merge, roles-review-cap-three); a lone lane\n   is its own integration PR.\n\n## Report\n\nDone, Deviations, Input Needed, Next, per the report rules. Include the two counts (Mac and\nWindows), the owner's answer with its date, and the PR. If nothing was deleted, say which rules\nstay and why, and where that ruling now lives.\n", "note": "Part 1 done: #562 deleted STE-wording and role-diff-nocwd (Oct 22). Part 2, the Mac count for gh-api-method and ln-over-directory, is batch 4 of goal 2. Count, Oct 22, Windows guard.log only (20,685 lines since 2026-09-16): nine rules never fired. Kept: two whose records name a real incident (the bare-merge ask, the linked node_modules delete guard). Set aside: three this machine cannot judge (one STE code under review, two Mac-only simulator limits). Four meet the cull test: gh-api-method (refuses gh api with a field flag and no --method, since gh then sends a POST, a write, when a read was meant; an explicit --method passes; checked in hooks/guard_stream.py at f463787; about 60 lines, 11 tests; no incident), ln-over-directory (guards ln -s over a folder; about 58 lines, 7 tests; on Git Bash ln -s copies, so it can't fire the same way on Windows), STE-wording (a log code the gate can never send; dead code), role-diff-nocwd (a log-only note nobody reads). Why hold two: the count is one machine. ln-over-directory only does real harm on Mac, so the Windows log can't prove either useless. Mac count: run lint/guard_log_report.py --all-rules --days all on the Mac after batch 2 lands. Part 1 merged in #562. Part 2 not started, checked at claude-settings f463787 (main, Oct 25): gh-api-method and ln-over-directory are still in the guard. Waits on the Mac count. Standalone brief written Oct 25 (briefs/c23-guard-cull-part-2.md), given to you to paste into a Mac session; the deletion list comes to you as a question first. Mac count, Oct 25 (Mac session, at main f463787): ln-over-directory fired 13 times, gh-api-method twice (one a comment post to an issue, a real write; one a gh api search/code call with fields, which gh sends as a POST). Windows: zero for both. Your ruling, Oct 25: delete gh-api-method, keep ln-over-directory. Built on branch guard-cull-gh-api (c8c2de7e), no PR; review round 1 failed it: the rule is the only guard that refuses gh api repos/o/r/pulls/5/merge -f merge_method=squash. Advisor check, Oct 25, at f463787: no other guard rule names an API merge, and gh api -X PUT .../pulls/N/merge (the form GitHub accepts) already passes on main; the form the rule catches goes out as a POST, which GitHub's merge endpoint (PUT only) most likely rejects (not tested). So the rule blocks a merge attempt that likely fails anyway, and real API merges are unguarded. Your ruling, Oct 25 (after the round-1 finding, against the advisor's keep pick): delete it anyway; your typed word in the Mac session is the override for the hole it opens. Note, not a guard: gh api -X PUT .../merge is an unguarded merge route; it becomes a debt or guard only after a session is seen using it.", "order": 125, "phase": "cleanup", "status": "active", "title": "Cull the guard itself", "updatedAt": "2026-10-25T21:20:00Z", "why": "The Oct 19 cull cut decisions (-33%) and debts (-96%) but never touched guard code: hook lines went 47,196 to 49,261. The hook cut has to come from culling guard code directly."}, "c24": {"ask": "Lane 6 of the premises brief; its full text is in the Ask of c7 (fix the reply-style conflict). Plan: plans/premise-handoffs-plan.md in the project files.", "note": "Planners already run on Opus with a fresh context per lane, so model and context are not the gap. The gap: a planner plans inside its brief and never doubts it, sees one lane only, and reads a repo that lacks your newest rulings (o5b). Shape, advisor pick Oct 21, not yet ruled: no new reviewer. The planner prompt gains one duty: before planning, list the premises the brief rests on, each with its source ('from notes' or 'measured in run X'), check each against decisions/ and recent rulings, and name any that don't hold and any simpler route. The orchestrator does the same check once, across lanes, when it writes a batch's briefs. Three layers together steer: rulings filed the day they're made (o5b), the question judge (c7), this premise check. Draft with c7. Landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25).", "order": 112, "phase": "cleanup", "status": "done", "title": "Planners check their brief's premises before planning", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your question, Oct 21: can questions steer the work? A question judge (c7) only acts when a session stops to ask; a wrong premise in a plan can reach a PR without ever becoming a question. Today's 'the freeze stops me' was baked into the plan."}, "c25": {"ask": "Lanes 2, 3 and 7 of the premises brief; its full text is in the Ask of c7 (fix the reply-style conflict). Plan: plans/premise-handoffs-plan.md in the project files. Your ruling, Oct 21: evidence lives inside its record; add that clause to cull-rules.", "note": "Your point, Oct 21: handoffs at token thresholds plus auto-compaction already give a long goal a fresh start, so no fresh-session trigger. A compaction and a new session share one gap: both inherit the handoff's premises. Plan, Oct 21 (plans/premise-handoffs-plan.md): the handoff gains Goal and Working premises sections; each premise carries a source kind (ruling, measured, read, notes, assumed); notes and assumed are weak and get re-checked before anyone acts on them; after a compaction the existing reorient hook lists which to re-check; a wrong premise is rewritten or deleted, never logged. Compaction threshold, Oct 21: yours is 500k (chosen arbitrarily). Advisor pick, a judgment and not measured: about 250k for an orchestrator once this step lands, since cheap premise-checked compactions make a lower threshold safe; keep 500k until then. Keeping orchestrators lean (big reads go to subagents) matters more than the number. Rewrite cadence, checked at 73ed71a7: the handoff is rewritten on a Stop nudge at fixed 200k, 350k and 450k tokens, compaction at 500k; the plan leaves this unchanged. Additions, advisor Oct 21, from web practice (Anthropic's long-running harness article, a Claude Code compaction guide, a Codex/OpenCode comparison): (1) nudges as fractions of autoCompactWindow (about 40, 70 and 90%), since fixed numbers stop firing if the window drops to 250k; (2) also update the handoff on events (a ruling, a finished step, a test result that changes what fails), small edits, with the token nudges as backstop; (3) the PreCompact digest keeps every owner message verbatim, not only the last 60,000 characters. Your rulings, Oct 21: 1 and 2 approved, added to the brief as lane 8 (the prompt today asks for rewrites only at the nudges and after compaction, not on events); 4 is covered by the premise re-check; 3 approved too, in the light version (owner messages verbatim, long pastes cut to their first lines, digest file only), added to lane 8. Raw evidence lives inside the decision or debt that uses it (an Evidence section of about 10 lines, deleted with the record), not a measurements/ folder; that needs one clause added to decision cull-rules, your word. Goal session report, Oct 22: evidence clause in batch #562; premise section in the handoff built and reviewed, waiting for the next batch (batch 6). Landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25): handoffs carry Goal and Working premises (hooks/precompact_handoff_prompt.md, decision precompact-handoff).", "order": 113, "phase": "cleanup", "status": "done", "title": "Handoffs list premises with sources, and raw evidence gets one home", "updatedAt": "2026-10-25T19:45:00Z", "why": "Feedback you brought, Oct 21: lanes reasoned from summaries ('6 to 8 pythons, from notes') instead of the data, and a long-running session carries its own wrong beliefs forward."}, "c26": {"ask": "One rule in CLAUDE.md, amended into an existing rule if one fits rather than a new section: any tracking, logging, monitoring or measuring a session adds must (1) read on demand, at the moment the answer is needed, inside a process that is already running, not on a timer or on every tool call; (2) start no new long-lived process and no extra python or bash where avoidable; (3) state its cost in its record (process starts, files written, how often it runs); and (4) carry a test that proves that cost (for example, zero child processes on its path). A log or file it writes needs a named reader, or it is not written.", "note": "Done: landed in #560, merged Oct 22. Filed Oct 21 from your gripe, during the load brake design (c14, machine-load brake), which is its first user. Pairs with your no-measuring-steps ruling. Can ride with the guard-rule batch (c10, c23), which already edits CLAUDE.md's rule text.", "order": 108, "phase": "cleanup", "status": "done", "title": "Watching costs less than what it watches", "why": "Your gripe, Oct 21: Claude's own tracking, logging and measuring has sometimes cost more than the problem it was meant to solve.", "updatedAt": "2026-10-23T03:10:00Z"}, "c27": {"ask": "Kill guard knows a lane's left-behind server, claude-settings. Goal: a session can stop, by pid, a test server that one of its own lane agents started, after that agent ended, on Mac. A process this session did not start stays refused. No new per-call cost.\n\nToday, checked at 73ed71a: hooks/guard_kill.py foreign_pid_kill allows a kill by pid only when the parent chain reaches this session's claude process. When an agent ends, macOS hands its server to init (PPID 1), so the guard calls it foreign. The one exception, in_own_agent_worktree, needs the cwd inside .claude/worktrees/agent-<id> AND <session>/subagents/agent-<id>.jsonl. Lane agents work in scratchpad folders, and workflow agents keep their records under subagents/workflows/, so it never matches them. Decision a-kill-by-pid-needs-an-owned-pid lists this as a known limit.\n\nFirst check, before any code: on the owner's Mac, start `sleep 600 &` from a Bash call inside a subagent, let the subagent end, and confirm three things. (1) The sleep's PPID is 1. (2) Its environment holds CLAUDE_CODE_SESSION_ID equal to the hook payload's session_id. Read it the way lane 1 will. (3) Where the subagent's record landed under subagents/. If (2) fails, stop and report; do not fall back to path rules.\n\nLane 1, ownership by inherited tag. In guard_kill.py add one check beside in_own_agent_worktree: a pid is owned when its PPID is 1 and its environment holds CLAUDE_CODE_SESSION_ID exactly equal to this session's id (session_id_of, from the payload). Read the environment without a child process where you can: Linux /proc/<pid>/environ; Mac sysctl KERN_PROCARGS2 through ctypes, which returns argv and env separately, so a matching string in argv does not count. Match a whole NAME=value entry, never a substring. Any read failure means foreign. Read it only on the path that already found the pid foreign, so an allowed kill costs nothing new. Keep the worktree exception. Windows stays as today (unknown, allowed).\n\nLane 2, the reaper uses the same test. janitor/agent_end_reap.py only looks under .claude/worktrees/agent-<id>, so a scratchpad lane's server runs until a full sweep. On SubagentStop, also stop each orphaned process whose environment holds this session's id and whose cwd sits in this session's scratchpad, with the reaper's other reads unchanged. If one shared helper serves both files, give it one home (shared module) and import it from both.\n\nLane 3, one brief line. Wherever the lane brief template lives, add: a lane stops each server it started before it ends, by $! from the same call or through the harness.\n\nTests, red on main and green on the fix: a PPID-1 process carrying this session's id is allowed; the same process carrying another session's id is denied; one with no tag is denied; one whose argv, not env, holds the id is denied; pids 0, 1, -1 stay denied. Add a mutant in hooks/mutate_guard.py that drops the exact-match check, and show a test kills it. Update the decision a-kill-by-pid-needs-an-owned-pid in place: one dated owner line, Oct 21, and fix the Limits list.\n\nOverlap: PR #557 (refuse a recursive delete of a parent folder) edits hooks/guard.py, delete section only. This work should not need guard.py; if it does, rebase on #557 first.\n\nReport: the first-check results, the diff size per file, test names, and the decision's before and after text.\n", "note": "Checked at 73ed71a (main), Oct 21. hooks/guard_kill.py foreign_pid_kill allows a kill by pid only when the parent chain reaches this session's claude process; a pid with parent 1 is foreign. Its one exception, in_own_agent_worktree, needs the cwd inside .claude/worktrees/agent-<id> AND subagents/agent-<id>.jsonl directly under the session's folder. Scratchpad lanes fail the first test; workflow agents, whose records sit under subagents/workflows/ (your report, not measured here), fail the second. janitor/agent_end_reap.py (the agent-end reaper) has the same blind spot. Your ruling, Oct 21: go with the advisor pick. Ownership = parent is 1 and the process's environment holds this session's CLAUDE_CODE_SESSION_ID, read only when a kill would otherwise be refused (no per-call cost, fits c26); plus one brief line telling lanes to stop their own servers. Rejected: widening the path exception (still guesses from location) and recording pids (costs every call, misses script-launched servers). Unmeasured: that the tag is present on Mac; the brief's first check measures it and stops if not. Overlap: no open PR touches guard_kill.py; PR #557 (refuse a recursive delete of a parent folder) edits guard.py's delete section only. Not started, checked at claude-settings f463787 (main, Oct 25): goal 2 batch 5, parked until a Mac session runs it. Brief: briefs/c27-kill-guard-session-tag.md. Goal 3 batch 4 (text on c37); Mac only.", "order": 109, "phase": "cleanup", "status": "todo", "title": "Let a session stop the test servers its lane agents left", "updatedAt": "2026-10-25T22:30:00Z", "why": "Your report, Oct 21: on Mac, a lane agent's test server is handed to the system (parent pid 1) when the agent ends. The kill guard then calls it foreign and refuses the kill, so the server keeps running and holds its port and memory."}, "c28": {"ask": "Amend output-never-hand-off-doable-step (do a step yourself before handing it to me) in output-styles/shiv-stylisms.md, in place, no new rule: (1) every command left to you comes as its own fenced block, ready to run as is: it starts with the cd it needs, has no placeholders for you to fill (ask first if a value is unknown), and needs no admin; (2) the shell follows where you will run it: a block for the app's Run button can be bash; a block you paste into a terminal on Windows is PowerShell (5.1-safe), since that is the terminal you open; a block that needs Git Bash says 'open Git Bash' on its first line; a Mac block is bash or zsh; never mix shells in one block, and a Mac-only or Windows-only step says which; (3) the block sits outside the report blockquote, because report-to-user-blockquote forbids code fences inside it, and the report names the block in one line. Mechanize cheaply (c26, watching costs less than what it watches): reply_judge.py, the Stop reply check that already runs, flags a reply that hands you a step with no code block. Test: a sample reply that hands off a step with no block is flagged; one with a block passes; red on main.", "note": "Done: landed in #560, merged Oct 22. Checked at 73ed71a: the rule already exists in shiv-stylisms.md (lines 38 to 43) and asks for a runnable bash block outside the report, but it is prose only, says nothing about PowerShell or Mac versus Windows, and sessions still skip it. So this amends that rule and adds a check, rather than adding a second rule. Gripe, Oct 21: the advisor handed you a Git Bash block, and you ran it in PowerShell, where every line failed (no grep, no bash syntax); hence the shell-follows-the-terminal clause. Can ride with the guard-rule batch (c10, c23) or the premises batch (c7, c24, c25), which edits reply hooks. Gripe, Oct 26: the advisor handed you an add-on file to paste under another session's /goal block instead of one complete prompt. Fix in this chat: anything you paste comes as one whole block. No new claude-settings step: this step's rule already covers sessions; the slip was the advisor's.", "order": 109.5, "phase": "cleanup", "status": "done", "title": "A step left to you comes as a command you can run with one click", "why": "Your ask, Oct 21: when a session won't run a command but you can, it should hand you the exact command, preferably bash, so you just press the Run button.", "updatedAt": "2026-10-26T03:08:00Z"}, "c29": {"ask": "Lane after #552 merges, first in line: move decision-watch from classic.Stop to turn.complete. Skip turns with e.agentId set (subagent turns), as session-board does. Build the python input from the session id the mod already keeps from session.start, and find the transcript the way /dw already does, since turn.complete carries no transcript path. Keep one judge at a time and never block the turn. Drop the stop_hook_active skip, which only Stop has. Tests: a main-turn turn.complete starts a judge; one with agentId does not; a classic.Stop no longer does. Bump the mod's version. Live proof on Windows: a STOP seen line (or its renamed TURN seen line) lands in shadow.log after one real turn. Rewrite decision decision-watch-mod-limits in place and close debt dw-stop-row-unproven with the sec-default finding. No Stop hook row comes back.", "note": "Done: #559 (decision watch judges at turn end), merged Oct 22. Still owed: one live check that it runs, possible since the Windows restart. Found Oct 21: sec-default, the app's own mod from the claude-code-plugins marketplace, sends every classic.* event past user-tier mods (its register.ts line 24), so decision-watch, which listened only on classic.Stop, has never run on your Windows machine: it is enabled and installed, but no shadow.log exists. Session check, Oct 21, read-only, from source and docs, not seen firing: turn.complete fires when a model turn ends (mods types file, claude-code.d.ts lines 3647 to 3651), and carries answer, durationMs, isAborted, turnId, reason, and agentId for subagent turns. sec-default's README lists turn.* as passing, and its register.ts does not handle it. desktop-statusline and session-board already listen on it, so it likely does fire. Unchecked: the installed app package may differ from the marketplace copies. Checked at 73ed71a: decision-watch is the only claude-settings mod on a classic.* event. Goal session report, Oct 22: needs you: restart the app and take one turn, for the live proof.", "order": 102.5, "phase": "cleanup", "status": "done", "title": "The decision watch runs again: the app's security mod blocks it on Stop", "why": "Notice you saw, Oct 21: 'decision-watch: its classic.Stop hook was skipped. cc-plugin-sec-default runs first and sent the event on past it.'", "updatedAt": "2026-10-23T03:10:00Z"}, "c3": {"note": "Checked Oct 20 at 84d4076: janitor/sweep.py now runs fetch --prune (records the roots whose fetch failed). Not confirmed: that a test goes red on an unfetched remote commit, and the q_max keep-reason counts the brief asked for (session report not seen in the advisor chat). Lesson, Oct 19: a session cannot see the advisor chat, so a brief that cites an owner ruling must state the ruling itself.", "order": 30, "phase": "cleanup", "status": "done", "title": "Fix the janitor sweep", "updatedAt": "2026-10-20T16:55:00Z", "why": "It never fetches, so one unfetched remote commit makes it keep every worktree as unreadable. Fetch first, and skip remote heads the clone lacks."}, "c30": {"ask": "Amend git-integration-branch-merge in place (CLAUDE.md line 56 at 73ed71a), no new rule. (1) Today: 'Never push to a ready PR while its CI runs.' New: 'Never push to a ready PR while its CI run can still go green. Once a job is red, push the lane drop or the lane fix at once; the push cancels the old run, and the new run is the re-run.' (2) Today a red lane is always dropped and fixed in its own lane for the next batch. Add: a red check is instead fixed in its lane and the lane re-merged, when all hold: the fix is a few lines in the failing lane's own files; the failing check is about form (record format, version bump, lint), not a behaviour test; it is the lane's first such fix in this batch (a second red drops it); and the fix goes on the lane branch, never in the batch branch. A lane red on a behaviour test is dropped as today, with any lane that depends on it. Reason lines: a red run cannot merge, so waiting only delays the re-run; dropping a chain of lanes for a one-line form fix costs a batch cycle for nothing (owner, Oct 21). No guard. Update the rule's row in docs/records.md if it quotes the clause. Small, fits the rule-text batch (c10, c26, c28, c20).", "note": "Done: landed in #560, merged Oct 22. Your rulings, Oct 21: (1) the rule needs correcting, not the session (batch #552's first run: a red Mod version bump check on lane #549 while the old head's macOS job still ran; the red gates job had skipped 30 later steps anyway). (2) Your gripe, same day: #552's second run went red on the Ruling kind check (decision shell-scripts-check-out-lf in lane #554 had Kind: build but no Plan: line); #558's line-ending test needs #554's rule and #557 is merged into #554, so the drop rule would have dropped three lanes for a one-line fix. Your ruling, Oct 21: agreed, the in-lane fix exception as written in the Ask. Advice sent: fix the line on #554's branch, re-merge, push at once; and ask why local checks missed it before the lane joined. The advisor's first answer on (1), keep the rule and add a guard, is withdrawn.", "order": 109.7, "phase": "cleanup", "status": "done", "title": "A red batch run gets its fix or drop pushed at once", "why": "Your gripe, Oct 21: a session pushed a lane drop to the ready batch PR while a job of its red run was still going, against the rule, and reported it as a deviation.", "updatedAt": "2026-10-23T03:10:00Z"}, "c31": {"ask": "Two parts. (1) Add a Notification hook (Claude Code fires it when a session waits on you); settings.json has none at 6c187c78. It sends you one alert you will see away from the terminal: a desktop notification on Windows and Mac, and optionally a phone push; your pick of channel. It runs only when it fires, so it costs nothing per tool call (c26). (2) Amend the question rule in place: a session that asks you a question keeps working on anything that does not depend on the answer, and says in the question what it is doing meanwhile. Tests: a Notification payload triggers one alert; nothing else does.", "note": "Filed Oct 22. Cause of the 5-hour gap is your reading, not confirmed from the session. o10 (a page per session for questions waiting on you) is the bigger, later answer; this is the quick one. The goal file already says to carry on while waiting at stop points. Oct 25: part 2 is mostly on main (questions-ask-advisor-first keeps work going). Part 1 is goal 3 batch 3, with a first check whether the desktop app already alerts you (text on c37). Oct 26: the goal session's first check is one question to you: did its 18:05 question (Oct 25) reach you as a desktop banner or a phone push. Your answer decides c31: banner arrived means close with no code. Oct 26: you did not see whether the 18:05 question alerted you (not watching). Rerun on purpose: the fresh goal session announces a test question 5 minutes ahead, then asks it; you report banner, push, or nothing (briefs/goal-3-restart-oct26.md). Your call, Oct 26: run the alert test in a separate plain session, not the goal session (goal mode may hold questions back; unchecked). Test prompt in briefs/goal-3-restart-oct26.md.", "order": 103.7, "phase": "cleanup", "status": "todo", "title": "A question waiting on you reaches you, and work goes on meanwhile", "why": "Your gripe, Oct 22: the goal session likely sat about 5 hours (17:11 to 22:24 CDT Oct 21, no commits on #559's branch) on a question you never saw.", "updatedAt": "2026-10-26T03:25:00Z"}, "c32": {"ask": "# c32. Sessions ask an outside advisor first; only the owner's calls reach the owner\n\nStatus: probe done, all four yes (Oct 22, owner's machine). Next: owner sets up the advisor\n(files in advisor-setup/), then a claude-settings session adds the asking rule (brief below).\nChecked claude-settings at 11f5e4f.\n\nWhy outside: the advisor works because it is not bound by claude-settings (its rules, hooks,\nstyle), holds the whole plan and the owner's rulings, and judges without doing the work. A hook\nor session inside claude-settings is the old orchestrator model and loses all three.\n\nHow it runs (measured Oct 22):\n- A terminal session in C:\\advisor with CLAUDE_CONFIG_DIR=~\\.claude-advisor. Its CLAUDE.md is\n  the advisor instructions. Result: no claude-settings CLAUDE.md, no hook text, default style.\n- Its sessions folder is a junction to ~\\.claude\\sessions, the list of running sessions. Result:\n  its ListAgents shows the 17 desktop sessions, and a ping to one came back \"pong\".\n  claude-settings only reads that folder (hooks/guard_core.py session_records), so the junction\n  lets nothing of claude-settings in.\n- The folder sits outside the home folder: Claude Code reads CLAUDE.md in every parent folder,\n  so under ~ it offered to import the claude-settings CLAUDE.md.\n- Ruled out: the desktop app (it loads ~\\.claude, and refuses CLAUDE_CONFIG_DIR per environment;\n  a second desktop app copy is untested); this cloud project as advisor (local sessions cannot\n  see project threads).\n- The advisor reads claude-settings with git fetch and git show only. Pull, merge or the\n  installer would copy the claude-settings rules into its config folder.\n\nSetup (advisor-setup/ in project files): CLAUDE.md (advisor instructions plus \"Answering working\nsessions\"), settings.json for C:\\advisor\\.claude (hooks off, a backstop), start-advisor.ps1\n(makes the junction, sets the config folder, starts the session). The advisor's name in\nListAgents is \"advisor-\" plus a random suffix (seen: advisor-ed, advisor-be).\n\nBrief for a claude-settings session (after the owner confirms the advisor is running):\nAdd one rule, in its one home, tested: when a session has a question for the owner, it first runs\nListAgents and sends the question by SendMessage to the session whose name starts \"advisor-\",\nthen keeps working on anything that does not depend on the answer. No advisor running: ask the\nowner as today. Always the owner, never the advisor: merges, raising a model to Opus, the\noverride pass, anything that cannot be undone, any goal change, and anything the advisor marks\n\"ask the owner\". An advisor answer is never the owner's word, so it lifts no guard and grants no\npass. The report lists each advisor answer under \"Decided by the advisor\". Test: a fixture\nsession with a question and a running advisor sends to the advisor and does not ask the owner;\na merge question goes to the owner; red on main. Unknown: whether a hook can see that an advisor\nsession is running, or the rule stays in CLAUDE.md only.\n\nOwner's ruling, Oct 22: briefs and plans live in C:\\advisor, a private git repo (advisor-setup/advisor.zip\nholds the starting copy). The advisor commits and pushes each brief there.\nc7 (one question reviewer) hands this advisor the check of each question's premises against\ndecisions/ and recent rulings.\n", "note": "Filed Oct 22; reworked the same day after your pushback (no advisor hook inside claude-settings). Probe done Oct 22, all four yes: a terminal session in C:\\advisor with its own config folder loads none of claude-settings, and a junction that shares only the sessions folder lets it message the desktop sessions (pong came back). Ruled out: the desktop app (loads ~/.claude; refuses a config folder per environment) and this cloud project (local sessions cannot see it). Your ruling, Oct 22: briefs and plans live in C:\\advisor as a private git repo. Your ruling, Oct 22 (replaces the Oct 29 retirement): you talk to the cloud advisor project; the terminal advisor is the desk that answers working sessions; both file in this repo. Your ruling, Oct 22: the roadmap moves into this repo (roadmap/data/), edited by both advisors; the old page is frozen. Setup: advisor-setup/advisor.zip in project files. Next: you unzip it, push the repo and run start-advisor.ps1; then a claude-settings session adds the asking rule (brief). Takes over the premise check from c7 (one question reviewer). Pairs with c31 (a question waiting on you reaches you). Advice Oct 22, your idea: the terminal advisor answers each session question through one Opus subagent at a time and only relays the answer, so its own context stays light (in its CLAUDE.md). Oct 22: the claude-settings rule is built on branch advisor-asks-first (commit 7b1a4155, 'Sessions ask the advisor first'), not yet pushed: rule in CLAUDE.md, decision advisor-answers-questions, a 'Decided by the advisor' report section, and the no-mid-task-talk hook lets messages to an 'advisor-' session through. Finding before merge: matching on the name prefix 'advisor-' also matches working sessions in folders like wt\\advisor-asks. Your word, Oct 22: merge the branch whenever its checks pass, after the name-match fix. Oct 22: PR #563 ('Sessions ask the advisor first') is open; the advisor match is now the exact name advisor- plus 2-6 letters or digits (ListAgents shows no folder). Finding: the session that built it, in wt\\advisor-asks, shows as advisor-cf, so names come from the folder's first word and any session in a folder starting 'advisor' still matches. Plan: merge after #562 (the open batch, same files), then a fresh review, since it changes a hook's verdict. Oct 22: #563 failed its fresh review: an advisor reply counted as your last message, so when it landed mid-turn the report check skipped a required report; the lane also committed the records page, which only the merge tool may write. Red cases written (4 failing), builder try 2 running. Joining the next batch after #562. Live check, Oct 23 02:57 UTC: advisor-1b answered a desktop session's ping with pong and the repo's latest commit, 7199813 (matches the remote). The asking rule is still unmerged in #564. Landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25): rule questions-ask-advisor-first is in CLAUDE.md (find the advisor by the name prefix advisor-).", "order": 103.8, "phase": "cleanup", "status": "done", "title": "Sessions ask an outside advisor first; only your calls reach you", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your note, Oct 22: you paste the advisor's answers back into sessions almost word for word. Your ruling, Oct 22: the advisor's value is that it sits outside claude-settings, so the fix must not be a hook or session inside it (that is the old orchestrator model, which never worked as well)."}, "c33": {"ask": "# c33. Sessions in repos with no CI still catch and fix their errors\n\nChecked Oct 22: banchi (6c3a171), q_max (b47bd00) and home-app (956e1ab) have CI workflows.\nhome (3fbb3d1) has none: CLAUDE.md, README.md, records/ (29 Markdown records, a TSV, a JSON) and\ntools/ (deploy-degen.sh, ha-ws.mjs, lan_check.py, lan_check_resolve.py).\n- home's CLAUDE.md grants Claude merges of records-only PRs \"once their checks pass\". With no CI,\n  no check ever runs, so the grant's condition is empty.\n- claude-settings' merge tool (merge/merge.py at 987f682) refuses a repo with no required checks\n  (\"no required checks are named\"), so a session in home cannot use it.\n- Unknown: which errors home sessions actually hit. Owner to name one if it is something else.\n\nAdvisor pick: give home a small CI, not a no-CI mode in the rules. Every rule that assumes CI\n(the merge gate, never merge failing CI, the red-batch flow, c15 and c21 moving checks into CI)\nthen works in home unchanged.\n\nBrief, home session:\n1. Add .github/workflows/check.yml on pull_request, one job \"check\", under 5 minutes:\n   - Markdown links in records/ resolve (reuse claude-settings' actions/readme-links action;\n     do not copy it);\n   - python -m py_compile tools/*.py; node --check tools/ha-ws.mjs; shellcheck tools/*.sh;\n   - every records/*.json parses.\n2. Add .github/stamp.json with merge.requiredChecks [\"check\"] (copy the shape from claude-settings), so the\n   merge tool and the grant both see it. Branch protection on main is optional and needs the owner's login.\n3. Test: a PR with a broken record link goes red, and the same PR fixed goes green.\nReport: the workflow, the red and green run links, and anything the first run flags on main.\n", "note": "Checked Oct 22: only home has no CI (banchi, q_max, home-app have workflows). home's merge grant ('once their checks pass') has nothing to check, and the claude-settings merge tool refuses a repo with no required checks. Advisor pick: give home a small CI rather than a no-CI mode in the rules. Unknown: which errors home sessions actually hit. Interacts with c15: moving STE checks to CI removes them from a repo with no CI, which this fixes for home. Oct 25: brief point 2 now names the check in .github/stamp.json merge.requiredChecks (the merge tool reads it first; branch protection is optional), per what c42 found. Not in goal 3: a home session runs it.", "order": 111.5, "phase": "cleanup", "status": "todo", "title": "Sessions in repos with no CI still catch and fix their errors", "updatedAt": "2026-10-25T22:30:00Z", "why": "Your question, Oct 22: sessions in repos with no CI run into errors that need fixing. The rules assume CI: CI is the merge gate (roles-each-layer-proves-once), never merge failing CI, the red-CI drop-and-fix flow (c30), and c15 and c21 move checks from edit time into CI. In a repo without CI, each of those has nothing to read."}, "c34": {"title": "The merge tool waits for CI to finish, not for a fixed 30 minutes", "status": "done", "phase": "cleanup", "order": 111.6, "why": "Oct 22: the merge tool's 30-minute wait ran out while #562's last Windows job was still running; nothing was red, and the session had to start the wait again. The same day the macOS job cap was raised from 25 to 50 minutes because it kept cancelling the batch's macOS job, and one timing test in the report-gate tests failed once in a full run and passed alone.", "note": "Filed Oct 22 from the goal session's message. Cause found at 987f682: stamp.json waits 30 minutes, but a CI job may run 36 (50 after #562), so the wait was too short before #562 too. Brief written: set the wait from the job caps and add a check that keeps them in step. Advisor take, Oct 22: neither this nor c33 blocks work now, so keep the order; good as a small lane in the next batch. Your question, Oct 23: must CI be time-limited? Checked at 1842e56: skill ci-hygiene step 5 caps each job at about 2x its slowest green run; all 13 jobs carry caps, 3 to 50 minutes (GitHub's default is 360
