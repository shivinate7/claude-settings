26 at 149f4bc: no screenshot script in claude-settings (bin/ has none); home-app has none either (f8a59b2). banchi still has scripts/screenshot.sh with a 1280x900 viewport (19abdfb); q_max has Playwright installed but no screenshot command (b47bd00). Ruling Oct 17: build the shared script here; adding it to each child repo and fixing banchi's 1280 viewport is Roll out. Your ruling Oct 20 (o11): one scripts/shoot in claude-settings, installed like the hooks; each repo keeps only a config (URL, sizes, themes, simulator). The script is the check; a browser is for exploring. Found Oct 26: cloud sessions ship Chromium and Playwright, and the desktop app's browser pane is allowed in settings.json, so the script needs no MCP (d8 folds in here). Commands: topic 'Reusable prompts and snippets'. Placed second in Design (triage, Oct 26): ruled and needs no answer from you.", "order": 202, "phase": "design", "status": "todo", "title": "A screenshot command in every repo", "updatedAt": "2026-10-26T06:00:00Z", "why": "scripts/shoot with the Playwright CLI and simctl, so agents can look at what they built. Fix banchi's 1280 viewport."}, "d7": {"note": "Added Oct 20: container queries inside shared components (a card adapts to its box, not the screen), so one component serves a sidebar and a main column with no copy (o11). Page layout stays on a few layout primitives and screen breakpoints. Swift uses its own tools (ViewThatFits, size classes). Limit: each container breakpoint is one more state to screenshot, so add one only where a component changes shape. Not started; no change since Oct 20. Your word, Oct 26: banchi's rules must not spread; the ratchet idea stays only if it earns its own case. Placed first in Design (triage, Oct 26): it needs no answer from you; d1, d2, d4, d5 and d9 are deferred.", "order": 201, "phase": "design", "status": "todo", "title": "Space with containers, not margins", "updatedAt": "2026-10-26T06:00:00Z", "why": "gap on parents, a few layout primitives, clamp() tokens for fluid spacing, and a per-file ratchet (seen in banchi; weighed on its own case, not copied). This is the direct fix for centering and gap problems."}, "d8": {"note": "Merged into d6 (triage, Oct 26): cloud sessions ship Chromium and Playwright, and Claude in Chrome and the app's browser pane cover local sessions; what was left is d6's shared screenshot script.", "order": 270, "phase": "design", "status": "done", "title": "Install a browser MCP for every session", "updatedAt": "2026-10-26T05:30:00Z", "why": "Playwright or Chrome DevTools MCP, set up globally, so any repo and any cloud session can render a page and look at it."}, "d9": {"ask": "Draft the visual-question rule: when a question counts as visual, what picture each option needs, and where the session publishes it.", "note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (its pictures come from d1).\nFrom a home-app question, Oct 17 (TV keyboard: do the arrows hide while typing). The prose rule goes with the reply-style rules; the pictures come from d1 (the designer). Plan on a linked artifact; whether AskUserQuestion's preview field shows a real picture is not checked. Found Oct 26: home-app already answers layout questions with HTML mockups in docs/design/ (f8a59b2), the pattern this rule would make standard. Not started.", "order": 216, "phase": "design", "status": "todo", "title": "Visual questions come with a picture of each option", "updatedAt": "2026-10-26T06:00:00Z", "why": "Agreed Oct 17. When a session asks how something should look, words like 'the keyboard has room' can't be judged. You answer these with 'I want a visual comparison' every time, so the session should bring one first: a mockup of each option side by side, published as an artifact (or a screenshot of each build), linked from the question."}, "l1": {"ask": "Lane 2 of the guard-rule brief; its full text is in the Ask of c10 (let the guard grow, then cull what never fired).", "note": "Checked at 5584d1b: lint/guard_log_report.py already prints per-rule deny, ask and noted counts, per day and per session, and guard.log is never pruned. The gap is rules that never fired: they have no line, so they never appear. The brief adds a list of every rule id with 0 counts and its first-fire date. Moved up from Later, Oct 21: the guard cull (c23) needs it. Merged in #562 (Oct 22): guard_log_report.py --all-rules lists rules that never fired.", "order": 119, "phase": "cleanup", "status": "done", "title": "Track guard refusals per session", "updatedAt": "2026-10-25T19:45:00Z", "why": "Shows whether the experience improves as the system shrinks."}, "l2": {"note": "Merged into d2 (triage, Oct 26): d2 already picks the model for visual judgment.", "order": 420, "phase": "later", "status": "done", "title": "Add a second design opinion", "updatedAt": "2026-10-26T05:30:00Z", "why": "A second-model critic, or Stitch or Figma Make for exploring directions before a build."}, "l3": {"note": "Not started; no change since Oct 17. Conditional on your wanting a second coding model inside Claude Code; no session has asked for one since. Your word, Oct 26: leave it deferred.", "order": 430, "phase": "later", "status": "todo", "title": "Try Grok through grok-plugin-cc", "updatedAt": "2026-10-26T05:05:00Z", "why": "Only if you still want a second coding model inside Claude Code."}, "l4": {"note": "Not started; no change since Oct 17. Needs evals first, and none exist for agent definitions in claude-settings (not checked in depth). Related: o12 (bring every skill up to date) does a one-time pass by hand; this step would make it standing.", "order": 440, "phase": "later", "status": "todo", "title": "An agent pruner, gated on evals", "updatedAt": "2026-10-26T05:30:00Z", "why": "Its job is cutting words and rules while tests and evals still pass. An agent definition changes only when an eval shows the new version is better."}, "o1": {"ask": "The cull is done. Write the organize-phase brief, starting with the rules folder and ui.md.", "note": "Merged into o2 (triage, Oct 26): o2's layout already puts .claude/rules/ in every repo.", "order": 125, "phase": "organize", "status": "done", "title": "Install a rules folder with a UI rule", "updatedAt": "2026-10-26T05:30:00Z", "why": "A path-scoped rule loads design guidance whenever an agent touches a .tsx, .css or .swift file."}, "o10": {"ask": "Design the session questions page: what the session publishes, how I answer, and how answers get back.", "note": "Build the 'Copy answers' path first; it works on Max and Enterprise. Add comments sent to Claude for sessions on your Enterprise account (needs in-organization sharing). A session on the API key cannot publish artifacts. Since Oct 26, c31 (a question waiting on you reaches you) and c28 (a step left to you comes as a one-click command) cover how a question reaches you; this step is the page it lands on. Overlaps o7 and o8; the triage thread holds that overlap. Triage, Oct 26: kept apart from o8. o8 is the lasting repo page; this is the live session page that c31's alert and c28's one-click command point to.", "order": 170, "phase": "organize", "status": "todo", "title": "A page per session for questions waiting on you", "updatedAt": "2026-10-26T05:30:00Z", "why": "Two levels: the repo roadmap is lasting, a session page is live. Each busy session publishes its plan (done, now, next) and its open questions, each with Goal, Problem, and options with gain and loss. You answer on the page instead of in the terminal."}, "o11": {"ask": "Draft the one-home rule: the builder.md wording, how a variant extends a shared piece in CSS, Swift and tests, and the compliance-check group that finds copies. Use the q_max map-skill drift as the worked example.", "note": "Already planned in parts: design tokens in one file generated into CSS and Swift (o2, r2, r3, topic t08); spacing from a few layout primitives instead of per-screen margins (d7, t09); one DESIGN.md per repo (r4); the roadmap page reads each item from its one home and stores no copy (o8). Live proof of the problem: q_max copied the map skill and it drifted, failing PR 969 (o6), and q_max holds a verbatim copy of a claude-settings test. Missing: the general rule for agents; shared UI components with variants (tokens are values, not components); shared test steps that a test can extend; and a check that finds copies. Proposed homes: a builder rule (search for the shared piece first; extend it with a variant; a copy needs a stated reason); a compliance-check group that reports duplicate code and vendored copies (o4); shared skills pinned, never vendored. Lands with the layout (o2), since o2 decides where each shared thing lives. Finding, Oct 26: three design skills are vendored into ios-adblock, joyous and degen (.claude/skills/impeccable, frontend-design, web-design-guidelines). The three impeccable copies already differ from each other (SOURCE.txt, reference/document.md), and claude-settings has its own skills/impeccable with a sync workflow (impeccable-sync.yml). Same failure as the q_max map skill; fold into this step's copy check.", "order": 115, "phase": "organize", "status": "todo", "title": "One home for each shared thing; exceptions build on it, never copy it", "updatedAt": "2026-10-26T02:30:00Z", "why": "Your rule, Oct 20: never duplicate and rebuild. Anything used in more than one place (a button size, a panel gap, steps 1 to 6 of a test, a skill) has one home, and everything else points at it. An exception (a different button, a twist on step 5a) calls the shared piece and changes only what differs, so a fix to the shared piece reaches every use and nothing drifts. The result looks the same; it is just more resilient."}, "o12": {"ask": "One pass over the six skills in claude-settings (checked at 73ed71a: ci-hygiene, compliance-check, design-review, fresh-prose, impeccable, plain-english-map). Per skill: does it still match the rules and decisions after the cleanup phase, is it still used, and does it start processes or load files it never uses (c26, watching costs less than what it watches). Fix, merge or cull each. impeccable is vendored: update it to the newest upstream version that passes its checks, per verification-newest-that-passes. compliance-check is covered by o4 (rework compliance-check); do it there, not twice.", "note": "Filed Oct 21 from your question. What 'update' means is my reading (match current rules, and refresh the vendored one); say if you meant something else. Runs after the cleanup phase, since that phase is still changing the rules the skills follow.", "order": 135, "phase": "organize", "status": "todo", "title": "Bring every skill up to date with the current rules", "why": "Your note, Oct 21: the plan should cover updating all the skills eventually. Before this, no step did; only compliance-check had one (o4) and o11 covered shared skills being pinned, not copied.", "updatedAt": "2026-10-26T04:45:00Z"}, "o13": {"title": "One name per thing: a glossary in every repo", "phase": "organize", "status": "todo", "order": 116, "why": "Your idea, Oct 26: AI sessions need settled terms. A photos folder beside a captures folder leads to confusion, a second copy being built, and misread asks.", "note": "Checked Oct 26: no glossary in claude-settings (f463787), banchi (9683902) or home-app (65315da); q_max and home not checked. Only related rule: output-write-in-ste ('one term per meaning'), which covers prose, not names of folders, files, types or concepts. This is the naming side of o11 (one home per shared thing). Your word, Oct 26: agreed on GLOSSARY.md; claude-settings holds only terms that matter in every repo, each repo its own domain terms (a photos/captures clash is a repo row). Shape, advisor pick: (a) claude-settings GLOSSARY.md, pointed at from CLAUDE.md, not inlined: the workflow nouns (lane, batch, integration PR, worktree, handoff, step, ruling, decision, debt, guard, gate, owner, override pass and the like); (b) each repo's GLOSSARY.md, which never redefines a global term; (c) Plan, builder and reviewer check new names against both, and a small glossary skill seeds a repo's file; (d) a cheap CI check that each row's path exists and no new path uses a 'not:' name; (e) o2 puts the file in the shared layout. Third-party skills, advisor pick Oct 26: borrow from mattpocock/skills ubiquitous-language, credited, rather than install it. Main risk: a glossary written once goes stale; the CI check is the answer.", "ask": "", "updatedAt": "2026-10-26T05:00:00Z"}, "o2": {"ask": "One layout for every repo, claude-settings part. Goal: one file in claude-settings names where each kind of file lives in every repo; each shared tool reads its paths from that file; claude-settings moves its own records into the layout. Child repos move later, each in its own session. Start after the running cleanup batch merges.\n\nToday, checked at 987f682: records sit at the root: decisions/ (106), debts/ (51), plans/ (1). ux/ (5) holds the shared design ideas. Four tools copy the record path and disagree: lint/check_record_slugs.py DIRS (\"decisions/\", \"debts/\"; hooks/guard.py reads it), lint/hook_catalog.py RECORD_FOLDERS, lint/check_ruling_kind.py DIR, and lint/ste_lint.py decisions_dir, which defaults to \"docs/decisions\". actions/stamp/examples use both forms. banchi and q_max keep records under docs/.\n\nThe layout. Core, every repo: CLAUDE.md; AGENTS.md as a symlink to it; .claude/rules/; docs/decisions/; docs/debts/ with README.md and notes.md; docs/plans/ (delete a plan when its work ships); docs/specs/ (how a shipped feature works now); docs/records.md (generated). Repos with screens add: docs/design/ (DESIGN.md, mockups/, reference/); tokens/tokens.json; shots/ (gitignored); the shoot config that d6 names. No history folders (FORMER/, RETIRED/, archive/): git keeps history. A repo declares its own extra kinds (example: home's records/) in one extras file in its own tree.\n\nLane 1, one layout file and its readers. Add one machine-readable layout file in claude-settings (suggested: lint/layout.json) holding the core and screen kinds above. Make check_record_slugs, check_ruling_kind, hook_catalog, ste_lint and the stamp examples take record paths from it, and merge a repo's extras file when present. The guard keeps its own literal if a runtime file read is unsafe there, as CONFIG_FROZEN_DIRS does; then add a check that the literal equals the layout file, the way lint/check_landed_dirs.py checks landed-dirs.txt. No reader holds a record path of its own after this lane.\n\nLane 2, move claude-settings. git mv decisions/ to docs/decisions/, debts/ to docs/debts/, plans/ to docs/plans/, ux/ to docs/design/. Keep every file name. Fix each path cite: a prose cite becomes a slug cite (git-cite-by-id); a code comment gets the new path. Regenerate docs/records.md. Confirm landed-dirs.txt and both installers need no change, or change them.\n\nLane 3, the record. Write decision one-layout-every-repo: the three placement questions (current truth or history? dies when the work ships? does every repo have one?), the layout, and Home: the layout file. Owner ruling lines: Oct 22, same folders in every repo, not a per-repo declaration; Oct 17, claude-settings first, each child repo in Roll out; Oct 20, no copied DESIGN.md template, each repo's DESIGN.md points at the shared ideas.\n\nRulings that bind: one-shared-record-stamp (no record is renumbered or renamed; a move keeps the name); building-allow-list-is-the-constant; git-cite-by-id; building-guard-needs-incident (incident: ste_lint's default path does not match this repo's records folder).\n\nTests, red on main and green on the fix: each reader finds the records of a fixture repo laid out under docs/; a fixture with an extras file adds its extra kind; a mutant that puts a literal \"decisions/\" back in one reader is killed by the constant check. Lane 1 changes a guard's input, so it gets the review rounds of roles-review-cap-three.\n\nOverlaps: c21 (standard lint in CI) waits for this lane before any repo-wide format. c19's later lanes (Stop dispatcher, cached git reads) wait too. Rebase on any open PR that touches lint/ or hooks/guard.py.\n\nReport, 25 lines or fewer: the layout file's path and kinds, each reader changed, files moved, path cites fixed, test names with red and green, and any path you could not move.", "note": "Plan: plans/o2-one-layout-plan.md; brief: briefs/o2-one-layout.md (text in Ask), drafted Oct 22 at 987f682. Rechecked Oct 26 at 149f4bc: records still at the root (decisions/, debts/, plans/, ux/), so the brief's 'today' still holds. Your rulings: claude-settings first, each child repo in Roll out (Oct 17); no copied DESIGN.md template, each repo's DESIGN.md points at the shared ideas (Oct 20); same folders in every repo, not a per-repo declaration (Oct 22). Open: specs as their own kind (advisor pick, stands unless you say otherwise). Two leftovers of done steps wait for it: a repo-wide ruff format (c21) and, only if still needed, a Stop dispatcher and cached git reads (c19). Not started. Merged in from o1 (triage, Oct 26): .claude/rules/ ships with ui.md as its first rule.", "order": 110, "phase": "organize", "status": "todo", "title": "One layout for every repo", "updatedAt": "2026-10-26T05:30:00Z", "why": "One place for each kind of file in every repo, so any agent finds the right file without being told: decisions, debts, plans, specs and design under docs/, tokens in tokens/tokens.json, and one layout file in claude-settings that every shared tool reads."}, "o3": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (banchi work; you settle the plan first).\nChecked Oct 26: banchi's CLAUDE.md is 398 lines (19abdfb) and q_max's 182 (b47bd00, no AGENTS.md). claude-settings is 106 (149f4bc) and home-app 30 (f8a59b2). banchi is the one repo over 200 lines, so the work is there. In Roll out, aimed at banchi (triage, Oct 26).", "order": 345, "phase": "rollout", "status": "todo", "title": "Shrink each CLAUDE.md toward 200 lines", "updatedAt": "2026-10-26T06:00:00Z", "why": "Long files cost context and lower how well rules are followed. Keep AGENTS.md as a symlink."}, "o4": {"ask": "Draft the compliance-check rework with layout and design groups.", "note": "The layout group reads o2's layout file plus each repo's extras file, and reports any folder that is neither (Oct 22). o12 leaves compliance-check's update to this step. r1 (run it on each child repo) waits for this. Waits for o2. Leftovers homed here by triage, Oct 26 (move them if wrong): a lint for a guessed lane cap in briefs (rule parallelism-no-guessed-lane-cap, from c37), and the STE lint's gap on UI files (from c15).", "order": 130, "phase": "organize", "status": "todo", "title": "Rework compliance-check", "updatedAt": "2026-10-26T05:30:00Z", "why": "Add layout and design groups, so it can see folder shape and screen readiness, not only CLAUDE.md rules."}, "o5b": {"ask": "Which of my hooks exist only to make sessions remember things, and which could filing-at-once replace?", "note": "Builds on rules output-answer-has-a-home and building-never-drop-item-silently. Since Oct 26 this project files every item the turn it is said (project instructions, step c55), so the habit now lives in the advisor threads; what is left is the Ask: which hooks exist only to make sessions remember, and which filing at once could retire. Rescoped to that hook audit (triage, Oct 26).", "order": 140, "phase": "organize", "status": "todo", "title": "Which hooks exist only to make sessions remember, and can filing at once retire them", "updatedAt": "2026-10-26T05:30:00Z", "why": "Guards that make a session remember are a backstop. What actually works: anything that matters goes to a lasting home (a repo file, a roadmap page) in the same turn it's said. A session's job is filing, not remembering, so a compaction or a lost session costs nothing. This includes fb: items: tasks and ideas land in the repo's todo, not only the handoff, and each closed item is checked against its home."}, "o6": {"note": "Done Oct 20: #525 (the map skill moves into claude-settings) carried the map work; the skill is skills/plain-english-map (decision map-skill-lives-here); #457 closed unmerged. Branch batch-map is gone (checked Oct 26). Left for Roll out: q_max still vendors its own copy in .claude/skills/plain-english-map, and it differs from claude-settings' copy in SKILL.md and four script files (b47bd00 against 149f4bc). Once q_max uses the shared skill, the skill's tests move here.", "order": 160, "phase": "organize", "status": "done", "title": "Merge the map PR #457", "updatedAt": "2026-10-26T05:45:00Z", "why": "After the cull. Fix its failing gates check, and consider generated structure with advisory checks."}, "o7": {"ask": "Sketch how the map, /board and compliance-check could become one repo health view.", "note": "Merged into o8 (triage, Oct 26): one repo view: the map, the session-board mod and compliance-check scores become panels of the repo's roadmap page.", "order": 160, "phase": "organize", "status": "done", "title": "Combine map, board and compliance-check into one repo health view", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your idea: the map shows structure, the board shows who is working on what, compliance-check scores the rules. One page could show a repo's whole health."}, "o8": {"ask": "Design the /roadmap skill: what it reads in a repo, how the page is laid out, and how merges update a step's status.", "note": "Shows, per repo: every debt and note, your feedback items and where each went, the repo's plans, each session's plan, and open PRs and branches. The page reads each item from its one home, stores no copy, shows when it last read, and marks what it could not read as unknown. Needs feedback items homed in the repo first. Session pages (live, o10) sit under the repo page (lasting). Your idea, Oct 22: a live view with pixel-art workers showing each one's state; it draws from records sessions already write, read when the page opens, with no new watcher (c26). Where each worker's live state comes from is still open. Your rule, Oct 21: the page is a current record, not a log; this roadmap's own upkeep now runs through c55 (the triage thread and build.py's upkeep list), which a repo page can copy. Your pick, Oct 22: B, logbook (claude.ai/artifact/9H4NgQdoNNhU939mXojVv9), with your UI changes started; A and C unused. Each themes per repo from one block of tokens. Merged in from o7 (triage, Oct 26): the page also shows the repo's map, the session-board mod's progress and compliance-check scores, as one health view.", "order": 150, "phase": "organize", "status": "todo", "title": "Give every repo a living roadmap page", "updatedAt": "2026-10-26T05:30:00Z", "why": "The process behind this page, made repeatable: audit the repo, turn the findings into phased steps with a plain why and an ask for each, publish one page per repo, and update it in place as lanes land. A /roadmap skill in claude-settings would build it from docs/plans and docs/debts, and the merge step would tick off the steps it completes. It pairs with the health view: health shows how the repo is, the roadmap shows what's next."}, "r1": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (other repos; you settle the plan first).\nNot started. Waits for o4 (rework compliance-check). Cull first in each repo. Checked Oct 26 at q_max b47bd00 (last commit Oct 20): 819 debts and 570 decisions under docs/, up from 759 and 560 on Oct 17.", "order": 310, "phase": "rollout", "status": "todo", "title": "Run compliance-check on each child repo", "updatedAt": "2026-10-26T06:00:00Z", "why": "Cull first in each one. q_max has 759 debts and 560 decisions."}, "r2": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (q_max work; you settle the plan first).\nChecked Oct 26 at q_max b47bd00: still three layers. src/index.css defines 156 --aq-* and 233 --f2-* custom properties, with Tailwind 4 (@tailwindcss/vite) on top and no tailwind.config file; Chat.tsx and Workbench.tsx define --aq-* values of their own. Per your Oct 20 ruling (o11), q_max's tokens.json is the one home for its values. Not started.", "order": 320, "phase": "rollout", "status": "todo", "title": "q_max: merge its three token layers", "updatedAt": "2026-10-26T06:00:00Z", "why": "--aq-*, --f2-* and Tailwind drift apart. One layer stops it."}, "r3": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (home-app work; you settle the plan first).\nYour ruling, Oct 20 (o11): home-app's tokens.json is the one home for its values, and both Swift and web are generated from it; claude-settings supplies ideas, not values. Checked Oct 26 at home-app f8a59b2: still true that nothing is generated. No tokens.json; web/style.css defines colors only, in a light and a dark set; Swift has no token file.", "order": 330, "phase": "rollout", "status": "todo", "title": "home-app: real tokens on both surfaces", "updatedAt": "2026-10-26T06:00:00Z", "why": "Swift has no token layer, and style.css tokens cover color only. Generate both from one tokens.json."}, "r4": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (q_max work; you settle the plan first).\nChecked Oct 26 at q_max b47bd00: all six homes still hold design truth. design/ (mockups, w15-layers), specs/ (design-audit, engine-design, grouping-design and more), docs/design.md (1,534 lines), docs/rules/ (ui-primitives among 14 files), src/styles.md (189 lines) and brand/ (four logo files). This is q_max's part of o2 (one layout, one DESIGN.md per repo). Not started.", "order": 340, "phase": "rollout", "status": "todo", "title": "q_max: merge its six design homes into one DESIGN.md", "updatedAt": "2026-10-26T06:00:00Z", "why": "design/, specs/, docs/design.md, docs/rules/, src/styles.md and brand/ all hold design truth today. One home is how its agents find the look."}}, "topics": {"t01": {"order": 10, "points": ["Claude makes visuals by writing code without seeing the result. SVG maps closely to the picture because every element has coordinates; with HTML and CSS the layout comes out of flexbox, grid, the cascade and font metrics, which Claude has to predict. That's where spacing goes off and things overflow.", "What helps any session: a reference screenshot or a design system, a render-screenshot-fix loop, and a specific look ('dense, editorial, high contrast') rather than just the content.", "A great one-shot artifact is Opus on a blank canvas. In your repos, screens are built by Sonnet by rule, checked for compliance not feel, with polish tools off and the screenshot loop optional.", "Plan runs on Opus but writes steps, files, risks and checks in under 25 lines. It can't write files and never loads frontend-design or ux/, so every visual decision falls to the Sonnet builder.", "Design-review's blind reviewers run on Haiku in round 1 (agents/reviewer.md). Rounds escalate only on a FAIL, so a flat screen that passes is never looked at again.", "frontend-design loads only for a new screen or a repo with no design yet. impeccable's build commands (polish, layout, animate, bolder, delight) are refused by the guard rule impeccable-review-only.", "No browser MCP is configured anywhere, and claude-settings does not install Playwright (banchi and q_max bring their own). In solo mode, styling-only edits merge on passing checks alone.", "Word pressure: STE020 refuses button or label text over 4 words, and the fewest-words decision says it counts most in front-end work. There is no house icon set to fall back on.", "Across repos, screens that started from a mockup came out polished (banchi's #/gallery, q_max's home page, home-app's SpeakerSheet). The rest drift.", "How design-review is built: reviewer A checks the pinned Vercel web-interface rules plus your house checklist; reviewer B runs impeccable's audit and critique. Both are blind to the repo's design records; the orchestrator compares afterwards, and any clash goes to you. Nothing in it builds, and both reviewers inherit the reviewer agent's Haiku model."], "summary": "The core diagnosis behind the Design phase.", "title": "Why UI quality swings"}, "t02": {"order": 20, "points": ["banchi (strongest): tokens.css used about 7,100 times against 10 hex literals; DESIGN.md says the screenshot loop is mandatory; motion and iconography specs; 88 Playwright design checks. Gaps: nothing forces the loop; make screenshot renders at 1280 while CLAUDE.md asks for 1440 and 820; CLAUDE.md is 34.7KB.", "q_max: rigorous token rules and about 40 harness checks, but no taste guidance and no design skill. Three token layers (--aq-*, --f2-*, Tailwind). Browser checks run only on manual dispatch, nightly off. Several components are over half comments. Your own review: only the home page looks amazing, other pages look like plain text workpads.", "home-app: SpeakerSheet and the widgets, built from mockups in docs/design/, are polished. Views.swift is 1,927 lines with about 95 literal spacing values, many off the 4px grid. The web has 12 distinct radii, colour-only tokens, hand-synced 129/136/204px offsets, and 36 hand-drawn SVG icons mixed with Unicode glyphs. No Swift token layer. No screenshot tooling, and the simulator is rationed.", "home: ops records and four scripts. No UI.", "claude-settings: ux/ has behaviour and copy rules but thin visual values (4px gaps, 8px radius, role colours). No motion default and no icon set."], "summary": "banchi, q_max, home-app, home, claude-settings.", "title": "What each repo audit found"}, "t03": {"order": 30, "points": ["Frontend Code Arena, blind human votes, Sep 22, 2026: GPT-6 Astra first, Claude Fable 5.1 second, Grok 4.7 tenth.", "There is no single best model: one tester across four briefs split the wins between GPT-5.6 Sol and Claude Opus 5. The tooling around a model (rendering the page, a design system, references) matters about as much.", "Antigravity's strength is a built-in browser that renders and checks the UI. Reviews of its design output are mixed.", "Grok: Grok Build is a terminal coding agent (1.0 on Aug 7, 2026). No official desktop app; community GUIs exist. Grokbot is xAI's general agent app, not a coding tool. grok-plugin-cc runs Grok inside Claude Code for reviews and hand-offs.", "Tools by output: Figma Make and Google Stitch for editable mockups; UX Pilot for screens plus UX critique; v0 or Subframe for React; Relume and Uizard for wireframes; Midjourney or Firefly for images only.", "A good split: explore visual directions in one of those, then build and stress-test flows, states and copy with Claude."], "sources": [{"label": "Morph coding rankings", "url": "https://www.morphllm.com/best-ai-model-for-coding"}, {"label": "Thomas Wiegold on frontend LLMs", "url": "https://thomas-wiegold.com/blog/best-llm-frontend-design/"}, {"label": "Frontman tool roundup", "url": "https://frontman.sh/blog/best-ai-tools-ui-ux-designers-2026/"}, {"label": "Grok Build", "url": "https://en.wikipedia.org/wiki/Grok_Build"}], "summary": "Rankings, Antigravity, Grok, and which tool fits which output.", "title": "Models and tools for UI work"}, "t04": {"order": 40, "points": ["Add a designer (Opus, writes HTML mockups, write scope limited to design mockups) and a design-reviewer (Opus, since cost is no limit and visual judgment is where the strongest model pays off; it opens every screenshot). Skip a ux-builder: building to a mockup is ordinary builder work.", "Route with one test: does this lane touch a screen? If yes, the designer runs before the build and design-review after it. Nothing else changes.", "Keep builders, reviewers and test authors separate. A builder can't fairly review itself, and builders-cannot-edit-tests stops weakened tests. Solo mode is the right valve for small changes.", "Haiku at xhigh is fine for round-1 code review, where tests and CI catch what it misses. Not for screens: nothing downstream checks taste. To prove it, rerun a few past design-review screenshots through Haiku and Sonnet and compare.", "Don't add more agent kinds now; process load is the problem. Collections like wshobson/agents and VoltAgent are reading material for prompts, not installs. The roundup found no design reviewer agents in them.", "An agent that improves agents tends to add rules. Make it a pruner, and change an agent only when an eval shows the new version is better (skill-creator benchmarks, claude plugin eval).", "Token cost: frontend-design is about 1,500 words and impeccable's polish, layout and animate references about 2,500. Screenshots cost more (pages x sizes x themes x reviewers), so run design-review only on screen diffs, at the sizes each repo ships.", "With cost no limit, the Sonnet ceiling still makes sense for speed on routine work. Spend Opus where judgment is the point: planning, designing, and judging screens."], "summary": "Which agents to add, which not, and why.", "title": "Roles and agents"}, "t05": {"order": 50, "points": ["You run in bypass mode, so guards and deny rules are your only safety layer. Deny rules still block in every mode, bypass included.", "Deny rules match command text, so they miss /bin/rm or bash -c. Read and Edit deny rules also cover cat, head, tail, sed, tee and > or < redirects.", "The Bash sandbox is enforced by the OS however a command is spelled: writes only to the working directory, temp and added directories; network only to allowed hosts. Set allowUnsandboxedCommands to false, or a failed command retries unsandboxed with no prompt in bypass mode. macOS, Linux and WSL2 only: on native Windows, Claude Code runs commands unsandboxed.", "Sandbox plus deny rules can take: destructive-delete, the outside-the-repo part of rm-var-unguarded, env-file and frozen-path. The guard keeps the state- and content-based rules: merge-checks, records-page, draft-pr, cite-by-id, shared-tree, worktree-home, ask-alone, subagent-model-cap, impeccable-review-only and most git rules. Expect 4 or 5 of 22 rule families to move.", "Trust a guard by its test, not its code. A rule's prose leaves only when its row names a test, the test's case name states the ruling, and a mutant that breaks the guard is killed. Five of six guard rows named no test on Oct 17; c6 (proving tests for five guard rules) added them.", "Freeze new guard work except after a real incident, as your building-guard-needs-incident rule says.", "Experience counts too: you've seen fewer false stops this week. Track refusals and asks per session in guard.log to show it.", "Windows matters (found Oct 17): your guard carries heavy PowerShell support, so you run native Windows sessions, and the sandbox does nothing there. Guard code can retire only for sessions that run inside the sandbox. To retire it everywhere, your Windows sessions would have to move into WSL2. Until then, the sandbox adds protection on Mac but shrinks nothing.", "Also set failIfUnavailable, so a session refuses to run commands at all when the sandbox can't start, instead of quietly running them unsandboxed.", "How much of claude-settings is about Windows (measured Oct 17, main 5921750): 8 PowerShell or .cmd files, 3,248 lines; 1,206 lines in hook Python mention PowerShell, WSL, Windows, schtasks or the registry; 61 of 126 decision files and 48 of 364 debt files mention Windows, WSL or PowerShell. Mentions, not all Windows-only, but a large share of the system exists to make two platforms behave.", "Desktop app WSL sessions (docs): the Code tab can run a session inside WSL 2, with git, worktrees, parallel sessions and PR status working. Not yet available there: connectors and plugins, the integrated terminal, session forking, the file browser pane and @ file suggestions. Your mods (board, decision-watch, plain-diff and others) are plugins, so they wouldn't load in a desktop WSL session. Claude Code run from a terminal inside WSL is unaffected. On an organization-managed device, WSL sessions may be blocked by the admin.", "Decided Oct 17: Windows stays native. Losing your plugins in desktop WSL sessions is a dealbreaker. So the sandbox protects Mac sessions only, and the delete, env-file and frozen-path guard code stays, because native Windows has no sandbox. Revisit if desktop WSL sessions start loading plugins.", "Security scan findings on guards (Oct 22): the scanner counts a prompt-injected agent as an attacker, but your Oct 17 ruling (guards stop Claude's mistakes, not an attacker) puts evasion-only forms out of scope. So triage each one by the ruling's test: could Claude write it by mistake? First case, the arithmetic-shift heredoc misread (find_012G91jG65TkhbTbVde7dpKX), confirmed on main 987f682: a line is hidden only when a later line is exactly the shifted variable's name, which honest scripts never write; an unclosed one keeps every line in view. Advisor take: not a hole, no fix. A finding outside the guard, like the ste-lint import path (c35), is judged on its own."], "sources": [{"label": "Permission modes", "url": "https://code.claude.com/docs/en/permission-modes.md"}, {"label": "Permission rules", "url": "https://code.claude.com/docs/en/permissions.md"}, {"label": "Sandboxing", "url": "https://code.claude.com/docs/en/sandboxing.md"}, {"label": "Desktop in WSL", "url": "https://code.claude.com/docs/en/desktop-wsl.md"}], "summary": "What the built-ins can take over, and how to trust a guard.", "title": "Guards, sandbox and bypass mode"}, "t06": {"order": 60, "points": ["Oct 9 to Oct 17: hook Python 20,173 to 47,196 lines; decision files 64 to 134 (corrected from 133: measured 134 at 455bb21, and decisions/ has no README); debt files about 288 (Oct 15) to 364; CLAUDE.md 1,915 to 2,290 words. Counts exclude each folder's README.", "Of 1,037 non-merge commits since Oct 13, 978 touched guards, lint, merge tooling, debts or decisions. 36 touched ux/, skills or agents.", "Why it grows: every finding becomes a debt, and a guard change takes up to three review rounds plus the net-value test, so a cleanup lane breeds new work.", "Rulings sent: deletion fast path; notes tier for unlikely gaps; no history in the tree (git keeps it, keep a one-line reason); prose leaves only with proof; no file moves during the cull; time box to Monday Oct 19.", "Stop rule chosen: debts and decisions each cut under 5% for two batches running. It was never met; the cull closed Oct 19 on its time box. Hook lines just need to go down. Since Windows stays native (Oct 17), the sandbox won't bring the big hook cut; it has to come from culling guard code directly.", "Order, decided Oct 17: finish claude-settings end to end (clean up, organize, design) before touching any child repo. Any step's child-repo part moves to Roll out.", "In-flight lanes, decided Oct 17: you let work already in flight land before the rulings took effect. So batch #499 mixes in-flight lanes with cull lanes; don't hold its hook growth or flat debts against the cull.", "How to measure, so numbers match: decisions = files in decisions/; debts = files in debts/ minus README.md and notes.md; hook lines = lines of every .py under hooks/, tests included; words = wc -w of CLAUDE.md. Done on a commit with git ls-tree and git show."], "summary": "The numbers, the cause, and the rulings you sent.", "title": "The cull, and why the system kept growing"}, "t07": {"order": 70, "points": ["The sweep never fetches. Its pushed check passes every remote head to git rev-list. If one head isn't in the local clone, git fails with 'bad object', and the sweep keeps every worktree in that repo as unreadable-subject. This was tested.", "GitHub merge commits and cloud-session pushes mean a clone almost always lacks some remote head until a session happens to fetch.", "Remote heads, Oct 17: claude-settings 244, banchi 313, q_max 1,017, home-app 54. claude-settings is down to 28 (c4, delete merged remote branches); the child repos wait for Roll out.", "Fixed in claude-settings: the sweep fetches with --prune first and drops heads still missing (c3, fix the janitor sweep), and each merge now cuts the lane branches its batch absorbed (c4)."], "summary": "The janitor sweep's root cause, and the fix.", "title": "Why worktrees pile up"}, "t08": {"order": 80, "points": ["The test: can every agent find the right file in any repo without being told where it is?", "Three questions decide where a file goes: is it current truth or history? does it die when the work ships? does every repo have one?", "Layout (o2, drafted Oct 22): CLAUDE.md under 200 lines with AGENTS.md as a symlink; .claude/rules/; docs/decisions, docs/debts with notes.md, docs/plans (deleted on ship), docs/specs (how a shipped feature works), docs/records.md; with screens, docs/design (DESIGN.md, mockups, reference), tokens/tokens.json, shots/ gitignored. A repo declares its own extra folders; one layout file in claude-settings is what every tool reads.", "Path-scoped rules (paths: frontmatter in .claude/rules/) load only when Claude touches matching files; ~/.claude/rules/ applies in every project. Your installer doesn't land a rules folder yet.", "Tokens in the W3C Design Tokens format (stable since 2025.10), generated into CSS and Swift with Style Dictionary or Terrazzo.", "No history in the tree: delete superseded decisions, since git keeps them.", "Don't restructure code into apps/ and packages/: one app with a backend gains little from a monorepo layout.", "q_max keeps design truth in six places (design/, specs/, docs/design.md, docs/rules/, src/styles.md, brand/). Merging them into docs/design/DESIGN.md is a copy-delete, which fits the cull's own rule.", "Folders sort volume but don't reduce it: q_max's 759 debts and 560 decisions stay unreadable until they're culled.", "One home, then variants (o11, topic t18): claude-settings holds the shared ideas and shared tools (scripts/shoot, skills); each repo holds its own concrete design (tokens, components) in one home and points at the ideas instead of restating them."], "sources": [{"label": "CLAUDE.md and rules", "url": "https://code.claude.com/docs/en/memory.md"}, {"label": "W3C Design Tokens stable", "url": "https://www.w3.org/community/design-tokens/2025/10/28/design-tokens-specification-reaches-first-stable-version/"}, {"label": "Monorepo pitfalls", "url": "https://www.pkgpulse.com/guides/javascript-monorepos-2026-best-practices-pitfalls"}, {"label": "Measuring AGENTS.md", "url": "https://aaif.io/blog/measuring-agents-md-what-five-runs-show-that-one-doesn-t"}], "summary": "One layout for every repo, checked against current practice.", "title": "Folder layout and conventions"}, "t09": {"order": 90, "points": ["Spacing comes from relationships, not numbers. banchi's table: icon to text 6, control to control 8, row to row 12, block to block 16, section to section 24.", "Put spacing on containers: gap on a parent (a Stack, Row or Grid; VStack(spacing:) in Swift), not margins on each child. Gaps are then uniform by construction.", "Compose screens from a few layout primitives (Stack, Cluster, Sidebar, Grid), the 'Every Layout' approach. Use clamp() tokens for spacing that grows smoothly from phone to desktop.", "Pay the debt with banchi's per-file ratchet (token-literal-check), so the count of stray values can only fall. Redesign one screen at a time, mockup first.", "Motion has four jobs only: answer a press, show where a thing came from or went, say a state is live, mark a rare result. Name roles with tokens; each repo keeps its own durations.", "Icons: words for anything costly, irreversible or factual; an icon only when the verb is in the house vocabulary. This also answers the 4-word label limit."], "summary": "How to get uniform gaps without pinning numbers.", "title": "Spacing, motion and icons"}, "t10": {"order": 100, "points": ["The rules already exist (style-plain-words, style-option-says-effect), and a Sonnet judge checks each question for a missing better option and for gain and loss.", "The problem is a conflict: plain words must add no length, and short and plain are 'one goal', so the only way to be both is to compress.", "Fix: plain wins over short; each option gets one plain line on how it works; options that can't be told apart mean fewer options, or a decision made and stated.", "Oct 17, from a home-app question: one question bundled two decisions (paste vs key-by-key, and whether the arrows hide), so the only way to answer each was 'Other'. Rule to add: one decision per question.", "Same question: whether the arrows hide is a visual choice, and words like 'they crowd the screen' or 'the keyboard has room' can't be judged without seeing it. You answered 'I want a visual comparison', and say you answer visual questions that way every time. Rule to add: a question about how something looks says so, and shows a picture of each option (step 'Visual questions come with a picture of each option')."], "summary": "Why explanations still come out too engineered.", "title": "Reply style and questions"}, "t11": {"order": 110, "points": ["fb: fits how you work, since you post in the right repo's session. Two gaps: a task can live only in the handoff, outside git, and [closed] is self-attested. Fix: home tasks in the repo, and check each closed id against its home.", "/board was a proof of concept built from three plain elements (Box, Text, Button). The desktop app also offers Svg, Markdown and a custom Client region. Add done, now and next per session, read from each handoff.", "Map: merged Oct 20 in #525 (the map skill moves here), which replaced #455, #456 and #457. Every new file needs a map line; generating the structure from code and making the sync checks advisory are still worth weighing.", "Health view: the map (structure), /board (live work), compliance-check (rules), plus the size numbers and the sweep's keep reasons.", "Roadmap per repo: debts, feedback items, repo plans, session plans, PRs. Read each from its one home, store no copy, show freshness, and mark anything unreadable as unknown. Session-only items need homes in git first; live session state stays in /board."], "summary": "Your own tools, and how they fit together.", "title": "fb:, map, board, health view and roadmap"}, "t12": {"order": 120, "points": ["Project instructions apply to every chat in a project, and chat search inside a project covers only that project's chats. The advisor guide lives there.", "GitHub in project knowledge is a snapshot of chosen files, refreshed only when you press Sync, and it uses up context. Cloning the live repo in chat, as we did, is fresher, so the project doesn't sync repos.", "Artifact comments are anchored to an element. A thread sent to Claude can be read, answered and resolved by a session, and a running Claude Code session replies on its own. Comments need a Team or Enterprise plan and in-organization sharing.", "Claude Code sessions publish and update artifacts too, and /design drafts a Claude Design canvas. /design-sync brings a repo's design system in, and a design can be handed back to Claude Code to build.", "A page can call Claude itself (the sample capability), but each call is memoryless and has no file system, shell, git, skills or web search, only tools the page defines. Fine for small helpers on the page, not a replacement for chat.", "Artifacts can reach your claude.ai connectors (the mcp capability), so they're not cut off from your apps. They still can't clone repos or run commands, which is most of what this work needs.", "The advisor stays outside Claude Code on purpose. Under claude-settings it would be bound by STE, fewest words and the question judge, which brings back the plain-versus-short problem, and a session judged by your rules is in a worse spot to say a rule is the problem. Skipping your user settings to avoid that would also skip your guards, and you run in bypass mode.", "So: chat to do the work, the roadmap page as the record, session pages for live questions, comments to point at exact things.", "GitHub access from an advisor chat (Oct 17): there is no GitHub connector, but a chat can attach repos with your GitHub access when you ask for it by name. Say 'attach claude-settings, q_max, home-app and home' at the start of a chat that needs PR details or the private repos. The advisor still doesn't push.", "Two advisor chats can edit this page at once. Every write is pinned to the version the chat last read, so a clash fails and gets redone instead of overwriting. The real risk is a chat reasoning from an old read, so each chat re-reads the page before filing, and works only on its own steps."], "sources": [{"label": "Claude Code artifacts", "url": "https://code.claude.com/docs/en/artifacts.md"}, {"label": "Claude Design", "url": "https://support.claude.com/en/articles/14604416-get-started-with-claude-design"}, {"label": "GitHub integration", "url": "https://support.claude.com/en/articles/10167454-use-the-github-integration"}, {"label": "Projects", "url": "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects"}], "summary": "Why the chat stays the workbench and the page stays the record.", "title": "Where to work: chats, artifacts, comments"}, "t13": {"blocks": [{"label": "Per-repo UI audit", "text": "Audit this repo for how well it supports high-quality UI/UX work by an AI agent. Do not change any code. Write your findings to ui-audit.md.\n\n1. Stack: list the UI framework, styling approach, component library, icon set(s), animation library, and fonts actually in use. Flag anything mixed or duplicated, e.g. two icon sets or Tailwind plus ad-hoc CSS.\n\n2. Design system health: are there design tokens (spacing, color, radius, type scale, shadows, motion durations)? Sample the styling and count how many distinct spacing values, colors, and border radii appear in practice. List the different patterns used for layout and centering, with example file paths.\n\n3. Agent context: what design guidance exists for you in CLAUDE.md, skills, docs, or reference images? Quote anything relevant. Note what's missing that you would want before building a new screen.\n\n4. Verification loop: can you currently render the UI and look at it (dev server, Playwright, browser or screenshot MCP, Storybook, visual regression tests)? If not, what's the smallest setup that would let you screenshot and self-check your work?\n\n5. Weak spots: pick the 3 screens or components that look weakest and say specifically why: spacing, alignment, hierarchy, iconography, motion, or overall feel.\n\n6. Recommendations, ranked by impact versus effort. Consider rules to add to CLAUDE.md, tokens to consolidate, a screenshot-and-critique loop, committing to one icon set and one motion library, and outside tools. Recommend an outside tool only if you can name the specific problem in this repo that it solves."}, {"label": "Strong vs weak repo comparison", "text": "Repo A consistently gets strong UI from you and repo B gets weak UI. Read both ui-audit.md files and the relevant code in each.\n\nExplain what concretely differs: tokens, constraints, existing component quality, CLAUDE.md guidance, verification ability. Separate what's causing the difference from what's incidental.\n\nThen write a reusable design-guidance section I can drop into any repo's CLAUDE.md, built from what makes repo A work. Also list anything repo B needs set up first, such as tokens or a screenshot loop."}, {"label": "Cull rulings, reusable", "text": "Owner rulings, now. They apply to this cull and every cull after it.\n\n1. Deletion fast path. A change that only deletes (rules, prose, guard code, tests, records) and adds nothing gets one review round. It skips rounds 2 and 3 and the net-value test, unless round 1 finds a hole that Claude could hit in normal work. Then it takes the normal path.\n\n2. Notes tier. A finding becomes a debt only if Claude is likely to hit it in normal work. Any other finding is one line in debts/notes.md, with no red test and no decision edit. A note becomes a debt after a real incident. Sweep the existing debts against this rule: move each one that fails it to notes.md and delete its file.\n\n3. No history in the tree. A decision file holds only a ruling in force, plus a one-line reason. Delete each decision that is superseded, or that a guard or gate now enforces with nothing left to say. Git keeps the history. Do not add history sections, changelogs or \"previously\" notes to any file.\n\n4. Prose leaves only with proof. Delete a rule's prose only when its row in lint/rule_mechanisms.json names a test, the test's case name states the ruling's behaviour, and a mutant that breaks the guard is killed by that test. A rule that fails any part keeps its prose until the test exists. Keep the reminder of 3 words or fewer and the one-line reason either way.\n\n5. Order and scope. This cull runs first. Do not move or rename files during it. Reorganizing the folders comes after the cull, as its own lanes. The only additions allowed are the tests that ruling 4 needs. The cull is time-boxed to <date>. Stop sooner if debts and decisions each cut under 5% for two batches in a row. Then report and stop.\n\nBefore and after each batch, report four numbers: hook Python lines, debt files, decision files, and CLAUDE.md words. Baseline at <commit>: <numbers>. A batch succeeds only if debts and decisions go down and hook lines do not grow."}, {"label": "Screenshot commands", "text": "# Web: one screenshot per size and theme, no project setup needed\nnpx playwright screenshot --viewport-size=390,844 --color-scheme=dark http://localhost:8080 shots/home-phone-dark.png\nnpx playwright screenshot --viewport-size=1440,900 --color-scheme=light http://localhost:8080 shots/home-desktop-light.png\n\n# iOS: one boot, both themes, then shut down\nxcrun simctl boot <device-id>\nxcrun simctl ui booted appearance dark\nxcrun simctl io booted screenshot shots/rooms-dark.png\nxcrun simctl ui booted appearance light\nxcrun simctl io booted screenshot shots/rooms-light.png\nxcrun simctl shutdown <device-id>"}, {"label": "Sandbox settings for the trial (Mac, and WSL2 on Windows)", "text": "\"sandbox\": {\n  \"enabled\": true,\n  \"allowUnsandboxedCommands\": false,\n  \"failIfUnavailable\": true,\n  \"filesystem\": { \"allowWrite\": [\"<your worktrees dir>\"] },\n  \"network\": { \"allowedDomains\": [\"github.com\", \"registry.npmjs.org\"] }\n}\n\n# Probe it: ask Claude to run this. It must fail\n# (Operation not permitted on macOS, Read-only file system on WSL2).\ntouch ~/sandbox-probe"}, {"label": "Path-scoped UI rule (~/.claude/rules/ui.md)", "text": "---\npaths:\n  - \"**/*.{tsx,jsx,css,html,vue,swift}\"\n---\nBefore any UI change: read docs/design/DESIGN.md and ~/.claude/ux/principles.md.\nSpacing comes from a relation, never a nearby number (ux/tokens.md).\nBuild to the lane's mockup in docs/design/mockups/. Run scripts/shoot and look before you hand off."}, {"label": "Starting prompt: reply-style edits chat", "text": "Task for this chat: draft the reply-style edits for claude-settings. Steps on the roadmap: 'Fix the reply-style conflict' and 'Visual questions come with a picture of each option', plus the reference topic 'Reply style and questions'.\n\n1. Read the roadmap page in full first, as the project instructions say.\n2. Clone github.com/shivinate7/claude-settings. Read output-styles/shiv-stylisms.md, every rule anchor that starts with style-, and the decisions question-outcome-check, haiku-prompt-hooks and the fewest-words decision. Find the judge prompts that check questions and replies.\n3. Draft exact edits for five rules:\n   a. Plain words win over short when they clash.\n   b. Each option says in one plain line how it works, then what I gain and lose.\n   c. Options I can't tell apart mean fewer options, or a decision made and stated.\n   d. One decision per question.\n   e. A question about how something looks says so, and links a picture of each option.\n4. For each edit: show the before and after text, say which judge prompt must change so it doesn't refuse the new rule, and measure the word change per file.\n5. Walk me through the drafts before finalizing; this is a judgment task, so take the time.\n6. The deliverable is a brief a Claude Code session can apply after the cull ends. File it on the page in the 'Fix the reply-style conflict' step, and touch only that step and the visual-questions step. Re-read the page right before you file. Don't push to any repo."}], "order": 130, "points": ["These snippets are starting copies. Once one lands in a repo, the repo file is its home and this topic points at it. The cull rulings already have a home: decisions/cull-rules.md in claude-settings.", "The two audit prompts work on any repo: run the first in each repo, then the second across a strong one and a weak one.", "The cull rulings are the ones you sent on Oct 17, with the date, commit and numbers left as placeholders, so you can reuse them for each child repo's cull.", "The screenshot commands, sandbox settings and path-scoped UI rule are starting points to test, not finished config.", "Worked example, checked Oct 26 at claude-settings 149f4bc: bin/ios-ship (one shared tool to ship iOS apps, PR 571) is the right shape. It is a script on disk: the installer lands it in ~/.claude/bin on every machine, but no CLAUDE.md, hook, skill, agent, output style or settings entry names it, so it costs no session any context until a session runs it. Each app repo keeps only its own config (tools/ios-ship.json) and a one-line wrapper that calls it; home-app (checked at 0a3419b) has tools/ios-ship.json, testflight.sh and reinstall-phone-apps, its how-to in SPEC.md and no line in its CLAUDE.md. Its CI job runs only when the tool or its tests change. claude-settings' own tools/ folder is different: hand-run Windows scripts (mem-monitor) that no installer copies."], "summary": "Copy these instead of asking again.", "title": "Reusable prompts and snippets"}, "t14": {"order": 140, "points": ["Lane: one piece of work, done by one builder on its own branch and folder.", "Batch, or integration branch: several finished lanes merged together into one PR, so CI runs once.", "Debt: a known gap, written down so it gets fixed. Note: a gap unlikely to matter, kept as one line.", "Decision record: a file holding one ruling you made, and its reason.", "Guard: a hook that checks each command or edit before it runs, and blocks it or asks you.", "Gate or lint: a check that runs on files or in CI and fails when a rule is broken.", "Worktree: a second copy of a repo in its own folder, so parallel agents don't collide.", "Janitor or sweep: the script that removes finished worktrees and branches.", "Design token: a named value such as --space-3 or --accent, used instead of a raw number. (A model token is different: a chunk of text, which is how usage is counted.)", "Path-scoped rule: an instruction file that loads only when Claude touches matching files.", "Sandbox: a fence the operating system puts around shell commands: which files and websites they can reach.", "Deny rule: a settings line that blocks a command or file pattern in every permission mode.", "Bypass mode: no permission prompts at all; only deny rules, hooks and the sandbox still stop anything.", "MCP server or connector: a plug-in that gives Claude tools for an outside service, such as GitHub or a browser.", "Mutation test: breaking a guard on purpose to prove its test notices.", "Mockup: a picture of a screen, made before building it.", "Artifact: a hosted page Claude publishes, like this roadmap.", "Compaction: when a long session's history is summarized to fit; early details can fade.", "Handoff: the file a session writes so its work survives compaction or a restart.", "Dispatcher: one hook process that runs several checks in turn, instead of one process per check.", "Exec form: a hook started directly from its command and arguments, with no shell in between.", "'if' filter: a pattern on a hook, such as Edit(*.md), that Claude Code checks before starting the hook at all.", "Http hook: a hook that posts to a small local server instead of starting a process.", "claude -p: Claude Code run as a one-shot command (p for print): one prompt in, one answer out, then it exits. Hooks use it to ask a model in the background, and each one is a whole separate Claude Code process."], "summary": "The terms this plan uses, in everyday words.", "title": "Plain-words glossary"}, "t15": {"order": 150, "points": ["Reading a batch report: did debts and decisions go down? Are more debts opening than closing? Did any change need all three review rounds? If the numbers rise two batches in a row, stop and bring the report to an advisor chat.", "When a session asks you something: does it state the goal and the problem, and can you tell the options apart by what you gain and lose? If not, reply: 'Pick the simplest option that keeps main safe, and tell me which you picked.'", "Ask for proof, not a description: 'show me the check that proves it' or 'give me the verdict command'.", "When a step stalls, ask the session: 'What's the smallest change that moves this step forward?'", "Red flags: a session asks something you already answered; one edge case takes more than about five commits; a new guard rule appears with no incident behind it; a cleanup adds more lines than it removes.", "Starting a step: copy its ask into a new advisor chat, get a brief, then paste the brief into a Claude Code session."], "summary": "What to check, what to say, and the red flags.", "title": "Steering sessions without me"}, "t16": {"order": 160, "points": ["Ramble freely. Don't tidy your thoughts first: sorting them and filing what's tangible is the advisor's job. One small habit helps a lot: name the repo or step when you know it.", "Send every session question to the project chat; one advisor thread answers and rolls over to a fresh one at about 40 back-and-forths, a new batch, or a slip (see the hand-off guide). When a tangent belongs somewhere else, say 'park this'. It goes on the page as a note or a Later step, and the chat comes back to where it was.", "Keep 'In progress' to two or three steps. Before starting another, finish or park one.", "When it all feels like too much, open this page, read 'In progress' and 'Up next', and do only the first one.", "For a decision you don't want to weigh, ask for the pick and a one-line reason, then take it unless it feels wrong.", "Use fb: inside a Claude Code session for bursts aimed at that session. Use an advisor chat for anything about the plan or the system as a whole.", "End every advisor chat with 'compare this chat against the page'.", "Once a week, spend ten minutes on the page: flip statuses, look at anything off track, and take one thing to a new chat.", "Say 'short version' when you've got the hang of something, and 'walk me through it' when it's new."], "summary": "Tangents are fine. This is how to keep them from costing you.", "title": "How to use this project, given how you think"}, "t18": {"order": 180, "points": ["Your rule, Oct 20: anything used in more than one place has one home, and everything else points at it. An exception starts from the shared piece and changes only what differs. The output looks the same; a fix to the home reaches every use, so nothing drifts or goes stale.", "In code terms: a shared component or function with options (a variant or override), not a copy edited by hand. Programmers call the idea a single source of truth.", "Design: tokens hold values (spacing, colour, radius); components hold shapes (a Button with size and tone options); a screen uses both. An odd button is a variant of Button, not a new button.", "Tests: shared steps live in one helper or fixture; a test that needs a twist at step 5a calls the helper and overrides that one step.", "Across repos: a shared skill, script or test is pinned to claude-settings, never vendored. The q_max map-skill copy drifted and failed PR 969 (Oct 20). That is the failure this rule prevents.", "Where each layer lives (your ruling, Oct 20): claude-settings holds the ideas and shared tools, since it governs every repo. Each repo holds its concrete design in its own files, because the repos differ: home-app is Swift plus web, q_max is separate, banchi has its own look. The rule applies inside each repo too: one home per value, component or test step.", "When a copy is right: the two things only look alike and will change for different reasons. Then the copy states that reason in one line.", "Enforcement: the builder looks for the shared piece first; compliance-check reports copied code and vendored files (o4, o11)."], "summary": "Your rule against copies, and how it maps onto code, design and tests.", "title": "One home, then variants"}}, "meta": {"advisor": {"each": ["Send session questions straight to the current advisor thread (your call, Oct 21). It counts the back-and-forths, adds one line at about 35 saying a fresh thread is coming, and at about 40 (sooner after a new batch starts, or at once if it slips: misses a ruling, re-asks something answered, contradicts the page) it finishes the current multi-part answer and hands off. The project chat then opens the fresh thread with that handoff (open questions, recent rulings, the running batch's state) and links it. A heavy turn, such as a plan, web research or a long paste, counts as several. Nobody can see a thread's context meter, so these are proxies; switching early is cheap because the page is the record.", "Bring back each Claude Code session's report, or paste its question, and say which step it belongs to.", "Before ending a chat, ask: 'compare this chat against the roadmap page and file anything missing'."], "prompt": "You are my advisor for claude-settings (github.com/shivinate7/claude-settings, my global Claude Code config) and the repos it governs: banchi, q_max, home-app, and home (ops records, no UI). You work outside that system. Its rules (STE, fewest words, report format, review rounds) bind my Claude Code sessions, not you, so say plainly when a rule is the problem.\n\nThe roadmap is the record. It lives on the roadmap branch of github.com/shivinate7/claude-settings under roadmap/data/ (steps/, topics/, meta/, one JSON file each). Before answering anything about the plan, read its steps, notes, cull numbers and reference topics. Edit the JSON files, run python roadmap/build.py, commit and push to the roadmap branch (no PR); other threads edit the same repo, so pull before each write. After each build, republish roadmap/roadmap.html to the roadmap page, https://claude.ai/artifact/R3iCpK91QRjC5he8bwfY7m. Briefs go in that branch's briefs/, and their full text in the step's ask field. Trust the roadmap over your memory, and say when it and the repos disagree.\n\nHow to talk to me\n- Plain words first. Plain beats short when they clash. \"Short version\" means keep it short; \"walk me through it\" means explain fully.\n- Never name a bare id (step, lane, PR, commit, rule, hook). Give its plain name beside it, like \"c18, hooks stop loading code they never use\". Step numbers are filing order, so state the work order in words.\n- When I have to choose, explain how each option works, what I gain and lose, and give your pick.\n- I have ADHD and often send bursts of notes: catch every item, group them, answer what you can, and name anything you need to look up.\n- \"Park this\" means file it on the roadmap and go back to what we were doing.\n\nFiling\n- Every message, even a passing remark, can hold something tangible: a decision, a finding, a new step, a debt, a note on a step, or a fact for a reference topic. File it on the roadmap in the same turn, without being asked, and tell me in one line what you filed. If you're unsure it's tangible, file it as a note and say so.\n- The roadmap is a current record, not a log. Rewrite the note you touch to what is true now, keeping each ruling as one dated line. Merge a new item into an existing step when they overlap, and fix the order and stale dependencies. Git keeps the history.\n- When I bring back a session's report, update the step's status and note, and the cull numbers.\n- Other threads edit the roadmap too. Pull right before each write.\n- At each phase change, or when I ask, review the whole roadmap for overlaps, stale dependencies and drift from the repos. When I ask, compare our chat against the roadmap and list anything missing or wrong.\n\nGripes\nWhen I name a gripe, even in passing, fix it twice: change how you work in this chat right away, and file a new step for what in claude-settings would stop any Claude session from causing it. Tell me in one line what you filed.\n\nBuilding claude-settings (ruling Oct 26, plan \"this project builds claude-settings\", step c52)\n- This project builds claude-settings itself: branches, PRs, fixing CI, and merging under a standing merge grant. Start with the pilot only.\n- Steps that need a local machine (live local state, Mac or Windows behaviour, installs) still go to local sessions as briefs.\n- Other repos: read them for reference, but don't push to them. When a plan step touches another repo, check in with me first to settle the plan.\n\nBriefs\n- For work local sessions must do, write briefs. Save each brief on the roadmap branch under briefs/, and put its full text in its step's ask field, so I can copy it from there. When one brief covers several steps, the text sits in one step and the others point to it by name.\n- Whenever a ruling, finding or rewrite changes a step, update its brief file and the ask copy in the same turn, so neither goes .st{border-top:1px solid var(--line)}

.tag{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:999px;line-height:17px;white-space:nowrap}
.tag.t-now{background:var(--accent);color:var(--on-accent)}

.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}

.body{display:none;padding:2px 12px 12px 80px;font-size:13px;color:var(--ink-2)}

.body dl{margin:0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px 10px}
.body dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}

.ask{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:6px 8px;font-family:var(--font-num);font-size:12px;color:var(--ink)}

.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:11.5px;font-weight:600;color:var(--accent-ink);margin-top:2px}
.emptyrow{padding:12px;font-size:13px;color:var(--muted)}
.donefold>button{display:flex;gap:8px;align-items:center;width:100%;padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.donefold>button:hover{color:var(--ink)}
.donefold.open>button .chev{transform:rotate(90deg)}
.donefold .fb{display:none;border-top:1px solid var(--line)}
.donefold.open .fb{display:block}

/* pager */
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.pager .pc{font-size:12px;color:var(--ink-2);text-align:center}
.pager button{font-size:12px;font-weight:600;color:var(--accent-ink);border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius-s);padding:4px 10px;min-height:30px;white-space:nowrap}
.pager button:disabled{color:var(--muted);opacity:.5}
.card>.pager:last-child{border-radius:0 0 var(--radius-m) var(--radius-m)}

/* side cards */
.trend{padding:8px 12px 10px;display:grid;gap:8px}
.tr{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:8px;align-items:center}
.tr .k{font-size:12px;color:var(--ink-2);line-height:1.2}
.tr svg{width:100%;height:30px;display:block;overflow:visible}
.tr .r{text-align:right;line-height:1.15}
.tr .r .num{font-size:13px;font-weight:600;display:block}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);padding:0 12px 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;border-top:1px dashed var(--muted);vertical-align:middle;margin-right:4px}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:6px 12px;border-top:1px solid var(--line);font-size:12.5px}

.kind{font-size:11px;color:var(--muted)}
.kind.done{color:var(--good)}
.kind.active{color:var(--accent-ink)}
.kind.blocked{color:var(--bad)}
.morelink{display:block;width:100%;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--accent-ink);font-weight:600}

/* changes view */
.day h3{margin:0;padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);background:var(--surface-2)}

.ev button:hover .t{text-decoration:underline}
.ev.done .t{text-decoration:line-through;text-decoration-color:var(--line-2)}

/* reference */
.ref{margin-bottom:16px}

.ref ol li{padding:2px 0}
.tp>button{display:grid;grid-template-columns:30px minmax(0,1fr) 14px;gap:8px;width:100%;padding:8px 12px;border-top:1px solid var(--line);align-items:baseline}

.tp>button:hover{background:var(--surface-2)}
.tp .sm{display:block;font-size:12px;color:var(--muted)}
.tp .tb{display:none;padding:0 12px 12px 50px;min-width:0}
.tp.open .tb{display:block}
.tp.open .chev{transform:rotate(90deg)}

.tp ul li{margin:3px 0}
.tp .ask{margin-top:6px}
.tp .ask span{max-height:16em}
.src{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:8px}
.lead{padding:10px 12px;margin:0;font-size:13px;color:var(--ink-2)}

.view[hidden]{display:none}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;padding:4px 7px;border-radius:var(--radius-s);max-width:240px;opacity:0;transition:opacity .08s;left:0;top:0}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:var(--radius-m);max-width:calc(100vw - 32px);box-shadow:0 4px 18px rgba(0,0,0,.18)}

@media (max-width:1000px){
  .cols{grid-template-columns:minmax(0,1fr)}

}

  .top .wrap{gap:8px}
  .tools{margin-left:0;width:100%;justify-content:flex-end}

    </div>
