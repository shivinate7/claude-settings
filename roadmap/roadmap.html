<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
(() => {
  const DATA = {"steps": {"c1": {"note": "Sent. Stop rule chosen: debts + decisions.", "order": 10, "phase": "cleanup", "status": "done", "title": "Send the cull rulings to the running session", "updatedAt": "2026-10-17T17:20:00Z", "why": "Fast path for deletions, notes tier for unlikely gaps, no history in the tree, prose leaves only with a proving test, a time box, and size numbers each batch."}, "c10": {"ask": "Brief, copied from briefs/c10-c23-guard-grows-then-proves.md and kept in step with it. Paste all of it to a claude-settings session. Covers c10 (lane 1) and l1 (lane 2); prepares c23.\n\nGuard rule amendment and fire counts, claude-settings. Roadmap: c10 (the guard rule, amended) and l1 (track guard refusals per session). This prepares c23 (cull the guard itself), which is not part of this brief. Make it its own small batch after the one running now (the hook import, process-start and Windows lanes), because it touches CLAUDE.md and lint/, and those lanes are already editing files near them. No measuring step; prove each change with a test.\n\nOwner's ruling, Oct 21: let the guard grow while things change, then cull what never proved itself. No freeze was ever in force. The current rule stays and gets wider.\n\nLane 1, amend building-guard-needs-incident in place. CLAUDE.md, around line 82: \"Build a new guard or gate rule only against a named incident or a measured risk. Cite it in the rule's record.\" Rewrite it in place, as one rule with no new section, to say:\n- A new guard or gate rule may land for a named incident, a measured risk, or a likely risk (likely to hit in normal work, the same bar debts use).\n- Its record says which of the three it is, and the date the rule landed.\n- At each cull, a guard rule that never fired in guard.log since it landed, and whose record names no incident, is deleted with its code and tests.\nUpdate the rule's row in docs/records.md (line 77) and in lint/rule_mechanisms.json, whose reason text names only \"a named incident or measured risk\". Record the ruling in place under decisions/ if a decision holds this rule; otherwise in the rule's record. One-line reason: \"grow while things change, then cull what never fired (owner, Oct 21)\". Report the rule text before and after, and the word change.\n\nLane 2, rules that never fired show up. lint/guard_log_report.py already prints deny, ask and noted counts per rule from guard.log, and guard.log is never pruned. The gap: a rule that never fired has no line, so it never appears, and those are exactly the rules a cull is looking for. Add a flag (for example --all-rules) that lists every rule id the guard and the gates can emit, each with its counts, including 0, plus the date of the rule's first guard.log line (or \"never\"). Take the rule ids from their one home in the code, not a copied list (rule building-allow-list-is-the-constant). Let --days take \"all\" for the whole log. Tests: a rule with no lines shows 0 and \"never\"; a rule with lines shows its counts and first date; the list matches the constant, red on main and green on the fix.\n\nDo not delete any guard rule in this batch. That is c23, the guard cull, after this lands.\n\nReport: per lane, what changed and the test that proves it; the rule text before and after; and one run of the new report on this machine with --all-rules --days all, pasted in full, so the cull can start from it.", "note": "Done: landed in #560 (rule text batch), merged Oct 22. No freeze was ever in force; this step was only a plan until Oct 21. Your ruling, Oct 21: amend building-guard-needs-incident (CLAUDE.md line 82 at 5584d1b) in place. A new guard or gate rule may land for a named incident, a measured risk or a likely risk; its record says which and the date it landed; at each cull, a rule that never fired in guard.log and names no incident is deleted with its code and tests (c23, the guard cull). Last measured Oct 20 at 84d4076: decisions 100, debt files 47, hook lines 49,261, CLAUDE.md 2,399 words.", "order": 106, "phase": "cleanup", "status": "done", "title": "Let the guard grow, then cull what never fired", "updatedAt": "2026-10-23T03:10:00Z", "why": "Your ruling, Oct 21: no freeze. A guard may grow while things change; the cull removes what never proved itself."}, "c11": {"note": "Done Oct 19: the sentence 'A check that enforces a rule in this file needs no other incident.' is gone from CLAUDE.md on main (checked at 960cc63, after #515 and #516). Decided 10:42 am, option A. Measured basis: of 99 rule rows, 6 are guard rows hanging off CLAUDE.md rules, none citing an incident; guard code names at least 37 rules. The bigger lever stays reviewer variant hunting.", "order": 96, "phase": "cleanup", "status": "done", "title": "Close the no-incident exception in building-guard-needs-incident", "updatedAt": "2026-10-19T18:55:00Z", "why": "The rule says a new guard needs a named incident or a measured risk, then adds: 'A check that enforces a rule in this file needs no other incident.' So any CLAUDE.md rule can get a guard with no incident, and the freeze (c10) has a hole."}, "c12": {"note": "Done, checked Oct 20 at 84d4076. agents/builder.md: 'Never run the full suites locally. When your lane changes a file a mutation harness targets, run that harness once through verdict before pushing.' CLAUDE.md: 'CI is the merge gate for the full suites and the mutation harnesses.' Unknown: the wall time of one harness run (the brief asked the lane to record it; no record found in the repo). If runs prove slow, option B (anchor-only flag) is the fallback.", "order": 97, "phase": "cleanup", "status": "done", "title": "Builders run the mutation harness once before pushing a guard change", "updatedAt": "2026-10-20T16:55:00Z", "why": "A guard edit that moves a mutation's anchor text is caught only in CI today, which costs a red batch: drop the lane, re-run, open a fix lane. Five anchor re-point commits Oct 15-19 (40f4f251, f5e9ce3f, b700ade4, a3f56cb4, 3e23abf7). How many turned a batch red is unknown."}, "c13": {"note": "Done Oct 21. Landed in PRs #541 and #542 (the hook load batch): config_watch hashes first and exits before loading the guard; local_time no longer pulls in the guard family (new shared_names module); stall_watch exits at once on Windows; ci_wake got a pre-filter; the SessionEnd fetch runs at most once per 10 minutes per repo; verdict logs older than 7 days are pruned. The lane report was lost, so it closed on repo evidence. What was left moved: the Stop dispatcher and cached git reads to c19 (start fewer processes per tool call), the double question judge to c7 (fix the reply-style conflict).", "order": 99, "phase": "cleanup", "status": "done", "title": "Cut the load hooks add to every tool call", "updatedAt": "2026-10-21T17:30:00Z", "why": "A q_max session's report (Oct 20) found a model call on every Edit and Write, two judges on each question, about 6 hook launches per Bash call, 9 Stop hooks per turn, and the guard family (14 modules, 9,926 lines) loaded on every prompt. This is the first concrete plan for hook code, the one number the cull never moved."}, "c14": {"ask": "Build the machine-load brake as a standing part of claude-settings, on every device that installs it (Windows and Mac, no admin): at the moment a lane is about to start, the guard reads the machine's load once and sets how many lanes may run.", "note": "Done. Rulings: every device that installs claude-settings; no watcher, timer, per-call reading or log of its own (Oct 21); no lane or process count (Oct 22); disk busy under the smaller of 10% and 15 GB free, full under the smaller of 5% and 5 GB (Oct 23); CPU dropped, since a short sample is noise (Oct 25). Landed: #562, #565, #569, then #572 (the brake reads memory and disk only; decision machine-load-brake rewritten). Related: c40 (idle desktop sessions each burn a core).", "order": 107, "phase": "cleanup", "status": "done", "title": "Machine-load brake: every session paces its lanes to the device's real load", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your idea, Oct 20, widened Oct 21: when the machine is loaded, sessions slow down; when it has room, more lanes can run. Incidents: the 15 spinning claude.exe workers of Oct 19, the q_max load report, and the Windows RAM climb to about 98% of Oct 21. Your caution, Oct 21: measuring and logging have cost more than the problem before."}, "c15": {"ask": "Draft the move from hard STE rules to outcomes: for each of the five blocking codes, what outcome it was for, whether a CI check, a judge or nothing should carry it, and what ste_gate becomes. Include the word and line change.", "note": "Done. Landed in #566 (Oct 23): the STE hooks left settings.json; CI's STE lint carries STE001, STE011 and STE013 on changed Markdown; STE020 and STE021 dropped. The stubs lint/ste_gate.py and lint/md_sweep.py are gone (checked Oct 26 at 149f4bc). Open: UI files lose the long-sentence, bloat and double-negative checks, since CI reads Markdown only; the session took that as the default.", "order": 111, "phase": "cleanup", "status": "done", "title": "Swap the hard STE rules for the outcomes they were meant to get", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your direction, Oct 20: STE went in as hard rules, but what you want is the outcome: plain replies you can follow, clear UI copy, short docs. The rules block edits, slow every edit, and fight plain-beats-short (c7)."}, "c16": {"ask": "Janitor sweep speed lane: time a q_max preview split by check, then batch the git calls (one for-each-ref and one merged list for all branches; cherry only for what the batch cannot prove), drop the guard import, and add a fast worktree-only mode that reaps only branches already in main. A worktree it cannot prove safe is kept. Report before and after times.", "note": "Checked in the repo at 84d4076: janitor/sweep.py (3,189 lines) and session_end_sweep.py both import the whole guard family at start. Each worktree is proven safe by up to three checks in turn (ancestor, cherry-empty, remote-contains), each a separate git call, and a git call on Windows costs a process start. The remote-head check is already one batched rev-list --stdin call. Plan: 1. Time a q_max preview first, split by check. 2. Batch: one for-each-ref and one merged-into-main list for all branches, instead of calls per worktree; run cherry only for branches the batch could not prove. 3. Skip the guard import (move the few helpers it needs into a small module, same fix as c13 lanes 3 and 6). 4. A fast mode that only reaps worktrees whose branch is already in main, and leaves the rest for a full run. Less checking must still fail toward keeping a worktree, never toward deleting work. Stopgap given Oct 20: close sessions, then run git worktree remove without --force on each worktree; git refuses dirty or locked ones, and commits stay on their branches. Not measured yet: the sweep time itself. Landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25). Sweep time after the change: not measured.", "order": 121, "phase": "cleanup", "status": "done", "title": "Make the janitor sweep fast on big repos", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your ask, Oct 20: the sweep is very slow on Windows. q_max has about 178 registered worktrees and about 1,000 remote heads. You want it faster, by batching checks or checking less."}, "c17": {"ask": "Brief, copied from briefs/c17-agent-judge-opus.md and kept in step with it. Paste all of it to a claude-settings session.\n\nOpus on your word, claude-settings. Goal: when the owner wants Opus for a spawn, it runs, with no magic words; Claude never picks Opus on its own; no new model calls.\n\nToday: the type: prompt PreToolUse judge on Agent refuses an audit Explore spawn unless model is sonnet, so it refuses Opus too, against decision subagent-model-cap (\"any other spawn runs Opus only when the owner names it\"). It sees only the tool call, so the owner's word and the override pass can never reach it.\n\nLane 1, the ceiling moves to the guard. guard.py already runs on Agent and Task calls. When a spawn sets model opus and no standing word covers it (Plan; builder try 3; reviewer round 3 is not standing), the guard answers \"ask\" under rule subagent-model-cap, the same way it already asks on a settings write. The owner approves or declines in the prompt. An override pass lifts it like any other ask. Test: a spawn with model opus gets an ask; Plan with opus and a spawn with sonnet or haiku pass; red on main, green on the fix.\n\nLane 2, the judge keeps only the floor. DONE Oct 21 in PR #544 (the Agent judge accepts Opus); do not redo it, check lanes 1 and 3 against main first. In the Agent prompt judge, the Explore clause blocks only an audit or judging brief that sets model haiku or no model. Opus and Sonnet pass the judge; the guard owns the ceiling.\n\nLane 3, override takes words. In hooks/override_pass.py, a prompt that starts with the word override grants the pass, and the rest of the prompt is the reason, written to guard.log. So \"override: use opus for that one review agent\" grants a once pass. \"override 15m\", \"override 2h\" and \"override off\" keep their meaning when they are the whole prompt. A prompt that only mentions override later in a sentence grants nothing. Update the decision owner-override-pass in place.\n\nFirst check: does a hook \"ask\" show a prompt to the owner in bypass mode? The guard already relies on it for settings writes, so confirm with that existing case. Report the before and after judge text and the tests.", "note": "Done. Landed in #544 (Oct 21: the Agent judge accepts Opus; an audit Explore passes on Sonnet or Opus, Haiku or unset blocks) and #562 (Oct 22: the Opus ceiling moved into guard.py as an ask to you, and override accepts words after it). Routing principle, advisor Oct 21: same agent with a model override when only depth changes; a dedicated agent with its model pinned when the job differs. Follow-ons: c41 (Opus for one session or run) and c54 (cloud threads follow the same model rules).", "order": 104, "phase": "cleanup", "status": "done", "title": "Opus runs on your word, and override understands plain words", "updatedAt": "2026-10-26T05:35:00Z", "why": "Oct 20, q_max: the Agent judge refused an Opus audit twice, even after you typed an override. The outcome you want: you say Opus, it runs; Claude never picks Opus on its own; no extra model calls."}, "c18": {"ask": "Brief, copied from briefs/c18-c19-hook-imports-and-spawns.md and kept in step with it. Paste all of it to a claude-settings session. Covers c18 and c19 lanes 1 to 3. Running now; lane 4 was narrowed Oct 21 to config_watch only, so tell the running session if it has not picked that up.\n\nHook import trim and fewer process starts, claude-settings. Roadmap steps: c18 (hooks stop loading code they never use) and c19 lanes 1 to 3 (start fewer processes per tool call). Fixes to existing hooks and mods, not new guard rules. No dispatcher, and no change to how hooks are launched (no exec form, no per-machine settings): those come later. Do not run timing or process-count measurements: the owner has enough numbers. Build the fixes and prove them with tests.\n\nGoal: a hook that has nothing to do for a path or input never loads the guard family, and Claude Code starts fewer bash.exe and python.exe processes per tool call. Every gate keeps exactly its current fail-open or fail-closed behaviour.\n\nLane 1, prose_judge loads nothing until it has work. In hooks/prose_judge.py, the import `from decision_watch import invoke_model` sits at the top of the file (line 21), so a .ts edit loads the guard family (about 105 modules) before main() checks the path. Move the import into main(), after the is_prose check. Keep the test seam, so a test can still replace invoke_model.\n\nLane 2, ste_gate loads nothing until it has work. lint/ste_gate.py imports ste_lint (2,290 lines) at the top (lines 53 to 54), only to read UI_SUFFIXES, then checks the suffix in main(). Import ste_lint only after the suffix check. Read UI_SUFFIXES from a small constant that imports nothing, with one home for that list.\n\nLane 3, the same fix on the other hooks. Check lint/report_gate.py, lint/md_sweep.py, hooks/reply_judge.py, hooks/feedback_gate.py and hooks/ruling_home.py. Any that import guard, decision_watch or ste_lint before they know they have work get the same fix: import after the cheap check.\n\nLane 4, `if` filters in settings.json, so Claude Code skips the hook without starting a shell. The `if` field takes one permission rule per handler and is checked only on tool events. Docs: https://code.claude.com/docs/en/hooks (Common fields).\n- config_watch only: on Write, Edit, MultiEdit and NotebookEdit, run only for the exact file names shared_names lists as watched files.\n- Owner's ruling, Oct 21: no filters on ste_gate or prose_judge. A Windows probe showed path patterns with a slash never match (paths arrive with backslashes) and suffix patterns are case-sensitive, so a miss would silently skip the gate. Leave its Bash, PowerShell and Stop runs as they are, since any shell command can write the cap.\nKeep each script's own path check as the second layer. Check that a filtered fail-closed handler still blocks when its script is missing.\n\nLane 5, the decision-watch mod finds Python once. mods/decision-watch/hooks/register.mjs calls pickPython (where.exe, or which) on every Stop. Look Python up once per session and reuse the result. Look again only if the cached path fails to start.\n\nLane 6, idle polling. Today, each session runs these even when nothing is happening:\n- session-board: a git read every 30 s while idle (HEARTBEAT_MS).\n- desktop-statusline: 2 git calls every 60 s (REFRESH_MS).\nRead git at turn end and on focus or attach. While idle, back off to about 5 minutes. If both mods need the same reading, share one.\n\nTests, per lane, red on main and green on the fix:\n- Lanes 1 to 3: run the hook on an input it ignores (a .ts path for lanes 1 and 2) and assert that no guard-family or ste_lint module is in sys.modules.\n- Lane 4: a settings test that an Edit of a watched file matches config_watch and an Edit of any other file does not.\n- Lane 5: two Stops in one session start the finder once.\n- Lane 6: an idle session runs no git read within the back-off window.\n\nReport:\n- Per lane: what changed and the test that proves it.\n- The four size numbers on main: decision files, debt files without README and notes.md, hooks/*.py lines (code and tests separately), CLAUDE.md words.", "note": "Checked at 5553dc6, Linux timings (9 runs each, median): guard 98 to 105 ms, ste_gate 98, prose_judge 100, config_watch 46, local_time 55, Stop hooks 30 to 120, bare python 17. Cause: prose_judge imports decision_watch (the guard family) and ste_gate imports ste_lint at the top, before checking the path. Skipping those imports saves about 75 ms each; merging processes saves about 17 ms each. Python processes per event: Edit or Write 4; Bash 2 on Windows (3 with 'ready') and 5 to 6 on Mac; Stop 9; prompt 1. Your ruling Oct 21: no measuring step, fixes proven by tests. A Stop-only dispatcher stays a later option in c19; the guard keeps its own process because it fails closed. Running now, in one batch with c19 lanes 1 to 3 and c22's Windows lanes.", "order": 101, "phase": "cleanup", "status": "done", "title": "Hooks stop loading code they never use", "updatedAt": "2026-10-21T20:15:00Z", "why": "The feedback from the c13 session said the next saving is one dispatcher per event. Measured Oct 21 (Linux, so a floor): an interpreter start is about 17 to 22 ms, but prose_judge and ste_gate take about 100 ms each on a .ts edit, because they import decision_watch (the guard family, 105 modules) and ste_lint before they check the path. A dispatcher saves about 17 ms per merged process here; skipping those imports saves about 75 ms each."}, "c19": {"ask": "Lanes 1 to 3 (if filter on config_watch, decision-watch finds Python once, idle polling) are in the combined brief, full text in the Ask of c18 (hooks stop loading code they never use). No measuring step (your ruling, Oct 21). Lane 4 (Mac-only hooks registered only on Mac; hooks started without a shell, with absolute paths and onFailure: block, so install renders settings.json per machine) waits for a design proposal after that batch lands. Later, after o2 and only if still needed: a Stop-only dispatcher and cached git reads (from the old hook load step).", "note": "Counted at 5553dc6, not timed on Windows. On Windows every command hook starts bash.exe (through Git Bash) and then python.exe. A sample turn (1 prompt, 5 Bash, 5 Edits, 5 Reads, 1 Stop) starts about 65 bash.exe and 46 python.exe per session: a Bash call 6 and 2, an Edit 4 and 4 (a .md edit adds ste_lint), a Stop 9 and 9. The decision-watch mod adds where.exe plus 1 or 2 python per Stop. Idle sessions poll git: session-board every 30 s, desktop-statusline 2 calls every 60 s. 'if' filter probe on Windows, Oct 21: path patterns with a slash never match (paths arrive with backslashes); bare suffix patterns match, but per tool and case-sensitively, and a miss silently skips the gate. Your ruling, Oct 21: filter config_watch only, on exact file names; the ste_gate and prose_judge filters are parked. Reopen them only if Edit and Write shell starts still matter once c22's fixes land and the memory monitor re-runs. Order: lanes 1 to 3 in the running batch; lane 4 design next; a Stop dispatcher after o2 only if still needed; an http hook server last, since one down server fails every gate.", "order": 102, "phase": "cleanup", "status": "done", "title": "Start fewer processes per tool call", "updatedAt": "2026-10-21T20:15:00Z", "why": "Your report, Oct 21: too many Python and bash spawns, worst with several Claude Code desktop sessions at once. Hooks run once per session, so the count multiplies with every open session."}, "c2": {"note": "Cull closed Oct 19 on its time box (your ruling). Final at cull batch 6 (#508, the last cull batch): decisions 90 (down 33% from 134), debt files 16 (down 96% from 364, swept into debts/notes.md), hook lines 47,461 (up 0.6%), CLAUDE.md 2,329 words (up 1.7%). The stop rule was never met; its named work was done in c6 (proving tests for five guard rules). decisions/cull-rules.md stays for the child-repo culls in Roll out. Regrowth is watched on the Clean up numbers.", "order": 20, "phase": "cleanup", "status": "done", "title": "Read each batch's size report", "updatedAt": "2026-10-21T17:30:00Z", "why": "The four numbers show whether the cull is shrinking the system or growing it."}, "c20": {"ask": "Widen the gloss rule, claude-settings. In CLAUDE.md, rule speak-cite-id-plus-gloss (line 89) covers only records. Rewrite it in place so it covers any id the owner would have to look up: decision and debt ids, roadmap step ids, lane numbers, PR and issue numbers, commit hashes, rule anchors and hook or script names. Each one gets a short plain name beside it the first time it appears in a reply or report, like 'PR #542, the hook load batch'. Add to the same rule: a numbered id carries no order, so state the work order in words. Keep it to one rule, no new prose section. Update its row in lint/rule_mechanisms.json and the compliance-check probe (skills/compliance-check/probes.md, 'Speak plainly') so the check covers the wider scope. Report the before and after rule text and the word change.", "note": "Done: landed in #560, merged Oct 22. Checked at 5553dc6: CLAUDE.md line 89, rule speak-cite-id-plus-gloss, covers only records (decisions, debts), so roadmap steps, lanes, PR numbers, commit hashes and hook names slip past it. It binds Claude Code sessions only; the advisor got the same rule through its project instructions on Oct 21. Your ruling, Oct 21: widen it to every id you would have to look up, and say the work order separately, since step numbers are filing order. Next batch, which also deletes branch batch-map on origin (it adds nothing over main).", "order": 103, "phase": "cleanup", "status": "done", "title": "Every id comes with a plain name", "updatedAt": "2026-10-23T03:10:00Z", "why": "Your gripe, Oct 21: the advisor answered in bare roadmap step ids (c18, c19) with no name, so you had to ask what they were. You want this never to happen again, in any session."}, "c21": {"ask": "Standard lint in CI, claude-settings. Add a [tool.ruff] config with select = [\"F\", \"E9\"] and the vendored skills/impeccable excluded. Fix the 12 findings (11 unused imports, 1 f-string). Add ruff check and ShellCheck (on the 18 *.sh files, at severity warning) as steps in .github/workflows/gates.yml, failing the PR. Fix what ShellCheck flags or suppress with a one-line reason. Do not add a format step, a pre-commit hook or any Claude Code hook. Report the files changed and the four size numbers.", "note": "Done: landed in #561 (ruff and ShellCheck in CI), merged Oct 22. Checked at 5553dc6: no Ruff, Black, ShellCheck or pre-commit config; 124 Python files outside the vendored impeccable skill, 18 shell scripts, 45 custom checks in lint/. Ruff's bug rules (F) find 12 issues: 11 unused imports and 1 f-string, so the code is already clean of real bugs. Advisor pick: checks run in CI or at commit, never on every edit (the same principle as c15). So ruff check (F and E9) and ShellCheck go in gates.yml; no format-on-edit hook; a repo-wide ruff format waits until after o2, which moves files anyway. Not checked: the chat's ShellCheck findings (7 quoted ~ paths, 2 unguarded cd). Next batch.", "order": 105, "phase": "cleanup", "status": "done", "title": "Standard code lint in CI only, never on each edit", "updatedAt": "2026-10-23T03:10:00Z", "why": "Oct 21: a claude.ai chat audited claude-settings and suggested Ruff (Python lint and format) in CI, ShellCheck, and a hook that formats each edited .py file. You asked for a take, framed as processing improvements."}, "c22": {"ask": "Brief, copied from briefs/c22-windows-installer-and-rm-shim.md and kept in step with it. Paste all of it to a claude-settings session. Sent Oct 21 as lanes W1 to W3 of the running batch.\n\nAdded work for your current batch: Windows process churn. Roadmap step c22 (stop the Mac/Linux installer and rm shim running on Windows). Finish or park the lane you are in first; do not restart lanes already done. These lanes are small and urgent, so land them as soon as your current lane allows, in this same batch. If they cannot share a batch, open them as their own small batch that merges first. They fix existing code on a platform it was never meant for. No measuring; prove each fix with a test.\n\nWhy: on the owner's Windows machine (Git Bash, no admin), RAM climbs to about 98% over a day and only a reboot clears it. Kernel memory grows with every process start. The worst offender caught was the rm shim: 4 processes (sh, a forked sh, the WindowsApps python3 alias, the real python) on every rm -rf.\n\nChecked at 5584d1b:\n- The settings.json SessionStart hook (startup|resume) runs `bash \"$d/install.sh\"` whenever bash exists, so the Mac/Linux installer runs on Windows at every session start.\n- landed-dirs.txt includes bin, so it lands bin/rm, whose header says \"Posix only; install.ps1 does not land this file.\"\n- install.sh (near line 600) adds ~/.claude/bin to PATH in ~/.bashrc, putting the shim first in Claude Code's shells. install.sh has no Windows check.\n- bin/rm calls bare python3 (the WindowsApps alias on Windows, which starts a second python) and builds its Python with $(cat <<'PYEOF'), one more fork.\n\nLane W1, the installer stays off Windows. The SessionStart hook skips install.sh when uname -s is MINGW*, MSYS* or CYGWIN*, and install.sh exits 0 at its top on those, naming install.ps1 as the Windows installer. Test both. Record the ruling in place under decisions/ (one ruling, a one-line reason).\n\nLane W2, the rm shim. On MINGW, MSYS or CYGWIN, exec the real rm at once, before any python. Elsewhere, find Python the way the hooks do (python3 then python, skip WindowsApps), and pass the Python on stdin with a here-doc instead of $(cat). Mac and Linux protection stays exactly as it is. Test the Windows exec path, the WindowsApps skip, and the existing refusal cases.\n\nLane W3, ci_wake's pre-filter. Tighten the PostToolUse shell pre-filter from any \"ready\" to the phrase gh pr ready, so other commands start no python. The watch itself, its deadline and asyncRewake stay.\n\nOverlap with your current lanes: W1 and W3 edit settings.json, which your 'if' filter lane also edits. Do them in one pass on settings.json, or rebase whichever lands second; keep both sets of changes.\n\nIn your report, add:\n- Per W lane: what changed and the test that proves it.\n- A checklist the owner runs on the Windows machine after this merges and is pulled, no admin needed and nothing scripted: delete ~/.claude/bin/rm; remove the \"# claude-settings: ~/.claude/bin on PATH\" block from ~/.bashrc; check ~/.claude/claude-settings-install.log for install.sh runs; and check whether install.sh replaced ~/.claude/settings.json or a landed folder with something install.ps1 would not have made, and how to put it back.", "note": "Done. Landed Oct 21 in #552 (the hook import and process-start batch) with c18 and c19: the SessionStart hook no longer runs install.sh on Windows (W1, #558), the rm shim's parent-delete refusals moved into guard.py's recursive-delete rule (W2, #554), and decision shell-scripts-check-out-lf pins shell scripts to LF line endings. Accepted risk, Windows only: a delete inside a script, a variable or a symlink to a parent is not caught (W1 decision). Debt install-checkout-flake stays open until the race is fixed. Left for you, Oct 22: delete ~/.claude/bin/rm on the PC with the PowerShell line; not confirmed. Open, for IT: why processes under Claude start with about 2,000 handles against about 180 by hand.", "order": 100, "phase": "cleanup", "status": "done", "title": "Stop the Mac/Linux installer and rm shim running on Windows", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your Windows audit, Oct 21: RAM climbs to about 98% over a day and only a reboot clears it, with kernel pool growing about 0.8 GB an hour while tool calls run. The longest-lived processes were the rm shim's 4-process chain. Process churn is the lever on our side; the rest (why each MSYS2 process starts with about 2,000 handles) goes to IT's security agents."}, "c23": {"ask": "# Batch 4: cull the guard, part 2 (c23). Run on the Mac.\n\nPaste this whole file into one fresh claude-settings session on the Mac.\nWritten by the advisor, Oct 25, against claude-settings main f463787 (#572).\n\n## Goal\n\nDecide two guard rules that never fired on Windows: keep or delete each, on both machines' counts.\n- `gh-api-method`: refuses `gh api` with a write method (the API route to merges and settings changes).\n- `ln-over-directory`: refuses `ln -s` over an existing folder. It can do real harm only on Mac.\n\nGoverning records: debt guard-cull-held-two (the two rules held for the Mac count), decision\ncull-rules (how a cull runs), rule building-guard-needs-incident (delete a guard rule that never\nfired since it landed and whose record names no incident).\n\n## Steps\n\n1. Confirm you stand in the Mac clone on an up-to-date main: `git fetch origin main` and\n   `git -C <pin> rev-parse HEAD` against `git rev-parse origin/main`. If the pin is behind, the\n   session-start auto-pull (#568) failed: say so in the report, then reinstall with\n   `bash merge/install_from_main.sh` from the clone.\n2. Count: `verdict python3 lint/guard_log_report.py --all-rules --days all`. From its output, give\n   for each of the two rules: deny, ask and noted counts, and the first-line date or \"never\". Also\n   give the log's line count and its first date, so the count's reach is known.\n3. Windows count, Oct 22 (from the debt): zero lines for both, in 20,685 lines since 2026-09-16.\n   If the owner gives a fresher Windows count, use it.\n4. Stop point. Bring the owner one question with options and a pick, per rule:\n   - Count zero on both machines: delete (pick), or keep with the reason.\n   - Count above zero on the Mac: keep (pick). Quote each fired line's date and command shape, so\n     the owner sees whether it caught a real mistake.\n   Ask the owner directly. This is a deletion of a guard, so it is the owner's call, not the\n   advisor's. Do not delete anything before the owner names the rules.\n5. Build what the owner names, in one lane: delete each named rule from `hooks/guard.py` (its code,\n   its reason constant, its line in the rule list near line 63), its rows in `hooks/test_guard.py`,\n   and its mutants in `hooks/mutate_guard.py`. Rewrite or delete debt guard-cull-held-two: delete it\n   when both rules are decided. Update every other reader that the rule ids appear in\n   (`git grep -n '<rule id>'`).\n6. Proof: the guard suite and the mutation harness pass with the rules gone; `guard_log_report.py\n   --all-rules` no longer lists a deleted id. A reviewer reads the diff (it changes a guard).\n   Merge under the usual rules (git-integration-branch-merge, roles-review-cap-three); a lone lane\n   is its own integration PR.\n\n## Report\n\nDone, Deviations, Input Needed, Next, per the report rules. Include the two counts (Mac and\nWindows), the owner's answer with its date, and the PR. If nothing was deleted, say which rules\nstay and why, and where that ruling now lives.\n", "note": "Part 1 merged in #562, Oct 22 (deleted STE-wording and role-diff-nocwd). Part 2: Mac count, Oct 25 at f463787: ln-over-directory fired 13 times, gh-api-method twice (Windows: zero for both). Your ruling, Oct 25: delete gh-api-method, keep ln-over-directory. Built on branch guard-cull-gh-api (c8c2de7e), no PR. Review round 1 found the rule is the only guard on gh api .../pulls/N/merge -f merge_method=squash. Your ruling, Oct 25, after that finding and against the advisor's keep pick: delete it anyway; your typed word in the Mac session is the override for the hole it opens. Next: a Mac session opens the PR from that branch and merges it. Note, not a guard: gh api -X PUT .../merge is an unguarded merge route; it becomes a debt only after a session is seen using it. Merged in from c9 (triage, Oct 26): lint/rule_audit.py passes a guard rule with no test; at the next cull, a rule with no test counts toward the cull test. Placed beside c27 (triage, Oct 26): both wait on a Mac session; cleanup work stays ahead of Organize.", "order": 109.1, "phase": "cleanup", "status": "active", "title": "Cull the guard itself", "updatedAt": "2026-10-26T05:35:00Z", "why": "The Oct 19 cull cut decisions (-33%) and debts (-96%) but never touched guard code: hook lines went 47,196 to 49,261. The hook cut has to come from culling guard code directly."}, "c24": {"ask": "Lane 6 of the premises brief; its full text is in the Ask of c7 (fix the reply-style conflict). Plan: plans/premise-handoffs-plan.md in the project files.", "note": "Planners already run on Opus with a fresh context per lane, so model and context are not the gap. The gap: a planner plans inside its brief and never doubts it, sees one lane only, and reads a repo that lacks your newest rulings (o5b). Shape, advisor pick Oct 21, not yet ruled: no new reviewer. The planner prompt gains one duty: before planning, list the premises the brief rests on, each with its source ('from notes' or 'measured in run X'), check each against decisions/ and recent rulings, and name any that don't hold and any simpler route. The orchestrator does the same check once, across lanes, when it writes a batch's briefs. Three layers together steer: rulings filed the day they're made (o5b), the question judge (c7), this premise check. Draft with c7. Landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25).", "order": 112, "phase": "cleanup", "status": "done", "title": "Planners check their brief's premises before planning", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your question, Oct 21: can questions steer the work? A question judge (c7) only acts when a session stops to ask; a wrong premise in a plan can reach a PR without ever becoming a question. Today's 'the freeze stops me' was baked into the plan."}, "c25": {"ask": "Lanes 2, 3 and 7 of the premises brief; its full text is in the Ask of c7 (fix the reply-style conflict). Plan: plans/premise-handoffs-plan.md in the project files. Your ruling, Oct 21: evidence lives inside its record; add that clause to cull-rules.", "note": "Done. Landed in #566 (Oct 23, checked at f463787): handoffs carry Goal and Working premises sections, each premise with a source kind (hooks/precompact_handoff_prompt.md, decision precompact-handoff); raw evidence lives in an Evidence section of its record (#562). Your rulings, Oct 21: nudges as fractions of the compaction window, handoff updates on events, owner messages kept verbatim in the PreCompact digest. Compaction stays at 500k; advisor pick (not measured): about 250k for an orchestrator.", "order": 113, "phase": "cleanup", "status": "done", "title": "Handoffs list premises with sources, and raw evidence gets one home", "updatedAt": "2026-10-26T05:30:00Z", "why": "Feedback you brought, Oct 21: lanes reasoned from summaries ('6 to 8 pythons, from notes') instead of the data, and a long-running session carries its own wrong beliefs forward."}, "c26": {"ask": "One rule in CLAUDE.md, amended into an existing rule if one fits rather than a new section: any tracking, logging, monitoring or measuring a session adds must (1) read on demand, at the moment the answer is needed, inside a process that is already running, not on a timer or on every tool call; (2) start no new long-lived process and no extra python or bash where avoidable; (3) state its cost in its record (process starts, files written, how often it runs); and (4) carry a test that proves that cost (for example, zero child processes on its path). A log or file it writes needs a named reader, or it is not written.", "note": "Done: landed in #560, merged Oct 22. Filed Oct 21 from your gripe, during the load brake design (c14, machine-load brake), which is its first user. Pairs with your no-measuring-steps ruling. Can ride with the guard-rule batch (c10, c23), which already edits CLAUDE.md's rule text.", "order": 108, "phase": "cleanup", "status": "done", "title": "Watching costs less than what it watches", "why": "Your gripe, Oct 21: Claude's own tracking, logging and measuring has sometimes cost more than the problem it was meant to solve.", "updatedAt": "2026-10-23T03:10:00Z"}, "c27": {"ask": "Kill guard knows a lane's left-behind server (c27), claude-settings, on this Mac. Goal: a session can stop, by pid, a test server that one of its own lane agents started, after that agent ended. A process this session did not start stays refused. No new per-call cost.\n\nToday (main 149f4bc5): hooks/guard_kill.py foreign_pid_kill(tokens, transcript) allows a kill by pid only when the parent chain reaches this session's claude process. When an agent ends, macOS hands its server to init (PPID 1), so the guard calls it foreign. The one exception, in_own_agent_worktree, needs the cwd inside .claude/worktrees/agent-<id> AND <session>/subagents/agent-<id>.jsonl. Lane agents work in scratchpad folders, and workflow agents keep records under subagents/workflows/, so it never matches them. Decision a-kill-by-pid-needs-an-owned-pid lists this as a known limit.\n\n1. First check, before any code. Start `sleep 600 &` from a Bash call inside a subagent, let the subagent end, and confirm: (a) the sleep's PPID is 1; (b) its environment holds CLAUDE_CODE_SESSION_ID equal to the hook payload's session_id, read the way step 2 will; (c) where the subagent's record landed under subagents/. If (b) fails, stop and report. Do not fall back to path rules.\n\n2. Ownership by inherited tag. In guard_kill.py, beside in_own_agent_worktree: a pid is owned when its PPID is 1 and its environment holds CLAUDE_CODE_SESSION_ID exactly equal to this session's id. guard.py already reads the id with session_id_of(payload); pass it into foreign_pid_kill. Read the environment with no child process: Mac sysctl KERN_PROCARGS2 through ctypes (argv and env come back separately, so a match in argv does not count); Linux /proc/<pid>/environ. Match a whole NAME=value entry, never a substring. Any read failure means foreign. Read it only on the path that already found the pid foreign, so an allowed kill costs nothing new. Keep the worktree exception. Windows stays as today.\n\n3. Reap at session end, not agent end (advisor, Oct 26, after the Mac first check). The session and all its agents share one scratchpad, a server started with `cmd & echo $!` gets PPID 1 as soon as its Bash call ends, and the env tag holds only the session id, so an agent-end reap would stop live servers of the main session and of sibling lanes. So janitor/agent_end_reap.py stays as it is (it reaps only by an agent's own worktree). Add the tag test to janitor/session_end_sweep.py instead: at SessionEnd, stop each process whose PPID is 1, whose env holds CLAUDE_CODE_SESSION_ID exactly equal to the ending session's id, and whose cwd sits in that session's scratchpad. The whole session is ending, so nothing it owns is still in use. Any read failure means keep. The script still always exits 0 and stays inside its timeout. Do not tag servers per agent at launch: no agent id exists in the env, and adding one means rewriting every Bash call, a per-call cost. One shared helper for the tag read, imported by guard_kill.py and session_end_sweep.py. Tests: the SessionEnd reap stops a tagged scratchpad orphan, and keeps one with another session's id, one with no tag, and one outside the scratchpad. Update decision agent-end-reap-stops-what-a-finished-agent-left in place to say scratchpad orphans are reaped at session end, and why.\n\n4. One brief line. Where lane briefs are written (find the home; add no second one): a lane stops each server it started before it ends, by $! from the same call or through the harness.\n\nTests, red on main and green on the fix: a PPID-1 process carrying this session's id is allowed; the same with another session's id is denied; one with no tag is denied; one whose argv, not env, holds the id is denied; pids 0, 1 and -1 stay denied. Add a mutant in hooks/mutate_guard.py that drops the exact-match check, and show a test kills it. Update decision a-kill-by-pid-needs-an-owned-pid in place: one dated owner line (Oct 21, ownership by inherited session tag) and fix its Limits list.\n\nShip as one PR under the repo's normal review and merge rules. Report: the first-check results, diff size per file, test names, the two decisions' before and after text, and the PR.", "note": "Cause, checked at 149f4bc5: hooks/guard_kill.py foreign_pid_kill refuses a kill of a PPID-1 process unless its cwd is in the agent's own worktree, so a scratchpad lane's leftover server can't be stopped; janitor/agent_end_reap.py has the same blind spot. Ruling, Oct 21 (owner): ownership = PPID 1 and the env holds this session's CLAUDE_CODE_SESSION_ID, read only when a kill would otherwise be refused; plus one brief line telling lanes to stop their own servers. Ruling, Oct 26 (advisor pick, after the Mac first check): agents share the session's scratchpad and a backgrounded server is PPID 1 while still in use, so reap tagged scratchpad orphans at SessionEnd in session_end_sweep.py, never at agent end; no per-agent tag. Ruling, Oct 26 06:28 UTC (owner, card): main session only; lanes cannot stop each other's servers. State, Oct 26 06:30 UTC: the old Mac session (branch kill-inherited-session-tag, 168505c3, review round 1 failed on the sibling-lane hole) was archived by the owner; a new Mac session under Remote Control from the local liaison thread continues it: check that the hook payload marks a subagent call, add the main-session-only test, fix the stale timing comment, review, green PR; no self-merge, no rebase; the head goes to the build advisor for the integration batch. Payload check passed, 06:35 UTC: a lane's tool calls carry an agent id and the main session's carry none (forks unchecked; this CLI has no fork agent type). Builder running, then review round 2 on Sonnet, then a draft PR. Brief: briefs/c27-kill-guard-session-tag.md.", "order": 109, "phase": "cleanup", "status": "active", "title": "Let a session stop the test servers its lane agents left", "updatedAt": "2026-10-26T06:35:00Z", "why": "Your report, Oct 21: on Mac, a lane agent's test server is handed to the system (parent pid 1) when the agent ends. The kill guard then calls it foreign and refuses the kill, so the server keeps running and holds its port and memory."}, "c28": {"ask": "Amend output-never-hand-off-doable-step (do a step yourself before handing it to me) in output-styles/shiv-stylisms.md, in place, no new rule: (1) every command left to you comes as its own fenced block, ready to run as is: it starts with the cd it needs, has no placeholders for you to fill (ask first if a value is unknown), and needs no admin; (2) the shell follows where you will run it: a block for the app's Run button can be bash; a block you paste into a terminal on Windows is PowerShell (5.1-safe), since that is the terminal you open; a block that needs Git Bash says 'open Git Bash' on its first line; a Mac block is bash or zsh; never mix shells in one block, and a Mac-only or Windows-only step says which; (3) the block sits outside the report blockquote, because report-to-user-blockquote forbids code fences inside it, and the report names the block in one line. Mechanize cheaply (c26, watching costs less than what it watches): reply_judge.py, the Stop reply check that already runs, flags a reply that hands you a step with no code block. Test: a sample reply that hands off a step with no block is flagged; one with a block passes; red on main.", "note": "Done: landed in #560, merged Oct 22. Checked at 73ed71a: the rule already exists in shiv-stylisms.md (lines 38 to 43) and asks for a runnable bash block outside the report, but it is prose only, says nothing about PowerShell or Mac versus Windows, and sessions still skip it. So this amends that rule and adds a check, rather than adding a second rule. Gripe, Oct 21: the advisor handed you a Git Bash block, and you ran it in PowerShell, where every line failed (no grep, no bash syntax); hence the shell-follows-the-terminal clause. Can ride with the guard-rule batch (c10, c23) or the premises batch (c7, c24, c25), which edits reply hooks. Gripe, Oct 26: the advisor handed you an add-on file to paste under another session's /goal block instead of one complete prompt. Fix in this chat: anything you paste comes as one whole block. No new claude-settings step: this step's rule already covers sessions; the slip was the advisor's.", "order": 109.5, "phase": "cleanup", "status": "done", "title": "A step left to you comes as a command you can run with one click", "why": "Your ask, Oct 21: when a session won't run a command but you can, it should hand you the exact command, preferably bash, so you just press the Run button.", "updatedAt": "2026-10-26T03:08:00Z"}, "c29": {"ask": "Lane after #552 merges, first in line: move decision-watch from classic.Stop to turn.complete. Skip turns with e.agentId set (subagent turns), as session-board does. Build the python input from the session id the mod already keeps from session.start, and find the transcript the way /dw already does, since turn.complete carries no transcript path. Keep one judge at a time and never block the turn. Drop the stop_hook_active skip, which only Stop has. Tests: a main-turn turn.complete starts a judge; one with agentId does not; a classic.Stop no longer does. Bump the mod's version. Live proof on Windows: a STOP seen line (or its renamed TURN seen line) lands in shadow.log after one real turn. Rewrite decision decision-watch-mod-limits in place and close debt dw-stop-row-unproven with the sec-default finding. No Stop hook row comes back.", "note": "Done: #559 (the decision watch judges at turn end), merged Oct 22. Cause found Oct 21: sec-default, the app's own mod, sends every classic.* event past user-tier mods, so decision-watch, which listened only on classic.Stop, never ran on Windows; #559 moved it to turn.complete, which desktop-statusline and session-board already use. Found Oct 26 (checked at 149f4bc): on a Mac every turn read 'UNKNOWN, the mod raised', because the mod needed `which -a python3 python` to exit 0, and a Mac has no `python`. So the watch has never judged a Mac turn. Fix: #580 (decision-watch finds python one name at a time, 0.0.8), green, waiting on a merge (c53, or you on the Mac). It reaches the Mac through c58 (mods update themselves) or a manual `claude plugin update`. Still owed: one live check on each machine that the watch judges a turn (restart the app, take one turn, see shadow.log). Unchecked: whether the installed app package differs from the marketplace copies.", "order": 102.5, "phase": "cleanup", "status": "active", "title": "The decision watch runs again: the app's security mod blocks it on Stop", "why": "Notice you saw, Oct 21: 'decision-watch: its classic.Stop hook was skipped. cc-plugin-sec-default runs first and sent the event on past it.'", "updatedAt": "2026-10-26T05:50:00Z"}, "c3": {"note": "Checked Oct 20 at 84d4076: janitor/sweep.py now runs fetch --prune (records the roots whose fetch failed). Not confirmed: that a test goes red on an unfetched remote commit, and the q_max keep-reason counts the brief asked for (session report not seen in the advisor chat). Lesson, Oct 19: a session cannot see the advisor chat, so a brief that cites an owner ruling must state the ruling itself.", "order": 30, "phase": "cleanup", "status": "done", "title": "Fix the janitor sweep", "updatedAt": "2026-10-20T16:55:00Z", "why": "It never fetches, so one unfetched remote commit makes it keep every worktree as unreadable. Fetch first, and skip remote heads the clone lacks."}, "c30": {"ask": "Amend git-integration-branch-merge in place (CLAUDE.md line 56 at 73ed71a), no new rule. (1) Today: 'Never push to a ready PR while its CI runs.' New: 'Never push to a ready PR while its CI run can still go green. Once a job is red, push the lane drop or the lane fix at once; the push cancels the old run, and the new run is the re-run.' (2) Today a red lane is always dropped and fixed in its own lane for the next batch. Add: a red check is instead fixed in its lane and the lane re-merged, when all hold: the fix is a few lines in the failing lane's own files; the failing check is about form (record format, version bump, lint), not a behaviour test; it is the lane's first such fix in this batch (a second red drops it); and the fix goes on the lane branch, never in the batch branch. A lane red on a behaviour test is dropped as today, with any lane that depends on it. Reason lines: a red run cannot merge, so waiting only delays the re-run; dropping a chain of lanes for a one-line form fix costs a batch cycle for nothing (owner, Oct 21). No guard. Update the rule's row in docs/records.md if it quotes the clause. Small, fits the rule-text batch (c10, c26, c28, c20).", "note": "Done: landed in #560, merged Oct 22. Your rulings, Oct 21: (1) the rule needs correcting, not the session (batch #552's first run: a red Mod version bump check on lane #549 while the old head's macOS job still ran; the red gates job had skipped 30 later steps anyway). (2) Your gripe, same day: #552's second run went red on the Ruling kind check (decision shell-scripts-check-out-lf in lane #554 had Kind: build but no Plan: line); #558's line-ending test needs #554's rule and #557 is merged into #554, so the drop rule would have dropped three lanes for a one-line fix. Your ruling, Oct 21: agreed, the in-lane fix exception as written in the Ask. Advice sent: fix the line on #554's branch, re-merge, push at once; and ask why local checks missed it before the lane joined. The advisor's first answer on (1), keep the rule and add a guard, is withdrawn.", "order": 109.7, "phase": "cleanup", "status": "done", "title": "A red batch run gets its fix or drop pushed at once", "why": "Your gripe, Oct 21: a session pushed a lane drop to the ready batch PR while a job of its red run was still going, against the rule, and reported it as a deviation.", "updatedAt": "2026-10-23T03:10:00Z"}, "c31": {"ask": "Two parts. (1) Add a Notification hook (Claude Code fires it when a session waits on you); settings.json has none at 6c187c78. It sends you one alert you will see away from the terminal: a desktop notification on Windows and Mac, and optionally a phone push; your pick of channel. It runs only when it fires, so it costs nothing per tool call (c26). (2) Amend the question rule in place: a session that asks you a question keeps working on anything that does not depend on the answer, and says in the question what it is doing meanwhile. Tests: a Notification payload triggers one alert; nothing else does.", "note": "Done, closed with no code, Oct 26. Test (you, in a plain session): a desktop banner arrived for a session's question, so the app already alerts you. Part 2 is on main (#576: a question names what the session does meanwhile). No phone push added; reopen if a gap recurs while you are away from the desk. Note: the question reviewer refused a plain test question for lacking 'Based on:' and a recommendation, a small cost.", "order": 103.7, "phase": "cleanup", "status": "done", "title": "A question waiting on you reaches you, and work goes on meanwhile", "updatedAt": "2026-10-26T05:35:00Z", "why": "Your gripe, Oct 22: the goal session likely sat about 5 hours (17:11 to 22:24 CDT Oct 21, no commits on #559's branch) on a question you never saw."}, "c32": {"ask": "# c32. Sessions ask an outside advisor first; only the owner's calls reach the owner\n\nStatus: probe done, all four yes (Oct 22, owner's machine). Next: owner sets up the advisor\n(files in advisor-setup/), then a claude-settings session adds the asking rule (brief below).\nChecked claude-settings at 11f5e4f.\n\nWhy outside: the advisor works because it is not bound by claude-settings (its rules, hooks,\nstyle), holds the whole plan and the owner's rulings, and judges without doing the work. A hook\nor session inside claude-settings is the old orchestrator model and loses all three.\n\nHow it runs (measured Oct 22):\n- A terminal session in C:\\advisor with CLAUDE_CONFIG_DIR=~\\.claude-advisor. Its CLAUDE.md is\n  the advisor instructions. Result: no claude-settings CLAUDE.md, no hook text, default style.\n- Its sessions folder is a junction to ~\\.claude\\sessions, the list of running sessions. Result:\n  its ListAgents shows the 17 desktop sessions, and a ping to one came back \"pong\".\n  claude-settings only reads that folder (hooks/guard_core.py session_records), so the junction\n  lets nothing of claude-settings in.\n- The folder sits outside the home folder: Claude Code reads CLAUDE.md in every parent folder,\n  so under ~ it offered to import the claude-settings CLAUDE.md.\n- Ruled out: the desktop app (it loads ~\\.claude, and refuses CLAUDE_CONFIG_DIR per environment;\n  a second desktop app copy is untested); this cloud project as advisor (local sessions cannot\n  see project threads).\n- The advisor reads claude-settings with git fetch and git show only. Pull, merge or the\n  installer would copy the claude-settings rules into its config folder.\n\nSetup (advisor-setup/ in project files): CLAUDE.md (advisor instructions plus \"Answering working\nsessions\"), settings.json for C:\\advisor\\.claude (hooks off, a backstop), start-advisor.ps1\n(makes the junction, sets the config folder, starts the session). The advisor's name in\nListAgents is \"advisor-\" plus a random suffix (seen: advisor-ed, advisor-be).\n\nBrief for a claude-settings session (after the owner confirms the advisor is running):\nAdd one rule, in its one home, tested: when a session has a question for the owner, it first runs\nListAgents and sends the question by SendMessage to the session whose name starts \"advisor-\",\nthen keeps working on anything that does not depend on the answer. No advisor running: ask the\nowner as today. Always the owner, never the advisor: merges, raising a model to Opus, the\noverride pass, anything that cannot be undone, any goal change, and anything the advisor marks\n\"ask the owner\". An advisor answer is never the owner's word, so it lifts no guard and grants no\npass. The report lists each advisor answer under \"Decided by the advisor\". Test: a fixture\nsession with a question and a running advisor sends to the advisor and does not ask the owner;\na merge question goes to the owner; red on main. Unknown: whether a hook can see that an advisor\nsession is running, or the rule stays in CLAUDE.md only.\n\nOwner's ruling, Oct 22: briefs and plans live in C:\\advisor, a private git repo (advisor-setup/advisor.zip\nholds the starting copy). The advisor commits and pushes each brief there.\nc7 (one question reviewer) hands this advisor the check of each question's premises against\ndecisions/ and recent rulings.\n", "note": "Done, then superseded. Landed in #566 (Oct 23): rule questions-ask-advisor-first and a 'Decided by the advisor' report section (checked at f463787). Your ruling, Oct 26 (c51): the terminal advisor is retired, and questions go to you.", "order": 103.8, "phase": "cleanup", "status": "done", "title": "Sessions ask an outside advisor first; only your calls reach you", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your note, Oct 22: you paste the advisor's answers back into sessions almost word for word. Your ruling, Oct 22: the advisor's value is that it sits outside claude-settings, so the fix must not be a hook or session inside it (that is the old orchestrator model, which never worked as well)."}, "c33": {"ask": "# c33. Sessions in repos with no CI still catch and fix their errors\n\nChecked Oct 22: banchi (6c3a171), q_max (b47bd00) and home-app (956e1ab) have CI workflows.\nhome (3fbb3d1) has none: CLAUDE.md, README.md, records/ (29 Markdown records, a TSV, a JSON) and\ntools/ (deploy-degen.sh, ha-ws.mjs, lan_check.py, lan_check_resolve.py).\n- home's CLAUDE.md grants Claude merges of records-only PRs \"once their checks pass\". With no CI,\n  no check ever runs, so the grant's condition is empty.\n- claude-settings' merge tool (merge/merge.py at 987f682) refuses a repo with no required checks\n  (\"no required checks are named\"), so a session in home cannot use it.\n- Unknown: which errors home sessions actually hit. Owner to name one if it is something else.\n\nAdvisor pick: give home a small CI, not a no-CI mode in the rules. Every rule that assumes CI\n(the merge gate, never merge failing CI, the red-batch flow, c15 and c21 moving checks into CI)\nthen works in home unchanged.\n\nBrief, home session:\n1. Add .github/workflows/check.yml on pull_request, one job \"check\", under 5 minutes:\n   - Markdown links in records/ resolve (reuse claude-settings' actions/readme-links action;\n     do not copy it);\n   - python -m py_compile tools/*.py; node --check tools/ha-ws.mjs; shellcheck tools/*.sh;\n   - every records/*.json parses.\n2. Add .github/stamp.json with merge.requiredChecks [\"check\"] (copy the shape from claude-settings), so the\n   merge tool and the grant both see it. Branch protection on main is optional and needs the owner's login.\n3. Test: a PR with a broken record link goes red, and the same PR fixed goes green.\nReport: the workflow, the red and green run links, and anything the first run flags on main.\n", "note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (home repo work; you settle the plan first).\nChecked Oct 22: only home has no CI (banchi, q_max, home-app have workflows). home's merge grant ('once their checks pass') has nothing to check, and the claude-settings merge tool refuses a repo with no required checks. Advisor pick: give home a small CI rather than a no-CI mode in the rules. Unknown: which errors home sessions actually hit. Interacts with c15: moving STE checks to CI removes them from a repo with no CI, which this fixes for home. Oct 25: brief point 2 now names the check in .github/stamp.json merge.requiredChecks (the merge tool reads it first; branch protection is optional), per what c42 found. Not in goal 3: a home session runs it. Placed after c42 (triage, Oct 26): runs in the home repo, by a home session; cleanup work stays ahead of Organize.", "order": 109.7, "phase": "cleanup", "status": "todo", "title": "Sessions in repos with no CI still catch and fix their errors", "updatedAt": "2026-10-26T06:00:00Z", "why": "Your question, Oct 22: sessions in repos with no CI run into errors that need fixing. The rules assume CI: CI is the merge gate (roles-each-layer-proves-once), never merge failing CI, the red-CI drop-and-fix flow (c30), and c15 and c21 move checks from edit time into CI. In a repo without CI, each of those has nothing to read."}, "c34": {"ask": "# c34. The merge tool waits for CI to finish, not for a fixed 30 minutes\n\nChecked claude-settings main at 987f682 and batch branch batch-oct22c (#562).\n\nCause: .github/stamp.json sets merge.deadlineMinutes to 30 (merge/merge.py MERGE_DEFAULTS is 45).\nThe CI jobs' own caps in .github/workflows/gates.yml are longer: one job has timeout-minutes 36\non main, and #562 raises the macOS job to 50. So a green but slow run outlasts the wait, as on\n#562 on Oct 22. actions/stamp/README.md already says to set deadlineMinutes \"to a bit more than\nyour slowest required check\"; nothing checks that it is.\n\nBrief, claude-settings (after #562 merges, or as a lane in the next batch):\n1. Set merge.deadlineMinutes in .github/stamp.json to the largest timeout-minutes of a job in\n   .github/workflows plus 5 (55 once #562 is on main).\n2. Add one check, in the home that already validates stamp.json (find it; extend it, do not add a\n   second): it fails when deadlineMinutes is below the largest job timeout-minutes in the\n   workflows. Test: red on main (30 below 36), green after step 1.\n3. The report-gate timing test that failed once in a full run and passed alone: run it 20 times on\n   main. If it fails, fix the cause (the time it reads, or what it races), never add a retry or\n   a longer sleep. If it never fails, say so and change nothing.\nReport: the files changed, the test red then green, and the 20-run count.\n", "note": "Done. Cause: the merge tool's 30-minute wait was shorter than CI's longest job cap. Your word, Oct 23: keep the job caps (a hung job would hold a batch for 6 hours; macOS minutes cost the most), and the merge wait follows the longest cap plus 5. Built with c39 in one lane, ci-time-caps. Landed in #566 (checked at f463787): merge.deadlineMinutes is 55 in .github/stamp.json, the largest cap (50) plus 5, and a check holds it there.", "order": 111.6, "phase": "cleanup", "status": "done", "title": "The merge tool waits for CI to finish, not for a fixed 30 minutes", "updatedAt": "2026-10-26T05:35:00Z", "why": "Oct 22: the merge tool's 30-minute wait ran out while #562's last Windows job was still running; nothing was red, and the session had to start the wait again. The same day the macOS job cap was raised from 25 to 50 minutes because it kept cancelling the batch's macOS job, and one timing test in the report-gate tests failed once in a full run and passed alone."}, "c35": {"title": "ste-lint's audit step stops importing Python files from the linted repo", "status": "done", "phase": "cleanup", "order": 111.7, "why": "Oct 21 security scan: in scope 'all', a json.py or ste_emit.py committed at a linted repo's root runs as code in the CI job. Confirmed on main at 987f682.", "note": "Filed Oct 22 from the owner's pasted scan finding. Advisor take, Oct 22: real defect, low risk today. claude-settings runs scope 'all' only on a manual dispatch (the nightly run uses scope changed), with contents: read, on its own code; only people who can already push code could plant the file. Whether banchi, q_max or home-app call this action with scope 'all', or from a pull_request_target job: unknown, not checked. Fix is a few lines; good as a small lane in the next batch. Landed in #566 (ste-lint-import-path lane), checked at claude-settings f463787 (main, Oct 25): the summary runs from a script in EMIT_DIR, not python3 -c in the linted repo.", "updatedAt": "2026-10-25T19:45:00Z", "ask": "# c35. ste-lint's audit step stops importing Python files from the linted repo\n\nChecked claude-settings main at 987f682. Source: security scan finding, Oct 21\n(claude.ai/security/findings/find_01GxVuZJgUrxVcwEbj5qLfgn). Confirmed by hand on Python 3.13.\n\nCause: actions/ste-lint/run.sh cds to the linted repo's root (line 9), then in scope 'all' runs\n`python3 -c 'import json, sys; from ste_emit import emit; ...'` (line 131). Under `-c`, Python puts\nthe current directory first on sys.path, ahead of PYTHONPATH and the standard library. A json.py,\njson/ package or ste_emit.py at the linted repo's root runs in place of the real module. The other\nthree python3 calls in run.sh run script files (the linter, HUNK_MAP_PY, SPLIT_PY), so sys.path[0]\nis the script's own folder, not the repo; they are safe.\n\nBrief, claude-settings (small lane, next batch):\n1. Move the line-131 summary into a script file written next to ste_emit.py in $EMIT_DIR, the same\n   way HUNK_MAP_PY and SPLIT_PY already work, and run it with `python3 \"$EMIT_DIR/summary.py\" ...`.\n   Do not use `-I` (it drops PYTHONPATH, so ste_emit stops loading) or `-P` (needs 3.11+).\n2. Add a case to actions/ste-lint/test_action.py: fixture repos with json.py, or json/__init__.py, plus ste_emit.py at the root, each\n   writing a marker file, plus one .md file. Run with SCOPE=all and SCOPE=changed. Pass: no marker\n   file, and the summary table and annotations still appear. Show it red on main, green after 1.\n3. Add one sentence to action.yml's scope description: the action runs no code from the linted tree.\nReport: files changed, the test red then green.\n"}, "c36": {"title": "Local sessions pick up merged settings on their own", "phase": "cleanup", "status": "done", "order": 111.8, "why": "Oct 22: the owner's Mac ran claude-settings 174 commits behind origin/main, so Mac sessions used old rules and hooks, and nothing showed it.", "note": "Filed Oct 23 from a prompt the Mac session wrote. Checked at 1842e56: the SessionStart hook tests for a .git folder, but the live copy is a worktree (its .git is a file), so the pull never runs; a pull could not work there anyway (detached HEAD); install.sh reinstalls whatever local main holds; output goes to /dev/null. Advisor ruling, Oct 23 (goal-2 session asked): the old line 'if main is checked out anywhere, skip' would skip on every normal clone, so the hook fast-forwards whichever tree holds main when it is on main with no tracked changes (as merge.py and launch.py already do), else leaves it and logs one line; the pin still follows local main. Windows has the same fault (MINGW branch runs nothing) and this lane fixes it too, per the brief. Measured Oct 23: Windows clone on main with 2 untracked stray files and no tracked change, 0 behind; pin at 1842e56 = origin/main. Brief: batch 2 of briefs/cleanup-goal-2-oct23.md (full text on c37). Landed in #568 (batch-oct23c, Oct 23), checked at claude-settings f463787 (main, Oct 25): the SessionStart hook finds the clone from the pin, fast-forwards local main (or the tree that holds it, when clean), then runs merge/install_from_main.sh; Windows fixed too. Not checked: whether your Mac and Windows pins now match main after a session start; check with git -C <pin> rev-parse HEAD.", "ask": "See c37 (goal 2), batch 2.", "updatedAt": "2026-10-25T19:45:00Z"}, "c37": {"ask": "Goal 3 brief (briefs/cleanup-goal-3-oct25.md); its batch 2 carries this step's parts 2 and 3. Goal 2's text stays in briefs/cleanup-goal-2-oct23.md.\n\n# Goal 3: close the cleanup phase of claude-settings\n\nPaste this whole file to one fresh claude-settings session with `/goal finish this end to end`.\nWritten by the advisor, Oct 25, against main f463787 (#572). Goal 2 (briefs/cleanup-goal-2-oct23.md)\nis done except its two Mac batches; this goal finishes those and the last cleanup steps. Each batch\nis its own integration PR, under the usual rules (git-integration-branch-merge,\nroles-review-cap-three).\n\n## 0. First, before any work\n\n1. Save this file as `~/.claude/handoffs/goal-cleanup-3.md`. Put that path on the Goal line of\n   your handoff. After every compaction, read it again before you act.\n2. Check each \"checked at\" fact against current main. A fact that no longer holds: re-plan that\n   lane and say so in the report. A lane whose work is already on main: skip it, say so.\n3. Open PRs at writing time: #571 (bin/ios-ship, one shared tool to ship iOS apps) and the guard\n   cull lane (branch guard-cull-gh-api: delete gh-api-method, owner's word Oct 25, typed as the\n   override for the hole review round 1 found). The owner said both are merging. Confirm with\n   `gh pr list --state open`; take over any that are not merged and drive them to green.\n4. Confirm the live settings match main on this machine: `git -C <pin> rev-parse HEAD` against\n   `git rev-parse origin/main`, read right after this session started. Equal: the session-start\n   auto-pull (#568) works here; say so. Behind: say so with both commits, then reinstall with\n   `bash merge/install_from_main.sh` from the clone, and treat the auto-pull as a red finding for\n   batch 1.\n\n## Pace (from goal 2, unchanged)\n\nNo fixed lane cap: start every ready lane that touches no other open lane's files; the load brake\ndecides. Never idle: while CI runs, build the next batch's lanes as drafts. Questions go to the\nadvisor first (rule questions-ask-advisor-first); only the owner's calls wait for the owner, and an\nunanswered question parks only its item. At each batch merge, report four numbers from git and\nGitHub (no new log): wall-clock from first lane commit to merge; lanes run and the most at once;\nminutes with no lane running and why; brake refusals with their readings.\n\n## Handoff rules\n\nAs in goal 2: the handoff holds Goal, State (each open lane and PR with its plain name, branch, last\nCI head and verdict), owner rulings with their record, open questions and what you do meanwhile,\nthe next action, and working premises with sources. Update it on events. After a compaction: this\nfile, then the handoff, then `git fetch` and `gh pr list --state open`. Trust GitHub over the\nhandoff.\n\n## Stop points (the only places you wait for the owner)\n\n- Batch 3, part 1: whether to add an alert at all, after the first check below.\n- Batch 4: the kill guard needs the owner's Mac. On Windows, park it and say so.\nMerges run under decision standing-merge-grant.\n\n## Batch 1. Agents stop their watchers before they report (c43)\n\nFull brief: briefs/c43-agents-stop-their-watchers.md in the advisor repo (owner pastes it, or read\nthe copy in step c43's Ask). Short form: the defect is verified (a subagent that leaves a Monitor\nor a background Bash running after its report wakes once per task end, and the parent gets a new\nnotification each time; advisor probe, Oct 25: 3 notifications from one agent). Lane 1: one\nsentence in each agent file: before the final report, stop every Monitor and background task you\nstarted with TaskStop, and start none after it. Lane 2: extend judge_stop in hooks/guard.py (it\nalready runs on SubagentStop) to read the agent's transcript and block the stop once while a task\nit started is live; never block twice; fail open. Red then green, then one live run.\n\n## Batch 2. A goal run shows its pace, and no brief caps lanes by guess (c37, parts 2 and 3)\n\nGoal 2 used both; neither is in claude-settings yet (checked at f463787).\n1. One rule, in its one home (find it: the orchestrator's roles or parallelism rules in CLAUDE.md,\n   or the skill that plans batches; extend it, add no second home): a brief or plan never caps\n   lanes by a guessed number; the load brake decides when the machine is too loaded.\n2. The batch report rule (reports-order-of-labels and its home) gains the four pace numbers above,\n   read from git and GitHub at report time. No new log, no watcher, no timer.\n3. If a lint already checks report or rule format, extend it so a brief that writes \"one or two at\n   a time\" or \"at most N lanes\" is flagged; otherwise prose only, and say so.\nProof: the rule text lands with its rule anchor; any lint case is red then green.\n\n## Batch 3. A question waiting on the owner reaches the owner (c31)\n\n1. First check, before any code: does the Claude desktop app already alert the owner (a desktop or\n   phone notification) when a session stops on a question? Read the Claude Code docs for the\n   Notification hook and the desktop app's own notifications, and test it once on this machine.\n   Report what fires. Stop point: bring the owner one question: (a) the app already alerts, close\n   c31 with no code (pick, if true); (b) add a Notification hook that sends one desktop alert,\n   costing nothing per tool call; (c) also a phone push, with the channel named.\n2. The question rule already says a session keeps working on what does not depend on the answer\n   (questions-ask-advisor-first). Check it also says the question names what the session does\n   meanwhile; if not, add those words in place.\n\n## Batch 4. Kill guard knows a lane's left-behind server (c27). Mac only.\n\nFull brief: briefs/c27-kill-guard-session-tag.md in the advisor repo (step c27's Ask). Its first\ncheck runs on the Mac before any code and stops the batch if the session tag is not in the\nserver's environment. On Windows, park it and say so.\n\n## Batch 5. Delete the two STE stub scripts (debt ste-stubs-delete)\n\nlint/ste_gate.py and lint/md_sweep.py exit 0 and exist only for old installs whose settings.json\nstill calls them. Check the install log on this machine and ask the owner for the other machine's\npin commit: every install at or past #566 (batch-oct23a, where the STE hooks left settings.json)\nmeans delete both files, their stub cases in lint/test_settings_matcher.py, and the debt. Any\ninstall older, or unknown: keep them and say why.\n\n## Not in this goal\n\n- c33 (home gets a small CI) and c42 (home-app names its merge checks): each is a short session in\n  its own repo, from its own brief in the advisor repo.\n- c41 (Opus for one session without lifting other guards): owner's word, Oct 25, brief it later.\n- c40 (idle desktop sessions burn a core each): the owner's action in the app.\n\n## When the goal is done\n\nReport per the report rules, plus the four pace numbers per batch and in total. List anything\nparked and why. Then the advisor re-measures the cull numbers and reviews the roadmap for the move\nto the Organize phase, which starts with o2 (one layout for every repo; its brief and plan are in\nthe advisor repo).\n", "note": "Done. Causes, Oct 23: a brief capped lanes by guess; the brake misread load; a remedy named a mode this app lacks. Fixes landed: the brake reads memory and disk (c14); rules parallelism-no-guessed-lane-cap and reports-batch-pace-numbers (#576, checked at 149f4bc). Not built: a lint for guessed lane caps (prose only). Pace: goal 1 ran 6 batches over about 2 days, mostly lost to idle gaps; goal 2 merged about 7 PRs in under 7 hours (Oct 23); goal 3's batches 1, 2 and 5 ran three lanes at once in 75 minutes (Oct 25). Your word, Oct 23: an unanswered question parks only its item. Goal 3 closed Oct 26 (owner). Left over: c43 lane 2, c27 (Mac session), c44 (build advisor).", "order": 103.95, "phase": "cleanup", "status": "done", "title": "A goal run paces itself on measured load and shows its pace", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your gripe, Oct 22: goal 1 did decent work but measured compute badly and ran slowly."}, "c38": {"title": "Tests clean up their temp folders, in every repo", "phase": "cleanup", "status": "done", "order": 111.9, "why": "Oct 22: Degen's Swift tests left temp folders that filled the Mac disk (note from the Degen session).", "note": "Pattern from Degen (branch temp-dir-leak): one temp root per repo; a <pid>-<UUID> run folder; every helper takes its folder from it; teardown removes it; the first request of a run removes sibling run folders older than a day (crashed runs) and keeps newer ones (parallel runs); a test proves the sweep. claude-settings has no such rule; the nearest home is the janitor (debt windows-temp-sweep, ruled Oct 16, never built: session temp folders, 17 GB on Windows). Rule only; each repo keeps its own helper, no copying code across repos. Both are lanes in batch 3 of briefs/cleanup-goal-2-oct23.md (full text on c37). Ties to the brake: disk filling up is what full guards. claude-settings part landed in #567 (batch-oct23b, Oct 23), checked at claude-settings f463787 (main, Oct 25): the run-folder standard is in agents/test-author.md, and the janitor removes idle session temp folders on Windows (debt windows-temp-sweep built). Each repo's own helper (Degen's TempDirSupport.swift) stays with that repo; not checked here.", "ask": "See c37 (goal 2), batch 3, lanes test-temp-standard and windows-temp-sweep.", "updatedAt": "2026-10-25T19:45:00Z"}, "c39": {"ask": "See c37 (goal 2), batch 3, lane ci-time-caps.", "note": "Done. Your word, Oct 23. Landed in #566 (checked at f463787): skill ci-hygiene sets a 60-minute cap on a job with fewer
