(() => {
  const DATA = {"steps": {"c1": {"note": "Sent. Stop rule chosen: debts + decisions.", "order": 10, "phase": "cleanup", "status": "done", "title": "Send the cull rulings to the running session", "updatedAt": "2026-10-17T17:20:00Z", "why": "Fast path for deletions, notes tier for unlikely gaps, no history in the tree, prose leaves only with a proving test, a time box, and size numbers each batch."}, "c10": {"ask": "Brief, copied from briefs/c10-c23-guard-grows-then-proves.md and kept in step with it. Paste all of it to a claude-settings session. Covers c10 (lane 1) and l1 (lane 2); prepares c23.\n\nGuard rule amendment and fire counts, claude-settings. Roadmap: c10 (the guard rule, amended) and l1 (track guard refusals per session). This prepares c23 (cull the guard itself), which is not part of this brief. Make it its own small batch after the one running now (the hook import, process-start and Windows lanes), because it touches CLAUDE.md and lint/, and those lanes are already editing files near them. No measuring step; prove each change with a test.\n\nOwner's ruling, Oct 21: let the guard grow while things change, then cull what never proved itself. No freeze was ever in force. The current rule stays and gets wider.\n\nLane 1, amend building-guard-needs-incident in place. CLAUDE.md, around line 82: \"Build a new guard or gate rule only against a named incident or a measured risk. Cite it in the rule's record.\" Rewrite it in place, as one rule with no new section, to say:\n- A new guard or gate rule may land for a named incident, a measured risk, or a likely risk (likely to hit in normal work, the same bar debts use).\n- Its record says which of the three it is, and the date the rule landed.\n- At each cull, a guard rule that never fired in guard.log since it landed, and whose record names no incident, is deleted with its code and tests.\nUpdate the rule's row in docs/records.md (line 77) and in lint/rule_mechanisms.json, whose reason text names only \"a named incident or measured risk\". Record the ruling in place under decisions/ if a decision holds this rule; otherwise in the rule's record. One-line reason: \"grow while things change, then cull what never fired (owner, Oct 21)\". Report the rule text before and after, and the word change.\n\nLane 2, rules that never fired show up. lint/guard_log_report.py already prints deny, ask and noted counts per rule from guard.log, and guard.log is never pruned. The gap: a rule that never fired has no line, so it never appears, and those are exactly the rules a cull is looking for. Add a flag (for example --all-rules) that lists every rule id the guard and the gates can emit, each with its counts, including 0, plus the date of the rule's first guard.log line (or \"never\"). Take the rule ids from their one home in the code, not a copied list (rule building-allow-list-is-the-constant). Let --days take \"all\" for the whole log. Tests: a rule with no lines shows 0 and \"never\"; a rule with lines shows its counts and first date; the list matches the constant, red on main and green on the fix.\n\nDo not delete any guard rule in this batch. That is c23, the guard cull, after this lands.\n\nReport: per lane, what changed and the test that proves it; the rule text before and after; and one run of the new report on this machine with --all-rules --days all, pasted in full, so the cull can start from it.", "note": "Done: landed in #560 (rule text batch), merged Oct 22. No freeze was ever in force; this step was only a plan until Oct 21. Your ruling, Oct 21: amend building-guard-needs-incident (CLAUDE.md line 82 at 5584d1b) in place. A new guard or gate rule may land for a named incident, a measured risk or a likely risk; its record says which and the date it landed; at each cull, a rule that never fired in guard.log and names no incident is deleted with its code and tests (c23, the guard cull). Last measured Oct 20 at 84d4076: decisions 100, debt files 47, hook lines 49,261, CLAUDE.md 2,399 words.", "order": 106, "phase": "cleanup", "status": "done", "title": "Let the guard grow, then cull what never fired", "updatedAt": "2026-10-23T03:10:00Z", "why": "Your ruling, Oct 21: no freeze. A guard may grow while things change; the cull removes what never proved itself."}, "c100": {"title": "The waiting page gets its final look, in every repo at once", "phase": "cleanup", "status": "done", "order": 103.396, "why": "Your worry, Oct 26: \"is it already too late to decide the look ... I realize i allowed a beta to be the final product\". It is not too late: every repo's page comes from one template, skills/waiting-page/page.html.", "note": "Done: #682 merged in batch #683 (main b031394f, Oct 27 04:15 CDT). Republishing the live pages, review-page items 2, 3 and 5, and small page defects moved to c121 and c122. Final design (version 13): https://claude.ai/artifact/2DodmME3zxVTmi26B3KzBR, source plans/waiting-mockups/final-combined.html, with the template change list in its Design notes. shiv approved the final design Oct 27 02:38 CDT (\"Approved\", cmsg_01DoF7thf3iq2Srr1UsfXgh28T1okSz7qJT6gkwr4EowHq). It holds: one stable list in three tiers (Blocking, Upcoming, Whenever) derived from holds and by fields; related items in one frame with one sentence; a slim 44px repo-colour header, contrast-checked, with a colour drawn from the name when a repo has none (c105); state colours turned away from the repo hue; nothing preselected, my pick starred, Take my pick in one tap, one Send with a stamp and Undo (closes c74); a receipts trail that needs c99; a left overview in plain words (progress, ready count, each tier with its numbers), no symbol key; labels shown once (c106); Designs tab with inline mockups in a sheet (c112); a last \"Pick stands\" section for questions that change no rule, where my pick goes unless changed (shiv, Oct 27 02:27 CDT). Next: a build lane on skills/waiting-page. Port: yes, through the skill. Deferred (shiv, Oct 27 04:22 CDT): the live waiting pages (home-app, degen, mailaudit) belong to a third account; both the cloud and the Mac get 404. shiv was asked to share them. Republish brief: briefs/c100-republish-live-pages.md; it uses main's page.html directly.", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# Brief: c100, the waiting page gets its final look, in every repo at once\n\nRepo: shivinate7/claude-settings. One screen lane: builder, then design reviewer, then reviewer. Runs beside c105.\n\n## Task\nRebuild `skills/waiting-page/page.html` to match the approved final design. Every repo's page comes from this one template.\n- Design: https://claude.ai/artifact/2DodmME3zxVTmi26B3KzBR. The source is `/mnt/project-files/plans/waiting-mockups/final-combined.html`. Its \"Design notes\" view lists the template changes. Build what that list names. Treat the page's sample items and repo chips as mockup only.\n- Must hold: one stable list in three tiers (Blocking, Upcoming, Whenever), derived from holds and by fields. Related items share one frame with one sentence. A slim 44px repo-colour header. State colours turned away from the repo hue. Nothing preselected; my pick starred, with Take my pick in one tap. One Send with a stamp and Undo. A receipts trail (c99's data). A left overview in plain words, with no symbol key. Each label shown once (c106). A Designs tab with inline mockups in a sheet (c112, which lands here). A last \"Pick stands\" section.\n- Repo colour: the page takes one brand hex and derives its `--r-*` tokens with contrast checks. c105 supplies the hex through `colour_for(repo)` in `docs/design/repo-colours.json`. Until c105 merges, use the page's neutral defaults; do not draw a colour in the page.\n- Update `skills/waiting-page/SKILL.md` where the page's data fields change (stands, related frame, tiers). Keep the page's store keys, so answers already saved on each repo's live page survive a republish.\n\n## Rulings\n- shiv approved the final look, Oct 27 02:38 CDT (\"Approved\", cmsg_01DoF7thf3iq2Srr1UsfXgh28T1okSz7qJT6gkwr4EowHq), and Oct 27 01:01 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2RuC7HdpGEa99YN7j3ztLUk).\n- Pick stands, shiv Oct 27 02:27 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2XJphRcvzru8mtAcr3kFpGu): a question that changes no rule carries `stands: true`, sits in the last section, and my pick goes with the next Send unless changed. A question that touches a rule starts blank.\n- Review-page standard, in roadmap/outbox/waiting-page-design.md on the roadmap branch.\n- verification-screens-verdict: a verdict per screen at phone and desktop width, light and dark.\n\n## Failure classes\n- A saved answer lost on republish (store keys changed).\n- A stands item sent without the owner seeing it in the last section.\n- A preselected option on a rule question.\n- A layout shift when an answer is picked or sent.\n- Contrast below 4.5:1 for text on the repo header, for any registry colour.\n\n## Check that proves it done\n`skills/waiting-page/tests/page.test.mjs` gets new cases first, red on the old page, then green. Screen verdicts come from `bin/shoot` in headless Chromium at 390 and 1280, light and dark. The design reviewer judges against the mockup. Also run lint/rule_audit.py, lint/test_check_skill_model_rows.py and bin/ste-changed origin/main. Republish no live page; that happens after merge.\n\n## Report\nAt most 20 lines: PR, head, red run, green run, screen verdicts, review verdicts.\n"}, "c101": {"title": "A report gate never makes a session send its whole report twice", "phase": "cleanup", "status": "done", "order": 103.336, "why": "Your gripe, Oct 26 21:12 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2AjLVc1rPD2aAWQzxYqqPyH, a mailaudit session): the full report printed twice, the second copy only to fix \"BUILT\" to \"OTHER\" and add model names.", "note": "Done, Oct 27: lane PR 669 landed in batch PR 671 (main 6902807). Merged to main in batch PR #671 (merge commit 6902807); lane PR #669 (a report gate never asks for the report again), head 6615fd8. Once the report is in the reply, the Done-label, model-name, Unstarted and cite-gloss blocks end with one tail: post only the corrected lines, never the report again. The missing-report block still asks for the report. A correction runs with stop_hook_active set, so the gate stays quiet on it. Red on main 835cde5, green on head; fresh Sonnet review round 1 clear. Known gap, not fixed: a report sent after a missing-report block is never checked for model names or the Unstarted line (gate is quiet on the rewrite).", "updatedAt": "2026-10-27T05:05:00Z", "ask": "# c101: a report gate never makes a session send its whole report twice\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main 835cde5 or newer.\nclaude-settings only. Never rebase onto main after review. Send the green, reviewed head to the\nbuild advisor (read the roster in the project instructions); never merge.\n\n## Goal\n\nWhen lint/report_gate.py (a Stop hook) blocks a reply, the session sends only the corrected\nlines, never the whole report again. Incident: shiv's gripe Oct 26 21:12 CDT, a mailaudit\nsession printed its full report twice to change BUILT to OTHER and add model names.\n\n## Inputs\n\n- lint/report_gate.py: every block text. The missing-report block already says \"Keep the reply\n  above it as it stands. Do not write it again.\" (commit e2ac83bc). Find each other block\n  (report shape, model names, Unstarted line, cite gloss, label words) and make its text say:\n  post only the corrected lines, as a short correction, never the report again.\n- Decision reply-judge-samples-never-blocks: add one line for this gate. Find the record with\n  `python3 lint/hook_catalog.py` output or docs/records.md.\n- A Stop hook cannot see a reply before it is shown; do not try to make it pre-check.\n- Check the gate accepts the short correction as a pass on its next run (a correction-only reply\n  must not trip the same gate again). If it would, say so and fix it.\n\n## Proof\n\nTest-author first: one case per block asserting its text tells the session to post only the\ncorrected lines, red on main; one case that a correction-only follow-up passes. Then green.\nRun lint/test_*.py that cover report_gate, `bin/ste-changed origin/main`, and the quick checks:\nrule_audit, test_check_glossary, check_mod_versions, hook_catalog --check, check_silent_undo.\n\n## Report\n\nAt most 25 lines: PR, head, red-run proof, verdicts, reviewer verdict (fresh Sonnet reviewer;\nthe diff changes a gate). Port: yes, the gate is global.\n"}, "c102": {"title": "A question whose pick can be undone is taken, not asked", "phase": "cleanup", "status": "done", "order": 103.337, "why": "Coordinator, Oct 27, on the same mailaudit report: Input Needed item 1 (link the waiting page now with a folder move, or later) had a pick, later, that changes nothing and can be undone, yet the session asked.", "note": "Done: merged to main in batch PR 671 (merge 6902807), Oct 26 23:25 CDT; lane PR 670 closed as replaced. Rule questions-go-to-owner now says: do not ask for a pick that parallelism-keep-going lets the session take; take it and name it under Done. The Stop reply judge notes such an Input Needed item and never blocks. Red first (3 of 39 cases on main). Live Haiku at xhigh: incident flagged 2/2; merge, goal, Opus switch, another repo not flagged. Sonnet review: round 1 fix (two exceptions), round 2 clear. Port: yes, global rule.", "updatedAt": "2026-10-27T04:30:00Z", "ask": "# c102: a question whose pick can be undone is taken, not asked\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main 835cde5 or newer.\nclaude-settings only. Never rebase onto main after review. Send the green, reviewed head to the\nbuild advisor; never merge.\n\n## Goal\n\nA session that has a question with a safe pick that can be undone takes that pick, names it under\nDone, and does not ask. It asks only when the pick cannot be undone or changes the owner's goal.\nIncident (coordinator, Oct 27): a mailaudit report asked \"link the waiting page now with a folder\nmove, or later\"; \"later\" changed nothing and could be undone.\n\n## Inputs\n\n- CLAUDE.md rule questions-go-to-owner and its decision docs/decisions/questions-go-to-owner.md:\n  amend in place, in STE, fewest words. Keep c84's and c98's sentences.\n- Rule parallelism-keep-going (follow-ups found by the session) already says the same for\n  follow-ups; cite it, do not duplicate it.\n- hooks/reply_judge.py: add a judged note (never a block; decision\n  reply-judge-samples-never-blocks) for an Input Needed item whose pick the judge reads as\n  undoable. Keep its cost as the decision states it.\n- rule_audit pins: if the amended rule changes its mechanism count, move the pin in the same commit\n  and say why.\n\n## Proof\n\nTest-author first: reply-judge fixture cases red on main (an undoable-pick question flagged; an\nirreversible one and a goal change not flagged), then green. Quick checks: rule_audit,\ntest_check_glossary, check_mod_versions, hook_catalog --check, check_silent_undo,\n`bin/ste-changed origin/main`, and the reply-judge suite.\n\n## Report\n\nAt most 25 lines: PR, head, red-run proof, verdicts, reviewer verdict (fresh Sonnet reviewer).\nPort: yes, global rule.\n"}, "c103": {"title": "Your feedback is caught with no magic words", "phase": "cleanup", "status": "done", "order": 103.338, "why": "Your gripe, Oct 26 20:52 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2WqEF4ndJe1iyteivbK1QYm): the fb: and fb done setup is archaic and needs an overhaul. Ruling, Oct 26 20:57 CDT (decision card): A now, C later.", "note": "Option A is built and merged: PR #674 (catch owner feedback with no magic words), merged Oct 27 00:41 CDT. Every owner message goes to the inbox. The Stop gate asks for items only on a burst: two or more messages in a turn, or one message of three or more non-blank lines or two or more bullets. fb, fb done, the 10-minute timer and the Sonnet judge are gone. Decision owner-feedback-inbox is rewritten in place. Review found two low gaps, filed as debt notes: untagged relay prompts count toward a burst, and turn-state indexes drift if inbox blocks are reordered. Option C stays with c104.", "updatedAt": "2026-10-27T06:05:00Z", "ask": "# c103: your feedback is caught with no magic words (option A)\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main 6902807 or newer.\nclaude-settings only. Never rebase onto main after review. Send the green, reviewed head to the\nbuild advisor; never merge.\n\n## Goal\n\nEvery owner message is captured with no \"fb\" or \"fb done\". Ruling: Oct 26 20:57 CDT decision card,\noption A now (C later is c104). Brief source: https://claude.ai/artifact/NGf6aaaVp2bF1i3kyhF5HD.\n\n## Inputs\n\n- hooks/local_time.py, hooks/feedback_gate.py, hooks/feedback_judge.py, decision\n  owner-feedback-inbox, and the debt notes on close-word edge cases.\n- Build: capture every owner message; the Stop jot gate asks for items only on a burst (two or more\n  owner messages in a turn, or one message of three or more non-blank lines or two or more bullets).\n- Delete fb, fb done, the 10-minute timer and the Sonnet judge, with their tests, settings rows,\n  catalog rows and debt notes. Rewrite decision owner-feedback-inbox in place in the same lane.\n- A deletion that drops lines needs a `Drops-lines` trailer in the commit message.\n- check_landed_dirs, hook_catalog and agent-model-cap rows must follow the deletions.\n\n## Proof\n\nTest-author first: burst and non-burst cases red on main, then green; one-line messages never\ntrigger the gate. Quick checks: rule_audit, test_check_glossary, check_mod_versions, hook_catalog --check,\ncheck_silent_undo --strict, shellcheck on changed *.sh, `bin/ste-changed origin/main`, and the touched suites.\n\n## Report\n\nAt most 25 lines: draft PR, head, red-run proof, verdicts, reviewer verdict (fresh Sonnet reviewer).\nPort: yes, hooks install everywhere.\n"}, "c104": {"title": "A notes box on the waiting page feeds your feedback inbox", "phase": "cleanup", "status": "todo", "order": 103.397, "why": "Your ruling, Oct 26 20:57 CDT: option C of the feedback overhaul comes later.", "note": "A notes box on the waiting page writes into the same inbox as c103. Due after: c99 (a save wakes the session) runs on a real page, and each repo's page roll-out. Port: yes, with the waiting page. Placed after c100 (triage, Oct 27): it needs the page's final look first.", "updatedAt": "2026-10-27T02:30:00Z"}, "c105": {"title": "One shared colour wheel gives every repo its own colour", "phase": "cleanup", "status": "done", "order": 103.3965, "why": "Your word, Oct 26 20:37 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh28ATeFWrfZMPFYdrqu75pev, waiting-page design thread).", "note": "Done: #681 merged in batch #683 (main b031394f, Oct 27 04:15 CDT). A repo with no colour of its own gets one drawn from its name: a hue at least 25 degrees from the three state hues (red 5, amber 36, green 145) and at least 30 degrees from every other repo's hue. The same wheel guides a repo that later picks its own scheme. Home in claude-settings: a registry of each repo's colour plus the rule, read by the waiting-page template and any repo's design work. Needs no answer. Rides with c100. Port: yes, that is its point. Placed after c100 (triage, Oct 27): the page's final look reads it. Built: PR #681 merged Oct 27 (registry docs/design/repo-colours.json plus colour_for in lint/repo_colour.py). Drawn: ios-adblock magenta, adblock-lists green, home olive. Open for shiv, no block: degen keeps a blue close to home-app and banchi, with no recorded reason (could take a wheel colour); home merged into home-app and could take its blue.", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# Brief: c105, one shared colour wheel gives every repo its own colour\n\nRepo: shivinate7/claude-settings. One lane, builder then reviewer. Runs beside c100.\n\n## Task\nGive every repo one brand colour from one home.\n- Registry: `docs/design/repo-colours.json`. It holds the rule and each repo's colour: `{\"rule\": {...}, \"repos\": {\"<repo>\": \"#rrggbb\"}}`. It is installed with docs/design, so every repo's session reads it.\n- One function, `colour_for(repo)`, in one script (for example `lint/repo_colour.py`, CLI `python3 lint/repo_colour.py <repo>` prints the hex). It returns the registry colour when the repo has one. Otherwise it draws one from the name: a hue at least 25 degrees from each state hue (red 5, amber 36, green 145) and at least 30 degrees from every other registered repo's hue. The same name always gives the same hue.\n- Fill the registry for the ten repos in scope today: claude-settings, home-app, home, banchi, q_max, degen, ios-adblock, adblock-lists, mailaudit, joyous. Keep a repo's own colour where it has one (banchi's mark palette, mailaudit's parchment, and so on); read it from the repo, never guess.\n- The interface for c100: the waiting-page skill passes one hex from `colour_for` to the page. c100 builds the page side. Do not edit `skills/waiting-page/page.html`.\n\n## Rulings\n- shiv, Oct 26 20:37 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh28ATeFWrfZMPFYdrqu75pev): the wheel rule above.\n- building-one-home-per-capability: one registry and one function; no second copy in the page.\n\n## Failure classes\n- A drawn hue that lands within the margins of a state hue or another repo.\n- Two runs giving two hues for one name.\n- A hue wrap bug at 0 and 360 degrees.\n\n## Check that proves it done\nA new test file (stdlib only) goes red on the old tree and green on the new one. It covers the margins, wrap, determinism, a registry hit, and the CLI. Also run lint/rule_audit.py, lint/test_check_landed_dirs.py, lint/hook_catalog.py --check and bin/ste-changed origin/main.\n\n## Report\nAt most 15 lines: PR, head, red run, green run, review verdict.\n"}, "c106": {"title": "A label or status word appears once per screen", "phase": "cleanup", "status": "done", "order": 103.3966, "why": "Your gripe, Oct 26 20:40 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh29zJop1bPGnHHvh3PdBpCpn): \"blocking\", \"upcoming\" and \"whenever\" show 3 or more times on a page; too much verbiage.", "note": "Fixed in the waiting-page mockup (each label once, shapes elsewhere). For every repo: a screen rule in ux/ that a label or status word appears once per screen, and every other place uses its shape or colour; the design reviewer checks it on each screen lane. Needs no answer. Port: yes, every repo with screens. Placed after c105 (triage, Oct 27): it rides with the waiting page's final look. Merged as #673 in batch #677 (main 92bb864, Oct 27 00:41 CDT).", "updatedAt": "2026-10-27T06:05:00Z", "ask": "# c106: a label or status word appears once per screen\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main 6902807 or newer.\nclaude-settings only. Never rebase onto main after review. Send the green, reviewed head to the\nbuild advisor; never merge.\n\n## Goal\n\nOn any screen, a label or status word (\"blocking\", \"upcoming\", \"whenever\") appears once; every\nother place uses its shape or colour. Owner gripe, Oct 26 20:40 CDT: too much verbiage.\n\n## Inputs\n\n- docs/design/ (installed to ~/.claude/docs/design/): add the screen rule to the right file\n  (principles.md or checklist.md), STE, fewest words.\n- agents/design-reviewer.md and skills/design-review/SKILL.md: the reviewer checks it on each screen.\n- If a cheap stdlib probe can count repeated label words in a rendered page's text, add it to the\n  design-review steps; otherwise mark the rule judgment in rule_mechanisms.json.\n\n## Proof\n\nIf a probe lands: a fixture page with \"blocking\" three times, red first, then green. Otherwise\nthe docs and agent checks only. Quick checks: rule_audit, test_check_glossary, check_mod_versions, hook_catalog --check,\ncheck_silent_undo --strict, shellcheck on changed *.sh, `bin/ste-changed origin/main`, and the touched suites.\n\n## Report\n\nAt most 25 lines: draft PR, head, red-run proof, verdicts, reviewer verdict (fresh Sonnet reviewer).\nPort: yes, every repo with screens.\n"}, "c107": {"title": "An orchestrator starts its lanes with no click from you", "phase": "cleanup", "status": "active", "order": 103.339, "why": "Your gripe, Oct 26 21:13 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2MqbYDeMhgjWP54XKb1P71s, screenshot): the degen orchestrator on the Mac desktop app needed you to accept each of four sessions it started with start_session, even in Bypass permissions mode.", "note": "Goal: an orchestrator starts its lanes with no click from you. Step 1, Oct 27 (Mac): start_session starts a lane with no card only on a turn you started for work you asked for in words; any other call kind waits on your card or is refused. Step 2 (doing, dispatched Oct 27 09:25 CDT): orchestrators start lanes as background subagents in their own worktrees, not as separate sessions, and the orchestrate skill says so; user_asked stays for sessions you asked for in words. Brief: briefs/c107-lanes-as-subagents.md. The opening question (\"Start the JD, Duo, Pills and records sessions now?\") is c79's. The Mac needs c119's fix to get any of it. Needs no answer. Port: yes; global settings. Placed ahead of c93, after c103 (triage, Oct 27): every orchestrator on the Mac hits it. Step 2 landed in #697 (2ca89254) as decision lanes-start-as-agents; c119, the Mac reinstall fix, is done. Left: one live check on the Mac that an orchestrator's lane starts as a background agent with no card (checked Oct 28 on main 0fb91de: no orchestrate skill exists; the decision record is the home). Waits on: a Mac check.", "updatedAt": "2026-10-28T05:58:00Z", "ask": "# c107 step 2: an orchestrator starts its lanes with no click from shiv\n\nRecord-writer lane, claude-settings, from main. Report cap: 20 lines.\n\n## What is settled (local liaison, Oct 27, from the start_session contract; see c107's note)\n\n- `start_session` with kind `offer` always waits on shiv's card.\n- Kind `user_asked` starts at once, but only on a turn shiv started, for work he asked for in words.\n- Kind `own_initiative` leaves a card for a week.\n- On a turn started by another session's message, the app refuses a start.\n\nSo no setting removes the card. An orchestrator that starts lanes with `start_session` makes\nshiv click for each one, as the degen orchestrator did on Oct 26 21:13 CDT.\n\n## The task\n\nWrite one decision record, slug `lanes-start-as-subagents` (32 characters or fewer, `id: pending`\nif the repo's records carry ids), under `docs/decisions/`, in the shape the folder's other records\nuse (ruling, why, limits, risk kind, cost, Kind and Plan lines). Its ruling:\n\n1. An orchestrator starts each lane as a background Agent spawn with `isolation: 'worktree'`\n   (`lanes-start-in-tool-worktrees`, lanes start only in the tool's own worktrees). This needs no click.\n2. It uses `start_session` only when shiv's own message, on the current turn, asked for a\n   separate session in words. Then the kind is `user_asked`. It never uses `user_asked` for work\n   shiv did not ask for, and never starts a session on a turn another session's message started.\n3. A lane `parallelism-keep-going` (keep going) lets start with no question is a background\n   spawn, never a session.\n\nName the limits: a background spawn shares the orchestrator's machine and the load brake\n(`machine-load-brake`); it dies with the orchestrator's session; a lane that must outlive it is\nshiv's ask for a session.\n\nRisk kind: incident (Oct 26 21:13 CDT, four accept clicks). Mechanized: no. Say what a check\nwould have to see (the turn's starter, which no hook payload carries).\n\nAdd the record to any index the repo keeps (`docs/catalog.md` if it lists decisions; run the\nrecord checks). Change no code, no CLAUDE.md and no settings.\n\n## Done when\n\n`bin/ci-job gates --base origin/main` passes (record slug, STE lint, record shape). Commit trailers\nas the project requires. Push the lane branch, send the green, reviewed head to the build advisor,\nand never merge.\n"}, "c108": {"title": "The decision watch says once, plainly, when a folder has no git repo", "phase": "cleanup", "status": "done", "order": 103.398, "why": "Your gripe (cmsg_01DoF7thf3iq2Srr1UsfXgh2TkqfzhdXsXZHkAN93aqYpf): every turn in a folder that is not a git repo shows \"UNKNOWN, git status could not be read\".", "note": "Checked main e305bdb: hooks/decision_watch.py's changed_this_turn gives no answer when the folder is not a git work tree, and test case_not_a_repo pins that on purpose. On your Mac, /Users/shivinate/Developer, _targets, beli-export and degen-scratch are not repos; every repo there reads git status in under 2.2 s (10 s timeout), so a timeout is not the cause (measured Oct 27). A notice that repeats every turn teaches you to scroll past it. Ruling, Oct 27 23:48 CDT (shiv, waiting page item 8, a, accepted pick): say it once per session in plain words, then stay quiet. Green and reviewed Oct 28: draft PR #734 (554bab4), red then green, Opus review clear; waits for a batch. Reviewer notes (rare): a folder with GIT_DIR set now hears \"not a git repo\" once; an unreadable parent reads as no repo. Lane: notes the no-repo case once per session; case_not_a_repo changes to expect one line, then silence; red first on today's every-turn notice. Needs no answer. Port: no; it lives in claude-settings, so every repo gets it. Placed after c104 (triage, Oct 27). Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #734.", "updatedAt": "2026-10-28T06:45:00Z"}, "c109": {"title": "A blind design brief is built from a template that cannot carry today's screen", "phase": "cleanup", "status": "done", "order": 103.3395, "why": "Your gripe, Oct 26 22:58 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh25oZAnWn5W9c5JNRybsYuw9): every Duo mockup for mailaudit copied the current app; the orchestrator's one brief said \"Duo layouts must keep that look\", sent the designer to the web app first, asked to rearrange the three existing views, and held every variable but one.", "note": "Done: merged as #676 in batch #678 (main 724b7a70, Oct 27 01:40 CDT). Two low review findings are notes in docs/debts/notes.md (blind-brief-word-list-misses, blind-brief-count-unchecked). What went wrong: the session ran no blind lane at all, and its one brief carried today's screens and a keep rule. d10 (designer lanes: blind, informed, directed; skill design-explore, merged Oct 26 22:10 CDT, after that session started) says a blind brief that names the current screen is a defect, but only in prose: the orchestrator still writes the brief by hand, may change the lane mix, and nothing reads the brief. Fix, needs no answer, on top of d10: (1) design-explore builds each blind brief from a fixed template: the user's job in their words, the device and its poses, the house rules and the brand palette only; (2) a check refuses a blind brief that names a current view, a screenshot or mockup path, the spec, or a keep or match rule, and refuses an explore run with no blind lane unless you asked for none; (3) design-review flags a set of mockups that all share today's structure. Red first on the Duo brief. Port: yes; the skills install everywhere. Placed ahead of c93, after c107 (triage, Oct 27): every design round in every repo rests on its briefs. Sent back from batch #677 (Oct 27): it calls the guard_core names lane C renamed (set_pass_context, set_pass_veto), so on the merged tree an override cannot lift its deny; now alone in batch #678 on 92bb864.", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# c109: a blind design brief is built from a template that cannot carry today's screen\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main 6902807 or newer.\nclaude-settings only. Never rebase onto main after review. Send the green, reviewed head to the\nbuild advisor; never merge.\n\n## Goal\n\nA blind designer lane never sees the current screen. Incident: Oct 26 22:58 CDT, every Duo mockup\nfor mailaudit copied the current app; its one brief named today's views and a keep rule.\n\n## Inputs\n\n- skills/design-explore/SKILL.md (d10, blind, informed and directed designer lanes), agents/designer.md,\n  skills/design-review/SKILL.md.\n- (1) design-explore builds each blind brief from a fixed template: the user's job in their words,\n  the device and its poses, the house rules and the brand palette only.\n- (2) A stdlib check refuses a blind brief that names a current view, a screenshot or mockup path,\n  the spec, or a keep or match rule; and refuses an explore run with no blind lane unless the owner\n  asked for none. Wire it where design-explore writes briefs.\n- (3) design-review flags a mockup set that all share today's structure.\n- New check: check_landed_dirs, hook_catalog and rule_audit as they require.\n\n## Proof\n\nTest-author first: the Duo brief as a fixture, refused red-first; a clean blind brief passes.\nQuick checks: rule_audit, test_check_glossary, check_mod_versions, hook_catalog --check,\ncheck_silent_undo --strict, shellcheck on changed *.sh, `bin/ste-changed origin/main`, and the touched suites.\n\n## Report\n\nAt most 25 lines: draft PR, head, red-run proof, verdicts, reviewer verdict (fresh Sonnet reviewer).\nPort: yes, skills install everywhere.\n"}, "c11": {"note": "Done Oct 19: the sentence 'A check that enforces a rule in this file needs no other incident.' is gone from CLAUDE.md on main (checked at 960cc63, after #515 and #516). Decided 10:42 am, option A. Measured basis: of 99 rule rows, 6 are guard rows hanging off CLAUDE.md rules, none citing an incident; guard code names at least 37 rules. The bigger lever stays reviewer variant hunting.", "order": 96, "phase": "cleanup", "status": "done", "title": "Close the no-incident exception in building-guard-needs-incident", "updatedAt": "2026-10-19T18:55:00Z", "why": "The rule says a new guard needs a named incident or a measured risk, then adds: 'A check that enforces a rule in this file needs no other incident.' So any CLAUDE.md rule can get a guard with no incident, and the freeze (c10) has a hole."}, "c110": {"title": "A lane dropped from a batch never loses its files when it merges main", "phase": "cleanup", "status": "done", "order": 103.3046, "why": "Finding, Oct 27 (c88's lane and the build advisor): batch #663 dropped c88 with a revert of its merge; when the lane later merged main, the revert silently deleted 11 of its 13 files, and only files both sides edited showed as conflicts.", "note": "Cause: rule git-integration-branch-merge dropped a lane by a revert that then lands on main; a lane that merges main takes that removal. Built: draft PR #675 (merge refuses a batch that drops a lane by a revert), head 22eb127, green and reviewed (three Sonnet rounds, net value positive), sent to the build advisor Oct 27. merge.py refuses at preview and before the claim, with the remedy \"rebuild the batch branch from main without the lane\"; a failed read refuses unless --undo-check-unknown-ok. The rule now says rebuild, never revert, and a lane dropped by a revert re-applies its diff after it merges main and checks each file. Known gap, in the decision: a lane that joined with no merge commit and left by a plain revert is not seen. Port: yes; the rule is global. Merged as #675 in batch #677 (main 92bb864, Oct 27 00:41 CDT). Placed ahead of c111 (triage, Oct 27): a dropped lane can lose work on every batch.", "updatedAt": "2026-10-27T06:05:00Z", "ask": "# c110: a lane dropped from a batch never loses its files when it merges main\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main 6902807 or newer.\nclaude-settings only. Never rebase onto main after review. Send the green, reviewed head to the\nbuild advisor; never merge.\n\n## Goal\n\nDropping a lane from a batch never puts a removal commit on main. Incident (Oct 27): batch #663\ndropped c88 by reverting its merge; when the lane later merged main, the revert silently deleted\n11 of its 13 files.\n\n## Inputs\n\n- CLAUDE.md rule git-integration-branch-merge and its decision: say a lane is dropped by\n  rebuilding the batch branch from main without it, never by a revert. Add one sentence: a lane\n  dropped before this rule re-applies its diff after it merges main, and checks that every file\n  survives. Amend in place, STE, fewest words. o13 lane C also edits this rule's paragraph; keep\n  your edit small so the batch merge is easy.\n- merge/ tooling: if merge.py or its preview can see a revert of a lane merge in the batch range,\n  refuse with a remedy that says \"rebuild the branch without the lane\". If no clean hook point\n  exists, say so and ship the rule alone.\n- rule_audit pins: move them in the same commit if the mechanism count changes, and say why.\n\n## Proof\n\nTest-author first: a merge test red on main for a batch range holding a revert of a lane merge,\nthen green; a plain batch still passes.\nQuick checks: rule_audit, test_check_glossary, check_mod_versions, hook_catalog --check,\ncheck_silent_undo --strict, shellcheck on changed *.sh, `bin/ste-changed origin/main`, and the touched suites.\n\n## Report\n\nAt most 25 lines: draft PR, head, red-run proof, verdicts, reviewer verdict (fresh Sonnet reviewer).\nPort: yes, global rule.\n"}, "c111": {"title": "The silent-undo check reads a Drops-lines line above the posting tool's footer", "phase": "cleanup", "status": "done", "order": 103.3047, "why": "Defect, Oct 26 22:55 CDT (build advisor): batch #668 went red because a Drops-lines line in its PR body did not count.", "note": "lint/check_silent_undo.py reads only the PR body's last paragraph and skips a closing paragraph only when it is the \"Generated with [Claude Code]\" line. The GitHub posting tool appends a different footer (a --- rule, then \"_Generated by [Claude Code](...)_\"), so the Drops-lines line above it is never read. Worked around in #671 with a commit trailer. Fix, needs no answer: skip that footer form too, with a test red on main. Port: no; the check lives in claude-settings and installs with it. Placed ahead of c82, after c110 (triage, Oct 27): it turns batches red for nothing. Merged as #672 in batch #677 (main 92bb864, Oct 27 00:41 CDT).", "updatedAt": "2026-10-27T06:05:00Z", "ask": "# c111: the silent-undo check reads a Drops-lines line above the posting footer\n\nCloud build thread brief. Build advisor (7), Oct 27, against claude-settings main 6902807 or newer.\nclaude-settings only. Never rebase onto main after review. Send the green, reviewed head to the\nbuild advisor; never merge.\n\n## Goal\n\nA `Drops-lines: <path> -- <reason>` line in a PR body counts when the GitHub posting tool's\nfooter follows it. Incident: batch #668 went red for nothing (Oct 26 22:55 CDT).\n\n## Inputs\n\n- lint/check_silent_undo.py, function `allowed`: it skips a closing paragraph only when it is the\n  \"Generated with [Claude Code](https://claude.com/claude-code)\" line. Also skip the posting\n  footer: a `---` rule, then `_Generated by [Claude Code](<any url>)_`, as one paragraph or two.\n- Do not widen what counts: only footer paragraphs are skipped; the last real paragraph still rules.\n\n## Proof\n\nTest-author first: cases in lint/test_check_silent_undo.py red on main (the #668 body shape), then\ngreen; a body whose Drops-lines line sits above a non-footer paragraph still does not count.\nQuick checks: rule_audit, test_check_glossary, check_mod_versions, hook_catalog --check,\ncheck_silent_undo --strict, shellcheck on changed *.sh, `bin/ste-changed origin/main`, and the touched suites.\n\n## Report\n\nAt most 25 lines: draft PR, head, red-run proof, verdicts, reviewer verdict (fresh Sonnet reviewer).\nPort: no.\n"}, "c112": {"title": "The waiting page shows each open question's mockup in a Designs tab", "phase": "cleanup", "status": "done", "order": 103.3967, "why": "Your idea, via the coordinator, and your word (cmsg_01DoF7thf3iq2Srr1UsfXgh2NiD3qW1ALmG6Ty5dJjHHeS): full mockups inline on the waiting page, so mockups stop arriving as separate artifacts.", "note": "Done: checked on main d4e1b86 (triage, Oct 27): skills/waiting-page/page.html has the Designs tab and its sandboxed frame; it landed with c100 in batch #683. A question may carry designs: [{slug, label}]; its card shows the full mockup in a sandboxed frame, and a Designs tab pages through every design whose question is open. Each mockup is stored whole in the page and leaves at the next republish once its question is answered. Designers (d10) hand their mockup HTML to the page's owner session instead of publishing it. Checked Oct 26 22:58 CDT: 16 MB per page and about 52 KB per mockup, so about 300 fit; other artifacts cannot be framed and the asset store refuses HTML, so inline is the only route. Measured Oct 26 23:10 CDT: the claude.ai viewer shows the inline mockup (shiv). Rides with c100 and c99. Port: yes, with the waiting page. Placed after c106 (triage, Oct 27): it rides with the page's final look.", "updatedAt": "2026-10-27T14:30:00Z"}, "c113": {"title": "Each repo names its mockup devices in order, and a mockup shows the first unless asked", "phase": "cleanup", "status": "done", "order": 103.3396, "why": "Your word, Oct 26 23:52 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2NHAwYrKyU3AX4LqKSKG3Um): degen's mockups were all on a regular iPhone; they should default to the iPhone Duo folded (small screen), then unfolded (large), then a regular iPhone, and usually one is enough. Refinement, Oct 26 23:53 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2YazfDQj6vg4pRv1fgSyNcH): some repos are web apps, and your phones should not be repeated in each repo.", "note": "Done: built with c115 as #686, merged in batch #690 (main 2e5fde3, Oct 27 07:45 CDT). claude-settings defines your devices once (iPhone Duo folded, Duo unfolded, regular iPhone, desktop width) and a default order per app kind: iOS starts with the Duo folded, then unfolded, then regular iPhone; web starts with a phone width, then desktop. Each repo names only its app kind in its layout config, and lists devices only where it differs. The designer agent and skill design-explore read the resolved list; a mockup draws the first device only, the rest on request or when the layout breaks between them. The iOS standard (c91, skill ios-apps) names the iOS kind for your iOS repos (degen, mailaudit, home-app, ios-adblock); web repos name the web kind at their visit. Needs no answer. Port: yes; the devices and kinds are global, each repo names only its kind. Placed ahead of c93, after c109 (triage, Oct 27): both shape every blind brief, and c109's template names the device from this list. Built, Oct 27 (CDT 04:45): claude-settings draft PR #686 (each repo names its app kind and caution level), head 044eb71, reviewed clear in two rounds, merged to main Oct 27 07:39 CDT. No device size is written anywhere, so each prints \"size not written\" until one is measured. Each repo resolves to public until its own lane adds kind and visibility to its layout extras file; home's login fix takes effect only then, and that needs your go-ahead as a change in another repo. Merged Oct 27 in batch #690 as 2e5fde3 (builder sonnet, reviewer sonnet).", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# Brief: c113 and c115, each repo names its app kind and its caution level\n\nRepo: shivinate7/claude-settings, from main b031394f. One lane: builder (sonnet), then reviewer (sonnet). One config, built together. Do not push to any other repo.\n\n## Task\n1. Devices (c113). claude-settings defines the owner's devices once: iPhone Duo folded, iPhone Duo unfolded, regular iPhone, desktop width. It also defines a default order per app kind: `ios` is Duo folded, Duo unfolded, regular iPhone; `web` is a phone width, then desktop. Read the sizes from skill ios-apps and the home-app CLAUDE.md simulator line; never guess a size.\n2. Caution (c115). Two levels, defaulting by visibility: `public` (careful about what lands in commits, PRs and artifacts) and `private-solo` (act freely on the repo's own data and the owner's own systems; guard only real secrets and anything leaving the machine). Each level is a set of facts and expected acts, never a bypass phrase.\n3. One home: extend the layout config that `lint/layout.py` reads (`.claude/layout-extras.json` per repo, defaults in `lint/layout.json`). A repo names `kind` and `caution`, and lists devices only where it differs. Add `python3 lint/layout.py devices <root>` and `python3 lint/layout.py caution <root>` that print the resolved values, or `unknown`.\n4. Readers: the designer agent (`agents/designer.md`), skill design-explore and the blind brief template (`hooks/blind_brief.py`) read the resolved device list; a mockup draws the first device only, the rest on request or when the layout breaks between them. Session start prints the caution level's facts once, so sessions read it and never infer it.\n5. Skill compliance-check lists each repo's own caution rules for the owner to prune (for example home's \"Claude never types a password or token into a field\"). Listing only; change no other repo.\n\n## Rulings\n- shiv, Oct 27 00:30 and 00:31 CDT (step c115): about 1 in 5 home sessions refuse to log in to the owner's own Home Assistant or KEF speakers; the inconsistency is the pain. Never write \"ignore privacy guards\". State facts and expected acts. Credentials come through a tool path; the real limits stay written.\n- building-one-home-per-capability: one config, one reader; no second device list.\n\n## Failure classes\n- A repo with no extras file: must resolve to defaults by visibility, not error. Visibility unknown resolves to `public`.\n- A device list that differs between the designer agent and the brief template.\n- A caution text that reads as permission to skip a guard.\n\n## Check that proves it done\nNew cases in lint/test_layout.py and hooks/test_blind_brief.py, red on main b031394f and green on the branch. Also lint/rule_audit.py, lint/hook_catalog.py --check, lint/test_check_landed_dirs.py, bin/ste-changed origin/main.\n\n## Report\nAt most 20 lines: PR, head, red run, green run, review verdict, and each repo's resolved kind and caution as the lane reads them (a table with a target column). Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c114": {"title": "The CI-read hook reads checks by REST, so cloud sessions see CI", "phase": "cleanup", "status": "done", "order": 103.3048, "why": "Defect, Oct 26 23:30 CDT (build advisor, seen on PR #638): in cloud sessions the hook says \"CI unknown\" after any PR command.", "note": "Done: #685 merged alone in batch #691 (main d4e1b86, Oct 27 08:40 CDT), after a Windows fix (cmd read the & in its REST URL). A PostToolUse Bash hook reads CI with gh pr view, which uses GraphQL; the cloud proxy refuses GraphQL (403), so every read is unknown. Fix, needs no answer: read check runs by REST (gh api repos/<owner>/<repo>/commits/<sha>/check-runs), with a test red on the GraphQL path. Unknown: the hook's file name; the lane finds it on main 6902807. Port: no; the hook installs from claude-settings. Placed ahead of c82, after c111 (triage, Oct 27): every cloud lane waits on CI reads. Merged Oct 27 in batch #691 as d4e1b86 (builder sonnet, reviewer sonnet; Windows fix on try 2).", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# Brief: c114, the CI-read hook reads checks by REST, so cloud sessions see CI\n\nRepo: shivinate7/claude-settings, from main b031394f. One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\n`hooks/ci_wake.py` reads the PR head with `gh pr view ... --json` (its `gh_json([\"pr\", \"view\", ...])` call). `gh pr view` uses GraphQL. The cloud proxy refuses GraphQL with 403, so in a cloud session every watch ends \"CI unknown\".\n- Read the PR head and its state by REST: `gh api repos/<owner>/<repo>/pulls/<n>`. Keep run reads on REST (`gh run list` and `gh api .../actions/runs` are already REST; confirm each one).\n- Keep the output lines and exit codes unchanged.\n- Grep `hooks/` and `lint/` for any other `gh pr view` or `gh pr checks` call that a hook runs in a cloud session. Move those to REST too, or list them in the report as left.\n\n## Rulings\n- building-fix-cause-not-symptom: the cause is the GraphQL path, so no retry or fallback text.\n- building-one-home-per-capability: one REST read helper, used by every caller.\n\n## Failure classes\n- A test that stubs `gh` and so passes on the GraphQL path. The red case must fail when a stub refuses any `gh pr view` / `gh api graphql` call with 403, as the proxy does.\n- A REST field name that differs from the GraphQL one (head sha, draft, state).\n\n## Check that proves it done\nNew cases in `hooks/test_ci_wake.py`: red on main b031394f, green on the branch. Also run lint/hook_catalog.py --check, lint/rule_audit.py, bin/ste-changed origin/main. One live read in this cloud container against an open or recent PR of claude-settings, printed as its one line.\n\n## Report\nAt most 15 lines: PR, head, red run, green run, live read line, review verdict. Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c115": {"title": "Each repo declares how cautious sessions are, so a private solo repo is not treated like a public one", "phase": "cleanup", "status": "done", "order": 103.3398, "why": "Your gripe, Oct 27 00:27 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2KS9SbaQEcZ87zvqdu7NrgF): sessions act equally cautious in every repo; a degen session checked and explained a harmless copy of field names in a private repo only you work in. Each repo carries a different real risk: claude-settings is public, ios-adblock is your own privacy tool.", "note": "Done: built with c113 as #686, merged in batch #690 (main 2e5fde3, Oct 27 07:45 CDT). Pruning each repo's own caution rules stays yours at each repo's visit. Each repo names a caution level beside its app kind (c113's layout config), defaulting by visibility. Public (claude-settings): careful about what lands in commits, PRs and artifacts. Private with you as the only contributor (degen, ios-adblock, home and the rest): act freely on the repo's own data; guard only real secrets and anything leaving the machine. Sessions read the level and never infer caution. Your word, Oct 27 00:30 and 00:31 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh29eQsPK6e3f7b6Pbx6KHSRs, cmsg_01DoF7thf3iq2Srr1UsfXgh2HuxkYsBv3uyhya9nc14ac7): about 1 in 5 home sessions refuse to log in to your own Home Assistant or KEF speakers, and the inconsistency is the pain; never write \"ignore privacy guards\". So each repo states facts and expected acts, never a bypass: what it owns and which logins sessions drive (\"Home Assistant on your network is your own system; you own its credentials; sessions log in and operate it\"). A password made for one device on your network is a low-stakes class whose login works every time. Credentials come through a tool path (env var, keychain, a script), and the real limits stay written. The compliance-check skill lists each repo's caution rules for you to prune (degen's \"keep the raw DM spike out of git\", home's \"Claude never types a password or token into a field\"). Needs no answer. Port: yes; levels live in claude-settings, each repo names its level and facts. Placed after c113 (triage, Oct 27): the same per-repo config, built together. Built, Oct 27 (CDT 04:45): claude-settings draft PR #686 (each repo names its app kind and caution level), head 044eb71, reviewed clear in two rounds, merged to main Oct 27 07:39 CDT. No device size is written anywhere, so each prints \"size not written\" until one is measured. Each repo resolves to public until its own lane adds kind and visibility to its layout extras file; home's login fix takes effect only then, and that needs your go-ahead as a change in another repo. Merged Oct 27 in batch #690 as 2e5fde3 (builder sonnet, reviewer sonnet).", "updatedAt": "2026-10-27T14:30:00Z", "ask": "Built with c113 in one lane. Brief: c113 (briefs/c113-c115-repo-kind-and-caution.md)."}, "c116": {"title": "A session keeps to a limit without narrating it, and names it only when it blocks or changes the plan", "phase": "cleanup", "status": "done", "order": 103.3385, "why": "Your gripe, Oct 27 00:27 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2KS9SbaQEcZ87zvqdu7NrgF): a degen session told you which check it ran before a harmless copy. It saved the fix only as a local memory in that repo.", "note": "Done: #684 merged in batch #690 (main 2e5fde3, Oct 27 07:45 CDT). Left for a local session: delete the degen memory that held the old fix. Rule style-limits-kept-silently in the shiv-stylisms output style (replies to you): keep to a limit or rule silently; name it when it blocks the work or changes the plan. A skipped step or dropped item is still said. The reply judge flags a reply that narrates a kept limit or a held rule, and never flags a reported result or verdict, a blocking limit or a named dropped item. Landed on main in PR #684 through batch PR #690 (merge 2e5fde36), Oct 27 07:39 CDT; builder sonnet, reviewer sonnet. Left: delete the degen local memory that held the old fix (a local session, on that machine). Port: yes, the output style loads in every repo. Merged Oct 27 in batch #690 as 2e5fde3 (builder sonnet, reviewer sonnet).", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# Brief: c116, a session keeps to a limit without narrating it\n\nRepo: shivinate7/claude-settings, from main b031394f. One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\nSessions narrate limits and checks that passed (\"staying under the 15-line cap\", \"rule X holds\"). The owner wants silence unless the limit blocks the work or changes the plan.\n- Add one rule to `output-styles/shiv-stylisms.md`: keep to a limit or rule silently; name it only when it blocks the work or changes the plan. A skipped step or dropped item is still said (building-never-drop-item-silently).\n- Teach the reply judge (`hooks/reply_judge.py`, model from agent-model-cap) to flag a reply that narrates a check that passed or a limit kept. Add its cases to the judge's case file.\n- Keep the rule in the output style only; do not add it to CLAUDE.md (replies to the owner live in the style).\n\n## Rulings\n- shiv, Oct 27 (step c116): the rule above.\n- verification-cry-wolf-guard-is-spent: a reply that says a limit blocked the work, or names a dropped item, must pass.\n\n## Failure classes\n- A flag on \"tests pass\" as a result line in Done (a result is not narration of a kept limit).\n- A judge case file that only holds passing cases.\n\n## Check that proves it done\nNew judge cases, red on main b031394f (the judge passes the narrating reply) and green on the branch, through the judge's offline case runner (hooks/case_runner_test.py or the judge's own test). Also lint/rule_audit.py, lint/hook_catalog.py --check, bin/ste-changed origin/main.\n\n## Report\nAt most 15 lines: PR, head, red run, green run, review verdict. Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c117": {"title": "Scratch deletes name an absolute quoted path, so the dangerous-rm prompt stops firing", "phase": "cleanup", "status": "done", "order": 103.3383, "why": "Your question, Oct 27 00:57 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2TP1sLyjjAdoSo7VKGT4ni8, screenshot): a degen session ran `S=<scratchpad>; cd $S; rm -rf dl/*` and Claude Code asked about a dangerous rm on the worktree's dl/*. You always accept it.", "note": "Done: #688 merged in batch #690 (main 2e5fde3, Oct 27 07:45 CDT). Cause: our command shape. Claude Code cannot follow `cd $S`, so it reads the rm as running in the worktree. That one run was safe (S was set), but the shape is a real risk: if the cd fails, rm -rf dl/* runs in the worktree. Fix: a rule that a delete names its target as an absolute or quoted-variable path (`rm -rf \"$S\"/dl/*`), never `cd X; rm`, and the shared shell guard refuses the `cd ...; rm <relative>` shape, printing the absolute form; red first on the screenshot's command. Also try an allow rule for the session's own scratchpad; whether a permission rule can quiet this built-in prompt is unknown, so measure it. Needs no answer. Port: yes, the guard and rule are global. Placed ahead of c116 (triage, Oct 27): it fires on you many times a day, and a prompt you always accept is spent (verification-cry-wolf-guard-is-spent). Merged Oct 27 in batch #690 as 2e5fde3 (builder sonnet, reviewer sonnet).", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# Brief: c117, scratch deletes name an absolute quoted path\n\nRepo: shivinate7/claude-settings, from main b031394f. One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\nA command shaped `cd \"$S\"; rm -rf dl/*` makes Claude Code's built-in dangerous-rm prompt fire, because it cannot follow the cd. The shape is also a real risk: if the cd fails, the rm runs in the worktree.\n- The guard refuses `cd <X> ; rm -r<...> <relative target>` and `cd <X> && rm -r<...> <relative target>`, and prints the absolute form (`rm -rf \"$S\"/dl/*`) as the remedy. Put the check beside the rm-var family (`hooks/guard_rm_var.py`, reached through `guard.py`), and reuse `split_segments` and `segment_tokens`.\n- Add one rule line to the global CLAUDE.md, in the fewest words: a delete names its target as an absolute or quoted-variable path, never after a cd. Mechanize it with the guard (outcomes-mechanize-rules) and add its row to lint/rule_mechanisms.json.\n- `hooks/rm_prompt_answer.py` already allows a guarded `${NAME:?}` delete in bypass mode. Check that the absolute form the remedy prints passes it.\n- Whether a permission allow rule can quiet the built-in prompt for the session's scratchpad is unknown. Do not build it; say \"unmeasured, needs a local session\" in the report.\n\n## Rulings\n- building-guard-needs-incident: likely risk, seen Oct 27 on the owner's screen (a scratch `cd $S; rm -rf dl/*`).\n- guard-guards-mistakes-only: guard the shape Claude writes, not every shell trick.\n\n## Failure classes\n- A refusal of `cd X && rm -rf /abs/path` (absolute target: must pass).\n- A refusal of `rm` with no `-r` after a cd.\n- A miss when the cd and the rm sit in a subshell or after `set -e`.\n- Comment openers or quotes inside the command (building-scanner-respects-strings).\n\n## Check that proves it done\nNew cases in hooks/test_guard.py: red on main b031394f, green on the branch, with the Oct 27 command as the first case. Also lint/rule_audit.py, lint/hook_catalog.py --check, bin/ste-changed origin/main.\n\n## Report\nAt most 15 lines: PR, head, red run, green run, review verdict. Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c118": {"title": "A decision always reaches a pick you can click: the question box, or the waiting page while work runs", "phase": "cleanup", "status": "done", "order": 103.3381, "why": "Your report, Oct 27 01:08 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2GRNiefnBpdPZFSr1xudMLJ, screenshot), seen for months: a session puts an A-or-B pick (degen's Faves import: stack a save's files or not) inside its end-of-turn report under Input Needed, with no question box.", "note": "Done: #687 merged in batch #690 (main 2e5fde3, Oct 27 07:45 CDT). Cause, two parts (checked on claude-settings main 92bb864). (1) Since Oct 27 this is partly by design: c84 and c86 refuse the question box while the session's own agents or background commands run (the Faves copy was running), and the rule questions-go-to-owner sends the question to the reply and the waiting page instead. Whether degen's waiting page got this item is unknown. (2) The months before: the report format has an Input Needed label, and nothing checks that a pick with options leaves the report; the model writes it as text. The grey bar on the screenshot is the report's quoted block, not a hook. Fix: a Stop check that reads Input Needed; a pick with options passes only if the same turn opened the question box (nothing running) or wrote the item to the repo's waiting page (work running), and its reply links the page. Red first on the screenshot's report. Needs no answer. Port: yes, the check installs in every repo's sessions. Placed ahead of c117 (triage, Oct 27): a pick lost in a report stalls the work until you notice it. Merged Oct 27 in batch #690 as 2e5fde3 (builder sonnet, reviewer sonnet).", "updatedAt": "2026-10-27T14:30:00Z", "ask": "# Brief: c118, a decision always reaches a pick you can click\n\nRepo: shivinate7/claude-settings, from main b031394f. One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\nA report's Input Needed can hold a pick with options, written as text only. Nothing checks that the pick reached a control the owner can click.\n- Extend the Stop report gate, `lint/report_gate.py` (one home; do not add a second Stop hook).\n- When the last reply has an Input Needed label that holds a pick with options, the stop passes only when the same turn did one of these:\n  1. opened the question box (the AskUserQuestion tool), with nothing of the session's own running; or\n  2. wrote the item to the repo's waiting page (an `ArtifactData` `set items/<id>` call to the URL `python3 lint/layout.py waiting-page <root>` prints), and the reply links that page.\n- When the repo has no waiting page, case 1 is the only pass. The refusal says what to do in one line, and never names a forbidden target (git-remedy-never-names-target).\n- Define \"a pick with options\" narrowly: lettered or numbered options, or \"A or B\" under Input Needed. Name the pattern in the code and in the record.\n\n## Rulings\n- questions-go-to-owner (CLAUDE.md): with work running, ask in the reply and on the page, never in the box. c84 and c86 already refuse the box while work runs; read them, do not duplicate them.\n- verification-cry-wolf-guard-is-spent: an Input Needed with no options (a plain ask) must pass.\n- building-guard-needs-incident: the record names the incident: a degen report on Oct 27 put a pick in Input Needed as text, and the owner found it late.\n\n## Failure classes\n- A false refusal on Input Needed text that only quotes an earlier answer.\n- A pass on a page write to another repo's page.\n- A transcript read that misses a tool call in a subagent's lines (read only the main session's turn).\n\n## Check that proves it done\nNew cases red on main b031394f and green on the branch, in the report gate's test file. Also lint/rule_audit.py, lint/hook_catalog.py --check, lint/test_settings_matcher.py, bin/ste-changed origin/main.\n\n## Report\nAt most 15 lines: PR, head, red run, green run, review verdict. Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c119": {"title": "A Mac session can pick up merged claude-settings work without auto mode refusing the reinstall", "phase": "cleanup", "status": "done", "order": 103.3389, "why": "Build advisor finding, Oct 27 04:25 CDT: the Mac's auto mode refused a claude-settings reinstall as \"Self-Modification\", so a Mac session cannot pick up merged work by reinstalling.", "note": "Measured Oct 27 09:18 CDT (Mac, local liaison): the Mac does not pick up merges. Its pin (~/Developer/claude-settings-live) sits at 2ad85de6 while main is d4e1b86b. The SessionStart hook runs, also under Remote Control, but install_from_main.sh exits 1 (\"the pinned checkout has tracked changes\") on every start. Cause: ~/.claude/settings.json links into the pin, and whatever saves a setting (app or CLI, unconfirmed) rewrites it with keys reordered and no value changed, which dirties the pin. Fix (cloud lane, with the build advisor): the installer treats a settings.json equal to HEAD's as parsed JSON as clean, or settings.json stops linking into the pin; red first on a reordered file. One-time Mac unblock done Oct 27 09:30 CDT: shiv restored the pin's settings.json and ran the installer; pin now equals main d4e1b86b, clean (checked by the local liaison). The auto-mode \"Self-Modification\" refusal only bites a manual mid-session reinstall, which this makes unneeded. Briefs: briefs/c119-mac-picks-up-merges.md (measure), briefs/c119-pin-clean-on-reorder.md (fix, dispatched Oct 27 09:40 CDT). Needs no answer. Port: no; it is claude-settings' own installer. Placed ahead of c107 (triage, Oct 27): every merged fix waits on it to reach your Mac. Merged in #697 (2ca89254), Oct 27 11:01 CDT.", "updatedAt": "2026-10-27T16:05:00Z", "ask": "# c119: a settings save that only reorders keys must not stop the pin from moving\n\nBuilder lane, claude-settings, from main d4e1b86b. Report cap: 25 lines.\n\n## The defect (measured on the Mac, Oct 27 09:18 CDT)\n\n~/.claude/settings.json is a link into the pin. A settings save (app or CLI) rewrites the file\nwith its keys reordered and no value changed. `merge/install_from_main.sh`'s `move_pin` then sees a\ntracked change in the pin and fails with \"the pinned checkout ... has tracked changes\" on every\nsession start. The Mac's pin is stuck at 2ad85de6, so no merge reaches it.\n\n## The fix\n\nIn `merge/install_from_main.sh`, before the tracked-changes refusal in `move_pin`: when the only\ntracked change in the pin is `settings.json`, and it parses to the same JSON as `HEAD:settings.json`,\nrestore it from HEAD (`git -C \"$pin\" checkout -- settings.json`) and go on. Any other change, or a\nvalue change in settings.json, still refuses as today. Compare with `python3 -c` (json.load, `==`).\nWith no working python3, or a file that does not parse, keep today's refusal: fail safe.\n\nUse the same check in the old-tree sweep (the loop that skips a tree with tracked changes), so an\nold tree holding only a reordered settings.json is removed and not kept for ever.\n\nDo not stop linking settings.json into the pin. That is the larger change, and this one is enough.\n\n## Tests (red first, in merge/test_install_from_main.sh)\n\n1. A pin whose settings.json holds HEAD's keys in another order: the pin moves to main, and the\n   pin's settings.json equals main's. Red on main.\n2. A pin whose settings.json changes one value: still refused, pin not moved.\n3. A pin with the reorder plus a change to another tracked file: still refused.\n4. An old `-live-<hex>` tree with only a reordered settings.json is swept.\n\n## Done when\n\nThe four cases pass, `bash merge/test_install_from_main.sh` is green, and `bin/ci-job gates --base\norigin/main` passes. Commit trailers as the project requires. Push the lane branch, send the green,\nreviewed head to the build advisor, and never merge.\n\n## Note for the advisor, not the lane\n\nThe session-start hook runs `bash merge/install_from_main.sh` from the clone after it fast-forwards\nlocal main, so once this merges, a Mac clone on main self-heals at its next session start with no\nmanual step. A clone checked out on another branch runs that branch's copy and does not.\n"}, "c12": {"note": "Done, checked Oct 20 at 84d4076. agents/builder.md: 'Never run the full suites locally. When your lane changes a file a mutation harness targets, run that harness once through verdict before pushing.' CLAUDE.md: 'CI is the merge gate for the full suites and the mutation harnesses.' Unknown: the wall time of one harness run (the brief asked the lane to record it; no record found in the repo). If runs prove slow, option B (anchor-only flag) is the fallback.", "order": 97, "phase": "cleanup", "status": "done", "title": "Builders run the mutation harness once before pushing a guard change", "updatedAt": "2026-10-20T16:55:00Z", "why": "A guard edit that moves a mutation's anchor text is caught only in CI today, which costs a red batch: drop the lane, re-run, open a fix lane. Five anchor re-point commits Oct 15-19 (40f4f251, f5e9ce3f, b700ade4, a3f56cb4, 3e23abf7). How many turned a batch red is unknown."}, "c120": {"title": "The macOS stall-watch test stops failing at random", "phase": "cleanup", "status": "done", "order": 103.3385, "why": "Build advisor finding, Oct 27 08:10 CDT: hooks/test_stall_watch.py case 23b (a tee job gets a STALL while its log grows) fails intermittently on gates-macos: red on main b031394, green on 2e5fde3, red on #691.", "note": "Merged to main in batch #698 (43d9af2), Oct 27 11:33 CDT. Cause: the watcher decided a stall on a job-state and named-log sample up to a second old; it now samples again in the same pass before any STALL report. Proof: fake-clock case 23b2, red on main, green on the branch. Port: no; the hook lives in claude-settings.", "updatedAt": "2026-10-27T16:45:00Z", "ask": "# Brief: c120, the macOS stall-watch test stops failing at random\n\nRepo: shivinate7/claude-settings, from main d4e1b86. One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\n`hooks/test_stall_watch.py` case 23b (\"a relative `> F`, a `| tee -a F` and a `--log F` name a log the watcher reads: no STALL\") fails some runs on gates-macos: the tee job gets exit 3 and a STALL report while its log grows. Seen red on main b031394 (job 122105728260) and #691 (job 122197016707); green on 2e5fde3 and on the #691 re-run.\n- Find the race (likely tee's buffering or the watcher's read timing against the log's growth on macOS) and fix the cause in `hooks/stall_watch.py` or the test's fixture, whichever holds the defect.\n- Never a retry, a longer sleep as the fix, or a skip.\n\n## Rulings\n- verification-cry-wolf-guard-is-spent: a required check that fails at random teaches you to scroll past red.\n- building-fix-cause-not-symptom.\n\n## Failure classes\n- A fix that only widens a timing margin (name it a bandaid if nothing else works, with the cause in docs/debts).\n- A fix that hides a real stall (a job whose log stops growing must still get STALL).\n\n## Check that proves it done\nReproduce first: run case 23b in a loop until it fails, on macOS if the lane can (`gh workflow run gates.yml --ref <branch>` and read gates-macos), and record the failure rate. Then the same loop shows zero failures across at least 3 gates-macos runs. Also run `python3 bin/ci-job gates --base origin/main` lint steps that touch hooks, lint/hook_catalog.py --check, bin/ste-changed origin/main.\n\n## Report\nAt most 15 lines: PR, head, the cause in one sentence, failure rate before and after with run ids, review verdict. Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c121": {"title": "Each repo's live waiting page is republished on the final look", "phase": "cleanup", "status": "todo", "order": 103.3966, "why": "c100 (the waiting page's final look) merged in batch #683; the live pages (home-app, degen, mailaudit) still show the old one. Build advisor, Oct 27 04:25 CDT.", "note": "Ruling, Oct 27 23:48 CDT (shiv, waiting page item 4, b): start fresh pages on this account; each repo gets a new page at its visit, and open answers on the old pages (other accounts, 404 here) are dropped; this project's page is https://claude.ai/artifact/RddcgXbB6SvTrFZHPmsvFx. Due after: each repo's visit (r1), home-app first. Brief: briefs/c100-republish-live-pages.md. Port: yes, every repo's page.", "updatedAt": "2026-10-28T04:55:00Z"}, "c122": {"title": "The waiting page shows what differs between options, opens the exact state, and takes combined answers", "phase": "cleanup", "status": "todo", "order": 103.3965, "why": "Review-page standard from an outside page you shared, Oct 27 02:23 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2DrFwwCVeSEX2GFLj7CxtiZ); the c100 lane left items 2, 3 and 5 out of scope.", "note": "Build in skills/waiting-page: (2) a coloured edge marks what differs between options; (3) \"open this state in the full mockup\" deep-links to a named state. Items 1, 4 and 6 landed with c100; item 5 (combined answers) moved to c135. From shiv's page reviews (Oct 27 11:47 CDT degen's page, cmsg_01DoF7thf3iq2Srr1UsfXgh2WX6jeX97e4YdP1xjEqUvnJ; 11:56 CDT banchi's, cmsg_01DoF7thf3iq2Srr1UsfXgh2ByQ3cy16LrifwTudkSyi83 and cmsg_01DoF7thf3iq2Srr1UsfXgh2MYnDNTawHFW2QEBty1eAzw): each option's picture sits inside its option card, fitted whole (what a tap on it does is d9's, ruled 12:13 CDT); the option chip shows A, B, C on one line and never overlaps the title; \"Take my pick\" and \"Ready to send\" name the option's title; the digit in \"0 of 9 sent\" matches its line; the left list gives each item a short title; the gold star on the pick box becomes the AI sparkle icon (inline SVG). Small c100 review defects: undoSend's bar repeats \"and\"; a failed Undo names one item; a failed receipt delete can leave an old receipt; empty tiers hide their empty line. Rulings: Oct 27 02:27 CDT (shiv), a question that changes no rule sits in a last \"Pick stands\" section (on main); Oct 26 (c74), keep \"Accept every pick\" and list every pick before it saves. Clear and pick-less notes go in the c126/d9 lane. Needs no answer. Port: yes. Placed after c104 (triage, Oct 27): the same page, after the final look. Due after: c147 merges (same skill files; triage's waiting-page order, Oct 28: c145, c147, c122, c139, c135, c136).", "updatedAt": "2026-10-28T06:45:00Z"}, "c123": {"title": "A cloud reinstall stops filling the skill list with backup copies", "phase": "cleanup", "status": "done", "order": 103.3388, "why": "Build advisor finding, Oct 27 08:40 CDT: the cloud refresh hook moves each skill folder to <name>.bak.<time> before a fresh install, and each .bak folder lists as a skill: 11 more entries per install, 33 in one container.", "note": "Merged Oct 27 11:01 CDT in PR #693 (skill backups stop piling up). Cloud install replaces its own unedited skill copy with no backup (tree hash kept in ~/.claude/backups/skill-copies); a hand-edited skill is backed up to ~/.claude/backups/skills, never in skills/; old skills/<name>.bak.<14 digits> folders move there. install.ps1 has the same backup path, first run is CI's Windows job. Hash covers file names and contents only. Port: no; it lives in claude-settings' installer. Ready to close (triage). Merged in #697 (2ca89254), Oct 27 11:01 CDT.", "updatedAt": "2026-10-27T16:05:00Z", "ask": "# Brief: c123, a cloud reinstall stops filling the skill list with backup copies\n\nRepo: shivinate7/claude-settings, from main d4e1b86. One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\n`install.sh` moves an existing installed folder to `<dest>.bak.<time>` before it copies the fresh one. In a cloud session the install runs at every resume and after every merge, so `~/.claude/skills/` collects `<skill>.bak.<time>` folders, and each one lists as a skill (44 in one session on Oct 27).\n- When the existing folder is the repo's own earlier install (identical source, or carrying the install's own marker), replace it with no backup.\n- When a backup is still needed (a folder the user changed by hand), write it outside `skills/` (and outside every other folder Claude Code scans), so it never lists as a skill.\n- Keep the backup for a user's own edits; never delete their work.\n\n## Rulings\n- verification-recovery-not-gated-on-own-state: the backup of a hand edit must still happen.\n\n## Failure classes\n- A hand-edited skill that gets overwritten with no copy.\n- The same fix missing on Windows (install.ps1 or its equivalent, if it backs up the same way).\n\n## Check that proves it done\nA test that runs the installer twice into a temp home: red on main (a `.bak.*` folder in skills/), green on the branch (none), plus a case where a hand edit is kept outside skills/. Existing installer tests pass (hooks/test_install_src.sh, hooks/test_install_windows.sh where it can run). bin/ste-changed origin/main.\n\n## Report\nAt most 12 lines: PR, head, red run, green run, review verdict. Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c124": {"title": "Lint tests share one folder-removal helper", "phase": "cleanup", "status": "done", "order": 103.3387, "why": "Build advisor, Oct 27 07:10 CDT: five lint tests (check_mod_versions, glossary, hook_stubs, record_slugs, ruling_kind) copy the same rm_tree helper; a git auto-gc race in it turned batch #690 red three times.", "note": "Done: PR #695 merged in batch #698 (main 43d9af2, Oct 27). Review note, not a debt: testing/tracked_tree.clear_readonly sets S_IWRITE only, so a read-only directory would lose read and execute bits on POSIX; no fixture holds one. Merged to main in batch #698 (43d9af2), Oct 27 11:33 CDT, via PR #695. Shared rm_tree lives in testing/tracked_tree.py; seven tests call it (six lint, plus actions/test_ruling_kind_records_dir.py). It ignores a file that vanished mid-delete. Port: no; the tests live in claude-settings.", "updatedAt": "2026-10-27T17:00:00Z", "ask": "# Brief: c124, lint tests share one folder-removal helper\n\nRepo: shivinate7/claude-settings, from main d4e1b86. One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\nSix lint tests carry their own `rm_tree` (test_check_glossary, test_check_hook_stubs, test_check_mod_versions, test_check_record_slugs, test_check_ruling_kind, test_layout). Move it to one shared helper beside `testing/tracked_tree.py` and call it from all six. Keep its behaviour: clears the read-only bit (git objects on Windows) and retries the remove.\n- Also make it tolerate a file that vanished mid-delete (FileNotFoundError in the error handler), which is what the git auto-gc race raised. The race itself is fixed in gates.yml's env (batch #690).\n\n## Rulings\n- building-one-home-per-capability.\n\n## Failure classes\n- A Windows read-only object file that the shared helper no longer clears.\n- A test that imports the helper by a path that breaks when run from another folder.\n\n## Check that proves it done\nA small test of the helper: red on main (no shared helper, and a vanished file raises), green on the branch. All six test files pass. `python3 bin/ci-job gates --base origin/main`
