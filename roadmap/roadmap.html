ent serves a sidebar and a main column with no copy (o11, one home per shared\n   thing). Add a container breakpoint only where the component changes shape: each one is one\n   more state to screenshot.\n4. Fluid spacing uses `clamp()` tokens; put the token shape in `ux/tokens.md`.\n5. Swift: the same intent with its own tools (ViewThatFits, size classes, stack spacing).\n\nPoint `skills/design-review` at the new section so a review checks it.\n\n## Fences\n\n- Docs and the design-review skill only. No new lint or guard: rule\n  building-guard-needs-incident needs an incident or a likely risk, and none is named. The\n  per-file ratchet seen in banchi does not spread (shiv, Oct 26); it stays out unless it\n  earns its own case, which you may argue in the PR body.\n- Read banchi, q_max, mailaudit and home-app for examples only; never push to them.\n- o12 (skills up to date) runs at the same time and may touch design-review wording; keep\n  your design-review edit to one pointer line.\n\n## Failure classes and proof\n\n- Each rule names the outcome it protects (centered content, no gap drift between screens).\n- Run ste-changed and the markdown lint through `verdict`.\n- Docs only: merges on green with no reviewer, unless you change a skill's behaviour.\n\n## Report\n\nCap 15 lines: Done, Deviations, Next. Send the green head and branch to\n\"Advise the claude-settings build (3)\". Do not merge, and do not rebase onto main. No\nquestion for shiv: park any in the PR body.\n"}, "d8": {"note": "Merged into d6 (triage, Oct 26): cloud sessions ship Chromium and Playwright, and Claude in Chrome and the app's browser pane cover local sessions; what was left is d6's shared screenshot script.", "order": 270, "phase": "design", "status": "done", "title": "Install a browser MCP for every session", "updatedAt": "2026-10-26T05:30:00Z", "why": "Playwright or Chrome DevTools MCP, set up globally, so any repo and any cloud session can render a page and look at it."}, "d9": {"ask": "# c126 and d9: the waiting page gets its items from the orchestrator, with pictures inline\n\nBuilder lane, claude-settings, from main 2ca89254. Two steps, one lane, one commit each, because\nboth edit skills/waiting-page. Report cap: 25 lines.\n\n## c126: lanes never write the waiting page\n\nThe defect: skills/waiting-page/SKILL.md (\"from every session\") and decision questions-go-to-owner\nnever say who writes when an orchestrator runs lanes. A banchi orchestrator told its lanes to post\ntheir own items. A subagent lane has no wake after it ends, so it cannot read its answer, and two\nwriters clash on the design republish (\"Add a design\", step 4).\n\nThe fix: a lane (a background agent or a lane session) puts its question in its report. The\norchestrator writes the item, with itself as `owner`, and routes the answer back to the lane or\nits next try. Say it in the skill's opening paragraph and in \"Add an item\", and in decision\nquestions-go-to-owner, in place (no history). Red first: the brief check (hooks/agent_brief.py, the\nAgent prompt hook) flags a lane brief that tells the lane to write a waiting-page item, if that hook\nis the home for brief rules; otherwise say which home you used and why.\n\n## d9: a design pick shows a picture of each option, inline and first\n\nshiv's gripe, Oct 27 09:50 CDT: banchi's item 30 (where a card's price history shows) linked its\nthree mockups as \"a folder on GitHub\". A link to a folder, repo or file is never enough.\n\n1. Skill: a question about how something looks carries one design per option (\"Add a design\"),\n   drawn on the first device of the repo's app kind (the Duo folded for iOS, a phone width for\n   web). The full mockup stays one tap away.\n2. skills/waiting-page/page.html: an item's designs show at the front of its card, before the\n   option list, not after it. An item whose options name a design that the item does not carry\n   shows a plain warning line in place of the picture, so a missing picture is seen, not hidden.\n3. hooks/reply_judge.py: its prompt flags a reply that asks the owner to pick between visual\n   options and only links to them.\n\nRed first, in skills/waiting-page/tests/page.test.mjs and hooks/test_reply_judge.py: an item shaped\nlike banchi's item 30 (three visual options, a GitHub folder link, no designs) shows the warning;\nan item with designs shows them before the options. The reply judge case is red on main.\n\n## Done when\n\nThe new cases are red on main and green on the branch, `node --test skills/waiting-page/tests/page.test.mjs`\nand `python3 hooks/test_reply_judge.py` pass, and `bin/ci-job gates --lint` plus `bin/ste-changed`\npass. Check the page at phone and desktop width in both themes, headless. Give a verdict per\nscreen. A reviewer (sonnet) reads the diff. Commit trailers as the project requires. Push the\nlane branch, send the green, reviewed head to the build advisor, and never merge.\n", "note": "Rule, reply style and skill waiting-page: a question about how something looks shows one picture per option inline, on the first device of the repo's app kind (c113: the Duo folded for iOS, a phone width for web); a link to a folder, repo or file is never enough, and the full mockup stays one tap away. Each option card shows its picture scaled to the element being decided; a tap opens a viewer with \"N of M\", Prev, Next and Open full size; every mockup carries a Sample banner and dashed Today/New labels (Oct 27 12:13 CDT, from banchi's item 30). Check: the writer refuses a design item with no image per option, and the reply judge flags a visual pick that only links. Red first on banchi's item 30. Not on main (checked e0f9e2d, Oct 28): commits b7a33ff3 and 89b88d2e are only on claude/project-thread-xczmrz; #713 (on main 34dc6a9) already puts a mockup in each option card, so the lane reconciles with it: d9's renderer is the one home, #713's .oshot/.ofull renderer and its tap-picks test go (lane designer, Oct 28). Ruling, Oct 27 23:40 CDT (shiv, via the orchestrator): (a) every option on a look-question shows a picture; d9's warning stays, #713's skip goes. Green in c126's lane: draft PR #732 (6c4dfc04), batch 2; d9's renderer is the one home and #713's is dropped; brief briefs/c126-d9-waiting-page-writer-and-pictures.md. Deferral lifted on your gripe, Oct 27. Needs no answer. Port: yes. Placed ahead of c120 (triage, Oct 27): a gripe. Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #732.", "order": 103.3384, "phase": "cleanup", "status": "done", "title": "A design pick shows a picture of each option inline, never a link to a folder", "updatedAt": "2026-10-28T06:45:00Z", "why": "From a home-app question, Oct 17 (TV keyboard: do the arrows hide while typing). Gripe, Oct 27 09:50 CDT (shiv, cmsg_01DoF7thf3iq2Srr1UsfXgh2KNYGfA7peKRWraS48M8yHH, screenshot): banchi's waiting-page item 30 (where a card's price history shows) linked its three mockups as \"a folder on GitHub\"; your note: \"dont send me a fucking folder on github to rev…\"."}, "l1": {"ask": "Lane 2 of the guard-rule brief; its full text is in the Ask of c10 (let the guard grow, then cull what never fired).", "note": "Checked at 5584d1b: lint/guard_log_report.py already prints per-rule deny, ask and noted counts, per day and per session, and guard.log is never pruned. The gap is rules that never fired: they have no line, so they never appear. The brief adds a list of every rule id with 0 counts and its first-fire date. Moved up from Later, Oct 21: the guard cull (c23) needs it. Merged in #562 (Oct 22): guard_log_report.py --all-rules lists rules that never fired.", "order": 119, "phase": "cleanup", "status": "done", "title": "Track guard refusals per session", "updatedAt": "2026-10-25T19:45:00Z", "why": "Shows whether the experience improves as the system shrinks."}, "l2": {"note": "Merged into d2 (triage, Oct 26): d2 already picks the model for visual judgment.", "order": 420, "phase": "later", "status": "done", "title": "Add a second design opinion", "updatedAt": "2026-10-26T05:30:00Z", "why": "A second-model critic, or Stitch or Figma Make for exploring directions before a build."}, "l3": {"note": "Not started; no change since Oct 17. Conditional on your wanting a second coding model inside Claude Code; no session has asked for one since. Your word, Oct 26: leave it deferred. Due after: you ask for a second model.", "order": 430, "phase": "later", "status": "todo", "title": "Try Grok through grok-plugin-cc", "updatedAt": "2026-10-28T05:00:00Z", "why": "Only if you still want a second coding model inside Claude Code."}, "l4": {"note": "Not started; no change since Oct 17. Needs evals first, and none exist for agent definitions in claude-settings (not checked in depth). Related: o12 (bring every skill up to date) does a one-time pass by hand; this step would make it standing. Due after: evals for agent definitions exist.", "order": 440, "phase": "later", "status": "todo", "title": "An agent pruner, gated on evals", "updatedAt": "2026-10-28T05:00:00Z", "why": "Its job is cutting words and rules while tests and evals still pass. An agent definition changes only when an eval shows the new version is better."}, "o1": {"ask": "The cull is done. Write the organize-phase brief, starting with the rules folder and ui.md.", "note": "Merged into o2 (triage, Oct 26): o2's layout already puts .claude/rules/ in every repo.", "order": 125, "phase": "organize", "status": "done", "title": "Install a rules folder with a UI rule", "updatedAt": "2026-10-26T05:30:00Z", "why": "A path-scoped rule loads design guidance whenever an agent touches a .tsx, .css or .swift file."}, "o10": {"ask": "# o10: a page per session for questions waiting on you (plan only)\n\nCloud build thread brief. Build advisor (3), Oct 26, against claude-settings main d741cd5.\nBase: main d741cd5; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (3)\" republishes the roadmap page.\n\n## Task\n\nWrite the design as a plan, plans/o10-session-questions-page.md, in one PR. Build nothing yet.\nThe plan answers the step's ask: what a session publishes, how shiv answers, and how the\nanswer gets back to the session.\n\n1. Read first: the step note (roadmap/data/steps/o10.json on the roadmap branch), c31 and c28\n   (how a question reaches shiv today: the desktop banner, rule questions-go-to-owner, the\n   one-click command rule in output-styles/shiv-stylisms.md), and o8's note (the lasting repo\n   page; keep o10 apart from it).\n2. Measure, do not guess: what the Artifact tool and its runtime capabilities offer a session\n   today on Max, on Enterprise and on an API key (publish, comments sent to Claude, shared\n   state). Mark each fact checked or unknown, with where you checked it.\n3. Design the \"Copy answers\" path first (works on Max and Enterprise): the page lists each open\n   question with its options and recommendation; shiv picks; the page builds one block to paste\n   back into the session. Then the Enterprise path (comments sent to Claude).\n4. Give each choice that is shiv's as options with a recommendation, under a \"Deferred for\n   shiv\" heading. Do not ask him now.\n5. Name the cost per rule outcomes-mechanize-rules: processes started, files written, how often.\n   No watcher, no timer (c26).\n\n## Fences\n\n- Plan only: no hook, skill, mod or rule change. A plan that needs a new rule names it.\n- Overlaps: o8 (living repo page) and c68/design-review are other lanes; do not edit them.\n\n## Failure classes and proof\n\n- Every claim about the Artifact platform is checked or marked unknown.\n- ste-changed through `verdict`. Plan only: merges on green with no reviewer.\n\n## Report\n\nCap 15 lines: Done, Deviations, Next, and the Deferred-for-shiv list in one line each. Send the\ngreen head and branch to \"Advise the claude-settings build (3)\". Do not merge, and do not\nrebase onto main.\n", "note": "Merged into c71 (triage, Oct 26): your page item 1 chose one shared page for every session, so a per-session page is not built; its rulings (a save counts as your word; keep the terminal box) and the local test results move to c71. Plan stays on main: plans/o10-session-questions-page.md. Local test result (liaison, Oct 26): nothing on a page wakes a local session; filed on c71.", "order": 170, "phase": "organize", "status": "done", "title": "A page per session for questions waiting on you", "updatedAt": "2026-10-26T16:25:00Z", "why": "Two levels: the repo roadmap is lasting, a session page is live. Each busy session publishes its plan (done, now, next) and its open questions, each with Goal, Problem, and options with gain and loss. You answer on the page instead of in the terminal."}, "o11": {"ask": "# o11: one home for each shared thing; exceptions build on it, never copy it\n\nCloud build thread brief. Build advisor (3), Oct 26. Base: main after batch #614 merges (it\ncarries o2's lint/layout.json); the dispatcher names the commit. Never rebase onto main after\nreview. Push roadmap edits to the branch only; only \"Triage the roadmap (3)\" republishes the\nroadmap page.\n\n## Task\n\nCLAUDE.md already holds the rule (building-one-home-per-capability). Do not add a second rule.\nMake it reachable and checkable:\n1. agents/builder.md: before building a shared piece, search for its home; extend it with a\n   variant; a copy needs a stated reason in the commit. Keep it to a few lines that point at\n   the CLAUDE.md anchor.\n2. How a variant extends a shared piece, with one example each, in the home that already fits\n   (ux/ for CSS and Swift, testing/ or the test-author agent for tests): CSS (a modifier class\n   or a custom property on the shared component), Swift (a parameter or a style), tests (a\n   shared fixture or step that a test extends).\n3. A copy finder: a small read-only tool in lint/ that lists, for a child repo, (a) vendored\n   copies of claude-settings skills (compare against skills/), and (b) files byte-equal or\n   near-equal to a claude-settings file. Worked examples it must catch: q_max's copied map\n   skill (the drift that failed q_max PR 969), q_max's verbatim copy of a claude-settings test,\n   and the three impeccable copies in ios-adblock, joyous and degen, which differ from each\n   other.\n4. Add a \"Copies\" probe file to skills/compliance-check that calls the tool. o4 (rework\n   compliance-check) runs at the same time and leaves a \"Copies\" heading for you; touch\n   SKILL.md only to point at your probe file.\n\n## Fences\n\n- Never push to child repos; read them under /home/user only.\n- Shared skills are pinned, never vendored: the tool reports copies, it fixes none.\n- Any new record: put it at the decisions path lint/layout.json names on your base.\n\n## Failure classes and proof\n\n- The finder goes red on the three worked examples and stays quiet on a repo with no copy.\n- Scanner rule building-scanner-respects-strings applies if the tool scans source text.\n- This adds a check and changes the builder agent: a fresh Sonnet reviewer reads the diff.\n- Run ste-changed and the new tool's tests through `verdict`.\n\n## Report\n\nAdd one line, \"Port to other repos: yes or no, and why\" (shiv's ruling on c52, Oct 26). Cap 20 lines: Done, Deviations, Next, and what the finder found per child repo, one line each.\nSend the green, reviewed head and branch to \"Advise the claude-settings build (3)\". Do not\nmerge, and do not rebase onto main. No question for shiv: park any in the PR body.\n", "note": "Done: #619 (one home for each shared thing: the builder rule and lint/find_copies.py, the copy finder) landed in batch PR #629 (main be4b30e), Oct 26. The rest of the plan lives in its own steps: design tokens (o2, r2, r3), spacing (d7, done), one DESIGN.md (r4), the page reads each item from its home (o8), and the child-repo copies the finder lists (r5, which covers the vendored impeccable, frontend-design and web-design-guidelines skills and q_max's copies). Still unbuilt, no step yet: shared UI components with variants and shared test steps; file one when a lane meets the need. Closed by triage, Oct 26.", "order": 115, "phase": "organize", "status": "done", "title": "One home for each shared thing; exceptions build on it, never copy it", "updatedAt": "2026-10-26T18:25:00Z", "why": "Your rule, Oct 20: never duplicate and rebuild. Anything used in more than one place (a button size, a panel gap, steps 1 to 6 of a test, a skill) has one home, and everything else points at it. An exception (a different button, a twist on step 5a) calls the shared piece and changes only what differs, so a fix to the shared piece reaches every use and nothing drifts. The result looks the same; it is just more resilient."}, "o12": {"ask": "# o12: bring every skill up to date with the current rules\n\nCloud build thread brief. Build advisor (3), Oct 26, against claude-settings main 853b512.\nBase: main 853b512; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (3)\" republishes the roadmap page.\n\n## Task\n\nOne pass over five skills in `skills/`: ci-hygiene, design-review, fresh-prose, impeccable,\nplain-english-map. Leave compliance-check alone; o4 (rework compliance-check) owns it.\n\nPer skill, answer three questions, then fix, merge or cull:\n1. Does it still match CLAUDE.md, GLOSSARY.md and `decisions/` as they are on main now?\n   Name each sentence that disagrees, and the rule or decision it disagrees with.\n2. Is it still used? Grep CLAUDE.md, agents/, hooks/, other skills and the child repos\n   (read only; never push to them). A skill nothing names and no rule needs is a cull\n   candidate: say so in the PR body, with the grep you ran.\n3. Does it start processes or load files it never uses (c26, watching costs less than what\n   it watches)? Name each one.\n\nimpeccable is vendored. Update it to the newest upstream version that passes its checks\n(rule verification-newest-that-passes): read the changelog first, use the existing\nimpeccable-sync workflow's source, and say which version you took and why.\n\n## Fences\n\n- In scope: files under `skills/` for these five, and the tests or lints that read them.\n- Out of scope: compliance-check (o4); the copies vendored in ios-adblock, joyous and degen\n  (o11 owns the copy check); o2 lane 2's folder move. Batch #608 adds `lint/layout.json`;\n  do not touch `lint/` or `hooks/guard.py`.\n- A cull deletes the skill and every pointer to it in one commit.\n\n## Failure classes and proof\n\n- A rule sentence in a skill that contradicts CLAUDE.md is the defect; CLAUDE.md wins unless\n  the sentence names a stale rule, then use outcomes-stale-decision-protocol and park it.\n- Run ste-changed and the skill's own tests through `verdict`.\n- A change that alters a rule's behaviour goes to a fresh Sonnet reviewer; wording-only\n  changes merge on green.\n\n## Report\n\nCap 20 lines: Done, Deviations, Next, one line per skill (kept, fixed, merged or culled).\nSend the green, reviewed head and branch to \"Advise the claude-settings build (3)\". Do not\nmerge, and do not rebase onto main. No question for shiv: park any in the PR body.\n", "note": "Merged Oct 26 in batch PR 608 (main d741cd5), from PR 610. Fixed: ci-hygiene (PR numbers get plain names; Monitor line cites the decision's current text), fresh-prose readme (read the code before asking). Kept: design-review, plain-english-map, impeccable at skill-v4.5.2 (4.6.0 and 4.7.0 were under design-skills' 14-day wait; Renovate proposes 4.6.0 on Nov 1). No cull. Parked finding went to triage as c68 (impeccable reviewer is likely not blind).", "order": 135, "phase": "organize", "status": "done", "title": "Bring every skill up to date with the current rules", "why": "Your note, Oct 21: the plan should cover updating all the skills eventually. Before this, no step did; only compliance-check had one (o4) and o11 covered shared skills being pinned, not copied.", "updatedAt": "2026-10-26T14:40:00Z"}, "o13": {"title": "One name per thing: a glossary in every repo", "phase": "organize", "status": "doing", "order": 103.385, "why": "Your idea, Oct 26: AI sessions need settled terms. A photos folder beside a captures folder leads to confusion, a second copy being built, and misread asks.", "note": "Gripe, Oct 26 (shiv): too many overlapping words (gates, harnesses, steps, checks, tests and more). Your word, Oct 26: claude-settings holds only terms that matter in every repo, each repo its own domain terms. Done: GLOSSARY.md with 17 workflow terms landed in #597 (batch #595, main 12d9851). Ruling, Oct 26 (shiv): yes to all nine groups in plans/o13-one-word-per-meaning.md; the code is renamed too (files, identifiers, anchors, slugs, CI name), so his words and the code match with no conversion table; only Claude Code's own names (deny, block, ask, SubagentStop) stay. Other repos get a one-time conversion through the compliance-check skill. Lane B (groups 2-4) merged in batch #663 (1733dac); lane C (#638) merged alone (b5969a2, Oct 27 00:08 CDT). Lane A doing (branch o13-gate-try-rename, ae0acd26): Opus review round 1 passed; the builder is merging main b09aece (conflict with the Workflow step-up guard). It renames every gates* check to checks* (bin/ci-job gates becomes checks), so it merges alone. merge.py reads stamp.json from main, so protection must switch in the merge act. Deferred (shiv, Oct 28): how protection switches. Asked: waiting page item 33. Next: lane A (brief briefs/o13-laneA-gate-try-rename.md, text in Ask), then one lane that widens lint/check_glossary.py from file paths to identifiers, rule anchors, record slugs and hook messages, so a retired word cannot come back in code (prose stays a reviewer's job); red first on a planted retired word. Port: yes. Placed ahead of c69 (triage, Oct 26): the overlapping words cost you on every read.", "ask": "# Brief: o13 lane A, the gate/try rename on current main (redo PR #639)\n\nRepo: shivinate7/claude-settings, from main 92643977. One lane: builder (sonnet), then reviewer (sonnet). It changes a guard (hooks/guard.py, the third-round step-up), so it gets up to three review rounds and, after round 3, the net-value test.\n\n## Ruling\nshiv, Oct 26: yes to all nine groups in plans/o13-one-word-per-meaning.md (roadmap branch); the code is renamed too, so his words and the code match. A hook that refuses or asks is a guard; a lint, test or CI job is a check; a review and its fix is a round. Only Claude Code's own names stay.\n\n## Task\nPR #639 (branch claude/project-thread-x5hnku, head 0b9925f) did groups 1 and 9 but is 300+ commits behind main. Read its body for the full list. Redo it on a new branch from current main (do not force-push the old branch): file, record, anchor, identifier and message renames; gates.yml to checks.yml with job names gates* to checks*; rule kind gate to check; the guard accepting `Round 3 of 3` (and `Try 3 of 3` for 14 days, note try-marker-sunset). Pick up every new `gate` use that landed since #639. Merge origin/main into your branch again just before you report, since other lanes edit gates.yml.\nDo not change branch protection or .github/stamp.json's required list on main; list the old and new required check names in the PR body, so the batch merge can switch them in one act.\n\n## Failure classes\n- A required check renamed in the workflow but not in .github/stamp.json, so merge.py waits forever.\n- The guard: `Round 3 of 3` on Sonnet allowed (must refuse), or on Opus asked (must allow).\n- A stub left at an old path that check_hook_stubs.py does not know.\n\n## Check that proves it done\nThe guard cases red on main, green on the branch. lint/check_glossary.py passes. `python3 bin/ci-job checks --lint --base origin/main` (or its renamed form) and `bin/ste-changed origin/main` pass; name any step red on main too.\n\n## Report\nAt most 15 lines: PR (draft), head, red run, green run, each review round's verdict, the old and new required check names. Close #639 as replaced. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n", "updatedAt": "2026-10-28T07:15:00Z"}, "o14": {"title": "Each repo's rules load by the folder they govern, not all at once", "phase": "organize", "status": "done", "order": 109.95, "why": "Your question, Oct 26: you work at repo level only, and wondered whether bigger teams work a better way.", "note": "Done: PR #596 (warn when a CLAUDE.md passes 200 lines) landed on main in integration PR #595 (batch-oct26b, 12d9851b), Oct 26: lint/check_claude_md_size.py warns, never fails, and CI runs it on both CLAUDE.md files; compliance-check has a probe row; new rule tokens-folder-rules-load-by-path says when a section moves to a path-scoped rule (.claude/rules/*.md with a paths: glob) and when it stays. Why: banchi's CLAUDE.md is 399 lines and mailaudit's 478, against Claude Code's 200-line aim (code.claude.com/docs/en/memory). The repo pilots are o3's, deferred; o2's .claude/rules/ folder follows this rule. Not recommended: a CLAUDE.md per folder, per-folder subagents, sparse worktrees. Closed by triage, Oct 26.", "ask": "# o14: repo CLAUDE.md stays small; folder-only rules load by path\n\nCloud build thread brief. Build advisor (2), Oct 26, against claude-settings main bf084df.\nBase: main bf084df; never rebase onto main after review. claude-settings only: do not touch other repos.\n\n## Why\n\nEvery session loads the whole repo CLAUDE.md plus the global one. banchi's is 399 lines, mailaudit's\n478. Claude Code's memory docs aim under 200 lines and offer path-scoped rules (.claude/rules/*.md with\na `paths:` glob) that load only when Claude touches matching files (code.claude.com/docs/en/memory;\nverify the current front-matter shape there before you build). Repo pilots are o3's, deferred.\n\n## Task, one lane\n\n1. Size check: a lint that warns (never fails) when a CLAUDE.md passes 200 lines. Give it one home\n   that child repos can call later (compliance-check or a lint/ script); in this repo, run it in CI on\n   CLAUDE.md and .claude/CLAUDE.md. A warning names the line count and the doc link.\n2. Rule: one short CLAUDE.md sentence (STE, under 30 words) on when a section moves to a path-scoped\n   rule: it matters only under one folder. It stays when it is needed before the first file read\n   (a design pass, a merge rule). Add its rule anchor and its rule_mechanisms.json row.\n3. Read-deny guidance: one line where the size rule lives: bulk checked-in data (fixtures, demo\n   assets, vendored data) gets a Read deny rule in the repo's settings, not a CLAUDE.md mention.\n4. Not in scope: a CLAUDE.md per folder, per-folder subagents, sparse worktrees, any child repo.\n\n## Failure classes and proof\n\n- Test-author first, red on main: a 201-line fixture warns, a 200-line one does not, the check exits\n  0 on a warning (a warning that fails CI is a false alarm), a missing file is a skip.\n- Rule count: rule_audit's pinned counts move by exactly the new anchor; say which bucket.\n- Diff touches a rule's behaviour: a fresh Sonnet reviewer reads it.\n\n## Report\n\nCap 20 lines: Done, Deviations, Next. Send the green, reviewed head and branch to\n\"Advise the claude-settings build (2)\". No question for shiv: park any in the PR body.\n", "updatedAt": "2026-10-26T09:50:00Z"}, "o15": {"title": "Tasks and rulings a session catches land in tracked files, not only the handoff", "phase": "organize", "status": "done", "order": 140.5, "why": "A handoff file dies with the session's machine; a tracked file survives it.", "note": "Ruling, Oct 26 (shiv, page item 9, a): re-point it. Memory and handoffs hold only short-term, in-flight notes; decisions, debts and anything decided in a session go to tracked homes. Done: lane PR 632 (rulings and tasks from owner feedback need a tracked home) landed in batch PR 637, merged to main as 54be9f1 on Oct 26. Ruling, Oct 26 (shiv, page, a): the layout gets a core todo kind; built in o17.", "ask": "# o15: tasks and rulings land in tracked files, not only the handoff\n\nCloud build thread brief. Build advisor (4), Oct 26, against claude-settings main 3b96ce8.\nBase: main 3b96ce8 (or the newest main when you start); never rebase onto main after review.\nclaude-settings only. Push roadmap edits to the branch only; only Triage the roadmap (3) republishes.\n\n## Rulings\n\n- shiv, Oct 26 (page item 9, a): re-point it. Memory and handoffs hold only short-term, in-flight\n  notes; decisions, debts and anything decided in a session go to tracked homes.\n- Rules: output-answer-has-a-home, building-memory-is-short-term, outcomes-mechanize-rules.\n\n## Task\n\nRead plans/o5b-memory-hooks-audit.md on the roadmap branch (the feedback_gate and\nprecompact_handoff rows) first.\n1. hooks/feedback_gate.py (and feedback_judge.py, local_time.py's fb capture as needed): a `task`\n   item's home must be a tracked file (the repo's todo or debt store); a `ruling` item's home must be\n   a decision record or a rule. The handoff no longer counts for those two kinds. `standing` and\n   in-flight kinds keep the handoff. Each closed item is checked against the home it names (the file\n   exists and is tracked by git).\n2. hooks/precompact_handoff_prompt.md: trim the \"Rulings with NO HOME YET\" and \"rulings with a home\"\n   sections to what is still in-flight. Keep branch, head, PRs, pids, ports, agents.\n3. Find the repo's todo and decision homes from the layout file o2 landed (layout.json), never a\n   hard-coded path. A repo with no todo home: say so in the refusal, naming the layout key.\n\n## Failure classes and proof\n\n- Test-author first, red on main: a ruling homed to the handoff is refused; a task homed to an\n  untracked file is refused; a ruling homed to a tracked decision passes; a standing item homed to\n  the handoff passes (false-alarm case); a repo with no layout file fails open with one line.\n- Run every gates.yml step locally before sending (lint fixtures copy file lists; c69 not landed).\n- A fresh Sonnet reviewer reads the diff (it changes a gate's verdict).\n\n## Report\n\nCap 20 lines: Done, Deviations, Next. Include \"Port to other repos: yes or no, and why\".\nSend the green, reviewed head and branch to \"Advise the claude-settings build (4)\"\n(cmsg_01DoF7thf3iq2Srr1UsfXgh2EyHwiKacoTT56k4JHuc2RT). Keep the PR a draft. No question for shiv:\npark any in the PR body.\n", "updatedAt": "2026-10-26T21:05:00Z"}, "o16": {"title": "Any repo can adopt this project's way of working: standing roles, hand-offs, batching and a roadmap", "phase": "organize", "status": "done", "order": 149, "why": "The process proven here should serve every repo, not be rebuilt in each one.", "note": "Done: the claude-settings part. Built, Oct 26: the claude-settings part merged in batch #637 (main 54be9f1) as skill project-ops (skills/project-ops): templates for the four standing roles with counted hand-offs, the roster, a brief and a role hand-off note, plus scaffold.py, which writes a repo's record-branch skeleton. roadmap/build.py stays one copy on this branch, pointed at, not moved: its viewer is specific to claude-settings, and o8 makes it generic. Port to other repos: yes. Adopting it in other repos moved to r6 (triage, Oct 26). Ruling, Oct 26 (shiv): portability is a judgment call that is always considered: every process built here gets an explicit \"port to other repos? yes or no, and why\" call, never silence. Linked: o8 (a living roadmap page for every repo) builds the page this package points at.", "ask": "# o16: any repo can adopt this project's way of working (claude-settings part)\n\nCloud build thread brief. Build advisor (3), Oct 26. Base: main after #615 (o2, one layout for\nevery repo) merges, so new files land where lint/layout.json says; the dispatcher names the commit.\nNever rebase onto main after review. Push roadmap edits to the branch only; only \"Triage the\nroadmap (3)\" republishes the roadmap page.\n\n## Task\n\nPackage this project's operating model in claude-settings as templates, one skill and docs, so a\nrepo can adopt it later. Adopting it in any other repo is deferred for shiv: do not touch them.\n\nWhat it packages (read the roadmap branch for the live source, never copy from memory):\n- the standing roles: triage gatekeeper, build advisor and dispatcher, local liaison, merge hand;\n  the roster and the counted hand-off rule (limits, slip trigger, hand-off file);\n- autopilot deferral (\"Deferred\" lines; never wait on the owner);\n- integration-branch batching (point at rule git-integration-branch-merge; do not restate it);\n- the roadmap: roadmap/build.py and the roadmap/data layout (steps, topics, meta), briefs/ with\n  the ask copy, handoffs/.\n\nSources: use the roadmap branch's handoffs/ and briefs/ and roadmap/build.py.\nName any rule you could not find a written source for.\n\nShape: one skill (for example skills/project-ops) that sets the model up in a repo, templates for\nthe roster, a brief and a hand-off, and a README section. Reuse roadmap/build.py by pointing at\nit on the roadmap branch or moving one copy to main; never two copies (rule\nbuilding-one-home-per-capability), and say which you chose and why.\n\n## Fences\n\n- No change to any child repo. No new guard or gate.\n- o8 (living roadmap page per repo) builds the page; this step packages the process around it.\n  Do not design the page.\n\n## Failure classes and proof\n\n- A dry run: apply the skill to a scratch repo and show the files it writes; nothing it writes\n  names this project's thread ids or people.\n- Adds a skill whose instructions agents follow: a fresh Sonnet reviewer reads the diff.\n- ste-changed through `verdict`.\n\n## Report\n\nAdd one line, \"Port to other repos: yes or no, and why\" (shiv's ruling on c52, Oct 26). Cap 20\nlines: Done, Deviations, Next. Send the green, reviewed head and branch to \"Advise the\nclaude-settings build (3)\". Do not merge, and do not rebase onto main. No question for shiv: park\nany in the PR body.\n", "updatedAt": "2026-10-26T20:05:00Z"}, "o17": {"title": "The layout gets a core todo kind", "phase": "organize", "status": "done", "order": 111, "why": "o15 sends tasks a session catches to tracked files, but the layout has no todo kind, so each repo keeps its follow-ups somewhere different (q_max: specs/todo.md, with no layout key).", "note": "Done, Oct 27: PR 656 landed in batch PR 663 (main 1733dac). The core kind is docs/todo.md; a legacy-repos map in lint/layout.json keeps q_max's to-dos at specs/todo.md and home and home-app's at records/ until each repo moves them. Port: yes, each repo reads the layout at its roll-out.", "updatedAt": "2026-10-27T04:20:00Z"}, "o18": {"title": "claude-settings' ux/ folder moves to docs/design/", "phase": "organize", "status": "done", "order": 110.5, "why": "Left out of o2's lane 2 (Oct 26): the rest of claude-settings' records moved under docs/, but ux/ did not.", "note": "PR #658 (move the house UX rules to docs/design/) merged to main on Oct 26 22:09 CDT. ux/ is now docs/design/, installed and frozen there, and both installers remove the old ~/.claude/ux. Closed by triage, Oct 27. Port: no; child repos follow o2's roll-out.", "updatedAt": "2026-10-27T04:20:00Z"}, "o2": {"ask": "One layout for every repo, claude-settings part. Goal: one file in claude-settings names where each kind of file lives in every repo; each shared tool reads its paths from that file; claude-settings moves its own records into the layout. Child repos move later, each in its own session. Start after the running cleanup batch merges.\n\nToday, checked at 987f682: records sit at the root: decisions/ (106), debts/ (51), plans/ (1). ux/ (5) holds the shared design ideas. Four tools copy the record path and disagree: lint/check_record_slugs.py DIRS (\"decisions/\", \"debts/\"; hooks/guard.py reads it), lint/hook_catalog.py RECORD_FOLDERS, lint/check_ruling_kind.py DIR, and lint/ste_lint.py decisions_dir, which defaults to \"docs/decisions\". actions/stamp/examples use both forms. banchi and q_max keep records under docs/.\n\nThe layout. Core, every repo: CLAUDE.md; AGENTS.md as a symlink to it; .claude/rules/; docs/decisions/; docs/debts/ with README.md and notes.md; docs/plans/ (delete a plan when its work ships); docs/specs/ (how a shipped feature works now); docs/records.md (generated). Repos with screens add: docs/design/ (DESIGN.md, mockups/, reference/); tokens/tokens.json; shots/ (gitignored); the shoot config that d6 names. No history folders (FORMER/, RETIRED/, archive/): git keeps history. A repo declares its own extra kinds (example: home's records/) in one extras file in its own tree.\n\nLane 1, one layout file and its readers. Add one machine-readable layout file in claude-settings (suggested: lint/layout.json) holding the core and screen kinds above. Make check_record_slugs, check_ruling_kind, hook_catalog, ste_lint and the stamp examples take record paths from it, and merge a repo's extras file when present. The guard keeps its own literal if a runtime file read is unsafe there, as CONFIG_FROZEN_DIRS does; then add a check that the literal equals the layout file, the way lint/check_landed_dirs.py checks landed-dirs.txt. No reader holds a record path of its own after this lane.\n\nLane 2, move claude-settings. git mv decisions/ to docs/decisions/, debts/ to docs/debts/, plans/ to docs/plans/, ux/ to docs/design/. Keep every file name. Fix each path cite: a prose cite becomes a slug cite (git-cite-by-id); a code comment gets the new path. Regenerate docs/records.md. Confirm landed-dirs.txt and both installers need no change, or change them.\n\nLane 3, the record. Write decision one-layout-every-repo: the three placement questions (current truth or history? dies when the work ships? does every repo have one?), the layout, and Home: the layout file. Owner ruling lines: Oct 22, same folders in every repo, not a per-repo declaration; Oct 17, claude-settings first, each child repo in Roll out; Oct 20, no copied DESIGN.md template, each repo's DESIGN.md points at the shared ideas.\n\nRulings that bind: one-shared-record-stamp (no record is renumbered or renamed; a move keeps the name); building-allow-list-is-the-constant; git-cite-by-id; building-guard-needs-incident (incident: ste_lint's default path does not match this repo's records folder).\n\nTests, red on main and green on the fix: each reader finds the records of a fixture repo laid out under docs/; a fixture with an extras file adds its extra kind; a mutant that puts a literal \"decisions/\" back in one reader is killed by the constant check. Lane 1 changes a guard's input, so it gets the review rounds of roles-review-cap-three.\n\nOverlaps: c21 (standard lint in CI) waits for this lane before any repo-wide format. c19's later lanes (Stop dispatcher, cached git reads) wait too. Rebase on any open PR that touches lint/ or hooks/guard.py.\n\nReport, 25 lines or fewer: the layout file's path and kinds, each reader changed, files moved, path cites fixed, test names with red and green, and any path you could not move.", "note": "Plan: plans/o2-one-layout-plan.md; brief: briefs/o2-one-layout.md (text in Ask). lint/layout.json is the one home; every reader and the guard read it; lint/check_layout.py checks it. A repo without .claude/layout-extras.json is read at its legacy folders. Merged: lanes 1 to 3 and the guard lane (#607, #628, #663). ux/ stays at the top; its move is o18. Rulings (shiv): claude-settings first, each child repo in Roll out (Oct 17); no copied DESIGN.md template (Oct 20); same folders in every repo (Oct 22); guard reads both paths (Oct 26, B). Waiting on it: c21's ruff format, c19's Stop dispatcher if still needed. Current lane (Oct 28): draft PR #742 (c6405195, Sonnet review approved): claude-settings' extras file gains the waiting-page key (https://claude.ai/artifact/RddcgXbB6SvTrFZHPmsvFx), and rolled_out() needs \"rolled-out\": true (old item 29's pick a; specs is already a core kind). Held out of batch 4: home's extras file has no mark, so under #742 home's debts, decisions and plans fall back to old root folders. Deferred (shiv, Oct 28): the mark itself (waiting page item 3) and how home is treated (item 32: push the mark to home first, change #742, or hold it). Asked: waiting page items 3 and 32 (one group; item 32's owner is the orchestrator). Debt at roll-out: a child repo that moved its folders but has no mark reads at legacy folders; each child's roll-out adds the mark. Port: no; children follow at roll-out. Placed ahead of c107 (triage, Oct 27).", "order": 103.33885, "phase": "organize", "status": "doing", "title": "One layout for every repo", "updatedAt": "2026-10-28T07:05:00Z", "why": "One place for each kind of file in every repo, so any agent finds the right file without being told: decisions, debts, plans, specs and design under docs/, tokens in tokens/tokens.json, and one layout file in claude-settings that every shared tool reads."}, "o3": {"note": "Ruling, Oct 26 (shiv, page item 16, a): roll out one visit per repo, after o2's layout move, with c42 first; before each visit, warn you which sessions in that repo to pause. Waits on o2. Checked Oct 26: mailaudit's CLAUDE.md is 478 lines (37d4e7d) and banchi's 399 (e910e8a); q_max 182 (b47bd00), claude-settings 106, home-app 30. Two repos are over 200 lines. The method comes from o14: move sections that govern one folder into path-scoped rules. banchi's docs-audit 'rule enforcement' row parses CLAUDE.md, so a move there changes that check too. Merged in from o14 (triage, Oct 26): the banchi or mailaudit pilot. In Roll out (triage, Oct 26). Due after: o2's claude-settings half, then the roll-out visits in order, c42 first (triage, Oct 27: not a cloud lane today).", "order": 345, "phase": "rollout", "status": "todo", "title": "Shrink each CLAUDE.md toward 200 lines", "updatedAt": "2026-10-27T17:52:00Z", "why": "Long files cost context and lower how well rules are followed. Keep AGENTS.md as a symlink."}, "o4": {"ask": "# Brief: o4, compliance-check writes its scorecard to one file\n\nRepo: shivinate7/claude-settings, from main 43d9af20. One lane: builder (sonnet), then reviewer (sonnet). Plan: roadmap step o4 note.\n\n## Task\n1. skills/compliance-check/SKILL.md, section \"4. Scorecard\": the scorecard is written to one file, `docs/health/compliance.md` in the checked repo, rewritten in place on each run (no dated copies). Name its shape (rule group, score, gold-standard column, gap) so the roadmap page (o8 lane 4) can read it. Use lint/layout.json for the folder if it names a health kind; if it does not, say so in the report rather than adding a second home.\n2. The skill reports the STE lint's gap on UI files (UI text the lint does not read) as a known gap in the scorecard, never by building a UI linter.\n3. If the skill has a script that writes output, it writes that file; if it is prose only, the prose says so.\n\n## Rulings\n- speak-rewrite-superseded-in-place; style-table-gold-column (any comparing table carries a gold-standard column).\n\n## Failure classes\n- A scorecard written beside an old one instead of over it.\n- A table with no gold-standard column.\n\n## Check that proves it done\nA test (or a compliance probe case) that is red on main (no fixed file, or no gold column) and green on the branch. `python3 bin/ci-job gates --lint --base origin/main` and `bin/ste-changed origin/main` pass (the silent-undo gitlink fixture is red on main 43d9af2 too; batch #700 fixes it).\n\n## Report\nAt most 12 lines: PR (draft), head, red run, green run, review verdict. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n", "note": "Landed in batch PR #629 (main be4b30e), Oct 26: #620 (Layout, Design and lane-cap probes), #627 (the two probe fixes), #630 (Copies points at copies.md). Ruling, Oct 26 (shiv, page item 23): the two probe fixes land now. Scorecard lane (brief briefs/o4-scorecard-file.md): PR #709 merged Oct 27 13:32 CDT. compliance-check now writes its scorecard to one file, docs/health/compliance.md, rewritten in place, with a gold-standard column and a known-gap row for the STE lint on UI files; the o8 page reads it (o8 lane 4). Two debts from review: health-folder-not-in-layout (needs a layout kind before r1) and scorecard-item-wrong-group. Later lanes: the layout group, once claude-settings is on o2's layout (it reads lint/layout.json plus each repo's extras file and reports any folder that is neither, ruling Oct 22); and the one-time word conversion, which runs o13's widened glossary check over a whole repo and lists each retired word, once o13's check lane lands (shiv's word, Oct 26, that older repos must not drift). r1 (run it on each child repo) waits for this. o12 leaves compliance-check's update to this step. Port: the skill installs everywhere; running it on a child repo is r1. Scorecard part on main, checked e0f9e2d Oct 28 (batch #711); docs/health in the layout is c143. Debt scorecard-item-wrong-group fixed: draft PR #739 (5df4dba5), probes print the group line first, Sonnet review approved; waits for a batch. The word conversion still waits on o13.", "order": 130, "phase": "organize", "status": "doing", "title": "Rework compliance-check", "updatedAt": "2026-10-28T07:05:00Z", "why": "Add layout and design groups, so it can see folder shape and screen readiness, not only CLAUDE.md rules."}, "o5b": {"ask": "Which of my hooks exist only to make sessions remember things, and which could filing-at-once replace?", "note": "Done: read-only audit, plans/o5b-memory-hooks-audit.md (read main b1e5a6d, Oct 26). No hook exists only to make sessions remember something filing at once replaces; keep all. ruling_home and feedback_gate are filing at once's only enforcement, and the handoff hooks carry in-flight state no file holds. Unknown: guard.log fire counts, on shiv's machines. The follow-up moved to o15.", "order": 140, "phase": "organize", "status": "done", "title": "Which hooks exist only to make sessions remember, and can filing at once retire them", "updatedAt": "2026-10-26T12:55:00Z", "why": "Guards that make a session remember are a backstop. What actually works: anything that matters goes to a lasting home (a repo file, a roadmap page) in the same turn it's said. A session's job is filing, not remembering, so a compaction or a lost session costs nothing. This includes fb: items: tasks and ideas land in the repo's todo, not only the handoff, and each closed item is checked against its home."}, "o6": {"note": "Done Oct 20: #525 (the map skill moves into claude-settings) carried the map work; the skill is skills/plain-english-map (decision map-skill-lives-here); #457 closed unmerged. Branch batch-map is gone (checked Oct 26). Left for Roll out: q_max still vendors its own copy in .claude/skills/plain-english-map, and it differs from claude-settings' copy in SKILL.md and four script files (b47bd00 against 149f4bc). Once q_max uses the shared skill, the skill's tests move here.", "order": 160, "phase": "organize", "status": "done", "title": "Merge the map PR #457", "updatedAt": "2026-10-26T05:45:00Z", "why": "After the cull. Fix its failing gates check, and consider generated structure with advisory checks."}, "o7": {"ask": "Sketch how the map, /board and compliance-check could become one repo health view.", "note": "Merged into o8 (triage, Oct 26): one repo view: the map, the session-board mod and compliance-check scores become panels of the repo's roadmap page.", "order": 160, "phase": "organize", "status": "done", "title": "Combine map, board and compliance-check into one repo health view", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your idea: the map shows structure, the board shows who is working on what, compliance-check scores the rules. One page could show a repo's whole health."}, "o8": {"ask": "# Brief: o8 lane 6, project-ops points at skills/roadmap\n\nRepo: shivinate7/claude-settings, from main 43d9af20 (batch #698). One lane: builder (sonnet), then reviewer (sonnet). Plan: plans/o8-living-roadmap-plan.md on the roadmap branch.\n\n## Task\nskills/project-ops/SKILL.md, section \"The roadmap page\", still says the page builder's one home is `roadmap/build.py` on the claude-settings roadmap branch and that a repo's own record \"has no page\". Since batch #637, skills/roadmap builds the page for any checkout, and since #652 the publisher passes live work with --live.\n1. Point project-ops at skills/roadmap as the one home for building and publishing the page; remove the stale claims. Keep the step file shape text only if skills/roadmap does not already state it; otherwise point at it.\n2. scaffold.py and templates/: anything that names roadmap/build.py as the builder for a new repo points at skills/roadmap instead. The roadmap/README.md the scaffold writes says how to build the page with skills/roadmap, including --live.\n3. If the triage role template (templates/operating-model.md or roster.md) says who publishes the page, it says triage passes --live at each publish.\n\n## Rulings\n- building-one-home-per-capability; speak-rewrite-superseded-in-place.\n\n## Failure classes\n- A scaffolded repo whose README names a builder that does not exist in that repo.\n\n## Check that proves it done\nA test in skills/project-ops/tests: red on main (the scaffolded roadmap/README.md names roadmap/build.py, or does not name skills/roadmap), green on the branch. Existing project-ops and roadmap tests pass. `python3 bin/ci-job gates --lint --base origin/main` and `bin/ste-changed origin/main` pass.\n\n## Report\nAt most 12 lines: PR (draft), head, red run, green run, review verdict. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n", "note": "Merged: lanes 1 to 3 (batch #637, main 54be9f1: skills/roadmap/ builds the page for any checkout); lane 5, live work option (a) (batch #652, main e305bdb: the publisher passes project threads and open PRs as --live). Lane 6 (project-ops points at skills/roadmap) merged in #704 (main 6a3e842); triage passes --live at each publish. Next cloud lane: option (c), each session writes its own line to the page's database; it needs o2's page key first and waits on item 29's meaning of layout-extras (build advisor, Oct 27). Now also shaped by c136 (one page, one writer). Plan: plans/o8-living-roadmap-plan.md (section 7 covers c and b). Rulings: Oct 26 (shiv, waiting page), (a) now and (c) after the local-write measure; Oct 21, the page is a current record, not a log; Oct 22, B, logbook, themed per repo from one token block. Merged in from o7: one health view (map, session-board, compliance scores). Linked: o16, o15. Port: yes for claude-settings, banchi, q_max, home-app, degen, mailaudit, joyous (each on your word, o16's deferred part); no for the two adblock repos. Placed ahead of c107 (triage, Oct 27): claude-settings' own page needs no answer. Deferred, lane (c) only (build advisor, Oct 27 12:45 CDT): its page key goes in .claude/layout-extras.json, whose meaning waiting-page item 29 decides; plan section 7 also needs o2's key first. Asked: waiting page item 3. Due after: item 29's answer and o2's page key.", "order": 103.33888, "phase": "organize", "status": "active", "title": "Give every repo a living roadmap page", "updatedAt": "2026-10-28T05:10:00Z", "why": "The process behind this page, made repeatable: audit the repo, turn the findings into phased steps with a plain why and an ask for each, publish one page per repo, and update it in place as lanes land. A /roadmap skill in claude-settings would build it from docs/plans and docs/debts, and the merge step would tick off the steps it completes. It pairs with the health view: health shows how the repo is, the roadmap shows what's next."}, "r1": {"note": "Ruling, Oct 26 (shiv, page item 16, a): roll out one visit per repo, after o2's layout move, with c42 first; before each visit, warn you which sessions in that repo to pause. Waits on o2. Not started. Waits for o4 (rework compliance-check). Cull first in each repo. Checked Oct 26 at q_max b47bd00 (last commit Oct 20): 819 debts and 570 decisions under docs/, up from 759 and 560 on Oct 17. Finding for home-app's visit (o8 plan thread, Oct 26, read only): records/backlog.md keeps timed counts (\"Counts at 03:00 ... at 09:25 ... at 13:30\"), a log, against your Oct 21 rule that a record holds what is true now. Ask (shiv, Oct 26 21:15 CDT): when r1 opens, tell him in one line that it is ready; he is waiting on that signal instead of running compliance-check now. Banchi, Oct 27 (waiting-page writer thread): until banchi has .claude/layout-extras.json, lint/layout.py looks for decisions and debts at top-level paths banchi never had; its unmerged branch chore/waiting-page (1f49581) adds the file, so no shared tool needs a change. Unchecked: kinds banchi lacks (docs/plans, docs/todo.md, docs/records.md). Due after: o2's claude-settings half, then the roll-out visits in order, c42 first (triage, Oct 27: not a cloud lane today). Also due after: c143 (a health kind in the layout).", "order": 310, "phase": "rollout", "status": "todo", "title": "Run compliance-check on each child repo", "updatedAt": "2026-10-27T17:55:00Z", "why": "Cull first in each one. q_max has 759 debts and 560 decisions."}, "r2": {"note": "Ruling, Oct 26 (shiv, page item 16, a): roll out one visit per repo, after o2's layout move, with c42 first; before each visit, warn you which sessions in that repo to pause. Waits on o2. Checked Oct 26 at q_max b47bd00: still three layers. src/index.css defines 156 --aq-* and 233 --f2-* custom properties, with Tailwind 4 (@tailwindcss/vite) on top and no tailwind.config file; Chat.tsx and Workbench.tsx define --aq-* values of their own. Per your Oct 20 ruling (o11), q_max's tokens.json is the one home for its values. Not started. Due after: o2's claude-settings half, then the roll-out visits in order, c42 first (triage, Oct 27: not a cloud lane today).", "order": 320, "phase": "rollout", "status": "todo", "title": "q_max: merge its three token layers", "updatedAt": "2026-10-27T17:52:00Z", "why": "--aq-*, --f2-* and Tailwind drift apart. One layer stops it."}, "r3": {"note": "Ruling, Oct 26 (shiv, page item 16, a): roll out one visit per repo, after o2's layout move, with c42 first; before each visit, warn you which sessions in that repo to pause. Waits on o2. Your ruling, Oct 20 (o11): home-app's tokens.json is the one home for its values, and both Swift and web are generated from it; claude-settings supplies ideas, not values. Checked Oct 26 at home-app f8a59b2: still true that nothing is generated. No tokens.json; web/style.css defines colors only, in a light and a dark set; Swift has no token file. Due after: o2's claude-settings half, then the roll-out visits in order, c42 first (triage, Oct 27: not a cloud lane today).", "order": 330, "phase": "rollout", "status": "todo", "title": "home-app: real tokens on both surfaces", "updatedAt": "2026-10-27T17:52:00Z", "why": "Swift has no token layer, and style.css tokens cover color only. Generate both from one tokens.json."}, "r4": {"note": "Ruling, Oct 26 (shiv, page item 16, a): roll out one visit per repo, after o2's layout move, with c42 first; before each visit, warn you which sessions in that repo to pause. Waits on o2. Checked Oct 26 at q_max b47bd00: all six homes still hold design truth. design/ (mockups, w15-layers), specs/ (design-audit, engine-design, grouping-design and more), docs/design.md (1,534 lines), docs/rules/ (ui-primitives among 14 files), src/styles.md (189 lines) and brand/ (four logo files). This is q_max's part of o2 (one layout, one DESIGN.md per repo). Not started. Due after: o2's claude-settings half, then the roll-out visits in order, c42 first (triage, Oct 27: not a cloud lane today).", "order": 340, "phase": "rollout", "status": "todo", "title": "q_max: merge its six design homes into one DESIGN.md", "updatedAt": "2026-10-27T17:52:00Z", "why": "design/, specs/, docs/design.md, docs/rules/, src/styles.md and brand/ all hold design truth today. One home is how its agents find the look."}, "r5": {"title": "Each repo drops its copies of claude-settings things and reads the one home", "phase": "rollout", "status": "todo", "order": 305, "why": "A drifted copy follows old rules while the home moves on, and nobody sees the gap.", "note": "Finding, Oct 26 (o11 lane, PR #619): the new copy finder lint/find_copies.py lists child-repo copies of claude-settings things. q_max: a drifted plain-english-map skill, the skip-locally-fail-in-ci helper and its test, the reference-transaction hook, import-reader.mjs. banchi: scripts/readme_links.py (a copy of actions/readme-links). ios-adblock, joyous and degen: each a drifted impeccable skill. Fix: remove each copy in that repo's roll-out visit and point it at the claude-settings home; the finder's list is the checklist. Follows the roll-out ruling (Oct 26, shiv, waiting page item 16): one visit per repo after o2, c42 first, with a warning which sessions to pause. Waits on o11 (#619) and o2. Port: yes, it is the port. Placed first in Roll out (triage, Oct 26): a removed copy makes every later roll-out step land on the home. Due after: o2's claude-settings half, then the roll-out visits in order, c42 first (triage, Oct 27: not a cloud lane today).", "ask": "", "updatedAt": "2026-10-27T17:52:00Z"}, "r6": {"title": "Each repo adopts the project way of working (skill project-ops)", "phase": "rollout", "status": "todo", "order": 306, "why": "o16 built the standing roles, roster, briefs and record-branch skeleton as one skill; each repo gets them only when it adopts it.", "note": "Deferred (shiv, Oct 26): you settle each repo's plan first. Ruling, Oct 26 (shiv, page item 16, a): roll out one visit per repo, after o2's layout move, with c42 first; before each visit, warn you which sessions in that repo to pause. Run it in the same visit as r1 and r5. Due after: o2's layout move; then each repo's plan goes to you. Source: o16, skill project-ops on main 54be9f1; o8 makes the roadmap viewer generic.", "updatedAt": "2026-10-27T01:20:00Z"}}, "topics": {"t01": {"order": 10, "points": ["Claude makes visuals by writing code without seeing the result. SVG maps closely to the picture because every element has coordinates; with HTML and CSS the layout comes out of flexbox, grid, the cascade and font metrics, which Claude has to predict. That's where spacing goes off and things overflow.", "What helps any session: a reference screenshot or a design system, a render-screenshot-fix loop, and a specific look ('dense, editorial, high contrast') rather than just the content.", "A great one-shot artifact is Opus on a blank canvas. In your repos, screens are built by Sonnet by rule, checked for compliance not feel, with polish tools off and the screenshot loop optional.", "Plan runs on Opus but writes steps, files, risks and checks in under 25 lines. It can't write files and never loads frontend-design or ux/, so every visual decision falls to the Sonnet builder.", "Design-review's blind reviewers run on Haiku in round 1 (agents/reviewer.md). Rounds escalate only on a FAIL, so a flat screen that passes is never looked at again.", "frontend-design loads only for a new screen or a repo with no design yet. impeccable's build commands (polish, layout, animate, bolder, delight) are refused by the guard rule impeccable-review-only.", "No browser MCP is configured anywhere, and claude-settings does not install Playwright (banchi and q_max bring their own). In solo mode, styling-only edits merge on passing checks alone.", "Word pressure: STE020 refuses button or label text over 4 words, and the fewest-words decision says it counts most in front-end work. There is no house icon set to fall back on.", "Across repos, screens that started from a mockup came out polished (banchi's #/gallery, q_max's home page, home-app's SpeakerSheet). The rest drift.", "How design-review is built: reviewer A checks the pinned Vercel web-interface rules plus your house checklist; reviewer B runs impeccable's audit and critique. Both are blind to the repo's design records; the orchestrator compares afterwards, and any clash goes to you. Nothing in it builds, and both reviewers inherit the reviewer agent's Haiku model."], "summary": "The core diagnosis behind the Design phase.", "title": "Why UI quality swings"}, "t02": {"order": 20, "points": ["banchi (strongest): tokens.css used about 7,100 times against 10 hex literals; DESIGN.md says the screenshot loop is mandatory; motion and iconography specs; 88 Playwright design checks. Gaps: nothing forces the loop; make screenshot renders at 1280 while CLAUDE.md asks for 1440 and 820; CLAUDE.md is 34.7KB.", "q_max: rigorous token rules and about 40 harness checks, but no taste guidance and no design skill. Three token layers (--aq-*, --f2-*, Tailwind). Browser checks run only on manual dispatch, nightly off. Several components are over half comments. Your own review: only the home page looks amazing, other pages look like plain text workpads.", "home-app: SpeakerSheet and the widgets, built from mockups in docs/design/, are polished. Views.swift is 1,927 lines with about 95 literal spacing values, many off the 4px grid. The web has 12 distinct radii, colour-only tokens, hand-synced 129/136/204px offsets, and 36 hand-drawn SVG icons mixed with Unicode glyphs. No Swift token layer. No screenshot tooling, and the simulator is rationed.", "home: ops records and four scripts. No UI.", "claude-settings: ux/ has behaviour and copy rules but thin visual values (4px gaps, 8px radius, role colours). No motion default and no icon set."], "summary": "banchi, q_max, home-app, home, claude-settings.", "title": "What each repo audit found"}, "t03": {"order": 30, "points": ["Frontend Code Arena, blind human votes, Sep 22, 2026: GPT-6 Astra first, Claude Fable 5.1 second, Grok 4.7 tenth.", "There is no single best model: one tester across four briefs split the wins between GPT-5.6 Sol and Claude Opus 5. The tooling around a model (rendering the page, a design system, references) matters about as much.", "Antigravity's strength is a built-in browser that renders and checks the UI. Reviews of its design output are mixed.", "Grok: Grok Build is a terminal coding agent (1.0 on Aug 7, 2026). No official desktop app; community GUIs exist. Grokbot is xAI's general agent app, not a coding tool. grok-plugin-cc runs Grok inside Claude Code for reviews and hand-offs.", "Tools by output: Figma Make and Google Stitch for editable mockups; UX Pilot for screens plus UX critique; v0 or Subframe for React; Relume and Uizard for wireframes; Midjourney or Firefly for images only.", "A good split: explore visual directions in one of those, then build and stress-test flows, states and copy with Claude."], "sources": [{"label": "Morph coding rankings", "url": "https://www.morphllm.com/best-ai-model-for-coding"}, {"label": "Thomas Wiegold on frontend LLMs", "url": "https://thomas-wiegold.com/blog/best-llm-frontend-design/"}, {"label": "Frontman tool roundup", "url": "https://frontman.sh/blog/best-ai-tools-ui-ux-designers-2026/"}, {"label": "Grok Build", "url": "https://en.wikipedia.org/wiki/Grok_Build"}], "summary": "Rankings, Antigravity, Grok, and which tool fits which output.", "title": "Models and tools for UI work"}, "t04": {"order": 40, "points": ["Add a designer (Opus, writes HTML mockups, write scope limited to design mockups) and a design-reviewer (Opus, since cost is no limit and visual judgment is where the strongest model pays off; it opens every screenshot). Skip a ux-builder: building to a mockup is ordinary builder work.", "Route with one test: does this lane touch a screen? If yes, the designer runs before the build and design-review after it. Nothing else changes.", "Keep builders, reviewers and test authors separate. A builder can't fairly review itself, and builders-cannot-edit-tests stops weakened tests. Solo mode is the right valve for small changes.", "Haiku at xhigh is fine for round-1 code review, where tests and CI catch what it misses. Not for screens: nothing downstream checks taste. To prove it, rerun a few past design-review screenshots through Haiku and Sonnet and compare.", "Don't add more agent kinds now; process load is the problem. Collections like wshobson/agents and VoltAgent are reading material for prompts, not installs. The roundup found no design reviewer agents in them.", "An agent that improves agents tends to add rules. Make it a pruner, and change an agent only when an eval shows the new version is better (skill-creator benchmarks, claude plugin eval).", "Token cost: frontend-design is about 1,500 words and impeccable's polish, layout and animate references about 2,500. Screenshots cost more (pages x sizes x themes x reviewers), so run design-review only on screen diffs, at the sizes each repo ships.", "With cost no limit, the Sonnet ceiling still makes sense for speed on routine work. Spend Opus where judgment is the point: planning, designing, and judging screens."], "summary": "Which agents to add, which not, and why.", "title": "Roles and agents"}, "t05": {"order": 50, "points": ["You run in bypass mode, so guards and deny rules are your only safety layer. Deny rules still block in every mode, bypass included.", "Deny rules match command text, so they miss /bin/rm or bash -c. Read and Edit deny rules also cover cat, head, tail, sed, tee and > or < redirects.", "The Bash sandbox is enforced by the OS however a command is spelled: writes only to the working directory, temp and added directories; network only to allowed hosts. Set allowUnsandboxedCommands to false, or a failed command retries unsandboxed with no prompt in bypass mode. macOS, Linux and WSL2 only: on native Windows, Claude Code runs commands unsandboxed.", "Sandbox plus deny rules can take: destructive-delete, the outside-the-repo part of rm-var-unguarded, env-file and frozen-path. The guard keeps the state- and content-based rules: merge-checks, records-page, draft-pr, cite-by-id, shared-tree, worktree-home, ask-alone, subagent-model-cap, impeccable-review-only and most git rules. Expect 4 or 5 of 22 rule families to move.", "Trust a guard by its test, not its code. A rule's prose leaves only when its row names a test, the test's case name states the ruling, and a mutant that breaks the guard is killed. Five of six guard rows named no test on Oct 17; c6 (proving tests for five guard rules) added them.", "Freeze new guard work except after a real incident, as your building-guard-needs-incident rule says.", "Experience counts too: you've seen fewer false stops this week. Track refusals and asks per session in guard.log to show it.", "Windows matters (found Oct 17): your guard carries heavy PowerShell support, so you run native Windows sessions, and the sandbox does nothing there. Guard code can retire only for sessions that run inside the sandbox. To retire it everywhere, your Windows sessions would have to move into WSL2. Until then, the sandbox adds protection on Mac but shrinks nothing.", "Also set failIfUnavailable, so a session refuses to run commands at all when the sandbox can't start, instead of quietly running them unsandboxed.", "How much of claude-settings is about Windows (measured Oct 17, main 5921750): 8 PowerShell or .cmd files, 3,248 lines; 1,206 lines in hook Python mention PowerShell, WSL, Windows, schtasks or the registry; 61 of 126 decision files and 48 of 364 debt files mention Windows, WSL or PowerShell. Mentions, not all Windows-only, but a large share of the system exists to make two platforms behave.", "Desktop app WSL sessions (docs): the Code tab can run a session inside WSL 2, with git, worktrees, parallel sessions and PR status working. Not yet available there: connectors and plugins, the integrated terminal, session forking, the file browser pane and @ file suggestions. Your mods (board, decision-watch, plain-diff and others) are plugins, so they wouldn't load in a desktop WSL session. Claude Code run from a terminal inside WSL is unaffected. On an organization-managed device, WSL sessions may be blocked by the admin.", "Decided Oct 17: Windows stays native. Losing your plugins in desktop WSL sessions is a dealbreaker. So the sandbox protects Mac sessions only, and the delete, env-file and frozen-path guard code stays, because native Windows has no sandbox. Revisit if desktop WSL sessions start loading plugins.", "Security scan findings on guards (Oct 22): the scanner counts a prompt-injected agent as an attacker, but your Oct 17 ruling (guards stop Claude's mistakes, not an attacker) puts evasion-only forms out of scope. So triage each one by the ruling's test: could Claude write it by mistake? First case, the arithmetic-shift heredoc misread (find_012G91jG65TkhbTbVde7dpKX), confirmed on main 987f682: a line is hidden only when a later line is exactly the shifted variable's name, which honest scripts never write; an unclosed one keeps every line in view. Advisor take: not a hole, no fix. A finding outside the guard, like the ste-lint import path (c35), is judged on its own."], "sources": [{"label": "Permission modes", "url": "https://code.claude.com/docs/en/permission-modes.md"}, {"label": "Permission rules", "url": "https://code.claude.com/docs/en/permissions.md"}, {"label": "Sandboxing", "url": "https://code.claude.com/docs/en/sandboxing.md"}, {"label": "Desktop in WSL", "url": "https://code.claude.com/docs/en/desktop-wsl.md"}], "summary": "What the built-ins can take over, and how to trust a guard.", "title": "Guards, sandbox and bypass mode"}, "t06": {"order": 60, "points": ["Oct 9 to Oct 17: hook Python 20,173 to 47,196 lines; decision files 64 to 134 (corrected from 133: measured 134 at 455bb21, and decisions/ has no README); debt files about 288 (Oct 15) to 364; CLAUDE.md 1,915 to 2,290 words. Counts exclude each folder's README.", "Of 1,037 non-merge commits since Oct 13, 978 touched guards, lint, merge tooling, debts or decisions. 36 touched ux/, skills or agents.", "Why it grows: every finding becomes a debt, and a guard change takes up to three review rounds plus the net-value test, so a cleanup lane breeds new work.", "Rulings sent: deletion fast path; notes tier for unlikely gaps; no history in the tree (git keeps it, keep a one-line reason); prose leaves only with proof; no file moves during the cull; time box to Monday Oct 19.", "Stop rule chosen: debts and decisions each cut under 5% for two batches running. It was never met; the cull closed Oct 19 on its time box. Hook lines just need to go down. Since Windows stays native (Oct 17), the sandbox won't bring the big hook cut; it has to come from culling guard code directly.", "Order, decided Oct 17: finish claude-settings end to end (clean up, organize, design) before touching any child repo. Any step's child-repo part moves to Roll out.", "In-flight lanes, decided Oct 17: you let work already in flight land before the rulings took effect. So batch #499 mixes in-flight lanes with cull lanes; don't hold its hook growth or flat debts against the cull.", "How to measure, so numbers match: decisions = files in decisions/; debts = files in debts/ minus README.md and notes.md; hook lines = lines of every .py under hooks/, tests included; words = wc -w of CLAUDE.md. Done on a commit with git ls-tree and git show."], "summary": "The numbers, the cause, and the rulings you sent.", "title": "The cull, and why the system kept growing"}, "t07": {"order": 70, "points": ["The sweep never fetches. Its pushed check passes every remote head to git rev-list. If one head isn't in the local clone, git fails with 'bad object', and the sweep keeps every worktree in that repo as unreadable-subject. This was tested.", "GitHub merge commits and cloud-session pushes mean a clone almost always lacks some remote head until a session happens to fetch.", "Remote heads, Oct 17: claude-settings 244, banchi 313, q_max 1,017, home-app 54. claude-settings is down to 28 (c4, delete merged remote branches); the child repos wait for Roll out.", "Fixed in claude-settings: the sweep fetches with --prune first and drops heads still missing (c3, fix the janitor sweep), and each merge now cuts the lane branches its batch absorbed (c4)."], "summary": "The janitor sweep's root cause, and the fix.", "title": "Why worktrees pile up"}, "t08": {"order": 80, "points": ["The test: can every agent find the right file in any repo without being told where it is?", "Three questions decide where a file goes: is it current truth or history? does it die when the work ships? does every repo have one?", "Layout (o2, drafted Oct 22): CLAUDE.md under 200 lines with AGENTS.md as a symlink; .claude/rules/; docs/decisions, docs/debts with notes.md, docs/plans (deleted on ship), docs/specs (how a shipped feature works), docs/records.md; with screens, docs/design (DESIGN.md, mockups, reference), tokens/tokens.json, shots/ gitignored. A repo declares its own extra folders; one layout file in claude-settings is what every tool reads.", "Path-scoped rules (paths: frontmatter in .claude/rules/) load only when Claude touches matching files; ~/.claude/rules/ applies in every project. Your installer doesn't land a rules folder yet.", "Tokens in the W3C Design Tokens format (stable since 2025.10), generated into CSS and Swift with Style Dictionary or Terrazzo.", "No history in the tree: delete superseded decisions, since git keeps them.", "Don't restructure code into apps/ and packages/: one app with a backend gains little from a monorepo layout.", "q_max keeps design truth in six places (design/, specs/, docs/design.md, docs/rules/, src/styles.md, brand/). Merging them into docs/design/DESIGN.md is a copy-delete, which fits the cull's own rule.", "Folders sort volume but don't reduce it: q_max's 759 debts and 560 decisions stay unreadable until they're culled.", "One home, then variants (o11, topic t18): claude-settings holds the shared ideas and shared tools (scripts/shoot, skills); each repo holds its own concrete design (tokens, components) in one home and points at the ideas instead of restating them."], "sources": [{"label": "CLAUDE.md and rules", "url": "https://code.claude.com/docs/en/memory.md"}, {"label": "W3C Design Tokens stable", "url": "https://www.w3.org/community/design-tokens/2025/10/28/design-tokens-specification-reaches-first-stable-version/"}, {"label": "Monorepo pitfalls", "url": "https://www.pkgpulse.com/guides/javascript-monorepos-2026-best-practices-pitfalls"}, {"label": "Measuring AGENTS.md", "url": "https://aaif.io/blog/measuring-agents-md-what-five-runs-show-that-one-doesn-t"}], "summary": "One layout for every repo, checked against current practice.", "title": "Folder layout and conventions"}, "t09": {"order": 90, "points": ["Spacing comes from relationships, not numbers. banchi's table: icon to text 6, control to control 8, row to row 12, block to block 16, section to section 24.", "Put spacing on containers: gap on a parent (a Stack, Row or Grid; VStack(spacing:) in Swift), not margins on each child. Gaps are then uniform by construction.", "Compose screens from a few layout primitives (Stack, Cluster, Sidebar, Grid), the 'Every Layout' approach. Use clamp() tokens for spacing that grows smoothly from phone to desktop.", "Pay the debt with banchi's per-file ratchet (token-literal-check), so the count of stray values can only fall. Redesign one screen at a time, mockup first.", "Motion has four jobs only: answer a press, show where a thing came from or went, say a state is live, mark a rare result. Name roles with tokens; each repo keeps its own durations.", "Icons: words for anything costly, irreversible or factual; an icon only when the verb is in the house vocabulary. This also answers the 4-word label limit."], "summary": "How to get uniform gaps without pinning numbers.", "title": "Spacing, motion and icons"}, "t10": {"order": 100, "points": ["The rules already exist (style-plain-words, style-option-says-effect), and a Sonnet judge checks each question for a missing better option and for gain and loss.", "The problem is a conflict: plain words must add no length, and short and plain are 'one goal', so the only way to be both is to compress.", "Fix: plain wins over short; each option gets one plain line on how it works; options that can't be told apart mean fewer options, or a decision made and stated.", "Oct 17, from a home-app question: one question bundled two decisions (paste vs key-by-key, and whether the arrows hide), so the only way to answer each was 'Other'. Rule to add: one decision per question.", "Same question: whether the arrows hide is a visual choice, and words like 'they crowd the screen' or 'the keyboard has room' can't be judged without seeing it. You answered 'I want a visual comparison', and say you answer visual questions that way every time. Rule to add: a question about how something looks says so, and shows a picture of each option (step 'Visual questions come with a picture of each option').", "Your waiting page for this project (claude-settings): https://claude.ai/artifact/RddcgXbB6SvTrFZHPmsvFx (this account, made Oct 28 by triage 9; the old page, https://claude.ai/artifact/9PJB2skRSMtCC4XHvzbmB8, is on shiv's other account and reads 404 here). Republished in the final look (c100 template, main 2ca8925) on Oct 27 11:35 CDT, with db and comments; items and answers kept. Superseded mockups, not live, keep out of the way: Waiting Page Final (https://claude.ai/artifact/2DodmME3zxVTmi26B3KzBR, the approved design, now built), Waiting Desk, Waiting Triage, Waiting Page Frame, Calm Waiting Page, Banchi Answer Desk, and the old \"Waiting on Shiv\" title of the live page."], "summary": "Why explanations still come out too engineered.", "title": "Reply style and questions"}, "t11": {"order": 110, "points": ["fb: fits how you work, since you post in the right repo's session. Two gaps: a task can live only in the handoff, outside git, and [closed] is self-attested. Fix: home tasks in the repo, and check each closed id against its home.", "/board was a proof of concept built from three plain elements (Box, Text, Button). The desktop app also offers Svg, Markdown and a custom Client region. Add done, now and next per session, read from each handoff.", "Map: merged Oct 20 in #525 (the map skill moves here), which replaced #455, #456 and #457. Every new file needs a map line; generating the structure from code and making the sync checks advisory are still worth weighing.", "Health view: the map (structure), /board (live work), compliance-check (rules), plus the size numbers and the sweep's keep reasons.", "Roadmap per repo: debts, feedback items, repo plans, session plans, PRs. Read each from its one home, store no copy, show freshness, and mark anything unreadable as unknown. Session-only items need homes in git first; live session state stays in /board."], "summary": "Your own tools, and how they fit together.", "title": "fb:, map, board, health view and roadmap"}, "t12": {"order": 120, "points": ["Project instructions apply to every chat in a project, and chat search inside a project covers only that project's chats. The advisor guide lives there.", "GitHub in project knowledge is a snapshot of chosen files, refreshed only when you press Sync, and it uses up context. Cloning the live repo in chat, as we did, is fresher, so the project doesn't sync repos.", "Artifact comments are anchored to an element. A thread sent to Claude can be read, answered and resolved by a session, and a running Claude Code session replies on its own. Comments need
