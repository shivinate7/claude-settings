lint steps pass, or name the ones that cannot run here. bin/ste-changed origin/main.\n\n## Report\nAt most 12 lines: PR, head, red run, green run, review verdict. Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c125": {"title": "A lane runs every gates lint step before it joins a batch", "phase": "cleanup", "status": "done", "order": 103.3386, "why": "Build advisor, Oct 27: batch #680 went red on test_settings_matcher and #690 on check_comment_narration and the glossary check; each was a lint step the lane never ran.", "note": "Merged Oct 27 (PR #692): `bin/ci-job gates --lint --base origin/main` runs the 51 lint steps it picks from gates.yml step commands, and no hook suite or mutation test. The brief template names it as the batch-join check, with `bin/ste-changed origin/main` beside it, since the STE lint is a uses: step the mode skips. Built and reviewed by Sonnet. Merged in #697 (2ca89254), Oct 27 11:01 CDT.", "updatedAt": "2026-10-27T16:05:00Z", "ask": "# Brief: c125, a lane runs every gates lint step before it joins a batch\n\nRepo: shivinate7/claude-settings, from main d4e1b86. One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\nThree batches went red on Oct 27 from lint steps the lanes never ran (`check_comment_narration`, `test_check_glossary`, `check_record_slugs`). `bin/ci-job` already runs every step of a workflow job (one home; extend it, do not write `bin/gates-local`).\n- Add a mode to `bin/ci-job` that runs only the gates job's fast lint and check steps: every `python3 lint/...`, `python3 actions/...` and `bin/ste-changed` step, not the full hook suites or mutation tests. Pick the set from the step commands, not a hand list (building-allow-list-is-the-constant).\n- The lane brief template (where briefs are written: skill project-ops templates and any brief template in the repo) names that command as the lane's batch-join check.\n- The rule lanes-run-no-full-ci-job stays: this mode is lint only. Update its record in place if its wording now conflicts.\n\n## Rulings\n- roles-each-layer-proves-once: full suites and mutation tests stay CI's.\n- building-one-home-per-capability: extend ci-job.\n\n## Failure classes\n- A lint step added to gates.yml later that the mode misses (the test must build the set from gates.yml).\n- The mode running a full suite by accident (a step whose command matches the pattern but runs `hooks/test_guard.py`).\n\n## Check that proves it done\nNew cases in ci-job's test file, red on main d4e1b86, green on the branch: the mode lists exactly the lint steps of today's gates.yml, and a fake workflow with a new lint step is picked up. Run the new mode on the branch itself and give its verdict. Also lint/rule_audit.py, lint/hook_catalog.py --check, bin/ste-changed origin/main.\n\n## Report\nAt most 15 lines: PR, head, the mode's name, the step count it runs and its wall time, red run, green run, review verdict. Send the green, reviewed head to the build advisor. Do not rebase onto main and do not merge.\n"}, "c126": {"title": "Lanes never write the waiting page; the orchestrator writes every item", "phase": "cleanup", "status": "done", "order": 103.33845, "why": "Your gripe (cmsg_01DoF7thf3iq2Srr1UsfXgh2CXvhMFur6osdbZSUTWVPZL), via the thread \"Find why banchi's lanes were told to write the waiting page\": a banchi orchestrator told its lanes to post their own items.", "note": "Fix: a lane (subagent or lane session) puts its question in its report; the orchestrator writes the item with itself as owner and routes the answer back. Red first on a lane brief that tells a lane to post. Needs no answer. Placed ahead of c120, after d9 (triage, Oct 27): a gripe, and it touches every orchestrated question. Brief: briefs/c126-d9-waiting-page-writer-and-pictures.md (one lane with d9), dispatched Oct 27 11:35 CDT. Ruling Oct 27 12:15 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2JTri9SaU6kmwj1ysw38q14): each page has one writer (triage in this project, the orchestrator in a repo); others send it their questions; it sets `rank` inside the fact tiers against every open item and re-ranks on each add or close; `owner` stays the asking session, so answers are not relayed. Red twice on waiting-page viewer test 88 at 390 wide (#710, #716); branch claude/project-thread-xczmrz b41fb51. Fix the page, never the test; merge main and reconcile with #713 first (brief briefs/c126-fix-viewer-after-c130.md). One lane with d9 and c131: green and reviewed Oct 28, draft PR #732 (6c4dfc04), queued for batch 2. Main merged in; the viewer's 390 cut fixed (minmax(0,1fr), head set before the fit) with a caption while the title cuts; Opus design review passed round 3 at 320 to 1440, light and dark; Sonnet code review clear round 3; eight review notes in docs/debts/notes.md. Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #732.", "updatedAt": "2026-10-28T06:45:00Z", "ask": "# c126 and d9: the waiting page gets its items from the orchestrator, with pictures inline\n\nBuilder lane, claude-settings, from main 2ca89254. Two steps, one lane, one commit each, because\nboth edit skills/waiting-page. Report cap: 25 lines.\n\n## c126: lanes never write the waiting page\n\nThe defect: skills/waiting-page/SKILL.md (\"from every session\") and decision questions-go-to-owner\nnever say who writes when an orchestrator runs lanes. A banchi orchestrator told its lanes to post\ntheir own items. A subagent lane has no wake after it ends, so it cannot read its answer, and two\nwriters clash on the design republish (\"Add a design\", step 4).\n\nThe fix: a lane (a background agent or a lane session) puts its question in its report. The\norchestrator writes the item, with itself as `owner`, and routes the answer back to the lane or\nits next try. Say it in the skill's opening paragraph and in \"Add an item\", and in decision\nquestions-go-to-owner, in place (no history). Red first: the brief check (hooks/agent_brief.py, the\nAgent prompt hook) flags a lane brief that tells the lane to write a waiting-page item, if that hook\nis the home for brief rules; otherwise say which home you used and why.\n\n## d9: a design pick shows a picture of each option, inline and first\n\nshiv's gripe, Oct 27 09:50 CDT: banchi's item 30 (where a card's price history shows) linked its\nthree mockups as \"a folder on GitHub\". A link to a folder, repo or file is never enough.\n\n1. Skill: a question about how something looks carries one design per option (\"Add a design\"),\n   drawn on the first device of the repo's app kind (the Duo folded for iOS, a phone width for\n   web). The full mockup stays one tap away.\n2. skills/waiting-page/page.html: an item's designs show at the front of its card, before the\n   option list, not after it. An item whose options name a design that the item does not carry\n   shows a plain warning line in place of the picture, so a missing picture is seen, not hidden.\n3. hooks/reply_judge.py: its prompt flags a reply that asks the owner to pick between visual\n   options and only links to them.\n\nRed first, in skills/waiting-page/tests/page.test.mjs and hooks/test_reply_judge.py: an item shaped\nlike banchi's item 30 (three visual options, a GitHub folder link, no designs) shows the warning;\nan item with designs shows them before the options. The reply judge case is red on main.\n\n## Done when\n\nThe new cases are red on main and green on the branch, `node --test skills/waiting-page/tests/page.test.mjs`\nand `python3 hooks/test_reply_judge.py` pass, and `bin/ci-job gates --lint` plus `bin/ste-changed`\npass. Check the page at phone and desktop width in both themes, headless. Give a verdict per\nscreen. A reviewer (sonnet) reads the diff. Commit trailers as the project requires. Push the\nlane branch, send the green, reviewed head to the build advisor, and never merge.\n"}, "c127": {"title": "A small shared set of lint and type tools covers every language in the repos", "phase": "cleanup", "status": "active", "order": 103.375, "why": "Proposed and widened by you, Oct 27 (cmsg_01DoF7thf3iq2Srr1UsfXgh2RAHCgXRgVqY8FQzV1SZAPx, cmsg_01DoF7thf3iq2Srr1UsfXgh2AS65GEmZso8CawVbTFZUGD): no claude-settings step, rule or config covers type checking; c21 covered Ruff and ShellCheck only.", "note": "Survey and pick: https://claude.ai/artifact/K4ixuAMi4ycpBvgm2x4k3H. Python: mypy strict one module at a time (banchi, degen, claude-settings), Ruff with bug rules in every Python repo. TS: tsc --noEmit strict everywhere; astro check in joyous; q_max strict over time, its .mjs files get checkJs last. Swift: the compiler, ios-adblock to Swift 6 mode, warnings fail CI; no SwiftLint. ShellCheck spreads to banchi, ios-adblock and home-app. Skip stylelint and sqlfluff. Formatters (ruff format, Prettier, swift-format): adopt after o2; reformat each repo once while no lane is open, list that commit in .git-blame-ignore-revs, then check changed files only (absorbs c21's ruff format); keep zizmor. Home: one composite action actions/code-check with pinned versions, CI only (c21), a strict list per repo that only grows. Order: claude-settings, joyous, ios-adblock, banchi, degen, q_max. The claude-settings part needs no answer. Brief: briefs/c127-code-check-claude-settings.md (text in Ask). Deferred (shiv, Oct 27): each other repo's roll-out needs your word. Port: yes. Placed after c78 (triage, Oct 27). Consistency (shiv asked, Oct 27): every language gets three layers (type check, bug lint, formatter), or a one-line reason in the standard's table for each layer it skips; the shared action fails on a repo language with no row. Asked: waiting page item 2 (yes to the one plan, https://claude.ai/artifact/S6Eou4tPnLmypAXzoUdyEA). Part 1 (claude-settings: actions/code-check, .code-check.json) is on main, checked e0f9e2d Oct 28 (batch #711). Remains: each other repo's roll-out, on your word.", "updatedAt": "2026-10-28T05:10:00Z", "ask": "# Brief: c127 part 1, one shared code-check action, adopted by claude-settings first\n\nRepo: shivinate7/claude-settings, from main 43d9af20 (batch #698). One lane: builder (sonnet), then reviewer (sonnet). Plan: roadmap step c127 note and https://claude.ai/artifact/K4ixuAMi4ycpBvgm2x4k3H (survey and pick).\n\n## Task\n1. A composite action `actions/code-check` with pinned tool versions, CI only. Per language, three layers (type check, bug lint, formatter), or a one-line reason in the standard's table for each skipped layer. The action fails on a repo language with no row.\n   - Python: Ruff with bug rules (today `pipx run ruff==0.17.1 check .` in gates.yml, rules in ruff.toml), and mypy strict over a per-repo list of modules that only grows.\n   - Shell: ShellCheck. TS: `tsc --noEmit` where a tsconfig exists.\n   - Formatters wait for o2 (one layout); their rows say \"after o2\" and the action does not run them yet.\n2. The standard's table: one home (a doc or json beside the action), with a gold-standard column, read by the action. \n3. claude-settings adopts it in gates.yml in place of its Ruff step. Start the mypy list with at least one module that passes strict today, and say which.\nChild repos are out of scope (each needs shiv's word). c129 also edits gates.yml; keep your edit to the lint step.\n\n## Rulings\n- building-one-home-per-capability; verification-newest-that-passes (pin the newest that passes, read its changelog).\n- c127 note: skip stylelint and sqlfluff; no SwiftLint; actionlint only after an incident.\n\n## Failure classes\n- A list that can shrink without a red check.\n- A language in the repo with no row that the action passes silently.\n\n## Check that proves it done\nTests of the action's language-row logic: red on main (no action), green on the branch, including a planted language with no row (red) and a planted mypy error in a listed module (red). `python3 bin/ci-job gates --lint --base origin/main` and `bin/ste-changed origin/main` pass.\n\n## Report\nAt most 15 lines: PR (draft), head, red runs, green runs, review verdict, the starting mypy list. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n"}, "c128": {"title": "The waiting-page time test cannot expire", "phase": "cleanup", "status": "done", "order": 103.25, "why": "Found by the c120 lane, Oct 27 10:56 CDT: since 09:45 CDT every CI run is red (gates-shoot on main and every branch; run 40530284999, claude-settings a97af49).", "note": "Done: lane ci-waiting-page-date merged in batch #697 (main 2ca8925, Oct 27 11:01 CDT); the test's due date is now 2099. Cause: the test \"times are 24-hour Chicago time with the zone named\" in skills/waiting-page/tests/page.test.mjs sets a due date of 2026-10-27T14:45:00Z and asserts \"Answer by Oct 27, 09:45 CDT\"; past that time the page shows \"Answer was due ... 1 hour ago\". Fix: a fixed fake clock in the test (or a due date relative to now), so the assertion keeps its meaning and cannot expire; never skip or weaken it.", "updatedAt": "2026-10-27T16:30:00Z"}, "c129": {"title": "The local gates run matches CI: the STE lint step, and the silent-undo test on git 2.43", "phase": "cleanup", "status": "done", "order": 103.3386, "why": "Findings from the c125 lane (lanes run the gates lint before batching), Oct 27.", "note": "Merged to main in batch #700 (9264397), Oct 27 12:07 CDT, via lane PR #699 (builder sonnet, reviewer sonnet). The local gates lint run now covers the STE lint step, and the silent-undo gitlink test passes on git 2.43. Port: no; it lives in claude-settings.", "updatedAt": "2026-10-27T17:15:00Z", "ask": "# Brief: c129, the local gates run matches CI\n\nRepo: shivinate7/claude-settings, from main 43d9af20 (batch #698). One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\nTwo gaps between `bin/ci-job gates --lint` and the gates job in CI.\n1. gates.yml runs the STE lint as a `uses:` action step, so `ci-job --lint` skips it. Make the local run cover it: either a `run:` step in gates that calls `bin/ste-changed`, or `ci-job` that knows the action and runs `bin/ste-changed` in its place. Pick the one with one home for the STE check; say which and why.\n2. `lint/test_check_silent_undo.py::test_a_gitlink_with_an_absent_commit_is_not_unknown` errors in a cloud container with git 2.43 (path: check_silent_undo's absent-commit read). Find the cause. Fix it if the check is wrong on that git; if only the test is wrong, re-point it; if neither can change, record a debt with the git version and the read.\n\n## Rulings\n- outcomes-tests-are-claims (re-point or fix, never skip).\n- building-one-home-per-capability.\n\n## Failure classes\n- A local run that says green while CI's STE step would go red.\n- A silent-undo check that reports \"clear\" for an absent commit on some git version (a missed undo).\n\n## Check that proves it done\n(1) a test of ci-job (lint/test_ci_job.py) red on main: the gates lint run on a branch with an over-long sentence in a changed .md does not fail; green on the branch. (2) the silent-undo test red in this container on main, green on the branch; state `git --version`. `python3 bin/ci-job gates --lint --base origin/main` and `bin/ste-changed origin/main` pass.\n\n## Report\nAt most 12 lines: PR (draft), head, red runs, green runs, review verdict. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n"}, "c13": {"note": "Done Oct 21. Landed in PRs #541 and #542 (the hook load batch): config_watch hashes first and exits before loading the guard; local_time no longer pulls in the guard family (new shared_names module); stall_watch exits at once on Windows; ci_wake got a pre-filter; the SessionEnd fetch runs at most once per 10 minutes per repo; verdict logs older than 7 days are pruned. The lane report was lost, so it closed on repo evidence. What was left moved: the Stop dispatcher and cached git reads to c19 (start fewer processes per tool call), the double question judge to c7 (fix the reply-style conflict).", "order": 99, "phase": "cleanup", "status": "done", "title": "Cut the load hooks add to every tool call", "updatedAt": "2026-10-21T17:30:00Z", "why": "A q_max session's report (Oct 20) found a model call on every Edit and Write, two judges on each question, about 6 hook launches per Bash call, 9 Stop hooks per turn, and the guard family (14 modules, 9,926 lines) loaded on every prompt. This is the first concrete plan for hook code, the one number the cull never moved."}, "c130": {"title": "A waiting-page template change republishes every live page in the same batch", "phase": "cleanup", "status": "done", "order": 103.3383, "why": "Your gripe, Oct 27 11:29 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2EB8RJ6xNPZk348QaJoN82A): this project's waiting page still had the old look hours after the final look (c100) merged; c121 covered only the three repo pages in another account, and nobody owned this one.", "note": "Fixed by hand Oct 27 11:35 CDT (triage): this project's page (https://claude.ai/artifact/9PJB2skRSMtCC4XHvzbmB8) republished from main 2ca8925 with db and comments; its 5 open items survived. Fix: one list of live waiting pages (each repo's extras key, plus this project's page), and the batch that changes skills/waiting-page/page.html republishes each page this account can reach before the batch report; a check compares each page's published template against main and lists any page left behind, with its owner; a page in another account is named, never silently skipped (c121). Red first on today's case. Needs no answer. Brief: briefs/c130-republish-live-waiting-pages.md (text in Ask), dispatched Oct 27 11:55 CDT from main 43d9af2. Port: yes, every repo's page. Placed ahead of d9 (triage, Oct 27): a gripe, and a stale page hides the work you already approved. Review notes (non-blocking, Oct 27): the stale-page check's text match is unmeasured on a real host-wrapped read (risk is a false \"behind\", never a false \"current\"), so run it once on the live project page; with no repo roots given it reads only sibling clones and does not say the list is partial. Merged Oct 27 in batch #704 (main 6a3e842).", "updatedAt": "2026-10-28T05:00:00Z", "ask": "# Brief: c130, a waiting-page template change republishes every live page in the same batch\n\nRepo: shivinate7/claude-settings, from main 43d9af20 (batch #698). One lane: builder (sonnet), then reviewer (sonnet).\n\n## Task\nToday a batch that changes skills/waiting-page/page.html leaves every live page on the old template until someone notices (Oct 27: this project's page, fixed by hand at 11:35 CDT).\n1. One list of live waiting pages: each repo's page key in its `.claude/layout-extras.json` (lint/layout.json names the extras file), plus this project's page. One home, read by every caller.\n2. A command (in skills/waiting-page, beside its other tools) that, for each listed page, compares the published template with page.html on main and prints each page left behind with its owner. A page this account cannot read is named as unknown, never skipped (c121: the live repo pages sit in a third account).\n3. SKILL.md: the batch that changes page.html republishes each page this account can reach before the batch report, keeping the db and comments capabilities and the saved items; the report lists the command's verdict.\nTwo other lanes edit skills/waiting-page now (c131 item ids, c126+d9 writer and pictures). Do not change page.html; keep SKILL.md edits to one new section.\n\n## Rulings\n- building-one-home-per-capability; verification-report-unknown-reads.\n\n## Failure classes\n- A page in another account counted as current.\n- A republish that drops db or comments, so saved answers vanish.\n\n## Check that proves it done\nA test with two fixture pages (one current, one on an old template) and one unreadable: red on main (no command), green on the branch, the old one and the unreadable one named. `python3 bin/ci-job gates --lint --base origin/main` and `bin/ste-changed origin/main` pass.\n\n## Report\nAt most 12 lines: PR (draft), head, red run, green run, review verdict. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n"}, "c131": {"title": "A waiting-page answer always saves to its item, even when the item has no id field", "phase": "cleanup", "status": "done", "order": 103.33825, "why": "Your gripe, Oct 27 11:26 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2KjDb58BKeFGkYX5Wiy92vx): banchi's items 29 to 32 had no id field, so each Save wrote answers/<undefined> and you could not save a pick.", "note": "Checked on main 2ca89254: skills/waiting-page/page.html drops the database key when it loads items, and nothing refuses an item with no id. Fix, built in the thread \"Stop waiting-page answers saving to nowhere\" on branch waiting-page-item-ids: the page keys each item by its database key, refuses Send on an item with broken fields and says why on its card, and SKILL.md \"Add an item\" reads the item back. Red first on main. After merge, c130 republishes every live page. Needs no answer. Port: yes; one template serves every page. Green in c126's lane: draft PR #732 (6c4dfc04), batch 2. Placed ahead of c130 (triage, Oct 27): a save that goes nowhere loses your answer. Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #732.", "updatedAt": "2026-10-28T06:45:00Z"}, "c132": {"title": "A repo sets its own waiting-page branding: colour and icon", "phase": "cleanup", "status": "todo", "order": 103.33835, "why": "Your question, Oct 27 11:37 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2RLR9ApAqe47Chyjxe1AwLm, screenshot of degen's blue page): how did the colour get hardcoded; can a repo pick its own?", "note": "Today (main 43d9af2) the page draws every colour from one field, brand, in its own database, which a session can change with no PR. Its first value comes from claude-settings' docs/design/repo-colours.json, which reads each repo's own app accent (degen: tokens.json's light accent, #0b5fff). The gap: a repo cannot state its page colour in its own files, so a fresh page or a roll-out writes the claude-settings value again. Widened, Oct 27 12:06 CDT (shiv, cmsg_01DoF7thf3iq2Srr1UsfXgh298aGFo8vjqTL5AUirUzSzF, with a screenshot of degen's header): the header's boxed letter gives way to the repo's own app icon or logo where it has one; the boxed letter stays the fallback. The icon is embedded inline (SVG or a small PNG data URI), since the page loads no outside images. Next cloud lane: one branding setting in a repo's .claude/layout-extras.json, waiting-page-colour plus waiting-page-icon (a path to the repo's icon file); skill waiting-page step 3 and lint/repo_colour.py's colour_for read it first, then repo-colours.json; the page's 4.5:1 contrast check stays. Same lane: a check reads each repo's named accent source and reports drift from repo-colours.json, so a repo that changes its own accent is caught (from the c130 outbox, Oct 27). Red first on a repo whose extras colour or icon is ignored. Port: yes, every repo's page. Placed after c130 (triage, Oct 27): both are waiting-page upkeep. Deferred (shiv, Oct 27; build advisor's call 12:45 CDT): it adds a key to .claude/layout-extras.json, whose meaning waiting-page item 29 (re-asked 11:58 CDT) decides. Asked: waiting page item 3.", "updatedAt": "2026-10-28T05:10:00Z"}, "c133": {"title": "A report rewritten after a missing-report block is still checked for model names and Unstarted", "phase": "cleanup", "status": "done", "order": 103.33895, "why": "Known gap from c101 (the reply judge checks every report), left in its note when it merged Oct 27.", "note": "Today the gate stays quiet on the rewrite after a missing-report block (it runs with stop_hook_active set), so a report sent then is never checked for model names or the Unstarted line. Next cloud lane: on that rewrite, run the model-name and Unstarted checks once more, still with one correction tail and no loop; red first on a rewrite that drops the Unstarted line. Needs no answer. Brief: briefs/c133-report-rewrite-checked.md (text in Ask), dispatched Oct 27 12:00 CDT from main 43d9af2. Green and reviewed (lane PR #706, head 84c6b29; builder sonnet, reviewer sonnet x2); joins the batch after #704. Port: no; the hook lives in claude-settings and installs everywhere. Placed after c129 (triage, Oct 27): small, and it closes a hole in a check every report passes. Merged Oct 27 in batch #711 (main d3a9de2).", "updatedAt": "2026-10-27T17:25:00Z", "ask": "# Brief: c133, a report rewritten after a missing-report block is still checked\n\nRepo: shivinate7/claude-settings, from main 43d9af20. One lane: builder (sonnet), then reviewer (sonnet). This changes a check's verdict, so it gets up to three review rounds and, after round 3, the net-value test.\n\n## Task\nlint/report_gate.py stays quiet whenever stop_hook_active is set (see its main and the comment on the correction tail). So the report a session writes after a missing-report block is never checked for model names (reports-done-names-models) or the `Unstarted:` line (reports-name-unstarted-items).\nOn a stop_hook_active run whose previous block was the missing-report block, run those two checks once on the rewrite. Keep one correction tail and no loop: a second block on the same rewrite never happens. Every other stop_hook_active run stays quiet as today.\n\n## Failure classes\n- A loop: the gate blocks the rewrite, then blocks the rewrite of the rewrite.\n- A false alarm on a rewrite that names its models and Unstarted line correctly.\n\n## Check that proves it done\nCases in the report gate's tests: red on main (a rewrite after a missing-report block that drops the Unstarted line passes), green on the branch; a second rewrite stays quiet; a correct rewrite passes. `python3 bin/ci-job gates --lint --base origin/main` and `bin/ste-changed origin/main` pass (the silent-undo gitlink fixture is red on main 43d9af2 too; batch #700 fixes it).\n\n## Report\nAt most 12 lines: PR (draft), head, red run, green run, each review round's verdict. Send the green, reviewed head to the build advisor thread \"Advise the claude-settings build (9)\". Do not rebase onto main and do not merge.\n"}, "c134": {"title": "A control sits next to what it changes", "phase": "design", "status": "done", "order": 103.33896, "why": "Your gripe, Oct 27 11:54 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2RdkcPenYiHE7EDh6dxrMba): on the roadmap page the Plan, Changes and Reference tabs sat at the top, while what they change began below the summary and the phase rail.", "note": "Fixed on the roadmap page (triage, Oct 27): the summary and the phase rail now show on Plan only, and a tab press scrolls to the top, so Changes and Reference start right under the tabs. Next cloud lane: a rule in docs/design/layout.md, \"A control sits next to the area it changes; anything between them belongs to every state of that control\", with a check in design-review's checklist; the waiting page's tabs are the first case to check. Needs no answer. Port: yes, docs/design governs every repo's screens. Placed ahead of c107 (triage, Oct 27): small, and a gripe. Dispatched Oct 27 13:22 CDT by build advisor (10), brief briefs/c134-control-next-to-area.md. Lane done Oct 27: branch claude/project-thread-32f5fo, 47ac733, green and reviewed; waiting-page tabs pass; queued for the next batch. Merged Oct 27 in batch #723 (main e0f9e2d).", "updatedAt": "2026-10-27T17:00:00Z", "ask": "# c134: a control sits next to what it changes\n\nCloud build thread brief. Build advisor (10), Oct 27, against claude-settings main 6a3e842\n(rebase-free: start from origin/main at dispatch). Send the green, reviewed head to the build\nadvisor; never merge.\n\n## Why\nOwner gripe (Oct 27): on the roadmap page the summary and phase rail sat between the tabs and\nthe area the tabs change. Triage fixed that page. The rule that stops it everywhere is missing.\n\n## Task\n1. Add to docs/design/layout.md: \"A control sits next to the area it changes. Anything between\n   them belongs to every state of that control.\" One short rule, STE, with its rule anchor.\n2. Add one line to the design-review checklist (agents/ or skills/ design review; find it with\n   `grep -rl \"design review\" agents skills`) that checks it.\n3. Check skills/waiting-page/page.html's tabs against the rule. Report pass or fail with the\n   element names; fix nothing there (c122 and c126 own that page).\n\n## Done when\nThe rule and the checklist line are on the branch, `bin/ste-changed origin/main` passes, and the\nreport names the waiting-page verdict. Review: one fresh Sonnet reviewer. Report cap 12 lines.\nPort: yes, docs/design governs every repo's screens; the rule loads from here.\n"}, "c135": {"title": "A waiting-page question can take several answers, not only one", "phase": "cleanup", "status": "todo", "order": 103.33848, "why": "Your gripe, Oct 27 11:57 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh22hFCVAnYvJQAELYVZs8BrM): every question is pick-one, so item 31, where you wanted a mix of the options, had no way to say so.", "note": "Next cloud lane: skills/waiting-page gains a multi-select item kind (checkboxes, with an optional \"rank them\" mode), and the page saves a list of picks in its answer; the skill tells sessions to use it whenever options are not mutually exclusive; the reply check flags a pick-one question whose options could combine. Absorbs c122's item 5 (combined answers such as A+B). Red first on item 31's shape: options that can coexist, asked as pick-one. Due after: c139 merges (same skill files; triage's waiting-page order, Oct 28: c145, c147, c122, c139, c135, c136). Needs no answer. Port: yes, the skill installs everywhere. Placed ahead of d9's successors and right after c126 (triage, Oct 27): a gripe that every waiting-page question shows.", "updatedAt": "2026-10-28T06:45:00Z"}, "c136": {"title": "One page per repo: Waiting on you first, project status below, one writer ranks it", "phase": "cleanup", "status": "todo", "order": 103.33847, "why": "Your question and ruling, Oct 27 12:14 and 12:15 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2VxTQsRurAKzBZMkrCcNMRj, cmsg_01DoF7thf3iq2Srr1UsfXgh28rSboTZRAZdREzMmGF34Lw, cmsg_01DoF7thf3iq2Srr1UsfXgh2JTri9SaU6kmwj1ysw38q14): why two pages, and who ranks the questions?", "note": "Ruling, Oct 27 12:15 CDT (shiv): one writer per page ranks every item by severity and priority, and with one writer the status page (o8) and the waiting page (c71) merge into one artifact. One page per repo, owned by one writer: triage in this project, the orchestrator in a repo. \"Waiting on you\" comes first; project status sits below it or in a tab. Sessions send their questions to the writer and never write the page themselves (c126 builds that half). Your answers keep living in the page's storage, so a rebuild or a republish never loses them. The two-page proposal (separate pages that link to each other) is dropped. Next cloud lane: skills/roadmap and skills/waiting-page build one page from both data sets; the writer's ranking is a field it sets on each item; red first on a republish that would drop a saved answer. Due after: c135 merges (same skill files; triage's waiting-page order, Oct 28: c145, c147, c122, c139, c135, c136). Port: yes, every repo's page. Placed ahead of c135 (triage, Oct 27): it settles what c135 and c132 build on.", "updatedAt": "2026-10-28T06:45:00Z"}, "c137": {"title": "The local gates run is green on clean main in a cloud container", "phase": "cleanup", "status": "done", "order": 103.33898, "why": "Coordinator, Oct 27 12:38 CDT: at least five lanes today saw the silent-undo fixture suite fail on clean main in the cloud (the gitlink fixture, plus shallow history), after c129 fixed one case, so every lane explains away a red local run.", "note": "Green and reviewed (lane PR #719, head 73bc365, from main 6a3e842; builder Sonnet, reviewer Sonnet clear), sent to the build advisor Oct 27 13:40 CDT. Measured: the only red shape is the session's own checkout, a shallow clone: bin/ci-job gates --lint failed the Silent undo check step (UNKNOWN: history is shallow, under --strict). A worktree of a full clone, two runners at once and pytest were green; unittest discover -s lint was green in every shape. Fix: ci-job runs git fetch --unshallow once when the job's checkout has fetch-depth: 0 and the clone is shallow; a failed fetch counts as unknown. Review notes, not debts: the fetch has no timeout; the fetch-depth match reads only a plain 0. Both fail safe. Port: no; it lives in claude-settings. Merged Oct 27 in batch #723 (main e0f9e2d): ci-job unshallows a shallow checkout.", "updatedAt": "2026-10-27T18:40:00Z", "ask": "# c137: the local gates run is green on clean main in a cloud container\n\nCloud build thread brief. Build advisor (10), Oct 27, against claude-settings main 6a3e842.\nBase: main 6a3e842 (after batch #704). Never rebase onto main after review. Send your green,\nreviewed head to the build advisor; never merge.\n\n## Why\nLanes report the local gates red on clean main in cloud containers. Triage measured\n`python3 -m unittest lint.test_check_silent_undo` green on main 9264397 in a fresh clone\n(depth 50 and depth 1; git 2.43; 1 skip for missing ssh-keygen). So the red needs something a\nlane has and a fresh clone lacks: a git worktree, the session's own checkout, a second runner of\nthe local gates, or pytest. Unmeasured. A guard that cries wolf is spent, so this ranks ahead of\nnew checks.\n\n## Task\n1. Reproduce red. Try each shape in turn: a `git worktree add` checkout of main; the session's\n   pre-cloned checkout; two runners at once; pytest instead of unittest. Record which shape goes\n   red, with the failing test and its message (one line each).\n2. Fix the cause in the fixture or the tool, never by a skip.\n3. Add that shape to the test, red first on the old code, then green.\n\n## Done when\nThe shape that was red is a test case, shown red on main 6a3e842 and green on your head, and\n`bin/verdict python3 -m unittest discover -s lint` is green in that shape. If no shape goes red,\nreport the shapes tried and stop; that is a finding, not a failure.\n\nReview: one fresh Sonnet reviewer (it touches a check's verdict). Report cap 20 lines.\nPort: no; it lives in claude-settings.\n"}, "c138": {"title": "Every roadmap writer is held to the note cap at commit, not only triage", "phase": "cleanup", "status": "done", "order": 103.33899, "why": "Finding, Oct 27 (triage 8): other threads pushed notes over 250 words five times in one hour, and each blocked triage's next commit until triage trimmed someone else's note.", "note": "Landed Oct 28 on roadmap (2362640c, try 3): build.py --check-staged reads step files from the index and refuses a commit that adds or grows an open step's note past 250 words, naming it. Setup once per clone: `sh roadmap/hooks/install.sh`, never core.hooksPath (try 2's clone-wide hooksPath switched off main's main-ref guard in sibling worktrees); it chains an existing pre-commit and is a no-op outside a roadmap checkout; re-run it after a dispatcher change. 40 tests green; 3 Opus review rounds. Known: a merge or cherry-pick of a --no-verify commit is unchecked. Follow-up on main: c159. Port: no.", "updatedAt": "2026-10-28T05:35:00Z"}, "c139": {"title": "A pick that would loosen a shared format is flagged as going against your uniform ruling", "phase": "cleanup", "status": "todo", "order": 103.338995, "why": "Your gripe, Oct 27 12:51 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh225EHTbUr63KanrkWb8D3Gn): you were offered loosening a shared tool for banchi's record titles, against your standing preference for uniform formats.", "note": "Ruling, Oct 27 12:51 CDT (shiv), home topic t18 (one home, then variants): a repo that differs from a shared format changes to match; the shared tool never grows a second form. Next cloud lane: skills/waiting-page and the reply-style rule mark any option that widens what a shared tool accepts with \"Goes against your uniform ruling (t18)\", and the recommended option may not be one; the reply judge flags such a recommendation in a reply. A gate that today lets one repo's variant through (an allow list or an extra accepted form) gets a debt to remove it. Red first on today's case. Due after: c122 merges (same skill files; triage's waiting-page order, Oct 28: c145, c147, c122, c139, c135, c136). Needs no answer. Port: yes, global skill and rule. Placed ahead of c107 (triage, Oct 27): a gripe, and it shapes every roll-out pick.", "updatedAt": "2026-10-28T06:45:00Z"}, "c14": {"ask": "Build the machine-load brake as a standing part of claude-settings, on every device that installs it (Windows and Mac, no admin): at the moment a lane is about to start, the guard reads the machine's load once and sets how many lanes may run.", "note": "Done. Rulings: every device that installs claude-settings; no watcher, timer, per-call reading or log of its own (Oct 21); no lane or process count (Oct 22); disk busy under the smaller of 10% and 15 GB free, full under the smaller of 5% and 5 GB (Oct 23); CPU dropped, since a short sample is noise (Oct 25). Landed: #562, #565, #569, then #572 (the brake reads memory and disk only; decision machine-load-brake rewritten). Related: c40 (idle desktop sessions each burn a core).", "order": 107, "phase": "cleanup", "status": "done", "title": "Machine-load brake: every session paces its lanes to the device's real load", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your idea, Oct 20, widened Oct 21: when the machine is loaded, sessions slow down; when it has room, more lanes can run. Incidents: the 15 spinning claude.exe workers of Oct 19, the q_max load report, and the Windows RAM climb to about 98% of Oct 21. Your caution, Oct 21: measuring and logging have cost more than the problem before."}, "c140": {"title": "A shared machine names one owning repo, and every other repo checks its health and holds first", "phase": "cleanup", "status": "doing", "order": 103.338996, "why": "Your HA Green problem, Oct 27 13:15 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2RSWZr4XsNtpstx8kVFBn66): home, degen, home-app and later mailaudit all load one 4 GB box that crashed 3 times, no repo owns its load budget, and degen's deploy script lives in home behind a guard, so fixes deadlock across repos.", "note": "Proposal (coordinator): a shared-resource convention. Each shared machine names one owning repo (the HA Green: home-app, which holds home since Oct 26). The owner keeps (a) a box-health preflight script (swap, disk errors, open holds) and (b) a hold record. Ruling, Oct 27 13:22 CDT (shiv, cmsg_01DoF7thf3iq2Srr1UsfXgh2FS8R88VGL2A75ER5mnDyai, \"it shd go to degen\"): each user repo owns its own deploy and restart scripts; the owner owns only the shared check and the hold record, and a change to those goes to the owner as a hand-off, never an override. Every user repo's session runs the preflight before a deploy, a restart or a bulk import, and reads the holds. Part 1, ready, claude-settings only. Next cloud lane: the convention in docs/ (one home), a lint that a repo declaring a shared resource in .claude/layout-extras.json cites its owner and the preflight path, and the hand-off pattern in skill project-ops; red first on a declaration with no owner. Part 2, the roll-out to other repos, is c141. Needs no answer. Port: yes; part 2 carries it. Placed ahead of c107 (triage, Oct 27): three crashes in eight days. Part 1 green and reviewed: draft PR #743 (c1aecd35), round 2 approved; decision shared-resource-owner holds the convention, and lint/check_shared_resources.py checks a repo's shared-resources entry in .claude/layout-extras.json. Waits for a batch.", "updatedAt": "2026-10-28T07:05:00Z"}, "c141": {"title": "The HA Green's owner and every repo that loads it adopt the shared-machine convention", "phase": "rollout", "status": "todo", "order": 304, "why": "Part 2 of c140 (shared machine names one owner), from your HA Green problem, Oct 27 13:15 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2RSWZr4XsNtpstx8kVFBn66).", "note": "home-app (owner, holds home since Oct 26) writes the box-health preflight and the hold record, and writes it once; degen's deploy script moves from home's tools into degen (ruling Oct 27 13:22 CDT, see c140); degen, and later mailaudit, declare the box and run the preflight before a deploy, a restart or a bulk import. The live fixes (map-fetch ban, freeze-hold rule, push add-on retries, degen load cuts) stay with the home and degen sessions already on them. Deferred (shiv, Oct 27): it changes other repos. Asked: waiting page item 2 (yes to the one plan). Due after: c140. Port: this is the port. Placed ahead of r5 (triage, Oct 27): the crash risk is live now. Shape from c140's lane (Oct 28): each repo adds a shared-resources entry to its extras file (the HA Green names owner shivinate7/home-app and the preflight path there) and runs lint/check_shared_resources.py in CI.", "updatedAt": "2026-10-28T07:05:00Z"}, "c142": {"title": "A reviewer at round 2 or 3 runs Sonnet, not its definition's Haiku pin", "phase": "cleanup", "status": "done", "order": 103.338997, "why": "Finding, Oct 27 (c54 pin-order lane, PR #714, measured in a cloud thread): an agents/*.md model pin beats CLAUDE_CODE_SUBAGENT_MODEL, so a reviewer spawn that names no model runs the reviewer definition's pin (Haiku), even at rounds 2 and 3, where roles-third-try-steps-up says Sonnet.", "note": "Guard rule agent-model-floor refuses only a haiku field, and the step-up rule does not require a model field, so nothing catches it. Next cloud lane: the guard asks for an explicit model on a reviewer spawn whose brief says round 2 or 3 (or the reviewer definition's pin moves to Sonnet and round 1 names Haiku); red first on a round-2 reviewer spawn with no model field. Needs no answer. Port: no; agents and the guard install from claude-settings. Placed ahead of c107 (triage, Oct 27): every review round 2 today runs the wrong model. Dispatched Oct 27 13:29 CDT by build advisor (10), brief briefs/c142-reviewer-round2-sonnet.md. Green and reviewed Oct 28: draft PR #730 (3f2ca35), waits for a batch. Pick (a), the guard: (b), a Sonnet pin, would break the reviewer row in decision agent-model-cap, which only you change. The Agent path already refused an unpinned round-2 reviewer on main; the real gap was a Workflow agent() call, closed here (9 cases red then green; Opus then Sonnet review PASS; one minor bypass noted as step-up-workflow-hex-escape). Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #730.", "updatedAt": "2026-10-28T06:45:00Z", "ask": "# c142: a reviewer at round 2 or 3 runs Sonnet, not its definition's Haiku pin\n\nCloud build thread brief. Build advisor (10), Oct 27, against claude-settings main 6a3e842.\nSend the green, reviewed head to the build advisor; never merge.\n\n## Why\nMeasured Oct 27 (c54, PR #714, decision agent-model-cap): an agents/*.md model pin beats\nCLAUDE_CODE_SUBAGENT_MODEL both ways. agents/reviewer.md pins Haiku, so a reviewer spawn with no\nmodel field runs Haiku at rounds 2 and 3, against roles-third-try-steps-up (\"Reviewers run Sonnet\nfrom round 2 on\"). The guard rule agent-model-floor refuses only a haiku model field, so nothing\ncatches a missing field.\n\n## Task\nPick the smaller safe fix and say which you picked and why:\n(a) hooks/guard.py asks for an explicit model on a reviewer spawn whose prompt says round 2 or 3; or\n(b) agents/reviewer.md pins Sonnet, and round 1 names Haiku in its spawn if the table wants Haiku.\nCheck the model-per-role table (decision agent-model-cap) first; the fix must match it.\nRed first: a round-2 reviewer spawn with no model field runs or passes as Haiku on main.\n\n## Done when\nThe red case is a test, red on main 6a3e842 and green on your head; hooks tests green. This changes\na guard, so one fresh Sonnet reviewer hunts bypasses and false alarms (an ask on a round-1 spawn\nis a false alarm). Report cap 15 lines. Port: no; agents and the guard install from claude-settings.\n"}, "c143": {"title": "The layout knows docs/health, so the scorecard file does not fail Layout", "phase": "organize", "status": "done", "order": 103.338998, "why": "Finding, Oct 27 (o4 scorecard lane, debt health-folder-not-in-layout, PR #709): lint/layout.json has no kind for docs/health, where the new scorecard file goes, so in a rolled-out repo Layout scores out because of the scorecard itself.", "note": "Green and reviewed, draft PR #728 (head 87645bb1), waits for the next batch: kind scorecard (docs/health/compliance.md) in lint/layout.json, the scorecard reads it, debt closed. Was: add a health kind for docs/health/ to lint/layout.json (the one home, o2), point the scorecard writer at it, and close the debt; red first on a repo whose only finding is docs/health/. Blocks r1 (run compliance-check on each child repo). Needs no answer. Port: yes, at each repo's roll-out through the layout. Placed ahead of c107 (triage, Oct 27): small, and r1 cannot start without it. Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #728.", "updatedAt": "2026-10-28T06:45:00Z"}, "c144": {"title": "A standing-role hand-off moves the page watches to the successor", "phase": "cleanup", "status": "done", "order": 103.338999, "why": "Incident, Oct 27 12:07 CDT: your waiting-page answers (items 35 and 31) still went to the old triage thread after Triage (8) took over, because the page's comment watch stayed with Triage (7); both threads then acted on the same comment.", "note": "Green and reviewed: draft PR #727 (head 3047cc7, 3 review rounds), waits for the next batch; role-handoff.md gains a Pages section, and the successor reads comments since the old thread's stop time. Two notes for docs/debts/notes.md: a comment arriving mid-handover can be answered twice; the successor's read shows the old thread's replies. Was: skill project-ops' hand-off steps gain two lines, the successor watches each page its role owns (the roadmap page, this project's waiting page) and the old thread stops watching them, and the hand-off file lists those page URLs; red first on a hand-off file that names no page. Needs no answer. Port: yes, with project-ops. Placed ahead of c107 (triage, Oct 27): it recurs at every hand-off. Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #727.", "updatedAt": "2026-10-28T06:45:00Z"}, "c145": {"title": "An answered waiting-page item never looks unanswered", "phase": "cleanup", "status": "doing", "order": 103.33849, "why": "Your gripe, Oct 27 15:22 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2NaqCKqqjiuvUrt4vSAsNt1, with a screenshot): in a local orchestrator's page, items 15, 17 and 19 stayed open for hours after their answers were filed, and item 16 was never filed because its answer waited on its own lane.", "note": "Today an item stays open until its owning session files the answer in its record and closes it by hand; nothing closes it, and the page shows a saved answer the same as no answer. Fix: the page shows \"Answered, filing pending\" with the time of your save as soon as you save; the writer closes the item in the same turn it files the answer (skill waiting-page), and an answer whose lane is busy is filed at once as a note on its step, never held for the lane. Overlaps checked: c131 (answers save to their item), c126 (one writer per page) and c136 (one page, ranked) do not cover closing. Red first on an item with a saved answer that still shows as waiting. Needs no answer. Port: yes, the skill installs everywhere. Placed ahead of c135 (triage, Oct 27): a gripe, and a stale open item hides what is really waiting. Green and reviewed: draft PR #744 (dcd78a1b), red first; Opus then Sonnet design review pass at 390 and 1280, light and dark; Sonnet code review round 2 clear (a stale receipt showing filed on a changed answer, fixed). Waits for a batch; c147 follows it.", "updatedAt": "2026-10-28T07:15:00Z"}, "c146": {"title": "The map says how the code fits together, in checked prose, in every repo", "phase": "organize", "status": "todo", "order": 161, "why": "Your ask, Oct 27 15:28 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2TkTAVedLJHUNKVx7WVmM42): a map that you and the AI both read before answering \"how does X work\", which stops building a second copy where a shared thing exists, records facts like a retry wait or which avenues a pricing export covers, and checks that what we say in English is what the code does. You asked to be told plainly if this is the wrong avenue.", "note": "Today skills/plain-english-map (o6, moved here Oct 20) maps files, tables and screens only: no relationships, no pointer to the shared home a file should use, no key values, and its check proves an entry exists, not that its prose is still true. Triage's view: the avenue is right, on one condition; prose that nothing checks rots and then misleads the AI with confidence. So each claim (\"retries every 30 s\", \"export covers A and B\") cites the symbol or constant it describes, and a check reads that value and fails when the two disagree. banchi's docs/map.py and decision-context are the nearest working example. The shared-home half joins t18 (one home, then variants) and lint/find_copies.py (r5). Plan done Oct 28: plans/c146-checked-prose-map.md (Sonnet fact-check clear): MAP9 in skills/plain-english-map/scripts/map-check.mjs checks indented fact lines that cite a symbol's value, uses FILE:SYMBOL relations and a Homes section; format version 3; a mapPaths key; a pilot of about 6 files in claude-settings; a CI step. Deferred (shiv, Oct 28): the plan's 7 questions and a grant to fix docs/decisions/map-skill-lives-here.md (no pinned copies, t18). Asked: waiting page items 22 to 29 (one group, the plan's picks as my pick). Port: yes, once perfected; q_max's drifted copy goes in r5. Placed ahead of r5 (triage, Oct 27): each repo's roll-out should carry the map that keeps it honest.", "updatedAt": "2026-10-28T05:15:00Z"}, "c147": {"title": "Each design option's picture shows that option's own difference", "phase": "cleanup", "status": "todo", "order": 103.338495, "why": "Your gripe, Oct 27 15:30 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2JEo4B1iU83SGsnRKwwcxZs, with a screenshot): on the Duo \"Card in Hand\" round 2 question, options A (Claim filed and Lost buttons) and B (the six existing stamps) carried the same generic title-card picture, so neither showed what was being decided.", "note": "d9 (in the c126/d9 lane) already requires a picture per option, scaled to the element being decided; it does not stop the same picture on every option. Fix: the waiting-page writer refuses a design item where two options share one image (same bytes or same file) or an image shows no element named in the item's focus; the item's focus names the state to draw (here, the late-package row with its buttons), and the skill tells the designer to draw that state per option. Red first on today's item. Needs no answer. Port: yes, the skill installs everywhere. Due after: c145 merges (same skill files; triage's waiting-page order, Oct 28: c145, c147, c122, c139, c135, c136). Placed ahead of c145 (triage, Oct 27): a gripe, and a picture that shows nothing makes the pick a guess.", "updatedAt": "2026-10-28T06:45:00Z"}, "c148": {"title": "A port or redesign keeps the existing app's behaviour and asks only about a change", "phase": "cleanup", "status": "doing", "order": 103.338496, "why": "Your gripe, Oct 27 15:32 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2DRFWTZ5UH6oNvPN87jdc28, with a screenshot): in the Duo \"Card in Hand\" work for Manifest's phone app, a session marked its plan blocked on what happens to Suspense cards when Card in Hand closes, which the working web app already answers; earlier it invented an \"end of mail day\" the app does not have.", "note": "The global rule building-never-guess-answer covers guessing, not asking what the code already says. Fix: a port or redesign brief (designer, builder, planner) states that the existing app's behaviour is the default and each choice cites where it was read (file and symbol); a question goes to you only when the work departs from that behaviour, says so, and is never marked blocking; a question the code or a standing grant answers is refused. Same step (your feedback Oct 27 15:51 CDT, cmsg_01DoF7thf3iq2Srr1UsfXgh21vJLZeSrqXyLEvzPyoXgLz): the Banchi orchestrator asked you to merge despite standing merge authority, and asked about a \"Take all\" detail a reviewer held; a session reads standing grants from the repo's CLAUDE.md before asking, and a grant you give in chat lands in the repo (or the merge tool's config), never only in a session hand-off. Check: the waiting-page writer refuses an item on a port with no \"departs from\" line, and the reply judge flags \"blocked on\" over such a question. Red first on today's item. Needs no answer. Port: yes, global rules and skills. Placed ahead of c147 (triage, Oct 27): a gripe, and a false block stalls a lane for hours. Doing: lane started Oct 28 01:20 CDT (orchestrator, after batch 2).", "updatedAt": "2026-10-28T06:55:00Z"}, "c149": {"title": "A session that started other sessions never opens the question box", "phase": "cleanup", "status": "done", "order": 103.338497, "why": "Your feedback, Oct 27 15:51 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh21vJLZeSrqXyLEvzPyoXgLz): the Banchi orchestrator opened the question box because none of its own agents or commands were running, and blocked while the lane sessions it had started waited on it to route answers and merge.", "note": "The rule is the problem: questions-go-to-owner bars the box while \"an agent, a lane or a background command\" runs, and c86's check (session-board mod, PR 665) counts only the session's own agents, commands and workflows, never the separate sessions it started. Fix: an orchestrator, meaning any session that has started another session or lane, asks on the waiting page only and never opens the box; the rule says so in one line, and the mod refuses AskUserQuestion once the session has started a session (start_session or a lane spawn recorded on its board). Red first on a session with a live started session and no running agent. Needs no answer. Port: no; the rule and the mod install from claude-settings. Placed ahead of c148 (triage, Oct 27): one open box stalled every lane under that orchestrator. Green and reviewed: draft PR #729 (b15addf, 3 review rounds), waits for the next batch; a successful start_session or create_session refuses the box for the rest of the session, red then 144 of 144 green. Low notes for docs/debts/notes.md: a started: record stays forever when its sess: entry cannot be read; an orchestrator stopped over a day may lose its count at the next sweep. Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #729.", "updatedAt": "2026-10-28T06:45:00Z"}, "c15": {"ask": "Draft the move from hard STE rules to outcomes: for each of the five blocking codes, what outcome it was for, whether a CI check, a judge or nothing should carry it, and what ste_gate becomes. Include the word and line change.", "note": "Done. Landed in #566 (Oct 23): the STE hooks left settings.json; CI's STE lint carries STE001, STE011 and STE013 on changed Markdown; STE020 and STE021 dropped. The stubs lint/ste_gate.py and lint/md_sweep.py are gone (checked Oct 26 at 149f4bc). Open: UI files lose the long-sentence, bloat and double-negative checks, since CI reads Markdown only; the session took that as the default.", "order": 111, "phase": "cleanup", "status": "done", "title": "Swap the hard STE rules for the outcomes they were meant to get", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your direction, Oct 20: STE went in as hard rules, but what you want is the outcome: plain replies you can follow, clear UI copy, short docs. The rules block edits, slow every edit, and fight plain-beats-short (c7)."}, "c150": {"title": "A small unrelated merge to main does not force a full CI re-run of the batch", "phase": "cleanup", "status": "doing", "order": 103.3031, "why": "Your gripe, Oct 27 16:36 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2JnNhZbLrApWKBF2VyEBa6t): insignificant merges cause fat CI runs. Since c97 (PR #659), merge.py refuses a batch head that lacks main's tip, so each small merge to main (#713, #717, #701 during the freeze) forced a full 50 to 60 minute re-run.", "note": "Options for the lane to weigh, against c97's reason (a batch is proven on the main it lands on): (a) merge.py accepts the old run when main's new commits touch none of the batch's files and none of the files its jobs read; (b) a GitHub merge queue, which tests the combined head once; (c) on a base move, re-run only the jobs whose inputs changed (c95 step 2's scoped runs). Triage's lean: (a) first, since it is small and keeps c97's proof wherever an overlap could break it; (c) arrives with c95. Red first on today's case: a records-only merge to main forcing a full re-run of an unrelated batch. Needs no answer. Port: no; merge.py lives in claude-settings. Doing: lane started Oct 27 CDT (orchestrator), branch c150-small-merge-rerun from main e0f9e2d, option (a): merge.py keeps the old green run only when main's new paths share none with the batch, turn on no CI job per .github/scripts/ci-scope.sh, and bin/ci-job gates --lint passes on the merge result; else today's refusal. Green and reviewed: draft PR #738 (92aa1e43), three review rounds, round 3 clear; waits for batch 3. Residual risk (in decision merge-needs-current-base): the docs-read matcher misses suite roots not bound from __file__; no suite does that today. Cost: a records-only main move costs about 13 min of local checks at merge, against a 50 to 60 min CI re-run. Placed ahead of c82, after c95 (triage, Oct 27): the same CI cost, from the merge side.", "updatedAt": "2026-10-28T07:00:00Z"}, "c151": {"title": "Compaction timing reads message tokens, not total context", "phase": "cleanup", "status": "todo", "order": 108, "why": "Your idea, Oct 27 16:49 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2AdH3Lyos1aUGY9YCpUrDM4, with a screenshot of a 500k context: messages 379k, 76%, and about 85k fixed overhead from system, tools, prompt, memory and skills that compaction cannot shrink): the compact hooks and auto-compact timing could be smarter if they measured messages only.", "note": "Unknown today: whether a hook's input exposes the context breakdown; the transcript file can at least be counted. Step 1, a cloud measuring lane: list what PreCompact, Stop and statusline inputs carry about tokens on the current Claude Code, and count message tokens from the transcript; record the answer in docs/decisions. Step 2, only if a number is readable: base the hand-off and compact thresholds on messages as a share of the room left after the fixed overhead, not on total context; red first on a session whose overhead alone trips today's threshold. No earlier step covers it (closed c25 and o15 shaped the hand-off, not its timing). Step 1 merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #731 (record hook-inputs-carry-token-counts). PreCompact and Stop inputs carry no token counts; statusLine (interactive only) carries context_window.current_usage, the transcript's last usage; nothing splits overhead (36.6k to 42.1k here) from messages. Deferred (shiv, Oct 28): step 2's token source. Asked: waiting page item 30. Port: no; hooks install from claude-settings. Placed ahead of c58 (triage, Oct 27): useful, not urgent.", "updatedAt": "2026-10-28T06:45:00Z"}, "c152": {"title": "Stale claude-settings branches are archived or deleted only after an unmerged-commit check", "phase": "cleanup", "status": "todo", "order": 103.75, "why": "Your GitHub audit, Oct 27 23:01 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh211VfMPE9qfHmdrFTC9vz7X): 70 branches, about 15 older than 14 days, including 4 claude/held-* branches, merge-ci-savings, and batch-oct27y and batch-oct27z whose PRs are closed.", "note": "Debt: some may hold the only copy of work. Next cloud lane: list each branch older than 14 days with its commits not on main; a branch with none is deleted; a branch with some is pushed to archive/<branch> (rule shared-trees-archive-then-delete) and then deleted, and the list goes in the batch report. c44 already removes a lane's branch at merge; this is the backlog from before it, plus closed-PR branches c44 does not reach. Needs no answer. Port: no; claude-settings only. Placed ahead of c47 (triage, Oct 28): after c44, its upkeep twin.", "updatedAt": "2026-10-28T05:00:00Z"}, "c153": {"title": "Each GitHub app installed on claude-settings is kept only if it needs the repo", "phase": "cleanup", "status": "todo", "order": 103.76, "why": "Your GitHub audit, Oct 27 23:01 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh211VfMPE9qfHmdrFTC9vz7X): Cloudflare Workers and Pages, Render and Renovate are installed beside Claude, and the repo has no secrets, deploy keys or webhooks.", "note": "Unknown: whether any of the three reads claude-settings (Renovate may open pin-bump PRs; Cloudflare and Render most likely serve other repos). The app's repo-access page needs your sign-in confirmation, so a session cannot read it. Next: you open each app's repository access and remove claude-settings where it is not used; a session then checks the repo's PR and check history for each app's last activity. Waits on: an owner test (waiting page item 9). Port: no. Placed ahead of c47 (triage, Oct 28): low risk, small cleanup.", "updatedAt": "2026-10-28T05:10:00Z"}, "c154": {"title": "Cloud installs keep the hand-off start-up hooks, or say why not", "phase": "cleanup", "status": "done", "order": 103.3032, "why": "Finding, Oct 27 23:11 CDT (an audit session's report, relayed in cmsg_01DoF7thf3iq2Srr1UsfXgh23uGo4eqsUrqqbGKYMctN3n): install.sh near line 632 makes a cloud install replace every start-up hook with the refresh hook, so cloud sessions lose the hand-off hooks.", "note": "Debt, ruled a defect by the lane (Oct 28): no decision record covers it, and install.sh's \"stays hook-free\" comment predates the SessionStart hooks in settings.json. Fix: append the refresh hook to the repo's SessionStart list; red then green in hooks/test_install_src.sh. Green and reviewed: draft PR #726, head 9f5ab95 (Opus builder, Opus reviewer round 1 clear); waits for the next batch. Known false-red: cloud_settings1 if settings.json ever lacks a SessionStart key (fix: .hooks.SessionStart // []). Ties to c54 part 3 (install claude-settings in cloud containers). Needs no answer. Port: no; install.sh lives here. Placed ahead of c82 (triage, Oct 28): every cloud session may lose its hand-off. Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #726.", "updatedAt": "2026-10-28T06:45:00Z"}, "c155": {"title": "Usage freeze: land only in-flight work until the new account takes over", "phase": "cleanup", "status": "done", "order": 103.15, "why": "Your word, Oct 27 13:31 CDT (cmsg_01DoF7thf3iq2Srr1UsfXgh2DhVeWxLo5gce39C6Hvi7b8): with 10% of your plan left, less critical work pauses, and work that is near landing and critical lands, leaving claude-settings stable.", "note": "Ruling, Oct 27 13:31 CDT (shiv): land only in-flight work while 10% of the plan was left. Lifted Oct 27 about 23:20 CDT (shiv, via the orchestrator): a fresh account with ample usage; every parked step's \"Due after: the usage freeze lifts\" line cleared Oct 28 (triage 9). #723 merged at 16:55 CDT during it. Needs no answer. Port: no.", "updatedAt": "2026-10-28T05:00:00Z"}, "c156": {"title": "One write-outside-the-checkout guard for every session, which allows notes folders", "phase": "cleanup", "status": "doing", "order": 103.3389995, "why": "Your ask (cmsg_01DoF7thf3iq2Srr1UsfXgh26MuXHQwVQFmfKrqbe6bgD9): Banchi's guard refused a write to the Claude app's side-session notes folder (~/Library/Application Support/Claude-Work/side-session-notes/), while claude-settings' own rule covers too little.", "note": "Today claude-settings' worktree-home rule (an agent outside its home tree must stop) covers only isolated subagents, and only writes into the same clone; it skips the top-level session and sessions started in .claude/worktrees/. Banchi's scripts/guard-shell.py clause 2 (tree) covers every session but refuses any path outside the checkout except ~/.claude, /dev and a non-repo temp folder, so it refuses harmless notes folders. Next cloud lane (claude-settings part): the guard refuses a write into a different checkout of the same clone (the 2026-09-06 incident) for every session, and allows paths in no checkout; red first on a top-level session writing into a sibling checkout. Banchi part, after it: add tree to GUARD_SHELL_SKIP for Claude Code (Codex keeps its copy); the stopgap adds the notes folder to _sanctioned_outside (cmsg_01DoF7thf3iq2Srr1UsfXgh28TR1H4ucZ5AZvycb7QHvYu); both change another repo, so they need your plan check first. Checked: claude-settings main 34dc6a9, banchi main dfcde22. Port: the Banchi part is the port. Placed ahead of c107 (triage, Oct 28): the claude-settings part needs no answer and every session hits the gap. Doing: lane started Oct 28 01:20 CDT (orchestrator, after batch 2).", "updatedAt": "2026-10-28T06:55:00Z"}, "c157": {"title": "Cleanup never deletes a live agent's build folders", "phase": "cleanup", "status": "doing", "order": 103.3033, "why": "Your ask (cmsg_01DoF7thf3iq2Srr1UsfXgh239AWxeRqxYqdRJxDTTE96w): the agent-end reap deletes DerivedData and .build while a process still runs, and the moment an agent ends, though a finished agent is resumed into its own worktree, so it rebuilds from nothing and loads the Mac.", "note": "Part 1 merged in batch #737 (main b09aece, Oct 28 01:19 CDT): PR #720 keeps build folders while a process runs in the agent worktree. Part 2 doing: lane started Oct 28 01:24 CDT (orchestrator), branch c157-build-idle-clock: build folders follow the worktree's 30-minute idle clock, reaped only in agent worktrees idle 30 min or more at a later agent end, keeping #720's process gate (a long build makes no git activity). Windows runs the same code. Parked, later: what drove the Mac to load 123 (several xcodebuild and simulator runs at once?) and a proposed cap. Needs no answer. Port: no; the janitor installs from here. Placed ahead of c82 (triage, Oct 28): a lane is open on it now.", "updatedAt": "2026-10-28T07:20:00Z"}, "c158": {"title": "The Windows stamp fixture suite never hangs past its cap", "phase": "cleanup", "status": "doing", "order": 103.3034, "why": "c95 step 1a's lane (Oct 27): on run 40542065223 (push to main), the Windows \"Record stamp engine fixture suite\" hung 23 min; its normal maximum is 1.5 min (n=28).", "note": "Debt; cause unknown. #715 gives the step a 5 min cap, so the next hang reads red at its own step. Dropped from batch 2 (run 40639369770: 2 Windows proof tests red), fixed at cd69773 (PR #735): a node path with a space broke a regex; measured on Windows, spawnSync returns when the direct child exits even while a grandchild holds its pipe; the hold case is now proven red within its cap on windows-latest. Waits for batch 3. Fix: test_stamp.mjs re-runs itself under an out-of-process 240 s watchdog with piped stdio; on a hang it names the test, kills the tree and exits red; every spawn has a 60 s timeout; 144 of 144 green on Linux; timeout-minutes 5 stays. The hang's cause is unknown and does not reproduce on Linux; the next hang prints the test and the process tree. Unproven on Windows: the orphan sweep. Needs no answer. Port: no. Placed ahead of c82 (triage, Oct 28): it ate a full run's Windows time.", "updatedAt": "2026-10-28T06:45:00Z"}, "c159": {"title": "main-ref's hook installer works with any core.hooksPath and says it needs bash", "phase": "cleanup", "status": "done", "order": 103.3389998, "why": "c138's installer reviewer (Oct 28) proved two faults in githooks/main-ref/install.sh on main: with a relative or ~ core.hooksPath it installs where git does not look, so the main-ref guard is off in other worktrees; and its usage says sh, but it uses pipefail, so it needs bash.", "note": "Debt. Green and reviewed Oct 28: draft PR #733 (833a594), batch 2; 6 new cases red then green; Opus round 1 found a silent success outside a repo (fixed), Sonnet round 2 clear. Was: githooks/main-ref/install.sh resolves core.hooksPath as git does (relative to the worktree root, ~ expanded) and its usage line says bash (or it drops pipefail); red first on a clone with a relative hooksPath whose sibling worktree runs no guard. Touches only githooks/main-ref/ and its test. Needs no answer. Port: no; the guard installs from claude-settings. Placed ahead of c107 (triage, Oct 28): a guard that is silently off in other worktrees. Merged in batch #737 (main b09aece, Oct 28 01:19 CDT), PR #733.", "updatedAt": "2026-10-28T06:45:00Z"}, "c16": {"ask": "Janitor sweep speed lane: time a q_max preview split by check, then batch the git calls (one for-each-ref and one merged list for all branches; cherry only for what the batch cannot prove), drop the guard import, and add a fast worktree-only mode that reaps only branches already in main. A worktree it cannot prove safe is kept. Report before and after times.", "note": "Checked in the repo at 84d4076: janitor/sweep.py (3,189 lines) and session_end_sweep.py both import the whole guard family at start. Each worktree is proven safe by up to three checks in turn (ancestor, cherry-empty, remote-contains), each a separate git call, and a git call on Windows costs a process start. The remote-head check is already one batched rev-list --stdin call. Plan: 1. Time a q_max preview first, split by check. 2. Batch: one for-each-ref and one merged-into-main list for all branches, instead of calls per worktree; run cherry only for branches the batch could not prove. 3. Skip the guard import (move the few helpers it needs into a small module, same fix as c13 lanes 3 and 6). 4. A fast mode that only reaps worktrees whose branch is already in main, and leaves the rest for a full run. Less checking must still fail toward keeping a worktree, never toward deleting work. Stopgap given Oct 20: close sessions, then run git worktree remove without --force on each worktree; git refuses dirty or locked ones, and commits stay on their branches. Not measured yet: the sweep time itself. Landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25). Sweep time after the change: not measured.", "order": 121, "phase": "cleanup", "status": "done", "title": "Make the janitor sweep fast on big repos", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your ask, Oct 20: the sweep is very slow on Windows. q_max has about 178 registered worktrees and about 1,000 remote heads. You want it faster, by batching checks or checking less."}, "c160": {"title": "main-ref's stale origin/main case passes on every git version", "order": 103.33899985, "why": "c159's lane (Oct 28): githooks/main-ref/test_hook.sh case \"fetch origin main:main, origin/main stale\" is red on untouched main e0f9e2d under git 2.43 (cloud container): the hook refuses \"<sha> is not on origin/main\". CI (gates.yml line 420) passes it, so the guard's verdict depends on the git version.", "note": "Debt. Guess, unmeasured: a non-atomic fetch updates each ref in its own transaction, so the hook sees main move before origin/main does. Next cloud lane: read CI's git version, reproduce on 2.43, fix the reference-transaction hook logic so both versions agree; red first on today's case. Needs no answer. Port: no; the guard installs from claude-settings. Placed ahead of c107 (triage, Oct 28): a guard that refuses a correct fetch blocks work. Green and reviewed: draft PR #740 (930b29e), Opus review approved; waits for a batch. Cause: git 2.43's fetch moves main in its own transaction before origin/main (CI's git 2.56 batches both). Fix: on the would-refuse path only, allow when FETCH_HEAD names exactly the new oid as branch 'main' of origin; no network call. Not covered: scp-style or credentialed origin URLs (those refuse, as before).", "phase": "cleanup", "status": "doing", "updatedAt": "2026-10-28T07:05:00Z"}, "c161": {"title": "The guard's load-brake probe test counts one child on every machine", "order": 103.33899986, "why": "c150's lane (Oct 28): hooks/test_guard.py case \"load-brake: probe control: a child process the probe starts is counted\" fails on main e0f9e2d in a cloud container (counted 2, want 1). Not caused by c150.", "note": "Debt. Unknown whether CI hits it. Also red in the cloud on main e0f9e2d (c108's lane): hooks/test_handoff_wave2 \"root can delete the pointer\", 2 checks; same lane reads both. In such a container c150's merge tool refuses a records-only main move, since test_handoff_wave2 is a hit suite. Next cloud lane: run the case in a fresh container and read CI's last runs of it; find what the second count is (the shell wrapper, or a process the container adds); fix the probe or the test's control, never skip it; red first on today's count. Touches hooks/guard.py's load-brake probe and hooks/test_guard.py. Needs no answer. Port: no. Placed ahead of c107 (triage, Oct 28): a local gate red on clean main teaches lanes to ignore it.", "phase": "cleanup", "status": "todo", "updatedAt": "2026-10-28T06:50:00Z"}, "c17": {"ask": "Brief, copied from briefs/c17-agent-judge-opus.md and kept in step with it. Paste all of it to a claude-settings session.\n\nOpus on your word, claude-settings. Goal: when the owner wants Opus for a spawn, it runs, with no magic words; Claude never picks Opus on its own; no new model calls.\n\nToday: the type: prompt PreToolUse judge on Agent refuses an audit Explore spawn unless model is sonnet, so it refuses Opus too, against decision subagent-model-cap (\"any other spawn runs Opus only when the owner names it\"). It sees only the tool call, so the owner's word and the override pass can never reach it.\n\nLane 1, the ceiling moves to the guard. guard.py already runs on Agent and Task calls. When a spawn sets model opus and no standing word covers it (Plan; builder try 3; reviewer round 3 is not standing), the guard answers \"ask\" under rule subagent-model-cap, the same way it already asks on a settings write. The owner approves or declines in the prompt. An override pass lifts it like any other ask. Test: a spawn with model opus gets an ask; Plan with opus and a spawn with sonnet or haiku pass; red on main, green on the fix.\n\nLane 2, the judge keeps only the floor. DONE Oct 21 in PR #544 (the Agent judge accepts Opus); do not redo it, check lanes 1 and 3 against main first. In the Agent prompt judge, the Explore clause blocks only an audit or judging brief that sets model haiku or no model. Opus and Sonnet pass the judge; the guard owns the ceiling.\n\nLane 3, override takes words. In hooks/override_pass.py, a prompt that starts with the word override grants the pass, and the rest of the prompt is the reason, written to guard.log. So \"override: use opus for that one review agent\" grants a once pass. \"override 15m\", \"override 2h\" and \"override off\" keep their meaning when they are the whole prompt. A prompt that only mentions override later in a sentence grants nothing. Update the decision owner-override-pass in place.\n\nFirst check: does a hook \"ask\" show a prompt to the owner in bypass mode? The guard already relies on it for settings writes, so confirm with that existing case. Report the before and after judge text and the tests.", "note": "Done. Landed in #544 (Oct 21: the Agent judge accepts Opus; an audit Explore passes on Sonnet or Opus, Haiku or unset blocks) and #562 (Oct 22: the Opus ceiling moved into guard.py as an ask to you, and override accepts words after it). Routing principle, advisor Oct 21: same agent with a model override when only depth changes; a dedicated agent with its model pinned when the job differs. Follow-ons: c41 (Opus for one session or run) and c54 (cloud threads follow the same model rules).", "order": 104, "phase": "cleanup", "status": "done", "title": "Opus runs on your word, and override understands plain words", "updatedAt": "2026-10-26T05:35:00Z", "why": "Oct 20, q_max: the Agent judge refused an Opus audit twice, even after you typed an override. The outcome you want: you say Opus, it runs; Claude never picks Opus on its own; no extra model calls."}, "c18": {"ask": "Brief, copied from briefs/c18-c19-hook-imports-and-spawns.md and kept in step with it. Paste all of it to a claude-settings session. Covers c18 and c19 lanes 1 to 3. Running now; lane 4 was narrowed Oct 21 to config_watch only, so tell the running session if it has not picked that up.\n\nHook import trim and fewer process starts, claude-settings. Roadmap steps: c18 (hooks stop loading code they never use) and c19 lanes 1 to 3 (start fewer processes per tool call). Fixes to existing hooks and mods, not new guard rules. No dispatcher, and no change to how hooks are launched (no exec form, no per-machine settings): those come later. Do not run timing or process-count measurements: the owner has enough numbers. Build the fixes and prove them with tests.\n\nGoal: a hook that has nothing to do for a path or input never loads the guard family, and Claude Code starts fewer bash.exe and python.exe processes per tool call. Every gate keeps exactly its current fail-open or fail-closed behaviour.\n\nLane 1, prose_judge loads nothing until it has work. In hooks/prose_judge.py, the import `from decision_watch import invoke_model` sits at the top of the file (line 21), so a .ts edit loads the guard family (about 105 modules) before main() checks the path. Move the import into main(), after the is_prose check. Keep the test seam, so a test can still replace invoke_model.\n\nLane 2, ste_gate loads nothing until it has work. lint/ste_gate.py imports ste_lint (2,290 lines) at the top (lines 53 to 54), only to read UI_SUFFIXES, then checks the suffix in main(). Import ste_lint only after the suffix check. Read UI_SUFFIXES from a small constant that imports nothing, with one home for that list.\n\nLane 3, the same fix on the other hooks. Check lint/report_gate.py, lint/md_sweep.py, hooks/reply_judge.py, hooks/feedback_gate.py and hooks/ruling_home.py. Any that import guard, decision_watch or ste_lint before they know they have work get the same fix: import after the cheap check.\n\nLane 4, `if` filters in settings.json, so Claude Code skips the hook without starting a shell. The `if` field takes one permission rule per handler and is checked only on tool events. Docs: https://code.claude.com/docs/en/hooks (Common fields).\n- config_watch only: on Write, Edit, MultiEdit and NotebookEdit, run only for the exact file names shared_names lists as watched files.\n- Owner's ruling, Oct 21: no filters on ste_gate or prose_judge. A Windows probe showed path patterns with a slash never match (paths arrive with backslashes) and suffix patterns are case-sensitive, so a miss would silently skip the gate. Leave its Bash, PowerShell and Stop runs as they are, since any shell command can write the cap.\nKeep each script's own path check as the second layer. Check that a filtered fail-closed handler still blocks when its script is missing.\n\nLane 5, the decision-watch mod finds Python once. mods/decision-watch/hooks/register.mjs calls pickPython (where.exe, or which) on every Stop. Look Python up once per session and reuse the result. Look again only if the cached path fails to start.\n\nLane 6, idle polling. Today, each session runs these even when nothing is happening:\n- session-board: a git read every 30 s while idle (HEARTBEAT_MS).\n- desktop-statusline: 2 git calls every 60 s (REFRESH_MS).\nRead git at turn end and on focus or attach. While idle, back off to about 5 minutes. If both mods need the same reading, share one.\n\nTests, per lane, red on main and green on the fix:\n- Lanes 1 to 3: run the hook on an input it ignore
