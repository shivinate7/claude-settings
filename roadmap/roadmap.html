). Your word, Oct 23: keep the job caps (a hung job would hold the batch for 6 hours, and macOS minutes cost the most); the merge wait follows the longest cap plus 5, as this step's brief says. Oct 23: merged with c39 (CI caps go stale) into one goal-2 lane, ci-time-caps, batch 3 (full text on c37). Advisor answer to the goal session, Oct 23 (not the owner's word): the timing test has no record, so the lane runs all six wall-clock bounds in lint/test_gates.py, the whole file 20 times under load; the 70% warning adds startedAt and completedAt to the existing gh pr checks call and reads caps from the workflow files, no new call; the timeout verdict is a cancelled check that ran at least its cap, with no step data (run 39074284633's timed-out job shows every step as success). Raising the merge wait 30 to 55 is item 4 as approved. Landed in #566 (ci-time-caps lane), checked at claude-settings f463787 (main, Oct 25): merge.deadlineMinutes is 55 in .github/stamp.json, the largest job cap (50) plus 5, and a check holds it there.", "updatedAt": "2026-10-25T19:45:00Z", "ask": "# c34. The merge tool waits for CI to finish, not for a fixed 30 minutes\n\nChecked claude-settings main at 987f682 and batch branch batch-oct22c (#562).\n\nCause: .github/stamp.json sets merge.deadlineMinutes to 30 (merge/merge.py MERGE_DEFAULTS is 45).\nThe CI jobs' own caps in .github/workflows/gates.yml are longer: one job has timeout-minutes 36\non main, and #562 raises the macOS job to 50. So a green but slow run outlasts the wait, as on\n#562 on Oct 22. actions/stamp/README.md already says to set deadlineMinutes \"to a bit more than\nyour slowest required check\"; nothing checks that it is.\n\nBrief, claude-settings (after #562 merges, or as a lane in the next batch):\n1. Set merge.deadlineMinutes in .github/stamp.json to the largest timeout-minutes of a job in\n   .github/workflows plus 5 (55 once #562 is on main).\n2. Add one check, in the home that already validates stamp.json (find it; extend it, do not add a\n   second): it fails when deadlineMinutes is below the largest job timeout-minutes in the\n   workflows. Test: red on main (30 below 36), green after step 1.\n3. The report-gate timing test that failed once in a full run and passed alone: run it 20 times on\n   main. If it fails, fix the cause (the time it reads, or what it races), never add a retry or\n   a longer sleep. If it never fails, say so and change nothing.\nReport: the files changed, the test red then green, and the 20-run count.\n"}, "c35": {"title": "ste-lint's audit step stops importing Python files from the linted repo", "status": "done", "phase": "cleanup", "order": 111.7, "why": "Oct 21 security scan: in scope 'all', a json.py or ste_emit.py committed at a linted repo's root runs as code in the CI job. Confirmed on main at 987f682.", "note": "Filed Oct 22 from the owner's pasted scan finding. Advisor take, Oct 22: real defect, low risk today. claude-settings runs scope 'all' only on a manual dispatch (the nightly run uses scope changed), with contents: read, on its own code; only people who can already push code could plant the file. Whether banchi, q_max or home-app call this action with scope 'all', or from a pull_request_target job: unknown, not checked. Fix is a few lines; good as a small lane in the next batch. Landed in #566 (ste-lint-import-path lane), checked at claude-settings f463787 (main, Oct 25): the summary runs from a script in EMIT_DIR, not python3 -c in the linted repo.", "updatedAt": "2026-10-25T19:45:00Z", "ask": "# c35. ste-lint's audit step stops importing Python files from the linted repo\n\nChecked claude-settings main at 987f682. Source: security scan finding, Oct 21\n(claude.ai/security/findings/find_01GxVuZJgUrxVcwEbj5qLfgn). Confirmed by hand on Python 3.13.\n\nCause: actions/ste-lint/run.sh cds to the linted repo's root (line 9), then in scope 'all' runs\n`python3 -c 'import json, sys; from ste_emit import emit; ...'` (line 131). Under `-c`, Python puts\nthe current directory first on sys.path, ahead of PYTHONPATH and the standard library. A json.py,\njson/ package or ste_emit.py at the linted repo's root runs in place of the real module. The other\nthree python3 calls in run.sh run script files (the linter, HUNK_MAP_PY, SPLIT_PY), so sys.path[0]\nis the script's own folder, not the repo; they are safe.\n\nBrief, claude-settings (small lane, next batch):\n1. Move the line-131 summary into a script file written next to ste_emit.py in $EMIT_DIR, the same\n   way HUNK_MAP_PY and SPLIT_PY already work, and run it with `python3 \"$EMIT_DIR/summary.py\" ...`.\n   Do not use `-I` (it drops PYTHONPATH, so ste_emit stops loading) or `-P` (needs 3.11+).\n2. Add a case to actions/ste-lint/test_action.py: fixture repos with json.py, or json/__init__.py, plus ste_emit.py at the root, each\n   writing a marker file, plus one .md file. Run with SCOPE=all and SCOPE=changed. Pass: no marker\n   file, and the summary table and annotations still appear. Show it red on main, green after 1.\n3. Add one sentence to action.yml's scope description: the action runs no code from the linted tree.\nReport: files changed, the test red then green.\n"}, "c36": {"title": "Local sessions pick up merged settings on their own", "phase": "cleanup", "status": "done", "order": 111.8, "why": "Oct 22: the owner's Mac ran claude-settings 174 commits behind origin/main, so Mac sessions used old rules and hooks, and nothing showed it.", "note": "Filed Oct 23 from a prompt the Mac session wrote. Checked at 1842e56: the SessionStart hook tests for a .git folder, but the live copy is a worktree (its .git is a file), so the pull never runs; a pull could not work there anyway (detached HEAD); install.sh reinstalls whatever local main holds; output goes to /dev/null. Advisor ruling, Oct 23 (goal-2 session asked): the old line 'if main is checked out anywhere, skip' would skip on every normal clone, so the hook fast-forwards whichever tree holds main when it is on main with no tracked changes (as merge.py and launch.py already do), else leaves it and logs one line; the pin still follows local main. Windows has the same fault (MINGW branch runs nothing) and this lane fixes it too, per the brief. Measured Oct 23: Windows clone on main with 2 untracked stray files and no tracked change, 0 behind; pin at 1842e56 = origin/main. Brief: batch 2 of briefs/cleanup-goal-2-oct23.md (full text on c37). Landed in #568 (batch-oct23c, Oct 23), checked at claude-settings f463787 (main, Oct 25): the SessionStart hook finds the clone from the pin, fast-forwards local main (or the tree that holds it, when clean), then runs merge/install_from_main.sh; Windows fixed too. Not checked: whether your Mac and Windows pins now match main after a session start; check with git -C <pin> rev-parse HEAD.", "ask": "See c37 (goal 2), batch 2.", "updatedAt": "2026-10-25T19:45:00Z"}, "c37": {"title": "A goal run paces itself on measured load and shows its pace", "phase": "cleanup", "status": "done", "order": 103.95, "why": "Your gripe, Oct 22: goal 1 did decent work but measured compute badly and ran slowly.", "note": "Causes, Oct 23: the advisor's goal-1 brief capped lanes at 'one or two at a time' by guess (the advisor's own error); the brake mis-read load (CPU spikes, disk as a percent, Mac load average); 'run in the foreground' was a remedy this app cannot use. Fix in this chat: no guessed lane caps in briefs. Fix in claude-settings: (1) the brake reads right (c14); (2) a rule in its one home: a brief or plan never caps lanes by a guessed number, the brake decides; (3) each batch report carries four pace numbers from git and GitHub at report time (wall-clock, lanes and most at once, idle minutes and why, brake refusals), no new log. Goal 2 applies (1) and the pace numbers; (2) and the report-rule part of (3) still need a lane. Goal 1 ended Oct 22; its last batch is #564. Goal 2 written Oct 23, not yet started; this Ask holds its full text. Your word, Oct 23: goal 2 starts now and takes over #564, merging it on green; the goal-1 session stops. Goal 1 final report, Oct 23 (lane counts from commit times): #552 10 lanes, at most 5 at once, 6.2 h; #559 2 lanes, 13.8 h; #560 4 lanes, at most 1 at once, 2.9 h; #561 1 lane, 8.3 h; #562 8 lanes, at most 5, 13.4 h; #564 7 lanes, at most 5, red. Quiet stretches with no lane commit: Oct 21 16:58 to Oct 22 00:25 (7.5 h, cause unknown; likely the unseen question, c31); Oct 22 03:47 to 09:26 (5.7 h, unknown); 14:29 to 15:08 the brake refused every lane; 16:16 to 21:14 brake refusals, then a machine restart; five 34-42 min stretches likely CI waits (unchecked). Reading: most lost time was idle gaps (an unseen question and unknown), then the brake; lane count was rarely the limit. Your word, Oct 23: when you don't answer, the goal parks only that item and continues everything else. Your word, Oct 23: merge #556 (manual memory monitor); goal 2 does it after #564. Your word, Oct 23: every goal-2 question goes to advisor-1b, none to you; 'ask the owner' answers park their item for the final report. Started Oct 23. Goal 2 status, checked at claude-settings f463787 (main, Oct 25): batch 1 (brake) #565 and #569; batch 3 (small lanes) #566 and #567; batch 2 (auto-pull) #568; #564 merged first and #556 (memory monitor) after it, all on Oct 23 between 08:05 and 14:50 UTC. About 7 merges in under 7 hours, against goal 1's 6 batches over about 2 days. Not built: parts 2 and 3 of this step (a rule against guessed lane caps, and pace numbers in each batch report); no lane carried them. Parked: batch 4 (guard cull part 2) and batch 5 (kill guard), both Mac only. No goal-2 final report reached the advisor repo; its pace numbers are unknown. Oct 25: parts 2 and 3 are batch 2 of goal 3 (briefs/cleanup-goal-3-oct25.md, full text in this Ask). Sent to a claude-settings session Oct 25 (owner). Done, checked at claude-settings 149f4bc5 (main, Oct 26): #576 (rules-pace-no-lane-cap) landed rules parallelism-no-guessed-lane-cap and reports-batch-pace-numbers; the lane-cap lint (part 3, item 3) was not built, prose only; whether the session said so is unknown (no goal-3 report in the advisor repo). Goal-3 pace, measured from git by the advisor: batches 1, 2 and 5 ran as three lanes at once, Oct 25 18:01 to 19:16 CDT (75 min, first lane commit to last merge); batches 3 (c31) and 4 (c27) are not on main. Goal-3 progress, re-checked Oct 26 02:50 UTC at 149f4bc5: no commit on main or any branch since 19:16 CDT Oct 25 (about 2.5 h quiet). Open: c43 lane 2 (branch, no PR), batch 3 (c31, has a stop point for your word on the alert), batch 4 (c27, Mac only), batch 6 (c44 per fcb5894; your word Oct 26 keeps c44 out). Likely waiting at the batch 3 stop point; unchecked, the session is not visible from here. Goal 3 moved to a fresh session, Oct 26 (owner). Reported pace, Oct 25: #575 46 min (all CI, ran twice after the merge tool updated the branch), #576 51 min (5 agents in sequence, 26 min CI), #574 75 min (50 min waiting on the other lane's review and CI); no brake refusals. Finding: three lone PRs merged within 20 min each re-ran CI; the advisor's brief line 'each batch is its own integration PR' caused it and is withdrawn (briefs/goal-3-restart-oct26.md, the add-on for the fresh session). Batch 3 waits on your answer: did the 18:05 question reach you as a desktop banner or a phone push.", "ask": "Goal 3 brief (briefs/cleanup-goal-3-oct25.md); its batch 2 carries this step's parts 2 and 3. Goal 2's text stays in briefs/cleanup-goal-2-oct23.md.\n\n# Goal 3: close the cleanup phase of claude-settings\n\nPaste this whole file to one fresh claude-settings session with `/goal finish this end to end`.\nWritten by the advisor, Oct 25, against main f463787 (#572). Goal 2 (briefs/cleanup-goal-2-oct23.md)\nis done except its two Mac batches; this goal finishes those and the last cleanup steps. Each batch\nis its own integration PR, under the usual rules (git-integration-branch-merge,\nroles-review-cap-three).\n\n## 0. First, before any work\n\n1. Save this file as `~/.claude/handoffs/goal-cleanup-3.md`. Put that path on the Goal line of\n   your handoff. After every compaction, read it again before you act.\n2. Check each \"checked at\" fact against current main. A fact that no longer holds: re-plan that\n   lane and say so in the report. A lane whose work is already on main: skip it, say so.\n3. Open PRs at writing time: #571 (bin/ios-ship, one shared tool to ship iOS apps) and the guard\n   cull lane (branch guard-cull-gh-api: delete gh-api-method, owner's word Oct 25, typed as the\n   override for the hole review round 1 found). The owner said both are merging. Confirm with\n   `gh pr list --state open`; take over any that are not merged and drive them to green.\n4. Confirm the live settings match main on this machine: `git -C <pin> rev-parse HEAD` against\n   `git rev-parse origin/main`, read right after this session started. Equal: the session-start\n   auto-pull (#568) works here; say so. Behind: say so with both commits, then reinstall with\n   `bash merge/install_from_main.sh` from the clone, and treat the auto-pull as a red finding for\n   batch 1.\n\n## Pace (from goal 2, unchanged)\n\nNo fixed lane cap: start every ready lane that touches no other open lane's files; the load brake\ndecides. Never idle: while CI runs, build the next batch's lanes as drafts. Questions go to the\nadvisor first (rule questions-ask-advisor-first); only the owner's calls wait for the owner, and an\nunanswered question parks only its item. At each batch merge, report four numbers from git and\nGitHub (no new log): wall-clock from first lane commit to merge; lanes run and the most at once;\nminutes with no lane running and why; brake refusals with their readings.\n\n## Handoff rules\n\nAs in goal 2: the handoff holds Goal, State (each open lane and PR with its plain name, branch, last\nCI head and verdict), owner rulings with their record, open questions and what you do meanwhile,\nthe next action, and working premises with sources. Update it on events. After a compaction: this\nfile, then the handoff, then `git fetch` and `gh pr list --state open`. Trust GitHub over the\nhandoff.\n\n## Stop points (the only places you wait for the owner)\n\n- Batch 3, part 1: whether to add an alert at all, after the first check below.\n- Batch 4: the kill guard needs the owner's Mac. On Windows, park it and say so.\nMerges run under decision standing-merge-grant.\n\n## Batch 1. Agents stop their watchers before they report (c43)\n\nFull brief: briefs/c43-agents-stop-their-watchers.md in the advisor repo (owner pastes it, or read\nthe copy in step c43's Ask). Short form: the defect is verified (a subagent that leaves a Monitor\nor a background Bash running after its report wakes once per task end, and the parent gets a new\nnotification each time; advisor probe, Oct 25: 3 notifications from one agent). Lane 1: one\nsentence in each agent file: before the final report, stop every Monitor and background task you\nstarted with TaskStop, and start none after it. Lane 2: extend judge_stop in hooks/guard.py (it\nalready runs on SubagentStop) to read the agent's transcript and block the stop once while a task\nit started is live; never block twice; fail open. Red then green, then one live run.\n\n## Batch 2. A goal run shows its pace, and no brief caps lanes by guess (c37, parts 2 and 3)\n\nGoal 2 used both; neither is in claude-settings yet (checked at f463787).\n1. One rule, in its one home (find it: the orchestrator's roles or parallelism rules in CLAUDE.md,\n   or the skill that plans batches; extend it, add no second home): a brief or plan never caps\n   lanes by a guessed number; the load brake decides when the machine is too loaded.\n2. The batch report rule (reports-order-of-labels and its home) gains the four pace numbers above,\n   read from git and GitHub at report time. No new log, no watcher, no timer.\n3. If a lint already checks report or rule format, extend it so a brief that writes \"one or two at\n   a time\" or \"at most N lanes\" is flagged; otherwise prose only, and say so.\nProof: the rule text lands with its rule anchor; any lint case is red then green.\n\n## Batch 3. A question waiting on the owner reaches the owner (c31)\n\n1. First check, before any code: does the Claude desktop app already alert the owner (a desktop or\n   phone notification) when a session stops on a question? Read the Claude Code docs for the\n   Notification hook and the desktop app's own notifications, and test it once on this machine.\n   Report what fires. Stop point: bring the owner one question: (a) the app already alerts, close\n   c31 with no code (pick, if true); (b) add a Notification hook that sends one desktop alert,\n   costing nothing per tool call; (c) also a phone push, with the channel named.\n2. The question rule already says a session keeps working on what does not depend on the answer\n   (questions-ask-advisor-first). Check it also says the question names what the session does\n   meanwhile; if not, add those words in place.\n\n## Batch 4. Kill guard knows a lane's left-behind server (c27). Mac only.\n\nFull brief: briefs/c27-kill-guard-session-tag.md in the advisor repo (step c27's Ask). Its first\ncheck runs on the Mac before any code and stops the batch if the session tag is not in the\nserver's environment. On Windows, park it and say so.\n\n## Batch 5. Delete the two STE stub scripts (debt ste-stubs-delete)\n\nlint/ste_gate.py and lint/md_sweep.py exit 0 and exist only for old installs whose settings.json\nstill calls them. Check the install log on this machine and ask the owner for the other machine's\npin commit: every install at or past #566 (batch-oct23a, where the STE hooks left settings.json)\nmeans delete both files, their stub cases in lint/test_settings_matcher.py, and the debt. Any\ninstall older, or unknown: keep them and say why.\n\n## Not in this goal\n\n- c33 (home gets a small CI) and c42 (home-app names its merge checks): each is a short session in\n  its own repo, from its own brief in the advisor repo.\n- c41 (Opus for one session without lifting other guards): owner's word, Oct 25, brief it later.\n- c40 (idle desktop sessions burn a core each): the owner's action in the app.\n\n## When the goal is done\n\nReport per the report rules, plus the four pace numbers per batch and in total. List anything\nparked and why. Then the advisor re-measures the cull numbers and reviews the roadmap for the move\nto the Organize phase, which starts with o2 (one layout for every repo; its brief and plan are in\nthe advisor repo).\n", "updatedAt": "2026-10-26T03:10:00Z"}, "c38": {"title": "Tests clean up their temp folders, in every repo", "phase": "cleanup", "status": "done", "order": 111.9, "why": "Oct 22: Degen's Swift tests left temp folders that filled the Mac disk (note from the Degen session).", "note": "Pattern from Degen (branch temp-dir-leak): one temp root per repo; a <pid>-<UUID> run folder; every helper takes its folder from it; teardown removes it; the first request of a run removes sibling run folders older than a day (crashed runs) and keeps newer ones (parallel runs); a test proves the sweep. claude-settings has no such rule; the nearest home is the janitor (debt windows-temp-sweep, ruled Oct 16, never built: session temp folders, 17 GB on Windows). Rule only; each repo keeps its own helper, no copying code across repos. Both are lanes in batch 3 of briefs/cleanup-goal-2-oct23.md (full text on c37). Ties to the brake: disk filling up is what full guards. claude-settings part landed in #567 (batch-oct23b, Oct 23), checked at claude-settings f463787 (main, Oct 25): the run-folder standard is in agents/test-author.md, and the janitor removes idle session temp folders on Windows (debt windows-temp-sweep built). Each repo's own helper (Degen's TempDirSupport.swift) stays with that repo; not checked here.", "ask": "See c37 (goal 2), batch 3, lanes test-temp-standard and windows-temp-sweep.", "updatedAt": "2026-10-25T19:45:00Z"}, "c39": {"title": "CI time caps start generous and warn before they fire", "phase": "cleanup", "status": "done", "order": 111.65, "why": "Your gripe, Oct 23: CI that is new, or that just gained tests, keeps timing out and failing.", "note": "Checked at 1842e56: skill ci-hygiene step 5 sets each job's cap at about 2x its slowest green run. A new job has no green run to measure, and a growing suite outgrows its cap silently; the only signal is a timeout that reads like a test failure. Seen here: Oct 17, two gates runs cancelled at 18 min with every step green (debt gates-job-near-timeout); Oct 22, the macOS cap raised from 25 to 50 min; #562's merge wait ran out while CI was green (c34). Which other repos hit it: unknown, you named it as a pattern. Fix: a provisional 60-minute cap until 5 green runs; the merge tool warns when a job used over 70% of its cap; a timeout with all steps green gets its own verdict ('re-cap or split'), not a drop; the merge wait follows the caps. Change in this chat: no hard-coded CI caps in my briefs; caps come from measured runs. Your word, Oct 23: approved. Lane ci-time-caps in batch 3 of goal 2 (full text on c37), together with c34. Advisor answer to the goal session, Oct 23 (not the owner's word): the timing test has no record, so the lane runs all six wall-clock bounds in lint/test_gates.py, the whole file 20 times under load; the 70% warning adds startedAt and completedAt to the existing gh pr checks call and reads caps from the workflow files, no new call; the timeout verdict is a cancelled check that ran at least its cap, with no step data (run 39074284633's timed-out job shows every step as success). Raising the merge wait 30 to 55 is item 4 as approved. Landed in #566 (ci-time-caps lane), checked at claude-settings f463787 (main, Oct 25): skill ci-hygiene sets a provisional 60-minute cap on a job with fewer than 5 green runs; the merge tool reads startedAt and completedAt and warns at 70% of a cap. #570 (Oct 24) set the Windows rest job to 38 minutes from 5 green runs. Not checked: whether the report-gate timing test failed in its 20 runs.", "ask": "See c37 (goal 2), batch 3, lane ci-time-caps.", "updatedAt": "2026-10-25T19:45:00Z"}, "c4": {"note": "Done Oct 20: 28 remote heads left in claude-settings, main included (244 on Oct 17). Merges now delete the lane branches a batch absorbed (decision merge-deletes-batch-lanes, merge/merge.py cut_branch). Left over: branch batch-map, deleted in the next batch. q_max (1,017 heads) belongs to Roll out. Oct 26 at 149f4bc5: 34 remote heads; 7 old lane branches already merged into main remain (remove-ste-hooks, question-reviewer-hook, advisor-asks-first, planner-checks-premises, premise-handoff-section, rule-guard-grows, mem-monitor-tool-tests), so the merge cut misses some lanes (likely the ff and squash lane debts; cause unchecked). One-line delete by you or a lane in c46.", "order": 40, "phase": "cleanup", "status": "done", "title": "Delete merged remote branches", "updatedAt": "2026-10-26T02:58:00Z", "why": "188 of 244 remote branches in claude-settings are already merged. q_max has 1,017 remote heads. Then have each merge cut the lane branches its batch absorbed."}, "c40": {"title": "Idle desktop sessions each burn a full CPU core", "phase": "cleanup", "status": "todo", "order": 107.5, "why": "Session question, Oct 23 (goal 2 pace): the machine sat at 90-100% CPU with no work running, and the brake held every lane. Same pattern as the 15 spinning claude.exe workers of Oct 19 (c14).", "note": "Measured by the advisor, Oct 23 02:30 CDT, read-only: 37 claude.exe processes; 17 use about 1.0-1.1 cores each over 5 s (19 of 24 cores, CPU 93%, memory 72% of 63.5 GB). All 17 are Claude Desktop 3.1623.0.0 children running claude-code 2.1.304 with --resume, children conhost only (one also keeps a bash wait loop from Oct 22 12:35 polling a temp file). Their transcripts last changed Oct 19-22, mostly Oct 21 ~15:30 (q-max 8, 77-rollover 2, claude-settings 2, others 1 each); one (q-max 3a3eb243) wrote at 01:48 today, and one has no --resume, so those two may not be idle (unknown). None runs a claude-settings hook. Not checked: whether this is a known upstream bug, and why they spin (unknown). Not fixable in claude-settings; the brake already reads it right. Open for you: (1) archive or stop the idle sessions in the app (frees about 17 cores; loses their in-memory state, transcripts stay); (2) report it to Anthropic with the version numbers above; (3) whether claude-settings should add a read-only 'idle sessions burning CPU' line to the health view, so you see it without a session asking.", "ask": "Owner action, no brief yet: archive or stop the idle Claude Desktop sessions listed in the note, then report the spin upstream (Claude Desktop 3.1623.0.0, claude-code 2.1.304, Windows 11 26200). A health-view line is a later lane only if you want it.", "updatedAt": "2026-10-23T07:35:00Z"}, "c41": {"title": "Opus for one session or one run, without lifting other guards", "phase": "cleanup", "status": "todo", "order": 107.6, "why": "Your question, Oct 25: can override say 'Opus builders for this part of the plan or this session'? Today it cannot without lifting every other guard too.", "note": "Checked at claude-settings f463787. Built today: (1) every Opus spawn that Plan, Explore or a builder's try 3 does not cover asks you, one prompt per spawn (guard rule subagent-model-cap, #562). (2) override 15m or override 2h lifts every refusal and ask in the session, Opus included, and reaches subagents; too broad, since it lifts all other guards too. (3) A repo grant: CLAUDE_CODE_SUBAGENT_MODEL set to opus in .claude/settings.local.json with a deadline at most 24 h out (decision opus-grant-expires); raises every spawn in that repo, needs a fresh session, and the write itself asks. Not built: a grant scoped to Opus only, for one session and a time. Advisor pick, Oct 25, not ruled: a second prompt word in the override pass's one home (hooks/override_pass.py), such as 'opus 2h' or 'opus builders 2h', that lifts only subagent-model-cap asks (optionally one role) for this session and its subagents until it expires. 'This part of the plan' is not checkable by a hook; session plus time is. Your word, Oct 25: keep it on the roadmap; brief it when its turn comes.", "ask": "", "updatedAt": "2026-10-25T20:45:00Z"}, "c42": {"title": "home-app: the merge tool finds its checks, and a skipped draft run is restarted the right way", "phase": "cleanup", "status": "todo", "order": 107.7, "why": "home-app session report, Oct 25 (PR 271): the PR's own checks had skipped, so it pushed an empty commit (345ff43) to start a run; and the merge tool stopped because home-app's main has no branch protection, so it found no required checks.", "note": "Checked Oct 25 (claude-settings f463787, home-app 65315da). Cause 1: home-app test.yml skips the scope job, and so every job, on a draft PR (home-app rule: drafts run no CI). The manual workflow_dispatch run that passed does not count as the PR's checks. Marking the PR ready (ready_for_review is a trigger) starts a real run on the same head, with no new commit. Cause 2: merge.py reads required checks from .github/stamp.json merge.requiredChecks first and only falls back to branch protection; home-app has no stamp.json. The tool's own stop message names the fix. Not a new gap in claude-settings: no rule there forbids an empty commit to start CI (low harm: one noise commit). Advisor pick: fix in home-app (stamp.json plus one CLAUDE.md line); branch protection on home-app main is optional and needs your login. Same fix fits banchi and q_max if they lack stamp.json (not checked). Related: c33 (home has no CI at all).", "ask": "Brief for a home-app session (paste all of it):\n\nGoal: the claude-settings merge tool runs in home-app, and a PR whose draft run skipped gets a real run without an empty commit.\n1. Add .github/stamp.json with merge.requiredChecks naming the jobs in .github/workflows/test.yml: scope, test, addon, ios. Copy the shape from claude-settings .github/stamp.json. Set merge.deadlineMinutes to the largest job timeout-minutes plus 5. The merge tool already passes a skipped job, and goes red only when no job ran on the head (merge/merge.py judge_runs).\n2. Proof: run the merge tool's dry read on an open PR (or the next one) and show it lists the four checks instead of stopping on \"no branch protection\".\n3. Add one line to home-app CLAUDE.md's CI rule: when a PR's run skipped because it was a draft, mark it ready (gh pr ready), which starts the PR run on the same head; never push an empty commit to start CI.\nReport: Done, Deviations, Input Needed, Next.", "updatedAt": "2026-10-25T20:45:00Z"}, "c43": {"title": "Agents stop their watchers before they report", "phase": "cleanup", "status": "active", "order": 107.8, "why": "Degen orchestrator, Oct 25: a reviewer woke 4 times after its final report, each time on a watcher that expired on a build long finished; each wake is a fresh notification to the parent.", "note": "Verified by the advisor, Oct 25 (cloud session): a subagent left a 60 s Monitor and a 90 s background Bash running after its report; the parent got 3 notifications (report at 8 s, wakes at 66 s and 96 s), and the agent woke and replied each time. Claim holds. Desktop app not checked. claude-settings f463787: no agent file tells agents to stop their tasks; guard.py judge_stop already runs on SubagentStop and is the home for a check. Plan: one sentence in each agent file, plus a SubagentStop check that blocks a stop once while the agent's transcript shows a live task. Brief written; not sent. Goal 3 batch 1 (briefs/cleanup-goal-3-oct25.md, text on c37). Lane 1 landed in #574 (agents-stop-watchers), checked at 149f4bc5: the stop-your-tasks sentence is in each agent file (the guide agent's was dropped). Lane 2, the SubagentStop check in judge_stop, is not on main (no TaskStop or live-task read in hooks/guard.py); unknown whether the session parked it or dropped it. Re-checked Oct 26 02:50 UTC: lane 2 is built on branch stop-blocks-live-tasks (2 commits: red cases 18:21, block 18:44 CDT Oct 25), 2 ahead of main, no PR opened. Why it stopped: unknown. Session report, Oct 26: lane 2's first try would have blocked 248 of 1,787 real agent stops by mistake (the task-finished notices are mostly in another shape; two cases missed); the test-author's second try stopped because the old session's agents could not edit files. Advisor pick, Oct 26: one more try, shipping only at zero mistaken blocks on the same 1,787 stops; otherwise drop lane 2 and keep the sentence (briefs/goal-3-restart-oct26.md).", "ask": "# c43. Agents stop their watchers before they report\n\nPaste this whole file into one fresh claude-settings session. Written by the advisor, Oct 25,\nagainst claude-settings main f463787.\n\n## The defect (verified, not assumed)\n\nClaim from the Degen orchestrator, Oct 25: a subagent arms watchers (Monitor, or Bash with\nrun_in_background) on a long test run, reports early, and never stops them. Each watcher later\nends, wakes the finished agent, and sends the parent a new task notification. Seen: one Degen\nreviewer woke 4 times after its final report.\n\nReproduced by the advisor, Oct 25, in a Claude Code cloud session: a subagent armed a Monitor\n(timeout 60 s) and a background Bash (sleep 90 s), then sent its final report at 8 s without\nstopping either. The parent got three task notifications for that one agent: at 8 s (the report),\n66 s (the monitor's expiry woke the agent; it replied) and 96 s (the background task's end woke it\nagain). The notice on the first two said \"waiting on its own background work\". Desktop app\nbehaviour: not checked, assumed the same (same harness).\n\nWhat the agent's transcript holds (subagents/agent-<id>.jsonl, the file the SubagentStop input\nnames): each start's tool result names its task id (\"Monitor started (task <id>\", \"Command running\nin background with ID: <id>\"); TaskStop calls carry task_id; each end arrives as a user entry\nstarting \"[SYSTEM NOTIFICATION\" that names the task id.\n\n## Lane 1, the rule (one sentence per file)\n\nIn agents/builder.md, reviewer.md, test-author.md and record-writer.md (any agent that runs long\nchecks; check explore.md and plan.md too), next to the existing \"before you stop\" sentence, add one\nsentence in that file's style: before the final report, stop every Monitor and background task you\nstarted with TaskStop, and start none after it.\n\n## Lane 2, the check (only if the hook input allows it; prove it first)\n\nHome: judge_stop in hooks/guard.py, which already runs on SubagentStop. Extend it; build no second\nhook. Incident for building-guard-needs-incident: the Degen reviewer, Oct 25.\n- Read the agent's transcript (the SubagentStop input's agent transcript path; confirm the field\n  name from a real payload first, and stop and report if no field names it).\n- Live tasks = ids started by a Monitor or a run_in_background Bash, minus ids passed to TaskStop,\n  minus ids named in a later end notification.\n- Any live task and stop_hook_active false: block the stop once (decision block), reason naming\n  each live id and \"stop them with TaskStop, then report again\". stop_hook_active true: never block\n  again; log a noted line (rule id agent-live-tasks) and let it stop. An unreadable transcript is\n  no finding (fail open: this is hygiene, not a safety guard).\n- Cost, per outcomes-mechanize-rules: no process start; one read of the agent's transcript per\n  agent stop; no file written except one guard.log line on a finding. A test pins it.\n- Proof: test-author writes cases red on main: a fixture transcript with a Monitor started and\n  never stopped blocks once; the same with TaskStop passes; one whose task's end notification\n  arrived passes; stop_hook_active true with a live task passes and logs one line; an unreadable\n  transcript passes. Builder makes them green. Then one live run: spawn an agent that leaves a\n  60 s Monitor and report what the parent saw (one notification, not two).\n\n## Review and merge\n\nA reviewer reads the diff (it adds a gate verdict). Usual rules: git-integration-branch-merge,\nroles-review-cap-three. Report: Done, Deviations, Decided by the advisor, Input Needed, Next.\n", "updatedAt": "2026-10-26T03:10:00Z"}, "c44": {"title": "Merged work leaves no worktrees or branches behind, and a wrapping session offers the fast cleanup", "phase": "cleanup", "status": "todo", "order": 107.9, "why": "Your idea, Oct 25: when a session thinks its work is wrapped, it should offer you a faster worktree cleanup than the scheduled ones.", "note": "Checked at claude-settings f463787. Cleanup today runs on its own at four points (decision when-a-worktree-may-be-removed): each agent end removes a finished agent's tree after 30 idle minutes; each session end and the daily job remove a merged tree idle 1 hour, an agent tree idle 4 hours, a pushed unmerged tree idle 24 hours. A dirty or unpushed tree is never removed. The fast path already exists: janitor/sweep.py --attended (a person's run, skips the merged and 1-hour idle keeps) and --fast (only trees whose branch is already in main, no fetch); preview by default, --confirm to remove. Gap: no rule tells a session to offer it, so you never hear of it. Unknown: how many worktrees pile up today on the Mac and Windows (count .claude/worktrees per repo and read state/janitor-runs.jsonl). Plus: one sentence in the reports rule's home: when a session's last PR has merged and no lane is open, its final report offers the cleanup as one command you can run (c28 pattern): sweep.py --root <repo> --attended --fast, preview then --confirm. No hook, no new code. Your word, Oct 25: you were checking whether it existed; goal 3 already went out without it, so it waits for a later batch. Mac session report, Oct 25 (ios-ship and guard-cull lanes): after both PRs merged, their worktrees and local branches stayed. Causes it found: the merge tool deletes the remote branch, keeps a local branch that a worktree has checked out, and never removes worktrees; the Agent tool keeps a subagent's worktree when it holds commits and locks it with the host session's pid, and the sweep frees such a lock only when that pid is dead, so the tree waits until the session ends. Friction seen: unlock and remove in one command is refused (the guard reads the lock first); a stale tree with only deletions had to be committed on a throwaway branch (discard-a4f61ca) to pass the guard, and that branch then could not be deleted (only copy), so the guard's remedy left junk for you to delete by hand. Your word, Oct 25 ('agreed'), on the advisor pick: after a merge, the merge tool runs the sweep's --fast removal for that one branch's clean worktree, and the sweep treats a lock held by the calling session's own pid on a finished agent's merged, clean tree as freeable. Unknown: whether the merge tool's 'never removes worktrees' has a recorded reason (read decision when-a-worktree-may-be-removed first). The Mac now holds only main and one pin (2026afc4), per your word that claude-settings building happens on Windows. Brief: briefs/c44-merged-work-cleans-up.md (text in this Ask); Your word, Oct 26: not in goal 3; run it after goal 3 lands. Advisor, Oct 26, at 149f4bc5: debt finished-agent-shells-keep-tree (owner ruled Oct 15 to stop a finished agent's shells, such as a dev server, so its tree can go; not built) is the same pile-up; c44's lane is its home. Not yet in the brief.", "ask": "# c44. Merged work leaves no worktrees or branches behind\n\nPaste this whole file into a claude-settings session (Windows; the Mac holds main only). Written by\nthe advisor, Oct 26, against main f463787. Owner agreed Oct 25.\n\n## Why\n\nMac session, Oct 25: after the ios-ship and guard-cull PRs merged, their worktrees and local\nbranches stayed. The merge tool deletes the remote branch, keeps a local branch a worktree has\nchecked out, and never removes worktrees. The Agent tool locks a builder's worktree with the host\nsession's pid, and the sweep frees such a lock only when that pid is dead, so a merged tree waits\nfor the session to end. Cleaning by hand cost several guard refusals and left a throwaway branch\nthe owner had to delete.\n\n## First check\n\nRead decisions when-a-worktree-may-be-removed and the-janitor-is-one-machine-wide-sweep, and the\nmerge tool's docstring. If \"the merge tool never removes worktrees\" has a recorded reason, bring it\nto the advisor with this brief's lanes before building (rule outcomes-stale-decision-protocol).\n\n## Lane 1, the merge tool cleans its own branch\n\nAfter a merge succeeds, the merge tool removes the merged branch's worktree when it is clean and its\nHEAD is in the default branch, by calling the sweep's existing --fast removal for that one tree (one\nhome; no second removal path). Then it deletes the local branch, as it does today when no worktree\nholds it. A dirty tree, an unmerged HEAD, the caller's own cwd, or any unread fact keeps the tree and\nprints one line saying why.\n\n## Lane 2, the sweep frees the caller's own lock on a finished agent's tree\n\nThe sweep may free an Agent-tool lock whose pid is the calling session's own process, only when the\ntree is clean, its HEAD is in the default branch, and no live process stands in it. Every other lock\nstays as today.\n\n## Lane 3, the offer\n\nOne sentence in the reports rule's home: when a session's last PR has merged and no lane is open, its\nfinal report offers `python3 ~/.claude/janitor/sweep.py --root <repo> --attended --fast` (preview, then\n--confirm) as one command, unless lanes 1 and 2 left nothing to remove.\n\n## Proof\n\ntest-author, red on main: a merged clean worktree survives a merge today and is gone after lane 1;\na dirty one and an unmerged one stay; a tree locked by the caller's own pid, clean and merged, is\nfreed by lane 2, and one locked by another live pid stays. Builder makes them green. A reviewer reads\nthe diff (it changes what a deletion tool removes). Usual merge rules.\n", "updatedAt": "2026-10-26T01:40:00Z"}, "c45": {"title": "A step handed to you says what check showed the session can't do it", "phase": "cleanup", "status": "todo", "order": 109.6, "why": "Your gripe, Oct 25: the ios-adblock session asked you to delete two test App IDs on developer.apple.com when its own App Store Connect key could do it, and then said it needed your login, even though the rules say to check first.", "note": "Checked at claude-settings 149f4bc. The rule exists: output-never-hand-off-doable-step (do a step yourself before you hand it to me) in output-styles/shiv-stylisms.md says search first and name the reason. Gap: nothing checks the doability half. The reply judge (hooks/reply_judge.py) checks only that a command comes as a runnable block, on 1 Stop in 5. c28 (runnable one-click commands) fixed the form, not this. Fix: amend the rule in place (name the reason and the check; what you made you clean up; can't vs shouldn't; a plan that makes throwaway things names their cleanup), and have the reply judge check every report with Input Needed. The second part changes the owner ruling of Oct 13 (judge 1 Stop in 5), so it needs your word. Advisor pick, Oct 26: do both in one lane. Finding, Oct 26, checked at 149f4bc: the 1-in-5 sample was ruled Oct 13 for cost and latency, with the judge's rules kept unmechanized until it catches a real defect. Since then only its prompt grew (Oct 22, the hand-off clause and narrower exemptions); it still runs Haiku, and it keeps no record of what it flags, so whether it is useful or noise is unmeasured. Hence part 3: each flag writes one line to guard.log, read at each cull.", "ask": "# c45, a step handed to you names the check that proved the session can't do it\n\nRepo: claude-settings. Checked at 149f4bc (main, Oct 25 19:16 CDT).\n\nIncident, Oct 25 (ios-adblock): the session's report listed \"delete the two test App IDs on developer.apple.com\" under Input Needed. It never checked its tools. The App Store Connect key that created the IDs was on the Mac and could delete them. When asked, it then said the step \"needs your login\", also unchecked. The owner had to point it out twice. Rule output-never-hand-off-doable-step (do a step yourself before you hand it to me) already says to search first and name the reason, but nothing checks the doability half: the reply judge (hooks/reply_judge.py) only checks the code-block form, and only on 1 Stop in 5.\n\nTask, two parts, one lane:\n\n1. Amend output-never-hand-off-doable-step in output-styles/shiv-stylisms.md, in place, no new rule. Add:\n   - Each step handed to the owner names its reason (decision, login, or an act the safety rules keep for the owner) and the check that shows the session cannot do it, in a few words, such as \"no API key for Apple in env or keychain\". With no check run, the step is not the owner's yet: run the check first.\n   - Access that made a thing can remove it. A thing the session made, it cleans up itself.\n   - \"Can't\" and \"shouldn't\" differ. A step the session can do but that cannot be undone is not handed over as steps: the session asks one yes or no on the exact act, and does it on the yes.\n   - A plan that makes throwaway things (test IDs, test branches, test data) names their cleanup in the same ask, so the owner's yes covers both (outcomes-word-covers-named-act, my word covers the act it names).\n2. Extend hooks/reply_judge.py, the one home, no new hook:\n   - Add to INSTRUCTIONS: each item under Input Needed names its reason and the check that showed the session cannot do it; flag an item that names neither.\n   - Judge every Stop whose reply carries an \"Input Needed\" label, besides the 1-in-5 sample. Detect the label in code (a string match on the label), not by the model. This changes the owner ruling of 2026-10-13 in decision reply-judge-samples-never-blocks; rewrite that entry in place with the new ruling and its cost: one extra model call per report that carries Input Needed, no new file, no new process, no timer.\n   - Still never blocks, still fails open.\n\n3. Each finding the judge passes on also writes one line to guard.log, the existing log (rule id, session, Stop number). No new file. Named reader: the advisor at each cull, who counts flags against owner-confirmed misses and false alarms, to rule whether the judge stays, widens or goes. Today it keeps no record, so its value is unmeasured.\n\nRecord: the incident above is the named incident (building-guard-needs-incident). Update lint/rule_mechanisms.json reason for output-never-hand-off-doable-step to say the judge now also checks reason and check, on every Input Needed report.\n\nProof (test-author first, red on main):\n- A reply with \"Input Needed: delete the two test App IDs on developer.apple.com\" and no reason is judged even when it is not a 1-in-5 Stop (counter test, no model needed: stub invoke_model and assert it was called).\n- A reply with no Input Needed and a non-sample Stop is not judged.\n- The prompt text carries the new clause (string check).\n- A model run on the two sample replies (no reason vs. \"needs your login: no App Store Connect key in env or keychain\") flags the first and passes the second; record the run, it is not a CI test.\n\nReport cap: 15 lines.\n", "updatedAt": "2026-10-26T02:10:00Z"}, "c46": {"title": "Lanes start only in the tool's own worktrees, and a dropped lane keeps its branch", "phase": "cleanup", "status": "todo", "order": 107.95, "why": "Parallel-work review, Oct 26 (your ask): two owner rulings on parallel lanes are recorded in claude-settings debts but never built, and neither is on the roadmap.", "note": "Checked at claude-settings 149f4bc5 (main, Oct 26). (1) Debt agents-write-main-clone: Oct 20, after the tool's worktree isolation failed at 100% CPU, an orchestrator made lane trees by hand and two agents wrote into the main clone. Your ruling, Oct 21: block the workaround fully and record which layer refused isolation. Not built: no check in hooks/guard.py. (2) Debt merge-deletes-dropped-lane: batch #564 lost five dropped lanes' branches on Oct 23, restored by hand. Not built. Four smaller merge-tool lane debts stay notes. Brief written, not sent: briefs/c46-lanes-stay-in-their-trees.md (text in this Ask). Advisor pick: run after goal 3 and c44.", "ask": "# c46. Lanes start only in the tool's own worktrees, and a dropped lane keeps its branch\n\nPaste this whole file into one fresh claude-settings session (Windows). Written by the advisor,\nOct 26, against main 149f4bc5 (#574). Two lanes, one integration PR, usual rules\n(git-integration-branch-merge, roles-review-cap-three). Run after goal 3 and c44 land, or as\na lane beside c44 if it touches no c44 file.\n\n## Lane 1. Refuse a hand-made lane worktree (debt agents-write-main-clone)\n\nOwner ruling, Oct 21, recorded in the debt, not built at 149f4bc5 (no hand-made check in\nhooks/guard.py). Incident, Oct 20: an orchestrator whose `isolation: 'worktree'` failed made lane\ntrees by hand and spawned agents without isolation; two agents wrote into the main clone.\n\n1. Block: the guard refuses the workaround, so a writing lane starts only through the tool's own\n   isolation. Find the cheapest reliable predicate first (an Agent or Task call with no\n   isolation whose brief names a worktree path outside `.claude/worktrees/`, or a `git worktree\n   add` from an orchestrator into a scratchpad). Read the act, not a guess from location\n   (decision predicate-is-the-act). Red case first, then green.\n2. Diagnose: when the tool's isolation is refused, log which layer refused (harness or guard) and\n   its message on the guard's existing refusal line. If the guard refused, fix the guard.\n3. Retire the debt per its Retire line.\n\n## Lane 2. The merge tool keeps a dropped lane's branch (debt merge-deletes-dropped-lane)\n\nIncident, Oct 23: batch #564 lost five dropped lanes' branches after merge; restored by hand.\nmerge/merge.py cuts every lane merged into the batch, including one the batch later reverted.\nFix: keep a lane branch whose merge into the batch was reverted on the batch. Red fixture\ntest, then green. The other merge-tool lane debts (ff-first-lane-not-a-tip,\nsquash-lane-branch-kept, lane-cycle-delete-order, long-lived-head-lost-in-batch) stay notes\nunless the same edit fixes one for free; say which.\n\n## Report\n\nPer the report rules, with the four pace numbers.\n", "updatedAt": "2026-10-26T01:40:00Z"}, "c47": {"title": "iOS shipping keeps one account file, and app repos keep only their app list", "phase": "cleanup", "status": "todo", "order": 107.97, "why": "Your question, Oct 26: why do testflight and reinstall-phone-apps sit in three repos (home-app, ios-adblock, degen) instead of claude-settings?", "note": "Checked Oct 26 at claude-settings 149f4bc, home-app 0a3419b, ios-adblock b3d5eb6, degen e2635ca. The logic already has one home: bin/ios-ship, landed Oct 25 (decision ios-ship-is-one-shared-tool); all three repos switched the same day. No record ever chose the split: the reinstall job began Oct 10 in ios-adblock as a nightly job that installed every phone app, Degen too; three sessions each wrote a TestFlight script on Oct 21, because claude-settings had no home for iOS tools until Oct 25. What is still copied: (1) the account block (team, key, issuer, key path, phone), identical in all three tools/ios-ship.json; it cannot go in claude-settings, which is public; (2) two thin wrappers per repo, already drifted (home-app reads APPS and DRY, ios-adblock refuses PHONE_APPS_JSON and has a test, degen is bare). The per-repo app list is a right variant and stays. Advisor pick: account values in one Mac file, ~/.config/ios-ship/account.json, under env and repo overrides; ios-ship finds the repo's config itself; wrappers deleted. Owner agreed, Oct 26: one account file, ios-ship finds the config, wrappers deleted. Brief ready to send: briefs/c47-ios-ship-one-account-no-wrappers.md (text in this Ask). Order: part 1 in claude-settings, then part 2 in each app repo.", "ask": "# c47. One account file for iOS shipping, and no wrapper scripts in the app repos\n\nWritten by the advisor, Oct 26. Owner agreed Oct 26. Checked against claude-settings 149f4bc, home-app 0a3419b,\nios-adblock b3d5eb6, degen e2635ca. Two parts, in this order: part 1 in claude-settings, then\npart 2 in each app repo after part 1 merges and the Mac has reinstalled.\n\n## Why\n\n`bin/ios-ship` (one shared tool that ships iOS apps) landed Oct 25 (decision\nios-ship-is-one-shared-tool). The build and upload logic now has one home. Two copies remain in\neach of the three app repos (home-app, ios-adblock, degen):\n\n1. The account block. `team_id`, `asc_key_id`, `asc_issuer_id`, `asc_key_path` and\n   `device_udid` are the same in all three `tools/ios-ship.json` files. A new phone or a key\n   rotation means three edits. They cannot move into claude-settings: it is public.\n2. The wrappers `tools/testflight` (home-app: `testflight.sh`) and `tools/reinstall-phone-apps`.\n   They only find the config and call ios-ship, and they have already drifted: home-app reads\n   `APPS=` and `DRY=`; ios-adblock refuses the old `PHONE_APPS_JSON` and has its own test;\n   degen passes arguments only. File names differ too.\n\nRule: one home, then variants (owner, Oct 20): a shared script lives in claude-settings; a repo\nkeeps only what differs.\n\n## Part 1, claude-settings: ios-ship reads one account file and finds the repo's config\n\n1. Account file. ios-ship reads account values from `~/.config/ios-ship/account.json` (keys as\n   today: `team_id`, `device_udid`, `asc_key_path`, `asc_key_id`, `asc_issuer_id`). Order: env,\n   then the repo config, then the account file. A repo config may still set a key, as a variant.\n   A key unset in all three refuses and names both files and the env var. The file lives only on\n   the Mac. No ID goes in this repo: fake IDs in tests only.\n2. Default config. `CONFIG` becomes optional. With none given, ios-ship uses\n   `<git toplevel of the current folder>/tools/ios-ship.json`. Outside a git repo, or with no such\n   file: exit 2 with one line. The usage line and header comment change to match.\n3. Old variable. `install` refuses when `PHONE_APPS_JSON` is set (exit 2; message names `--app`\n   and `tools/ios-ship.json`), so the ios-adblock wrapper's refusal can go.\n4. Rewrite decision ios-ship-is-one-shared-tool in place and README \"Shipping iOS apps\": where the\n   account file lives, what a repo config holds (apps, `repo_url`, overrides), how to call it\n   (`ios-ship testflight` from inside the repo).\n\nProof, test-author first, red on main, in lint/test_ios_ship.sh (the `shell-macos` job):\n- account file only: values resolve; repo config key wins over the account file; env wins over both.\n- key unset everywhere: refusal names both files.\n- no CONFIG inside a repo with tools/ios-ship.json: same calls as passing it; outside a repo: exit 2.\n- `PHONE_APPS_JSON` set on install: exit 2, xcodebuild stub never called.\n\nProgram logic: a fresh reviewer reads the diff (roles-solo-reviews-logic-diffs-only).\n\n## Part 2, each app repo (home-app, ios-adblock, degen), after part 1 is live on the Mac\n\n1. Once, on the Mac: write `~/.config/ios-ship/account.json` from the values in any one repo\n   config (they match). Do not print them.\n2. Remove the five account keys from `tools/ios-ship.json`. Keep `apps` and `repo_url`.\n3. Delete both wrappers. Point every caller at `ios-ship testflight` / `ios-ship install`:\n   degen `Makefile` target `testflight`; home-app `SPEC.md` how-to and its `make testflight`;\n   ios-adblock installer docs. ios-adblock: delete tests/test_reinstall_wrapper.sh (it tests the\n   wrapper; part 1 moves its case into ios-ship's suite).\n4. Proof: `ios-ship install --no-install` from the repo root builds each app (no phone needed),\n   and `ios-ship testflight --export-only` archives. Record both verdicts. home-app: its merge grant\n   covers this PR; the others need the owner's word to merge.\n\nNot in scope: the vendored design skills (filed under o11, one home for each shared thing).\n\nReport cap: 15 lines per part.\n", "updatedAt": "2026-10-26T02:35:00Z"}, "c48": {"title": "Phone profiling wakes the developer disk image first", "phase": "cleanup", "status": "todo", "order": 107.98, "why": "Your question, Oct 26: where should the Oct 25 lesson live (xctrace record on Shivinate XIII timed out 'waiting for device to boot' until devicectl ddiServices ran)? claude-settings, ios-ship, or the Degen repo only?", "note": "Checked Oct 26 at claude-settings 149f4bc. ios-ship has two jobs (testflight, install); no profile job, and no xctrace or ddiServices anywhere in claude-settings. Facts from the owner's Oct 25 log: two failures with plain xctrace record, one success right after 'devicectl device info ddiServices'. Web, Oct 26: the same 'Waiting for device to boot' message is a known intermittent xctrace failure since Xcode 13 (developer.apple.com/forums/thread/694698, Nov 2021; Apple asked for a sysdiagnose, no fix given); a second person hit it on iOS 27, Oct 24 2026, setup not stated (github.com/seedds/nxnative/issues/142); devicectl has a --no-auto-mount-ddis flag, so ddiServices mounts the DDI by default (github.com/appium/appium-xcuitest-driver/issues/2985); iOS 27 moved to the cryptex DDI (github.com/doronz88/pymobiledevice3/pull/1992). Advisor reading: general, not Degen's (the failure comes before the app launches); the likely cause is that xctrace waits for a DDI it does not mount itself, and ddiServices mounts it. Unmeasured: that cause; whether network pairing matters (no source says wired or wireless); device name versus UDID; how long the DDI stays mounted (the 21:43 failure came 34 minutes after the success). Advisor pick, not ruled: run one live test on the Mac first (UDID only: xctrace fails, ddiServices --no-auto-mount-ddis shows the DDI state, ddiServices mounts, xctrace succeeds), then an ios-ship 'profile' job that runs ddiServices and then xctrace by UDID, after c47 part 1 lands (both edit bin/ios-ship). Not a hook, not a CLAUDE.md rule. Waiting on the owner's word.", "ask": "", "updatedAt": "2026-10-26T03:05:00Z"}, "c49": {"title": "A ruling on a behaviour covers every test that expects the old one", "phase": "cleanup", "status": "todo", "order": 109.65, "why": "Your gripe, Oct 26: a session asked you again whether it may change an older test that expects a behaviour you ruled out at 21:27 (a rule save clears the partly-sent mark). It said your word covered one test, and a failing test only changes on your word.", "note": "Checked Oct 26 at claude-settings 149f4bc. Cause: rule outcomes-tests-are-claims (a failing test is a claim, not law) sorts a broken test into (a) re-point, (b) real defect, (c) rule may be stale, STOP and wait for the owner. It has no class for a behaviour you already ruled out, so the session used (c). Rule outcomes-word-covers-named-act (my word covers the act it names) then made each further test look like a new act. Rationale on record: decision builders-cannot-edit-tests says a green run must mean the code is right, so no one weakens a test to get green; the stale-decision protocol keeps a session from silently overturning a recorded choice. Origin before Oct 16 is unknown: claude-settings history starts at 09c988a (Oct 16) with both rules already in place, and no roadmap entry covers them. Advisor pick: option B+sweep (a 4th class for tests of a ruled-out behaviour, found in one pass and re-pointed together, reviewer checks scope). The Swift test is not in home-app; repo unknown.", "ask": "# c49: a ruling on a behaviour covers every test that expects the old behaviour\n\nRepo: claude-settings. Mode: solo (three prose files and one record). Checked at 149f4bc.\n\n## Why\n\nOwner gripe, 2026-10-26. A session on another repo asked the owner a second time whether it may change\nan old test. The owner had already ruled the old behaviour out at 21:27 (a rule save must not clear the\npartly-sent mark). The session wrote: \"Your word covered one test. A failing test only changes on your\nword.\" A second test, and maybe three more, expected the same ruled-out behaviour.\n\nCause, two rules read together:\n- outcomes-tests-are-claims (a failing test is a claim, not law) and its 3-class sort in agents/builder.md\n  and agents/reviewer.md have no class for \"the owner already ruled this behaviour out\". The session put\n  the test in class (c), \"the rule may be stale\", which says STOP and wait for the owner's word.\n- outcomes-word-covers-named-act (my word covers the act it names, never a variant) was read as \"the word\n  named one test\", so each further test looked like a variant.\n\nThe rules are right about acts (a merge, a delete, a push). They are wrong about rulings: a ruling names a\nbehaviour, and a test that expects the old behaviour is only one route to it.\n\n## Change\n\n1. CLAUDE.md, rule outcomes-tests-are-claims: add one sentence. A test that expects a behaviour the owner\n   already ruled out is re-pointed, not asked about: cite the ruling and its time, show it red on the old\n   behaviour and green on the new.\n2. CLAUDE.md, rule outcomes-word-covers-named-act: add one sentence. A ruling on a behaviour covers every\n   test and code path that expects the old behaviour.\n3. agents/builder.md and agents/reviewer.md, the 3-class sort: add class (d), \"the owner already ruled\n   this behaviour out\". The builder reports the test change it needs (builders do not edit tests; a\n   test-author does), and cites the ruling. When one test of a ruled behaviour fails, find every test that\n   expects the same behaviour in one pass (search, then run them), and re-point them all in the same lane.\n   Report the list. The reviewer checks that each re-pointed test expects exactly the ruled-out behaviour,\n   and flags any that pins something next to it; that one goes back to class (c).\n4. Class (c) stays for a test whose behaviour has no ruling. It still asks the advisor first\n   (questions-ask-advisor-first).\n5. docs/records.md and lint/rule_mechanisms.json: keep their lines for the two rules true.\n\nKeep the CLAUDE.md word count flat or lower: rewrite in place, cut words elsewhere in the same two rules if\nneeded. Report the count before and after.\n\n## Done when\n\n- The rule audit and STE lints pass (`verdict` on the lint suite the repo's CI runs for CLAUDE.md and\n  agents/).\n- A reader can answer \"may I re-point the second test?\" from the text alone: yes, cite the 21:27 ruling.\n\nReport cap: 15 lines.\n", "updatedAt": "2026-10-26T03:05:00Z"}, "c5": {"note": "Done. #384 closed unmerged Oct 19; #455 and #456 merged Oct 20 (their content landed through #525, the map skill move); #457 closed unmerged Oct 20. Branch claude-p-fetch-key is kept, as you approved.", "order": 50, "phase": "cleanup", "status": "done", "title": "Close PRs #455 and #456, decide #384", "updatedAt": "2026-10-21T17:30:00Z", "why": "#457 replaces the two drafts. #384 has sat as a draft since Oct 13."}, "c50": {"title": "Deleting a hook script never breaks a session that is still running", "phase": "cleanup", "status": "todo", "order": 107.96, "why": "Goal-3 session report, Oct 25: deleting the two STE stub scripts (#575) broke Edit and Write in the goal session itself and in every agent it started, because that session began before #566 and still called ste_gate.py on every edit. The goal had to move to a fresh session mid-batch.", "note": "Filed by the advisor, Oct 26, from the report the owner pasted. The session checked installs on both machines before deleting, but not sessions still running; it said it would note this on the debt record (not checked whether it did). Likely risk: any hook delete hits it again. Brief not written yet; the text in Ask is the plan.", "ask": "Two parts. (1) Find the cause: a deleted script that a live session's hook list still calls breaks that session and every agent it starts (Edit and Write fail), until the session restarts. (2) Fix the cause in its one home, the installer or the hook wiring: either a hook entry fails open when its script is missing, or a deleted hook script leaves a stub for one more release, recorded with its delete date. Red case first: a settings.json that calls a missing script, and an Edit that must still pass. Advisor pick: fail open on a missing script, since it also covers a half-finished install.", "updatedAt": "2026-10-26T03:10:00Z"}, "c51": {"title": "One meaning for 'the advisor', and an advisor answer is shown to be real", "phase": "cleanup", "status": "todo", "order": 103.75, "why": "Your worry, Oct 26: the advisor setup is delicate, and your Mac sessions seem to report an advisor review that may not exist.", "note": "Checked at claude-settings 149f4bc5, Oct 26. Three things are called advisor: (1) Claude Code's built-in advisor, on through settings.json advisorModel: opus, a stronger model a session consults on its own (exact behaviour in the app not checked); (2) the terminal advisor, a session named advisor-xx started by start-advisor.ps1 from C:\\advisor, Windows only, no Mac launcher; (3) this cloud project, which answers only you. Rule questions-ask-advisor-first and the report label 'Decided by the advisor' mean (2) only, but nothing checks that a listed answer came from a real SendMessage to advisor-xx; and any session in a folder starting 'advisor' (such as a normal session opened in the advisor repo) gets an advisor- name and would be taken for it (known gap in decision advisor-answers-questions). On the Mac, (2) never runs, so a 'Decided by the advisor' item there likely came from (1) or was made up (unverified: no Mac report seen). Last live check of (2): Oct 23. Plan: first read one Mac report that cites the advisor; then (a) rename the label and rule to name only the advisor- session and say the built-in advisor is a second opinion, never a decision; (b) the report gate refuses a 'Decided by the advisor' item when the session sent no SendMessage to advisor-xx. Ruling needed from you on keeping (2) at all.", "ask": "No brief yet. Needs one Mac report that cites the advisor, then your pick on keeping the terminal advisor.", "updatedAt": "2026-10-26T03:20:00Z"}, "c6": {"note": "Done by the cull, measured Oct 19 at #513: lint/rule_mechanisms.json (99 rows) names a test for all six rules the cull ruling listed (the five above plus git-cite-by-id), each in hooks/test_guard.py. Their CLAUDE.md prose is cut to a short reminder plus a one-line reason (10-23 words each; roles-third-try-steps-up still 32). Not checked: whether a mutant targets each named case.", "order": 60, "phase": "cleanup", "status": "done", "title": "Write proving tests for five guard rules", "updatedAt": "2026-10-19T15:25:00Z", "why": "Their rows name no test, so their prose can't be deleted safely yet. Start with shared-trees-no-destructive-git."}, "c7": {"ask": "Brief, copied from briefs/c7-c24-c25-premises-batch.md and kept in step with it. Paste all of it to a claude-settings session. Covers c7, c24 and c25. Also attach plans/premise-handoffs-plan.md (project files).\n\nPremises batch, claude-settings. Roadmap: c7 (fix the reply-style conflict: one question reviewer), c24 (planners check their brief's premises), c25 (handoffs list premises with sources, evidence lives in its record). Attach plans/premise-handoffs-plan.md with this brief; it is the design, with file and line references checked at 73ed71a7. Re-check each reference against current main before editing, since other batches have merged since.\n\nOrder: after the guard-rule batch (c10, let the guard grow then cull what never fired; l1, rules that never fired show up) lands. Fixes and tests only; no measuring step.\n\nOwner's rulings, Oct 21 (all four open questions in the plan, answered A):\n1. Premises show inside the question box: one to three short \"Based on:\" lines in plain words, each with its source kind.\n2. Drop the code check for the Goal and Problem lines; the question reviewer judges form too.\n3. The question reviewer runs on Opus by a standing class-level word, recorded in decision subagent-model-cap (like the audit Explore word of 2026-10-21).\n4. Raw evidence lives inside the decision or debt that uses it, in an Evidence section of about 10 lines, deleted with that record. Add that one clause to decision cull-rules in place.\n\nLanes, as in the plan's section 5:\n1. Probe agent hooks first, alone. Report which of the plan's checks hold. If agent hooks do not work, stop and report before any other lane; the fallback (the session spawns the reviewer itself) costs about five processes per question on Windows and needs the owner's word.\n2 and 3. The premise section in the handoff and the premise format's one home (same files: one builder, or 3 after 2).\n4. The question reviewer: agents/question-reviewer.md with model opus pinned, one agent hook on AskUserQuestion.\n5. Delete the old judges (the AskUserQuestion prompt hook and hooks/question_outcome.py, with their tests, decisions and references). Needs 4 merged.\n6. The planner duty in agents/plan.md: premises first, checked against decisions/ and recent rulings. Can run beside 2 to 4.\n7. The evidence clause in cull-rules (wording only).\n8. Handoff cadence (owner's ruling, Oct 21). (a) The Stop nudges to rewrite the handoff move from fixed token counts (200k, 350k, 450k, precompact_handoff.py) to fractions of autoCompactWindow, about 40, 70 and 90 percent, so they still fire if the window is lowered. Test: with the window set to 250k, all three nudges fire; red on main. (b) hooks/precompact_handoff_prompt.md gains a rule: also update the handoff with a small edit when something happens (an owner ruling, a finished step, a test result that changes what fails); the token nudges stay as the backstop. Shares files with lane 2: same builder, or after it. (c) The PreCompact digest (precompact_handoff.py, state/handoff/<sid>.digest.md) keeps every owner message word for word, not only the last 60,000 characters, with long pastes cut to their first lines and marked as cut. Digest file only; nothing new loads into context. Test: an owner message from early in a long transcript is in the digest verbatim, and a long paste is cut; red on main.\n\nEach lane: a test red on main and green on the fix, as the plan lists. Record each ruling in place under decisions/.\n\nReport: per lane, what changed and the test that proves it; lane 1's findings in full; the net hook processes per question on Windows, before and after, counted from settings.json; and the four size numbers on main.", "note": "Draft in a separate advisor chat in this project; the starting prompt is in the topic 'Reusable prompts and snippets'. Include: one decision per question, and a question about how something looks says so and shows each option. One question judge only: today AskUserQuestion is judged twice (the prompt hook, and question_outcome.py, a claude -p child at xhigh, up to 90 s); the survivor is a dedicated read-only question-reviewer agent with model: opus pinned in its own file, like agents/plan.md (advisor pick, Oct 21), replacing both judges. Not a standing exception: 'Explore audit' is the same Explore agent plus an override a prompt judge polices, the pattern that refused your Opus audit on Oct 20 (c17). reviewer.md stays for code review. Your gripe, Oct 21: an outside advisor chat kept improving the questions working sessions asked (a false premise, 'the freeze stops me'; a third option that beat both). Causes: the session asks from inside its plan and lane, with a full context and without your newest rulings, and the question format favours filling options over doubting the premise. So: every question lists the facts it assumes, each with its source ('from notes' or 'measured in run X'); the judge gets a fresh context, the goal, the raw evidence and your recent rulings, and checks whether each premise holds and whether an option beats the listed ones. Model, advisor pick Oct 21: Opus, one call per question (pinned in the agent's own file, so the guard's Opus ceiling from c17 treats it as standing, like Plan). Building in the goal session (batch 6, premises batch). Probe, Oct 22: agent hooks work on Windows (allow or block, model pinned to Opus, 0 processes of their own), but a hook cannot name an agent file, and a hook agent's Read is refused unless settings.json allows Read. Advice sent Oct 22, not yet confirmed: rubric in the hook prompt (about 2 s a question; replaces both old judges, up to 29 processes and a claude -p child). The premise check against decisions/ moves to the outside advisor (c32), which has the fresh context and newest rulings this check was meant to give. No agents/question-reviewer.md file, and no Read allow. Goal session report, Oct 22: the Opus question reviewer, replacing both old judges, is built and reviewed, waiting for the next batch (batch 6). It drops the checks that need the chat (goal match, option fit, better option missing, already-settled questions) and the old loop breaker; already-settled questions are a debt until the advisor exists. The advisor now exists (c32), so that check can move to it. Question reviewer (one Opus question judge on AskUserQuestion) and the question premises landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25).", "order": 110, "phase": "cleanup", "status": "done", "title": "Fix the reply-style conflict", "updatedAt": "2026-10-25T19:45:00Z", "why": "Plain beats short when they clash; each option says how it works; options that can't be told apart mean fewer options or a decision made for you."}, "c8": {"ask": "Draft the sandbox settings and the test list for the Mac trial.", "note": "Oct 17: the sandbox runs on macOS, Linux and WSL2; on native Windows, Claude Code runs commands unsandboxed. Trial on the Mac only. No guard code retires from this step any more. Lower value than planned: worth an hour for real protection on the Mac, but no longer the hook-lines cut. Add failIfUnavailable to the settings.", "order": 450, "phase": "later", "status": "todo", "title": "Try the sandbox on your Mac", "updatedAt": "2026-10-21T17:30:00Z", "why": "The OS blocks writes outside the repo however a command is spelled. Since Windows stays native (Oct 17), this protects Mac sessions only, and the guard code it would have replaced stays for Windows."}, "c8b": {"ask": "Desktop WSL sessions load plugins now. Is moving Windows to WSL2 worth it, and what could we cut?", "note": "Decided Oct 17: Windows stays native. Desktop app WSL sessions don't load plugins, and losing your mods is a dealbreaker. Revisit only if desktop WSL sessions start loading plugins. Rechecked Oct 20 (code.claude.com/docs/en/desktop-wsl): still not available in WSL sessions: the integrated terminal, connectors and plugins, session forking, the file browser pane and @ file suggestions. No trial lane is needed until that changes.", "order": 85, "phase": "cleanup", "status": "done", "title": "Decide where Windows sessions run: native or WSL2", "updatedAt": "2026-10-20T18:18:00Z", "why": "On WSL2, Windows behaves like the Mac: the same shell, the same sandbox, one set of rules. Much of claude-settings exists to make native Windows behave (3,248 lines of PowerShell and .cmd; 61 of 126 decisions mention Windows, WSL or PowerShell). Moving opens a big cull. The cost: desktop app WSL sessions don't load plugins yet, so you'd run Claude Code from a WSL terminal, and repos move into the Linux filesystem."}, "c9": {"order": 460, "phase": "later", "status": "todo", "title": "Optional: fail a guard rule with no test", "updatedAt": "2026-10-21T17:30:00Z", "why": "One new rule_audit case keeps future prose deletions honest."}, "d1": {"ask": "Draft the designer agent definition and its write-scope guard, and decide: does the designer run /design itself, or do you run it and hand the canvas to the builder?", "note": "Route with one test: does the lane touch a screen? Needs a standing exception to the Sonnet ceiling, like the third builder try (fits c17, Opus on your word). Canvas: Claude Code's /design drafts the mockup as artboards on a Claude Design canvas, published as an artifact; /design-sync pulls the repo's design system in first, and a finished design hands back to Claude Code to build (needs v2.1.234 or later; the standalone claude.ai/design site closes Dec 14, 2026, the Design artifact type stays). Review: you select an element on the published mockup, comment and Send to Claude; the builder reads the threads before building. Comments need your Enterprise account with the artifact shared in the organization; on Max, use a copy-as-prompt button.", "order": 210, "phase": "design", "status": "todo", "title": "Add a designer agent", "updatedAt": "2026-10-21T17:30:00Z", "why": "Opus makes a mockup for every screen lane, so Sonnet builds to a picture of the target, and you comment on the exact element."}, "d2": {"note": "Keep Haiku for round-1 code review. With cost no limit, put design-review's reviewer on Opus: visual judgment is where the strongest model earns its cost. To prove the case, rerun a few past design-review screenshots through Haiku, Sonnet and Opus. Like d1, this needs a standing exception to 'Sonnet is the ceiling' (the subagent-model-cap guard), so write both exceptions as one ruling.", "order": 220, "phase": "design", "status": "todo", "title": "Add a design-reviewer agent", "updatedAt": "2026-10-17T18:03:00Z", "why": "Opus judges screenshots instead of Haiku. Design-review gates every screen change, solo mode too."}, "d3": {"note": "No separate ux-builder role: change builder.md's screen clause instead.", "order": 230, "phase": "design", "status": "todo", "title": "Builders build to the mockup", "updatedAt": "2026-10-17T17:30:00Z", "why": "Load frontend-design for every screen change, and unblock impeccable's polish and layout."}, "d4": {"order": 240, "phase": "design", "status": "todo", "title": "Redesign /board as the first test", "updatedAt": "2026-10-17T17:20:00Z", "why": "It was a proof of concept built from three plain elements. Mockup first, then rebuild with Svg for status and progress."}, "d5": {"note": "One-home rule (o11), revised Oct 20 by your ruling: only the ideas move into ux/ (spacing by relationship, the four jobs of motion, the icon rule). banchi keeps its own values and screens, and its docs point at ux/ for the ideas instead of restating them.", "order": 250, "phase": "design", "status": "todo", "title": "Promote banchi's design specs into ux/", "updatedAt": "2026-10-20T19:08:00Z", "why": "Spacing by relationship, the four jobs of motion, the icon rule, a named reference screen. Settle the 4px rule against banchi's 2, 3 and 6px steps."}, "d6": {"note": "The script is the check; the browser (the desktop app's pane or Chrome) is for exploring flows, menus and sheets. The desktop pane is allowed in your settings, but cloud sessions don't have it. Commands are in the reference topic 'Reusable prompts and snippets'. Oct 17 order ruling: build the shared script and its template in claude-settings here; adding it to each child repo and fixing banchi's 1280 viewport move to Roll out. One-home fix (o11, Oct 20): no copy of the script per repo. One shared scripts/shoot lives in claude-settings and installs like the hooks; each repo keeps only a small config (its URL, sizes, themes, simulator). Roll out then adds a config, not a script.", "order": 260, "phase": "design", "status": "todo", "title": "A screenshot command in every repo", "updatedAt": "2026-10-20T19:05:00Z", "why": "scripts/shoot with the Playwright CLI and simctl, so agents can look at what they built. Fix banchi's 1280 viewport."}, "d7": {"note": "Added Oct 20: container queries. A shared component (a card, a panel, a toolbar) adapts to the width of the box it sits in, not the screen, so the same component works in a sidebar and in the main column with no per-page copy (the one-home rule, o11). Use them inside reusable components; keep page-level layout on the layout primitives and a few screen breakpoints. Web only: the Swift side uses its own fit-to-space tools (ViewThatFits, size classes) for the same job. Limit: each container breakpoint is one more state to screenshot and test, so add one only where a component really changes shape.", "order": 255, "phase": "design", "status": "todo", "title": "Space with containers, not margins", "updatedAt": "2026-10-20T19:03:00Z", "why": "gap on parents, a few layout primitives, clamp() tokens for fluid spacing, and banchi's per-file ratchet. This is the direct fix for centering and gap problems."}, "d8": {"order": 270, "phase": "design", "status": "todo", "title": "Install a browser MCP for every session", "updatedAt": "2026-10-17T17:30:00Z", "why": "Playwright or Chrome DevTools MCP, set up globally, so any repo and any cloud session can render a page and look at it."}, "d9": {"ask": "Draft the visual-question rule: when a question counts as visual, what picture each option needs, and where the session publishes it.", "note": "From a home-app question on Oct 17 (TV keyboard: do the arrows hide while typing). The prose rule goes in with the reply-style edits; the pictures come from the designer step (d1), and session pages (o10) are where they'd sit. AskUserQuestion has a per-option preview field; whether it can show a real picture in your terminal and desktop app is unknown (not checked), so plan on a linked artifact.", "order": 216, "phase": "design", "status": "todo", "title": "Visual questions come with a pictur
