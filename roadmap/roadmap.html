 than 5 green runs; the merge tool warns at 70% of a cap; a timeout with every step green gets its own verdict, re-cap or split. #570 (Oct 24) set the Windows rest job to 38 minutes from 5 green runs. Not checked: whether the timing test passed its 20 runs under load.", "order": 111.65, "phase": "cleanup", "status": "done", "title": "CI time caps start generous and warn before they fire", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your gripe, Oct 23: CI that is new, or that just gained tests, keeps timing out and failing."}, "c4": {"note": "Done Oct 20: 28 remote heads left in claude-settings, main included (244 on Oct 17). Merges now delete the lane branches a batch absorbed (decision merge-deletes-batch-lanes, merge/merge.py cut_branch). Left over: branch batch-map, deleted in the next batch. q_max (1,017 heads) belongs to Roll out. Oct 26 at 149f4bc5: 34 remote heads; 7 old lane branches already merged into main remain (remove-ste-hooks, question-reviewer-hook, advisor-asks-first, planner-checks-premises, premise-handoff-section, rule-guard-grows, mem-monitor-tool-tests), so the merge cut misses some lanes (likely the ff and squash lane debts; cause unchecked). One-line delete by you or a lane in c46.", "order": 40, "phase": "cleanup", "status": "done", "title": "Delete merged remote branches", "updatedAt": "2026-10-26T02:58:00Z", "why": "188 of 244 remote branches in claude-settings are already merged. q_max has 1,017 remote heads. Then have each merge cut the lane branches its batch absorbed."}, "c40": {"title": "Idle desktop sessions each burn a full CPU core", "phase": "cleanup", "status": "todo", "order": 109.9, "why": "Session question, Oct 23 (goal 2 pace): the machine sat at 90-100% CPU with no work running, and the brake held every lane. Same pattern as the 15 spinning claude.exe workers of Oct 19 (c14).", "note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (yours to handle).\nMeasured by the advisor, Oct 23 02:30 CDT, read-only: 37 claude.exe processes; 17 use about 1.0-1.1 cores each over 5 s (19 of 24 cores, CPU 93%, memory 72% of 63.5 GB). All 17 are Claude Desktop 3.1623.0.0 children running claude-code 2.1.304 with --resume, children conhost only (one also keeps a bash wait loop from Oct 22 12:35 polling a temp file). Their transcripts last changed Oct 19-22, mostly Oct 21 ~15:30 (q-max 8, 77-rollover 2, claude-settings 2, others 1 each); one (q-max 3a3eb243) wrote at 01:48 today, and one has no --resume, so those two may not be idle (unknown). None runs a claude-settings hook. Not checked: whether this is a known upstream bug, and why they spin (unknown). Not fixable in claude-settings; the brake already reads it right. Open for you: (1) archive or stop the idle sessions in the app (frees about 17 cores; loses their in-memory state, transcripts stay); (2) report it to Anthropic with the version numbers above; (3) whether claude-settings should add a read-only 'idle sessions burning CPU' line to the health view, so you see it without a session asking. Owner, Oct 26: advisors leave this step alone; the owner handles idle desktop sessions. Placed last in Cleanup (triage, Oct 26): yours to handle, no advisor work.", "ask": "Owner action, no brief yet: archive or stop the idle Claude Desktop sessions listed in the note, then report the spin upstream (Claude Desktop 3.1623.0.0, claude-code 2.1.304, Windows 11 26200). A health-view line is a later lane only if you want it.", "updatedAt": "2026-10-26T06:00:00Z"}, "c41": {"title": "Opus for one session or one run, without lifting other guards", "phase": "cleanup", "status": "todo", "order": 109.4, "why": "Your question, Oct 25: can override say 'Opus builders for this part of the plan or this session'? Today it cannot without lifting every other guard too.", "note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (the Opus-only pass is an advisor pick, not ruled).\nChecked at claude-settings f463787. Built today: (1) every Opus spawn that Plan, Explore or a builder's try 3 does not cover asks you, one prompt per spawn (guard rule subagent-model-cap, #562). (2) override 15m or override 2h lifts every refusal and ask in the session, Opus included, and reaches subagents; too broad, since it lifts all other guards too. (3) A repo grant: CLAUDE_CODE_SUBAGENT_MODEL set to opus in .claude/settings.local.json with a deadline at most 24 h out (decision opus-grant-expires); raises every spawn in that repo, needs a fresh session, and the write itself asks. Not built: a grant scoped to Opus only, for one session and a time. Advisor pick, Oct 25, not ruled: a second prompt word in the override pass's one home (hooks/override_pass.py), such as 'opus 2h' or 'opus builders 2h', that lifts only subagent-model-cap asks (optionally one role) for this session and its subagents until it expires. 'This part of the plan' is not checkable by a hook; session plus time is. Your word, Oct 25: keep it on the roadmap; brief it when its turn comes. Placed after the Mac steps c27 and c23 (triage, Oct 26): deferred; same family as c54 (who gets Opus).", "ask": "", "updatedAt": "2026-10-26T06:00:00Z"}, "c42": {"title": "home-app: the merge tool finds its checks, and a skipped draft run is restarted the right way", "phase": "cleanup", "status": "todo", "order": 109.5, "why": "home-app session report, Oct 25 (PR 271): the PR's own checks had skipped, so it pushed an empty commit (345ff43) to start a run; and the merge tool stopped because home-app's main has no branch protection, so it found no required checks.", "note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (home-app work; you settle the plan first).\nChecked Oct 25 (claude-settings f463787, home-app 65315da). Cause 1: home-app test.yml skips the scope job, and so every job, on a draft PR (home-app rule: drafts run no CI). The manual workflow_dispatch run that passed does not count as the PR's checks. Marking the PR ready (ready_for_review is a trigger) starts a real run on the same head, with no new commit. Cause 2: merge.py reads required checks from .github/stamp.json merge.requiredChecks first and only falls back to branch protection; home-app has no stamp.json. The tool's own stop message names the fix. Not a new gap in claude-settings: no rule there forbids an empty commit to start CI (low harm: one noise commit). Advisor pick: fix in home-app (stamp.json plus one CLAUDE.md line); branch protection on home-app main is optional and needs your login. Same fix fits banchi and q_max if they lack stamp.json (not checked). Related: c33 (home has no CI at all). Placed after the Mac steps (triage, Oct 26): the fix lands in home-app, so it needs a check-in with you first.", "ask": "Brief for a home-app session (paste all of it):\n\nGoal: the claude-settings merge tool runs in home-app, and a PR whose draft run skipped gets a real run without an empty commit.\n1. Add .github/stamp.json with merge.requiredChecks naming the jobs in .github/workflows/test.yml: scope, test, addon, ios. Copy the shape from claude-settings .github/stamp.json. Set merge.deadlineMinutes to the largest job timeout-minutes plus 5. The merge tool already passes a skipped job, and goes red only when no job ran on the head (merge/merge.py judge_runs).\n2. Proof: run the merge tool's dry read on an open PR (or the next one) and show it lists the four checks instead of stopping on \"no branch protection\".\n3. Add one line to home-app CLAUDE.md's CI rule: when a PR's run skipped because it was a draft, mark it ready (gh pr ready), which starts the PR run on the same head; never push an empty commit to start CI.\nReport: Done, Deviations, Input Needed, Next.", "updatedAt": "2026-10-26T06:00:00Z"}, "c43": {"ask": "Brief, copied from briefs/c43-watcher-debt-file.md and kept in step with it. Send to a cloud build thread.\n\n# c43 remainder: file the dropped-lane debt\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b. Solo, records only.\n\nLane 2 of c43 (a SubagentStop check that blocks an agent reporting with a live watcher) was dropped\nby shiv on Oct 26: its try blocked 248 of 1,787 real stops by mistake. Its code sits on branch\nstop-blocks-live-tasks (b8feeb52). Lane 1 landed in #574 (agents stop their watchers before they\nreport).\n\nTask: write one debt in claude-settings debts/, in the store's own format (read debts/README.md and\ntwo existing debts first). Slug: agent-reports-with-live-watcher. Content: the gap (no check stops an\nagent that reports with a live watcher), the dropped try and its false-block count, the branch, and\nthe Retire line: reopen as a check only if leftover watchers keep waking parents. Point it to\ndecision agents-stop-their-watchers if one exists (git grep). Update any index the store keeps\n(docs/records.md is rebuilt at merge; do not hand-edit it unless the store says so).\n\nBase: main. One commit, PR stops at green; merge waits for c53 or shiv's merge.py run.\nReport: 10 lines max, with the PR.\n", "note": "Done in part. Lane 1 landed in #574 (checked at 149f4bc): each agent file tells agents to stop their tasks before they report. Lane 2, a SubagentStop check, dropped by your word, Oct 26: its try blocked 248 of 1,787 real stops by mistake; it sits on branch stop-blocks-live-tasks (b8feeb52). Debt to file: no check stops an agent that reports with a live watcher; reopen if leftover watchers keep waking parents. Not in the claude-settings debt store (checked Oct 26). Left, Oct 26: the dropped lane 2 is recorded as a debt only on the roadmap, not in claude-settings debts/. One debt file joins batch 1 as a small records lane (build advisor, Oct 26). Placed ahead of c57 (triage, Oct 26): batch 1, and it closes this step.", "order": 103.92, "phase": "cleanup", "status": "todo", "title": "Agents stop their watchers before they report", "updatedAt": "2026-10-26T05:30:00Z", "why": "Degen orchestrator, Oct 25: a reviewer woke 4 times after its final report, each time on a watcher that expired on a build long finished; each wake is a fresh notification to the parent."}, "c44": {"title": "Merged work leaves no worktrees or branches behind, and a wrapping session offers the fast cleanup", "phase": "cleanup", "status": "todo", "order": 103.7, "why": "Your idea, Oct 25: when a session thinks its work is wrapped, it should offer you a faster worktree cleanup than the scheduled ones.", "note": "Checked at claude-settings f463787. Today cleanup runs on its own at agent end (finished agent tree, 30 idle min), session end and a daily job (merged tree 1 h, agent tree 4 h, pushed unmerged tree 24 h); a dirty or unpushed tree is never removed. A fast path exists (janitor/sweep.py --attended --fast, preview then --confirm), but no rule offers it. Gaps found by the Mac session, Oct 25: the merge tool deletes the remote branch but keeps the local branch and its worktree; the Agent tool locks a builder's tree with the host session's pid, so the sweep keeps it until the session ends; the guard's remedy for a deletions-only tree left a throwaway branch (discard-a4f61ca) to delete by hand. Same pile-up as debt finished-agent-shells-keep-tree (owner ruled Oct 15: stop a finished agent's shells so its tree can go; not built, not yet in the brief). Your word, Oct 25 ('agreed'): the merge tool runs the --fast removal for its own branch's clean tree; the sweep may free a lock held by the calling session's own pid on a finished agent's clean, merged tree; one report sentence offers the cleanup command. Unknown: whether 'the merge tool never removes worktrees' has a recorded reason; the brief checks first. Brief: briefs/c44-merged-work-cleans-up.md (text in this Ask). Order: cloud part in batch 1, after c53; the local confirm stays a brief.", "ask": "Cloud brief, copied from briefs/c44-cloud.md; send to a cloud build thread.\n\n# c44 in the cloud: merged work leaves no worktrees behind\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b. Full step text:\nbriefs/c44-merged-work-cleans-up.md (lanes 1 to 3, first check, proof). Its \"paste into a Windows\nsession\" line no longer applies: build in the cloud, prove with fixture tests; shiv confirms on his\nmachines after merge.\n\n## Order and bases\n\n- Lanes 2 and 3 first (janitor/sweep.py lock rule; one sentence in the reports rule's home).\n  Base: main.\n- Lane 1 (merge/merge.py cleans its own worktree) edits merge.py, as do PR #577 (the pilot) and the\n  c53 thread (merge.py on REST). Build lane 1 last, stacked on the c53 branch once it is pushed\n  (ask the build advisor for its name), and say so in the PR body. If c53 has not pushed when lanes\n  2 and 3 are done, open the PR with lanes 2 and 3 only and report lane 1 as waiting.\n\n## First check\n\nAs the full brief says: if \"the merge tool never removes worktrees\" has a recorded reason, send it\nto the build advisor before building lane 1.\n\n## Roles\n\nOrchestrate: test-author, builder, fresh reviewer (it changes what a deletion tool removes). PR stops\nat green. Report: 25 lines max, Done, Deviations, Input Needed, Next.\n\n\n---\nEarlier brief kept for reference:\n\n# c44. Merged work leaves no worktrees or branches behind\n\nPaste this whole file into a claude-settings session (Windows; the Mac holds main only). Written by\nthe advisor, Oct 26, against main f463787. Owner agreed Oct 25.\n\n## Why\n\nMac session, Oct 25: after the ios-ship and guard-cull PRs merged, their worktrees and local\nbranches stayed. The merge tool deletes the remote branch, keeps a local branch a worktree has\nchecked out, and never removes worktrees. The Agent tool locks a builder's worktree with the host\nsession's pid, and the sweep frees such a lock only when that pid is dead, so a merged tree waits\nfor the session to end. Cleaning by hand cost several guard refusals and left a throwaway branch\nthe owner had to delete.\n\n## First check\n\nRead decisions when-a-worktree-may-be-removed and the-janitor-is-one-machine-wide-sweep, and the\nmerge tool's docstring. If \"the merge tool never removes worktrees\" has a recorded reason, bring it\nto the advisor with this brief's lanes before building (rule outcomes-stale-decision-protocol).\n\n## Lane 1, the merge tool cleans its own branch\n\nAfter a merge succeeds, the merge tool removes the merged branch's worktree when it is clean and its\nHEAD is in the default branch, by calling the sweep's existing --fast removal for that one tree (one\nhome; no second removal path). Then it deletes the local branch, as it does today when no worktree\nholds it. A dirty tree, an unmerged HEAD, the caller's own cwd, or any unread fact keeps the tree and\nprints one line saying why.\n\n## Lane 2, the sweep frees the caller's own lock on a finished agent's tree\n\nThe sweep may free an Agent-tool lock whose pid is the calling session's own process, only when the\ntree is clean, its HEAD is in the default branch, and no live process stands in it. Every other lock\nstays as today.\n\n## Lane 3, the offer\n\nOne sentence in the reports rule's home: when a session's last PR has merged and no lane is open, its\nfinal report offers `python3 ~/.claude/janitor/sweep.py --root <repo> --attended --fast` (preview, then\n--confirm) as one command, unless lanes 1 and 2 left nothing to remove.\n\n## Proof\n\ntest-author, red on main: a merged clean worktree survives a merge today and is gone after lane 1;\na dirty one and an unmerged one stay; a tree locked by the caller's own pid, clean and merged, is\nfreed by lane 2, and one locked by another live pid stays. Builder makes them green. A reviewer reads\nthe diff (it changes what a deletion tool removes). Usual merge rules.\n", "updatedAt": "2026-10-26T05:30:00Z"}, "c45": {"ask": "# c45, a step handed to you names the check that proved the session can't do it\n\nRepo: claude-settings. Checked at 149f4bc (main, Oct 25 19:16 CDT).\n\nIncident, Oct 25 (ios-adblock): the session's report listed \"delete the two test App IDs on developer.apple.com\" under Input Needed. It never checked its tools. The App Store Connect key that created the IDs was on the Mac and could delete them. When asked, it then said the step \"needs your login\", also unchecked. The owner had to point it out twice. Rule output-never-hand-off-doable-step (do a step yourself before you hand it to me) already says to search first and name the reason, but nothing checks the doability half: the reply judge (hooks/reply_judge.py) only checks the code-block form, and only on 1 Stop in 5.\n\nTask, two parts, one lane:\n\n1. Amend output-never-hand-off-doable-step in output-styles/shiv-stylisms.md, in place, no new rule. Add:\n   - Each step handed to the owner names its reason (decision, login, or an act the safety rules keep for the owner) and the check that shows the session cannot do it, in a few words, such as \"no API key for Apple in env or keychain\". With no check run, the step is not the owner's yet: run the check first.\n   - Access that made a thing can remove it. A thing the session made, it cleans up itself.\n   - \"Can't\" and \"shouldn't\" differ. A step the session can do but that cannot be undone is not handed over as steps: the session asks one yes or no on the exact act, and does it on the yes.\n   - A plan that makes throwaway things (test IDs, test branches, test data) names their cleanup in the same ask, so the owner's yes covers both (outcomes-word-covers-named-act, my word covers the act it names).\n2. Extend hooks/reply_judge.py, the one home, no new hook:\n   - Add to INSTRUCTIONS: each item under Input Needed names its reason and the check that showed the session cannot do it; flag an item that names neither.\n   - Judge every Stop whose reply carries an \"Input Needed\" label, besides the 1-in-5 sample. Detect the label in code (a string match on the label), not by the model. This changes the owner ruling of 2026-10-13 in decision reply-judge-samples-never-blocks; rewrite that entry in place with the new ruling and its cost: one extra model call per report that carries Input Needed, no new file, no new process, no timer.\n   - Still never blocks, still fails open.\n\n3. Each finding the judge passes on also writes one line to guard.log, the existing log (rule id, session, Stop number). No new file. Named reader: the advisor at each cull, who counts flags against owner-confirmed misses and false alarms, to rule whether the judge stays, widens or goes. Today it keeps no record, so its value is unmeasured.\n\nRecord: the incident above is the named incident (building-guard-needs-incident). Update lint/rule_mechanisms.json reason for output-never-hand-off-doable-step to say the judge now also checks reason and check, on every Input Needed report.\n\nProof (test-author first, red on main):\n- A reply with \"Input Needed: delete the two test App IDs on developer.apple.com\" and no reason is judged even when it is not a 1-in-5 Stop (counter test, no model needed: stub invoke_model and assert it was called).\n- A reply with no Input Needed and a non-sample Stop is not judged.\n- The prompt text carries the new clause (string check).\n- A model run on the two sample replies (no reason vs. \"needs your login: no App Store Connect key in env or keychain\") flags the first and passes the second; record the run, it is not a CI test.\n\nReport cap: 15 lines.\n", "note": "Checked at claude-settings 149f4bc. Rule output-never-hand-off-doable-step (do a step yourself before you hand it to me) in output-styles/shiv-stylisms.md says search first and name the reason; nothing checks it. The reply judge (hooks/reply_judge.py, Haiku) checks only that a command comes as a runnable block, on 1 Stop in 5, and records nothing it flags, so its value is unmeasured. c28 fixed the form, not this. Fix, one lane: (1) amend the rule in place (name the reason and the check; clean up what you made; can't versus shouldn't; a plan that makes throwaway things names their cleanup); (2) the judge checks every report with Input Needed, which changes your Oct 13 ruling (judge 1 Stop in 5, for cost and latency) and needs your word; (3) each flag writes one line to guard.log, read at each cull. Advisor pick, Oct 26: all in one lane. Placed ahead of c51 (triage, Oct 26): the build advisor runs it as a cloud build thread in parallel with c53, from #578's branch (retire the terminal advisor route; same two files), rebased onto main after #578 merges.", "order": 103.4, "phase": "cleanup", "status": "todo", "title": "A step handed to you says what check showed the session can't do it", "updatedAt": "2026-10-26T05:35:00Z", "why": "Your gripe, Oct 25: the ios-adblock session asked you to delete two test App IDs on developer.apple.com when its own App Store Connect key could do it, and then said it needed your login, even though the rules say to check first."}, "c46": {"title": "Lanes start only in the tool's own worktrees, and a dropped lane keeps its branch", "phase": "cleanup", "status": "active", "order": 103.8, "why": "Parallel-work review, Oct 26 (your ask): two owner rulings on parallel lanes are recorded in claude-settings debts but never built, and neither is on the roadmap.", "note": "Checked at claude-settings 149f4bc5 (main, Oct 26). (1) Debt agents-write-main-clone: Oct 20, after the tool's worktree isolation failed at 100% CPU, an orchestrator made lane trees by hand and two agents wrote into the main clone. Your ruling, Oct 21: block the workaround fully and record which layer refused isolation. Not built: no check in hooks/guard.py. (2) Debt merge-deletes-dropped-lane: batch #564 lost five dropped lanes' branches on Oct 23, restored by hand. Not built. Four smaller merge-tool lane debts stay notes. Brief written, not sent: briefs/c46-lanes-stay-in-their-trees.md (text in this Ask). Oct 26: lane 2 is the c52 pilot, built by a cloud build thread from briefs/c46-pilot-merge-keeps-dropped-lane.md (text in this Ask). Order (build advisor, Oct 26): lane 1 is in batch 1, after c53. Oct 26: pilot PR #577 (merge keeps a lane branch whose merge the batch reverted) is ready, CI running; it stops at green until the merge path is picked (c53). Lane 2 done: pilot #577 merged Oct 26 05:19 UTC (bf084dfd), by hand by you as a one-off. Lane 1 is a cloud build thread (briefs/c46-lane1-cloud.md).", "ask": "Lane 1 cloud brief, copied from briefs/c46-lane1-cloud.md; send to a cloud build thread.\n\n# c46 lane 1: refuse a hand-made lane worktree\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b. Lane 2 is the\npilot, PR #577; this is lane 1 only. Full step text: briefs/c46-lanes-stay-in-their-trees.md.\n\n## Incident and ruling\n\nOct 20: an orchestrator whose `isolation: 'worktree'` failed made lane trees by hand and spawned\nagents without isolation; two agents wrote into the main clone. Owner ruling, Oct 21 (debt\nagents-write-main-clone): block the workaround fully, and record which layer refused isolation.\n\n## Task\n\n1. Block: hooks/guard.py refuses the workaround, so a writing lane starts only through the tool's\n   own isolation. Find the cheapest reliable predicate (an Agent or Task call with no isolation\n   whose brief names a worktree path outside .claude/worktrees/, or `git worktree add` into a\n   scratchpad from an orchestrator). Read the act, not a guess from location (decision\n   predicate-is-the-act). Add rows to hooks/test_guard.py and mutants to hooks/mutate_guard.py.\n2. Diagnose: when isolation is refused, the guard's existing refusal line names which layer\n   refused (harness or guard) and its message.\n3. Retire the debt per its Retire line.\n\n## Failure classes\n\n- False alarm: a read-only Explore spawn with no isolation, or a brief that only mentions a\n  worktree path, must pass. A guard that cries wolf is spent.\n- Bypass: other spellings of the same act (relative paths, Windows paths, PowerShell). Only forms\n  Claude could write by mistake count (guard-guards-mistakes-only).\n- Cloud note: claude-settings hooks are not installed here, so prove it with the guard's own test\n  suite and mutation harness, not a live hook.\n\n## Roles\n\nOrchestrate: test-author, builder, fresh reviewer (it changes a guard). Base: main. PR stops at green.\n\n## Report (25 lines max)\n\nDone, Deviations, Input Needed, Next. The predicate chosen, red then green rows, mutants killed.\n\n\n---\nEarlier brief kept for reference:\n\n# Pilot: the merge tool keeps a dropped lane's branch (c46, lane 2)\n\nFor a build thread in the Claude Settings Audit project (cloud). Written by the advisor thread,\nOct 26, against claude-settings main 149f4bc5. This is the pilot for c52 (this project builds\nthe portable claude-settings backlog as PRs). Owner rulings, Oct 26: this project may push\nclaude-settings branches and open PRs; it holds the standing merge grant\n(decision standing-merge-grant); the advisor thread answers your questions.\n\n## The defect\n\nDebt merge-deletes-dropped-lane. After a batch merges, merge/merge.py (cut_lanes, line ~1023;\nlane_tips, line ~1009) deletes the remote branch of every lane merged into the batch, including\na lane the batch later reverted. Batch #564 lost five such branches on Oct 23; they were restored\nby hand. A dropped lane needs its branch to rejoin.\n\n## The work\n\n1. Test first: in merge/test_merge.py, a fixture batch with one lane merged and then reverted on\n   the batch. After the merge, that lane's branch still exists. Show it red on main.\n2. Build: cut_lanes keeps a lane whose merge into the batch was reverted on the batch. Green.\n   The four other merge-tool lane debts (ff-first-lane-not-a-tip, squash-lane-branch-kept,\n   lane-cycle-delete-order, long-lived-head-lost-in-batch) stay as they are unless the same edit\n   fixes one for free; say which.\n3. Retire the debt per its Retire line. Do not edit docs/records.md (records-index-at-merge).\n4. A fresh reviewer subagent that never saw the build reads the diff (it changes program logic).\n   Up to three rounds (roles-review-cap-three).\n5. Open the PR, ready, and watch CI (Linux, Mac, Windows) to green.\n\n## Cloud notes\n\n- claude-settings hooks are not installed here, so no guard runs. Follow the CLAUDE.md rules by\n  hand. `verdict` may be missing: run the test file directly and give the verdict only.\n- The merge is part of the pilot. Check first whether `gh` is logged in here (`gh auth status`).\n  In the advisor thread's container it is not. If `gh` works, merge with\n  `python merge/merge.py <PR>`. If it does not, do NOT merge with the GitHub button: a button\n  merge skips the records page rebuild, the record-number claim and the branch cleanup, and the\n  records page on main would go stale. Stop at a green PR and report what blocked the merge.\n\n## Report\n\nDone, Deviations, Input Needed, Next, plus the four pace numbers. Also list each claude-settings\nrule that did not fit a cloud thread, and why; each becomes a note on c52.\n\n\n---\n\nLane 1 (refuse a hand-made lane worktree) and the original two-lane brief: briefs/c46-lanes-stay-in-their-trees.md.", "updatedAt": "2026-10-26T05:35:00Z"}, "c47": {"ask": "# c47. One account file for iOS shipping, and no wrapper scripts in the app repos\n\nWritten by the advisor, Oct 26. Owner agreed Oct 26. Checked against claude-settings 149f4bc, home-app 0a3419b,\nios-adblock b3d5eb6, degen e2635ca. Two parts, in this order: part 1 in claude-settings, then\npart 2 in each app repo after part 1 merges and the Mac has reinstalled.\nPart 1 can run in a cloud build thread: its tests stub xcodebuild, and the shell-macos CI job is the\nmacOS proof. Part 2 needs the Mac: it writes ~/.config/ios-ship/account.json and runs real builds in\nhome-app, ios-adblock and degen.\n\n## Why\n\n`bin/ios-ship` (one shared tool that ships iOS apps) landed Oct 25 (decision\nios-ship-is-one-shared-tool). The build and upload logic now has one home. Two copies remain in\neach of the three app repos (home-app, ios-adblock, degen):\n\n1. The account block. `team_id`, `asc_key_id`, `asc_issuer_id`, `asc_key_path` and\n   `device_udid` are the same in all three `tools/ios-ship.json` files. A new phone or a key\n   rotation means three edits. They cannot move into claude-settings: it is public.\n2. The wrappers `tools/testflight` (home-app: `testflight.sh`) and `tools/reinstall-phone-apps`.\n   They only find the config and call ios-ship, and they have already drifted: home-app reads\n   `APPS=` and `DRY=`; ios-adblock refuses the old `PHONE_APPS_JSON` and has its own test;\n   degen passes arguments only. File names differ too.\n\nRule: one home, then variants (owner, Oct 20): a shared script lives in claude-settings; a repo\nkeeps only what differs.\n\n## Part 1, claude-settings: ios-ship reads one account file and finds the repo's config\n\n1. Account file. ios-ship reads account values from `~/.config/ios-ship/account.json` (keys as\n   today: `team_id`, `device_udid`, `asc_key_path`, `asc_key_id`, `asc_issuer_id`). Order: env,\n   then the repo config, then the account file. A repo config may still set a key, as a variant.\n   A key unset in all three refuses and names both files and the env var. The file lives only on\n   the Mac. No ID goes in this repo: fake IDs in tests only.\n2. Default config. `CONFIG` becomes optional. With none given, ios-ship uses\n   `<git toplevel of the current folder>/tools/ios-ship.json`. Outside a git repo, or with no such\n   file: exit 2 with one line. The usage line and header comment change to match.\n3. Old variable. `install` refuses when `PHONE_APPS_JSON` is set (exit 2; message names `--app`\n   and `tools/ios-ship.json`), so the ios-adblock wrapper's refusal can go.\n4. Rewrite decision ios-ship-is-one-shared-tool in place and README \"Shipping iOS apps\": where the\n   account file lives, what a repo config holds (apps, `repo_url`, overrides), how to call it\n   (`ios-ship testflight` from inside the repo).\n\nProof, test-author first, red on main, in lint/test_ios_ship.sh (the `shell-macos` job):\n- account file only: values resolve; repo config key wins over the account file; env wins over both.\n- key unset everywhere: refusal names both files.\n- no CONFIG inside a repo with tools/ios-ship.json: same calls as passing it; outside a repo: exit 2.\n- `PHONE_APPS_JSON` set on install: exit 2, xcodebuild stub never called.\n\nProgram logic: a fresh reviewer reads the diff (roles-solo-reviews-logic-diffs-only).\n\n## Part 2, each app repo (home-app, ios-adblock, degen), after part 1 is live on the Mac\n\n1. Once, on the Mac: write `~/.config/ios-ship/account.json` from the values in any one repo\n   config (they match). Do not print them.\n2. Remove the five account keys from `tools/ios-ship.json`. Keep `apps` and `repo_url`.\n3. Delete both wrappers. Point every caller at `ios-ship testflight` / `ios-ship install`:\n   degen `Makefile` target `testflight`; home-app `SPEC.md` how-to and its `make testflight`;\n   ios-adblock installer docs. ios-adblock: delete tests/test_reinstall_wrapper.sh (it tests the\n   wrapper; part 1 moves its case into ios-ship's suite).\n4. Proof: `ios-ship install --no-install` from the repo root builds each app (no phone needed),\n   and `ios-ship testflight --export-only` archives. Record both verdicts. home-app: its merge grant\n   covers this PR; the others need the owner's word to merge.\n\nNot in scope: the vendored design skills (filed under o11, one home for each shared thing).\n\nReport cap: 15 lines per part.\n", "note": "Checked Oct 26 at claude-settings 149f4bc, home-app 0a3419b, ios-adblock b3d5eb6, degen e2635ca. The logic has one home, bin/ios-ship (Oct 25, decision ios-ship-is-one-shared-tool). Still copied: the account block (team, key, issuer, key path, phone), identical in all three tools/ios-ship.json and barred from claude-settings, which is public; and two thin wrappers per repo, already drifted. The per-repo app list is a right variant and stays. Your word, Oct 26: one account file, ~/.config/ios-ship/account.json, under env and repo overrides; ios-ship finds the repo's config itself; wrappers deleted. Brief: briefs/c47-ios-ship-one-account-no-wrappers.md (text in Ask). Part 1, claude-settings: a cloud build thread (tests stub xcodebuild; the shell-macos CI job is the macOS proof). Part 2, each app repo: needs the Mac. Placed ahead of c54 and c48 (triage, Oct 26): part 1 joins batch 1; c48 waits on it, since both edit bin/ios-ship.", "order": 103.9, "phase": "cleanup", "status": "todo", "title": "iOS shipping keeps one account file, and app repos keep only their app list", "updatedAt": "2026-10-26T05:35:00Z", "why": "Your question, Oct 26: why do testflight and reinstall-phone-apps sit in three repos (home-app, ios-adblock, degen) instead of claude-settings?"}, "c48": {"title": "Phone profiling waits until the phone is free", "phase": "cleanup", "status": "todo", "order": 104.1, "why": "Your question, Oct 26: where should the Oct 25 lesson live (xctrace record on Shivinate XIII timed out 'waiting for device to boot' until devicectl ddiServices ran)? claude-settings, ios-ship, or the Degen repo only?", "note": "Checked Oct 26 at claude-settings 149f4bc: ios-ship has testflight and install, no profile job; nothing calls xctrace. Live test on the Mac, Oct 26 (Xcode 27.1, iOS 27.1, network transport): recording 2, 17 s after recording 1, failed 'Timed out waiting for device to boot' with the DDI still mounted, while devicectl showed the phone 'connected', not 'available (paired)'; 5 min later recording 3 passed. So the DDI is not the cause; the phone stays held for a while after a recording. Known intermittent xctrace failure since Xcode 13 (developer.apple.com/forums/thread/694698). Unmeasured: how long the hold lasts (17 s to 5 min), and whether a wired or other phone behaves the same. Your word, Oct 26: test first, then an ios-ship 'profile' job: wait for 'available (paired)' (capped, then exit 75), record by UDID, retry once on 'Waiting for device to boot'. Not a hook or a rule. After c47 part 1 (both edit bin/ios-ship). Brief: briefs/c48-ios-ship-profile-job.md (text in this Ask); part 0 measures the wait before any code. Placed after c47 (triage, Oct 26): runs once c47 part 1 merges, so the profile job can use the account file.", "ask": "# c48. ios-ship gets a profile job that waits until the phone is free\n\nWritten by the advisor, Oct 26. Owner agreed Oct 26 (\"maybe at that time it needs more testing\").\nChecked against claude-settings 149f4bc. Start after c47 part 1 merges (both edit bin/ios-ship).\nThree parts, in this order: measure, build, record.\n\n## Why\n\n`xcrun xctrace record --device <UDID>` fails with \"Waiting for device to boot\" and then\n\"Timed out waiting for device to boot\" (exit 13) on a network-paired iPhone. Live test, Oct 26\n22:30-22:38 CDT (Xcode 27.1 27A9275, macOS 27.0, iOS 27.1, network transport):\n- The developer disk image (DDI) was mounted and usable the whole time. It is not the cause, so\n  `devicectl device info ddiServices` is not the fix.\n- Recording 1 passed. Recording 2, about 17 s after recording 1 ended, failed. devicectl then\n  showed the phone as `connected`, not `available (paired)`.\n- 5 min later the phone was `available (paired)` again, and recording 3 passed.\nKnown elsewhere: developer.apple.com/forums/thread/694698 (since Xcode 13);\ngithub.com/seedds/nxnative/issues/142 (iOS 27). The failure comes before the app launches, so it\nholds for every app, not one repo.\n\n## Part 0, measure first (on the Mac, phone awake; no code change)\n\nUnmeasured: how long the phone stays busy (17 s to 5 min), and whether the device state is a\nreliable signal. Run 3 rounds by UDID: record 10 s; then poll `xcrun devicectl list devices`\nevery 10 s, and record the time the phone shows `available (paired)` again; record again at once.\nReport per round: seconds until `available`, and whether the next recording passed. If a\nrecording fails while the phone shows `available`, stop and report: the wait signal is wrong and\npart 1 needs a new design (ask the owner). Also try once with a cable, if one is at hand; say if not.\n\n## Part 1, claude-settings: `ios-ship profile`\n\n1. New job: `ios-ship profile [CONFIG] --app NAME [--template T] [--time-limit S] [--output P]`.\n   Defaults: `Time Profiler`, 20 s, a printed path under `$TMPDIR`. Bundle id and UDID come from\n   the config and account file as for `install` (c47). One app per run.\n2. Before recording: poll `devicectl list devices` until the phone shows `available (paired)`.\n   Cap: twice the longest wait part 0 measured, at least 60 s. Past the cap: exit 75 (the\n   existing \"phone not reachable\" code) with one line naming the state seen.\n3. Record by UDID, never by name: `xctrace record --template T --device <UDID> --time-limit S\n   --output P --launch -- <bundle id>`, through the existing `step` timeout.\n4. If the output holds \"Waiting for device to boot\": wait for `available` again (same cap) and\n   retry once. A second failure exits with xctrace's code and the log path.\n5. Header comment, usage line, README \"Shipping iOS apps\" and decision ios-ship-is-one-shared-tool:\n   rewrite in place to name the third job and why it waits.\n\nProof, test-author first, red on main, in lint/test_ios_ship.sh (the `shell-macos` job), with\nstubbed `xcrun`:\n- phone `connected` then `available`: one xctrace call, after the state turns.\n- phone never `available`: exit 75, no xctrace call.\n- first xctrace prints \"Waiting for device to boot\", second passes: exactly two calls, exit 0.\n- both fail: two calls, xctrace's exit code.\n- the xctrace call carries the UDID, never a device name.\n\nProgram logic: a fresh reviewer reads the diff (roles-solo-reviews-logic-diffs-only).\n\n## Part 2, live check (on the Mac)\n\n`ios-ship profile --app <one app>` twice in a row, the second within 20 s of the first. Both\nmust pass; the second must show the wait in its log. Record the verdict and the wait.\n\nNot in scope: a hook on `xctrace`, a CLAUDE.md line, ddiServices.\n\nReport cap: 15 lines per part.\n", "updatedAt": "2026-10-26T05:00:00Z"}, "c49": {"title": "A ruling on a behaviour covers every test that expects the old one", "phase": "cleanup", "status": "active", "order": 104.2, "why": "Your gripe, Oct 26: a session asked you again whether it may change an older test that expects a behaviour you ruled out at 21:27 (a rule save clears the partly-sent mark). It said your word covered one test, and a failing test only changes on your word.", "note": "Built Oct 26 on batch-oct26: draft PR #589 (a ruling covers its stale tests), head 3d648b0, two Sonnet review rounds, all findings fixed, local lints green. CLAUDE.md: outcomes-tests-are-claims sends a stale test to the owner only when no ruling covers it; outcomes-word-covers-named-act adds that the owner's ruling covers each test and path expecting exactly what it ruled out, cited with its time. Builder and reviewer gain class (d): an owner ruling in the brief or records; a neighbouring test stays class (c). Deviation: CLAUDE.md word count 2898 to 2909, since each added clause closes a hole review found. Joined batch-oct26 Oct 26 (PR #589 merged into it, commit dde6e17); lands on main with that batch.", "ask": "# c49: a ruling on a behaviour covers every test that expects the old behaviour\n\nRepo: claude-settings. Mode: solo (three prose files and one record). Checked at 149f4bc.\n\n## Why\n\nOwner gripe, 2026-10-26. A session on another repo asked the owner a second time whether it may change\nan old test. The owner had already ruled the old behaviour out at 21:27 (a rule save must not clear the\npartly-sent mark). The session wrote: \"Your word covered one test. A failing test only changes on your\nword.\" A second test, and maybe three more, expected the same ruled-out behaviour.\n\nCause, two rules read together:\n- outcomes-tests-are-claims (a failing test is a claim, not law) and its 3-class sort in agents/builder.md\n  and agents/reviewer.md have no class for \"the owner already ruled this behaviour out\". The session put\n  the test in class (c), \"the rule may be stale\", which says STOP and wait for the owner's word.\n- outcomes-word-covers-named-act (my word covers the act it names, never a variant) was read as \"the word\n  named one test\", so each further test looked like a variant.\n\nThe rules are right about acts (a merge, a delete, a push). They are wrong about rulings: a ruling names a\nbehaviour, and a test that expects the old behaviour is only one route to it.\n\n## Change\n\n1. CLAUDE.md, rule outcomes-tests-are-claims: add one sentence. A test that expects a behaviour the owner\n   already ruled out is re-pointed, not asked about: cite the ruling and its time, show it red on the old\n   behaviour and green on the new.\n2. CLAUDE.md, rule outcomes-word-covers-named-act: add one sentence. A ruling on a behaviour covers every\n   test and code path that expects the old behaviour.\n3. agents/builder.md and agents/reviewer.md, the 3-class sort: add class (d), \"the owner already ruled\n   this behaviour out\". The builder reports the test change it needs (builders do not edit tests; a\n   test-author does), and cites the ruling. When one test of a ruled behaviour fails, find every test that\n   expects the same behaviour in one pass (search, then run them), and re-point them all in the same lane.\n   Report the list. The reviewer checks that each re-pointed test expects exactly the ruled-out behaviour,\n   and flags any that pins something next to it; that one goes back to class (c).\n4. Class (c) stays for a test whose behaviour has no ruling. It still goes to the owner.\n5. docs/records.md and lint/rule_mechanisms.json: keep their lines for the two rules true.\n\nKeep the CLAUDE.md word count flat or lower: rewrite in place, cut words elsewhere in the same two rules if\nneeded. Report the count before and after.\n\n## Done when\n\n- The rule audit and STE lints pass (`verdict` on the lint suite the repo's CI runs for CLAUDE.md and\n  agents/).\n- A reader can answer \"may I re-point the second test?\" from the text alone: yes, cite the 21:27 ruling.\n\nReport cap: 15 lines.\n", "updatedAt": "2026-10-26T06:10:00Z"}, "c5": {"note": "Done. #384 closed unmerged Oct 19; #455 and #456 merged Oct 20 (their content landed through #525, the map skill move); #457 closed unmerged Oct 20. Branch claude-p-fetch-key is kept, as you approved.", "order": 50, "phase": "cleanup", "status": "done", "title": "Close PRs #455 and #456, decide #384", "updatedAt": "2026-10-21T17:30:00Z", "why": "#457 replaces the two drafts. #384 has sat as a draft since Oct 13."}, "c50": {"title": "Deleting a hook script never breaks a session that is still running", "phase": "cleanup", "status": "active", "order": 103.6, "why": "Goal-3 session report, Oct 25: deleting the two STE stub scripts (#575) broke Edit and Write in the goal session itself and in every agent it started, because that session began before #566 and still called ste_gate.py on every edit. The goal had to move to a fresh session mid-batch.", "note": "Built Oct 26 by a cloud build thread: PR #584 (keep hook scripts that a recent settings.json called), waiting on CI, then merge by the owner or c53. Cause: the Oct 25 delete of the STE write-gate stub hit a session started before Oct 23 that still held the fail-closed Edit/Write entry; the question-reviewer script delete (Oct 22, no stub) was the same break. Fix: CI check lint/check_hook_stubs.py fails when a script any main settings.json called in the last 14 days is gone; stubs for ste_gate, md_sweep and question_outcome are back until Nov 6; rule recorded in decision gate-hooks-fail-closed. The 14-day window is a guess (session life unmeasured; the incident session lived about 2.6 days). Review: no blocker; open finding filed as note hook-stubs-one-path-form. Oct 26: PR #584 (keep hook scripts that a recent settings.json called) adds lint/check_hook_stubs.py: a script any settings.json on main called in the last 14 days stays, as an exit-0 stub if retired. Build advisor ruling, Oct 26: 14 days stands, unmeasured. A stub costs one exit-0 file, so a generous window is cheap; it fails only for a session left open more than 14 days with no restart. The record marks it unmeasured, and an incident reopens it. Not your call.", "ask": "Brief, copied from briefs/c50-deleted-hook-keeps-sessions-working.md and kept in step with it. Send to a cloud build thread.\n\n# c50: deleting a hook script never breaks a session that is still running\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b.\n\n## Incident\n\nA session deleted a hook script after checking installs on both machines, but not sessions still\nrunning. A live session keeps the hook list it read at start. It kept calling the deleted script,\nand Edit and Write failed for that session and every agent it started, until it restarted.\n\n## Facts at 3f71d6b\n\n- Most settings.json hook commands already fail open on a missing script (`[ -f \"$g\" ] || exit 0`).\n- hooks/guard.py and hooks/rm_prompt_answer.py fail closed on a missing script by design: they\n  print \"claude-settings gate not runnable (script missing)\". Safety guards stay fail-closed\n  (decision on fail-closed guards; c15 note).\n- Precedent: lint/ste_gate.py and lint/md_sweep.py were kept as exit-0 stubs for old installs\n  after their hooks left settings.json (debt ste-stubs-delete).\n\n## Task\n\n1. Find the cause. Use git log on hooks/, lint/ and janitor/ to list hook scripts deleted in the\n   last 30 days, and the settings.json command form that called each at the time. Name which\n   form broke: an old entry with no missing-script check, a fail-closed entry, or something else.\n2. Fix it in one home. Pick the cheapest one that covers the cause:\n   (a) a CI check (in lint/, run by gates.yml) that fails when a script referenced by settings.json\n   at the previous release tag or at main~N is deleted with no stub left in its place; the stub\n   is an exit-0 file with its delete date, removed one release later; or\n   (b) every non-guard entry fails open, and the guard entries keep failing closed but are never\n   deleted without a stub.\n   Recommended: (a), since it follows the ste_gate precedent and keeps the guard fail-closed.\n   Record the rule in place in the decision that owns hook wiring (find it with git grep).\n\n## Failure classes\n\n- A check that passes when the script is missing but the old settings still call it. Red case\n  first: a fixture where settings at the base commit call a script the head deletes with no stub.\n- A false alarm on a script that no settings version ever called. Green control.\n- Any change that turns a fail-closed guard into fail-open. Out of scope; the reviewer checks it.\n\n## Roles\n\nOrchestrate: test-author, builder, fresh reviewer (it changes a check's verdict). Base: main.\nPR stops at green; merge waits for c53 (merge.py from the cloud) or shiv's merge.py run.\n\n## Report (25 lines max)\n\nDone, Deviations, Input Needed, Next. Name the cause found, the PR, the red then green tests.\n", "updatedAt": "2026-10-26T05:40:00Z"}, "c51": {"title": "Retire the terminal advisor; one meaning for 'the advisor'", "phase": "cleanup", "status": "active", "order": 103.5, "why": "Your worry, Oct 26: the advisor setup is delicate, and your Mac sessions seem to report an advisor review that may not exist.", "note": "State, checked at claude-settings 149f4bc5 (Oct 26). Three things were called advisor: Claude Code's built-in advisor (advisorModel: opus, a second opinion inside one session; source of the Mac 'advisor review' lines), the terminal advisor (Windows-only advisor-xx session), and this cloud project. The terminal advisor is retired. PR #578 (questions go to the owner: rule questions-ask-advisor-first becomes questions-go-to-owner, the report label 'Decided by the advisor' is removed and refused by the report gate, the advisor- name pass is removed) is green and waits on a merge (c53, or merge.py on your Mac). Done: start-advisor.ps1 removed (advisor repo 945b6ce); the record moved to the claude-settings roadmap branch (branch rule: no deletion, no force push, admins included); the roadmap page mirrors it, republished after each build. Left: old artifact pages and frozen project-file copies, deleted after your yes; on your machine, delete C:\\advisor's launcher shortcut and ~/.claude-advisor (your call); the advisor repo stays until you say. Placed ahead of c50 (triage, Oct 26): its PR #578 is green and merges as soon as c53 lands; its remainder joins batch 1.\nRulings:\n- Oct 26: retire the terminal advisor once cloud building runs.\n- Oct 26 03:40 UTC: retire it now, with the repo route; bring the roadmap page in house; delete old artifacts after your yes.\n- Oct 26 04:02 UTC: the record moves to a roadmap branch of claude-settings with full history; direct pushes, no PR, no CI.", "ask": "No brief: built in this project (thread 'Retire the terminal advisor setup'). Local cleanup on Windows, when you like: delete the Start Advisor shortcut, C:\\advisor\\start-advisor.ps1 (gone from the repo after a pull) and the folder %USERPROFILE%\\.claude-advisor.", "updatedAt": "2026-10-26T04:57:00Z"}, "c52": {"title": "This project builds the portable claude-settings backlog as PRs", "phase": "cleanup", "status": "active", "order": 103.1, "why": "Your idea, Oct 26: the goal of the advisor setup was something that answers your questions and pushes the backlog along; this cloud project can edit code.", "note": "State, Oct 26, at claude-settings bf084dfd. Cloud threads build claude-settings; CI proves each PR on ubuntu, macos and windows. No hooks or agents run in the cloud, so a reviewer and CI gate each logic diff. merge.py fails in the cloud until c53 lands (GraphQL blocked). Integration branch batch-oct26, PR #586: reviewed green lanes join with plain git. In: c43's debt file, c29, c51, c45, c58. To join when green: c50, c57, c46 lane 1, c47 part 1, c44, c53. You merge #586 with merge.py on the Mac, which lands c53 and every lane, and lane PRs close. The build advisor runs 4 to 6 or more build threads; triage sets the order (c55). Placed ahead of all build steps (triage, Oct 26): the frame batches run in.\nFinding, Oct 26 (build advisor; gates run 40273599923 red on main bf084dfd): the hand merge of #577 (the pilot) skipped the records rebuild, so test r10 fails; #586's merge should clear it. gates-windows-guard also failed, cause unknown; green on #586's head 5c22f09f. After #586 merges, check both on main; one still red becomes its own step.\nRulings:\n- Oct 26: this project holds the standing merge grant; merge only on green, through merge.py.\n- Oct 26: act only on claude-settings; check in before any step for another repo.\n- Oct 26: only the triage thread writes new steps, merges, order and closes (c55).\n- Oct 26: green PRs go into one integration branch now, not a pile waiting on c53.", "ask": "Pilot brief: briefs/c46-pilot-merge-keeps-dropped-lane.md (full text on c46). Plan: https://claude.ai/artifact/U4jM83VeaTVmePCDig78fD.", "updatedAt": "2026-10-26T06:12:00Z"}, "c53": {"title": "The merge tool works from a cloud session (REST calls, no GraphQL)", "phase": "cleanup", "status": "active", "order": 103.3, "why": "Cloud build threads hold your standing merge grant, which says merge only through merge/merge.py. merge.py cannot run in a cloud session today.", "note": "State, Oct 26, checked at claude-settings 149f4bc5. In cloud sessions gh REST works through the proxy (admin rights) but GraphQL is refused with HTTP 403; gh auth status misleadingly reports a failed login. merge.py's gh pr view, list, checks, merge and gh repo view use GraphQL, so merge.py fails in the cloud; gh run list and the lock calls already use REST. Fix: one home in merge.py on gh api REST routes, on every platform. Risk the reviewer hunts: REST keeps check-runs and commit statuses in two lists; a miss counts a pending or red check as green. It builds on #577's branch (both edit merge.py) and its own PR stops at green for a merge.py run on your Mac. Brief: briefs/c53-merge-tool-rest.md (also in Ask). Blocks: merging #577, #578 and every later batch from the cloud. Placed ahead of c45 and batch 1 (triage, Oct 26): green PRs #577 and #578 wait on a cloud merge path, and every later batch needs one.\nRulings:\n- Oct 26 (advisor pick, not contested): REST only, no second GraphQL path.", "ask": "Brief, copied from briefs/c53-merge-tool-rest.md and kept in step with it. Send to a cloud build thread.\n\n# c53: the merge tool works from a cloud session\n\nBuild thread brief. Written by the build advisor, Oct 26, against claude-settings main 149f4bc\n(#574, agents stop their watchers).\n\n## Goal\n\n`merge/merge.py` runs end to end from a claude.ai cloud session, and still runs the same on Mac\nand Windows. Then cloud build threads merge their own green PRs under the standing merge grant.\n\n## Why it fails today\n\nIn cloud sessions gh reaches GitHub through a proxy. REST calls work (`gh api repos/...`, admin\nrights). GraphQL is refused with HTTP 403: \"GitHub GraphQL is not available from Claude Code\nsessions; use the REST API\". `gh auth status` reports a failed login; ignore it, REST still works.\nThese merge.py calls use GraphQL, so each fails (line numbers at 149f4bc):\n- 543 `gh pr view --json headRefOid,headRefName,baseRefName,state,mergeable,mergeStateStatus,isDraft,body`\n- 558 `gh pr list --state open --json headRefName,headRefOid,baseRefName`\n- 597 `gh pr checks --json name,bucket,link,startedAt,completedAt`\n- 790 `gh pr merge --<method> --match-head-commit <sha>`\n- 794 `gh pr view --json state,mergeCommit,headRefOid`\n- 1141 `gh repo view --json defaultBranchRef`\nLine 681 `gh run list` and the lock calls (`gh api -i`) already use REST: check, do not rewrite.\n\n## The change\n\nOne home in merge.py for these reads and the merge, on `gh api` REST routes, used on every\nplatform (no second GraphQL path):\n- PR: `GET repos/{o}/{r}/pulls/{n}` (head.sha, head.ref, base.ref, state, merged, draft,\n  mergeable, mergeable_state, body). mergeable can be null while GitHub computes it: read again,\n  as the tool does today for UNKNOWN.\n- Open PRs: `GET repos/{o}/{r}/pulls?state=open&per_page=100`, all pages.\n- Checks: `GET repos/{o}/{r}/commits/{sha}/check-runs` (all pages) AND\n  `GET repos/{o}/{r}/commits/{sha}/status`. gh pr checks merges both lists; the REST version must\n  too, and map each entry to the same buckets (pass, fail, pending, skipping, cancel).\n- Merge: `PUT repos/{o}/{r}/pulls/{n}/merge` with `merge_method` and `sha` (the head-match guard).\n  Then `GET pulls/{n}` for merged and merge_commit_sha.\n- Default branch: `GET repos/{o}/{r}` default_branch.\n- Keep every existing retry, rate-limit and network-error path (retry_net, the 5xx and\n  rate-limit parsers) on the new calls. Map the old GraphQL enum values (MERGEABLE, CLEAN,\n  BLOCKED, DIRTY, ...) to the REST lowercase values in one table.\n\n## Failure classes (outcomes-tests-are-claims)\n\n- The real risk: a check missing from the merged list, or a status mapped to the wrong bucket,\n  lets merge.py count a pending or red check as green and merge early. Test: a commit with one\n  green check-run and one pending commit status is not green; a failed status is red; a\n  required check present only as a status is found.\n- A paged list read only on its first page drops checks or PRs. Test with two pages.\n- The merge sends no sha, so a push after the read merges unreviewed code. Test: a head change\n  between read and merge refuses (GitHub answers 409).\n- test_merge.py fakes gh output. Re-point its fakes to the REST shapes; show each new case red\n  on 149f4bc and green on the fix.\n\n## Roles\n\nOrchestrate: test-author, builder, fresh reviewer. It changes a gate's verdict (which checks\ncount as green), so the reviewer hunts the failure classes above. Usual review cap.\n\n## Done when\n\n- CI green on ubuntu, macos and windows (gates.yml, including gates-windows-merge).\n- One live read-only run from this cloud session against a real open PR (#577 or #578) prints\n  the tool's verdict on mergeability and checks, with no GraphQL error. Do not merge with it from\n  the unmerged branch.\n- The PR stops at green. Its own merge goes to the owner (merge.py on the Mac), unless the owner\n  says otherwise.\n\n## Report (25 lines max)\n\nDone, Deviations, Input Needed, Next. Include the PR, the red-then-green test names, and the\nlive run's verdict line.\n", "updatedAt": "2026-10-26T04:57:00Z"}, "c54": {"title": "Cloud threads follow the same model rules as local sessions", "phase": "cleanup", "status": "todo", "order": 104.0, "why": "Your question, Oct 26: cloud threads run Opus, but you can't see or limit which models their subagents get, unlike the lockdown claude-settings gives your local sessions.", "note": "Checked Oct 26 in a cloud thread at claude-settings 149f4bc. Local sessions cap subagents at Sonnet through settings.json env (CLAUDE_CODE_SUBAGENT_MODEL and CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL), the guard's subagent-model-cap ask, and agents/ model pins. Cloud threads had none of these, so subagents inherited Opus, capped only by CLAUDE.md text. Part 1 done, Oct 26 (you): a new cloud environment sets both env vars to sonnet and is the project default; threads started before it keep the old one. Unknown: how the env cap interacts with an agent file's own pin (Plan on Opus). Part 2, after c53: each cloud Done item names the model of each subagent that worked on it, checked by the reviewer against the spawn calls. Part 3, held by your ruling Oct 26: install claude-settings into cloud containers (setup script or a repo SessionStart hook), which also closes 'hooks are not installed in cloud sessions' from c52. Placed after c47 (triage, Oct 26): part 2 waits on c53.", "ask": "Part 1 done (your settings change, Oct 26). Part 2 gets a brief after c53. Part 3 held until you choose.", "updatedAt": "2026-10-26T05:00:00Z"}, "c55": {"title": "The roadmap gets re-weighed as a whole, and notes stay short", "phase": "cleanup", "status": "active", "order": 103.2, "why": "Your question, Oct 26: are we rewriting notes instead of appending, and re-weighing the order instead of putting each new item at the front? Audit, Oct 26 at roadmap 9517045: mostly not.", "note": "Audit, Oct 26 at roadmap 9517045 (reports/roadmap-upkeep-audit.md in project files): 85 of 135 note edits were appends; no existing step was ever re-ordered; new steps landed at the top; the whole review never ran, because its trigger (a phase change) never fired. Your ruling, Oct 26 ('agreed, let's implement this'): the thread 'Triage the roadmap' is the gatekeeper. Only it creates, merges, orders and closes steps; other threads send it each item with your message attached and still rewrite notes on their own steps. The coordinator put the rule in the project instructions. Built Oct 26: build.py prints an upkeep list on each build. Against context rot: triage re-reads the branch before each placement, hands off at about 40 exchanges, a phase change or a slip (handoffs/triage-<date>.md), and treats a growing upkeep list as a slip. Your word, Oct 26: the backlog cleanup runs in its own thread, 'Clean up the roadmap backlog'; triage re-weighs the whole order when it reports done. Placed ahead of c53 (triage, Oct 26): it governs how every later step is filed, and it builds nothing in claude-settings main.\nRuling, Oct 26 (shiv): any step that needs your answer is deferred for now; work that needs none runs first, in priority order, and the build advisor dispatches no deferred step.\n- Oct 26 (shiv): the local liaison is exempt from the 40-message and 8-brief hand-off limits while it holds a Remote Control session on the Mac; the slip trigger still applies.", "updatedAt": "2026-10-26T06:35:00Z"}, "c56": {"title": "One thread publishes the roadmap page", "phase": "cleanup", "status": "done", "order": 103.25, "why": "Build advisor, Oct 26: every thread republishes the roadmap page, so publishes collide and each takes about three tries.", "note": "Measured by triage, Oct 26 (this thread's own publishes): of 5 publishes, 3 were refused before going through. Two causes. (1) A real race: another thread published a newer build in between (seen twice). (2) A handshake cost, not a race: the first publish to a page this session has not viewed is refused, and the same content sent again is refused until the saved copy is read; so even a clean publish takes up to three calls. Options: (a) one publisher, the triage thread: other threads push to the branch and do not publish; triage publishes at the branch head on each wake. Gain: no races. Loss: a note-only push by another thread shows on the page only at triage's next wake. (b) Every thread publishes, but only after pulling, building at the head, and checking that the live page equals an earlier commit's build. Gain: the page stays fresh. Loss: races stay and need retries. Ruled Oct 26 (coordinator, in the project instructions): (a). The triage thread is the only publisher, from the branch head; other threads push only. Handshake noted in roadmap/README.md. Placed after c55 (triage, Oct 26): same upkeep family, and it costs every thread calls today.", "updatedAt": "2026-10-26T05:15:00Z"}, "c57": {"title": "Mods run their tests on all three systems in CI", "phase": "cleanup", "status": "todo", "order": 103.95, "why": "Finding from the thread fixing the decision watch on the Mac, Oct 26: CI runs mod tests on Linux only, so a Mac-only bug in decision-watch went uncaught, and the watch has never judged a Mac turn (c29).", "note": "Checked at claude-settings 3f71d6b: in .github/workflows/gates.yml the 'Mod tests' step (and the plain-english-map skill tests beside it) sit in the ubuntu-latest job; the windows-latest and shell-macos jobs do not run them. Incident: c29, decision-watch needed `which -a python3 python` to exit 0, which fails on a Mac (no `python`); fix #580. Fix shape: run the same mod-test step in the Windows and macOS jobs under the same `mods` scope flag, one step definition, no copy. It changes what a gate checks, so it is a lane with a red proof (a mod test that fails only on macOS) and a reviewer. Placed ahead of c54 (triage, Oct 26): an incident showed the gap, and it hides bugs in every mod; in batch 1 (build advisor, Oct 26): a CI-only change to gates.yml, cloud-buildable, and no other batch 1 lane touches gates.yml.", "updatedAt": "2026-10-26T05:30:00Z", "ask": "Brief, copied from briefs/c57-mod-tests-on-three-systems.md and kept in step with it. Send to a cloud build thread.\n\n# c57: mods run their tests on all three systems in CI\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b.\n\n## Why\n\nIn .github/workflows/gates.yml the \"Mod tests\" step and the plain-english-map skill tests run only\nin the ubuntu-latest job. The windows-latest and shell-macos jobs skip them. Incident: decision-watch\ncalled `which -a python3 python`, which exits non-zero on a Mac with no `python`; Linux CI was\ngreen. Fix PR #580 (decision-watch finds python one name at a time).\n\n## Task\n\nRun the same mod-test step (and the skill tests beside it) in the Windows and macOS jobs, under the\nsame `mods` scope flag the ubuntu job uses. One step definition, no copied block: use a composite\naction, a shared script, or a matrix, whichever fits gates.yml's current shape. Keep the jobs'\ncaps; if a job's cap is too short, raise that cap and say by how much.\n\n## Failure classes\n\n- The step runs but finds no tests on one OS (path or glob differs). Proof: the job log on each OS\n  names the same test count.\n- The scope flag skips the step on Windows or macOS when a mod changes. Proof: a PR touching a mod\n  file runs the step on all three.\n- Red proof: show one mod test that fails only on macOS (for example, revert #580's fix on a\n  scratch branch, or a fixture that needs `python` on PATH), red in the macOS job, then green.\n\n## Roles\n\nOrchestrate: builder and fresh reviewer (it changes what a gate checks). Base: main. Note #580 is\nopen; if your red proof uses its fix, rebase on main after #580 merges. PR stops at green.\n\n## Report (25 lines max)\n\nDone, Deviations, Input Needed, Next. Per OS: the test count and the job's wall time before and after.\n"}, "c58": {"title": "claude-settings mods update themselves after the first install", "phase": "cleanup", "status": "active", "order": 102.6, "why": "Your question, Oct 26: why did your claude-settings install never pick up the token-weather 500k fix? Mods were fetched once, on Oct 13, and never refreshed.", "note": "Ruling, Oct 26 (shiv, \"agreeed\"): mods stay current by marketplace auto-update alone, with no installer step. Cause, checked at main 3f71d6b: the claude-settings marketplace entry in settings.json had no \"autoUpdate\": true, and Claude Code leaves third-party marketplaces un-refreshed by default; install.sh and install.ps1 never touch plugins, by design (decision mods-install-via-marketplace). So each mod stayed at its first-install version (desktop-statusline 0.1.3 on the Mac against main's 0.1.5). Fix: PR #581 (mods auto-update from the claude-settings marketplace), reviewed with no findings; CI running; shiv merges on the Mac. One-off catch-up given to shiv: `claude plugin marketplace update claude-settings`, then `claude plugin update <mod>@claude-settings` per mod. Proof after merge, on the Mac: after the first session, `claude plugin list` shows each claude-settings mod at main's version. Placed ahead of c52 (triage, Oct 26): it waits only on a merge path (c53), and it carries #580 (c29) to the Mac.", "updatedAt": "2026-10-26T05:50:00Z"}, "c59": {"title": "No session sits idle while ready work waits", "phase": "cleanup", "status": "todo", "order": 109.3, "why": "Your gripe, Oct 26: the project went idle with plenty of ready work; you expected many lanes in parallel, and asked whether a standing thread must keep coal going into the engine.", "note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (the fix is not ruled).\nChecked Oct 26 at claude-settings 3f71d6b. What exists: c37 made goal runs pace on measured load and report 'minutes with no lane running, and the reason' at each batch merge (rule reports-batch-pace-numbers); rule parallelism-no-guessed-lane-cap forbids a guessed lane cap; home-app has a 'keep going' rule (go on to the next step with no stop). Gap: idle time is only reported after the merge; no rule or check makes a session start the next ready item when a lane ends, so an orchestrator ends its turn and the queue waits for you. In-chat fix, Oct 26: the build advisor keeps 4 to 6 build threads running. Proposed claude-settings fix, not ruled: (1) promote home-app's 'keep going' to the global rules: when a lane ends and a queued item has every question answered, start it in the same turn; stop only for an owner decision, a test only the owner can run, or the load brake. (2) An orchestrator's final report names the queue's ready items it left unstarted and why; 'none' or a reason per item, never silence. (3) Later, only after a repeat: a Stop check that refuses an orchestrator's turn end while its own plan lists a ready, unstarted item and the brake has room. Placed after the Mac steps c27 and c23 (triage, Oct 26): deferred; when ruled it sets how fast every later step moves.", "updatedAt": "2026-10-26T06:00:00Z"}, "c6": {"note": "Done by the cull, measured Oct 19 at #513: lint/rule_mechanisms.json (99 rows) names a test for all six rules the cull ruling listed (the five above plus git-cite-by-id), each in hooks/test_guard.py. Their CLAUDE.md prose is cut to a short reminder plus a one-line reason (10-23 words each; roles-third-try-steps-up still 32). Not checked: whether a mutant targets each named case.", "order": 60, "phase": "cleanup", "status": "done", "title": "Write proving tests for five guard rules", "updatedAt": "2026-10-19T15:25:00Z", "why": "Their rows name no test, so their prose can't be deleted safely yet. Start with shared-trees-no-destructive-git."}, "c7": {"ask": "Brief, copied from briefs/c7-c24-c25-premises-batch.md and kept in step with it. Paste all of it to a claude-settings session. Covers c7, c24 and c25. Also attach plans/premise-handoffs-plan.md (project files).\n\nPremises batch, claude-settings. Roadmap: c7 (fix the reply-style conflict: one question reviewer), c24 (planners check their brief's premises), c25 (handoffs list premises with sources, evidence lives in its record). Attach plans/premise-handoffs-plan.md with this brief; it is the design, with file and line references checked at 73ed71a7. Re-check each reference against current main before editing, since other batches have merged since.\n\nOrder: after the guard-rule batch (c10, let the guard grow then cull what never fired; l1, rules that never fired show up) lands. Fixes and tests only; no measuring step.\n\nOwner's rulings, Oct 21 (all four open questions in the plan, answered A):\n1. Premises show inside the question box: one to three short \"Based on:\" lines in plain words, each with its source kind.\n2. Drop the code check for the Goal and Problem lines; the question reviewer judges form too.\n3. The question reviewer runs on Opus by a standing class-level word, recorded in decision subagent-model-cap (like the audit Explore word of 2026-10-21).\n4. Raw evidence lives inside the decision or debt that uses it, in an Evidence section of about 10 lines, deleted with that record. Add that one clause to decision cull-rules in place.\n\nLanes, as in the plan's section 5:\n1. Probe agent hooks first, alone. Report which of the plan's checks hold. If agent hooks do not work, stop and report before any other lane; the fallback (the session spawns the reviewer itself) costs about five processes per question on Windows and needs the owner's word.\n2 and 3. The premise section in the handoff and the premise format's one home (same files: one builder, or 3 after 2).\n4. The question reviewer: agents/question-reviewer.md with model opus pinned, one agent hook on AskUserQuestion.\n5. Delete the old judges (the AskUserQuestion prompt hook and hooks/question_outcome.py, with their tests, decisions and references). Needs 4 merged.\n6. The planner duty in agents/plan.md: premises first, checked against decisions/ and recent rulings. Can run beside 2 to 4.\n7. The evidence clause in cull-rules (wording only).\n8. Handoff cadence (owner's ruling, Oct 21). (a) The Stop nudges to rewrite the handoff move from fixed token counts (200k, 350k, 450k, precompact_handoff.py) to fractions of autoCompactWindow, about 40, 70 and 90 percent, so they still fire if the window is lowered. Test: with the window set to 250k, all three nudges fire; red on main. (b) hooks/precompact_handoff_prompt.md gains a rule: also update the handoff with a small edit when something happens (an owner ruling, a finished step, a test result that changes what fails); the token nudges stay as the backstop. Shares files with lane 2: same builder, or after it. (c) The PreCompact digest (precompact_handoff.py, state/handoff/<sid>.digest.md) keeps every owner message word for word, not only the last 60,000 characters, with long pastes cut to their first lines and marked as cut. Digest file only; nothing new loads into context. Test: an owner message from early in a long transcript is in the digest verbatim, and a long paste is cut; red on main.\n\nEach lane: a test red on main and green on the fix, as the plan lists. Record each ruling in place under decisions/.\n\nReport: per lane, what changed and the test that proves it; lane 1's findings in full; the net hook processes per question on Windows, before and after, counted from settings.json; and the four size numbers on main.", "note": "Done. Landed in #566 (Oct 23, checked at f463787): one Opus question judge on AskUserQuestion replaces both old judges, and each question lists its premises with sources. The checks that need the chat (goal match, already-settled questions) went to the outside advisor (c32), since retired (c51).", "order": 110, "phase": "cleanup", "status": "done", "title": "Fix the reply-style conflict", "updatedAt": "2026-10-26T05:30:00Z", "why": "Plain beats short when they clash; each option says how it works; options that can't be told apart mean fewer options or a decision made for you."}, "c8": {"ask": "Draft the sandbox settings and the test list for the Mac trial.", "note": "Closed by your word, Oct 26 ('c8 close'): decision adoptions-declined-2026-09-28 already declined the sandbox; the guard and deny rules give most of the gain. Reopens only on a guard bypass those miss.", "order": 450, "phase": "later", "status": "done", "title": "Try the sandbox on your Mac", "updatedAt": "2026-10-26T05:05:00Z", "why": "The OS blocks writes outside the repo however a command is spelled. Since Windows stays native (Oct 17), this protects Mac sessions only, and the guard code it would have replaced stays for Windows."}, "c8b": {"ask": "Desktop WSL sessions load plugins now. Is moving Windows to WSL2 worth it, and what could we cut?", "note": "Decided Oct 17: Windows stays native. Desktop app WSL sessions don't load plugins, and losing your mods is a dealbreaker. Revisit only if desktop WSL sessions start loading plugins. Rechecked Oct 20 (code.claude.com/docs/en/desktop-wsl): still not available in WSL sessions: the integrated terminal, connectors and plugins, session forking, the file browser pane and @ file suggestions. No trial lane is needed until that changes.", "order": 85, "phase": "cleanup", "status": "done", "title": "Decide where Windows sessions run: native or WSL2", "updatedAt": "2026-10-20T18:18:00Z", "why": "On WSL2, Windows behaves like the Mac: the same shell, the same sandbox, one set of rules. Much of claude-settings exists to make native Windows behave (3,248 lines of PowerShell and .cmd; 61 of 126 decisions mention Windows, WSL or PowerShell). Moving opens a big cull. The cost: desktop app WSL sessions don't load plugins yet, so you'd run Claude Code from a WSL terminal, and repos move into the Linux filesystem."}, "c9": {"note": "Merged into c23 (triage, Oct 26): a guard rule with no test is a cull candidate.", "order": 460, "phase": "later", "status": "done", "title": "Optional: fail a guard rule with no test", "updatedAt": "2026-10-26T05:30:00Z", "why": "One new rule_audit case keeps future prose deletions honest."}, "d1": {"ask": "Draft the designer agent definition and its write-scope guard, and decide: does the designer run /design itself, or do you run it and hand the canvas to the builder?", "note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (a designer on Opus needs your exception).\nChecked Oct 26 at claude-settings 149f4bc: agents/ has no designer. Rule roles-sonnet-is-the-ceiling allows Opus only for Plan, the advisor and a builder's third try, so a designer on Opus needs your word as a standing exception; write it with d2's (the design reviewer) as one ruling. Route: one test, does the lane touch a screen. Canvas, as read Oct 17 and not rechecked: Claude Code's /design drafts artboards on a Claude Design canvas, published as an artifact. Review: you comment on an element of the published mockup; comments need your Enterprise account with in-organization sharing. Finding Oct 26: home-app already keeps an HTML mockup per redesign in docs/design/ (six at f8a59b2), a working pattern the designer can copy. Open: does the designer run /design itself, or do you run it and hand the canvas to the builder. Merged in from d3 (triage, Oct 26): one clause in agents/builder.md, the builder builds to this step's mockup when one exists.", "order": 210, "phase": "design", "status": "todo", "title": "Add a designer agent", "updatedAt": "2026-10-26T06:00:00Z", "why": "Opus makes a mockup for every screen lane, so Sonnet builds to a picture of the target, and you comment on the exact element."}, "d2": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (same Opus exception as d1).\nChecked Oct 26 at 149f4bc: no design-reviewer agent; skill design-review exists and names no model; agents/reviewer.md runs Haiku. Advisor pick Oct 17, not ruled: Opus for the design reviewer, since visual judgment is where the strongest model earns its cost; Haiku stays for round-1 code review. Proof first: rerun a few past design-review screenshots through Haiku, Sonnet and Opus. Needs the same Sonnet-ceiling exception as d1 (the designer); one ruling covers both. Merged in from l2 (triage, Oct 26): a second-model design critic is an option for this reviewer; Stitch and Figma Make are dropped unless you want them back.", "order": 220, "phase": "design", "status": "todo", "title": "Add a design-reviewer agent", "updatedAt": "2026-10-26T06:00:00Z", "why": "Opus judges screenshots instead of Haiku. Design-review gates every screen change, solo mode too."}, "d3": {"note": "Merged into d1 (triage, Oct 26): builder.md already loads frontend-design and the ux files; the one clause left (build to the designer's mockup when one exists) is part of d1.", "order": 230, "phase": "design", "status": "done", "title": "Builders build to the mockup", "updatedAt": "2026-10-26T05:30:00Z", "why": "Load frontend-design for every screen change, and unblock impeccable's polish and layout."}, "d4": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (you chose to deliberate later).\nStale premise, Oct 26: /board is now the session-board mod (claude-settings mods/session-board), a pane in the terminal or app with a plain-text form, not a page built from three elements. A pane is a poor first test for a mockup flow. Your word, Oct 26: deliberate later; triage's pick stands as an option (point the first test at a home-app screen).", "order": 240, "phase": "design", "status": "todo", "title": "Redesign /board as the first test", "updatedAt": "2026-10-26T06:00:00Z", "why": "It was a proof of concept built from three plain elements. Mockup first, then rebuild with Svg for status and progress."}, "d5": {"note": "Deferred (shiv, Oct 26): it needs your answer, so it waits behind all work that needs none (each idea needs your case-by-case call).\nYour word, Oct 26: banchi's design work was half done; there is a lot of good in it, but none of it goes in unvetted: an idea enters ux/ only with its own case (the outcome it protects, and a check), not because banchi has it. This narrows your Oct 20 ruling (only ideas move into ux/, never values or screens). Checked Oct 26 at claude-settings 149f4bc and banchi 19abdfb: ux/principles.md holds one banchi-sourced rule already, the icon rule (ux-one-plain-name, citing banchi's UX-118); spacing by relationship and motion roles are not in ux/; ux/tokens.md says motion is per repo. The 4px pick (banchi's floor plus 2, 3 and 6px steps) is withdrawn. Open for you, at the design phase: keep the icon rule on its own merits, or re-argue it.", "order": 250, "phase": "design", "status": "todo", "title": "Decide which design ideas belong in ux/, each on its own case", "updatedAt": "2026-10-26T06:00:00Z", "why": "ux/ holds the design ideas every repo shares. Candidates: spacing by relationship, the four jobs of motion, a named reference screen, and a spacing floor."}, "d6": {"note": "Checked Oct
