s (a .ts path for lanes 1 and 2) and assert that no guard-family or ste_lint module is in sys.modules.\n- Lane 4: a settings test that an Edit of a watched file matches config_watch and an Edit of any other file does not.\n- Lane 5: two Stops in one session start the finder once.\n- Lane 6: an idle session runs no git read within the back-off window.\n\nReport:\n- Per lane: what changed and the test that proves it.\n- The four size numbers on main: decision files, debt files without README and notes.md, hooks/*.py lines (code and tests separately), CLAUDE.md words.", "note": "Checked at 5553dc6, Linux timings (9 runs each, median): guard 98 to 105 ms, ste_gate 98, prose_judge 100, config_watch 46, local_time 55, Stop hooks 30 to 120, bare python 17. Cause: prose_judge imports decision_watch (the guard family) and ste_gate imports ste_lint at the top, before checking the path. Skipping those imports saves about 75 ms each; merging processes saves about 17 ms each. Python processes per event: Edit or Write 4; Bash 2 on Windows (3 with 'ready') and 5 to 6 on Mac; Stop 9; prompt 1. Your ruling Oct 21: no measuring step, fixes proven by tests. A Stop-only dispatcher stays a later option in c19; the guard keeps its own process because it fails closed. Running now, in one batch with c19 lanes 1 to 3 and c22's Windows lanes.", "order": 101, "phase": "cleanup", "status": "done", "title": "Hooks stop loading code they never use", "updatedAt": "2026-10-21T20:15:00Z", "why": "The feedback from the c13 session said the next saving is one dispatcher per event. Measured Oct 21 (Linux, so a floor): an interpreter start is about 17 to 22 ms, but prose_judge and ste_gate take about 100 ms each on a .ts edit, because they import decision_watch (the guard family, 105 modules) and ste_lint before they check the path. A dispatcher saves about 17 ms per merged process here; skipping those imports saves about 75 ms each."}, "c19": {"ask": "Lanes 1 to 3 (if filter on config_watch, decision-watch finds Python once, idle polling) are in the combined brief, full text in the Ask of c18 (hooks stop loading code they never use). No measuring step (your ruling, Oct 21). Lane 4 (Mac-only hooks registered only on Mac; hooks started without a shell, with absolute paths and onFailure: block, so install renders settings.json per machine) waits for a design proposal after that batch lands. Later, after o2 and only if still needed: a Stop-only dispatcher and cached git reads (from the old hook load step).", "note": "Counted at 5553dc6, not timed on Windows. On Windows every command hook starts bash.exe (through Git Bash) and then python.exe. A sample turn (1 prompt, 5 Bash, 5 Edits, 5 Reads, 1 Stop) starts about 65 bash.exe and 46 python.exe per session: a Bash call 6 and 2, an Edit 4 and 4 (a .md edit adds ste_lint), a Stop 9 and 9. The decision-watch mod adds where.exe plus 1 or 2 python per Stop. Idle sessions poll git: session-board every 30 s, desktop-statusline 2 calls every 60 s. 'if' filter probe on Windows, Oct 21: path patterns with a slash never match (paths arrive with backslashes); bare suffix patterns match, but per tool and case-sensitively, and a miss silently skips the gate. Your ruling, Oct 21: filter config_watch only, on exact file names; the ste_gate and prose_judge filters are parked. Reopen them only if Edit and Write shell starts still matter once c22's fixes land and the memory monitor re-runs. Order: lanes 1 to 3 in the running batch; lane 4 design next; a Stop dispatcher after o2 only if still needed; an http hook server last, since one down server fails every gate.", "order": 102, "phase": "cleanup", "status": "done", "title": "Start fewer processes per tool call", "updatedAt": "2026-10-21T20:15:00Z", "why": "Your report, Oct 21: too many Python and bash spawns, worst with several Claude Code desktop sessions at once. Hooks run once per session, so the count multiplies with every open session."}, "c2": {"note": "Cull closed Oct 19 on its time box (your ruling). Final at cull batch 6 (#508, the last cull batch): decisions 90 (down 33% from 134), debt files 16 (down 96% from 364, swept into debts/notes.md), hook lines 47,461 (up 0.6%), CLAUDE.md 2,329 words (up 1.7%). The stop rule was never met; its named work was done in c6 (proving tests for five guard rules). decisions/cull-rules.md stays for the child-repo culls in Roll out. Regrowth is watched on the Clean up numbers.", "order": 20, "phase": "cleanup", "status": "done", "title": "Read each batch's size report", "updatedAt": "2026-10-21T17:30:00Z", "why": "The four numbers show whether the cull is shrinking the system or growing it."}, "c20": {"ask": "Widen the gloss rule, claude-settings. In CLAUDE.md, rule speak-cite-id-plus-gloss (line 89) covers only records. Rewrite it in place so it covers any id the owner would have to look up: decision and debt ids, roadmap step ids, lane numbers, PR and issue numbers, commit hashes, rule anchors and hook or script names. Each one gets a short plain name beside it the first time it appears in a reply or report, like 'PR #542, the hook load batch'. Add to the same rule: a numbered id carries no order, so state the work order in words. Keep it to one rule, no new prose section. Update its row in lint/rule_mechanisms.json and the compliance-check probe (skills/compliance-check/probes.md, 'Speak plainly') so the check covers the wider scope. Report the before and after rule text and the word change.", "note": "Done: landed in #560, merged Oct 22. Checked at 5553dc6: CLAUDE.md line 89, rule speak-cite-id-plus-gloss, covers only records (decisions, debts), so roadmap steps, lanes, PR numbers, commit hashes and hook names slip past it. It binds Claude Code sessions only; the advisor got the same rule through its project instructions on Oct 21. Your ruling, Oct 21: widen it to every id you would have to look up, and say the work order separately, since step numbers are filing order. Next batch, which also deletes branch batch-map on origin (it adds nothing over main).", "order": 103, "phase": "cleanup", "status": "done", "title": "Every id comes with a plain name", "updatedAt": "2026-10-23T03:10:00Z", "why": "Your gripe, Oct 21: the advisor answered in bare roadmap step ids (c18, c19) with no name, so you had to ask what they were. You want this never to happen again, in any session."}, "c21": {"ask": "Standard lint in CI, claude-settings. Add a [tool.ruff] config with select = [\"F\", \"E9\"] and the vendored skills/impeccable excluded. Fix the 12 findings (11 unused imports, 1 f-string). Add ruff check and ShellCheck (on the 18 *.sh files, at severity warning) as steps in .github/workflows/gates.yml, failing the PR. Fix what ShellCheck flags or suppress with a one-line reason. Do not add a format step, a pre-commit hook or any Claude Code hook. Report the files changed and the four size numbers.", "note": "Done: landed in #561 (ruff and ShellCheck in CI), merged Oct 22. Checked at 5553dc6: no Ruff, Black, ShellCheck or pre-commit config; 124 Python files outside the vendored impeccable skill, 18 shell scripts, 45 custom checks in lint/. Ruff's bug rules (F) find 12 issues: 11 unused imports and 1 f-string, so the code is already clean of real bugs. Advisor pick: checks run in CI or at commit, never on every edit (the same principle as c15). So ruff check (F and E9) and ShellCheck go in gates.yml; no format-on-edit hook; a repo-wide ruff format waits until after o2, which moves files anyway. Not checked: the chat's ShellCheck findings (7 quoted ~ paths, 2 unguarded cd). Next batch.", "order": 105, "phase": "cleanup", "status": "done", "title": "Standard code lint in CI only, never on each edit", "updatedAt": "2026-10-23T03:10:00Z", "why": "Oct 21: a claude.ai chat audited claude-settings and suggested Ruff (Python lint and format) in CI, ShellCheck, and a hook that formats each edited .py file. You asked for a take, framed as processing improvements."}, "c22": {"ask": "Brief, copied from briefs/c22-windows-installer-and-rm-shim.md and kept in step with it. Paste all of it to a claude-settings session. Sent Oct 21 as lanes W1 to W3 of the running batch.\n\nAdded work for your current batch: Windows process churn. Roadmap step c22 (stop the Mac/Linux installer and rm shim running on Windows). Finish or park the lane you are in first; do not restart lanes already done. These lanes are small and urgent, so land them as soon as your current lane allows, in this same batch. If they cannot share a batch, open them as their own small batch that merges first. They fix existing code on a platform it was never meant for. No measuring; prove each fix with a test.\n\nWhy: on the owner's Windows machine (Git Bash, no admin), RAM climbs to about 98% over a day and only a reboot clears it. Kernel memory grows with every process start. The worst offender caught was the rm shim: 4 processes (sh, a forked sh, the WindowsApps python3 alias, the real python) on every rm -rf.\n\nChecked at 5584d1b:\n- The settings.json SessionStart hook (startup|resume) runs `bash \"$d/install.sh\"` whenever bash exists, so the Mac/Linux installer runs on Windows at every session start.\n- landed-dirs.txt includes bin, so it lands bin/rm, whose header says \"Posix only; install.ps1 does not land this file.\"\n- install.sh (near line 600) adds ~/.claude/bin to PATH in ~/.bashrc, putting the shim first in Claude Code's shells. install.sh has no Windows check.\n- bin/rm calls bare python3 (the WindowsApps alias on Windows, which starts a second python) and builds its Python with $(cat <<'PYEOF'), one more fork.\n\nLane W1, the installer stays off Windows. The SessionStart hook skips install.sh when uname -s is MINGW*, MSYS* or CYGWIN*, and install.sh exits 0 at its top on those, naming install.ps1 as the Windows installer. Test both. Record the ruling in place under decisions/ (one ruling, a one-line reason).\n\nLane W2, the rm shim. On MINGW, MSYS or CYGWIN, exec the real rm at once, before any python. Elsewhere, find Python the way the hooks do (python3 then python, skip WindowsApps), and pass the Python on stdin with a here-doc instead of $(cat). Mac and Linux protection stays exactly as it is. Test the Windows exec path, the WindowsApps skip, and the existing refusal cases.\n\nLane W3, ci_wake's pre-filter. Tighten the PostToolUse shell pre-filter from any \"ready\" to the phrase gh pr ready, so other commands start no python. The watch itself, its deadline and asyncRewake stay.\n\nOverlap with your current lanes: W1 and W3 edit settings.json, which your 'if' filter lane also edits. Do them in one pass on settings.json, or rebase whichever lands second; keep both sets of changes.\n\nIn your report, add:\n- Per W lane: what changed and the test that proves it.\n- A checklist the owner runs on the Windows machine after this merges and is pulled, no admin needed and nothing scripted: delete ~/.claude/bin/rm; remove the \"# claude-settings: ~/.claude/bin on PATH\" block from ~/.bashrc; check ~/.claude/claude-settings-install.log for install.sh runs; and check whether install.sh replaced ~/.claude/settings.json or a landed folder with something install.ps1 would not have made, and how to put it back.", "note": "Done. Landed Oct 21 in #552 (the hook import and process-start batch) with c18 and c19: the SessionStart hook no longer runs install.sh on Windows (W1, #558), the rm shim's parent-delete refusals moved into guard.py's recursive-delete rule (W2, #554), and decision shell-scripts-check-out-lf pins shell scripts to LF line endings. Accepted risk, Windows only: a delete inside a script, a variable or a symlink to a parent is not caught (W1 decision). Debt install-checkout-flake stays open until the race is fixed. Left for you, Oct 22: delete ~/.claude/bin/rm on the PC with the PowerShell line; not confirmed. Open, for IT: why processes under Claude start with about 2,000 handles against about 180 by hand.", "order": 100, "phase": "cleanup", "status": "done", "title": "Stop the Mac/Linux installer and rm shim running on Windows", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your Windows audit, Oct 21: RAM climbs to about 98% over a day and only a reboot clears it, with kernel pool growing about 0.8 GB an hour while tool calls run. The longest-lived processes were the rm shim's 4-process chain. Process churn is the lever on our side; the rest (why each MSYS2 process starts with about 2,000 handles) goes to IT's security agents."}, "c23": {"ask": "# Batch 4: cull the guard, part 2 (c23). Run on the Mac.\n\nPaste this whole file into one fresh claude-settings session on the Mac.\nWritten by the advisor, Oct 25, against claude-settings main f463787 (#572).\n\n## Goal\n\nDecide two guard rules that never fired on Windows: keep or delete each, on both machines' counts.\n- `gh-api-method`: refuses `gh api` with a write method (the API route to merges and settings changes).\n- `ln-over-directory`: refuses `ln -s` over an existing folder. It can do real harm only on Mac.\n\nGoverning records: debt guard-cull-held-two (the two rules held for the Mac count), decision\ncull-rules (how a cull runs), rule building-guard-needs-incident (delete a guard rule that never\nfired since it landed and whose record names no incident).\n\n## Steps\n\n1. Confirm you stand in the Mac clone on an up-to-date main: `git fetch origin main` and\n   `git -C <pin> rev-parse HEAD` against `git rev-parse origin/main`. If the pin is behind, the\n   session-start auto-pull (#568) failed: say so in the report, then reinstall with\n   `bash merge/install_from_main.sh` from the clone.\n2. Count: `verdict python3 lint/guard_log_report.py --all-rules --days all`. From its output, give\n   for each of the two rules: deny, ask and noted counts, and the first-line date or \"never\". Also\n   give the log's line count and its first date, so the count's reach is known.\n3. Windows count, Oct 22 (from the debt): zero lines for both, in 20,685 lines since 2026-09-16.\n   If the owner gives a fresher Windows count, use it.\n4. Stop point. Bring the owner one question with options and a pick, per rule:\n   - Count zero on both machines: delete (pick), or keep with the reason.\n   - Count above zero on the Mac: keep (pick). Quote each fired line's date and command shape, so\n     the owner sees whether it caught a real mistake.\n   Ask the owner directly. This is a deletion of a guard, so it is the owner's call, not the\n   advisor's. Do not delete anything before the owner names the rules.\n5. Build what the owner names, in one lane: delete each named rule from `hooks/guard.py` (its code,\n   its reason constant, its line in the rule list near line 63), its rows in `hooks/test_guard.py`,\n   and its mutants in `hooks/mutate_guard.py`. Rewrite or delete debt guard-cull-held-two: delete it\n   when both rules are decided. Update every other reader that the rule ids appear in\n   (`git grep -n '<rule id>'`).\n6. Proof: the guard suite and the mutation harness pass with the rules gone; `guard_log_report.py\n   --all-rules` no longer lists a deleted id. A reviewer reads the diff (it changes a guard).\n   Merge under the usual rules (git-integration-branch-merge, roles-review-cap-three); a lone lane\n   is its own integration PR.\n\n## Report\n\nDone, Deviations, Input Needed, Next, per the report rules. Include the two counts (Mac and\nWindows), the owner's answer with its date, and the PR. If nothing was deleted, say which rules\nstay and why, and where that ruling now lives.\n", "note": "Done: part 2 landed in #573 (merge 2026afc), Oct 25: gh-api-method deleted, ln-over-directory kept, as you ruled; checked on main 7ce2d89: no trace of gh-api-method, debt guard-cull-held-two gone. Part 1 merged in #562, Oct 22 (deleted STE-wording and role-diff-nocwd). Your ruling, Oct 25: delete gh-api-method even though review found it the only guard on gh api .../pulls/N/merge -f merge_method=squash; your typed word is the override for that hole. Note, not a guard: gh api -X PUT .../merge is an unguarded merge route; a debt only after a session is seen using it. The c9 item (a guard rule with no test counts toward the cull test) moved to the cull numbers note. Closed by triage, Oct 26.", "order": 109.1, "phase": "cleanup", "status": "done", "title": "Cull the guard itself", "updatedAt": "2026-10-26T17:25:00Z", "why": "The Oct 19 cull cut decisions (-33%) and debts (-96%) but never touched guard code: hook lines went 47,196 to 49,261. The hook cut has to come from culling guard code directly."}, "c24": {"ask": "Lane 6 of the premises brief; its full text is in the Ask of c7 (fix the reply-style conflict). Plan: plans/premise-handoffs-plan.md in the project files.", "note": "Planners already run on Opus with a fresh context per lane, so model and context are not the gap. The gap: a planner plans inside its brief and never doubts it, sees one lane only, and reads a repo that lacks your newest rulings (o5b). Shape, advisor pick Oct 21, not yet ruled: no new reviewer. The planner prompt gains one duty: before planning, list the premises the brief rests on, each with its source ('from notes' or 'measured in run X'), check each against decisions/ and recent rulings, and name any that don't hold and any simpler route. The orchestrator does the same check once, across lanes, when it writes a batch's briefs. Three layers together steer: rulings filed the day they're made (o5b), the question judge (c7), this premise check. Draft with c7. Landed in #566 (batch-oct23a, Oct 23), checked at claude-settings f463787 (main, Oct 25).", "order": 112, "phase": "cleanup", "status": "done", "title": "Planners check their brief's premises before planning", "updatedAt": "2026-10-25T19:45:00Z", "why": "Your question, Oct 21: can questions steer the work? A question judge (c7) only acts when a session stops to ask; a wrong premise in a plan can reach a PR without ever becoming a question. Today's 'the freeze stops me' was baked into the plan."}, "c25": {"ask": "Lanes 2, 3 and 7 of the premises brief; its full text is in the Ask of c7 (fix the reply-style conflict). Plan: plans/premise-handoffs-plan.md in the project files. Your ruling, Oct 21: evidence lives inside its record; add that clause to cull-rules.", "note": "Done. Landed in #566 (Oct 23, checked at f463787): handoffs carry Goal and Working premises sections, each premise with a source kind (hooks/precompact_handoff_prompt.md, decision precompact-handoff); raw evidence lives in an Evidence section of its record (#562). Your rulings, Oct 21: nudges as fractions of the compaction window, handoff updates on events, owner messages kept verbatim in the PreCompact digest. Compaction stays at 500k; advisor pick (not measured): about 250k for an orchestrator.", "order": 113, "phase": "cleanup", "status": "done", "title": "Handoffs list premises with sources, and raw evidence gets one home", "updatedAt": "2026-10-26T05:30:00Z", "why": "Feedback you brought, Oct 21: lanes reasoned from summaries ('6 to 8 pythons, from notes') instead of the data, and a long-running session carries its own wrong beliefs forward."}, "c26": {"ask": "One rule in CLAUDE.md, amended into an existing rule if one fits rather than a new section: any tracking, logging, monitoring or measuring a session adds must (1) read on demand, at the moment the answer is needed, inside a process that is already running, not on a timer or on every tool call; (2) start no new long-lived process and no extra python or bash where avoidable; (3) state its cost in its record (process starts, files written, how often it runs); and (4) carry a test that proves that cost (for example, zero child processes on its path). A log or file it writes needs a named reader, or it is not written.", "note": "Done: landed in #560, merged Oct 22. Filed Oct 21 from your gripe, during the load brake design (c14, machine-load brake), which is its first user. Pairs with your no-measuring-steps ruling. Can ride with the guard-rule batch (c10, c23), which already edits CLAUDE.md's rule text.", "order": 108, "phase": "cleanup", "status": "done", "title": "Watching costs less than what it watches", "why": "Your gripe, Oct 21: Claude's own tracking, logging and measuring has sometimes cost more than the problem it was meant to solve.", "updatedAt": "2026-10-23T03:10:00Z"}, "c27": {"ask": "Kill guard knows a lane's left-behind server (c27), claude-settings, on this Mac. Goal: a session can stop, by pid, a test server that one of its own lane agents started, after that agent ended. A process this session did not start stays refused. No new per-call cost.\n\nToday (main 149f4bc5): hooks/guard_kill.py foreign_pid_kill(tokens, transcript) allows a kill by pid only when the parent chain reaches this session's claude process. When an agent ends, macOS hands its server to init (PPID 1), so the guard calls it foreign. The one exception, in_own_agent_worktree, needs the cwd inside .claude/worktrees/agent-<id> AND <session>/subagents/agent-<id>.jsonl. Lane agents work in scratchpad folders, and workflow agents keep records under subagents/workflows/, so it never matches them. Decision a-kill-by-pid-needs-an-owned-pid lists this as a known limit.\n\n1. First check, before any code. Start `sleep 600 &` from a Bash call inside a subagent, let the subagent end, and confirm: (a) the sleep's PPID is 1; (b) its environment holds CLAUDE_CODE_SESSION_ID equal to the hook payload's session_id, read the way step 2 will; (c) where the subagent's record landed under subagents/. If (b) fails, stop and report. Do not fall back to path rules.\n\n2. Ownership by inherited tag. In guard_kill.py, beside in_own_agent_worktree: a pid is owned when its PPID is 1 and its environment holds CLAUDE_CODE_SESSION_ID exactly equal to this session's id. guard.py already reads the id with session_id_of(payload); pass it into foreign_pid_kill. Read the environment with no child process: Mac sysctl KERN_PROCARGS2 through ctypes (argv and env come back separately, so a match in argv does not count); Linux /proc/<pid>/environ. Match a whole NAME=value entry, never a substring. Any read failure means foreign. Read it only on the path that already found the pid foreign, so an allowed kill costs nothing new. Keep the worktree exception. Windows stays as today.\n\n3. Reap at session end, not agent end (advisor, Oct 26, after the Mac first check). The session and all its agents share one scratchpad, a server started with `cmd & echo $!` gets PPID 1 as soon as its Bash call ends, and the env tag holds only the session id, so an agent-end reap would stop live servers of the main session and of sibling lanes. So janitor/agent_end_reap.py stays as it is (it reaps only by an agent's own worktree). Add the tag test to janitor/session_end_sweep.py instead: at SessionEnd, stop each process whose PPID is 1, whose env holds CLAUDE_CODE_SESSION_ID exactly equal to the ending session's id, and whose cwd sits in that session's scratchpad. The whole session is ending, so nothing it owns is still in use. Any read failure means keep. The script still always exits 0 and stays inside its timeout. Do not tag servers per agent at launch: no agent id exists in the env, and adding one means rewriting every Bash call, a per-call cost. One shared helper for the tag read, imported by guard_kill.py and session_end_sweep.py. Tests: the SessionEnd reap stops a tagged scratchpad orphan, and keeps one with another session's id, one with no tag, and one outside the scratchpad. Update decision agent-end-reap-stops-what-a-finished-agent-left in place to say scratchpad orphans are reaped at session end, and why.\n\n4. One brief line. Where lane briefs are written (find the home; add no second one): a lane stops each server it started before it ends, by $! from the same call or through the harness.\n\nTests, red on main and green on the fix: a PPID-1 process carrying this session's id is allowed; the same with another session's id is denied; one with no tag is denied; one whose argv, not env, holds the id is denied; pids 0, 1 and -1 stay denied. Add a mutant in hooks/mutate_guard.py that drops the exact-match check, and show a test kills it. Update decision a-kill-by-pid-needs-an-owned-pid in place: one dated owner line (Oct 21, ownership by inherited session tag) and fix its Limits list.\n\nShip as one PR under the repo's normal review and merge rules. Report: the first-check results, diff size per file, test names, the two decisions' before and after text, and the PR.", "note": "Done: lane PR #593 landed on main 0b39053 in batch #603, Oct 26. The live check on the Mac ran before the build (payload check, claude 2.1.296); nothing owed. Cause, checked at 149f4bc5: hooks/guard_kill.py foreign_pid_kill refuses a kill of a PPID-1 process unless its cwd is in the agent's own worktree, so a scratchpad lane's leftover server can't be stopped; janitor/agent_end_reap.py has the same blind spot. Ruling, Oct 21 (owner): ownership = PPID 1 and the env holds this session's CLAUDE_CODE_SESSION_ID, read only when a kill would otherwise be refused; plus one brief line telling lanes to stop their own servers. Ruling, Oct 26 (advisor pick, after the Mac first check): agents share the session's scratchpad and a backgrounded server is PPID 1 while still in use, so reap tagged scratchpad orphans at SessionEnd in session_end_sweep.py, never at agent end; no per-agent tag. Ruling, Oct 26 06:28 UTC (owner, card): main session only; lanes cannot stop each other's servers. Notes filed in debts/notes.md: a main session started with --agent loses the tag kill; a shared daemon (Gradle) carries the tag; Apple system binaries hide their env. Forks unmeasured. Brief: briefs/c27-kill-guard-session-tag.mdLanded, checked Oct 26 13:40 UTC at claude-settings main 853b5122: #593 merged through batch #603 (batch-oct26c), after a drop from #595 on two form reds (a comment's ruling date; four sentences over 30 words), both fixed on the lane. The tag kill applies only to main-session calls (no agent_id or agent_type); scratchpad orphans are reaped at SessionEnd. Notes in debts/notes.md: --agent main session loses the tag kill; shared daemons carry the tag; Apple binaries hide their env. Forks unmeasured. Ready to close.", "order": 109, "phase": "cleanup", "status": "done", "title": "Let a session stop the test servers its lane agents left", "updatedAt": "2026-10-26T13:40:00Z", "why": "Your report, Oct 21: on Mac, a lane agent's test server is handed to the system (parent pid 1) when the agent ends. The kill guard then calls it foreign and refuses the kill, so the server keeps running and holds its port and memory."}, "c28": {"ask": "Amend output-never-hand-off-doable-step (do a step yourself before handing it to me) in output-styles/shiv-stylisms.md, in place, no new rule: (1) every command left to you comes as its own fenced block, ready to run as is: it starts with the cd it needs, has no placeholders for you to fill (ask first if a value is unknown), and needs no admin; (2) the shell follows where you will run it: a block for the app's Run button can be bash; a block you paste into a terminal on Windows is PowerShell (5.1-safe), since that is the terminal you open; a block that needs Git Bash says 'open Git Bash' on its first line; a Mac block is bash or zsh; never mix shells in one block, and a Mac-only or Windows-only step says which; (3) the block sits outside the report blockquote, because report-to-user-blockquote forbids code fences inside it, and the report names the block in one line. Mechanize cheaply (c26, watching costs less than what it watches): reply_judge.py, the Stop reply check that already runs, flags a reply that hands you a step with no code block. Test: a sample reply that hands off a step with no block is flagged; one with a block passes; red on main.", "note": "Done: landed in #560, merged Oct 22. Checked at 73ed71a: the rule already exists in shiv-stylisms.md (lines 38 to 43) and asks for a runnable bash block outside the report, but it is prose only, says nothing about PowerShell or Mac versus Windows, and sessions still skip it. So this amends that rule and adds a check, rather than adding a second rule. Gripe, Oct 21: the advisor handed you a Git Bash block, and you ran it in PowerShell, where every line failed (no grep, no bash syntax); hence the shell-follows-the-terminal clause. Can ride with the guard-rule batch (c10, c23) or the premises batch (c7, c24, c25), which edits reply hooks. Gripe, Oct 26: the advisor handed you an add-on file to paste under another session's /goal block instead of one complete prompt. Fix in this chat: anything you paste comes as one whole block. No new claude-settings step: this step's rule already covers sessions; the slip was the advisor's.", "order": 109.5, "phase": "cleanup", "status": "done", "title": "A step left to you comes as a command you can run with one click", "why": "Your ask, Oct 21: when a session won't run a command but you can, it should hand you the exact command, preferably bash, so you just press the Run button.", "updatedAt": "2026-10-26T03:08:00Z"}, "c29": {"ask": "Lane after #552 merges, first in line: move decision-watch from classic.Stop to turn.complete. Skip turns with e.agentId set (subagent turns), as session-board does. Build the python input from the session id the mod already keeps from session.start, and find the transcript the way /dw already does, since turn.complete carries no transcript path. Keep one judge at a time and never block the turn. Drop the stop_hook_active skip, which only Stop has. Tests: a main-turn turn.complete starts a judge; one with agentId does not; a classic.Stop no longer does. Bump the mod's version. Live proof on Windows: a STOP seen line (or its renamed TURN seen line) lands in shadow.log after one real turn. Rewrite decision decision-watch-mod-limits in place and close debt dw-stop-row-unproven with the sec-default finding. No Stop hook row comes back.", "note": "Mac live check passed Oct 27 11:35 CDT (local liaison). Done: #559 (the decision watch judges at turn end), merged Oct 22. Cause found Oct 21: sec-default, the app's own mod, sends every classic.* event past user-tier mods, so decision-watch, which listened only on classic.Stop, never ran on Windows; #559 moved it to turn.complete, which desktop-statusline and session-board already use. Found Oct 26 (checked at 149f4bc): on a Mac every turn read 'UNKNOWN, the mod raised', because the mod needed `which -a python3 python` to exit 0, and a Mac has no `python`. So the watch has never judged a Mac turn. Fix: #580 (decision-watch finds python one name at a time, 0.0.8), merged Oct 26 in #586 (main e5525a6). It reaches the Mac through c58 (mods update themselves) or a manual `claude plugin update`. Still owed: one live check on each machine that the watch judges a turn (restart the app, take one turn, see shadow.log). Unchecked: whether the installed app package differs from the marketplace copies. Placed after c23 (triage, Oct 26): only a live Mac and Windows check is left. Mac check passed Oct 27 11:35 CDT (local liaison, main 2ca89254): decision-watch 0.0.11 installed; shadow.log holds 160 judged turns today (STOP seen, START, END exit 0), none UNKNOWN or raised. Left: the Windows live check only. Waits on: a Windows live check (waiting page item 10).", "order": 109.15, "phase": "cleanup", "status": "active", "title": "The decision watch runs again: the app's security mod blocks it on Stop", "why": "Notice you saw, Oct 21: 'decision-watch: its classic.Stop hook was skipped. cc-plugin-sec-default runs first and sent the event on past it.'", "updatedAt": "2026-10-28T05:10:00Z"}, "c3": {"note": "Checked Oct 20 at 84d4076: janitor/sweep.py now runs fetch --prune (records the roots whose fetch failed). Not confirmed: that a test goes red on an unfetched remote commit, and the q_max keep-reason counts the brief asked for (session report not seen in the advisor chat). Lesson, Oct 19: a session cannot see the advisor chat, so a brief that cites an owner ruling must state the ruling itself.", "order": 30, "phase": "cleanup", "status": "done", "title": "Fix the janitor sweep", "updatedAt": "2026-10-20T16:55:00Z", "why": "It never fetches, so one unfetched remote commit makes it keep every worktree as unreadable. Fetch first, and skip remote heads the clone lacks."}, "c30": {"ask": "Amend git-integration-branch-merge in place (CLAUDE.md line 56 at 73ed71a), no new rule. (1) Today: 'Never push to a ready PR while its CI runs.' New: 'Never push to a ready PR while its CI run can still go green. Once a job is red, push the lane drop or the lane fix at once; the push cancels the old run, and the new run is the re-run.' (2) Today a red lane is always dropped and fixed in its own lane for the next batch. Add: a red check is instead fixed in its lane and the lane re-merged, when all hold: the fix is a few lines in the failing lane's own files; the failing check is about form (record format, version bump, lint), not a behaviour test; it is the lane's first such fix in this batch (a second red drops it); and the fix goes on the lane branch, never in the batch branch. A lane red on a behaviour test is dropped as today, with any lane that depends on it. Reason lines: a red run cannot merge, so waiting only delays the re-run; dropping a chain of lanes for a one-line form fix costs a batch cycle for nothing (owner, Oct 21). No guard. Update the rule's row in docs/records.md if it quotes the clause. Small, fits the rule-text batch (c10, c26, c28, c20).", "note": "Done: landed in #560, merged Oct 22. Your rulings, Oct 21: (1) the rule needs correcting, not the session (batch #552's first run: a red Mod version bump check on lane #549 while the old head's macOS job still ran; the red gates job had skipped 30 later steps anyway). (2) Your gripe, same day: #552's second run went red on the Ruling kind check (decision shell-scripts-check-out-lf in lane #554 had Kind: build but no Plan: line); #558's line-ending test needs #554's rule and #557 is merged into #554, so the drop rule would have dropped three lanes for a one-line fix. Your ruling, Oct 21: agreed, the in-lane fix exception as written in the Ask. Advice sent: fix the line on #554's branch, re-merge, push at once; and ask why local checks missed it before the lane joined. The advisor's first answer on (1), keep the rule and add a guard, is withdrawn.", "order": 109.7, "phase": "cleanup", "status": "done", "title": "A red batch run gets its fix or drop pushed at once", "why": "Your gripe, Oct 21: a session pushed a lane drop to the ready batch PR while a job of its red run was still going, against the rule, and reported it as a deviation.", "updatedAt": "2026-10-23T03:10:00Z"}, "c31": {"ask": "Two parts. (1) Add a Notification hook (Claude Code fires it when a session waits on you); settings.json has none at 6c187c78. It sends you one alert you will see away from the terminal: a desktop notification on Windows and Mac, and optionally a phone push; your pick of channel. It runs only when it fires, so it costs nothing per tool call (c26). (2) Amend the question rule in place: a session that asks you a question keeps working on anything that does not depend on the answer, and says in the question what it is doing meanwhile. Tests: a Notification payload triggers one alert; nothing else does.", "note": "Done, closed with no code, Oct 26. Test (you, in a plain session): a desktop banner arrived for a session's question, so the app already alerts you. Part 2 is on main (#576: a question names what the session does meanwhile). No phone push added; reopen if a gap recurs while you are away from the desk. Note: the question reviewer refused a plain test question for lacking 'Based on:' and a recommendation, a small cost.", "order": 103.7, "phase": "cleanup", "status": "done", "title": "A question waiting on you reaches you, and work goes on meanwhile", "updatedAt": "2026-10-26T05:35:00Z", "why": "Your gripe, Oct 22: the goal session likely sat about 5 hours (17:11 to 22:24 CDT Oct 21, no commits on #559's branch) on a question you never saw."}, "c32": {"ask": "# c32. Sessions ask an outside advisor first; only the owner's calls reach the owner\n\nStatus: probe done, all four yes (Oct 22, owner's machine). Next: owner sets up the advisor\n(files in advisor-setup/), then a claude-settings session adds the asking rule (brief below).\nChecked claude-settings at 11f5e4f.\n\nWhy outside: the advisor works because it is not bound by claude-settings (its rules, hooks,\nstyle), holds the whole plan and the owner's rulings, and judges without doing the work. A hook\nor session inside claude-settings is the old orchestrator model and loses all three.\n\nHow it runs (measured Oct 22):\n- A terminal session in C:\\advisor with CLAUDE_CONFIG_DIR=~\\.claude-advisor. Its CLAUDE.md is\n  the advisor instructions. Result: no claude-settings CLAUDE.md, no hook text, default style.\n- Its sessions folder is a junction to ~\\.claude\\sessions, the list of running sessions. Result:\n  its ListAgents shows the 17 desktop sessions, and a ping to one came back \"pong\".\n  claude-settings only reads that folder (hooks/guard_core.py session_records), so the junction\n  lets nothing of claude-settings in.\n- The folder sits outside the home folder: Claude Code reads CLAUDE.md in every parent folder,\n  so under ~ it offered to import the claude-settings CLAUDE.md.\n- Ruled out: the desktop app (it loads ~\\.claude, and refuses CLAUDE_CONFIG_DIR per environment;\n  a second desktop app copy is untested); this cloud project as advisor (local sessions cannot\n  see project threads).\n- The advisor reads claude-settings with git fetch and git show only. Pull, merge or the\n  installer would copy the claude-settings rules into its config folder.\n\nSetup (advisor-setup/ in project files): CLAUDE.md (advisor instructions plus \"Answering working\nsessions\"), settings.json for C:\\advisor\\.claude (hooks off, a backstop), start-advisor.ps1\n(makes the junction, sets the config folder, starts the session). The advisor's name in\nListAgents is \"advisor-\" plus a random suffix (seen: advisor-ed, advisor-be).\n\nBrief for a claude-settings session (after the owner confirms the advisor is running):\nAdd one rule, in its one home, tested: when a session has a question for the owner, it first runs\nListAgents and sends the question by SendMessage to the session whose name starts \"advisor-\",\nthen keeps working on anything that does not depend on the answer. No advisor running: ask the\nowner as today. Always the owner, never the advisor: merges, raising a model to Opus, the\noverride pass, anything that cannot be undone, any goal change, and anything the advisor marks\n\"ask the owner\". An advisor answer is never the owner's word, so it lifts no guard and grants no\npass. The report lists each advisor answer under \"Decided by the advisor\". Test: a fixture\nsession with a question and a running advisor sends to the advisor and does not ask the owner;\na merge question goes to the owner; red on main. Unknown: whether a hook can see that an advisor\nsession is running, or the rule stays in CLAUDE.md only.\n\nOwner's ruling, Oct 22: briefs and plans live in C:\\advisor, a private git repo (advisor-setup/advisor.zip\nholds the starting copy). The advisor commits and pushes each brief there.\nc7 (one question reviewer) hands this advisor the check of each question's premises against\ndecisions/ and recent rulings.\n", "note": "Done, then superseded. Landed in #566 (Oct 23): rule questions-ask-advisor-first and a 'Decided by the advisor' report section (checked at f463787). Your ruling, Oct 26 (c51): the terminal advisor is retired, and questions go to you.", "order": 103.8, "phase": "cleanup", "status": "done", "title": "Sessions ask an outside advisor first; only your calls reach you", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your note, Oct 22: you paste the advisor's answers back into sessions almost word for word. Your ruling, Oct 22: the advisor's value is that it sits outside claude-settings, so the fix must not be a hook or session inside it (that is the old orchestrator model, which never worked as well)."}, "c33": {"ask": "# c33. Sessions in repos with no CI still catch and fix their errors\n\nChecked Oct 22: banchi (6c3a171), q_max (b47bd00) and home-app (956e1ab) have CI workflows.\nhome (3fbb3d1) has none: CLAUDE.md, README.md, records/ (29 Markdown records, a TSV, a JSON) and\ntools/ (deploy-degen.sh, ha-ws.mjs, lan_check.py, lan_check_resolve.py).\n- home's CLAUDE.md grants Claude merges of records-only PRs \"once their checks pass\". With no CI,\n  no check ever runs, so the grant's condition is empty.\n- claude-settings' merge tool (merge/merge.py at 987f682) refuses a repo with no required checks\n  (\"no required checks are named\"), so a session in home cannot use it.\n- Unknown: which errors home sessions actually hit. Owner to name one if it is something else.\n\nAdvisor pick: give home a small CI, not a no-CI mode in the rules. Every rule that assumes CI\n(the merge gate, never merge failing CI, the red-batch flow, c15 and c21 moving checks into CI)\nthen works in home unchanged.\n\nBrief, home session:\n1. Add .github/workflows/check.yml on pull_request, one job \"check\", under 5 minutes:\n   - Markdown links in records/ resolve (reuse claude-settings' actions/readme-links action;\n     do not copy it);\n   - python -m py_compile tools/*.py; node --check tools/ha-ws.mjs; shellcheck tools/*.sh;\n   - every records/*.json parses.\n2. Add .github/stamp.json with merge.requiredChecks [\"check\"] (copy the shape from claude-settings), so the\n   merge tool and the grant both see it. Branch protection on main is optional and needs the owner's login.\n3. Test: a PR with a broken record link goes red, and the same PR fixed goes green.\nReport: the workflow, the red and green run links, and anything the first run flags on main.\n", "note": "Ruling, Oct 26 (shiv, page item 16, a): roll out one visit per repo, after o2's layout move, with c42 first; before each visit, warn you which sessions in that repo to pause. Waits on o2. Checked Oct 22: only home has no CI (banchi, q_max, home-app have workflows). home's merge grant ('once their checks pass') has nothing to check, and the claude-settings merge tool refuses a repo with no required checks. Advisor pick: give home a small CI rather than a no-CI mode in the rules. Unknown: which errors home sessions actually hit. Interacts with c15: moving STE checks to CI removes them from a repo with no CI, which this fixes for home. Oct 25: brief point 2 now names the check in .github/stamp.json merge.requiredChecks (the merge tool reads it first; branch protection is optional), per what c42 found. Not in goal 3: a home session runs it. Placed after c42 (triage, Oct 26): runs in the home repo, by a home session; cleanup work stays ahead of Organize. Due after: o2's claude-settings half, then the roll-out visits in order, c42 first (triage, Oct 27: not a cloud lane today).", "order": 109.7, "phase": "cleanup", "status": "todo", "title": "Sessions in repos with no CI still catch and fix their errors", "updatedAt": "2026-10-27T17:52:00Z", "why": "Your question, Oct 22: sessions in repos with no CI run into errors that need fixing. The rules assume CI: CI is the merge gate (roles-each-layer-proves-once), never merge failing CI, the red-CI drop-and-fix flow (c30), and c15 and c21 move checks from edit time into CI. In a repo without CI, each of those has nothing to read."}, "c34": {"ask": "# c34. The merge tool waits for CI to finish, not for a fixed 30 minutes\n\nChecked claude-settings main at 987f682 and batch branch batch-oct22c (#562).\n\nCause: .github/stamp.json sets merge.deadlineMinutes to 30 (merge/merge.py MERGE_DEFAULTS is 45).\nThe CI jobs' own caps in .github/workflows/gates.yml are longer: one job has timeout-minutes 36\non main, and #562 raises the macOS job to 50. So a green but slow run outlasts the wait, as on\n#562 on Oct 22. actions/stamp/README.md already says to set deadlineMinutes \"to a bit more than\nyour slowest required check\"; nothing checks that it is.\n\nBrief, claude-settings (after #562 merges, or as a lane in the next batch):\n1. Set merge.deadlineMinutes in .github/stamp.json to the largest timeout-minutes of a job in\n   .github/workflows plus 5 (55 once #562 is on main).\n2. Add one check, in the home that already validates stamp.json (find it; extend it, do not add a\n   second): it fails when deadlineMinutes is below the largest job timeout-minutes in the\n   workflows. Test: red on main (30 below 36), green after step 1.\n3. The report-gate timing test that failed once in a full run and passed alone: run it 20 times on\n   main. If it fails, fix the cause (the time it reads, or what it races), never add a retry or\n   a longer sleep. If it never fails, say so and change nothing.\nReport: the files changed, the test red then green, and the 20-run count.\n", "note": "Done. Cause: the merge tool's 30-minute wait was shorter than CI's longest job cap. Your word, Oct 23: keep the job caps (a hung job would hold a batch for 6 hours; macOS minutes cost the most), and the merge wait follows the longest cap plus 5. Built with c39 in one lane, ci-time-caps. Landed in #566 (checked at f463787): merge.deadlineMinutes is 55 in .github/stamp.json, the largest cap (50) plus 5, and a check holds it there.", "order": 111.6, "phase": "cleanup", "status": "done", "title": "The merge tool waits for CI to finish, not for a fixed 30 minutes", "updatedAt": "2026-10-26T05:35:00Z", "why": "Oct 22: the merge tool's 30-minute wait ran out while #562's last Windows job was still running; nothing was red, and the session had to start the wait again. The same day the macOS job cap was raised from 25 to 50 minutes because it kept cancelling the batch's macOS job, and one timing test in the report-gate tests failed once in a full run and passed alone."}, "c35": {"title": "ste-lint's audit step stops importing Python files from the linted repo", "status": "done", "phase": "cleanup", "order": 111.7, "why": "Oct 21 security scan: in scope 'all', a json.py or ste_emit.py committed at a linted repo's root runs as code in the CI job. Confirmed on main at 987f682.", "note": "Filed Oct 22 from the owner's pasted scan finding. Advisor take, Oct 22: real defect, low risk today. claude-settings runs scope 'all' only on a manual dispatch (the nightly run uses scope changed), with contents: read, on its own code; only people who can already push code could plant the file. Whether banchi, q_max or home-app call this action with scope 'all', or from a pull_request_target job: unknown, not checked. Fix is a few lines; good as a small lane in the next batch. Landed in #566 (ste-lint-import-path lane), checked at claude-settings f463787 (main, Oct 25): the summary runs from a script in EMIT_DIR, not python3 -c in the linted repo.", "updatedAt": "2026-10-25T19:45:00Z", "ask": "# c35. ste-lint's audit step stops importing Python files from the linted repo\n\nChecked claude-settings main at 987f682. Source: security scan finding, Oct 21\n(claude.ai/security/findings/find_01GxVuZJgUrxVcwEbj5qLfgn). Confirmed by hand on Python 3.13.\n\nCause: actions/ste-lint/run.sh cds to the linted repo's root (line 9), then in scope 'all' runs\n`python3 -c 'import json, sys; from ste_emit import emit; ...'` (line 131). Under `-c`, Python puts\nthe current directory first on sys.path, ahead of PYTHONPATH and the standard library. A json.py,\njson/ package or ste_emit.py at the linted repo's root runs in place of the real module. The other\nthree python3 calls in run.sh run script files (the linter, HUNK_MAP_PY, SPLIT_PY), so sys.path[0]\nis the script's own folder, not the repo; they are safe.\n\nBrief, claude-settings (small lane, next batch):\n1. Move the line-131 summary into a script file written next to ste_emit.py in $EMIT_DIR, the same\n   way HUNK_MAP_PY and SPLIT_PY already work, and run it with `python3 \"$EMIT_DIR/summary.py\" ...`.\n   Do not use `-I` (it drops PYTHONPATH, so ste_emit stops loading) or `-P` (needs 3.11+).\n2. Add a case to actions/ste-lint/test_action.py: fixture repos with json.py, or json/__init__.py, plus ste_emit.py at the root, each\n   writing a marker file, plus one .md file. Run with SCOPE=all and SCOPE=changed. Pass: no marker\n   file, and the summary table and annotations still appear. Show it red on main, green after 1.\n3. Add one sentence to action.yml's scope description: the action runs no code from the linted tree.\nReport: files changed, the test red then green.\n"}, "c36": {"title": "Local sessions pick up merged settings on their own", "phase": "cleanup", "status": "done", "order": 111.8, "why": "Oct 22: the owner's Mac ran claude-settings 174 commits behind origin/main, so Mac sessions used old rules and hooks, and nothing showed it.", "note": "Filed Oct 23 from a prompt the Mac session wrote. Checked at 1842e56: the SessionStart hook tests for a .git folder, but the live copy is a worktree (its .git is a file), so the pull never runs; a pull could not work there anyway (detached HEAD); install.sh reinstalls whatever local main holds; output goes to /dev/null. Advisor ruling, Oct 23 (goal-2 session asked): the old line 'if main is checked out anywhere, skip' would skip on every normal clone, so the hook fast-forwards whichever tree holds main when it is on main with no tracked changes (as merge.py and launch.py already do), else leaves it and logs one line; the pin still follows local main. Windows has the same fault (MINGW branch runs nothing) and this lane fixes it too, per the brief. Measured Oct 23: Windows clone on main with 2 untracked stray files and no tracked change, 0 behind; pin at 1842e56 = origin/main. Brief: batch 2 of briefs/cleanup-goal-2-oct23.md (full text on c37). Landed in #568 (batch-oct23c, Oct 23), checked at claude-settings f463787 (main, Oct 25): the SessionStart hook finds the clone from the pin, fast-forwards local main (or the tree that holds it, when clean), then runs merge/install_from_main.sh; Windows fixed too. Not checked: whether your Mac and Windows pins now match main after a session start; check with git -C <pin> rev-parse HEAD.", "ask": "See c37 (goal 2), batch 2.", "updatedAt": "2026-10-25T19:45:00Z"}, "c37": {"ask": "Goal 3 brief (briefs/cleanup-goal-3-oct25.md); its batch 2 carries this step's parts 2 and 3. Goal 2's text stays in briefs/cleanup-goal-2-oct23.md.\n\n# Goal 3: close the cleanup phase of claude-settings\n\nPaste this whole file to one fresh claude-settings session with `/goal finish this end to end`.\nWritten by the advisor, Oct 25, against main f463787 (#572). Goal 2 (briefs/cleanup-goal-2-oct23.md)\nis done except its two Mac batches; this goal finishes those and the last cleanup steps. Each batch\nis its own integration PR, under the usual rules (git-integration-branch-merge,\nroles-review-cap-three).\n\n## 0. First, before any work\n\n1. Save this file as `~/.claude/handoffs/goal-cleanup-3.md`. Put that path on the Goal line of\n   your handoff. After every compaction, read it again before you act.\n2. Check each \"checked at\" fact against current main. A fact that no longer holds: re-plan that\n   lane and say so in the report. A lane whose work is already on main: skip it, say so.\n3. Open PRs at writing time: #571 (bin/ios-ship, one shared tool to ship iOS apps) and the guard\n   cull lane (branch guard-cull-gh-api: delete gh-api-method, owner's word Oct 25, typed as the\n   override for the hole review round 1 found). The owner said both are merging. Confirm with\n   `gh pr list --state open`; take over any that are not merged and drive them to green.\n4. Confirm the live settings match main on this machine: `git -C <pin> rev-parse HEAD` against\n   `git rev-parse origin/main`, read right after this session started. Equal: the session-start\n   auto-pull (#568) works here; say so. Behind: say so with both commits, then reinstall with\n   `bash merge/install_from_main.sh` from the clone, and treat the auto-pull as a red finding for\n   batch 1.\n\n## Pace (from goal 2, unchanged)\n\nNo fixed lane cap: start every ready lane that touches no other open lane's files; the load brake\ndecides. Never idle: while CI runs, build the next batch's lanes as drafts. Questions go to the\nadvisor first (rule questions-ask-advisor-first); only the owner's calls wait for the owner, and an\nunanswered question parks only its item. At each batch merge, report four numbers from git and\nGitHub (no new log): wall-clock from first lane commit to merge; lanes run and the most at once;\nminutes with no lane running and why; brake refusals with their readings.\n\n## Handoff rules\n\nAs in goal 2: the handoff holds Goal, State (each open lane and PR with its plain name, branch, last\nCI head and verdict), owner rulings with their record, open questions and what you do meanwhile,\nthe next action, and working premises with sources. Update it on events. After a compaction: this\nfile, then the handoff, then `git fetch` and `gh pr list --state open`. Trust GitHub over the\nhandoff.\n\n## Stop points (the only places you wait for the owner)\n\n- Batch 3, part 1: whether to add an alert at all, after the first check below.\n- Batch 4: the kill guard needs the owner's Mac. On Windows, park it and say so.\nMerges run under decision standing-merge-grant.\n\n## Batch 1. Agents stop their watchers before they report (c43)\n\nFull brief: briefs/c43-agents-stop-their-watchers.md in the advisor repo (owner pastes it, or read\nthe copy in step c43's Ask). Short form: the defect is verified (a subagent that leaves a Monitor\nor a background Bash running after its report wakes once per task end, and the parent gets a new\nnotification each time; advisor probe, Oct 25: 3 notifications from one agent). Lane 1: one\nsentence in each agent file: before the final report, stop every Monitor and background task you\nstarted with TaskStop, and start none after it. Lane 2: extend judge_stop in hooks/guard.py (it\nalready runs on SubagentStop) to read the agent's transcript and block the stop once while a task\nit started is live; never block twice; fail open. Red then green, then one live run.\n\n## Batch 2. A goal run shows its pace, and no brief caps lanes by guess (c37, parts 2 and 3)\n\nGoal 2 used both; neither is in claude-settings yet (checked at f463787).\n1. One rule, in its one home (find it: the orchestrator's roles or parallelism rules in CLAUDE.md,\n   or the skill that plans batches; extend it, add no second home): a brief or plan never caps\n   lanes by a guessed number; the load brake decides when the machine is too loaded.\n2. The batch report rule (reports-order-of-labels and its home) gains the four pace numbers above,\n   read from git and GitHub at report time. No new log, no watcher, no timer.\n3. If a lint already checks report or rule format, extend it so a brief that writes \"one or two at\n   a time\" or \"at most N lanes\" is flagged; otherwise prose only, and say so.\nProof: the rule text lands with its rule anchor; any lint case is red then green.\n\n## Batch 3. A question waiting on the owner reaches the owner (c31)\n\n1. First check, before any code: does the Claude desktop app already alert the owner (a desktop or\n   phone notification) when a session stops on a question? Read the Claude Code docs for the\n   Notification hook and the desktop app's own notifications, and test it once on this machine.\n   Report what fires. Stop point: bring the owner one question: (a) the app already alerts, close\n   c31 with no code (pick, if true); (b) add a Notification hook that sends one desktop alert,\n   costing nothing per tool call; (c) also a phone push, with the channel named.\n2. The question rule already says a session keeps working on what does not depend on the answer\n   (questions-ask-advisor-first). Check it also says the question names what the session does\n   meanwhile; if not, add those words in place.\n\n## Batch 4. Kill guard knows a lane's left-behind server (c27). Mac only.\n\nFull brief: briefs/c27-kill-guard-session-tag.md in the advisor repo (step c27's Ask). Its first\ncheck runs on the Mac before any code and stops the batch if the session tag is not in the\nserver's environment. On Windows, park it and say so.\n\n## Batch 5. Delete the two STE stub scripts (debt ste-stubs-delete)\n\nlint/ste_gate.py and lint/md_sweep.py exit 0 and exist only for old installs whose settings.json\nstill calls them. Check the install log on this machine and ask the owner for the other machine's\npin commit: every install at or past #566 (batch-oct23a, where the STE hooks left settings.json)\nmeans delete both files, their stub cases in lint/test_settings_matcher.py, and the debt. Any\ninstall older, or unknown: keep them and say why.\n\n## Not in this goal\n\n- c33 (home gets a small CI) and c42 (home-app names its merge checks): each is a short session in\n  its own repo, from its own brief in the advisor repo.\n- c41 (Opus for one session without lifting other guards): owner's word, Oct 25, brief it later.\n- c40 (idle desktop sessions burn a core each): the owner's action in the app.\n\n## When the goal is done\n\nReport per the report rules, plus the four pace numbers per batch and in total. List anything\nparked and why. Then the advisor re-measures the cull numbers and reviews the roadmap for the move\nto the Organize phase, which starts with o2 (one layout for every repo; its brief and plan are in\nthe advisor repo).\n", "note": "Done. Causes, Oct 23: a brief capped lanes by guess; the brake misread load; a remedy named a mode this app lacks. Fixes landed: the brake reads memory and disk (c14); rules parallelism-no-guessed-lane-cap and reports-batch-pace-numbers (#576, checked at 149f4bc). Not built: a lint for guessed lane caps (prose only). Pace: goal 1 ran 6 batches over about 2 days, mostly lost to idle gaps; goal 2 merged about 7 PRs in under 7 hours (Oct 23); goal 3's batches 1, 2 and 5 ran three lanes at once in 75 minutes (Oct 25). Your word, Oct 23: an unanswered question parks only its item. Goal 3 closed Oct 26 (owner). Left over: c43 lane 2, c27 (Mac session), c44 (build advisor).", "order": 103.95, "phase": "cleanup", "status": "done", "title": "A goal run paces itself on measured load and shows its pace", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your gripe, Oct 22: goal 1 did decent work but measured compute badly and ran slowly."}, "c38": {"title": "Tests clean up their temp folders, in every repo", "phase": "cleanup", "status": "done", "order": 111.9, "why": "Oct 22: Degen's Swift tests left temp folders that filled the Mac disk (note from the Degen session).", "note": "Pattern from Degen (branch temp-dir-leak): one temp root per repo; a <pid>-<UUID> run folder; every helper takes its folder from it; teardown removes it; the first request of a run removes sibling run folders older than a day (crashed runs) and keeps newer ones (parallel runs); a test proves the sweep. claude-settings has no such rule; the nearest home is the janitor (debt windows-temp-sweep, ruled Oct 16, never built: session temp folders, 17 GB on Windows). Rule only; each repo keeps its own helper, no copying code across repos. Both are lanes in batch 3 of briefs/cleanup-goal-2-oct23.md (full text on c37). Ties to the brake: disk filling up is what full guards. claude-settings part landed in #567 (batch-oct23b, Oct 23), checked at claude-settings f463787 (main, Oct 25): the run-folder standard is in agents/test-author.md, and the janitor removes idle session temp folders on Windows (debt windows-temp-sweep built). Each repo's own helper (Degen's TempDirSupport.swift) stays with that repo; not checked here.", "ask": "See c37 (goal 2), batch 3, lanes test-temp-standard and windows-temp-sweep.", "updatedAt": "2026-10-25T19:45:00Z"}, "c39": {"ask": "See c37 (goal 2), batch 3, lane ci-time-caps.", "note": "Done. Your word, Oct 23. Landed in #566 (checked at f463787): skill ci-hygiene sets a 60-minute cap on a job with fewer than 5 green runs; the merge tool warns at 70% of a cap; a timeout with every step green gets its own verdict, re-cap or split. #570 (Oct 24) set the Windows rest job to 38 minutes from 5 green runs. Not checked: whether the timing test passed its 20 runs under load.", "order": 111.65, "phase": "cleanup", "status": "done", "title": "CI time caps start generous and warn before they fire", "updatedAt": "2026-10-26T05:30:00Z", "why": "Your gripe, Oct 23: CI that is new, or that just gained tests, keeps timing out and failing."}, "c4": {"note": "Done Oct 20: 28 remote heads left in claude-settings, main included (244 on Oct 17). Merges now delete the lane branches a batch absorbed (decision merge-deletes-batch-lanes, merge/merge.py cut_branch). Left over: branch batch-map, deleted in the next batch. q_max (1,017 heads) belongs to Roll out. Oct 26 at 149f4bc5: 34 remote heads; 7 old lane branches already merged into main remain (remove-ste-hooks, question-reviewer-hook, advisor-asks-first, planner-checks-premises, premise-handoff-section, rule-guard-grows, mem-monitor-tool-tests), so the merge cut misses some lanes (likely the ff and squash lane debts; cause unchecked). One-line delete by you or a lane in c46.", "order": 40, "phase": "cleanup", "status": "done", "title": "Delete merged remote branches", "updatedAt": "2026-10-26T02:58:00Z", "why": "188 of 244 remote branches in claude-settings are already merged. q_max has 1,017 remote heads. Then have each merge cut the lane branches its batch absorbed."}, "c40": {"title": "Idle desktop sessions each burn a full CPU core", "phase": "cleanup", "status": "done", "order": 109.9, "why": "Session question, Oct 23 (goal 2 pace): the machine sat at 90-100% CPU with no work running, and the brake held every lane. Same pattern as the 15 spinning claude.exe workers of Oct 19 (c14).", "note": "Checked by you, Oct 26 (waiting page): \"all of them are all pinned and not in use even after restarting computers etc it lags so much\". The spin survives restarts, so it points to a Claude Desktop bug, not claude-settings. Remaining: report it to Anthropic with the versions below (a session can draft the report on your word). Measured by the advisor, Oct 23 02:30 CDT, read-only: 37 claude.exe processes; 17 use about 1.0-1.1 cores each over 5 s (19 of 24 cores, CPU 93%, memory 72% of 63.5 GB). All 17 are Claude Desktop 3.1623.0.0 children running claude-code 2.1.304 with --resume, children conhost only (one also keeps a bash wait loop from Oct 22 12:35 polling a temp file). Why they spin: unknown. Not fixable in claude-settings; the brake already reads it right. Open for you: (1) archive or stop the idle sessions in the app (frees about 17 cores; loses their in-memory state, transcripts stay); (3) whether claude-settings should add a read-only 'idle sessions burning CPU' line to the health view, so you see it without a session asking. Owner, Oct 26: advisors leave this step alone; the owner handles idle desktop sessions. Ruling, Oct 27 23:48 CDT (shiv, waiting page item 11, c): leave it with you; no report, no health line; the step closes. Placed last in Cleanup (triage, Oct 26): yours to handle, no advisor work.", "ask": "Owner action, no brief yet: archive or stop the idle Claude Desktop sessions listed in the note, then report the spin upstream (Claude Desktop 3.1623.0.0, claude-code 2.1.304, Windows 11 26200). A health-view line is a later lane only if you want it.", "updatedAt": "2026-10-28T04:55:00Z"}, "c41": {"title": "Opus for one session or one run, without lifting other guards", "phase": "cleanup", "status": "done", "order": 109.4, "why": "Your question, Oct 25: can override say 'Opus builders for this part of the plan or this session'? Today it cannot without lifting every other guard too.", "note": "Ruling, Oct 26 (shiv, page item 14, a): build the Opus-only pass word. Merged to main Oct 26 in batch PR #629 (main be4b30e), from lane PR #623. What it does: you type `opus 2h` or `opus 15m` as the whole prompt. Opus spawns then go through without the ask for this session and its subagents until the pass ends. `opus builders 2h` does the same for one role only, and `opus off` ends the pass. Every other guard still applies, including the ask on a settings write that raises the model. The unit is required, because `opus 4` could be a model name. guard.log records each grant, lift and end. Decision owner-override-pass holds the rules. Ready for triage to close.", "ask": "# c41: an Opus-only pass word, for one session and a time\n\nCloud build thread brief. Build advisor (3), Oct 26, against claude-settings main 3b96ce8.\nBase: main 3b96ce8; never rebase onto main after review. Push roadmap edits to the branch only;\nonly \"Triage the roadmap (3)\" republishes the roadmap page.\n\n## Ruling\n\nshiv, Oct 26 (waiting page item 14, option a): build the Opus-only pass word.\n\n## Task\n\nExtend the override pass's one home, hooks/override_pass.py (decision owner-override-pass), with\na second prompt word that lifts only the guard rule subagent-model-cap's asks for this session and\nits subagents until it expires. Shape (advisor pick, Oct 25): `opus 2h`, `opus 15m`, and optionally\none role, `opus builders 2h`. `opus off` ends it. Same parsing discipline as `override`: only the\nwhole prompt grants; anything ambiguous grants nothing.\n\n1. Red first: tests that an Opus spawn outside Plan, Explore and a builder's try 3 still asks\n   with no pass, and asks today even after `opus 2h` (the word is unknown).\n2. Green: with `opus 2h`, that spawn passes; every other refusal and ask in the guard stands\n   (prove with at least three other rules); the pass expires on time; a subagent's call honours\n   it; a session cannot grant it to itself (state/ stays frozen to Claude's writes).\n3. The role form, if built: `opus builders 2h` lifts only builder spawns. If it costs more than\n   it buys, leave it out and say why.\n4. Record: rewrite decision owner-override-pass in place (or add a slug entry if it is a new\n   question), and one CLAUDE.md touch where rule roles-sonnet-is-the-ceiling names how the owner\n   raises Opus. guard.log logs each grant and each lift.\n\n## Fences\n\n- One home: hooks/override_pass.py and the subagent-model-cap rule's own code. No second pass\n  file format unless the existing one cannot hold a scope; say which.\n- c70 (#617) is changing guard refusal messages; keep clear of message text.\n\n## Failure classes and proof\n\n- Changes a guard's verdict: review rounds per roles-review-cap-three, fresh Sonnet reviewer from\n  round 1, the net-value test after round 3 if reached.\n- Run the guard suite and hooks/mutate_guard.py through `verdict`; add a mutant for the new scope\n  check and show it killed.\n\n## Report\n\nAdd one line, \"Port to other repos: yes or no, and why\" (shiv's ruling on c52, Oct 26). Cap 20\nlines: Done, Deviations, Next. Send the green, reviewed head and branch to \"Advise the\nclaude-settings build (3)\". Do not merge, and do not rebase onto main. No question for shiv:\npark any in the PR body.\n", "updatedAt": "2026-10-26T18:25:00Z"}, "c42": {"title": "home-app: the merge tool finds its checks, and a skipped draft run is restarted the right way", "phase": "cleanup", "status": "todo", "order": 109.5, "why": "home-app session report, Oct 25 (PR 271): the PR's own checks had skipped, so it pushed an empty commit (345ff43) to start a run; and the merge tool stopped because home-app's main has no branch protection, so it found no required checks.", "note": "Ruling, Oct 26 (shiv, page item 16, a): roll out one visit per repo, after o2's layout move, with c42 first; before each visit, warn you which sessions in that repo to pause. c42 is the first visit; it waits on o2. Checked Oct 25 (claude-settings f463787, home-app 65315da). Cause 1: home-app test.yml skips the scope job, and so every job, on a draft PR (home-app rule: drafts run no CI). The manual workflow_dispatch run that passed does not count as the PR's checks. Marking the PR ready (ready_for_review is a trigger) starts a real run on the same head, with no new commit. Cause 2: merge.py reads required checks from .github/stamp.json merge.requiredChecks first and only falls back to branch protection; home-app has no stamp.json. The tool's own stop message names the fix. Advisor pick: fix in home-app (stamp.json plus one CLAUDE.md line); branch protection on home-app main is optional and needs your login. Same fix fits banchi and q_max if they lack stamp.json (not checked). Related: c33 (home has no CI at all). Placed after the Mac steps (triage, Oct 26): the fix lands in home-app, so it needs a check-in with you first. Due after: o2's claude-settings half, then the roll-out visits in order, c42 first (triage, Oct 27: not a cloud lane today).", "ask": "Brief for a home-app session (paste all of it):\n\nGoal: the claude-settings merge tool runs in home-app, and a PR whose draft run skipped gets a real run without an empty commit.\n1. Add .github/stamp.json with merge.requiredChecks naming the jobs in .github/workflows/test.yml: scope, test, addon, ios. Copy the shape from claude-settings .github/stamp.json. Set merge.deadlineMinutes to the largest job timeout-minutes plus 5. The merge tool already passes a skipped job, and goes red only when no job ran on the head (merge/merge.py judge_runs).\n2. Proof: run the merge tool's dry read on an open PR (or the next one) and show it lists the four checks instead of stopping on \"no branch protection\".\n3. Add one line to home-app CLAUDE.md's CI rule: when a PR's run skipped because it was a draft, mark it ready (gh pr ready), which starts the PR run on the same head; never push an empty commit to start CI.\nReport: Done, Deviations, Input Needed, Next.", "updatedAt": "2026-10-27T17:55:00Z"}, "c43": {"ask": "Brief, copied from briefs/c43-watcher-debt-file.md and kept in step with it. Send to a cloud build thread.\n\n# c43 remainder: file the dropped-lane debt\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b. Solo, records only.\n\nLane 2 of c43 (a SubagentStop check that blocks an agent reporting with a live watcher) was dropped\nby shiv on Oct 26: its try blocked 248 of 1,787 real stops by mistake. Its code sits on branch\nstop-blocks-live-tasks (b8feeb52). Lane 1 landed in #574 (agents stop their watchers before they\nreport).\n\nTask: write one debt in claude-settings debts/, in the store's own format (read debts/README.md and\ntwo existing debts first). Slug: agent-reports-with-live-watcher. Content: the gap (no check stops an\nagent that reports with a live watcher), the dropped try and its false-block count, the branch, and\nthe Retire line: reopen as a check only if leftover watchers keep waking parents. Point it to\ndecision agents-stop-their-watchers if one exists (git grep). Update any index the store keeps\n(docs/records.md is rebuilt at merge; do not hand-edit it unless the store says so).\n\nBase: main. One commit, PR stops at green; merge waits for c53 or shiv's merge.py run.\nReport: 10 lines max, with the PR.\n", "note": "Done. Lane 1 landed in #574 (agents stop their watchers before they report): each agent file tells agents to stop their tasks before they report. Lane 2, a SubagentStop check, dropped by your word, Oct 26: its try blocked 248 of 1,787 real stops by mistake; it sits on branch stop-blocks-live-tasks (b8feeb5). The gap is now debt agent-reports-with-live-watcher in claude-settings, landed on main from #583 (record the dropped stop-guard as a debt; checked at e5525a6). Reopen as a check only if leftover watchers keep waking parents. Closed by triage, Oct 26.", "order": 103.92, "phase": "cleanup", "status": "done", "title": "Agents stop their watchers before they report", "updatedAt": "2026-10-26T08:10:00Z", "why": "Degen orchestrator, Oct 25: a reviewer woke 4 times after its final report, each time on a watcher that expired on a build long finished; each wake is a fresh notification to the parent."}, "c44": {"title": "Merged work leaves no worktrees or branches behind, and a wrapping session offers the fast cleanup", "phase": "cleanup", "status": "active", "order": 103.7, "why": "Your idea, Oct 25: when a session thinks its work is wrapped, it should offer you a faster worktree cleanup than the scheduled ones.", "note": "Built in the cloud, Oct 26. All four lanes merged (#590, #594, #602): the sweep frees its own session's idle agent lock; reports offer `sweep.py --attended --fast` after the last merge; a merge removes the merged branch's clean worktree and local branch, and each lane's local branch and worktree. Finding: #586's \"moved or gone\" for every lane was GitHub's delete_branch_on_merge deleting the remote heads first. Nothing was lost. All four lanes are on main 0b39053. Ruling, Oct 26 (shiv, page item 6, a): a mid-session sweep frees its own session's locks; keep as built. Accepted trade-offs are in debts/notes.md (own-lock-*, merge-tree-*, lane-local-*). Still open: debt finished-agent-shells-keep-tree. Local confirm on shiv's machines after merge. Placed ahead of c47 (triage, Oct 26): only its local confirm remains. Open, from c53 (cloud lane, Oct 26): the cloud cannot delete a branch, so after a cloud merge each lane's remote branch stays on GitHub (GitHub's delete-on-merge removes only the batch PR's head; lane PRs close as replaced). Fix to plan here: the Mac merge hand or a Mac sweep deletes remote lane branches already contained in main; that is lossless, so no archive and no question (rule shared-trees-archive-then-delete). 53 remote heads on Oct 26. Confirmed Oct 27: the first cloud merge (#649) left all seven lane branches. Waits on: a local session for the remote lane-branch cleanup; merge.py's branch delete failed from the cloud again Oct 27 (build advisor 9).", "ask": "Cloud brief, copied from briefs/c44-cloud.md; send to a cloud build thread.\n\n# c44 in the cloud: merged work leaves no worktrees behind\n\nCloud build thread brief. Build advisor, Oct 26, against claude-settings main 3f71d6b. Full step text:\nbriefs/c44-merged-work-cleans-up.md (lanes 1 to 3, first check, proof). Its \"paste into a Windows\nsession\" line no longer applies: build in the cloud, prove with fixture tests; shiv confirms on his\nmachines after merge.\n\n## Order and bases\n\n- Lanes 2 and 3 first (janitor/sweep.py lock rule; one sentence in the reports rule's home).\n  Base: main.\n- Lane 1 (merge/merge.py cleans its own worktree) edits merge.py, as do PR #577 (the pilot) and the\n  c53 thread (merge.py on REST). Build lane 1 last, stacked on the c53 branch once it is pushed\n  (ask the build advisor for its name), and say so in the PR body. If c53 has not pushed when lanes\n  2 and 3 are done, open the PR with lanes 2 and 3 only and report lane 1 as waiting.\n\n## First check\n\nAs the full brief says: if \"the merge tool never removes worktrees\" has a recorded reason, send it\nto the build advisor before building lane 1.\n\n## Roles\n\nOrchestrate: test-author, builder, fresh reviewer (it changes what a deletion tool removes). PR stops\nat green. Report: 25 lines max, Done, Deviations, Input Needed, Next.\n\n\n---\nEarlier brief kept for reference:\n\n# c44. Merged work leaves no worktrees or branches behind\n\nPaste this whole file into a claude-settings session (Windows; the Mac holds main only). Written by\nthe advisor, Oct 26, against main f463787. Owner agreed Oct 25.\n\n## Why\n\nMac session, Oct 25: after the ios-ship and guard-cull PRs merged, their worktrees and local\nbranches stayed. The merge tool deletes the remote branch, keeps a local branch a worktree has\nchecked out, and never removes worktrees. The Agent tool locks a builder's worktree with the host\nsession's pid, and the sweep frees such a lock only when that pid is dead, so a merged tree waits\nfor the session to end. Cleaning by hand cost several guard refusals and left a throwaway branch\nthe owner had to delete.\n\n## First check\n\nRead decisions when-a-worktree-may-be-removed and the-janitor-is-one-machine-wide-sweep, and the\nmerge tool's docstring. If \"the merge tool never removes worktrees\" has a recorded reason, bring it\nto the advisor with this brief's lanes before building (rule outcomes-stale-decision-protocol).\n\n## Lane 1, the merge tool cleans its own branch\n\nAfter a merge succeeds, the merge tool removes the merged branch's worktree when it is clean and its\nHEAD is in the default branch, by calling the sweep's existing --fast removal for that one tree (one\nhome; no second removal path). Then it deletes the local branch, as it does today when no worktree\nholds it. A dirty tree, an unmerged HEAD, the caller's own cwd, or any unread fact keeps the tree and\nprints one line saying why.\n\n## Lane 2, the sweep frees the caller's own lock on a finished agent's tree\n\nThe sweep may free an Agent-tool lock whose pid is the calling session's own process, only when the\ntree is clean, its HEAD is in the default branch, and no live process stands in it. Every other lock\nstays as today.\n\n## Lane 3, the offer\n\nOne sentence in the reports rule's home: when a session's last PR has merged and no lane is open, its\nfinal report offers `python3 ~/.claude/janitor/sweep.py --root <repo> --attended --fast` (preview, then\n--confirm) as one command, unless lanes 1 and 2 left nothing to remove.\n\n## Proof\n\ntest-author, red on main: a merged clean worktree survives a merge today and is gone after lane 1;\na dirty one and an unmerged one stay; a tree locked by the caller's own pid, clean and merged, is\nfreed by lane 2, and one locked by another live pid stays. Builder makes them green. A reviewer reads\nthe diff (it changes what a deletion tool removes). Usual merge rules.\n", "updatedAt": "2026-10-27T16:55:00Z"}, "c45": {"ask": "# c45, a step handed to you names the check that proved the session can't do it\n\nRepo: claude-settings. Checked at 149f4bc (main, Oct 25 19:16 CDT).\n\nIncident, Oct 25 (ios-adblock): the session's report listed \"delete the two test App IDs on developer.apple.com\" under Input Needed. It never checked its tools. The App Store Connect key that created the IDs was on the Mac and could delete them. When asked, it then said the step \"needs your login\", also unchecked. The owner had to point it out twice. Rule output-never-hand-off-doable-step (do a step yourself before you hand it to me) already says to search first and name the reason, but nothing checks the doability half: the reply judge (hooks/reply_judge.py) only checks the code-block form, and only on 1 Stop in 5.\n\nTask, two parts, one lane:\n\n1. Amend output-never-hand-off-doable-step in output-styles/shiv-stylisms.md, in place, no new rule. Add:\n   - Each step handed to the owner names its reason (decision, login, or an act the safety rules keep for the owner) and the check that shows the session cannot do it, in a few words, such as \"no API key for Apple in env or keychain\". With no check run, the step is not the owner's yet: run the check first.\n   - Access that made a thing can remove it. A thing the session made, it cleans up itself.\n   - \"Can't\" and \"shouldn't\" differ. A step the session can do but that cannot be undone is not handed over as steps: the session asks one yes or no on the exact act, and does it on the yes.\n   - A plan that makes throwaway things (test IDs, test branches, test data) names their cleanup in the same ask, so the owner's yes covers both (outcomes-word-covers-named-act, my word covers the act it names).\n2. Extend hoo
